- id: quasitopos_consequence
  assumptions:
    - quasitopos
  conclusions:
    - effective cocongruences
  proof: >-
    Suppose $p : X+X' \rightrightarrows E$ is a cocongruence, with coreflexivity morphism $r : E \to X$ and cotransitivity morphism $t : E \to E +_X E'$. (Here $X'$ is an isomorphic copy of $X$; $E'$ is an isomorphic copy of $E$; and $E +_X E'$ is the coproduct modulo the relations $p(x') = p(x)'$, i.e. it is equivalent to the pushout of $E \xleftarrow{p\circ i_2} X \xrightarrow{p\circ i_1} E$.) Now by <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, ???, the quasitopos is equivalent to a comma category $H \mathop{\downarrow} F$ where $H$ is the poset category of a Heyting algebra, and $F : H \to S$ is a functor from $H$ to a solid quasitopos $S$ (meaning a quasitopos in which $! : 0 \to 1$ is a regular monomorphism). However, since we have morphisms $X \to E$ and $E \to X$, we see that the $H$-components of $X$ and $E$ are isomorphic, and similarly for $E +_X E'$. Therefore, we may work in the full subcategory with constant $H$-component $X_H = E_H$; this is equivalent to the slice category $S / F(X_H)$ which is again a solid quasitopos. This shows that without loss of generality, we may assume the original quasitopos is solid; and therefore, by <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, ???, the quasitopos has disjoint coproducts and is therefore extensive. However, in that subcategory, <a href="/category-implication/regular_extensive_consequences">this result</a> applies to show that $E$ is an effective cocongruence; and since the inclusion functor into the original quasitopos preserves inhabited limits and inhabited colimits, we see that $E$ is effective in the original quasitopos as well.
  is_equivalence: false

