- id: Giraud_for_quasitopos
  assumptions:
    - Grothendieck quasitopos
  conclusions:
    - quasitopos
    - locally presentable
  proof: See <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, C2.2.13, which proves that a category is a Grothendieck quasitopos if and only if it is a locally essentially small, cocomplete quasitopos with a small strong generating set, which in turn is equivalent to the category being locally presentable and locally cartesian closed, such that all regular congruences are effective. (Note that Johnstone uses "small generating set" in the statement, but Johnstone's definition of "generating set" matches what would usually be called a "strong generating set", or "extremal generating set" in the terminology of nLab.) This is sufficient to establish the forward implication. For the reverse implication, note that any locally presentable category is locally essentially small and cocomplete; and it has a small strong generating set by <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a>, Theorem 1.20 in Chapter 1.
  is_equivalence: true

- id: Malcev_quasitopos_is_thin
  assumptions:
    - regular subobject classifier
    - Malcev
  conclusions:
    - thin
  proof: 'By a proof similar to <a href="/category-implication/subobject_classifier_disallows_malcev">this</a> we conclude that every regular monomorphism is an isomorphism. Applying this to the equalizer of any parallel pair $f, g : X \rightrightarrows Y$, we conclude that $f = g$.'
  is_equivalence: false

- id: Grothendieck_quasitopos_consequences
  assumptions:
    - Grothendieck quasitopos
  conclusions:
    - exact filtered colimits
    - cogenerator
  proof: >-
    To show that a Grothendieck quasitopos has exact filtered colimits, note that $\BiSep(\C, J, K)$ is a reflective subcategory of $\Sh(\C, J)$, with the reflector preserving finite limits. (This is a special case of the more general situation of $\Sep(j)$ being a reflective subcategory of $\T$ whenever $j$ is a Lawvere-Tierney topology on an elementary topos $\T$ with the reflector preserving finite limits.) The result follows from Lemma 3 <a href="/content/subcategories">here</a>.

    As for having a cogenerator: we have that $\Sh(\C, K)$ is a reflective subcategory of $\BiSep(\C, J, K)$, with the reflector being the restriction of the $K$-sheafification functor to the subcategory $\BiSep(\C, J, K)$. Also, recall in general that if $\F$ is a presheaf on $\C$, then the morphism $\F \to \F^+_K$ has $K$-dense presheaf image, and if $\F$ is $K$-separated then the morphism $\F \to \F^+_K$ is a monomorphism. Thus, for $\F$ an object of $\BiSep(\C, J, K)$, the morphism $\eta_\F : \F \to \F^+_K$ is both a monomorphism and an epimorphism in $\BiSep(\C, J, K)$. Now, let $Q$ be a cogenerator of the Grothendieck topos $\Sh(\C, K)$, and suppose we have a parallel pair of morphisms $f, g : \F \rightrightarrows \G$ in $\BiSep(\C, J, K)$ such that $f \ne g$. Then since $\eta_\G : \G \to \G^+_K$ is a monomorphism, we have $f^+ \ne g^+$. Therefore, there exists $h : \G^+_K \to Q$ such that $h \circ f^+_K \ne h \circ g^+_K$. Since $\eta_\F$ is an epimorphism, we conclude $h \circ f^+_K \circ \eta_\F \ne h \circ g^+_K \circ \eta_G$, and thus $h \circ \eta_\G \circ f \ne h \circ \eta_\G \circ g$.

    $$\begin{CD}
    \F @> f > g > \G \\
    @V \eta_\F VV @V \eta_\G VV \\
    \F^+_K @> f^+_K > g^+_K > \G^+_K @> h >> Q
    \end{CD}$$
  is_equivalence: false
