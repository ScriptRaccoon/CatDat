- id: topos_no_stable_epis
  assumptions:
    - quasitopos
    - cofiltered-limit-stable epimorphisms
    - countable coproducts
  conclusions:
    - thin
  proof: >-
    Let $N \coloneqq \coprod_{m \in \IN} 1$ and consider for every $n \in \IN$ the subobject $N_{\geq n} = \coprod_{m \geq n} 1$ of $N$. For $n \leq n'$ we have $N_{\geq n'} \subseteq N_{\geq n}$. Now let $\bar 0$ be the coimage of the unique morphism $0 \to 1$, so that we get a factorization $0 \twoheadrightarrow \bar 0 \hookrightarrow 1$ where $0 \twoheadrightarrow \bar 0$ is an epimorphism and $\bar 0 \to 1$ is a regular monomorphism. Then since $\bar 0$ is a quotient of $0$, the coslice over $\bar 0$ is equivalent to a full subcategory. Moreover, the coslice is again a quasitopos with countable coproducts, and the inclusion functor preserves and reflects limits and inhabited colimits. In fact, this coslice is also a solid quasitopos (meaning exactly that the unique morphism from its initial object $\bar 0$ to its terminal object $1$ is a regular monomorphism), which implies that it has disjoint finite coproducts by <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, ???. Since the coslice is locally cartesian closed, we conclude that it is countably extensive. Also, each $N_{\geq n}$ is in the coslice. From this, we can conclude that $\lim_n N_{\geq n} \simeq \bar 0$ in the coslice, and therefore also in the original quasitopos.

    There is a (unique, split) epimorphism $N_{\geq n} \to 1$ for every $n$. By assumption, their limit $\lim_n N_{\geq n} \to 1$ is also an epimorphism. Thus, $0 \to 1$ is an epimorphism. It follows that for any parallel pair $f, g : X \rightrightarrows Y$, the corresponding morphisms $1 \rightrightarrows [X, Y]$ are equal, so that $f = g$.
  is_equivalence: false

