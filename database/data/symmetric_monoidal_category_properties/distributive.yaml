id: distributive
relation: is
description: 'A symmetric monoidal category is called <i>distributive</i> when its underlying category has finite coproducts and, for every object $A$, the endofunctor $A \otimes -$ preserves finite coproducts. There should be no confusion with the closely related notion of a <a href="/category-property/distributive">distributive category</a> as long as we distinguish carefully between a symmetric monoidal category and its underlying category.'
nlab_link: https://ncatlab.org/nlab/show/distributive+monoidal+category
invariant_under_equivalences: true
dual: codistributive
