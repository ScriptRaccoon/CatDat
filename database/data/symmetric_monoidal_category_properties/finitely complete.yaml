id: finitely complete
relation: is
description: 'A symmetric monoidal category is called <i>finitely complete</i> when its underlying category is finitely complete and, for every object $A$, the endofunctor $A \otimes -$ preserves finite limits (that is, it is left exact). Of course, then the endofunctor $- \otimes A$ also preserves finite limits. There is no need for a more complicated term such as "symmetric monoidally finitely complete" if one is careful to distinguish between a symmetric monoidal category and its underlying category.'
