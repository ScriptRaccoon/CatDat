id: '0'
name: empty category
notation: $\0$
objects: no objects
morphisms: no morphisms
description: This is the category with no objects and no morphisms. It is the initial object in the category of small categories.
nlab_link: https://ncatlab.org/nlab/show/empty+category
keywords:
  - initial category

tags:
  - category theory

related:
  - '1'

satisfied_properties:
  - property: discrete
    proof: This is trivial.

  - property: binary products
    proof: This is vacuously true.

  - property: finite
    proof: This is trivial.

  - property: small
    proof: This is trivial.

  - property: preadditive
    proof: This is vacuously true.

unsatisfied_properties:
  - property: inhabited
    proof: This is trivial.

special_objects: {}

special_morphisms:
  isomorphism:
    description: none
    proof: This is trivial.
  monomorphism:
    description: none
    proof: This is trivial.
  epimorphism:
    description: none
    proof: This is trivial.
  regular monomorphism:
    description: none
    proof: This is trivial.
  regular epimorphism:
    description: none
    proof: This is trivial.
