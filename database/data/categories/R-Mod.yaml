id: R-Mod
name: category of left modules over a ring
notation: $R{-}\Mod$
objects: left $R$-modules
morphisms: $R$-linear maps
description: This is the prototype of an abelian category. The category of right modules is the same with the opposite ring $R^{\op}$, hence not listed here. We assume $R \neq 0$ since otherwise the category would be trivial.
nlab_link: https://ncatlab.org/nlab/show/module
tags:
  - algebra
keywords:
  - R-modules

related:
  - Ab
  - Vect
  - grMod_G(R)
  - Proj_fg(Re)
  - Free_fg(ZxZ)
  - M-Set
  - Z-Set

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $R{-}\Mod \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: abelian
    proof: This is standard; see <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician">Mac Lane</a>, Ch. VIII.

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of an $R$-module, given by the algebraic theory of an abelian group and a unary operation for each $r \in R$.

unsatisfied_properties:
  - property: skeletal
    proof: The zero modules with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: CSP
    proof: The canonical homomorphism $\bigoplus_{n \geq 0} R \to \prod_{n \geq 0} R$ is not surjective, hence no epimorphism.

undecidable_properties:
  - property: all epimorphisms split
    proof: The category $R{-}\Mod$ has all epimorphisms split if and only if every $R$-module is projective, i.e. $R$ is semisimple; see <a href="https://doi.org/10.1007/978-1-4419-8616-0">Lam</a>, Theorem 2.5. For example, $\Vect_K$ has all epimorphisms split (<a href="/category/Vect?proof=all_epimorphisms_split" data-allow-deduced>proof</a>), while $\Ab$ does not (<a href="/category/Ab?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

  - property: split abelian
    proof: Since the category is abelian (<a href="/category/R-Mod?proof=abelian" data-allow-deduced>proof</a>), this is equivalent to having all epimorphisms split, which is undecidable (<a href="/category/R-Mod?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

  - property: all monomorphisms split
    proof: Since the category is abelian (<a href="/category/R-Mod?proof=abelian" data-allow-deduced>proof</a>), this is equivalent to having all epimorphisms split, which is undecidable (<a href="/category/R-Mod?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

special_objects:
  initial object:
    description: zero module
  terminal object:
    description: zero module
  coproducts:
    description: direct sums
  products:
    description: direct products with pointwise operations

special_morphisms:
  epimorphism:
    description: surjective morphisms
    proof: The forgetful functor to abelian groups is faithful and preserves colimits, hence reflects and preserves epimorphisms. Alternatively, use the same proof as for abelian groups.
