id: R-Mod
name: category of left modules over a ring
notation: $R{-}\Mod$
objects: left $R$-modules
morphisms: $R$-linear maps
description: |-
  This is the prototype of an abelian category. The category of right modules is the same with the opposite ring $R^{\op}$, hence not listed here. We assume $R \neq 0$ since otherwise the category would be trivial.
nlab_link: https://ncatlab.org/nlab/show/module
tags:
  - algebra

related:
  - M-Set
  - Ab
  - Vect
  - grMod_G(R)
  - Proj_fg(Re)
  - Free_fg(ZxZ)

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $R{-}\Mod \to \Set$ and $\Set$ is locally small.

  - property: abelian
    proof: This is standard, see <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician" target="_blank">Mac Lane</a>, Ch. VIII.

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of an $R$-module, given by the algebraic theory of an abelian group and an unary operation for each $r \in R$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: CSP
    proof: The canonical homomorphism $\bigoplus_{n \geq 0} R \to \prod_{n \geq 0} R$ is not surjective, hence no epimorphism.

undecidable_properties:
  - property: split abelian
    proof: The category $R{-}\Mod$ is split abelian if and only if $R$ is semisimple. See Theorem 2.5 in Lam's <a href="https://doi.org/10.1007/978-1-4419-8616-0">A First Course in Noncommutative Rings</a>. For example, <a href="/category/Vect">$\Vect_K$</a> is split abelian, while <a href="/category/Ab">$\Ab$</a> is not.

special_objects:
  initial object:
    description: zero module
  terminal object:
    description: zero module
  coproducts:
    description: direct sums
  products:
    description: direct products with pointwise operations

special_morphisms:
  epimorphisms:
    description: surjective morphisms
    proof: The forgetful functor to abelian groups is faithful and preserves colimits, hence reflects and preserves epimorphisms. Alternatively, use the same proof as for abelian groups.
