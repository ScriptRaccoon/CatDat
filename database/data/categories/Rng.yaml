id: Rng
name: category of rngs
notation: $\Rng$
objects: rngs (pronounced "rungs"), that is, non-unital rings
morphisms: maps that preserve addition and multiplication
description: This category is a typical example of a one-sorted finitary algebraic category. It is an "additive version" of the category of semigroups $\SemiGrp$.
nlab_link: https://ncatlab.org/nlab/show/Rng
keywords:
  - non-unital rings

tags:
  - algebra

related:
  - CRing
  - Ring
  - Ab
  - SemiGrp

comments:
  - It is likely that the epimorphisms can be described as for <a href="/category/CRing">$\CRing$</a>.

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Rng \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of a rng.

  - property: pointed
    proof: The zero ring is a zero object.

  - property: Malcev
    proof: This follows in the same way as for $\Grp$ (<a href="/category/Grp?proof=Malcev">proof</a>); see also <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Example 2.2.5.

unsatisfied_properties:
  - property: skeletal
    proof: The zero rngs with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: cototal
    proof: 'We apply <a href="/content/missing_cogenerator">this lemma</a> to the collection of fields: Any non-zero rng homomorphism from a field to a rng must be injective, and for every infinite cardinal $\kappa$ the field of rational functions in $\kappa$ variables has cardinality $\geq \kappa$.'

  - property: pushout-stable regular monomorphisms
    proof: 'We can copy the proof for $\Ring$, i.e. the <a href="/category/Alg(R)?proof=pushout-stable_regular_monomorphisms">proof</a> for $\Alg(R)$ for $R = \IZ$. In short, the inclusion of diagonal matrices $\IQ^2 \hookrightarrow M_2(\IQ)$ is a regular monomorphism, but becomes zero after taking the pushout with $p_1 : \IQ^2 \twoheadrightarrow \IQ$ because $M_2(\IQ)$ is simple.'

  - property: regular quotient object classifier
    proof: 'Assume that $\Rng$ has a regular quotient object classifier $P$. Consider the functor $N : \Ab \to \Rng$ that equips an abelian group with zero multiplication. It is fully faithful and has a left adjoint mapping a rng $R$ to the abelian group $R/R^2$. If $R$ is a rng with zero multiplication and $R \to S$ is a surjective homomorphism, then $S$ has zero multiplication. Therefore, the assumptions of <a href="/content/subcategories#lemma_1">Lemma 1 on subcategories</a> (dualized) apply and we conclude that $P/P^2$ is a regular quotient object classifier of $\Ab$. But $\Ab$ has no such object (<a href="/category/Ab?proof=regular_quotient_object_classifier" data-allow-deduced>proof</a>).'

  - property: cocartesian cofiltered limits
    proof: >-
      Consider the ring $A = \IZ[X]$ and the sequence of rings $B_n = \IZ[Y]/(Y^{n+1})$ with projections $B_{n+1} \to B_n$, whose limit is $\IZ[[Y]]$ (both in $\Ring$ and $\Rng$). Every element in the coproduct of rngs $\IZ[X] \sqcup \IZ[[Y]]$ has a finite "free product" length. Now consider the elements
      $$w_n = (1 + XY) (1+XY^2) \cdots (1+X Y^n) - 1 \in A \sqcup B_n.$$
      Because of $w_n \equiv w_{n-1} \bmod Y^n$, these form an element $w \in \lim_n (A \sqcup B_n)$. Expanding $w_n$, the longest term is $XY XY^2 \cdots X Y^n$ of "free product" length $2n$, which is unbounded.

  - property: product-stable epimorphisms
    proof: 'We know that $\Ring$ does not have this property (<a href="/category/Ring?proof=product-stable_epimorphisms" data-allow-deduced>proof</a>). Hence, it suffices to show that the forgetful functor $\Ring \to \Rng$, which is faithful and preserves products, also preserves epimorphisms: Let $f : R \to S$ be an epimorphism in $\Ring$ and let $g,h : S \rightrightarrows T$ be two homomorphisms of rngs with $gf = hf$. The element $e = g(1) = h(1) \in T$ is idempotent, and $g,h$ become homomorphisms of rings $S \rightrightarrows eTe$. Hence, $g=h$.'

  - property: finite-coproduct-stable monomorphisms
    proof: >-
      The rng homomorphisms $\IZ \to \IQ$ and $\id : \IZ/2 \to \IZ/2$ are injective. We claim that their coproduct $\IZ \sqcup \IZ/2 \to \IQ \sqcup \IZ/2$ is not injective. Let $a \in \IZ \sqcup \IZ/2$ and $b \in \IZ \sqcup \IZ/2$ be the images of $1 \in \IZ$ and $1 \in \IZ/2$. The homomorphism $\IZ \sqcup \IZ/2 \to \IZ/2$ induced by the projection $\IZ \to \IZ/2$ and $\id_{\IZ/2}$ maps $a \cdot b$ to $1 \cdot 1 = 1$, so $a \cdot b \neq 0$. On the other hand, let $a' \in \IQ \sqcup \IZ/2$ and $b' \in \IQ \sqcup \IZ/2$ be the images of $1 \in \IQ$ and $1 \in \IZ/2$, and let $c'$ be the image of $1/2 \in \IQ$. Then the coproduct homomorphism maps $a \cdot b$ to
      $$a' \cdot b' = c' \cdot (2 a') \cdot b' = c' \cdot a' \cdot (2 b') = c' \cdot a' \cdot 0 = 0.$$

  - property: effective cocongruences
    proof: >-
      The counterexample is similar to the one at <a href="https://mathoverflow.net/a/510809">MO/510744</a> for $\Ring$: in this case,
      $$X \coloneqq \langle p \mid p^2 = p \rangle_{\Rng} \cong \IZ$$
      and
      $$E \coloneqq \langle p, q \mid p^2 = p, q^2 = q, pq = q, qp = p \rangle_{\Rng} \cong \begin{pmatrix} \IZ & \IZ \\ 0 & 0 \end{pmatrix}$$
      via
      $$p \mapsto \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}, \quad q \mapsto \begin{pmatrix} 1 & 1 \\ 0 & 0 \end{pmatrix}.$$
      From here, the rest of the argument is similar to the <a href="/category/Alg(R)?proof=effective_cocongruences">proof</a> for $\Alg(R)$ with $R = \IZ$.

special_objects:
  initial object:
    description: trivial ring
  terminal object:
    description: zero ring
  coproducts:
    description: see <a href="https://math.stackexchange.com/questions/4975797">MSE/4975797</a>
  products:
    description: direct products with pointwise operations

special_morphisms: {}
