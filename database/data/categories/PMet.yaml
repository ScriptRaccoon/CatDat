id: PMet
name: category of pseudo-metric spaces with non-expansive maps
notation: $\PMet$
objects: >-
  A pseudo-metric space is a pair $(X,d_X)$ consisting of a set $X$ and a map $d_X : X \times X \to [0,\infty)$ such that $d_X(x,x) = 0$, $d_X(x,y) = d_X(y,x)$, and $d_X(x,z) \leq d_X(x,y) + d_X(y,z)$ for all $x,y,z \in X$.
morphisms: >-
  A morphism $(X,d_X) \to (Y,d_Y)$ is a non-expansive map (also called short map or $1$-Lipschitz map), i.e. a map $f : X \to Y$ such that $d_Y(f(x),f(x')) \leq d_X(x,x')$ for all $x,x' \in X$.
description: In contrast to metric spaces, we do not demand that $d_X(x,y) = 0$ implies $x = y$.
nlab_link: null
keywords:
  - short maps
  - 1-Lipschitz maps

tags:
  - analysis

related:
  - Met
  - Met_c
  - Met_oo

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\PMet \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: strict initial object
    proof: The empty set $\varnothing$ with its unique pseudo-metric is initial and clearly strict.

  - property: semi-strongly connected
    proof: Every non-empty pseudo-metric space is weakly terminal (by using constant maps).

  - property: equalizers
    proof: Just restrict the pseudo-metric to the equalizer built from the sets.
    check_redundancy: false

  - property: binary products
    proof: The product of two pseudo-metric spaces $(X,d_X)$, $(Y,d_Y)$ is $(X \times Y,d)$ with $d((x_1,y_1),(x_2,y_2)) \coloneqq \sup(d_X(x_1,x_2),d_Y(y_1,y_2))$.
    check_redundancy: false

  - property: terminal object
    proof: The one-point set $\{\ast\}$ with its unique pseudo-metric is terminal. We denote this pseudo-metric space by $\{\ast\}$ as well.
    check_redundancy: false

  - property: coequalizers
    proof: >-
      Let $f,g : (X,d_X) \rightrightarrows (Y,d_Y)$ be two morphisms. Let ${\sim}$ be the equivalence relation on $Y$ generated by $f(x) \sim g(x)$ for $x \in X$, let $Q \coloneqq Y/{\sim}$, and let $q : Y \to Q$ be the projection, $q(y) = [y]$. For $y,y' \in Y$ we define $d_Q([y],[y'])$ as the infimum of the sums
      $$\textstyle \sum_{i=0}^{n-1} d_Y(z_i,y_{i+1}),$$
      where $n \geq 0$ and $y_0,\dotsc,y_n,z_0,\dotsc,z_n \in Y$ satisfy $y_0 \sim y$, $y_i \sim z_i$ for $0 \leq i \leq n$, and $z_n \sim y'$. We call such a tuple a chain from $y$ to $y'$. By definition, this infimum only depends on $[y]$ and $[y']$. The chain with $n = 1$, $y_0 = z_0 = y$, and $y_1 = z_1 = y'$ shows
      $$d_Q([y],[y']) \leq d_Y(y,y') < \infty.$$

      We claim that $d_Q$ is a pseudo-metric. If $[y] = [y']$, the chain with $n = 0$, $y_0 = y$, and $z_0 = y'$ shows $d_Q([y],[y']) = 0$. For symmetry, every chain from $y$ to $y'$ yields a chain from $y'$ to $y$ with the same sum by reversing the order and swapping the roles of the $y_i$ and $z_i$, i.e. $y'_i \coloneqq z_{n-i}$ and $z'_i \coloneqq y_{n-i}$. Then
      $$\textstyle \sum_{i=0}^{n-1} d_Y(z'_i,y'_{i+1}) = \sum_{i=0}^{n-1} d_Y(y_{n-i},z_{n-i-1}) = \sum_{i=0}^{n-1} d_Y(z_i,y_{i+1}).$$
      For the triangle inequality, let $y_0,\dotsc,y_n,z_0,\dotsc,z_n$ be a chain from $y$ to $y'$ and $y'_0,\dotsc,y'_m,z'_0,\dotsc,z'_m$ be a chain from $y'$ to $y''$. Since $y_n \sim z_n \sim y' \sim y'_0 \sim z'_0$, the tuple
      $$y_0,\dotsc,y_n,y'_1,\dotsc,y'_m, \quad z_0,\dotsc,z_{n-1},z'_0,\dotsc,z'_m$$
      is a chain from $y$ to $y''$ (with $y_n$ paired with $z'_0$), and its sum is the sum of the two given sums. Taking the infimum over both chains gives $d_Q([y],[y'']) \leq d_Q([y],[y']) + d_Q([y'],[y''])$.

      By the inequality above, $q : (Y,d_Y) \to (Q,d_Q)$ is non-expansive, and $q \circ f = q \circ g$ holds by construction. We claim that $q$ is a coequalizer of $f,g$. Let $h : (Y,d_Y) \to (Z,d_Z)$ be a morphism with $h \circ f = h \circ g$. Then the kernel pair of $h$ is an equivalence relation containing all pairs $(f(x),g(x))$, hence contains ${\sim}$. Therefore, there is a unique map $\overline{h} : Q \to Z$ with $\overline{h} \circ q = h$. It remains to show that $\overline{h}$ is non-expansive. Let $y_0,\dotsc,y_n,z_0,\dotsc,z_n$ be a chain from $y$ to $y'$. Since $h$ is constant on equivalence classes, we have $h(y_i) = h(z_i)$ for all $i$, as well as $h(y) = h(y_0)$ and $h(y') = h(z_n) = h(y_n)$. Using the iterated triangle inequality for $d_Z$ and that $h$ is non-expansive, we get
      $$\begin{align*}
      d_Z(\overline{h}([y]),\overline{h}([y'])) & = d_Z(h(y_0),h(y_n)) \\
      & \textstyle \leq \sum_{i=0}^{n-1} d_Z(h(y_i),h(y_{i+1})) \\
      & \textstyle = \sum_{i=0}^{n-1} d_Z(h(z_i),h(y_{i+1})) \\
      & \textstyle \leq \sum_{i=0}^{n-1} d_Y(z_i,y_{i+1}).
      \end{align*}$$
      Taking the infimum over all chains gives $d_Z(\overline{h}([y]),\overline{h}([y'])) \leq d_Q([y],[y'])$.

      This construction is also described in <a href="https://mathoverflow.net/questions/123739">MO/123739</a>.

  - property: filtered colimits
    proof: 'Given a filtered diagram of pseudo-metric spaces $(X_i,d_i)$, take the filtered colimit $X$ of the sets $X_i$, with maps $u_i : X_i \to X$, and equip it with the following pseudo-metric $d$: If $x,y \in X$, let $d(x,y)$ be the infimum of all $d_i(x_i,y_i)$, where $x_i,y_i \in X_i$ are some preimages of $x,y$ under some $u_i$. The definition ensures that each $u_i : (X_i,d_i) \to (X,d)$ is non-expansive, and the universal property is easy to check.'
    check_redundancy: false

  - property: exact filtered colimits
    proof: >-
      We already saw that finite limits and filtered colimits exist. Now let $\I$ be a finite category and $\J$ be a small filtered category, w.l.o.g. a directed poset. Let $D : \I \times \J \to \PMet$ be a diagram. We need to show that the canonical map
      $$\textstyle\colim_{j \in \J} \lim_{i \in \I} D(i,j) \to \lim_{i \in \I} \colim_{j \in \J} D(i,j)$$
      is an isomorphism. It is bijective since the forgetful functor to $\Set$ preserves finite limits and filtered colimits and since <a href="/category/Set">$\Set$</a> has exact filtered colimits. That the map is isometric can easily be reduced to the following lemma: If $r_{i,j} \in \IR_{\geq 0}$ are numbers for $i \in \I$, $j \in \J$ with $j \leq k \implies r_{i,k} \leq r_{i,j}$, then $\inf_j \sup_i r_{i,j} = \sup_i \inf_j r_{i,j}$. This can be proven directly. Alternatively, use that the thin category $(\IR_{\geq 0} \cup \{\infty\},\leq)$ is isomorphic to $([0,1],\leq)$, and we already know that <a href="/category/real_interval">it has exact filtered colimits</a>.

  - property: ℵ₁-cofiltered limits
    proof: >-
      Let $D : \I \to \PMet$ be an $\aleph_1$-cofiltered diagram with $D(i) = (X_i,d_i)$, and let $X$ be the limit of the sets $X_i$, with projections $p_i : X \to X_i$. For $x,y \in X$ we define
      $$\textstyle d(x,y) \coloneqq \sup_{i \in \I} d_i(p_i(x),p_i(y)).$$
      We claim that $d(x,y) < \infty$. Suppose otherwise. Then for every $n \in \IN$ there exists an object $i_n \in \I$ such that $d_{i_n}(p_{i_n}(x),p_{i_n}(y)) \geq n$. Since $\I$ is $\aleph_1$-cofiltered, there exists a cone $(j \to i_n)_{n \in \IN}$. Since the maps $D(j) \to D(i_n)$ are non-expansive, we have
      $$d_j(p_j(x),p_j(y)) \geq d_{i_n}(p_{i_n}(x),p_{i_n}(y)) \geq n$$
      for every $n \in \IN$. This is impossible since $d_j$ takes only finite values.

      Hence, $d$ is a pseudo-metric on $X$. It satisfies the triangle inequality since $d_i(p_i(x),p_i(z)) \leq d(x,y) + d(y,z)$ holds for all $i \in \I$ and $x,y,z \in X$. By construction, the maps $p_i : (X,d) \to (X_i,d_i)$ are non-expansive. They form a limit cone: if $(g_i : (Y,d_Y) \to (X_i,d_i))_{i \in \I}$ is a cone, then the unique map $g : Y \to X$ with $p_i \circ g = g_i$ for all $i \in \I$ is non-expansive, since $d_i(g_i(y),g_i(y')) \leq d_Y(y,y')$ for all $i \in \I$ implies $d(g(y),g(y')) \leq d_Y(y,y')$.
    label: PMet_aleph1_cofiltered_limits

  - property: ℵ₁-accessible
    proof: >-
      We already know that $\PMet$ has filtered colimits. Let $(X_i,d_i)_{i \in I}$ be a diagram in $\PMet$ indexed by an $\aleph_1$-directed poset $I$, with transition maps $f_{ij} : (X_i,d_i) \to (X_j,d_j)$ for $i \leq j$, and let $(u_i : (X_i,d_i) \to (X,d))_{i \in I}$ be its colimit. Recall that $X$ is the colimit of the sets $X_i$, and that $d(x,y)$ is the infimum of all $d_i(x_i,y_i)$, where $i \in I$ and $x_i,y_i \in X_i$ satisfy $u_i(x_i) = x$ and $u_i(y_i) = y$.

      <strong>Claim.</strong> For every countable subset $S \subseteq X$ there are an index $k \in I$ and a map $s : S \to X_k$ such that $u_k(s(x)) = x$ and $d_k(s(x),s(y)) = d(x,y)$ for all $x,y \in S$. In other words, the infima defining the distances in $S$ are attained simultaneously at a single stage.

      To see this, choose for all $x,y \in S$ and $n \geq 1$ an index $i \in I$ and preimages $x_i,y_i \in X_i$ of $x,y$ with $d_i(x_i,y_i) \leq d(x,y) + 1/n$. This gives countably many elements in various stages $X_i$. Any two chosen preimages of the same point of $S$ are mapped to the same element at some later stage, since the underlying set of $X$ is the colimit in $\Set$. These are countably many pairs, so since $I$ is $\aleph_1$-directed, there is an index $k$ above all the indices involved such that all chosen preimages of a point $x \in S$ have the same image in $X_k$. We call this image $s(x)$. Since the transition maps are non-expansive, we get $d_k(s(x),s(y)) \leq d(x,y) + 1/n$ for all $n \geq 1$, hence $d_k(s(x),s(y)) \leq d(x,y)$. Conversely, $d(x,y) \leq d_k(s(x),s(y))$ holds since $u_k$ is non-expansive.

      Now let $(A,d_A)$ be a countable pseudo-metric space. We show that $(A,d_A)$ is $\aleph_1$-presentable, i.e. that the canonical map
      $$\colim_{i \in I} \Hom((A,d_A),(X_i,d_i)) \to \Hom((A,d_A),(X,d))$$
      is bijective. For injectivity, let $g,h : (A,d_A) \rightrightarrows (X_i,d_i)$ be morphisms with $u_i \circ g = u_i \circ h$. For every $a \in A$ there is some $j_a \geq i$ with $f_{i j_a}(g(a)) = f_{i j_a}(h(a))$. An upper bound $j$ of the countably many indices $j_a$ satisfies $f_{ij} \circ g = f_{ij} \circ h$. For surjectivity, let $g : (A,d_A) \to (X,d)$ be a morphism. We apply the claim to the countable subset $S \coloneqq g(A)$ and obtain $k \in I$ and $s : S \to X_k$. Then the map $h : A \to X_k$, $h(a) \coloneqq s(g(a))$ satisfies $u_k \circ h = g$, and $h$ is non-expansive because
      $$d_k(h(a),h(b)) = d(g(a),g(b)) \leq d_A(a,b)$$
      for all $a,b \in A$.

      Finally, every pseudo-metric space $(Y,d_Y)$ is the $\aleph_1$-directed colimit of its countable subspaces $(S,d_S)$, where $S \subseteq Y$ is countable and $d_S$ is the restriction of $d_Y$: the underlying set of the colimit is the union $Y$, and the infimum defining the distance of two points is just their distance w.r.t. $d_Y$, since all inclusions are isometric. Since every countable pseudo-metric space is isomorphic to one whose underlying set is a subset of $\IN$, there is only a set of them up to isomorphism. Hence, $\PMet$ is $\aleph_1$-accessible.
    label: PMet_aleph1_accessible

  - property: regular subobject classifier
    proof: >-
      Consider the pseudo-metric space $\Omega = (\{0,1\},0)$, equipped with the zero pseudo-metric. We know that the regular monomorphisms are precisely the injective isometric maps (see below), and hence are, up to isomorphism, inclusions $(Y,d_Y) \hookrightarrow (X,d_X)$, where $Y \subseteq X$ and $d_Y$ is the restriction of $d_X$. In particular, the map $\top : \{\ast\} \to \Omega$, $\ast \mapsto 1$, is a regular monomorphism. Let $(X,d_X)$ be a pseudo-metric space, $Y \subseteq X$ be a subset, and $d_Y$ be the restriction of $d_X$. The characteristic function $\chi_Y : X \to \{0,1\}$ is non-expansive since all distances in $\Omega$ are $0$, and the pullback of $\top$ along $\chi_Y$ is $(Y,d_Y)$. Indeed, the underlying set of the pullback identifies with the preimage $(\chi_Y)^*(\{1\}) = Y$, and its pseudo-metric is
      $d((x,\ast),(x',\ast)) = \sup(d_X(x,x'),0) = d_X(x,x')$,
      i.e. the restriction of $d_X$.

  - property: extremal generator
    proof: >-
      Consider $(G,d_G)$, where $G \coloneqq \IR_{\ge 0} \sqcup \{ 0' \}$ and $d_G$ is the pseudo-metric with $d_G(x,y) = 0$ if $x=y$ and otherwise $d_G(x,y) = x+y$ for $x, y \in \IR_{\ge 0}$, and $d_G(x, 0') = d_G(0', x) = x$ for $x \in \IR_{\ge 0}$. We will show $(G,d_G)$ is an extremal generator for $\PMet$.

      First, to see $(G,d_G)$ is a generator, note that the one-point space is a generator since it represents the forgetful functor $\PMet\to \Set$ which is faithful. Since we have an epimorphism $! : (G,d_G) \twoheadrightarrow \{\ast\}$, $(G,d_G)$ is also a generator.

      Now, suppose that $f : (X,d_X) \to (Y,d_Y)$ is a morphism such that
      $$f \circ {-} : \Hom((G,d_G), (X,d_X)) \to \Hom((G,d_G), (Y,d_Y))$$
      is a bijection. By considering constant maps from $(G,d_G)$, we see that $f : X \to Y$ is bijective. Now suppose we have $x_1, x_2 \in X$ with $d_Y(f(x_1), f(x_2)) = \varepsilon \ge 0$. Then there is a morphism $\varphi : (G,d_G) \to (Y,d_Y)$ which maps $\varepsilon$ to $f(x_2)$ and every other element of $G$ to $f(x_1)$. Therefore, there is a morphism $\psi : (G,d_G) \to (X,d_X)$ such that $\varphi = f \circ \psi$. Since $f$ is injective, we must have $\psi(\varepsilon) = x_2$ and $\psi(0') = x_1$. Hence,
      $$\begin{align*}
      d_X(x_1, x_2) &= d_X(\psi(0'), \psi(\varepsilon)) \\
      & \leq d_G(0', \varepsilon) \\
      & = \varepsilon \\
      & = d_Y(f(x_1), f(x_2)) \\
      & \leq d_X(x_1, x_2).
      \end{align*}$$
      This shows that $f$ is isometric.
    label: PMet_extremal_generator

  - property: extremal cogenerator
    proof: >-
      Consider $(Q,d_Q)$, where $Q \coloneqq \IR_{\ge 0} \sqcup \{ 0' \}$ and $d_Q$ is the pseudo-metric extending the usual metric on $\IR_{\ge 0}$ with $d_Q(x, 0') = x$ for $x \in \IR_{\ge 0}$. Then $(Q,d_Q)$ is an extremal cogenerator.

      First, to see $(Q,d_Q)$ is a cogenerator, note that $d_Q$ restricts to the zero pseudo-metric on $\{ 0, 0' \}$, and that $(\{ 0, 0' \},0)$ is a cogenerator since every map into it is automatically non-expansive and since $\{0,0'\}$ is a cogenerator in <a href="/category/Set">$\Set$</a>. Therefore, since the inclusion $(\{ 0, 0' \},0) \hookrightarrow (Q,d_Q)$ is a monomorphism, we have that $(Q,d_Q)$ is also a cogenerator.

      To see $(Q,d_Q)$ is in fact an extremal cogenerator, suppose we have a morphism $f : (X,d_X) \to (Y,d_Y)$ such that
      $${-} \circ f : \Hom((Y,d_Y), (Q,d_Q)) \to \Hom((X,d_X), (Q,d_Q))$$
      is a bijection. Since $(Q,d_Q)$ is a cogenerator, it follows that $f$ is both a monomorphism and an epimorphism, i.e. $f$ is bijective (see below).

      It remains to show that $f$ is isometric. Let $x,x' \in X$. The map $\varphi \coloneqq d_X(x,{-}) : X \to \IR_{\geq 0} \subseteq Q$ is a morphism $(X,d_X) \to (Q,d_Q)$ by the triangle inequality. By assumption, there is a morphism $\psi : (Y,d_Y) \to (Q,d_Q)$ with $\psi \circ f = \varphi$. Since $\varphi(x) = 0$, we get
      $$\begin{align*}
      d_X(x,x') &= \varphi(x') \\
      & = d_Q(\varphi(x),\varphi(x')) \\
      & = d_Q(\psi(f(x)),\psi(f(x'))) \\
      & \leq d_Y(f(x),f(x')) \\
      & \leq d_X(x,x').
      \end{align*}$$
      Hence, $f$ is isometric.

  - property: well-copowered
    proof: This follows since epimorphisms are surjective (see below).

unsatisfied_properties:
  - property: skeletal
    proof: The pseudo-metric spaces with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: locally finite
    proof: Its subcategory <a href="/category/Met">$\Met$</a> is not locally finite.

  - property: balanced
    proof: 'Let $d : \IR \times \IR \to \IR_{\geq 0}$ be the usual Euclidean metric on $\IR$ and $0 : \IR \times \IR \to \IR_{\geq 0}$ be the zero pseudo-metric. Then the identity map $(\IR,d) \to (\IR,0)$ provides a counterexample.'

  - property: cartesian closed
    proof: This is proven in <a href="https://math.stackexchange.com/questions/5131457">MSE/5131457</a>.

  - property: countable powers
    proof: 'Let $d$ be the usual metric on $\IR$, and assume that the power $(P,d_P)$ of countably many copies of $(\IR,d)$ exists. Since the forgetful functor $\PMet \to \Set$ is representable, it preserves limits, powers in particular. Thus, we may assume that $P = \IR^{\IN}$ is the set of sequences of numbers and that the projections $p_n : (P,d_P) \to (\IR,d)$ are given by $p_n(x) = x_n$. Now consider the sequences $x = (n)_n$ and $y = (0)_n$. Since each $p_n$ is non-expansive, we get $d_P(x,y) \geq d(p_n(x),p_n(y)) = d(n,0) = n$. But then $d_P(x,y) = \infty$, a contradiction.'
    label: PMet_no_countable_powers

  - property: binary copowers
    proof: The coproduct of two non-empty pseudo-metric spaces does not exist; see <a href="https://math.stackexchange.com/questions/1778408">MSE/1778408</a> (the proof also works for pseudo-metric spaces). For example, the binary copower of $(\IR,d)$, where $d$ is the usual metric, does not exist. We only get coproducts when allowing $\infty$ as a distance.

  - property: natural numbers object
    proof: By Lemma 2 <a href="/content/natural_numbers_objects">here</a>, if $(N,z,s)$ is a natural numbers object, then $N \cong \{\ast\} \sqcup N$. Since there is a map $\{\ast\} \to N$, we have $N \neq \varnothing$. However, the coproduct of two non-empty pseudo-metric spaces does not exist; see <a href="https://math.stackexchange.com/questions/1778408">MSE/1778408</a>.
    label: PMet_no_NNO

  - property: effective congruences
    proof: >-
      Recall that finite limits in $\PMet$ are computed on the underlying sets, equipped with the supremum of the pseudo-metrics of the components. Let $X \coloneqq \{0,1\}$ and $d_X(0,1) \coloneqq 1$. Let $d_R$ be the metric on $X \times X$ with $d_R((0,0),(1,1)) \coloneqq 1$ and $d_R(a,b) \coloneqq 2$ for all other pairs of distinct points $a,b$. It satisfies the triangle inequality since distinct points have distance $1$ or $2$. The projections $p_1,p_2 : (X \times X,d_R) \rightrightarrows (X,d_X)$ are non-expansive and jointly injective. We claim that they form a congruence.

      Reflexivity: the diagonal $(X,d_X) \to (X \times X,d_R)$ is isometric, since $d_R((0,0),(1,1)) = 1$.

      Symmetry: the swap map $(X \times X,d_R) \to (X \times X,d_R)$, $(x,y) \mapsto (y,x)$ is isometric.

      Transitivity: the pullback of $p_2$ and $p_1$ consists of the pairs $((x,y),(y,z))$, with the maximum of the distances of the components. We need to show that the composition map $((x,y),(y,z)) \mapsto (x,z)$ is non-expansive. Let $r$ be the distance of $((x,y),(y,z))$ and $((x',y'),(y',z'))$. Since $d_R$ only takes the values $0$, $1$, and $2$, the same holds for $r$. If $r = 2$, there is nothing to show, since $d_R \leq 2$. Otherwise, $r \leq 1$, so that $d_R((x,y),(x',y')) \leq 1$ and $d_R((y,z),(y',z')) \leq 1$. Since $(0,0)$ and $(1,1)$ are the only distinct points with distance $1$, each of the sets $\{(x,y),(x',y')\}$ and $\{(y,z),(y',z')\}$ is either a singleton or equal to $\{(0,0),(1,1)\}$. If $y = y'$, neither set can be $\{(0,0),(1,1)\}$, so $(x,y) = (x',y')$ and $(y,z) = (y',z')$, and hence $(x,z) = (x',z')$, so that $d_R((x,z),(x',z')) = 0 \leq r$. If $y \neq y'$, both sets are $\{(0,0),(1,1)\}$, so $x = y = z$ and $x' = y' = z'$ with $x \neq x'$. Then $\{(x,z),(x',z')\} = \{(0,0),(1,1)\}$, and hence $d_R((x,z),(x',z')) = 1 \leq r$.

      The congruence is not effective. Assume that it is the kernel pair of a morphism $f : (X,d_X) \to (Y,d_Y)$. The underlying set of the kernel pair is $\{(x,x') \in X \times X : f(x) = f(x')\}$, which then must be $X \times X$, so that $f$ is constant. But then the kernel pair is $(X \times X,d)$ with the supremum metric $d((x,y),(x',y')) = \sup(d_X(x,x'),d_X(y,y'))$, so that $d((0,1),(1,0)) = 1$, whereas $d_R((0,1),(1,0)) = 2$.
    label: PMet_no_effective_congruences

  - property: effective cocongruences
    proof: 'The proof is similar to the one for <a href="/category/Top">$\Top$</a>: The pseudo-metric space $(\{0,1\},0)$ represents the functor taking a pseudo-metric space to the pairs of points with $d(x,y) = 0$. In this case, once you conclude $Z = \varnothing$, the map $h : Z \to \{\ast\}$ does not have any cokernel pair, since that would have to be a coproduct $\{\ast\} \sqcup \{\ast\}$, which does not exist.'
    references:
      - Top_no_effective_cocongruences

  - property: pullback-stable regular epimorphisms
    proof: >-
      We can adapt Example 3.14 at the <a href="https://ncatlab.org/nlab/show/regular+category">nLab</a> (which provides non-stable regular epimorphisms in $\Pos$ and related categories) as follows: Let $d$ be the usual metric on $\IR$ and its restrictions to subsets of $\IR$. Consider $X \coloneqq \{0,1,2,3\}$ and $Y \coloneqq \{0,1,2\}$. Define a surjective map $p : X \to Y$ by $p(0)=0$, $p(1)=p(2)=1$, and $p(3)=2$. Clearly, $p$ is non-expansive. Moreover, one can check that it satisfies the universal property in $\PMet$ of a coequalizer of the two maps $\{\ast\} \rightrightarrows (X,d)$ with images $1$ and $2$. Thus, it is a regular epimorphism. Now consider $Z \coloneqq \{0,2\} \subseteq Y$. As a set, the pullback of $(Z,d) \hookrightarrow (Y,d)$ along $p$ is $p^*(Z) = \{0,3\}$, and its pseudo-metric $d'$ satisfies $d'(0,3) = \sup(d(0,3),d(p(0),p(3))) = \sup(3,2) = 3$. The projection of the pullback to $(Z,d)$ identifies with the evident bijective and non-expansive map $(\{0,3\},d') \to (\{0,2\},d)$. It is a monomorphism and not an isomorphism (the distances do not match), hence cannot be a regular epimorphism.
    label: PMet_not_regular

  - property: coaccessible
    proof: >-
      Assume that $\PMet$ is $\kappa$-coaccessible for a regular cardinal $\kappa$. For $\alpha < \kappa$, let $X_\alpha \coloneqq \{ \beta \mid \alpha \leq \beta < \kappa \}$ be equipped with the discrete metric $d_\alpha$ given by $d_\alpha(x,y) \coloneqq 1$ for $x \neq y$, and let $D(\alpha) \coloneqq (X_\alpha,d_\alpha)$. The inclusions $D(\alpha') \hookrightarrow D(\alpha)$ for $\alpha \leq \alpha'$ are non-expansive and form a diagram $D : (\kappa,\geq) \to \PMet$. Its limit is the empty set with its unique pseudo-metric, which is the initial object. Indeed, if $(f_\alpha : (Y,d_Y) \to D(\alpha))_{\alpha < \kappa}$ is a cone, then every $f_\alpha$ agrees with $f_0$ as a map to $X_0$, so that the image of $f_0$ is contained in $\bigcap_{\alpha < \kappa} X_\alpha = \varnothing$, and hence $Y = \varnothing$. Let $p : D(0) \to \{\ast\}$ be the map to the terminal object. For every $\alpha < \kappa$, the composite $D(\alpha) \hookrightarrow D(0) \to \{\ast\}$ is surjective, since $X_\alpha$ is non-empty, and hence an epimorphism. By the lemma <a href="/content/decreasing-chains-coaccessible">here</a>, every pseudo-metric space admits at most one non-expansive map from $\{\ast\}$, which means that it has at most one point. This is a contradiction.
    label: PMet_not_coaccessible

  - property: finitely accessible
    proof: >-
      We show that a pseudo-metric space is finitely presentable if and only if it has at most one point. Then $\PMet$ is not finitely accessible: since the underlying set of a filtered colimit is the filtered colimit of the underlying sets, a filtered colimit of pseudo-metric spaces with at most one point has at most one point as well.

      The empty space is finitely presentable since it is initial. The one-point space is finitely presentable since it represents the forgetful functor $\PMet \to \Set$, which preserves filtered colimits by their construction above.

      Conversely, let $(A,d_A)$ be a pseudo-metric space with at least two points. For $n \geq 1$, let $d_n$ be the pseudo-metric on $A$ defined by $d_n(x,y) \coloneqq d_A(x,y) + 1/n$ for $x \neq y$ and $d_n(x,x) \coloneqq 0$. The identity maps $(A,d_n) \to (A,d_{n+1})$ are non-expansive. By the construction of filtered colimits above, the colimit of this sequence is $(A,d_A)$ with the identity maps $(A,d_n) \to (A,d_A)$ as colimit maps, since $\inf_n d_n(x,y) = d_A(x,y)$ for all $x,y \in A$. If $(A,d_A)$ were finitely presentable, the identity of $(A,d_A)$ would factor through some $(A,d_n)$. That is, there would be a morphism $f : (A,d_A) \to (A,d_n)$ whose composite with the identity map $(A,d_n) \to (A,d_A)$ is the identity. Then $f$ is the identity map, so that $d_A(x,y) + 1/n = d_n(x,y) \leq d_A(x,y)$ for distinct $x,y \in A$, which is a contradiction.

      In <a href="/category/Met">$\Met$</a>, the situation is different: by <a href="https://doi.org/10.1016/j.jpaa.2021.106974">Adámek–Rosický</a>, Rem. 2.7, the empty space is the only finitely presentable object, so that even the one-point space is not finitely presentable. Their argument fails injectivity instead of surjectivity: the colimit in $\Met$ of the sequence of two-point spaces with distance $1/n$ (and identity maps) is a one-point space, so two distinct constant maps from a non-empty metric space to the first two-point space become equal in the colimit, but not at any finite stage. This does not carry over to $\PMet$, where the colimit of this sequence is a two-point space with distance $0$.

special_objects:
  initial object:
    description: empty set with its unique pseudo-metric
  terminal object:
    description: one-point set with its unique pseudo-metric
  products:
    description: '[finite case] $(\prod_i X_i,d)$ for pseudo-metric spaces $(X_i,d_i)$, where $d(x,y) = \sup_i d_i(x_i,y_i)$'

special_morphisms:
  isomorphism:
    description: bijective isometries
    proof: This is easy.
  monomorphism:
    description: injective non-expansive maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphism:
    description: surjective non-expansive maps
    proof: >-
      Let $f : (X,d_X) \to (Y,d_Y)$ be a morphism that is not surjective. Choose $y_0 \in Y \setminus f(X)$. We extend $d_Y$ to a pseudo-metric $d_Z$ on $Z \coloneqq Y \sqcup \{y'_0\}$ via $d_Z(y,y'_0) \coloneqq d_Y(y,y_0)$, i.e., we make $y_0,y'_0$ indistinguishable. Let $g : Y \to Z$ be the inclusion and $h : Y \to Z$ be the map that composes $g$ with the swap between $y_0$ and $y'_0$. Both are isometric maps $(Y,d_Y) \to (Z,d_Z)$ and satisfy $g \circ f = h \circ f$. Therefore, $f$ is not an epimorphism.
  regular monomorphism:
    description: injective isometric maps
    proof: 'Equalizers are injective isometric maps by construction. Conversely, if $(X,d_X) \to (Y,d_Y)$ is an injective isometric map, we may assume without loss of generality that $X \subseteq Y$ and that $d_X$ is the restriction of $d_Y$. Then the inclusion is the equalizer of the two morphisms $\chi_X, 1 : (Y,d_Y) \rightrightarrows \Omega$, where $\Omega = (\{0,1\},0)$ is equipped with the zero pseudo-metric.'
  regular epimorphism:
    description: >-
      For a morphism $f : (X,d_X) \to (Y,d_Y)$ the following are equivalent: (1) $f$ is a regular epimorphism. (2) $f$ is surjective and $d_Y$ is the largest pseudo-metric on $Y$ for which $f$ is non-expansive. (3) $f$ is surjective and for all $x,x' \in X$, $d_Y(f(x),f(x'))$ is the infimum of the sums $\sum_{i=0}^{n-1} d_X(x'_i,x_{i+1})$, where $n \geq 0$ and $x_0,\dotsc,x_n,x'_0,\dotsc,x'_n \in X$ satisfy $f(x_0) = f(x)$, $f(x_i) = f(x'_i)$ for $0 \leq i \leq n$, and $f(x'_n) = f(x')$.
    proof: >-
      Every regular epimorphism is an epimorphism, hence surjective (see above). So we may assume that $f$ is surjective. Let $p_1,p_2 : (K,d_K) \rightrightarrows (X,d_X)$ be the kernel pair of $f$, where $K = \{(a,b) \in X \times X : f(a) = f(b)\}$. The relation ${\sim}$ on $X$ defined by $a \sim b \iff f(a) = f(b)$ is already an equivalence relation, and $f$ induces a bijection $X/{\sim} \to Y$. Via this bijection, the construction of coequalizers above yields a pseudo-metric $\rho$ on $Y$ such that $f : (X,d_X) \to (Y,\rho)$ is a coequalizer of $p_1,p_2$, where $\rho(f(x),f(x'))$ is the infimum in (3). Thus, (3) means precisely that $d_Y = \rho$. Moreover, $\rho$ is the largest pseudo-metric on $Y$ for which $f$ is non-expansive: if $\delta$ is such a pseudo-metric, then $f : (X,d_X) \to (Y,\delta)$ satisfies $f \circ p_1 = f \circ p_2$, so the universal property of $f : (X,d_X) \to (Y,\rho)$ shows that $\id_Y : (Y,\rho) \to (Y,\delta)$ is non-expansive, i.e. $\delta \leq \rho$. Hence, (2) also means precisely that $d_Y = \rho$, so that (2) and (3) are equivalent.

      (1) $\implies$ (2): Let $f$ be a coequalizer of a pair of morphisms $g,h$. Let $\delta$ be a pseudo-metric on $Y$ for which $f : (X,d_X) \to (Y,\delta)$ is non-expansive. Since this morphism also satisfies $f \circ g = f \circ h$, the universal property shows that $\id_Y : (Y,d_Y) \to (Y,\delta)$ is non-expansive, i.e. $\delta \leq d_Y$.

      (3) $\implies$ (1): Since $d_Y = \rho$, $f$ is a coequalizer of $p_1,p_2$.
