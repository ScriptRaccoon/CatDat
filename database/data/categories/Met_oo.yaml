id: Met_oo
name: category of extended metric spaces
notation: $\Met_{\infty}$
objects: extended metric spaces, i.e. metric spaces where the metric is allowed to assume the value $\infty$
morphisms: non-expansive maps $f$ (also called short maps or $1$-Lipschitz maps), meaning $d(f(x),f(y)) \leq d(x,y)$ for all $x,y$
description: The fact that we allow $\infty$ means that universal constructions work much better when compared to $\Met$.
nlab_link: https://ncatlab.org/nlab/show/Met
keywords:
  - short maps
  - 1-Lipschitz maps

tags:
  - analysis

related:
  - Met
  - Met_c

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Met_{\infty} \to \Set$ and $\Set$ is locally small.

  - property: semi-strongly connected
    proof: Every non-empty metric space is weakly terminal (by using constant maps).

  - property: locally ℵ₁-presentable
    proof: See <a href="https://arxiv.org/abs/1504.02660">Lieberman–Rosický</a>, Example 4.5.

  - property: cartesian filtered colimits
    proof: We can use the same proof as for <a href="/category/Met">$\Met$</a> since the equation $\inf_i \max(r, s_i) = \max(r, \inf_i s_i)$ also holds for $r, s_i \in \IR \cup \{\infty\}$.
    references:
      - Met_cartesian_filtered_colimits

  - property: infinitary extensive
    proof: 'This can be deduced from the infinitary extensivity of <a href="/category/Set">$\Set$</a> as follows. We already know that coproducts and pullbacks exist, and these are preserved by the forgetful functor to $\Set$. More concretely, coproducts are disjoint unions of the underlying sets equipped with the metric that extends the given metrics and assigns distance $\infty$ to points in different summands. Since coproducts are disjoint in $\Set$ and the empty set has a unique metric, it follows immediately that coproducts are disjoint in $\Met_\infty$ as well. It remains to show that coproducts are stable under pullbacks. Let $(X_i)_{i \in I}$ be a family of metric spaces and let $f : T \to \coprod_{i \in I} X_i$ be a non-expansive map. Consider the pullbacks $T_i \coloneqq f^*(X_i)$. These are just the preimages of $X_i$ under $f$, with the metric induced from $T$. Since coproducts in $\Set$ are stable under pullbacks, the canonical non-expansive map $\coprod_{i \in I} T_i \to T$ is bijective. It remains to show that it is isometric. Since each $T_i \to T$ is isometric, it suffices to prove that for $a \in T_i$ and $b \in T_j$, where $i \neq j$, we have $d_T(a,b) = \infty$. Indeed, since $f(a) \in X_i$ and $f(b) \in X_j$, we have $\infty = d_{\coprod_i X_i}(f(a),f(b)) \leq d_T(a,b)$.'

  - property: extremal generator
    proof: A similar proof to the one for <a href="/category/Met">$\Met$</a> shows that $[0, \infty]$, equipped with the metric where $d(x,y) = 0$ if $x=y$ and otherwise $d(x,y) = x+y$, is an extremal generator for $\Met_{\infty}$.
    references:
      - Met_extremal_generator

  - property: extremal cogenerator
    proof: 'The proof is similar to $\Met$: an extremal cogenerator is given by $\IR_+ \cup \{\infty\}$ with the metric extending the usual metric on $\IR_+$ by defining $d(a,\infty) \coloneqq \infty$ for $a \in \IR_+$. Then one checks that the maps $1 + d(a,{-}) : X \to \IR_+ \cup \{\infty\}$ (assigning the value $\infty$ if $d(a,x) = \infty$) are non-expansive and finishes as for <a href="/category/Met">$\Met$</a>.'
    references:
      - Met_extremal_cogenerator

  - property: pushout-stable regular monomorphisms
    proof: >-
      We already know that pushouts exist. Let $i : A \to X$ be a regular monomorphism and $f : A \to Z$ be a non-expansive map. Consider the pushout $P \coloneqq Z \sqcup_A X$ with the morphisms $j : Z \to P$ and $k : X \to P$. By the classification of regular monomorphisms (see below), we may assume that $A \subseteq X$ is a closed subset with the induced metric, and we need to show that $j$ is an isometric embedding with closed image. We will use the metric space $[0,\infty]$ from the classification of regular monomorphisms. Instead of computing the metric of $P$, we will construct non-expansive maps $P \to [0,\infty]$ via the universal property of $P$.

      First, $j$ is isometric: Let $z_0, z \in Z$. Consider the non-expansive map $d(z_0,-) : Z \to [0,\infty]$ and the map $h : X \to [0,\infty]$ defined by
      $$\textstyle h(x) \coloneqq \inf_{a \in A} \bigl(d(z_0,f(a)) + d(a,x)\bigr).$$
      The map $h$ is non-expansive since it is an infimum of non-expansive maps. For $a' \in A$ we have $h(a') = d(z_0,f(a'))$: the inequality $\leq$ follows by taking $a = a'$, and $\geq$ follows from the inequality
      $$d(z_0,f(a)) + d(a,a') \geq d(z_0,f(a)) + d(f(a),f(a')) \geq d(z_0,f(a')),$$
      which holds for all $a \in A$ since $f$ is non-expansive. Hence, there is a non-expansive map $g : P \to [0,\infty]$ with $g \circ j = d(z_0,-)$ and $g \circ k = h$. It follows that
      $$d(j(z_0),j(z)) \geq d(g(j(z_0)),g(j(z))) = d(0,d(z_0,z)) = d(z_0,z).$$
      The reverse inequality holds since $j$ is non-expansive.

      Next, the image of $j$ is closed: The subspace $j(Z) \cup k(X) \subseteq P$ satisfies the universal property of the pushout as well (restrict the codomains of $j$ and $k$), which implies that $j$ and $k$ are jointly surjective. Now let $p \in P \setminus j(Z)$ be fixed. Since $k(a) = j(f(a))$ for $a \in A$, we can write $p = k(x)$ for some $x \in X \setminus A$. Consider the constant map $0 : Z \to [0,\infty]$ and the non-expansive map $d(A,-) : X \to [0,\infty]$. They agree on $A$, so there is a non-expansive map $g : P \to [0,\infty]$ with $g \circ j = 0$ and $g \circ k = d(A,-)$. For every $z \in Z$ we get
      $$d(p,j(z)) \geq d(g(p),g(j(z))) = d(d(A,x),0) = d(A,x).$$
      Since $A$ is closed and $x \notin A$, we have $d(A,x) > 0$. Thus, the open ball around $p$ of radius $d(A,x)$ is disjoint from $j(Z)$, which shows that $j(Z)$ is closed.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: The inclusion $\IQ \hookrightarrow \IR$ provides a counterexample. Alternatively, consider the identity map $(X,2d) \to (X,d)$ for any non-trivial metric space $(X,d)$.

  - property: Malcev
    proof: 'Consider the metric subspace $\{(a,b) \in \IR^2 : a \leq b\}$ of $\IR^2$.'

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \Met_{\infty} \to \Set$ and the relation $R \subseteq U^2$ defined by $R(X) \coloneqq \{(a,b) \in U(X)^2 : d(a,b) \leq 1 \}$. Both are representable: $U$ by the singleton metric space and $R$ by the metric space $\{ 0,1 \}$ where $d(0,1) \coloneqq 1$. It is clear that $R$ is reflexive, but not transitive.'

  - property: cartesian closed
    proof: This is proven in <a href="https://math.stackexchange.com/questions/5131457">MSE/5131457</a>.

  - property: filtered-colimit-stable monomorphisms
    proof: We can copy the proof from <a href="/category/Met">$\Met$</a>.
    references:
      - Met_no_filtered_colimit_stable_monos

  - property: effective cocongruences
    proof: The same counterexample as for <a href="/category/Met">$\Met$</a> works here. The difference in this case is that a binary copower of two copies of $(0,1)$ does exist in $\Met_\infty$. However, this would assign a distance of $\infty$ between points in $(-1,0)$ and points in $(0,1)$, which does not agree with the chosen subspace metric on $(-1,0) \cup (0,1)$.
    references:
      - Met_no_effective_cocongruences

  - property: regular subobject classifier
    proof: The same proof as for <a href="/category/Met">$\Met$</a> works.
    references:
      - Met_no_regular_subobject_classifier

special_objects:
  initial object:
    description: empty metric space
  terminal object:
    description: singleton space
  coproducts:
    description: disjoint union with the metric that extends the given ones and gives points in different spaces the distance $\infty$
  products:
    description: direct products with the metric $d(x,y) = \sup_i d_i(x_i,y_i)$

special_morphisms:
  isomorphisms:
    description: bijective isometries
    proof: This is easy.
  monomorphisms:
    description: injective non-expansive maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphisms:
    description: non-expansive maps with dense image
    proof: See <a href="https://math.stackexchange.com/questions/937387">MSE/937387</a>.
  regular monomorphisms:
    description: isometric embeddings with closed image
    proof: >-
      The proof is similar to the one for <a href="/category/Met_c">$\Met_c$</a>. Equalizers are constructed as in $\Set$, equipped with the induced metric, so they are isometric embeddings. Since metric spaces are Hausdorff and non-expansive maps are continuous, an equalizer of two morphisms $X \rightrightarrows Y$ is a closed subset of $X$. Conversely, let $A \subseteq X$ be a closed subset with the induced metric. Let $[0,\infty]$ be the metric space that extends the usual metric on $[0,\infty)$ by $d(r,\infty) \coloneqq \infty$ for $r \in [0,\infty)$. The map
      $$\textstyle d(A,-) : X \to [0,\infty], \quad x \mapsto \inf_{a \in A} d(a,x)$$
      is non-expansive since it is an infimum of non-expansive maps, and it vanishes precisely on $A$ since $A$ is closed. (If $A$ is empty, it is constant with value $\infty$.) Therefore, $A$ is the equalizer of $d(A,-)$ and the constant map $0 : X \to [0,\infty]$.
