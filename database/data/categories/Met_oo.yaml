id: Met_oo
name: category of extended metric spaces
notation: $\Met_{\infty}$
objects: >-
  An extended metric space is a pair $(X,d_X)$ consisting of a set $X$ and a map $d_X : X \times X \to [0,\infty]$ such that $d_X(x,y) = 0$ holds if and only if $x = y$, $d_X(x,y) = d_X(y,x)$, and $d_X(x,z) \leq d_X(x,y) + d_X(y,z)$ for all $x,y,z \in X$.
morphisms: >-
  A morphism $(X,d_X) \to (Y,d_Y)$ is a non-expansive map (also called short map or $1$-Lipschitz map), i.e. a map $f : X \to Y$ such that $d_Y(f(x),f(x')) \leq d_X(x,x')$ for all $x,x' \in X$.
description: The fact that we allow $\infty$ means that universal constructions work much better when compared to $\Met$.
nlab_link: https://ncatlab.org/nlab/show/Met
keywords:
  - short maps
  - 1-Lipschitz maps

tags:
  - analysis

related:
  - Met
  - Met_c
  - PMet

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Met_{\infty} \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: semi-strongly connected
    proof: Every non-empty extended metric space is weakly terminal (by using constant maps).

  # TODO: perhaps add the category PMet_oo of extended pseudo-metric spaces,
  # and simplify this proof accordingly
  - property: cocomplete
    proof: >-
      Let $D : \I \to \Met_\infty$ be a small diagram with $D(i) = (X_i,d_i)$, and let $(u_i : X_i \to C)_{i \in \I}$ be the colimit of the underlying sets. We call an extended pseudo-metric $\delta$ on $C$ <i>admissible</i> if $\delta(u_i(x),u_i(y)) \leq d_i(x,y)$ for all $i \in \I$ and $x,y \in X_i$. The zero pseudo-metric is admissible, and the pointwise supremum of admissible extended pseudo-metrics is again an admissible extended pseudo-metric. This is where we need the value $\infty$. Hence, there is a largest admissible extended pseudo-metric $\rho$ on $C$. Let $q : C \to C'$ be the quotient map onto $C' \coloneqq C/{\sim}$, where $c \sim c' \iff \rho(c,c') = 0$. By the triangle inequality, there is a well-defined extended metric $d'$ on $C'$ with $d'(q(c),q(c')) \coloneqq \rho(c,c')$. Since $\rho$ is admissible, the maps $q \circ u_i : (X_i,d_i) \to (C',d')$ are non-expansive, and they form a cocone.

      We claim that this cocone is a colimit of $D$. Let $(g_i : (X_i,d_i) \to (Z,d_Z))_{i \in \I}$ be a cocone in $\Met_\infty$, and let $h : C \to Z$ be the unique map with $h \circ u_i = g_i$ for all $i \in \I$. The extended pseudo-metric $\delta(c,c') \coloneqq d_Z(h(c),h(c'))$ on $C$ is admissible, since
      $$\delta(u_i(x),u_i(y)) = d_Z(g_i(x),g_i(y)) \leq d_i(x,y).$$
      Hence, $d_Z(h(c),h(c')) \leq \rho(c,c')$ for all $c,c' \in C$. Since $d_Z$ is an extended metric, this shows that $h$ maps equivalent elements to the same element, so that $h = k \circ q$ for a unique map $k : C' \to Z$. The inequality also shows that $k : (C',d') \to (Z,d_Z)$ is non-expansive, and it satisfies $k \circ q \circ u_i = g_i$ for all $i \in \I$. It is unique: if $k' : C' \to Z$ is another such map, then $k' \circ q \circ u_i = g_i$ for all $i \in \I$, so $k' \circ q = h$ by the universal property of $C$, and hence $k' = k$ since $q$ is surjective.

      Conceptually, this proof shows that the category of extended pseudo-metric spaces is cocomplete, the colimit of $D$ being $(C,\rho)$, and that $\Met_\infty$ is a reflective subcategory of it, the reflection of an extended pseudo-metric space being its quotient by the relation of having distance zero. A reflective subcategory of a cocomplete category is cocomplete.
    label: Met_oo_cocomplete
    check_redundancy: false

  # TODO: perhaps add the category PMet_oo of extended pseudo-metric spaces,
  # and simplify this proof accordingly
  - property: ℵ₁-accessible
    proof: >-
      Let $D : \I \to \Met_\infty$ be a filtered diagram, and let $X_i$, $d_i$, $C$, $u_i$, and $\rho$ be as in the construction of colimits above. Then $\rho(c,c')$ is the infimum of all $d_i(x,y)$, where $i \in \I$ and $x,y \in X_i$ satisfy $u_i(x) = c$ and $u_i(y) = c'$. Indeed, since $\I$ is filtered, this infimum defines an extended pseudo-metric on $C$. It is admissible, and every admissible extended pseudo-metric is bounded by it. Thus, filtered colimits are constructed as for <a href="/category/PMet">$\PMet$</a>, followed by the identification of points at distance zero, as for <a href="/category/Met">$\Met$</a>. Therefore, the proofs of $\aleph_1$-accessibility for $\PMet$ and $\Met$ work verbatim for extended metric spaces. They never use that distances are finite; when $d(x,y) = \infty$, the estimate $d_i(x_i,y_i) \leq d(x,y) + 1/n$ in the proof for $\PMet$ holds for all preimages.

      Alternatively, <a href="https://arxiv.org/abs/1504.02660">Lieberman–Rosický</a>, Examples 4.5 (3), show that $\Met_\infty$ is even locally $\aleph_1$-presentable by identifying it with the category of models of a universal Horn theory in $L_{\omega_1,\omega}$. This proof is more abstract and does not identify the $\aleph_1$-presentable objects, whereas the proof above shows that every countable extended metric space is $\aleph_1$-presentable.
    references:
      - Met_oo_cocomplete
      - PMet_aleph1_accessible
      - Met_aleph1_accessible

  - property: cartesian filtered colimits
    proof: We can use the same proof as for <a href="/category/Met">$\Met$</a> since the equation $\inf_i \max(r, s_i) = \max(r, \inf_i s_i)$ also holds for $r, s_i \in \IR \cup \{\infty\}$.
    references:
      - Met_cartesian_filtered_colimits

  - property: infinitary extensive
    proof: 'This can be deduced from the infinitary extensivity of <a href="/category/Set">$\Set$</a> as follows. We already know that coproducts and pullbacks exist, and these are preserved by the forgetful functor to $\Set$. More concretely, the coproduct of extended metric spaces $(X_i,d_i)$ is $(\coprod_i X_i,d)$, where $d$ extends the metrics $d_i$ and assigns the distance $\infty$ to points in different summands. Since coproducts are disjoint in $\Set$ and the empty set has a unique metric, it follows immediately that coproducts are disjoint in $\Met_\infty$ as well. It remains to show that coproducts are stable under pullbacks. Let $(X_i,d_i)_{i \in I}$ be a family of extended metric spaces, let $(X,d_X)$ be its coproduct with $X = \coprod_{i \in I} X_i$, and let $f : (T,d_T) \to (X,d_X)$ be a morphism. Consider the pullbacks of the coproduct inclusions along $f$. These are just $(T_i,d_{T_i})$, where $T_i \coloneqq f^*(X_i)$ and $d_{T_i}$ is the restriction of $d_T$. Since coproducts in $\Set$ are stable under pullbacks, the canonical non-expansive map from the coproduct of these spaces to $(T,d_T)$ is bijective. It remains to show that it is isometric. Since each $d_{T_i}$ is the restriction of $d_T$, it suffices to prove that for $a \in T_i$ and $b \in T_j$, where $i \neq j$, we have $d_T(a,b) = \infty$. Indeed, since $f(a) \in X_i$ and $f(b) \in X_j$, we have $\infty = d_X(f(a),f(b)) \leq d_T(a,b)$.'

  - property: extremal generator
    proof: A similar proof to the one for <a href="/category/PMet">$\PMet$</a> shows that $([0, \infty],d)$, where $d(x,y) = 0$ if $x=y$ and otherwise $d(x,y) = x+y$, is an extremal generator for $\Met_{\infty}$.
    references:
      - PMet_extremal_generator

  - property: extremal cogenerator
    proof: 'The proof is similar to $\Met$: an extremal cogenerator is given by $(\IR_{>0} \cup \{\infty\},d)$, where $d$ extends the usual metric on $\IR_{>0}$ by $d(a,\infty) \coloneqq \infty$ for $a \in \IR_{>0}$. Then one checks that for every extended metric space $(X,d_X)$ and $a \in X$ the map $1 + d_X(a,{-}) : X \to \IR_{>0} \cup \{\infty\}$ (assigning the value $\infty$ if $d_X(a,x) = \infty$) is non-expansive and finishes as for <a href="/category/Met">$\Met$</a>.'
    references:
      - Met_extremal_cogenerator

  - property: pushout-stable regular monomorphisms
    proof: >-
      We already know that pushouts exist. Let $i : (A,d_A) \to (X,d_X)$ be a regular monomorphism and $f : (A,d_A) \to (Z,d_Z)$ be a morphism. Consider their pushout $(P,d_P)$ with the morphisms $j : (Z,d_Z) \to (P,d_P)$ and $k : (X,d_X) \to (P,d_P)$. By the classification of regular monomorphisms (see below), we may assume that $A \subseteq X$ is a closed subset and that $d_A$ is the restriction of $d_X$, and we need to show that $j$ is an isometric embedding with closed image. We will use the extended metric space $E = ([0,\infty],d_E)$ from the classification of regular monomorphisms. Instead of computing $d_P$, we will construct morphisms $(P,d_P) \to E$ via the universal property of the pushout.

      First, $j$ is isometric: Let $z_0, z \in Z$. Consider the morphism $d_Z(z_0,-) : (Z,d_Z) \to E$ and the map $h : X \to [0,\infty]$ defined by
      $$\textstyle h(x) \coloneqq \inf_{a \in A} \bigl(d_Z(z_0,f(a)) + d_X(a,x)\bigr).$$
      The map $h : X \to [0,\infty]$ is non-expansive since it is an infimum of non-expansive maps. For $a' \in A$ we have $h(a') = d_Z(z_0,f(a'))$: the inequality $\leq$ follows by taking $a = a'$, and $\geq$ follows from the inequality
      $$d_Z(z_0,f(a)) + d_X(a,a') \geq d_Z(z_0,f(a)) + d_Z(f(a),f(a')) \geq d_Z(z_0,f(a')),$$
      which holds for all $a \in A$ since $f$ is non-expansive. Hence, there is a morphism $g : (P,d_P) \to E$ with $g \circ j = d_Z(z_0,-)$ and $g \circ k = h$. It follows that
      $$d_P(j(z_0),j(z)) \geq d_E(g(j(z_0)),g(j(z))) = d_E(0,d_Z(z_0,z)) = d_Z(z_0,z).$$
      The reverse inequality holds since $j$ is non-expansive.

      Next, the image of $j$ is closed: The pair $(P',d_{P'})$, where $P' \coloneqq j(Z) \cup k(X)$ and $d_{P'}$ is the restriction of $d_P$, satisfies the universal property of the pushout as well (restrict the codomains of $j$ and $k$), which implies that $j$ and $k$ are jointly surjective. Now let $p \in P \setminus j(Z)$ be fixed. Since $k(a) = j(f(a))$ for $a \in A$, we can write $p = k(x)$ for some $x \in X \setminus A$. Consider the constant morphism $0 : (Z,d_Z) \to E$ and the morphism $d_X(A,-) : (X,d_X) \to E$. They agree on $A$, so there is a morphism $g : (P,d_P) \to E$ with $g \circ j = 0$ and $g \circ k = d_X(A,-)$. For every $z \in Z$ we get
      $$d_P(p,j(z)) \geq d_E(g(p),g(j(z))) = d_E(d_X(A,x),0) = d_X(A,x).$$
      Since $A$ is closed and $x \notin A$, we have $d_X(A,x) > 0$. Thus, the open ball around $p$ of radius $d_X(A,x)$ is disjoint from $j(Z)$, which shows that $j(Z)$ is closed.

  - property: product-stable epimorphisms
    proof: The proof for <a href="/category/Met">$\Met$</a> works verbatim for arbitrary families, since the supremum of extended metrics is an extended metric.
    references:
      - Met_finite-product-stable_epis
    label: Met_oo_product-stable_epis

unsatisfied_properties:
  - property: skeletal
    proof: The extended metric spaces with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: balanced
    proof: The counterexamples for <a href="/category/Met">$\Met$</a> work here as well.
    references:
      - Met_not_balanced

  - property: Malcev
    proof: The counterexample for <a href="/category/Met">$\Met$</a> works here as well.
    references:
      - Met_not_malcev

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \Met_{\infty} \to \Set$ and the relation $R \subseteq U^2$ defined by $R(X,d_X) \coloneqq \{(a,b) \in X^2 : d_X(a,b) \leq 1 \}$. Both are representable: $U$ by the one-point set with its unique metric and $R$ by $(\{ 0,1 \},d)$ where $d(0,1) \coloneqq 1$. It is clear that $R$ is reflexive, but not transitive.'

  - property: cartesian closed
    proof: This is proven in <a href="https://math.stackexchange.com/questions/5131457">MSE/5131457</a>.

  - property: filtered-colimit-stable monomorphisms
    proof: We can copy the proof from <a href="/category/Met">$\Met$</a>.
    references:
      - Met_no_filtered_colimit_stable_monos

  - property: effective cocongruences
    proof: The same counterexample as for <a href="/category/Met">$\Met$</a> works here. The difference in this case is that a binary copower of $((0,1),d)$ does exist in $\Met_\infty$. However, its metric assigns the distance $\infty$ to points in different summands, whereas $d$ takes only finite values on $C = (-1,0) \cup (0,1)$.
    references:
      - Met_no_effective_cocongruences

  - property: regular subobject classifier
    proof: The same proof as for <a href="/category/Met_c">$\Met_\c$</a> works, since non-expansive maps are continuous and, by the classification of regular monomorphisms (see below), the regular subobjects of an extended metric space $(X,d_X)$ correspond to the closed subsets of $X$.
    references:
      - Met_c_no_regular_subobject_classifier

special_objects:
  initial object:
    description: empty set with its unique metric
  terminal object:
    description: one-point set with its unique metric
  coproducts:
    description: $(\coprod_i X_i,d)$ for extended metric spaces $(X_i,d_i)$, where $d$ extends the metrics $d_i$ and assigns the distance $\infty$ to points in different summands
  products:
    description: '$(\prod_i X_i,d)$ for extended metric spaces $(X_i,d_i)$, where $d(x,y) = \sup_i d_i(x_i,y_i)$'

special_morphisms:
  isomorphism:
    description: bijective isometries
    proof: This is easy.
  monomorphism:
    description: injective non-expansive maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphism:
    description: non-expansive maps with dense image
    proof: See <a href="https://math.stackexchange.com/questions/937387">MSE/937387</a>.
  regular monomorphism:
    description: isometric embeddings with closed image
    proof: >-
      The proof is similar to the one for <a href="/category/Met_c">$\Met_\c$</a>. The equalizer of two morphisms $(X,d_X) \rightrightarrows (Y,d_Y)$ is $(A,d_A)$, where $A \subseteq X$ is the equalizer in $\Set$ and $d_A$ is the restriction of $d_X$, so equalizers are isometric embeddings. Since metric spaces are Hausdorff and non-expansive maps are continuous, an equalizer of two morphisms $(X,d_X) \rightrightarrows (Y,d_Y)$ is a closed subset of $X$. Conversely, let $(X,d_X)$ be an extended metric space, let $A \subseteq X$ be a closed subset, and let $d_A$ be the restriction of $d_X$. Let $d_E$ be the extended metric on $[0,\infty]$ that extends the usual metric on $[0,\infty)$ by $d_E(r,\infty) \coloneqq \infty$ for $r \in [0,\infty)$, and let $E \coloneqq ([0,\infty],d_E)$. The map
      $$\textstyle d_X(A,-) : X \to [0,\infty], \quad x \mapsto \inf_{a \in A} d_X(a,x)$$
      is non-expansive since it is an infimum of non-expansive maps, and it vanishes precisely on $A$ since $A$ is closed. (If $A$ is empty, it is constant with value $\infty$.) Therefore, $(A,d_A)$ is the equalizer of $d_X(A,-)$ and the constant morphism $0 : (X,d_X) \to E$.
  # TODO: perhaps add the category PMet_oo of extended pseudo-metric spaces,
  # and simplify this proof accordingly
  regular epimorphism:
    description: >-
      For a morphism $f : (X,d_X) \to (Y,d_Y)$ the following are equivalent: (1) $f$ is a regular epimorphism. (2) $f$ is surjective and $d_Y$ is the largest extended metric on $Y$ for which $f$ is non-expansive. (3) $f$ is surjective and for all $x,x' \in X$, $d_Y(f(x),f(x'))$ is the infimum (in $[0,\infty]$) of the sums $\sum_{i=0}^{n-1} d_X(x'_i,x_{i+1})$, where $n \geq 0$ and $x_0,\dotsc,x_n,x'_0,\dotsc,x'_n \in X$ satisfy $f(x_0) = f(x)$, $f(x_i) = f(x'_i)$ for $0 \leq i \leq n$, and $f(x'_n) = f(x')$.
    proof: >-
      By the construction of colimits above, every coequalizer is surjective, so every regular epimorphism is surjective. Now let $f : (X,d_X) \to (Y,d_Y)$ be a surjective morphism. The pointwise supremum of all extended pseudo-metrics on $Y$ for which $f$ is non-expansive is again such an extended pseudo-metric. This is the largest one, which we denote by $\rho$. Since $f : (X,d_X) \to (Y,d_Y)$ is non-expansive, we have $d_Y \leq \rho$. We claim that (2) means precisely that $\rho \leq d_Y$. If $\rho \leq d_Y$, then $d_Y = \rho$ is the largest extended pseudo-metric on $Y$ for which $f$ is non-expansive, in particular the largest such extended metric. Conversely, assume (2). Since $d_Y$ is an extended metric, so is $\max(\rho,d_Y)$, and $f$ is non-expansive for it. Hence, $\max(\rho,d_Y) \leq d_Y$ by (2), i.e. $\rho \leq d_Y$.

      (1) $\implies$ (2): Let $f$ be a coequalizer of a pair of morphisms $g,h$. Let $Y' \coloneqq Y/{\sim}$, where $y \sim y' \iff \rho(y,y') = 0$, let $\pi : Y \to Y'$ be the projection, and let $\rho'$ be the extended metric on $Y'$ with $\rho'(\pi(y),\pi(y')) = \rho(y,y')$. Then $\pi \circ f : (X,d_X) \to (Y',\rho')$ is non-expansive and satisfies $\pi \circ f \circ g = \pi \circ f \circ h$. Hence, there is a morphism $k : (Y,d_Y) \to (Y',\rho')$ with $k \circ f = \pi \circ f$. Since $f$ is surjective, we get $k = \pi$, so that
      $$\rho(y,y') = \rho'(\pi(y),\pi(y')) = \rho'(k(y),k(y')) \leq d_Y(y,y')$$
      for all $y,y' \in Y$.

      (2) $\implies$ (1): Assume $\rho \leq d_Y$. We show that $f$ is a coequalizer of its kernel pair $p_1,p_2 : (K,d_K) \rightrightarrows (X,d_X)$, where $K = \{(a,b) \in X \times X : f(a) = f(b)\}$. Let $h : (X,d_X) \to (Z,d_Z)$ be a morphism with $h \circ p_1 = h \circ p_2$, i.e. $f(a) = f(b)$ implies $h(a) = h(b)$ for all $a,b \in X$. Since $f$ is surjective, there is a unique map $\overline{h} : Y \to Z$ with $\overline{h} \circ f = h$. The extended pseudo-metric $\delta$ on $Y$ defined by
      $$\delta(y,y') \coloneqq \max\bigl(d_Y(y,y'), d_Z(\overline{h}(y),\overline{h}(y'))\bigr)$$
      makes $f$ non-expansive, since $d_Y(f(x),f(x')) \leq d_X(x,x')$ and $d_Z(\overline{h}(f(x)),\overline{h}(f(x'))) = d_Z(h(x),h(x')) \leq d_X(x,x')$. By the maximality of $\rho$ and the assumption, we get $\delta \leq \rho \leq d_Y$. Hence, for all $y,y' \in Y$ we have
      $$d_Z(\overline{h}(y),\overline{h}(y')) \leq \delta(y,y') \leq \rho(y,y') \leq d_Y(y,y'),$$
      i.e. $\overline{h} : (Y,d_Y) \to (Z,d_Z)$ is non-expansive.

      (2) $\iff$ (3): The proof for <a href="/category/PMet">$\PMet$</a>, including the construction of coequalizers there, works verbatim for extended pseudo-metrics and shows that $\rho(f(x),f(x'))$ is the infimum in (3).
