id: forked_commutative_square
name: forked commutative square
notation: $\ForkSquare$
objects: $A,B,C,D,E$
morphisms: 'The morphisms are generated by $e : A \to B$, $f : A \to C$, $g : B \to D$, $m : C \to D$ and $u,v : D \rightrightarrows E$, subject to the relations $g \circ e = m \circ f$, $u \circ g = v \circ g$, and $u \circ m = v \circ m$. In total, there are $15$ morphisms.'
description: >-
  This finite category is generated by the graph
  $$\begin{array}{ccccc}
  A & \xrightarrow{\hspace{1em} e \hspace{1em}} & B & & \\
  \text{\scriptsize $f$}\bigg\downarrow\;\, && \;\,\bigg\downarrow\text{\scriptsize $g$} && \\
  C & \xrightarrow{\hspace{1em} m \hspace{1em}} & D &
  \begin{array}{c}
  \xrightarrow{\hspace{1em} u \hspace{1em}}\\
  \xrightarrow{\hspace{1em} v \hspace{1em}}
  \end{array} & E
  \end{array}$$
  and the evident relations: the square commutes, and the parallel pair $u,v$ is equalized by both $g$ and $m$. We have added this category to the database solely as an example of an extremal monomorphism (namely $m$) that is not a strong monomorphism. There is probably no common name for this category, but "forked commutative square" seems like a good fit.
nlab_link: null
tags:
  - category theory

related:
  - walking_fork
  - walking_commutative_square

satisfied_properties:
  - property: small
    proof: This is obvious.

  - property: finite
    proof: This is obvious.

  - property: skeletal
    proof: The five objects are clearly pairwise non-isomorphic.

  - property: one-way
    proof: This is obvious.

  - property: strict initial object
    proof: Clearly, $A$ is an initial object. Since $\id_A$ is the only morphism with codomain $A$, it is strict.

  - property: generator
    proof: 'The only parallel pair of distinct morphisms is $u,v : D \rightrightarrows E$. It follows that $D$ is a generator.'

  - property: cogenerator
    proof: 'The only parallel pair of distinct morphisms is $u,v : D \rightrightarrows E$. It follows that $E$ is a cogenerator.'

  - property: left cancellative
    proof: 'The only parallel pair of distinct morphisms is $u,v : D \rightrightarrows E$. Thus, it is sufficient to prove that every morphism with domain $E$ is a monomorphism. But there is only one such morphism, namely $\id_E$.'

  - property: regular-subobject-trivial
    proof: 'The only parallel pair of distinct morphisms is $u,v : D \rightrightarrows E$, so it suffices to prove that they do not have an equalizer. This is proven in the list of unsatisfied properties.'
    references:
      - forked_commutative_square_no_equalizers

  - property: cosifted limits
    proof: >-
      Let $F : \I \to \ForkSquare$ be a diagram, where $\I$ is a small cosifted category. We need to show that the functor
      $$\textstyle L : \ForkSquare^{\op} \to \Set, \, X \mapsto \lim_{i \in \I} \Hom(X,F(i))$$
      is representable.


      Since $A$ is initial and $\I$ is connected, we have $L(A)=1$ (the singleton set).


      <strong>Case 1:</strong> $F$ hits $A$. Then $L(X)= \varnothing$ for every $X \neq A$, since it maps to $\Hom(X,A) = \varnothing$. Moreover, we have $L(A)=1$. Therefore, $L \cong \Hom(-,A)$.


      <strong>Case 2:</strong> $F$ hits $B$, but does not hit $A$. We claim that $F$ then does not hit $C$. In fact, if $F(i)=B$ and $F(j)=C$, since $\I$ is cosifted, there is a cospan
      $$i \leftarrow k \rightarrow j,$$
      which induces a cospan
      $$B \leftarrow F(k) \rightarrow C.$$
      But then $F(k)=A$ is forced, contradicting our assumption that $F$ does not hit $A$. Therefore, $F$ takes values in $\{B,D,E\}$. Since $B$ has a unique morphism to each of these objects and $\I$ is connected, we see that $L(B)=1$. Moreover, we have $L(C)=\varnothing$ since it maps to $\Hom(C,B)=\varnothing$, and for the same reason we have $L(D)=\varnothing$ and $L(E)=\varnothing$. From these values, it is clear that $L \cong \Hom(-,B)$. (There is a bijection for each object, and naturality is automatic since we are only dealing with sets with at most one element.)


      <strong>Case 3:</strong> $F$ hits $C$, but does not hit $A$. This is symmetric to Case 2 and leads to $L \cong \Hom(-,C)$. In fact, there is an automorphism of $\ForkSquare$ that swaps $B$ and $C$.


      <strong>Case 4:</strong> $F$ only hits $E$. Then $F$ is the constant functor with value $E$, since $\End(E)=\{\id_E\}$. Since $\I$ is connected, it follows that $L \cong \Hom(-,E)$.


      <strong>Case 5:</strong> $F$ takes values in $\{D,E\}$ and hits $D$. In this case, we will show that $L \cong \Hom(-,D)$. Choose $i_0 \in \I$ with
      $$F(i_0)=D.$$
      Since there is no morphism $E \to D = F(i_0)$, we have $L(E) = \varnothing$. We already know $L(A)=1$. Since $B$ has a unique morphism to each value of $F$ and $\I$ is connected, we see that $L(B)=1$. For the same reason, we have $L(C)=1$. Therefore, it remains to show that $L(D)=1$.


      We first show that $L(D)$ has at most one element. Assume that $x,y \in L(D)$. For every $i \in \I$ we have morphisms $x_i,y_i : D \to F(i)$. Since $D$ has only one endomorphism, namely the identity, we must have $x_{i_0} = \id_D = y_{i_0}$. Since $\I$ is connected, it therefore remains to show that
      $$x_i = y_i \iff x_j = y_j$$
      for morphisms $\alpha : i \to j$. Because of the relations
      $$x_j = F(\alpha) \circ x_i, \quad y_j = F(\alpha) \circ y_i,$$
      the direction $\implies$ is clear. Now assume that $x_j = y_j$ holds. If $F(\alpha)$ is the identity, we have $x_i = y_i$. Otherwise, since $F$ takes only values in $\{D,E\}$, we must have $F(\alpha) \in \{u,v\}$ and hence $F(i)=D$ and $F(j)=E$. But then both $x_i$ and $y_i$ are endomorphisms of $D$ and therefore both equal to $\id_D$.


      Finally, we will construct an element of $L(D)$ (and this is where we will use the full strength of the assumption that $\I$ is cosifted). For any $i \in \I$, choose a cospan
      $$\begin{CD} i_0 @<{\beta}<< k @>{\alpha}>> i.\end{CD}$$
      It induces a cospan
      $$\begin{CD} D @<{F(\beta)}<< F(k) @>{F(\alpha)}>> F(i).\end{CD}$$
      Since $F(k)$ is either $D$ or $E$, but has a morphism to $D$, it must be $D$, and $F(\beta)=\id_D$ is forced. Therefore, we may define
      $$x_i := F(\alpha) : D \to F(i).$$
      We need to show that this morphism does not depend on the choice of the cospan. Since $\I$ is cosifted, the category of cospans over $(i_0,i)$ is connected. Thus, for another cospan
      $$\begin{CD} i_0 @<{\beta'}<< k' @>{\alpha'}>> i.\end{CD}$$
      that induces another morphism $F(\alpha') : D \to F(i)$, we may assume that it receives a morphism from the given one:
      $$\begin{CD} i_0 @<{\beta}<< k @>{\alpha}>> i \\
      @V{\id}VV @VV{\gamma}V @VV{\id}V \\
      i_0 @<<{\beta'}< k' @>>{\alpha'}> i
      \end{CD}$$
      The induced diagram in $\ForkSquare$ is very simple, since $D$ has only one endomorphism, the identity:
      $$\begin{CD} D @<{\id}<< D @>{F(\alpha)}>> F(i) \\
      @V{\id}VV @VV{\id}V @VV{\id}V \\
      D @<<{\id}< D @>>{F(\alpha')}> F(i)
      \end{CD}$$
      Therefore, $F(\alpha) = F(\alpha')$. This proves that $x_i : D \to F(i)$ is well-defined.


      The morphisms $x_i : D \to F(i)$ are compatible with respect to morphisms $\gamma : i \to j$: If we use the cospan
      $$\begin{CD} i_0 @<{\beta}<< k @>{\alpha}>> i\end{CD}$$
      to compute $x_i$, we use the cospan
      $$\begin{CD} i_0 @<{\beta}<< k @>{\alpha}>> i @>{\gamma}>> j\end{CD}$$
      to compute $x_j$. Thus,
      $$x_j = F(\gamma \circ \alpha) = F(\gamma) \circ F(\alpha) = F(\gamma) \circ x_i.$$
      Therefore, $x = (x_i)_{i \in \I}$ is a well-defined element of $L(D)$, and the proof is finished.

unsatisfied_properties:
  - property: semi-strongly connected
    proof: There is no morphism $B \to C$ and no morphism $C \to B$.

  - property: equalizers
    proof: 'The morphisms $u,v : D \rightrightarrows E$ do not have an equalizer: the four morphisms with codomain $D$ are $g$, $m$, $g \circ e = m \circ f$, and $\id_D$. But $\id_D$ does not equalize $u,v$. The other three morphisms equalize $u,v$, but they are not universal: $m$ is not universal since $g$ does not factor through it, $g$ is not universal since $m$ does not factor through it, and $g \circ e$ is not universal since $g$ does not factor through it.'
    label: forked_commutative_square_no_equalizers

  - property: pullbacks
    proof: 'Any two parallel morphisms with codomain $D$ are equal. It follows that a pullback of the cospan $D \xrightarrow{u} E \xleftarrow{v} D$ would be an equalizer of $u,v : D \rightrightarrows E$, which we know does not exist.'
    references:
      - forked_commutative_square_no_equalizers

  - property: extremal generator
    proof: 'Since both $m$ and $g$ equalize $u,v$, it is easy to see that $D$ is the only generator. But it is not extremal since $e$ induces a bijection $e_* : \Hom(D,A) \to \Hom(D,B)$ (both sets are empty), without $e$ being an isomorphism.'

  - property: extremal cogenerator
    proof: 'We already saw that $E$ is a cogenerator, and it is also the only one because any cogenerator must admit a morphism from $E$ to be able to distinguish $u,v$. But $E$ is not extremal since $f$ induces a bijection $f^* : \Hom(C,E) \to \Hom(A,E)$ (both sets are singletons), without $f$ being an isomorphism.'

special_objects:
  initial object:
    description: $A$

special_morphisms:
  epimorphisms:
    description: all morphisms except for the three non-identity morphisms with codomain $D$, namely $g$, $m$, and the diagonal $g \circ e$
    proof: 'Every one of the three non-identity morphisms with codomain $D$ equalizes $u,v$, and thus cannot be an epimorphism. Conversely, the identity morphisms are of course epimorphisms, and if a morphism does not have codomain $D$, then it is an epimorphism because the only parallel pair of distinct morphisms is $u,v : D \rightrightarrows E$.'
