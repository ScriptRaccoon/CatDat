id: Meas
name: category of measurable spaces
notation: $\Meas$
objects: measurable spaces
morphisms: measurable maps
description: This category is similar to the category of topological spaces. For instance, limits and colimits can be constructed in the same way. However, a main difference is that this category is not infinitary distributive.
nlab_link: https://ncatlab.org/nlab/show/Meas

tags:
  - analysis

related:
  - Top
  - Unif

comments:
  - The thread <a href="https://math.stackexchange.com/questions/5024471/">MSE/5024471</a> asks for the finitely presentable objects of this category.

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Meas \to \Set$ and $\Set$ is locally small.

  - property: semi-strongly connected
    proof: Every non-empty measurable space is weakly terminal (by using constant maps).

  - property: generator
    proof: The one-point measurable space (with the unique $\sigma$-algebra) is a generator since it represents the forgetful functor $\Meas \to \Set$.

  - property: well-powered
    proof: This follows from the fact that monomorphisms are injective in this category.

  - property: well-copowered
    proof: This follows from the fact that epimorphisms are surjective in this category.

  - property: complete
    proof: Take the limit of the underlying sets and take the smallest $\sigma$-algebra making all projections measurable.

  - property: cocomplete
    proof: Take the colimit of the underlying sets and take the largest $\sigma$-algebra making all inclusions measurable. That is, a set is measurable iff its preimage under each inclusion is measurable.
    check_redundancy: false

  - property: coregular
    proof: >-
      The proof is similar to the proof for <a href="/category/Top">$\Top$</a>. We already know that (finite) colimits and equalizers exist, and that they are preserved by the forgetful functor to $\Set$. It remains to show that regular monomorphisms, i.e. embeddings, are stable under pushouts. Thus, let $i : A \to X$ be an embedding and let $f : A \to Y$ be any measurable map. We claim that the induced measurable map
      $$j : Y \to Y \sqcup_A X$$
      is again an embedding. It is certainly injective, since <a href="/category/Set">$\Set$</a> is coregular. More precisely, the underlying set of $Y \sqcup_A X$ can be identified with $Y \sqcup (X \setminus \im(i))$. Now let $T \subseteq Y$ be a measurable subset. Then its preimage $f^*(T) \subseteq A$ is measurable. Since $i$ is an embedding, there exists a measurable subset $S \subseteq X$ such that $i^*(S) = f^*(T)$. Let $u : X \to Y \sqcup_A X$ denote the canonical map, so that $u \circ i = j \circ f$, and consider the subset
      $$M \coloneqq j_*(T) \cup u_*(S \setminus \im(i))$$
      of the pushout. It is straightforward to verify that $j^*(M) = T$ and $u^*(M) = S$. Since both $T$ and $S$ are measurable, it follows that $M$ is measurable. Finally, the equality $j^*(M) = T$ shows that every measurable subset of $Y$ is the preimage of a measurable subset of the pushout. Hence $j$ is an embedding, as claimed.
    references:
      - top_coregular

  - property: countably extensive
    proof: >-
      This follows from the countable extensivity of <a href="/category/Set">$\Set$</a> as follows. We already know that coproducts and pullbacks exist, and that they are preserved by the forgetful functor to $\Set$. More concretely, coproducts are disjoint unions of the underlying sets, with measurable subsets given by unions of measurable subsets of the summands. Since coproducts are disjoint in $\Set$ and the empty set has a unique $\sigma$-algebra, it follows immediately that coproducts are disjoint in $\Meas$ as well.

      It remains to show that <i>countable</i> coproducts are stable under pullbacks. Let $(X_i)_{i \in I}$ be a countable family of measurable spaces and let $f : T \to \coprod_{i \in I} X_i$ be a measurable map. Consider the pullbacks $T_i \coloneqq f^*(X_i)$. These are simply the preimages of $X_i$ under $f$, equipped with the $\sigma$-algebra induced from $T$. Since coproducts in $\Set$ are stable under pullbacks, the canonical measurable map $\coprod_{i \in I} T_i \to T$ is bijective. It remains to show that it maps measurable sets to measurable sets.

      A measurable subset of $\coprod_{i \in I} T_i$ has the form $A = \coprod_{i \in I} (B_i \cap T_i)$, where each $B_i$ is a measurable subset of $T$. The image of $A$ in $T$ is $\bigcup_{i \in I} (B_i \cap T_i)$. Since this is a countable union, it suffices to show that each $B_i \cap T_i$ is measurable in $T$. This holds because $T_i$ is measurable in $T$ (since $X_i$ is measurable in the coproduct and $f$ is measurable) and $B_i$ is measurable in $T$ by assumption.

  - property: filtered-colimit-stable monomorphisms
    proof: This follows from Lemma 2 <a href="/content/subcategories">here</a> applied to the forgetful functor to $\Set$.

  - property: regular subobject classifier
    proof: The set $\{0,1\}$ with the trivial $\sigma$-algebra is a regular subobject classifier since measurable maps $X \to \{0,1\}$ correspond to subsets of $X$.

  - property: extremal cogenerator
    proof: >-
      First, take the two-element set $2$ endowed with the trivial $\sigma$-algebra (where only $\varnothing$ and $2$ are measurable), and use that $2$ is a cogenerator for $\Set$ to show that $2$ with the trivial $\sigma$-algebra is a cogenerator for $\Meas$.

      Now, we claim that adding the two-element set $2$ endowed with the discrete $\sigma$-algebra (where every subset is measurable) gives an extremal cogenerating set. To see this, suppose we have a morphism $f : (X, \M_X) \to (Y, \M_Y)$ such that $f \circ {-} : \Hom(Y, Q) \to \Hom(X, Q)$ is a bijection if $Q$ is either measurable space. Since $2$ with the trivial $\sigma$-algebra represents taking the power set of the underlying set, and <a href="/functor/power_set_contravariant">the contravariant power set functor on $\Set$</a> is conservative, we conclude that $f$ is a bijection on the underlying sets. Also, since $2$ with the discrete $\sigma$-algebra represents the functor $(X, \M_X) \mapsto \M_X$, we see that $f^* : \M_Y \to \M_X$ is also a bijection. This shows that $f$ is an isomorphism of measurable spaces.

      Finally, using <a href="/content/generator_construction">this result</a>, we conclude that the product of these two measurable spaces with underlying set $2$ is an extremal cogenerator of $\Meas$.
    references:
      - set_extremal_cogenerator

  - property: co-Malcev
    proof: >-
      Let $i_1,i_2 : X \rightrightarrows R$ be a coreflexive corelation of measurable spaces. Thus, $i_1,i_2$ are jointly surjective measurable maps with a common retraction $r : R \twoheadrightarrow X$.
      To show that $(i_1,i_2)$ is cosymmetric, define the map of sets $s : R \to R$ by
      $$s(i_1(x)) \coloneqq i_2(x), \quad s(i_2(x)) \coloneqq i_1(x).$$
      This is well-defined by a direct calculation or by using the fact that <a href="/category/Set">$\Set$</a> is co-Malcev. We need to show that $s$ is measurable. To this end, let $B \subseteq R$ be a measurable subset. Its preimages
      $$A_1 \coloneqq i_1^*(B), \quad A_2 \coloneqq i_2^*(B)$$
      are measurable subsets of $X$. We claim that
      $$s^*(B) = \bigl((r^*(A_1) \cup r^*(A_2)) \setminus B\bigr) \cup r^*(A_1 \cap A_2), \tag{1}$$
      which will prove in particular that $s^*(B)$ is measurable, as required. Let $y \in R$. Since $R = i_1(X) \cup i_2(X)$, we may assume without loss of generality that $y = i_1(x)$ for some $x \in X$. The following are equivalent:
      $$y \in (r^*(A_1) \cup r^*(A_2)) \setminus B \iff x \in (A_1 \cup A_2) \setminus A_1,$$
      $$y \in r^*(A_1 \cap A_2) \iff x \in A_1 \cap A_2.$$
      Hence, $y$ lies in the RHS of $(1)$ if and only if
      $$x \in ((A_1 \cup A_2) \setminus A_1) \cup (A_1 \cap A_2) = A_2 = i_2^*(B),$$
      which means that $s(y) = i_2(x)$ lies in $B$. This proves $(1)$.

      It remains to show that $(i_1,i_2)$ is cotransitive. We adopt the functorial point of view (simply to avoid talking about pushouts) and show that the subfunctor $\Hom(R,-) \hookrightarrow \Hom(X,-)^2$ is transitive. That is, given three measurable maps $u,v,w : X \rightrightrightarrows T$ into some measurable space $T$ and two measurable maps $f,g : R \rightrightarrows T$ such that
      $$f i_1 = u, \quad f i_2 = v = g i_1, \quad g i_2 = w,$$
      we need to show that there is a measurable map $h : R \to T$ with $h i_1 = u$ and $h i_2 = w$. We can certainly define $h$ as a map of sets by
      $$h(i_1(x)) \coloneqq u(x), \quad h(i_2(x)) \coloneqq w(x),$$
      which is well-defined by a direct calculation or again by using the fact that $\Set$ is co-Malcev. We need to show that $h$ is measurable. Let $C \subseteq T$ be a measurable subset. Its preimages
      $$B_1 \coloneqq f^*(C), \quad B_2 \coloneqq g^*(C)$$
      are measurable subsets of $R$. Notice that $f i_2 = g i_1$ implies
      $$A \coloneqq i_2^*(B_1) = i_1^*(B_2) \subseteq X.$$
      We claim that
      $$h^*(C) = \bigl((B_1 \cup B_2) \setminus r^*(A)\bigr) \cup (B_1 \cap B_2), \tag{2}$$
      which will prove that $h^*(C)$ is measurable. Let $y \in R$. There are two cases to consider.

      Case 1: We have $y = i_1(x)$ for some $x \in X$. The following are equivalent:
      $$y \in (B_1 \cup B_2) \setminus r^*(A) \iff (u(x) \in C \vee v(x) \in C) \wedge v(x) \notin C,$$
      $$y \in B_1 \cap B_2 \iff (u(x) \in C \wedge v(x) \in C).$$
      Hence, $y$ lies in the RHS of $(2)$ if and only if $h(y) = u(x) \in C$, i.e. $y \in h^*(C)$.

      Case 2: We have $y = i_2(x)$ for some $x \in X$. The following are equivalent:
      $$y \in (B_1 \cup B_2) \setminus r^*(A) \iff (v(x) \in C \vee w(x) \in C) \wedge v(x) \notin C,$$
      $$y \in B_1 \cap B_2 \iff (v(x) \in C \wedge w(x) \in C).$$
      Hence, $y$ lies in the RHS of $(2)$ if and only if $h(y) = w(x) \in C$, i.e. $y \in h^*(C)$.

      This proves $(2)$. We conclude that the corelation $(i_1,i_2)$ is both cosymmetric and cotransitive.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: cofiltered-limit-stable epimorphisms
    proof: We already know that <a href="/category/Set">$\Set$</a> does not have this property. Now apply the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> to the functor $\Set \to \Meas$ which equips a set with the trivial $\sigma$-algebra.

  - property: effective cocongruences
    proof: 'The proof is similar to the one for <a href="/category/Top">$\Top$</a>: Use the trivial $\sigma$-algebra on a two-point set.'
    references:
      - top_no_effective_cocongruences

  - property: regular
    proof: >-
      In a regular category, regular epimorphisms are stable under pullbacks and compositions (see Prop. 3.7 at the <a href="https://ncatlab.org/nlab/show/regular+epimorphism">nLab</a>), which implies that for every regular epimorphism $f : X \to Y$ also $f \times f : X \times X \to Y \times Y$ is a regular epimorphism. We will show that this fails in $\Meas$.


      Let $X \coloneqq [0, 1)$ equipped with the standard Borel $\sigma$-algebra $\B$. Consider the equivalence relation $x \sim y \iff x-y \in \IQ$, let $Y \coloneqq X /{\sim}$ be the set of equivalence classes, and $f: X \to Y$ be the natural projection map. Equip $Y$ with the quotient $\sigma$-algebra $\Sigma_Y$, so that $f$ is a regular epimorphism.


      Now consider the diagonal in the quotient space $\Delta_Y \coloneqq \{(y, y) \mid y \in Y\}$. Then
      $$\textstyle (f \times f)^{-1}(\Delta_Y) = \{(x_1, x_2) \in [0, 1)^2 \mid x_1 - x_2  \in \IQ\} \eqqcolon \bigcup_{q \in \IQ} L_q$$
      where each $L_q$ is the intersection of the diagonal level sets of $x_1 - x_2$ with $[0, 1)^2$. Because each line is closed in $\IR^2$, its intersection with $[0, 1)^2$ is a Borel set in $X \times X$. Since a countable union of Borel sets is Borel, $(f \times f)^{-1}(\Delta_Y) \in \B \otimes \B$.


      Now take any set $B \in \Sigma_Y$. Its preimage $f^{-1}(B)$ is a Borel set in $[0, 1)$ that is invariant under rational translations modulo 1. Because the action of $\IQ / \IZ$ on $[0, 1)$ is ergodic, the Lebesgue measure $\lambda(f^{-1}(B))$ must be exactly $0$ or $1$. Assume for contradiction that $\Sigma_Y$ is countably separated, i.e. there exists a countable sequence of measurable sets $(B_n)_{n \geq 1}$ in $\Sigma_Y$ that separates the points of $Y$. Let $A_n \coloneqq f^{-1}(B_n)$. Every $A_n$ has $\lambda(A_n) = 0$ or $\lambda(A_n) = 1$.


      Define a "bad set" $N \subseteq [0, 1)$ as
      $$\textstyle N \coloneqq \left( \bigcup_{\lambda(A_n)=0} A_n \right) \cup \left( \bigcup_{\lambda(A_n)=1} A_n^c \right)$$
      Because $N$ is a countable union of sets with measure $0$, we have $\lambda(N) = 0$, and thus $\lambda([0, 1) \setminus N)=1$. For any two points $x, y \in [0, 1) \setminus N$, clearly $x \in A_n \iff y \in A_n$ for every $n$. Consequently, the sequence $(B_n)$ fails to separate $f(x)$ and $f(y)$. Hence, $x \sim y$. Since $[0, 1) \setminus N$ has measure $1$, it is uncountable. Because each equivalence class is only countable, these uncountably many points must belong to uncountably many different equivalence classes. Thus, we can easily pick $x, y \in [0, 1) \setminus N$ where $x \not\sim y$. Thus $\Sigma_Y$ is not countably separated.


      Hence by Theorem 6.5.7 in Bogachev's <a href="https://link.springer.com/book/10.1007/978-3-540-34514-5" target="_blank">Measure theory</a> $\Delta_Y \notin \Sigma_Y \otimes \Sigma_Y$. We have identified a non-measurable subset of $Y \times Y$ whose preimage under $f \times f$ is measurable. Therefore, $f \times f$ is not a regular epimorphism.

  - property: extremal generating set
    proof: >-
      The proof is similar to the one for <a href="/category/Top">$\Top$</a>. In this case, suppose $\kappa$ is an uncountable regular cardinal. We can then define $\M_\kappa$ to be the collection of subsets $E \subseteq \kappa + 1$ such that there exists an ordinal $\alpha < \kappa$ such that for each $\beta \in [\alpha, \kappa)$, $\beta \in E$ if and only if $\kappa \in E$. This is easily checked to be a $\sigma$-algebra on $\kappa + 1$. Similarly, define $\M_\kappa'$ to be the $\sigma$-algebra generated by $\M_\kappa \cup \{ \{ \kappa \} \}$; this can be described as the set of $E \subseteq \kappa + 1$ such that there exists an ordinal $\alpha < \kappa$ such that for each $\beta, \gamma \in [\alpha, \kappa)$, $\beta \in E$ if and only if $\gamma \in E$.

      Now, suppose $S$ is a set of measurable spaces, and let $\kappa$ be an uncountable regular cardinal greater than $\card(G)$ for each $G \in S$. We claim that the bijective measurable map
      $$(\kappa+1, M_\kappa') \to (\kappa+1, \M_\kappa), \, \alpha \mapsto \alpha,$$
      which is not an isomorphism, induces a bijection
      $$\Hom(G, (\kappa + 1, \M_\kappa')) \to \Hom(G, (\kappa + 1, \M_\kappa))$$
      for each $G \in S$, implying that $S$ cannot be an extremal generating set. In fact, if $f : G \to (\kappa + 1, \M_\kappa)$ is a measurable map, since $\kappa$ is regular and $\card(G) < \kappa$, there exists an ordinal $\alpha < \kappa$ which is an upper bound for $\im(f) \cap [0, \kappa)$. Therefore, $f^*(\{\kappa\}) = f^*([\alpha + 1, \kappa])$ is measurable, implying that $f$ factors through $(\kappa + 1, \M_\kappa')$.
    references:
      - top_no_extremal_generating_set

  - property: infinitary distributive
    proof: >-
      Let $X$ be a set of cardinality $> 2^{\aleph_0}$. We equip $X$ with the discrete $\sigma$-algebra. If $1$ denotes the singleton space, we therefore have $X \cong \coprod_{x \in X} 1$ in $\Meas$. However, we claim that the canonical bijective measurable map
      $$\textstyle\coprod_{x,y \in X} 1 \to X \times X$$
      is not an isomorphism, i.e. that $X \times X$ does not carry the discrete $\sigma$-algebra. More precisely, we will show that the diagonal $\Delta \subseteq X \times X$ is not measurable. (This is well-known and is remarked for example at the end of chapter 1 in Wengenroth's book <a href="https://doi.org/10.1515/9783110203592" target="_blank">Wahrscheinlichkeitstheorie</a>, but we include the proof nevertheless.)

      Assume that $\Delta \subseteq X \times X$ is measurable. Then (cf. <a href="https://math.stackexchange.com/questions/61617" target="_blank">MSE/61617</a>) there is a countable family of rectangles $(A_n \times B_n)_{n \in \IN}$ such that $\Delta \in \sigma(\{A_n \times B_n : n \in \IN\})$. Consider the product of the characteristic functions
      $$((\chi_{A_n})_n,(\chi_{B_n})_n) : X \to \{0,1\}^{\IN} \times \{0,1\}^{\IN}.$$
      Its kernel is an equivalence relation $\sim$ on $X$, namely, $x \sim y$ if and only if, for all $n$, we have $x \in A_n \iff y \in A_n$ and $x \in B_n \iff y \in B_n$. The set $X/{\sim}$ of equivalence classes embeds into $\{0,1\}^{\IN} \times \{0,1\}^{\IN}$ and therefore has at most $2^{\aleph_0}$ elements. By our assumption on $X$, the projection $X \to X/{\sim}$ cannot be injective. Thus, $\sim$ is not trivial.

      Next, consider the collection of all subsets $E \subseteq X \times X$ with the property that, whenever $x \sim y$, we have $(x,y) \in E \iff (x,x) \in E$. It is easily seen that this collection is a $\sigma$-algebra on $X \times X$. Moreover, it contains each rectangle $A_n \times B_n$. Therefore, it also contains the diagonal $\Delta$. But this means that $x \sim y$ implies $x=y$, i.e. that $\sim$ is trivial. This contradiction proves that the diagonal is not measurable.

  - property: coaccessible
    proof: 'The proof is very similar to the proof for <a href="/category/Top">$\Top$</a>. Assume $\Meas$ is coaccessible. Let $p : D \to I$ be the identity map from the two-element discrete space to the two-element indiscrete space. Then, a measurable space is discrete if and only if it is projective to the morphism $p$. This implies that the full subcategory spanned by all discrete measurable spaces, which is equivalent to $\Set$, is coaccessible by Prop. 4.7 in <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a>. However, since <a href="/category/Set">$\Set$</a> is not coaccessible, this is a contradiction.'
    references:
      - top_not_coaccessible

special_objects:
  initial object:
    description: empty set with the unique $\sigma$-algebra
  terminal object:
    description: singleton set with the unique $\sigma$-algebra
  coproducts:
    description: disjoint union with the obvious $\sigma$-algebra
  products:
    description: direct products with the <a href="https://de.wikipedia.org/wiki/Produkt-%CF%83-Algebra" target="_blank">product $\sigma$-algebra</a>

special_morphisms:
  isomorphisms:
    description: bijective measurable maps that map measurable sets to measurable sets
    proof: This is easy.
  monomorphisms:
    description: injective measurable maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphisms:
    description: surjective measurable maps
    proof: Use the same proof as for sets, where $2 = \{0,1\}$ is endowed with the trivial $\sigma$-algebra.
  regular monomorphisms:
    description: embeddings
    proof: '(This is the same proof as for <a href="/category/Top">$\Top$</a>.) Equalizers are embeddings by their construction. Conversely, if $f : X \to Y$ is an embedding, then $f$ is the equalizer of the two characteristic maps $\chi_Y, \chi_{f(X)} : Y \rightrightarrows \{0,1\}$, where $\{0,1\}$ carries the trivial $\sigma$-algebra.'
  regular epimorphisms:
    description: 'A measurable map $f : X \to Y$ is a regular epimorphism iff $f$ is surjective and $f$ is a quotient map, meaning that a subset of $Y$ is measurable when its $f$-preimage is measurable.'
    proof: 'The proof works the same as for $\Top$ (and can in fact be generalized to topological functors). Regular epimorphisms are surjective quotient maps by the explicit construction of coequalizers. Conversely, if $q : X \to Y$ is a surjective quotient map, then one checks that $q$ is the coequalizer of its kernel pair $X \times_Y X \rightrightarrows X$: This is true for the underlying sets, and measurability of the induced morphism follows since $q$ is a quotient map.'
