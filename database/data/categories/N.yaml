id: N
name: partially ordered set of natural numbers
notation: $(\IN,\leq)$
objects: natural numbers $0, 1, 2, \dotsc$
morphisms: 'a unique morphism $(n,m) : n \to m$ if $n \leq m$'
description: >-
  This category can also be seen as the path category of the infinite linear graph
  $$\bullet \longrightarrow \bullet \longrightarrow \bullet \longrightarrow \cdots.$$
nlab_link: null
keywords:
  - poset of natural numbers

tags:
  - number theory

related:
  - N_oo
  - omega1
  - On
  - Z_div

satisfied_properties:
  - property: small
    proof: 'The objects form the set $\IN$, and the morphisms form the set $\{(n,m) \in \IN^2 : n \leq m\}$.'

  - property: countable
    proof: 'The objects form the countable set $\IN$, and the morphisms form the set $\{(n,m) \in \IN^2 : n \leq m\}$, which is countable as a subset of $\IN^2$.'

  - property: thin
    proof: By definition, there is at most one morphism between any two objects.

  - property: semi-strongly connected
    proof: For all $n,m \in \IN$ we have $n \leq m$ or $m \leq n$, hence there is a morphism $n \to m$ or $m \to n$.

  - property: direct
    proof: This is because the natural numbers with respect to $<$ are well-founded.

unsatisfied_properties:
  - property: countable coproducts
    proof: The numbers $0,1,2,\dotsc$ have no supremum, i.e. no coproduct.

  - property: extremal generator
    proof: The poset $(\IN,\leq)$ has infinitely many non-minimal elements $1, 2, \dotsc$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal generator cannot exist.

  - property: extremal cogenerator
    proof: The poset $\IN$ has infinitely many non-maximal elements $0, 1, 2, \dotsc$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal cogenerator cannot exist.

special_objects:
  initial object:
    description: $0$
  products:
    description: '[non-empty case] minimum'
  coproducts:
    description: '[finite case] supremum'

special_morphisms:
  isomorphism:
    description: only the identity morphisms
    proof: This is true for every poset (regarded as a thin category).
