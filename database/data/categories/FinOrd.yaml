id: FinOrd
name: category of finite ordered sets
notation: $\FinOrd$
objects: finite (totally) ordered sets
morphisms: order-preserving maps
description: The finite ordered sets of the form $\{1 < \dotsc < n\}$ for $n \in \IN$ provide a skeleton (including the empty set for $n = 0$), the augmented simplex category.
nlab_link: https://ncatlab.org/nlab/show/total+order
keywords:
  - finite ordinals
  - augmented simplex category

tags:
  - order theory
  - topology
  - relational structures

related:
  - Ord
  - Delta
  - FinSet
  - Pos

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\FinOrd \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: locally finite
    proof: There is a faithful functor $\FinOrd \to \FinSet$ and <a href="/category/FinSet">$\FinSet$</a> is locally finite.

  - property: essentially countable
    proof: Every finite ordered set is isomorphic to $\{0 < \cdots < n-1 \}$ for some $n \in \IN$.

  - property: strict initial object
    proof: The empty ordered set is initial and is clearly strict.

  - property: terminal object
    proof: Take the singleton set with the unique ordering.

  - property: semi-strongly connected
    proof: Every non-empty totally ordered set is weakly terminal (by using constant maps).

  - property: extremal generator
    proof: The ordered set $\{0 < 1\}$ is an extremal generator, even for <a href="/category/PreOrd">$\PreOrd$</a>. Now apply Lemma 10 <a href="/content/subcategories">here</a>.
    references:
      - PreOrd_extremal_generator

  - property: extremal cogenerator
    proof: The ordered set $\{0 < 1\}$ is an extremal cogenerator, even for <a href="/category/Pos">$\Pos$</a>. Now apply Lemma 10 <a href="/content/subcategories">here</a>.
    references:
      - Pos_extremal_cogenerator

  - property: equalizers
    proof: Take the equalizer in <a href="/category/FinSet">$\FinSet$</a> and restrict the order.

  - property: coequalizers
    proof: >-
      Let $f,g : X \rightrightarrows Y$ be two morphisms in $\FinOrd$, and let $q : Y \to C$ be their coequalizer in <a href="/category/Ord">$\Ord$</a>. Since $q$ is an epimorphism in $\Ord$, it is surjective, so $C$ is finite. Since the inclusion $\FinOrd \hookrightarrow \Ord$ is fully faithful, $q$ is also the coequalizer in $\FinOrd$.

      Alternatively, here is a direct proof: It suffices to construct quotients by equivalence relations. Let $\sim$ be an equivalence relation on $X$, where $(X,\leq)$ is a finite ordered set. Since $X$ is finite, by induction we may assume that $\sim$ is generated by a single relation $(a,b)$. If $a=b$, there is nothing to prove. If $a < b$ and $X = \{0,1,\dotsc,n-1\}$ with the usual order, the quotient is $\{0,1,\dotsc,a,b+1,\dotsc,n-1\}$ with the usual order.

  - property: mono-regular
    proof: >-
      Let $i : A \to B$ be a monomorphism, i.e. an injective order-preserving map (see below). If $A$ is empty, then $i$ is the equalizer of the two constant maps $B \rightrightarrows \{0 < 1\}$. Otherwise, we claim that $i$ is a split monomorphism, hence a regular monomorphism. We define $r : B \to A$ by
      $$r(b) \coloneqq \max \bigl(\{\min A\} \cup \{a \in A : i(a) \leq b\}\bigr).$$
      Here, the element $\min A$ ensures that the maximum is taken over a non-empty set, which is needed when $b < i(a)$ for all $a \in A$. The map $r$ is order-preserving, since this set grows with $b$. Since $i$ is injective and order-preserving, it is strictly increasing, so for $a, a' \in A$ we have $i(a') \leq i(a)$ if and only if $a' \leq a$. Hence, $r(i(a)) = a$.
    label: FinOrd_mono-regular

  - property: all epimorphisms split
    proof: >-
      Apply Lemma 15 <a href="/content/subcategories">here</a> to the inclusion $\FinOrd \hookrightarrow \Ord$. It is fully faithful, and it preserves epimorphisms, since in both categories these are the surjective order-preserving maps (see below). Here, we use that all epimorphisms in <a href="/category/Ord">$\Ord$</a> split.

      The proof for $\Ord$ uses the axiom of choice, which is not needed here: for an epimorphism $p : X \to Y$ in $\FinOrd$, the map $s : Y \to X$, $s(y) \coloneqq \min p^*(\{y\})$ is a section of $p$, and it is order-preserving by the same argument as for $\Ord$.
    references:
      - Ord_all_epis_split

  - property: core-thin
    proof: 'Let $f : \{1 < \cdots < n \} \to \{1 < \cdots < n \}$ be an automorphism. Then $f(i)$ is the smallest element not contained in $\{f(j) : j < i\}$. From this one can deduce $f(i)=i$ by induction.'

unsatisfied_properties:
  - property: small
    proof: Even the collection of all singleton orders is not small, since every set $X$ yields a singleton order with underlying set $\{X\}$.

  - property: countable
    proof: Even the collection of singleton orders is not countable, since every set $X$ yields a singleton order with underlying set $\{X\}$.

  - property: skeletal
    proof: The ordered sets with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: sequential limits
    proof: Consider the (non-empty) ordered set $[n] \coloneqq \{0 < \cdots < n\}$ for $n \in \IN$. The forgetful functor to $\Set$ is representable, hence preserves all limits. Thus, if the diagram of truncation maps $\cdots \twoheadrightarrow [2] \twoheadrightarrow [1] \twoheadrightarrow [0]$ has a limit in $\FinOrd$, its underlying set is isomorphic to the limit taken in $\Set$, which is $\IN \cup \{\infty\}$. But this is not a finite set.
    label: FinOrd_no_sequential_limits

  - property: sequential colimits
    proof: 'Consider the (non-empty) ordered set $[n] \coloneqq \{0 < \cdots < n\}$ for $n \in \IN$. Assume the sequence of inclusion maps $[0] \hookrightarrow [1] \hookrightarrow [2] \hookrightarrow \cdots$ has a colimit $(f_n : [n] \to X)$ in $\FinOrd$. Let $n_0 \geq 0$ be fixed. We claim that $f_{n_0}$ is injective, which will then yield a contradiction by taking $n_0 \geq \card(X)$. For $n \geq 0$ define $g_n : [n] \to [n_0]$ as follows. For $n \leq n_0$ it is the inclusion, and for $n \geq n_0$ it is the surjection which keeps all elements of $[n_0]$ and maps all other elements to $n_0$. Observe that $g_n$ preserves the order and $g_{n+1} |_{[n]} = g_n$. Hence, there is a unique order-preserving map $g : X \to [n_0]$ with $g \circ f_n = g_n$ for all $n$. For $n = n_0$ this shows $g \circ f_{n_0} = \id_{[n_0]}$, and $f_{n_0}$ is injective.'
    label: FinOrd_no_sequential_colimits

  - property: natural numbers object
    proof: >-
      Assume that there is a natural numbers object $(N,z,s)$, where $z \in N$ and $s : N \to N$. Let $d \coloneqq \card(N)$. Consider the finite ordered set $X \coloneqq \{1 < \dotsc < d+1\}$ and the order-preserving map $g : X \to X$ defined by $g(k) \coloneqq k + 1$ for $k \leq d$ and $g(d+1) \coloneqq d+1$. By the universal property of $(N,z,s)$, there is a unique order-preserving map $\Phi : N \to X$ such that $\Phi(z) = 1$ and $\Phi(s(n)) = g(\Phi(n))$ for all $n \in N$. We then have $\Phi(s(z)) = 2$, $\Phi(s^2(z)) = 3$, and so on. Formally, an induction shows that $\Phi(s^n(z)) = n+1$ for every $0 \leq n \leq d$. Thus, $\Phi$ is surjective, contradicting $\card(N) < \card(X)$.

      Alternatively, the proof for <a href="/category/Ord">$\Ord$</a> works verbatim, since it only uses the finite ordered set $\{0 < 1\}$.
    references:
      - Ord_no_NNO

special_objects:
  initial object:
    description: empty ordered set
  terminal object:
    description: singleton ordered set
  products:
    description: '[finite case] direct products with the evident order'

special_morphisms:
  isomorphism:
    description: bijective order-preserving maps
    proof: This follows from the classification for <a href="/category/Ord">$\Ord$</a>, since the inclusion $\FinOrd \hookrightarrow \Ord$ is fully faithful.
  monomorphism:
    description: injective order-preserving maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphism:
    description: surjective order-preserving maps
    proof: The proof for <a href="/category/Pos">$\Pos$</a> works verbatim, since it only uses order-preserving maps into $\{0 < 1\}$.
