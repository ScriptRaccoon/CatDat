id: omega-Set
name: category of ω-sets
notation: $\omegaSet$
objects: pairs $(X, R_X)$ where $X$ is a set and $R_X \subseteq \IN \times X$ is a "realization" relation such that $(p_2)_*(R_X) = X$
morphisms: 'a morphism $(X, R_X) \to (Y, R_Y)$ is a function $f : X \to Y$ such that there exists a <i>realizer tracker compatible with $f$</i>: this is a <a href="https://ncatlab.org/nlab/show/partial+recursive+function">partial recursive function</a> $\ulcorner f \urcorner : \IN \dashrightarrow \IN$ such that for every $(n,x) \in R_X$, the value $\ulcorner f \urcorner(n)$ is defined and $(\ulcorner f \urcorner(n),f(x)) \in R_Y$'
description: >-
  An $\omega$-set represents a mathematical set with computational encodings of its elements; and similarly, a morphism of $\omega$-sets is a mathematical function such that roughly speaking, there is a computer program which translates encodings in the domain to encodings in the codomain (at least theoretically, if run on a computer with unlimited storage capacity and given an unlimited though finite time to work). In particular, if we consider $(n, x) \in R_X$ roughly to express a notion of $n$ being a serialization of a valid representation of $x$, then:
  <ul><li>We do not require $R_X$ to be total on the first coordinate, i.e. we allow for some objects which are not valid representations of any element of $X$.</li>
  <li>We do not require $R_X$ to be the inverse of a partial functional relation, i.e. we allow for some elements of $X$ to have multiple valid representations.</li>
  <li>We do not require $R_X$ to be a partial functional relation. This allows the category to express notions of "uniform computability", where some pieces of information in the codomain can be derived given only partial information about the value in the domain.</li></ul>

  In many of the proofs to follow, we will use the phrase "$n$ realizes $x$" to mean $(n, x) \in R_X$.


  Note that in several of the properties below, we will fix a choice of a total recursive pairing function $\langle {-}, {-} \rangle : \IN^2 \to \IN$ with total recursive inverses $p_1, p_2 : \IN \to \IN$. (Standard examples of such a pairing function include $\langle m, n \rangle \coloneqq \binom{m+n+1}{2} + m$, or the function intertwining the binary representations of $m$ and $n$.)
nlab_link: https://ncatlab.org/nlab/show/assembly
tags:
  - logic

related:
  - Set

comments:
  - 'Note that the realizer tracker $\ulcorner f \urcorner$ is <i>not</i> part of the data of a morphism $f : (X, R_X) \to (Y, R_Y)$; only the existence of at least one realizer tracker is required.'
  - 'The forgetful functor $U : \omegaSet \to \Set$ has a right adjoint $\nabla : \Set \to \omegaSet$ mapping a set $X$ to the $\omega$-set $(X, \IN \times X)$.'

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\omegaSet \to \Set$ and $\Set$ is locally small.

  - property: semi-strongly connected
    proof: 'Suppose we have two objects $(X, R_X)$ and $(Y, R_Y)$. If $Y$ is non-empty, suppose $y_0 \in Y$, and find $n_0 \in \IN$ such that $n_0$ realizes $y_0$. Then it is easy to see that the constant function with value $y_0$ is a morphism in $\Hom_{\omegaSet}((X, R_X), (Y, R_Y))$, where we can choose the compatible realizer tracker $\ulcorner y_0 \urcorner : \IN \dashrightarrow \IN$ to be the total recursive function with constant value $n_0$. Otherwise, if $Y$ is empty, then the unique function $Y \to X$ is a morphism in $\Hom_{\omegaSet}((Y, R_Y), (X, R_X))$, and in fact any partial recursive function $\IN \dashrightarrow \IN$ is a compatible realizer tracker.'
    label: omega_Set_ssc

  - property: well-powered
    proof: If $(X, R_X) \hookrightarrow (Y, R_Y)$ is a monomorphism, then by the description below, this implies the underlying function $X \to Y$ is injective. Therefore, we can find an equivalent subobject $(X, R_X) \cong (Y', R_{Y'})$ where $Y' \subseteq Y$ by transporting $R_X$ to the image of the underlying function. The collection of possible $Y'$ is then small, and for each $Y'$, the collection of possible $R_{Y'}$ is also small.

  - property: well-copowered
    proof: If $(X, R_X) \twoheadrightarrow (Y, R_Y)$ is an epimorphism, then by the description below, this implies the underlying function $X \to Y$ is surjective. Therefore, if $E$ is the kernel pair of this underlying function, then we can find an equivalent quotient object $(X / E, R_{X / E})$ by transporting $R_X$ to $X / E$. The collection of possible equivalence relations $E$ is then small, and for each $E$, the collection of possible $R_{X / E}$ is also small.

  - property: terminal object
    proof: 'The $\omega$-set $\nabla 1 = (1, \IN \times 1)$ is terminal, since $\nabla$ is a right adjoint and therefore preserves terminal objects.'
    check_redundancy: false

  - property: binary products
    proof: >-
      We claim that for $\omega$-sets $(X, R_X)$ and $(Y, R_Y)$, then $(X \times Y, R_{X\times Y})$ is a binary product where
      $$R_{X\times Y} \coloneqq \{ (\langle n, m \rangle, (x, y)) \mid (n, x) \in R_X \land (m, y) \in R_Y \}$$
      and the two projections are the standard set-level projections $\pi_1 : X\times Y \to X$ and $\pi_2 : X\times Y \to Y$. First, those projections are indeed morphisms of $\omega$-sets, since $p_1, p_2 : \IN \to \IN$ are assumed to be total recursive functions. Also, for any two morphisms $f : (U, R_U) \to (X, R_X)$ and $g : (U, R_U) \to (Y, R_Y)$, let $\ulcorner f \urcorner, \ulcorner g \urcorner : \IN \dashrightarrow \IN$ be realizer trackers compatible with $f$ and $g$, respectively. Then $\langle {-}, {-} \rangle \circ (\ulcorner f \urcorner, \ulcorner g \urcorner)$ is a realizer tracker compatible with $(f, g) : U \to X \times Y$, showing that $(f, g)$ induces a morphism $(U, R_U) \to (X\times Y, R_{X\times Y})$.
    check_redundancy: false

  - property: equalizers
    proof: >-
      Let $f, g : (X, R_X) \rightrightarrows (Y, R_Y)$ be two parallel morphisms, and let $E \subseteq X$ be the equalizer of the underlying functions. We then claim that $(E, R_X \cap (\IN \times E))$ is an equalizer of $f$ and $g$, with the morphism $(E, R_X \cap (\IN \times E)) \hookrightarrow (X, R_X)$ being the inclusion map. First, to see this indeed gives a morphism of $\omega$-sets, note that the identity function is a compatible realizer tracker. Now, if we have $h : (U, R_U) \to (X, R_X)$ such that $h \circ f = h \circ g$, then it is easy to see that the induced function $\bar h : U \to E$ to the equalizer in $\Set$ induces a morphism $(U, R_U) \to (E, R_X \cap (\IN \times X'))$ since any realizer tracker compatible with $h$ is also compatible with $\bar h$.
    check_redundancy: false

  - property: initial object
    proof: 'The $\omega$-set $(\varnothing, \varnothing)$ is initial. Namely, for any object $(X, R_X)$, the unique function $! : \varnothing \to X$ is a morphism $(\varnothing, \varnothing) \to (X, R_X)$. In fact, any partial recursive function $\IN \dashrightarrow \IN$ is vacuously a compatible realizer tracker.'
    check_redundancy: false

  - property: binary coproducts
    proof: >-
      We claim that for $\omega$-sets $(X, R_X)$ and $(Y, R_Y)$, then $(X \sqcup Y, R_{X\sqcup Y})$ is a binary coproduct where
      $$R_{X\sqcup Y} \coloneqq \{ (2n, x) \mid (n, x) \in R_X \} \cup \{ (2n+1, y) \mid (n, y) \in R_Y \}$$
      and the two coprojections are the standard set-level coprojections $i_1 : X \hookrightarrow X \sqcup Y$ and $i_2 : Y \hookrightarrow X \sqcup Y$. First, those coprojections are indeed morphisms of $\omega$-sets, since the functions $n \mapsto 2n$ and $n \mapsto 2n+1$ are total recursive functions $\IN \to \IN$. Also, for any two morphisms $f : (X, R_X) \to (Z, R_Z)$ and $g : (Y, R_Y) \to (Z, R_Z)$, let $\ulcorner f \urcorner, \ulcorner g \urcorner : \IN \dashrightarrow \IN$ be realizer trackers compatible with $f$ and $g$, respectively. Then there is a unique partial recursive function which sends $2n \mapsto \ulcorner f \urcorner(n)$ (if the latter exists) and $2n+1 \mapsto \ulcorner g \urcorner(n)$ (if the latter exists), and it forms a realizer tracker compatible with $(f; g) : X\sqcup Y \to Z$. Therefore, $(f; g)$ induces a morphism $(X\sqcup Y, R_{X\sqcup Y}) \to (Z, R_Z)$.
    check_redundancy: false

  - property: coequalizers
    proof: >-
      Let $f, g : (X, R_X) \rightrightarrows (Y, R_Y)$ be two parallel morphisms, and let $p : Y \twoheadrightarrow Q$ be the coequalizer of the underlying functions. Also, let
      $$R_Q \coloneqq ({\id_{\IN}} \times p)_*(R_Y) = \{ (n, p(y)) \mid (n, y) \in R_Y \}.$$
      We claim that $p : (Y, R_Y) \to (Q, R_Q)$ is a coequalizer of $f$ and $g$. First, the identity function $\IN \to \IN$ is a realizer tracker compatible with $p$, so $p$ is indeed a morphism of $\omega$-sets. Now, suppose we have a morphism $h : (Y, R_Y) \to (Z, R_Z)$ with $h\circ f = h\circ g$. Let $\bar h : Q \to Z$ be the function induced by $Q$ being the coequalizer in $\Set$. We then claim that $\bar h : (Q, R_Q) \to (Z, R_Z)$ is also a morphism of $\omega$-sets. This follows since it is easy to see that any realizer tracker compatible with $h$ is also compatible with $\bar h$.

  - property: cartesian closed
    proof: >-
      First, fix an <a href="https://en.wikipedia.org/wiki/Admissible_numbering">admissible numbering</a> $(\varphi_n)_{n \in \IN}$ of the partial recursive functions.

      Let $(X, R_X)$ and $(Y, R_Y)$ be two $\omega$-sets. We will define the exponential $[(X, R_X), (Y, R_Y)]$ to have underlying set $\Hom_{\omegaSet}((X, R_X), (Y, R_Y))$. The realization relation will be that $p \in \IN$ realizes $f : (X, R_X) \to (Y, R_Y)$ if and only if the $p$th partial recursive function $\varphi_p$ is unary and is a realizer tracker compatible with $f$.

      In order to check that this is indeed an exponential in $\omegaSet$, we first define the evaluation morphism
      $$\ev : [(X, R_X), (Y, R_Y)] \times (X, R_X) \to (Y, R_Y), \quad (f, x) \mapsto f(x).$$
      To show that this is in fact a morphism of $\omega$-sets, note that using the evaluation axiom of the admissible numbering, there is a partial recursive function $\varepsilon : \IN \dashrightarrow \IN$ such that $\varepsilon(\langle p, n \rangle)$ exists if and only $\varphi_p(n)$ exists, and in this case $\varepsilon(\langle p, n \rangle) = \varphi_p(n)$. This $\varepsilon$ is then a realizer tracker compatible with $\ev$.

      Now, suppose we have a morphism $h : (U, R_U) \times (X, R_X) \to (Y, R_Y)$, with compatible realizer tracker $\ulcorner h \urcorner : \IN \dashrightarrow \IN$. Using the currying axiom of the admissible numbering, we can then curry $\ulcorner h \urcorner$ into a total recursive function $\ulcorner \lambda_h \urcorner : \IN \to \IN$, such that each $\varphi_{\ulcorner \lambda_h \urcorner(n)}$ is unary; $\varphi_{\ulcorner \lambda_h \urcorner(n)}(m)$ exists if and only if $\ulcorner h \urcorner(\langle n, m \rangle)$ exists; and in that case
      $$\varphi_{\ulcorner \lambda_h \urcorner(n)}(m) = \ulcorner h \urcorner(\langle n, m \rangle).$$
      This implies that for each $u\in U$, if we find a realizer $n$ of $u$, then $h(u, {-}) : X \to Y$ has $\ulcorner h \urcorner(\langle n, {-} \rangle)$ as a compatible realizer tracker; thus, $u \mapsto h(u, {-})$ induces a function
      $$\lambda_h : U \to \Hom_{\omegaSet}((X, R_X), (Y, R_Y)).$$
      Furthermore, $\ulcorner \lambda_h \urcorner$ is a compatible realizer tracker for $\lambda_h$, so in fact we get a morphism
      $$\lambda_h : (U, R_U) \to [(X, R_X), (Y, R_Y)].$$

      From here, it is straightforward to show that $\lambda_h$ is the unique morphism such that $ev \circ (\lambda_h \times \id_X) = h$.
    check_redundancy: false

  - property: locally cartesian closed
    proof: >-
      This proof will be an adaptation of the proof above that the category is cartesian closed. As in the previous proof, we first fix an <a href="https://en.wikipedia.org/wiki/Admissible_numbering">admissible numbering</a> $(\varphi_n)_{n \in \IN}$ of the partial recursive functions.

      As a preliminary, suppose we have a morphism $f : (X, R_X) \to (Z, R_Z)$ and an element $z\in Z$. Then we will define $f_z$ to be the $\omega$-set with underlying set $f^*(\{ z \})$ and with realization relation $R_X \cap (\IN \times f^*(\{ z \}))$.

      As another preliminary, suppose we have a span
      $$(X, R_X) \xrightarrow{f} (Z, R_Z) \xleftarrow{g} (Y, R_Y).$$
      Then from the above descriptions of binary products and equalizers, we can describe the pullback in $\omegaSet$ as having underlying set given by the pullback of underlying sets $f \times_Z g$, with realization relation
      $$\{ (\langle n, m \rangle, (x, y)) \mid f(x) = g(y) \land (n, x) \in R_X \land (m, y) \in R_Y \}.$$

      Now, suppose we have two morphisms $f : (X, R_X) \to (Z, R_Z)$ and $g : (Y, R_Y) \to (Z, R_Z)$. Then the relative exponential $[f, g]_Z$ will have underlying set
      $$\bigsqcup_{z\in Z} \Hom_{\omegaSet}(f_z, g_z).$$
      The realization relation will be that $\langle n, p \rangle$ realizes $\alpha \in \Hom_{\omegaSet}(f_z, g_z)$ if $n$ realizes $z$, and $p$ is the code for a unary partial recursive function $\varphi_p : \IN \dashrightarrow \IN$ which is a realizer tracker compatible with $\alpha$.

      First, it is easy to see that the projection to $Z$ is a morphism of $\omega$-sets $[f, g]_Z \to (Z, R_Z)$, since $p_1 : \IN \to \IN$ is a compatible realizer tracker. This is the morphism we will use to consider $[f, g]_Z$ as an object of $\omegaSet / (Z, R_Z)$.

      The next step is to define an evaluation morphism
      $$\ev_Z : [f, g]_Z \times_{(Z, R_Z)} (X, R_X) \to (Y, R_Y).$$
      We will define this as the function
      $$\bigsqcup_{z\in Z} \left( \Hom(f_z, g_z) \times X_z \right) \to Y, (z, (\alpha, x)) \mapsto \alpha(x).$$
      The fact that this is a morphism of $\omega$-sets follows from the fact that using the evaluation axiom of the admissible numbering, there is a partial recursive function $\IN \dashrightarrow \IN$ which sends $\langle \langle n, p \rangle, m \rangle \rangle$ to $\varphi_p(m)$ if the latter exists; and it gives a compatible realizer tracker.

      Finally, suppose we have a morphism $h : (U, R_U) \to (Z, R_Z)$ and a morphism $j : h \times_{(Z, R_Z)} f \to g$ in $\omegaSet / (Z, R_Z)$. Choose realizer trackers $\ulcorner h \urcorner : \IN \dashrightarrow \IN$ and $\ulcorner j \urcorner : \IN \dashrightarrow \IN$ compatible with $h$ and $j$, respectively. We can then use the currying axiom of the admissible numbering to construct a total recursive function $\ulcorner \lambda_j \urcorner : \IN \to \IN$, such that $\varphi_{\ulcorner \lambda_j \urcorner(n)}(m)$ exists if and only if $\ulcorner j \urcorner(\langle n, m \rangle)$ exists, and in that case
      $$\varphi_{\ulcorner \lambda_j \urcorner(n)}(m) = \ulcorner j \urcorner(\langle n, m \rangle).$$
      This implies that for each $u\in U$, if we find a realizer $n$ of $u$, then $j(u, {-}) : f_{h(u)} \to g_{h(u)}$ has $\ulcorner j \urcorner(\langle n, {-} \rangle)$ as a compatible realizer tracker. Thus, $u \mapsto j(u, {-})$ induces a function
      $$\lambda_j : U \to \bigsqcup_{z\in Z} \Hom_{\omegaSet}(f_z, g_z).$$
      Furthermore, $n \mapsto \langle \ulcorner h \urcorner(n), \ulcorner \lambda_j \urcorner(n) \rangle$ is a partial recursive function, and it gives a compatible realizer tracker for $\lambda_j$.

      From here, it is straightforward to show that $\lambda_j$ is the unique morphism such that $\ev_Z \circ (\lambda_j \times_{(Z, R_Z)} \id_f) = j$.

  - property: regular subobject classifier
    proof: >-
      We claim that $\Omega \coloneqq (2, \IN \times 2)$ is a regular subobject classifier, with $\top : 1 \to \Omega$ being the morphism whose underlying set function is $0 \mapsto 1$. To see this, note that from the construction of equalizers above, any regular subobject of $(X, R_X)$ is equivalent to $(X', R_X \cap (\IN \times X'))$ for some $X' \subseteq X$. It is then straightforward to check that the characteristic function $\chi_{X'} : X \to 2$ induces a morphism $(X, R_X) \to \Omega$, and that $(X', R_X \cap (\IN \times X'))$ is also the pullback of $\chi_{X'}$ and $\top$.

  - property: disjoint finite coproducts
    proof: This follows from the fact that the forgetful functor $\omegaSet \to \Set$ preserves finite coproducts from the construction above; the fact that finite coproducts are disjoint in $\Set$; and the fact that the forgetful functor reflects initial objects.

  - property: generator
    proof: The terminal object $(1, \IN \times 1)$ represents the forgetful functor $\omegaSet \to \Set$ which is clearly faithful. (For the nontrivial direction of the isomorphism between $\Hom_{\omegaSet}((1, \IN \times 1), (X, R_X))$ and $X$, suppose we have $x \in X$. Then there exists $n \in \IN$ such that $n$ realizes $x$; therefore, the total recursive function given by the constant function with image $n$ forms a realizer tracker compatible with the corresponding function $1 \to X$.)

  - property: extremal generating collection
    proof: >-
      We claim that the collection of $\omega$-sets $(U, R_U)$ with $U\subseteq \IN$ is an extremal generating collection. To see this, note that the terminal object is isomorphic to the object $(\{ 0 \}, \IN \times \{ 0 \})$, and we saw above that it is a generator, so the given collection is certainly a generating collection.

      To see it is extremal, suppose we have a morphism $f : (X, R_X) \to (Y, R_Y)$ which is not an isomorphism. If this is because the underlying function $f : X \to Y$ is not a bijection, then that implies
      $$f \circ {-} : \Hom((\{0\}, \IN\times\{0\}), (X, R_X)) \to \Hom((\{0\}, \IN\times\{0\}), (Y, R_Y))$$
      is not a bijection. Otherwise, if the underlying function is a bijection, but $f$ is not an isomorphism, then by the description of isomorphisms below, for each partial recursive function $\psi : \IN \dashrightarrow \IN$, there exist $n_\psi \in \IN$ and $x_\psi \in X$ such that $n_\psi$ realizes $f(x_\psi)\in Y$, but either $\psi(n_\psi)$ does not exist, or $\psi(n_\psi)$ does not realize $x_\psi\in X$. Choose one such pair of $n_\psi$ and $x_\psi$ for each unary partial recursive function $\psi$. We will then define $U$ to be the collection of all $f(x_\psi)$ where $\psi$ is a unary partial recursive function, and $R_U \coloneqq R_Y \cap (\IN \times U)$.

      Then $(U, R_U)$ is an $\omega$-set, and the inclusion map $i : U \hookrightarrow Y$ induces a morphism $i : (U, R_U) \hookrightarrow (Y, R_Y)$ of $\omega$-sets, since the identity function $\IN \to \IN$ is a compatible realizer tracker. However, we claim there can be no morphism $g : (U, R_U) \to (X, R_X)$ such that $f \circ g = i$. In fact, if such $g$ existed, then the underlying function would have to send $f(x_{\psi}) \mapsto x_{\psi}$. On the other hand, if $\ulcorner g \urcorner : \IN \dashrightarrow \IN$ were a compatible realizer tracker, then we would have that $n_{\ulcorner g \urcorner}$ realizes $f(x_{\ulcorner g \urcorner})\in U$, and therefore $\ulcorner g \urcorner(n_{\ulcorner g \urcorner})$ exists and $\ulcorner g \urcorner(n_{\ulcorner g \urcorner})$ realizes $g(f(x_{\ulcorner g \urcorner})) = x_{\ulcorner g \urcorner}\in X$, contradicting the choice of $n_{\ulcorner g \urcorner}$ and $x_{\ulcorner g \urcorner}$.

      This shows that
      $$f \circ {-} : \Hom((U, R_U), (X, R_X)) \to \Hom((U, R_U), (Y, R_Y))$$
      is not surjective, and therefore not bijective. However, since there are only countably many partial recursive functions, $U$ is countable. Hence $(U, R_U)$ is isomorphic to a member of the given collection, which we can construct by choosing a subset of $\IN$ bijective to $U$, and then transporting $R_U$ to that subset.

  - property: extremal cogenerator
    proof: >-
      We first claim that $\nabla 2$ and $(P(\IN) \setminus \{ \varnothing \}, {\in}_{\IN})$ form an extremal cogenerating collection. To see this, we first consider morphisms to the first member $\nabla 2$ of the family. Note that
      $$\Hom_{\omegaSet}({-}, \nabla 2) \cong \Hom_{\Set}(U{-}, 2),$$
      where $U : \omegaSet \to \Set$ is the forgetful functor. Therefore, $\Hom_{\omegaSet}({-}, \nabla 2)$ is isomorphic to the composition of $U$ and the power set functor $P : \Set^{\op} \to \Set$, both of which are faithful. This shows that $\nabla 2$ is a cogenerator, so the collection is also a cogenerating collection.

      To show the collection is an extremal cogenerating collection, suppose we have a morphism $f : (X, R_X) \to (Y, R_Y)$ such that ${-} \circ f$ induces bijections of morphism sets to both members of the collection. From the first assumption that
      $${-} \circ f : \Hom((Y, R_Y), \nabla 2) \to \Hom((X, R_X), \nabla 2)$$
      is a bijection, we see that
      $${-} \circ f : \Hom_{\Set}(Y, 2) \to \Hom_{\Set}(X, 2)$$
      is a bijection. Since $2$ is an extremal cogenerator of <a href="/category/Set">$\Set$</a>, we conclude that the underlying function of $f$ is a bijection.

      Now, consider the morphism
      $$g : (X, R_X) \to (P(\IN) \setminus \{ \varnothing \}, {\in}_{\IN})$$
      which sends $x \in X$ to its set of realizers (with the identity function $\IN \to \IN$ as the compatible realizer tracker). From the hypothesis, there exists a morphism
      $$h : (Y, R_Y) \to (P(\IN) \setminus \{ \varnothing \}, {\in}_{\IN})$$
      such that $g = h \circ f$. Choose a compatible realizer tracker $\ulcorner h \urcorner : \IN \dashrightarrow \IN$. Then for any $x\in X$, if $n$ realizes $f(x)$, then $\ulcorner h \urcorner(n)$ exists and $\ulcorner h \urcorner(n)$ realizes $h(f(x)) = g(x)$. Thus, by definition of $g$, $\ulcorner h \urcorner(n)$ is in the set of realizers of $x$, i.e. $\ulcorner h \urcorner(n)$ realizes $x$. From the characterization of isomorphisms below, this implies that $f$ is an isomorphism.

      Finally, since $\nabla 2$ and $(P(\IN) \setminus \{ \varnothing \}, {\in}_{\IN})$ both have non-empty underlying sets, they form a strongly connected family (see the proof above that $\omegaSet$ is semi-strongly connected). Therefore, by <a href="/content/generator_construction">this result</a>, the product of these two objects is an extremal cogenerator.
    references:
      - omega_Set_ssc
      - Set_extremal_cogenerator

  - property: parametrized natural numbers object
    proof: >-
      We claim that $N \coloneqq (\IN, \Delta_{\IN})$, where $\Delta_{\IN}$ is the diagonal, is a parametrized natural numbers object. (In other words, the realization relation is that $m$ realizes $n$ if and only if $m = n$.) First, the zero function $z : 1 \to \IN$ and the successor function $s : \IN \to \IN$ clearly induce morphisms of $\omega$-sets $z : 1 \to N$ and $s : N \to N$. Now, suppose we have $f : (A, R_A) \to (X, R_X)$ and $g : (X, R_X) \to (X, R_X)$. Choose compatible realizer trackers $\ulcorner f \urcorner, \ulcorner g \urcorner : \IN \dashrightarrow \IN$. Also, let $\Phi : A \times \IN \to X$ be the function $(a, n) \mapsto g^n(f(a))$. Then since the collection of partial recursive functions is closed under primitive recursion, we can also construct a partial recursive function $\ulcorner \Phi \urcorner$ such that
      $$\ulcorner \Phi \urcorner(\langle b, 0 \rangle) = \ulcorner f \urcorner(b)$$
      and
      $$\ulcorner \Phi \urcorner(\langle b, n+1 \rangle) = \ulcorner g \urcorner(\ulcorner \Phi \urcorner(\langle b, n \rangle)).$$
      Now suppose $m$ realizes $a \in A$; then an easy induction shows that for each $n$, $\ulcorner \Phi \urcorner(\langle m, n \rangle)$ exists and realizes $\Phi(a, n)$. This shows that $\Phi$ induces a morphism of $\omega$-sets $(A, R_A) \times N \to (X, R_X)$ with the required properties.

      Uniqueness of $\Phi$ follows from the uniqueness part of $\IN$ being a parametrized natural numbers object in $\Set$.

unsatisfied_properties:
  - property: skeletal
    proof: Consider $(X, \IN \times X)$ and $(Y, \IN \times Y)$ for $X$ and $Y$ bijective but unequal sets.

  - property: essentially small
    proof: 'The right adjoint $\nabla : \Set \to \omegaSet$ to the forgetful functor is fully faithful, and therefore conservative.'

  - property: locally finite
    proof: >-
      The right adjoint $\nabla : \Set \to \omegaSet$ to the forgetful functor is fully faithful. Therefore, for example,
      $$\Hom_{\omegaSet}(\nabla 1, \nabla \IN) \cong \Hom_{\Set}(1, \IN)$$
      is infinite.

  - property: balanced
    proof: 'The identity map $\IN \to \IN$ induces a morphism of $\omega$-sets $N \to \nabla \IN$, since the identity map is also a compatible realizer tracker. It is both a monomorphism and an epimorphism by the characterizations below. However, it is not an isomorphism: an inverse $\nabla \IN \to N$ would have to have the identity map $\IN \to \IN$ as its underlying function. But for any compatible realizer tracker $\psi$, we have that $0$ realizes both $0$ and $1$ in $\nabla \IN$. Therefore, $\psi(0)$ would have to exist and realize both $0$ and $1$ in $N$, which is impossible. (Alternately, $\Hom_{\omegaSet}(\nabla \IN, \nabla \IN) \cong \Hom_{\Set}(\IN, \IN)$ is uncountable. On the other hand, it is easy to see that $\Hom_{\omegaSet}(N, N)$ is exactly the total recursive functions, since a compatible realizer tracker would have to agree with the underlying function. Therefore, $\Hom_{\omegaSet}(N, N)$ is countable.)'
    check_redundancy: false

  - property: co-Malcev
    proof: 'Consider the two possible morphisms $f, g : \nabla 1 \rightrightarrows \nabla 2$. This defines a cocongruence representing the functor which to $(X, E_X)$ assigns the binary relation on $X$ of two elements having a common realizer. That shows that this cocongruence is coreflexive, since by definition any element of an $\omega$-set has a realizer. However, it is easy to see that it is not cotransitive; for example, in $(3, \{ (0, 0), (0, 1), (1, 1), (1, 2) \})$, $0$ and $1$ have a common realizer, as do $1$ and $2$; but $0$ and $2$ do not have a common realizer.'

  - property: countable powers
    proof: >-
      Let $N \coloneqq (\IN, \Delta_{\IN})$ be the natural numbers object. For any $\omega$-set $(X, R_X)$ with a sequence of morphisms $f_n : (X, R_X) \to N$, we can define a function $g : X \to \IN^{\IN}$ which sends $x \in X$ to the sequence $(f_n(x))_{n\in \IN}$. We claim that $g$ has countable image. To see this, suppose $x\in X$. Then there exists $m\in \IN$ such that $m$ realizes $x$. We can also choose realizer trackers $\ulcorner f_n \urcorner : \IN \dashrightarrow \IN$ compatible with $f_n$. It follows that $\ulcorner f_n \urcorner(m)$ is defined and $\ulcorner f_n \urcorner(m) = f_n(x)$ for each $n$. Therefore, the image of $g$ is contained in the set of sequences $(\ulcorner f_n \urcorner(m))_{n\in N}$ where $m \in \IN$ is such that $\ulcorner f_n \urcorner(m)$ is defined for each $n$.

      From this, we see that there can be no $\aleph_0$-indexed power of $N$. Indeed, if $X$ were such a power, then for any sequence $(a_n) \in \IN^{\IN}$, we would have a corresponding sequence of morphisms $1 \to \IN$, inducing a morphism $1 \to X$ and thus an element $x$ of the underlying set. The corresponding function $g : X \to \IN^{\IN}$ would then have to have value $g(x) = (a_n)$. Thus, $g$ would be surjective, contradicting the previous paragraph.

  - property: ℵ₁-filtered colimits
    proof: >-
      This counterexample is inspired by the construction in <a href="https://www.sciencedirect.com/science/article/pii/S0022404905001593">Jaap van Oosten, <i>Filtered colimits in the effective topos</i></a>. Here, first choose an $\omega_1$-Aronszajn sequence: this is a sequence $(s_\alpha)_{\alpha \in \omega_1}$ of injective functions $\alpha \to \IN$ such that whenever $\beta < \alpha < \omega_1$, then $s_\beta$ and $s_\alpha |_\beta$ agree except at finitely many points. We then let $X_\alpha$ be the $\omega$-set whose underlying set is $\alpha$, equipped with the realization relation that $n$ realizes $\beta \in \alpha$ if and only if $s_\alpha(\beta) = n$.

      Whenever $\beta < \alpha$, the inclusion map $\beta \hookrightarrow \alpha$ induces a morphism $X_\beta \to X_\alpha$. This is because by the above condition, a compatible realizer tracker only needs to "reassign" finitely many realizers, which is certainly possible to achieve with a total recursive function. It is easy to see that this makes $(X_\alpha)_{\alpha \in \omega_1}$ into an ℵ₁-filtered diagram.

      However, this diagram cannot have a colimit. If it did have a colimit $Y$, it would have to have underlying set equivalent to $\omega_1$, since the forgetful functor $\omegaSet \to \Set$ is a left adjoint. Thus, we may assume $Y$ has underlying set equal to $\omega_1$, with the cocone maps $X_\alpha \to Y$ being the inclusion maps. Also, for any $\gamma_0 \in \omega_1$, we can construct morphisms $X_\alpha \to N$ such that $\beta \mapsto 0$ except that $\gamma_0 \mapsto 1$ if $\gamma_0 \in \alpha$. To see this, if $\gamma_0 \not\in \alpha$, then we can use the constant function with value 0 as the compatible realizer tracker. On the other hand, if $\gamma_0 \in \alpha$, then we can use the total recursive function which sends all natural numbers to 0, except that it sends $s_\alpha(\gamma_0)$ to 1. It is easy to see that this gives a cocone of $(X_\alpha)_{\alpha \in \omega_1}$, so it induces a morphism $f : Y \to N$. Furthermore, we must have $f(\gamma_0) = 1$ while $f(\gamma ') = 0$ for $\gamma ' \ne \gamma_0$.

      From this, examining the conditions on a compatible realizer tracker for $f$, we can conclude that for $\gamma ' \ne \gamma_0$, $\gamma_0$ and $\gamma '$ cannot have any common realizers in $Y$. Thus, the realization relation on $Y$ induces a surjective function from a subset of $\IN$ to $\omega_1$, giving a contradiction.

  - property: extremal generator
    proof: >-
      Suppose we had an extremal generator $(G, R_G)$.


      <b>Step 1:</b> We construct an $\omega$-set $(T, R_T)$ such that $T$ is infinite, but any morphism $(G, R_G) \to (T, R_T)$ has finite image.


      In order to do this, first let $\Gamma \coloneqq (p_1)_*(R_G)$ be the set of realizers of elements of $G$. Also fix an enumeration $(\varphi_n)_{n\in \IN}$ of the unary partial recursive morphisms $\IN \dashrightarrow \IN$ (which does not need to be an admissible numbering for this application). We will then construct an increasing sequence of finite subsets $I_n, O_n \subseteq \IN$ such that $I_n \cap O_n = \varnothing$ for each $n$. We start with $I_0 = O_0 = \varnothing$. Now for each $n$, if $(\varphi_n)_*(\Gamma) \subseteq I_n \cup O_n$, then we set $O_{n+1} \coloneqq O_n$; otherwise, we let $O_{n+1} \coloneqq O_n \cup \{ b_n \}$ where we choose
      $$b_n \in (\varphi_n)_*(\Gamma) \setminus (I_n \cup O_n).$$
      We then let $I_{n+1} \coloneqq I_n \cup \{ a_n \}$ where we choose
      $$a_n \in \IN \setminus (I_n \cup O_{n+1}).$$

      Once we have this sequence, we let $T \coloneqq \bigcup_{n\in \IN} I_n$, and $R_T \coloneqq \Delta_T \subseteq \IN \times T$.


      <b>Step 2:</b> Proof that $(T, R_T)$ has the properties stated in Step 1.


      First, since $\card(I_{n+1}) = n$ for each $n$, then $T$ must certainly be infinite. Now, suppose we have a morphism $f : (G, R_G) \to (T, R_T)$, and choose $n$ such that $\varphi_n$ is a compatible realizer tracker. Then whenever $m$ realizes $x \in X$, we must have $f(x) = \varphi_n(m)$; from this fact, it is easy to see that the image of $f$ is equal to $(\varphi_n)_*(\Gamma)$. However, if we had the second case at stage $n$ in the above construction, then we would have $b_n \in O_m$ whenever $m > n$; hence $b_n \notin T$. On the other hand, $b_n \in (\varphi_n)_*(\Gamma)$ by construction, and $(\varphi_n)_*(\Gamma) \subseteq T$, giving a contradiction.


      Thus, we must have had the first case at stage $n$ in the above construction. In other words, $(\varphi_n)_*(\Gamma) \subseteq I_n \cup O_n$, and the latter is finite.


      <b>Step 3:</b> Construction of a function $c : T \to \IN$ which is not the restriction of any partial recursive function $\IN \dashrightarrow \IN$.


      This is an easy adaptation of the standard diagonalization construction of a non-recursive function. We use the enumeration $(\varphi_n)_{n\in \IN}$ of the unary partial recursive morphisms as above, along with an enumeration $(t_n)_{n\in \IN}$ of the countably infinite set $T$. We now set
      $$c(t_n) \coloneqq \begin{cases}
      1, & t_n\in \dom(\varphi_n) \land \varphi_n(t_n) = 0, \\
      0, & \mathrm{otherwise}.
      \end{cases}$$
      By construction, $c \ne (\varphi_n) |_T$ for each $n$ since they disagree at $t_n\in T$ (either $\varphi_n(t_n)$ is not defined whereas $c(t_n)$ is defined, or they are both defined but have different values).


      <b>Step 4:</b> Construction of a non-isomorphism $f : (T, R_T ') \to (T, R_T)$.


      We first set
      $$R_T' \coloneqq \{ (\langle n, c(n) \rangle, n) \mid n \in T \}.$$
      Then $f$ will have the identity map on $T$ as its underlying set function, which has $\ulcorner f \urcorner \coloneqq p_1$ as a compatible realizer tracker. We claim $f$ is not an isomorphism. To see this, any inverse $f^{-1}$ must have the identity map on $T$ as its underlying set function. Also, any compatible realizer tracker $\ulcorner f^{-1} \urcorner : \IN \dashrightarrow \IN$ must be defined at each element of $T$ with $\ulcorner f^{-1} \urcorner(n) = \langle n, c(n) \rangle$ for each $n\in T$. Therefore, $p_2 \circ \ulcorner f^{-1} \urcorner$ would be a partial recursive function whose restriction to $T$ is equal to $c$. This contradicts the construction of $c$.


      <b>Step 5:</b> Proof that $(G, R_G)$ sees $f$ as an isomorphism.


      Since $f$ is a monomorphism, certainly
      $$f \circ {-} : \Hom((G, R_G), (T, R_T ')) \to \Hom((G, R_G), (T, R_T))$$
      must be injective. To see it is surjective, suppose we have a morphism $g : (G, R_G) \to (T, R_T)$, and choose a compatible realizer tracker $\ulcorner g \urcorner$. By the construction above, $g$ must have finite image. Therefore, there is a partial recursive function $c' : \IN \dashrightarrow \IN$ such that $c' |_{\im(g)} = c |_{\im(g)}$, which we could implement in any Turing-complete programming language using a lookup table for example. Now we let $h : (G, R_G) \to (T, R_T ')$ have the same underlying function as $g$. This also forms a morphism of $\omega$-sets because
      $$\ulcorner h \urcorner \coloneqq n \mapsto \langle \ulcorner g \urcorner(n), c'(\ulcorner g \urcorner(n)) \rangle$$
      is a compatible realizer tracker. Furthermore, we certainly have $f \circ h = g$.

special_objects:
  initial object:
    description: $(\varnothing, \varnothing)$
  terminal object:
    description: $(1, \IN \times 1)$
  coproducts:
    description: '[binary case] The binary coproduct of $(X, R_X)$ and $(Y, R_Y)$ is $X \sqcup Y$ with realization relation $$R_{X\sqcup Y} \coloneqq \{ (2n, x) \mid (n, x) \in R_X \} \cup \{ (2n+1, y) \mid (n, y) \in R_Y \}.$$'
  products:
    description: '[binary case] The binary product of $(X, R_X)$ and $(Y, R_Y)$ is $X \times Y$ with realization relation $$R_{X\times Y} \coloneqq \{ (\langle n, m \rangle, (x, y)) \mid (n, x) \in R_X \land (m, y) \in R_Y \}.$$'

special_morphisms:
  isomorphisms:
    description: 'A morphism $f : (X, R_X) \to (Y, R_Y)$ is an isomorphism if and only if the underlying function $X \to Y$ is a bijection, and there also exists a partial recursive function $\psi : \IN \dashrightarrow \IN$ such that whenever we have $n\in\IN, x\in X$ such that $n$ realizes $f(x)\in Y$, then $\psi(n)$ exists and $\psi(n)$ realizes $x\in X$'
    proof: This is easy, since the condition on the existence of $\psi$ just says that the set-level inverse of $f$ is also a morphism in $\omegaSet$.
  monomorphisms:
    description: Morphisms of $\omega$-sets whose underlying set function is injective
    proof: This follows from the fact that the forgetful functor $\omegaSet \to \Set$ is clearly faithful, and it is representable by the terminal object $(1, \IN \times 1)$.
  regular monomorphisms:
    description: 'A morphism $f : (X, R_X) \to (Y, R_Y)$ is a regular monomorphism if and only if the underlying function $X \to Y$ is injective, and there exists a partial recursive function $\psi : \IN \dashrightarrow \IN$ such that whenever we have $n\in \IN$ and $x\in X$ such that $n$ realizes $f(x) \in Y$, then $\psi(n)$ exists and $\psi(n)$ realizes $x\in X$'
    proof: 'Following the constructions above, we can see that for any morphism $f : (X, R_X) \to (Y, R_Y)$, the equalizer of the cokernel pair of $f$ is $(\im(f), R_Y \cap (\IN \times \im(f)))$; and the condition above is equivalent to the condition that the canonical map $X \to \im(f)$ induces an isomorphism of $\omega$-sets $(X, R_X) \to (\im(f), R_Y \cap (\IN \times \im(f)))$.'
  epimorphisms:
    description: Morphisms of $\omega$-sets whose underlying set function is surjective
    proof: Sufficiency of this condition is trivial. For necessity, use the fact that the forgetful functor $\omegaSet$ is a left adjoint, and therefore preserves epimorphisms.
  regular epimorphisms:
    description: 'A morphism $f : (X, R_X) \to (Y, R_Y)$ is a regular epimorphism if and only if there exists a partial recursive function $\psi : \IN \dashrightarrow \IN$ such that whenever we have $n\in \IN$ and $y\in Y$ such that $n$ realizes $y$, then $\psi(n)$ exists, and there exists $x\in X$ such that $f(x) = y$ and $\psi(n)$ realizes $x$'
    proof: 'Following the constructions above, we can see that for any morphism $f : (X, R_X) \to (Y, R_Y)$, the coequalizer of the kernel pair of $f$ is $(\im(f), ({\id_{\IN}} \times f)_*(R_X))$; and the condition above is equivalent to the condition that the canonical map $\im(f) \to Y$ induces an isomorphism of $\omega$-sets $(\im(f), (\id_{\IN} \times f)_*(R_X)) \to (Y, R_Y)$.'
