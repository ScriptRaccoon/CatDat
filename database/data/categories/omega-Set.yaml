special_morphisms:
  isomorphisms:
    description: 'A morphism $f : (X, E_X) \to (Y, E_Y)$ is an isomorphism if and only if the underlying function $X \to Y$ is a bijection, and there also exists a partial recursive function $\psi : \IN \dashrightarrow \IN$ such that whenever we have $n\in\IN, x\in X$ such that $n$ realizes $f(x)$, then $\psi(n)$ exists and $\psi(n)$ realizes $x$'
    proof: This is easy, since the condition just says that the set-level inverse of $f$ is also a morphism in $\omega{-}\Set$.
  monomorphisms:
    description: 'A morphism $f : (X, E_X) \to (Y, E_Y)$ is a monomorphism if and only if the underlying function $X \to Y$ is injective'
    proof: This follows from the fact that the forgetful functor $\omega{-}\Set \to \Set$ is clearly faithful, and it is representable by the terminal object $(1, \IN \times 1)$.
  regular monomorphisms:
    description: ...
    proof: ...
  epimorphisms:
    description: 'A morphism $f : (X, E_X) \to (Y, E_Y)$ is an epimorphism if and only if the underlying function $X \to Y$ is surjective'
    proof: Sufficiency of the latter condition is easy to show. For necessity, use the fact that $\Hom_{\Set}(X, Z) \cong \Hom_{\omega{-}\Set}((X, E_X), (Z, \IN \times Z))$ to show that if $f$ is an epimorphism in $\omega{-}\Set$, then the underlying set function of $f$ is an epimorphism in $\Set$.
  regular epimorphisms:
    description: ...
    proof: ...
