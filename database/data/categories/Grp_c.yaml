id: Grp_c
name: category of countable groups
notation: $\Grp_\c$
objects: countable groups
morphisms: group homomorphisms
description: A group is called countable if its underlying set is countable. In particular, every finite group is countable, but also every finitely generated group is countable.
nlab_link: null

tags:
  - algebra

related:
  - Grp
  - Grp_fg
  - FinGrp
  - Set_c
  - Vect_c

satisfied_properties:
  - property: locally small
    proof: There is an embedding $\Grp_\c \hookrightarrow \Grp$, and $\Grp$ is locally small (<a href="/category/Grp?proof=locally_small" data-allow-deduced>proof</a>).

  - property: essentially small
    proof: Every countable group is isomorphic to a group whose underlying set is a subset of $\IN$.

  - property: pointed
    proof: The trivial group is countable and is a zero object.
    check_redundancy: false

  - property: extremal generator
    proof: The countable group $\IZ$ is an extremal generator even in $\Grp$ (<a href="/category/Grp?proof=extremal_generator">proof</a>). Now use Lemma 10 <a href="/content/subcategories">here</a>.

  - property: finite products
    proof: This is because $\Grp$ has finite (in fact, all) products (<a href="/category/Grp?proof=products" data-allow-deduced>proof</a>), and $\Grp_\c \hookrightarrow \Grp$ is closed under finite products. This is because a finite product of countable sets is again countable.
    check_redundancy: false

  - property: equalizers
    proof: One can use the same construction as in <a href="/category/Grp">$\Grp$</a> since a subgroup of a countable group is again countable.
    check_redundancy: false

  - property: coequalizers
    proof: One can use the same construction as in <a href="/category/Grp">$\Grp$</a> since a quotient of a countable group is again countable.

  - property: countable coproducts
    proof: This is because $\Grp$ has countable (in fact, all) coproducts (<a href="/category/Grp?proof=coproducts" data-allow-deduced>proof</a>), and $\Grp_\c \hookrightarrow \Grp$ is closed under countable coproducts. This is because a countable union of countable sets is again countable.

  - property: finite-coproduct-stable monomorphisms
    proof: Apply Lemma 2 <a href="/content/subcategories">here</a> to the inclusion functor $\Grp_\c \to \Grp$, which preserves finite coproducts (<a href="/category/Grp_c?proof=countable_coproducts">proof</a>) and monomorphisms (<a href="/category/Grp_c?proof=monomorphism">proof</a>), since $\Grp$ has coproduct-stable monomorphisms (<a href="/category/Grp?proof=coproduct-stable_monomorphisms" data-allow-deduced>proof</a>).

  - property: mono-regular
    proof: >-
      This can be deduced from the fact that $\Grp$ is mono-regular (<a href="/category/Grp?proof=mono-regular" data-allow-deduced>proof</a>) as follows: Let $i : K \hookrightarrow G$ be a monomorphism in $\Grp_\c$, i.e. an injective homomorphism of countable groups. Since $\Grp$ is mono-regular, there is a group $H$ and two homomorphisms $f,g : G \rightrightarrows H$ with $i = \eq(f,g)$. Let $H' \subseteq H$ be the subgroup generated by $\im(f) \cup \im(g)$. Since $G$ is countable, $H'$ is countable as well, and $f,g$ corestrict to homomorphisms $f', g' : G \rightrightarrows H'$. Hence, $i = \eq(f',g')$.

  - property: conormal
    proof: 'If $f : G \to H$ is an epimorphism in $\Grp_\c$, i.e. a surjective homomorphism of countable groups, then $f$ is the cokernel of $K \hookrightarrow G$ in $\Grp$, where $K$ is the kernel of $f$. Since $K$ is countable, it is also the cokernel in $\Grp_\c$.'

  - property: Malcev
    proof: We can use the same <a href="/category/Grp?proof=Malcev">proof</a> as for $\Grp$.

  - property: regular
    proof: This follows from Lemma 7 <a href="/content/subcategories">here</a> applied to the inclusion functor $\Grp_\c \hookrightarrow \Grp$ into the regular category $\Grp$ and the fact that the regular epimorphisms in $\Grp_\c$ are the epimorphisms (<a href="/category/Grp_c?proof=regular_epimorphism" data-allow-deduced>proof</a>), i.e. the surjective homomorphisms (<a href="/category/Grp_c?proof=epimorphism">proof</a>).

  - property: effective congruences
    proof: 'Let $q_1,q_2 : R \rightrightarrows G$ be a congruence in $\Grp_\c$. Since the induced homomorphism $(q_1,q_2) : R \to G \times G$ is a monomorphism, hence injective (<a href="/category/Grp_c?proof=monomorphism">proof</a>). Thus, we may assume that $R \subseteq G \times G$ is a subgroup and that $q_1,q_2$ are the two projections. By reflexivity, $R$ contains the diagonal of $G$. We know from the <a href="/category/Grp?proof=Malcev">proof</a> that $\Grp$ is Malcev that $R = \{(g,h) \in G^2 : g^{-1} h \in N \}$ for some normal subgroup $N \subseteq G$. It is the kernel pair of the projection $p : G \twoheadrightarrow G/N$ in $\Grp$, but also in $\Grp_\c$ since $G/N$ is countable.'

  - property: effective cocongruences
    proof: >-
      Let $G \rightrightarrows C$ be a cocongruence in $\Grp_\c$. Since $\Grp_\c \hookrightarrow \Grp$ is closed under finite colimits, this is the same as a cocongruence in $\Grp$ where $G,C \in \Grp$ happen to be countable groups. Since we already know that $\Grp$ has effective cocongruences (<a href="/category/Grp?proof=effective_cocongruences" data-allow-deduced>proof</a>), the cocongruence is the cokernel pair of some homomorphism of groups $K \to C$. If $K' \subseteq C$ denotes the image of $K$, it is then also the cokernel pair of the inclusion $K' \hookrightarrow C$, and $K'$ is countable.

unsatisfied_properties:
  - property: skeletal
    proof: The trivial groups with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: small
    proof: Even the collection of all trivial groups is not a set, since every set $X$ yields a trivial group with underlying set $\{X\}$.

  - property: all epimorphisms split
    proof: Apply the contrapositive of Lemma 15 <a href="/content/subcategories">here</a> to the inclusion $\Ab_\fg \hookrightarrow \Grp_\c$, which preserves epimorphisms since these are surjective in $\Ab_{\fg}$ (<a href="/category/Ab_fg?proof=epimorphism">proof</a>) and in $\Grp_\c$ (<a href="/category/Grp_c?proof=epimorphism">proof</a>), and use that $\Ab_\fg$ does not have all epimorphisms split (<a href="/category/Ab_fg?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

  - property: normal
    proof: Every non-normal subgroup of a countable group (such as $C_2 \hookrightarrow S_3$) provides a counterexample.

  - property: counital
    proof: The canonical morphism $F_2 = \IZ \sqcup \IZ \to \IZ \times \IZ$ is not a monomorphism since $F_2$ is not abelian.

  - property: countable powers
    proof: Since the forgetful functor $\Grp_\c \to \Set$ is representable, it preserves products. Therefore, if the power $\IZ^{\IN}$ exists in $\Grp_\c$, its underlying set must be the ordinary cartesian product, which however is uncountable.

  - property: ℵ₂-small copowers
    proof: 'Assume that the copower $G \coloneqq I \otimes \IZ$ exists in $\Grp_\c$. We will prove that $I$ is countable; in particular, $\aleph_1 \otimes \IZ$ does not exist. The copower is a countable group $G$ with a universal family of elements $(x_i)_{i \in I}$. For every $i \in I$ there is a homomorphism $G \to \IZ$ defined by $x_i \mapsto 1$ and $x_j \mapsto 0$ for $j \neq i$. In particular, $x_i \neq x_j$ whenever $i \neq j$. Thus, $x : I \to G$ is an injective map, which proves that $I$ is countable.'

  - property: regular quotient object classifier
    proof: We can copy the <a href="/category/Grp?proof=regular_quotient_object_classifier">proof</a> from $\Grp$.

  - property: pushout-stable regular monomorphisms
    proof: The regular monomorphisms are precisely the injective homomorphisms. Pushouts of injective homomorphisms between countable groups do not need to be injective, see <a href="https://math.stackexchange.com/questions/5088032">MSE/5088032</a>.

  - property: cogenerator
    proof: 'Assume that a cogenerator $Q$ exists in $\Grp_\c$. There are only countably many finitely generated subgroups of $Q$. But there are continuum many finitely generated simple groups; this follows from <a href="https://arxiv.org/abs/1807.06478">Hyde–Lodha</a>, Corollary 1.5. Hence, there is a finitely generated (and hence countable) simple group $H$ which does not embed into $Q$. Since $H$ is simple, any homomorphism $H \to Q$ must be trivial then. But then $\id_H, 1 : H \rightrightarrows H$ are not separated by a homomorphism $H \to Q$.'

  - property: ℵ₁-cofiltered limits
    proof: >-
      The argument is similar to the <a href="/category/Set_c?proof=aleph1-cofiltered_limits">proof</a> for $\Set_\c$. Since the forgetful functor $\Grp_\c \to \Set$ is representable, it preserves limits. Moreover, $\Grp \to \Set$ preserves limits. Therefore, it suffices to construct an $\aleph_1$-cofiltered diagram of countable groups whose $\Grp$-limit is not countable.
      Let $R$ be an uncountable set (such as $\IR$) and consider the poset $P_{<\aleph_1}(R)$ of countable subsets of $R$. It is $\aleph_1$-filtered, so its opposite is $\aleph_1$-cofiltered.
      Define a diagram $X : P_{<\aleph_1}(R)^{\op} \to \Grp_\c$ by mapping a countable subset $C \subseteq R$ to the free abelian group $F(C)$ on $C$ and an inclusion $C \subseteq D$ to the canonical epimorphism $F(D) \to F(C)$ which sends each element of $C$ to itself and sends all elements of $D \setminus C$ to $0$.
      For $r \in R$ we define $\varepsilon(r) \in \lim(X)$ by
      $$\varepsilon(r)_C = \begin{cases} r & r \in C \\ 0 & r \notin C \end{cases}$$
      It is easily checked that this indeed lies in the limit. Moreover, $\varepsilon(r) = \varepsilon(r')$ implies $r=r'$, since evaluating at $C \coloneqq \{r\}$ yields $r = r'$. Hence, $\lim(X)$ is uncountable.

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: '[countable case] free products'
  products:
    description: '[finite case] direct products with pointwise operations'

special_morphisms:
  isomorphism:
    description: bijective homomorphisms
    proof: It is a full subcategory of $\Grp$, for which isomorphisms are bijective homomorphisms (<a href="/category/Grp?proof=isomorphism" data-allow-deduced>proof</a>).
  monomorphism:
    description: injective homomorphisms
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the countable group $\IZ$), hence preserves monomorphisms.
  epimorphism:
    description: surjective homomorphisms
    proof: 'For the non-trivial direction, if $f : G \to H$ is an epimorphism, we may factor it as $G \to f(G) \to H$, and $f(G) \to H$ is still an epimorphism, but also an inclusion and hence a monomorphism. Since the category is mono-regular (<a href="/category/Grp_c?proof=mono-regular" data-allow-deduced>proof</a>), $f(G) \to H$ must be an isomorphism.'
