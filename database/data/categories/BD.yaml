id: BD
name: delooping of the double bicyclic monoid
notation: $BD$
objects: a single object $*$
morphisms: 'the elements of the monoid $D \coloneqq \langle f,g,s : fs = gs = 1 \rangle$'
description: >-
  Every monoid $M$ induces a category $BM$ with a single object $*$, morphisms given by the elements of $M$, and composition given by the monoid operation. Some of the properties of this category depend on the specific monoid.

  In this entry, we take the monoid $D$ freely generated by $f,g,s$ subject to the relations $fs = gs = 1$, which we call the double bicyclic monoid. It contains two copies of the <a href="https://en.wikipedia.org/wiki/Bicyclic_monoid">bicyclic monoid</a>, generated by $f,s$ and by $g,s$. Every element of $D$ can be uniquely written as $s^n w$ for $n \geq 0$ and a word $w$ in $f,g$.

  This category provides an example of a core-connected category that does not have reflexive coequalizers.
nlab_link: null

tags:
  - algebra

related:
  - BC
  - BN

satisfied_properties:
  - property: small
    proof: This is trivial.

  - property: countable
    proof: This is because the monoid $D$ is countable.

  - property: core-connected
    proof: The category has exactly one object.

  - property: skeletal
    proof: The category has exactly one object.

  - property: Cauchy complete
    proof: >-
      We need to show that every idempotent of $D$ splits. For a word $u$ in $f,g$ of length $k$, we have $u s^k = 1$, since every letter of $u$ is a left inverse of $s$.

      Now assume that $e = s^n w$ is idempotent, where $w$ is a word of length $k$. Thus, $e^2 = s^n w s^n w$. If $k \geq n$, we write $w = w' u$ with words $w'$ of length $k-n$ and $u$ of length $n$. Then $w s^n = w' u s^n = w'$, so that $e^2 = s^n w' w$. By the uniqueness of the normal form, $e^2 = e$ implies $w' w = w$, so $w'$ is empty, i.e. $k = n$. If $k < n$, then $w s^n = w s^k s^{n-k} = s^{n-k}$, so that $e^2 = s^{2n-k} w$. By the uniqueness of the normal form, $e^2 = e$ implies $2n-k = n$, i.e. $k = n$, which contradicts $k < n$.

      Every idempotent therefore has the form $e = s^n w$ for a word $w$ of length $n$. It splits because $w s^n = 1$.
    check_redundancy: false

  - property: core-thin
    proof: We need to prove that $1$ is the only invertible element of $D$. Every isomorphism is a monomorphism and an epimorphism. By the classification of monomorphisms and epimorphisms (see below), the only element that is both is $s^0 = 1$.

  - property: mono-regular
    proof: By our description of monomorphisms below, every monomorphism has the form $s^n$. Since $s$ is a split monomorphism, so is $s^n$. Every split monomorphism is a regular monomorphism.

  - property: epi-regular
    proof: By our description of epimorphisms below, every epimorphism is a word in $f,g$. Since $f$ and $g$ are split epimorphisms, so is every word in $f,g$. Every split epimorphism is a regular epimorphism.

  - property: coreflexive equalizers
    proof: >-
      It suffices to prove that every coreflexive pair $x,y$ satisfies $x=y$. Algebraically, this means that right inverses are uniquely determined in $D$. So assume that $r x = r y = 1$ for some $r,x,y \in D$. In particular, $r$ is an epimorphism, so that $r$ is a word in $f,g$ of some length $m$ by the classification of epimorphisms below. We claim that $x = s^m$; by symmetry, then also $y = s^m$.

      Write $x = s^n w$, where $w$ is a word in $f,g$. Since every letter of $r$ is a left inverse of $s$, we have $r s^m = 1$. If $n \geq m$, it follows that
      $$1 = r x = r s^m s^{n-m} w = s^{n-m} w,$$
      so that $n = m$ and $w$ is empty by the uniqueness of the normal form, i.e. $x = s^m$. If $n < m$, we write $r = r' u$ with words $r'$ of length $m-n$ and $u$ of length $n$. Then $u s^n = 1$, so that
      $$1 = r x = r' u s^n w = r' w.$$
      This is a contradiction, since $r' w$ is a non-empty word.

  - property: ℵ₁-accessible
    proof: >-
      The proof is very similar to the one for <a href="/category/BC">$BC$</a>. We apply Theorem 4 <a href="/content/deloopings-aleph1-accessible">here</a>. We already know that $D$ is countable and that $BD$ is Cauchy complete. It remains to show that $D$ satisfies the ascending chain condition on principal right ideals. Every principal right ideal of $D$ has the form $s^n w D = s^n D$, where $w$ is a word in $f,g$, since $w$ is a split epimorphism and hence $w D = D$. If $s^n D \subseteq s^{n'} D$, then $n \geq n'$. Otherwise, write $s^n = s^{n'} x$ with $x \in D$. Since $s^n$ is a monomorphism, we get $1 = s^{n'-n} x$, so that $s^{n'-n}$ is a split epimorphism, which contradicts the classification of epimorphisms below. Therefore, every ascending chain $s^{n_0} D \subseteq s^{n_1} D \subseteq \cdots$ satisfies $n_0 \geq n_1 \geq \cdots$ and hence becomes stationary.
    references:
      - BC_aleph1-accessible

  - property: ℵ₁-coaccessible
    proof: >-
      We apply Theorem 4 <a href="/content/deloopings-aleph1-accessible">here</a> to the opposite monoid $D^{\op}$, whose delooping is $(BD)^{\op}$. We already know that $D^{\op}$ is countable and that $(BD)^{\op}$ is Cauchy complete. It remains to show that $D^{\op}$ satisfies the ascending chain condition on principal right ideals, i.e. that $D$ satisfies the ascending chain condition on principal left ideals.

      Every principal left ideal of $D$ has the form $D s^n w = D w$, where $w$ is a word in $f,g$, since $s^n$ is a split monomorphism and hence $D s^n = D$. We claim that $D w \subseteq D w'$ implies that $w'$ is a suffix of $w$. To see this, write $w = t w'$ with $t \in D$ and write $t = s^k v$, where $v$ is a word in $f,g$. Then $w = s^k (v w')$, where $v w'$ is a word in $f,g$. By the uniqueness of the normal form, we get $k = 0$ and $w = v w'$.

      Now let $D w_0 \subseteq D w_1 \subseteq \cdots$ be an ascending chain of principal left ideals, where every $w_i$ is a word in $f,g$. By the claim, $w_{i+1}$ is a suffix of $w_i$ for all $i \geq 0$. Hence, the lengths of the words $w_i$ form a decreasing sequence of natural numbers, which becomes stationary. Once the lengths are equal, the suffix $w_{i+1}$ of $w_i$ equals $w_i$. Therefore, the chain becomes stationary.

unsatisfied_properties:
  - property: locally finite
    proof: This is because $D$ is infinite.

  - property: zero morphisms
    proof: We need to show that $D$ has no absorbing element. Assume that $s^n w$ is an absorbing element. Then $s^{n+1} w = s (s^n w) = s^n w$ implies $n+1=n$ by the uniqueness of the normal form, a contradiction.

  - property: sifted
    proof: >-
      The proof is very similar to the one for <a href="/category/BC">$BC$</a>. Consider the homomorphism $\deg : D \to (\IZ,+,0)$ defined by $\deg(s)=1$ and $\deg(f)=\deg(g)=-1$. It is well-defined since $\deg(fs) = \deg(gs) = 0 = \deg(1)$. To every cospan $(x,y)$ (over the unique pair of objects in $BD$) we associate the number $\deg(x) - \deg(y)$. If a cospan $(x,y)$ has a morphism to another cospan $(u,v)$, i.e. there is some element $t$ with $tx=u$ and $ty=v$, then
      $$\deg(u) - \deg(v) = (\deg(t)+\deg(x)) - (\deg(t)+\deg(y)) = \deg(x) - \deg(y).$$
      Therefore, all cospans in a connected component have the same associated number. In particular, the cospans $(1,1)$ and $(s,1)$ do not lie in the same connected component.
    label: BD_not_sifted
    references:
      - BC_not_sifted

  - property: cosifted
    proof: >-
      We use the homomorphism $\deg : D \to \IZ$ from the proof that $BD$ is not sifted. To every span $(x,y)$ we associate the number $\deg(x) - \deg(y)$. If a span $(u,v)$ has a morphism to another span $(x,y)$, i.e. there is some element $t$ with $u=xt$ and $v=yt$, then
      $$\deg(u) - \deg(v) = (\deg(x)+\deg(t)) - (\deg(y)+\deg(t)) = \deg(x) - \deg(y).$$
      Therefore, all spans in a connected component have the same associated number. In particular, the spans $(1,1)$ and $(s,1)$ do not lie in the same connected component.
    references:
      - BD_not_sifted

  - property: reflexive coequalizers
    proof: The pair $f,g$ is reflexive since $fs = gs = 1$. We claim that it is not coequalized by any morphism, so that in particular it has no coequalizer. Let $x = s^n w$ be an element of $D$, where $w$ is a word in $f,g$. Then $xf = s^n (wf)$ and $xg = s^n (wg)$ are in normal form, and the words $wf$ and $wg$ are different. By the uniqueness of the normal form, we get $xf \neq xg$.

  - property: kernel pairs
    proof: >-
      We show that $f$ does not have a kernel pair, i.e. that there is no universal pair of elements $(x,y) \in D^2$ with $fx=fy$; the universal property means that any other such pair $(u,v)$ factors as $u=xt$, $v=yt$ for a unique $t \in D$.

      Assume that $(x,y)$ is a universal pair. Since $(1,1)$ is a valid pair, there is a unique $t \in D$ with $1=xt$ and $1=yt$. In particular, $x$ and $y$ are epimorphisms. By their classification below, $x$ and $y$ are words in $f,g$. Then $fx$ and $fy$ are words in $f,g$ as well, so that $fx = fy$ implies $x=y$ by the uniqueness of the normal form.

      Since $f(sf) = f = f \cdot 1$, also $(sf,1)$ is a valid pair. Hence, there is some $t \in D$ with $sf=xt$ and $1=yt$. Since $x=y$, we obtain the contradiction $sf=1$.

  - property: cokernel pairs
    proof: >-
      We show that $s$ does not have a cokernel pair, i.e. that there is no universal pair of elements $(x,y) \in D^2$ with $xs=ys$; the universal property means that any other such pair $(u,v)$ factors as $u=tx$, $v=ty$ for a unique $t \in D$.

      Assume that $(x,y)$ is a universal pair. Since $(1,1)$ is a valid pair, there is a unique $t \in D$ with $1=tx$ and $1=ty$. In particular, $x$ and $y$ are monomorphisms. By their classification below, we get $x=s^n$, $y=s^k$ for some $n,k \geq 0$. Since $xs=ys$, we have $s^{n+1} = s^{k+1}$, so that $n=k$, i.e. $x=y$.

      Since $fs = gs$, also $(f,g)$ is a valid pair. Hence, there is some $t \in D$ with $f=tx$ and $g=ty$. Since $x=y$, we obtain the contradiction $f=g$.

  - property: sequential colimits
    proof: >-
      The proof is very similar to the one for <a href="/category/BC">$BC$</a>. We will show that the sequence
      $$* \xrightarrow{s} * \xrightarrow{s} * \xrightarrow{s} \cdots$$
      has no colimit. A cocone is a sequence of elements $(c_n)$ with $c_{n+1} s = c_n$ for all $n \geq 0$. Assume that the sequence has a colimit, i.e. a universal cocone $x=(x_n)$. Write $x_0 = s^a w$, where $w$ is a word in $f,g$. Choose some $m > a$ and define the sequence of elements $(c_n)$ by
      $$c_n \coloneqq \begin{cases}
      s^{m-n} & n \leq m \\
      f^{n-m} & n \geq m.
      \end{cases}$$
      This is a cocone: for $n < m$ we have $c_{n+1} s = s^{m-n-1} s = s^{m-n} = c_n$, and for $n \geq m$ we have $c_{n+1} s = f^{n-m} f s = f^{n-m} = c_n$. By universality, there is some $h \in D$ such that
      $$c_n = h x_n \tag{1}$$
      for all $n \geq 0$. Write $h = s^c v$, where $v$ is a word in $f,g$ of length $k$. For $n=0$ the cocone equality $(1)$ is:
      $$s^m = c_0 = h x_0 = s^c v s^a w.$$
      If $k \geq a$, we write $v = v' u$ with a word $u$ of length $a$. Since every letter of $u$ is a left inverse of $s$, we have $u s^a = 1$, so that the right hand side is $s^c v' w$. By the uniqueness of the normal form, $c = m > 0$. If $k < a$, then $v s^a = v s^k s^{a-k} = s^{a-k}$, so that the right hand side is $s^{c+a-k} w$. By the uniqueness of the normal form, $c = m-a+k \geq m-a > 0$. In each case, we find $c > 0$. That is, $h = sh'$ for some $h' \in D$.

      Next, we evaluate the cocone equality $(1)$ at $n=m+1$. We get
      $$f = c_{m+1} = h x_{m+1} = s (h' x_{m+1}).$$
      Since $f$ is an epimorphism, this implies that $s$ is also an epimorphism, which contradicts the classification of epimorphisms below.
    references:
      - BC_no_sequential_colimits

  - property: sequential limits
    proof: >-
      We will show that the sequence
      $$\cdots \xrightarrow{f} * \xrightarrow{f} * \xrightarrow{f} *$$
      has no limit. A cone is a sequence of elements $(x_n)$ with $f x_{n+1} = x_n$ for all $n \geq 0$. Assume that the sequence has a limit, i.e. a universal cone $x = (x_n)$.

      We claim that every $x_m$ is an epimorphism. To see this, let $m \geq 0$ and define the sequence of elements $(y_n)$ by
      $$y_n \coloneqq \begin{cases}
      f^{m-n} & n \leq m \\
      s^{n-m} & n \geq m.
      \end{cases}$$
      This is a cone: for $n < m$ we have $f y_{n+1} = f f^{m-n-1} = f^{m-n} = y_n$, and for $n \geq m$ we have $f y_{n+1} = f s s^{n-m} = s^{n-m} = y_n$. By universality, there is some $h \in D$ such that $y_n = x_n h$ for all $n \geq 0$. For $n = m$, this means $1 = x_m h$, so that $x_m$ is a split epimorphism.

      By the classification of epimorphisms below, every $x_n$ is therefore a word in $f,g$. By induction, we have $x_0 = f^n x_n$ for all $n \geq 0$, so that the word $x_0$ has length at least $n$ for all $n \geq 0$, which is impossible.

special_objects: {}

special_morphisms:
  isomorphisms:
    description: only the neutral element $1$
    proof: We have shown this in the proof that the category is core-thin.
  monomorphisms:
    description: the elements $s^n$ for $n \geq 0$
    proof: Since $fs = 1$, the element $s$ is a split monomorphism, and hence so is $s^n$. Conversely, let $x = s^n w$ be a monomorphism and assume that the word $w$ is non-empty. Then $w$ ends with $f$ or $g$, say $w = w' f$ (the case of $g$ is analogous). Since $x = s^n w' f$, the element $f$ is also a monomorphism. From $fs = 1$ we get $f (sf) = f = f \cdot 1$, hence $sf = 1$. But $sf \neq 1$ by the uniqueness of the normal form, which is a contradiction.
  epimorphisms:
    description: the words in $f,g$, i.e. the elements $s^0 w$
    proof: Since $fs = gs = 1$, the elements $f$ and $g$ are split epimorphisms, and hence so is every word in $f,g$. Conversely, let $x = s^n w$ be an epimorphism and assume that $n > 0$. Since $x = s (s^{n-1} w)$, the element $s$ is also an epimorphism. From $fs = 1$ we get $(sf) s = s = 1 \cdot s$, hence $sf = 1$, which is a contradiction as before.
