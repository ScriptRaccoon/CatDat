id: walking_commutative_square
name: walking commutative square
notation: $\Square$
objects: four objects $a,b,c,d$
morphisms: morphisms $a \to b$, $b \to d$, $a \to c$, $c \to d$, identities, and one morphism $a \to d$
description: >-
  This category consists of a commutative square:
  $$\begin{CD} a @>>> b \\ @VVV @VVV \\ c @>>> d \end{CD}$$
  Its name comes from the fact that a functor $\Square \to \C$ is the same as a <a href="https://ncatlab.org/nlab/show/commutative+square">commutative square</a> in $\C$. Notice that the category is isomorphic to the product category $I \times I$ of the <a href="/category/walking_morphism">walking morphism</a> with itself. Hence, most (but not all) properties are inherited from it.
nlab_link: https://ncatlab.org/nlab/show/commutative+square
tags:
  - category theory

related:
  - walking_fork
  - walking_morphism
  - forked_commutative_square

satisfied_properties:
  - property: small
    proof: The objects and morphisms form finite sets.

  - property: finite
    proof: There are $4$ objects and $9$ morphisms, namely $4$ identities and $5$ non-identity morphisms.

  - property: skeletal
    proof: The four objects are not isomorphic.

  - property: self-dual
    proof: There is an isomorphism $\Square^\op \to \Square$ defined by $a \mapsto d$, $b \mapsto b$, $c \mapsto c$, $d \mapsto a$. On morphisms, it is determined uniquely, since $\Square$ is thin (<a href="/category/walking_commutative_square?proof=thin" data-allow-deduced>proof</a>).

  - property: locally cartesian closed
    proof: This is because the walking morphism has this property (<a href="/category/walking_morphism?proof=locally_cartesian_closed" data-allow-deduced>proof</a>).

  - property: finitary algebraic
    proof: This follows from the fact that the walking morphism has this property (<a href="/category/walking_morphism?proof=finitary_algebraic" data-allow-deduced>proof</a>). Alternatively, we can view this category as the category of models of the finitary algebraic theory with two sorts $S_1,S_2$ and the equations $x=y$ for all $x,y \in S_1$ and for all $x,y \in S_2$. The models are $(0,0)$, $(1,0)$, $(0,1)$, and $(1,1)$.

unsatisfied_properties:
  - property: semi-strongly connected
    proof: There is no morphism between $b$ and $c$ (resp., between $(0,1)$ and $(1,0)$).

  - property: extremal generator
    proof: The corresponding poset has three distinct non-minimal elements $b,c,d$. Therefore, by <a href="/content/thin_extremal_generator#corollary">this corollary</a>, an extremal generator cannot exist.

special_objects:
  initial object:
    description: $a$
  terminal object:
    description: $d$
  coproducts:
    description: $b \sqcup c = d$, $a \sqcup x = x$, $d \sqcup x = d$, $x \sqcup x = x$
  products:
    description: $b \times c = a$, $x \times x = x$, $a \times x = a$, $d \times x = x$

special_morphisms: {}
