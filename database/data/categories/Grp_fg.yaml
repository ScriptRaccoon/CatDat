id: Grp_fg
name: category of finitely generated groups
notation: $\Grp_{\fg}$
objects: finitely generated groups
morphisms: group homomorphisms
description: This is a full subcategory of <a href="/category/Grp">$\Grp$</a> with $\FinGrp \subseteq \Grp_{\fg} \subseteq \Grp_{\c}$.
nlab_link: null

tags:
  - algebra

related:
  - Grp
  - Ab_fg
  - Grp_c
  - FinGrp

satisfied_properties:
  - property: locally small
    proof: It is a full subcategory of <a href="/category/Grp">$\Grp$</a>, which is locally small.

  - property: essentially small
    proof: Every finitely generated group is isomorphic to a quotient $F_n / N$ of a free group $F_n$ of finite rank $n \in \IN$ by some normal subgroup $N \subseteq F_n$, and these quotients form a set.

  - property: pointed
    proof: The trivial group is finitely generated and is a zero object.

  - property: finite products
    proof: This is because <a href="/category/Grp">$\Grp$</a> has finite products, and $\Grp_\fg \hookrightarrow \Grp$ is closed under finite products. Indeed, if $G$ is generated by $g_1,\dotsc,g_n$ and $H$ is generated by $h_1,\dotsc,h_m$, then $G \times H$ is generated by $(g_1,1),\dotsc,(g_n,1),(1,h_1),\dotsc,(1,h_m)$.

  - property: finite coproducts
    proof: This is because <a href="/category/Grp">$\Grp$</a> has finite coproducts (free products), and $\Grp_\fg \hookrightarrow \Grp$ is closed under finite coproducts, since $G \sqcup H$ is generated by the images of generating sets of $G$ and $H$.

  - property: coequalizers
    proof: 'This is because <a href="/category/Grp">$\Grp$</a> has coequalizers, and $\Grp_\fg \hookrightarrow \Grp$ is closed under coequalizers: the coequalizer of $f,g : G \rightrightarrows H$ in $\Grp$ is a quotient of $H$, and quotients of finitely generated groups are finitely generated.'
    label: grp_fg_coequalizers

  - property: extremal generator
    proof: The finitely generated group $\IZ$ is an extremal generator even in <a href="/category/Grp">$\Grp$</a>. Now use Lemma 10 <a href="/content/subcategories">here</a>.
    references:
      - grp_extremal_generator

  - property: mono-regular
    proof: >-
      This can be deduced from the corresponding property of <a href="/category/Grp">$\Grp$</a> as follows: Let $i : K \hookrightarrow G$ be a monomorphism in $\Grp_\fg$, i.e. an injective homomorphism of finitely generated groups (see below). Since $\Grp$ is mono-regular, there is a group $H$ and two homomorphisms $f,g : G \rightrightarrows H$ with $i = \eq(f,g)$ in $\Grp$. Let $H' \subseteq H$ be the subgroup generated by $\im(f) \cup \im(g)$. Since $G$ is finitely generated, also $H'$ is finitely generated. The homomorphisms $f,g$ corestrict to homomorphisms $f', g' : G \rightrightarrows H'$, and we still have $i = \eq(f',g')$ in $\Grp$. Since $K$ is finitely generated and $\Grp_\fg \hookrightarrow \Grp$ is fully faithful, $i = \eq(f',g')$ also holds in $\Grp_\fg$.

  - property: effective congruences
    proof: >-
      Let $p_1,p_2 : E \rightrightarrows G$ be a congruence in $\Grp_\fg$. Since the pair is jointly monomorphic, the induced homomorphism $(p_1,p_2) : E \to G \times G$ is a monomorphism, hence injective (see below). Thus, we may regard $E$ as a subgroup $R \subseteq G \times G$. Applying the definition of a congruence to $T \coloneqq \IZ$ shows that $R$ is an equivalence relation on $G$. Then $N \coloneqq \{x \in G : (x,1) \in R\}$ is a normal subgroup of $G$: it is a subgroup since $R$ is one, and for $x \in N$, $g \in G$ we have $(g x g^{-1},1) = (g,g) (x,1) (g,g)^{-1} \in R$. Moreover, $(a,b) \in R$ if and only if $(a b^{-1},1) = (a,b) (b,b)^{-1} \in R$, i.e. $a b^{-1} \in N$. This shows that $R$ is the kernel pair of the projection $h : G \to G/N$ in $\Grp$. Since $G/N$ is finitely generated and $R \cong E$ is finitely generated as well, and $\Grp_\fg \hookrightarrow \Grp$ is fully faithful, $R$ is also the kernel pair of $h$ in $\Grp_\fg$.

  - property: equalizers of cokernel pairs
    proof: 'Let $f : A \to B$ be a homomorphism of finitely generated groups and $C \coloneqq f(A)$. We already know that finite colimits in $\Grp_\fg$ are computed as in $\Grp$. Hence, the cokernel pair of $f$ is given by the amalgamated free product $B \sqcup_C B$ with its two inclusions $i_1,i_2 : B \rightrightarrows B \sqcup_C B$. By the normal form theorem for amalgamated free products (see, for example, Serre''s book <i>Trees</i>, Ch. I, §1, Thm. 1), $i_1$ and $i_2$ are injective, and $i_1(B) \cap i_2(B)$ is the image of $C$. Therefore, if $b \in B$ satisfies $i_1(b) = i_2(b)$, then $i_1(b) = i_1(c)$ for some $c \in C$, so that $b = c \in C$. This shows that the equalizer of $i_1,i_2$ in $\Grp$ is the inclusion $C \hookrightarrow B$. Since $C$ is finitely generated, it is also the equalizer in $\Grp_\fg$.'
    label: grp_fg_cokernel_pairs

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: small
    proof: Even the collection of all trivial groups is not a set.

  - property: locally finite
    proof: The set $\Hom(\IZ,\IZ) \cong \IZ$ is infinite.

  - property: essentially countable
    proof: There are uncountably many pairwise non-isomorphic finitely generated groups. This is a classical result by B. H. Neumann in <a href="https://doi.org/10.1112/jlms/s1-12.46.120" target="_blank">Some remarks on infinite groups</a> (1937), who even constructed continuum many pairwise non-isomorphic $2$-generated groups. It also follows from Corollary 1.5 in <a href="https://arxiv.org/abs/1807.06478" target="_blank">Finitely generated infinite simple groups of homeomorphisms of the real line</a> by J. Hyde and Y. Lodha, which provides continuum many finitely generated simple groups.
    label: grp_fg_uncountably_many_objects

  - property: kernels
    proof: >-
      Consider the free group $F_2 = \langle x,y \rangle$ and the homomorphism $\varphi : F_2 \to \IZ$ with $\varphi(x) = 1$ and $\varphi(y) = 0$. Its kernel $L \subseteq F_2$ in $\Grp$ is not finitely generated. To see this, consider the homomorphism $\psi : F_2 \to \IZ \wr \IZ = (\bigoplus_{n \in \IZ} \IZ) \rtimes \IZ$ that maps $x$ to the generator $t$ of the right factor, which acts by shifting the coordinates via $t e_n t^{-1} = e_{n+1}$, and $y$ to the basis vector $e_0$ of the left factor. Since $\varphi$ is the composition of $\psi$ with the projection onto the right factor, $\psi$ maps $L$ into $\bigoplus_{n \in \IZ} \IZ$. In fact, $\psi(L) = \bigoplus_{n \in \IZ} \IZ$, since $L$ contains $x^n y x^{-n}$ and $\psi(x^n y x^{-n}) = e_n$. But $\bigoplus_{n \in \IZ} \IZ$ is not finitely generated, since any finite subset is contained in a subgroup $\bigoplus_{|n| \leq N} \IZ$. Hence, $L$ is not finitely generated either.


      Now assume that $\varphi$ has a kernel $k : K \to F_2$ in $\Grp_\fg$. Since the functor $\Hom(\IZ,-) : \Grp_\fg \to \Set$ preserves limits, $\Hom(\IZ,k)$ is a bijection from $\Hom(\IZ,K)$ to the set of homomorphisms $u : \IZ \to F_2$ such that $\varphi \circ u$ is trivial. This means that $k$ is injective with image $L$. Hence, $K \cong L$ is not finitely generated, a contradiction.
    label: grp_fg_no_kernels

  - property: normal
    proof: 'Every non-normal subgroup of a finitely generated group (such as $C_2 \hookrightarrow S_3$) provides a counterexample. Indeed, if an injective homomorphism $k : K \to G$ is the kernel of some $f : G \to H$ in $\Grp_\fg$, then, as in the proof above, the representable functor $\Hom(\IZ,-)$ shows that $k(K) = \ker(f)$, which is a normal subgroup of $G$.'
    references:
      - grp_fg_no_kernels

  - property: countable powers
    proof: Since the forgetful functor $\Grp_\fg \to \Set$ is representable (by $\IZ$), it preserves products. Therefore, if the power $\IZ^{\IN}$ exists in $\Grp_\fg$, its underlying set must be the ordinary cartesian product, which however is uncountable. But every finitely generated group is countable.

  - property: countable copowers
    proof: 'Assume that the copower $C \coloneqq \IN \otimes \IZ$ exists in $\Grp_\fg$. It is a finitely generated group $C$ with a universal family of elements $(x_n)_{n \in \IN}$. For every $m \geq 0$ there is a homomorphism $C \to \IZ^m$ defined by $x_n \mapsto e_n$ for $n < m$ and $x_n \mapsto 0$ for $n \geq m$, where $e_0,\dotsc,e_{m-1}$ denotes the standard basis of $\IZ^m$. It is surjective. If $C$ is generated by $d$ elements, it follows that $\IZ^m$ is generated by $d$ elements, and hence $(\IZ/2)^m$ as well. This implies $2^m \leq 2^d$, which fails for $m > d$.'

  - property: epi-regular
    proof: 'Since there are only countably many finite presentations, there are only countably many finitely presented groups up to isomorphism. Since there are uncountably many finitely generated groups up to isomorphism, there is a finitely generated group $H$ that is not finitely presented. Choose a surjective homomorphism $f : F_n \to H$ from a free group of finite rank. It is an epimorphism (see below). If it were regular, its kernel would be the normal closure of finitely many elements (see below), so that $H \cong F_n / \ker(f)$ would be finitely presented.'
    references:
      - grp_fg_uncountably_many_objects
    label: grp_fg_not_epi_regular

  - property: kernel pairs
    proof: >-
      As in the proof that $\Grp_\fg$ is not epi-regular, choose a surjective homomorphism $f : G \to H$, where $G$ is a free group of finite rank and $H$ is finitely generated but not finitely presented. Then the kernel $N$ of $f$ is not the normal closure of finitely many elements. Assume that $f$ has a kernel pair in $\Grp_\fg$. Since the functor $\Hom(\IZ,-) : \Grp_\fg \to \Set$ preserves limits, it must be isomorphic to the subgroup
      $$R \coloneqq \{(a,b) \in G \times G : f(a) = f(b)\},$$
      which is therefore finitely generated, say by $(a_1,b_1),\dotsc,(a_n,b_n)$. Notice that $a_i b_i^{-1} \in N$. Let $M \subseteq N$ be the normal closure of $a_1 b_1^{-1},\dotsc,a_n b_n^{-1}$. Then
      $$S \coloneqq \{(a,b) \in G \times G : a b^{-1} \in M \}$$
      is a subgroup of $G \times G$, because $M$ is normal. It contains all $(a_i,b_i)$, hence $R \subseteq S$. For $x \in N$ we have $(x,1) \in R$, hence $(x,1) \in S$, i.e. $x \in M$. Thus, $N = M$, a contradiction.
    references:
      - grp_fg_not_epi_regular

  - property: coquotients of cocongruences
    proof: >-
      Let $\varphi : F_2 \to \IZ$ and $L \coloneqq \ker(\varphi)$ be as in the proof that $\Grp_\fg$ has no kernels; we have seen that $L$ is not finitely generated. Let $E \coloneqq F_2 \sqcup_L F_2$ be the amalgamated free product (pushout in $\Grp$) with its two inclusions $i_1,i_2 : F_2 \rightrightarrows E$. Then $E$ is finitely generated, since it is generated by $i_1(F_2) \cup i_2(F_2)$. This also shows that $i_1,i_2$ are jointly epimorphic. For every group $T$, the image of $\Hom(E,T) \to \Hom(F_2,T)^2$ consists of those pairs $(a,b)$ with $a|_L = b|_L$, which is an equivalence relation. Hence, $i_1,i_2$ is a cocongruence in $\Grp_\fg$.


      We claim that $\{g \in F_2 : i_1(g) = i_2(g)\} = L$. The inclusion $\supseteq$ is clear. Conversely, let $g \in F_2 \setminus L$. The homomorphisms $a,b : F_2 \rightrightarrows F_2 \times \IZ$ defined by $a(w) \coloneqq (w,\varphi(w))$ and $b(w) \coloneqq (w,0)$ agree on $L$, so there is a homomorphism $c : E \to F_2 \times \IZ$ with $c \circ i_1 = a$ and $c \circ i_2 = b$. Since $a(g) \neq b(g)$, we get $i_1(g) \neq i_2(g)$.


      Now assume that $i_1,i_2$ have an equalizer $e : K \to F_2$ in $\Grp_\fg$. Since the functor $\Hom(\IZ,-) : \Grp_\fg \to \Set$ preserves limits, $e$ is injective with image $\{g \in F_2 : i_1(g) = i_2(g)\} = L$. Hence, $K \cong L$ is not finitely generated, a contradiction.
    references:
      - grp_fg_no_kernels

  - property: counital
    proof: The canonical morphism $F_2 = \IZ \sqcup \IZ \to \IZ \times \IZ$ is not a monomorphism since $F_2$ is not abelian.

  - property: cogenerator
    proof: 'Assume that a cogenerator $Q$ exists in $\Grp_\fg$. Since $Q$ is countable, there are only countably many finitely generated subgroups of $Q$. But there are continuum many finitely generated simple groups; this follows from Corollary 1.5 in <a href="https://arxiv.org/abs/1807.06478" target="_blank">Finitely generated infinite simple groups of homeomorphisms of the real line</a> by J. Hyde and Y. Lodha. Hence, there is a finitely generated simple group $H$ which does not embed into $Q$. Since $H$ is simple, any non-trivial homomorphism $H \to Q$ would be injective, so every homomorphism $H \to Q$ must be trivial. But then $\id_H, 1 : H \rightrightarrows H$ are not separated by a homomorphism $H \to Q$.'

  - property: coregular
    proof: >-
      We show that regular monomorphisms are not stable under pushouts. Consider the group $B \coloneqq \IZ[1/2] \rtimes \IZ$ with multiplication $(a,m) \cdot (b,n) = (a + 2^m b, m + n)$. It is generated by $x \coloneqq (1,0)$ and $t \coloneqq (0,1)$, since $t^{-n} x t^n = (2^{-n},0)$. We have $t x t^{-1} = (2,0) = x^2$. Let $i : \IZ \to B$ be the injective homomorphism with $i(1) = x$; it is a regular monomorphism since we already know that $\Grp_\fg$ is mono-regular. Let $g : \IZ \to \IZ/2$ be the projection. Consider the pushout of $i$ and $g$ with morphisms $j : \IZ/2 \to P$ and $k : B \to P$ satisfying $j \circ g = k \circ i$. Then
      $$k(t) \, k(x) \, k(t)^{-1} = k(x^2) = k(i(2)) = j(g(2)) = 1,$$
      hence $k(x) = 1$ and therefore $j(g(1)) = k(i(1)) = k(x) = 1$. So $j$ is not injective, i.e. not a monomorphism.

  - property: regular quotient object classifier
    proof: >-
      We adapt the proof for <a href="/category/Grp">$\Grp$</a>. Assume that $\Grp_\fg$ has a regular quotient object classifier $\Psi \to 1$, where $1$ denotes the trivial group. Since pushouts in $\Grp_\fg$ are computed as in $\Grp$, this means that for every regular epimorphism $e : A \to B$ there is a unique homomorphism $\psi : \Psi \to A$ such that $e$ is the cokernel of $\psi$, i.e. $\ker(e)$ is the normal closure of $\psi(\Psi)$. If $c_g : A \to A$ denotes the conjugation with $g \in A$, then $c_g \circ \psi$ has the same property, so that $c_g \circ \psi = \psi$ by uniqueness. Hence, $\psi(\Psi)$ is contained in the center $Z(A)$, and so is $\ker(e)$, since $Z(A)$ is a normal subgroup. Now apply this to $A \coloneqq S_3$ and $e : S_3 \to 1$, which is a regular epimorphism since its kernel $S_3$ is the normal closure of finitely many elements (see below). We get $S_3 \subseteq Z(S_3)$, which is false.
    references:
      - grp_no_regular_quotient_object_classifier

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: '[finite case] free products'
  products:
    description: '[finite case] direct products with pointwise operations'

special_morphisms:
  isomorphisms:
    description: bijective homomorphisms
    proof: It is a full subcategory of $\Grp$, for which we know that isomorphisms are bijective homomorphisms.
  monomorphisms:
    description: injective homomorphisms
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the finitely generated group $\IZ$), hence preserves monomorphisms.
  epimorphisms:
    description: surjective homomorphisms
    proof: 'For the non-trivial direction, if $f : G \to H$ is an epimorphism, we may factor it as $G \to f(G) \to H$, where $f(G)$ is finitely generated as a quotient of $G$. Then $f(G) \to H$ is still an epimorphism, but also an inclusion and hence a monomorphism. Since we already know that the category is mono-regular, $f(G) \to H$ must be an isomorphism.'
  regular epimorphisms:
    description: surjective homomorphisms whose kernel is the normal closure of finitely many elements
    proof: >-
      If $f : G \to H$ is a regular epimorphism, it is the coequalizer of some pair $a,b : K \rightrightarrows G$ in $\Grp_\fg$. We already know that coequalizers in $\Grp_\fg$ are computed as in $\Grp$. Therefore, $f$ is surjective, and its kernel $N$ is the normal closure of $\{a(k) b(k)^{-1} : k \in K\}$. Let $k_1,\dotsc,k_n$ be generators of $K$, and let $M \subseteq N$ be the normal closure of $a(k_1) b(k_1)^{-1}, \dotsc, a(k_n) b(k_n)^{-1}$. The two homomorphisms $K \rightrightarrows G \to G/M$ agree on the generators $k_i$, hence they are equal, which means $a(k) b(k)^{-1} \in M$ for all $k \in K$. Thus, $N = M$.


      Conversely, let $f : G \to H$ be a surjective homomorphism whose kernel is the normal closure of $g_1,\dotsc,g_n \in G$. Let $a : F_n \to G$ be the homomorphism from the free group $F_n$ on $e_1,\dotsc,e_n$ with $a(e_i) = g_i$, and let $1 : F_n \to G$ be the trivial homomorphism. Then $f$ is the coequalizer of $a,1$ in $\Grp$, and hence also in $\Grp_\fg$, since $F_n$ is finitely generated.
