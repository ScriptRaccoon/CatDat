id: Grp_fg
name: category of finitely generated groups
notation: $\Grp_{\fg}$
objects: finitely generated groups
morphisms: group homomorphisms
description: This is a full subcategory of <a href="/category/Grp">$\Grp$</a> with $\FinGrp \subseteq \Grp_{\fg} \subseteq \Grp_{\c}$.
nlab_link: null

tags:
  - algebra

related:
  - Grp
  - Ab_fg
  - Grp_c
  - FinGrp

satisfied_properties:
  - property: locally small
    proof: It is a full subcategory of <a href="/category/Grp">$\Grp$</a>, which is locally small.

  - property: essentially small
    proof: Every finitely generated group is isomorphic to a quotient $F_n / N$ of a free group $F_n$ of finite rank $n \in \IN$ by some normal subgroup $N \subseteq F_n$, and these quotients form a set.

  - property: pointed
    proof: The trivial group is finitely generated and is a zero object.

  - property: finite products
    proof: This is because <a href="/category/Grp">$\Grp$</a> has finite products, and $\Grp_\fg \hookrightarrow \Grp$ is closed under finite products. Indeed, if $G$ is generated by $g_1,\dotsc,g_n$ and $H$ is generated by $h_1,\dotsc,h_m$, then $G \times H$ is generated by $(g_1,1),\dotsc,(g_n,1),(1,h_1),\dotsc,(1,h_m)$.

  - property: finite coproducts
    proof: This is because <a href="/category/Grp">$\Grp$</a> has finite coproducts (free products), and $\Grp_\fg \hookrightarrow \Grp$ is closed under finite coproducts, since $G \sqcup H$ is generated by the images of generating sets of $G$ and $H$.

  - property: coequalizers
    proof: 'This is because <a href="/category/Grp">$\Grp$</a> has coequalizers, and $\Grp_\fg \hookrightarrow \Grp$ is closed under coequalizers: the coequalizer of $f,g : G \rightrightarrows H$ in $\Grp$ is a quotient of $H$, and quotients of finitely generated groups are finitely generated.'
    label: grp_fg_coequalizers

  - property: extremal generator
    proof: The finitely generated group $\IZ$ is an extremal generator even in <a href="/category/Grp">$\Grp$</a>. Now use Lemma 10 <a href="/content/subcategories">here</a>.
    references:
      - Grp_extremal_generator

  - property: mono-regular
    proof: >-
      This is the same argument as for <a href="/category/Grp_c">$\Grp_\c$</a> and can be deduced from the corresponding property of <a href="/category/Grp">$\Grp$</a> as follows: Let $i : K \hookrightarrow G$ be a monomorphism in $\Grp_\fg$, i.e. an injective homomorphism of finitely generated groups (see below). Since $\Grp$ is mono-regular, there is a group $H$ and two homomorphisms $f,g : G \rightrightarrows H$ with $i = \eq(f,g)$ in $\Grp$. Let $H' \subseteq H$ be the subgroup generated by $\im(f) \cup \im(g)$. Since $G$ is finitely generated, also $H'$ is finitely generated. The homomorphisms $f,g$ corestrict to homomorphisms $f', g' : G \rightrightarrows H'$, and we still have $i = \eq(f',g')$ in $\Grp$. Since $K$ is finitely generated and $\Grp_\fg \hookrightarrow \Grp$ is fully faithful, $i = \eq(f',g')$ also holds in $\Grp_\fg$.
    references:
      - grpc_mono-regular

  - property: effective congruences
    proof: >-
      Let $p_1,p_2 : E \rightrightarrows G$ be a congruence in $\Grp_\fg$. Since the pair is jointly monomorphic, the induced homomorphism $(p_1,p_2) : E \to G \times G$ is a monomorphism, hence injective (see below). Thus, $E$ is isomorphic to a subgroup $R \subseteq G \times G$, which contains the diagonal of $G$. We know from the proof that <a href="/category/Grp">$\Grp$</a> is Malcev that $R$ is the congruence induced by the normal subgroup $N \coloneqq \{x \in G : (x,1) \in R\}$, i.e. $R$ is the kernel pair of the projection $h : G \to G/N$ in $\Grp$. Since $G/N$ and $R \cong E$ are finitely generated and $\Grp_\fg \hookrightarrow \Grp$ is fully faithful, $R$ is also the kernel pair of $h$ in $\Grp_\fg$.
    references:
      - Grp_malcev

  - property: equalizers of cokernel pairs
    proof: >-
      Let $f : A \to B$ be a homomorphism of finitely generated groups and $C \coloneqq f(A)$. We already know that finite colimits in $\Grp_\fg$ are computed as in $\Grp$. Hence, the cokernel pair $i_1,i_2 : B \rightrightarrows B \sqcup_A B$ of $f$ is computed as in $\Grp$. Since $A \to C$ is surjective, two homomorphisms $B \rightrightarrows T$ agree after composing with $f$ if and only if they agree on $C$. Therefore, $i_1,i_2$ is also the cokernel pair of the inclusion $C \hookrightarrow B$ in $\Grp$. Since <a href="/category/Grp">$\Grp$</a> is mono-regular, $C \hookrightarrow B$ is a regular monomorphism in $\Grp$, so it is the equalizer of its cokernel pair $i_1,i_2$ in $\Grp$ by <a href="/content/regular-epis-kernel-pairs">this lemma</a>. Since $C$ is finitely generated as a quotient of $A$, and $\Grp_\fg \hookrightarrow \Grp$ is fully faithful, $C \hookrightarrow B$ is also the equalizer of $i_1,i_2$ in $\Grp_\fg$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: small
    proof: Even the collection of all trivial groups is not a set.

  - property: locally finite
    proof: The set $\Hom(\IZ,\IZ) \cong \IZ$ is infinite.

  - property: essentially countable
    proof: There are uncountably many pairwise non-isomorphic finitely generated groups. This is a classical result by <a href="https://doi.org/10.1112/jlms/s1-12.46.120">Neumann</a> (1937), who even constructed continuum many pairwise non-isomorphic $2$-generated groups. It also follows from <a href="https://arxiv.org/abs/1807.06478">Hyde–Lodha</a>, Corollary 1.5, which provides continuum many finitely generated simple groups.
    label: grp_fg_uncountably_many_objects

  - property: kernels
    proof: >-
      First of all, the forgetful functor $\Grp_\fg \hookrightarrow \Grp$ is continuous because the forgetful functor $\Grp \to \Set$ is continuous and conservative, and the composite functor $\Grp_\fg \to \Set$ is continuous (in fact, representable). Therefore, it suffices to show that $\Grp_\fg$ is not closed under kernels in $\Grp$.

      Consider the free group $F_2 = \langle x,y \rangle$ and the homomorphism $\varphi : F_2 \to \IZ$ with $\varphi(x) = 1$ and $\varphi(y) = 0$. Its kernel $L \subseteq F_2$ in $\Grp$ is not finitely generated. To see this, consider the restricted wreath product
      $$\textstyle \IZ \wr \IZ = (\bigoplus_{n \in \IZ} \IZ) \rtimes \IZ = \langle (e_n)_{n \in \IZ}, t : t e_n t^{-1} = e_{n+1}, \, [e_n,e_m]=1 \rangle.$$
      Define the homomorphism $\psi : F_2 \to \IZ \wr \IZ$ by $\psi(x)=t$ and $\psi(y)=e_0$. Since $\varphi$ is the composition of $\psi$ with the projection onto the right factor, $\psi$ maps $L$ into $\bigoplus_{n \in \IZ} \IZ$. In fact, $\psi(L) = \bigoplus_{n \in \IZ} \IZ$, since $L$ contains $x^n y x^{-n}$ and
      $$\psi(x^n y x^{-n}) = t^n e_0 t^{-n} = e_n.$$
      But $\bigoplus_{n \in \IZ} \IZ$ is not finitely generated. Hence, $L$ is not finitely generated either.
    label: grp_fg_no_kernels

  - property: normal
    proof: 'Every non-normal finitely generated subgroup of a finitely generated group (such as $C_2 \hookrightarrow S_3$) provides a counterexample. Indeed, if an injective homomorphism $i : K \to G$ is the kernel of some $f : G \to H$ in $\Grp_\fg$, then, using again that $\Grp_\fg \hookrightarrow \Grp$ is continuous, it would also be the kernel in $\Grp$, so that $i$ is the inclusion of a normal subgroup.'
    references:
      - grp_fg_no_kernels

  - property: countable powers
    proof: This is the same argument as for <a href="/category/Grp_c">$\Grp_\c$</a>. Since the forgetful functor $\Grp_\fg \to \Set$ is representable (by $\IZ$), it preserves products. Therefore, if the power $\IZ^{\IN}$ exists in $\Grp_\fg$, its underlying set must be the ordinary cartesian product, which however is uncountable. But every finitely generated group is countable.
    references:
      - grpc_no_countable_powers

  - property: countable copowers
    proof: Assume that the copower $C \coloneqq \IN \otimes \IZ$ exists in $\Grp_\fg$. It is a finitely generated group $C$ with a universal family of elements $(x_n)_{n \in \IN}$. Let us say that $C$ is generated by $d$ elements. Then every finitely generated group $G$ is generated by $d$ elements, since for a generating set $\{g_0,\dotsc,g_m\}$ of $G$ we find a homomorphism $C \to G$ mapping $x_n \mapsto g_n$ for $n \leq m$ and $x_n \mapsto 1$ for $n > m$, and it is clearly surjective. This is absurd, since for example $\IZ^{d+1}$ is not generated by $d$ elements.

  - property: ℵ₁-cofiltered limits
    proof: Since the inclusion $\Grp_\fg \hookrightarrow \Grp$ is continuous (see the proof that $\Grp_\fg$ has no kernels), it suffices to show that $\Grp_\fg$ is not closed under $\aleph_1$-cofiltered limits in $\Grp$. This is done <a href="/content/fg-groups-aleph1-cofiltered-limits">here</a>, using a non-trivial finitely generated group $G$ satisfying $G \cong G \times G$ to build an $\aleph_1$-cofiltered diagram of finitely generated groups whose limit in $\Grp$ is uncountable. Remark that <a href="/category/Ab_fg">$\Ab_\fg$</a> <i>is</i> closed under $\aleph_1$-cofiltered limits.
    references:
      - grp_fg_no_kernels

  - property: ℵ₁-filtered colimits
    proof: This is shown <a href="/content/fg-groups-aleph1-filtered-colimits">here</a>, using an uncountable group in which every countable subset is contained in a finitely generated subgroup, and which is a subgroup of a countable product of finitely generated groups.

  - property: epi-regular
    proof: >-
      Consider the homomorphism $\psi : F_2 \to \IZ \wr \IZ$ from the proof that $\Grp_\fg$ has no kernels, which maps $x \mapsto t$ and $y \mapsto e_0$. It is surjective, since $\IZ \wr \IZ$ is generated by $t$ and the elements $t^n e_0 t^{-n} = e_n$, so it is an epimorphism. By a theorem of <a href="https://doi.org/10.1007/BF01211007">Baumslag</a>, the restricted wreath product $\IZ \wr \IZ$ is not finitely presented (he shows more generally that a restricted wreath product $A \wr B$ of non-trivial finitely presented groups is finitely presented if and only if $B$ is finite). If $\psi$ were regular, its kernel would be the normal closure of finitely many elements (see below), so that $\IZ \wr \IZ \cong F_2 / \ker(\psi)$ would be finitely presented.

      Alternatively, here is a counting argument: Since there are only countably many finite presentations, there are only countably many finitely presented groups up to isomorphism. Since there are uncountably many finitely generated groups up to isomorphism (see the proof that $\Grp_\fg$ is not essentially countable), there is a finitely generated group $H$ that is not finitely presented. Choose a surjective homomorphism $f : F_n \to H$ from a free group of finite rank. As above, it is an epimorphism, but not a regular one.
    references:
      - grp_fg_no_kernels
      - grp_fg_uncountably_many_objects
    label: grp_fg_not_epi_regular

  - property: kernel pairs
    proof: >-
      We apply Lemma 12 <a href="/content/subcategories">here</a> to the inclusion $\Grp_\fg \hookrightarrow \Grp$. It preserves limits (see the proof that $\Grp_\fg$ has no kernels), in particular kernel pairs. It maps epimorphisms to regular epimorphisms, since epimorphisms in $\Grp_\fg$ are surjective (see below), and surjective homomorphisms are regular epimorphisms in <a href="/category/Grp">$\Grp$</a>. Since we already know that $\Grp_\fg$ is not epi-regular, it does not have kernel pairs. More precisely, every epimorphism in $\Grp_\fg$ that is not regular, such as $F_2 \to \IZ \wr \IZ$, has no kernel pair.
    references:
      - grp_fg_no_kernels

  - property: coquotients of cocongruences
    proof: >-
      We show that if $G$ is a finitely generated group and $L \subseteq G$ is a subgroup that is not finitely generated, then the cokernel pair of $L \hookrightarrow G$ in $\Grp$ is a cocongruence in $\Grp_\fg$ without an equalizer. Such subgroups exist, for example the kernel $L \subseteq F_2$ from the proof that $\Grp_\fg$ has no kernels.

      Let $E \coloneqq G \sqcup_L G$ be the pushout in $\Grp$ with its two inclusions $i_1,i_2 : G \rightrightarrows E$. Then $E$ is finitely generated, since it is generated by $i_1(G) \cup i_2(G)$, and $i_1,i_2$ is a cocongruence in $\Grp$. Since $\Grp_\fg$ is a full subcategory containing $G$ and $E$, it is also a cocongruence in $\Grp_\fg$.

      Since <a href="/category/Grp">$\Grp$</a> is mono-regular, $L \hookrightarrow G$ is a regular monomorphism in $\Grp$. By <a href="/content/regular-epis-kernel-pairs">this lemma</a>, it is therefore the equalizer of its cokernel pair $i_1,i_2$ in $\Grp$. Now assume that $i_1,i_2$ have an equalizer $e : K \to G$ in $\Grp_\fg$. Since the inclusion $\Grp_\fg \hookrightarrow \Grp$ preserves limits (see the proof that $\Grp_\fg$ has no kernels), $e$ is also an equalizer of $i_1,i_2$ in $\Grp$. So $K \cong L$, which is not finitely generated, a contradiction.
    references:
      - grp_fg_no_kernels

  - property: counital
    proof: The canonical morphism $F_2 = \IZ \sqcup \IZ \to \IZ \times \IZ$ is not a monomorphism since $F_2$ is not abelian.

  - property: cogenerator
    proof: 'This is the same argument as for <a href="/category/Grp_c">$\Grp_\c$</a>. Assume that a cogenerator $Q$ exists in $\Grp_\fg$. Since $Q$ is countable, there are only countably many finitely generated subgroups of $Q$. But there are continuum many finitely generated simple groups; this follows from <a href="https://arxiv.org/abs/1807.06478">Hyde–Lodha</a>, Corollary 1.5. Hence, there is a finitely generated simple group $H$ which does not embed into $Q$. Since $H$ is simple, any non-trivial homomorphism $H \to Q$ would be injective, so every homomorphism $H \to Q$ must be trivial. But then $\id_H, 1 : H \rightrightarrows H$ are not separated by a homomorphism $H \to Q$.'
    references:
      - grpc_no_cogenerator

  - property: coregular
    proof: Pushouts of injective homomorphisms between finitely generated groups do not need to be injective, see <a href="https://math.stackexchange.com/questions/5088032">MSE/5088032</a>.

  - property: regular quotient object classifier
    proof: >-
      We adapt the proof for <a href="/category/Grp">$\Grp$</a>. Assume that $\Grp_\fg$ has a regular quotient object classifier, i.e. a finitely generated group $P$ such that every regular epimorphism $G \to H$ in $\Grp_\fg$ is the cokernel of a unique homomorphism $\varphi : P \to G$; here we use that pushouts in $\Grp_\fg$ are computed as in $\Grp$. By the classification of regular epimorphisms (see below), this means equivalently that every normal subgroup $N \subseteq G$ which is the normal closure of finitely many elements is $\langle \langle \varphi(P) \rangle \rangle$ for a unique homomorphism $\varphi : P \to G$, where $\langle \langle - \rangle \rangle$ denotes the normal closure. If $c_g : G \to G$ denotes the conjugation by $g \in G$, then the images of $\varphi$ and $c_g \circ \varphi$ have the same normal closure, so the homomorphisms must be equal. In other words, $\varphi$ factors through the center $Z(G)$. But then every normal subgroup of $G$ that is the normal closure of finitely many elements, in particular $G$ itself, would be contained in $Z(G)$, which is wrong for every non-abelian finitely generated group $G$, such as $S_3$.
    references:
      - Grp_no_regular_quotient_object_classifier

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: '[finite case] free products'
  products:
    description: '[finite case] direct products with pointwise operations'

special_morphisms:
  isomorphisms:
    description: bijective homomorphisms
    proof: It is a full subcategory of $\Grp$, for which we know that isomorphisms are bijective homomorphisms.
  monomorphisms:
    description: injective homomorphisms
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the finitely generated group $\IZ$), hence preserves monomorphisms.
  epimorphisms:
    description: surjective homomorphisms
    proof: 'This is the same argument as for <a href="/category/Grp_c">$\Grp_\c$</a>. For the non-trivial direction, if $f : G \to H$ is an epimorphism, we may factor it as $G \to f(G) \to H$, where $f(G)$ is finitely generated as a quotient of $G$. Then $f(G) \to H$ is still an epimorphism, but also an inclusion and hence a monomorphism. Since we already know that the category is mono-regular, $f(G) \to H$ must be an isomorphism.'
  regular epimorphisms:
    description: surjective homomorphisms whose kernel is the normal closure of finitely many elements
    proof: >-
      If $f : G \to H$ is a regular epimorphism, it is the coequalizer of some pair $a,b : K \rightrightarrows G$ in $\Grp_\fg$. We already know that coequalizers in $\Grp_\fg$ are computed as in $\Grp$. Therefore, $f$ is surjective, and its kernel $N$ is the normal closure of $\{a(k) b(k)^{-1} : k \in K\}$. Let $k_1,\dotsc,k_n$ be generators of $K$, and let $M \subseteq N$ be the normal closure of $a(k_1) b(k_1)^{-1}, \dotsc, a(k_n) b(k_n)^{-1}$. The two homomorphisms $K \rightrightarrows G \to G/M$ agree on the generators $k_i$, hence they are equal, which means $a(k) b(k)^{-1} \in M$ for all $k \in K$. Thus, $N = M$. This proves that $N$ is the normal closure of finitely many elements.

      Conversely, let $f : G \to H$ be a surjective homomorphism whose kernel is the normal closure of $g_1,\dotsc,g_n \in G$. Let $a : F_n \to G$ be the homomorphism from the free group $F_n$ on $e_1,\dotsc,e_n$ with $a(e_i) = g_i$, and let $1 : F_n \to G$ be the trivial homomorphism. Then $f$ is the coequalizer of $a,1$ in $\Grp$, and hence also in $\Grp_\fg$, since $F_n$ is finitely generated.
