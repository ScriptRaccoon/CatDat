id: walking_composable_pair
name: walking composable pair
notation: $\Comp$
objects: three objects $0,1,2$
morphisms: a single morphism from each natural number to one greater than or equal to it
description: >-
  This category can be pictured as:
  $$\{ 0 \to 1 \to 2 \}$$
  Its name comes from the fact that a functor $\Comp \to \C$ is the same as a composable pair of morphisms in $\C$.
nlab_link: https://ncatlab.org/nlab/show/composable+pair
tags:
  - category theory

related:
  - walking_fork
  - walking_morphism

satisfied_properties:
  - property: small
    proof: The objects and morphisms form finite sets.

  - property: finite
    proof: There are $3$ objects and $6$ morphisms, one for each pair $i \leq j$ in $\{0,1,2\}$.

  - property: skeletal
    proof: Every morphism goes from some $i$ to some $j$ with $i \leq j$. Hence, for distinct objects $i,j$ there cannot be morphisms $i \to j$ and $j \to i$.

  - property: semi-strongly connected
    proof: For all $i,j \in \{0,1,2\}$ we have $i \leq j$ or $j \leq i$, hence there is a morphism $i \to j$ or $j \to i$.

  - property: self-dual
    proof: There is an isomorphism $\Comp^\op \to \Comp$ defined by $0 \mapsto 2$, $1 \mapsto 1$, $2 \mapsto 0$ (on morphisms it is determined uniquely, since $\Comp$ is thin).

  - property: finitary algebraic
    proof: 'Take the two-sorted finitary algebraic theory with exactly one unary operation between them and the equation $x=y$ for each sort. Up to isomorphism, there are exactly three models of this theory: the identities on the empty set and on the singleton, and the map from the empty set to the singleton. Hence we get the equivalence to $\{0 \to 1 \to 2\}$.'

unsatisfied_properties:
  - property: extremal generator
    proof: The corresponding poset contains two distinct non-minimal elements $1,2$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal generator cannot exist.

special_objects:
  initial object:
    description: $0$
  terminal object:
    description: $2$
  coproducts:
    description: supremum taken in $\{0 < 1 < 2\}$
  products:
    description: infimum taken in $\{0 < 1 < 2\}$

special_morphisms: {}
