id: SemiNormVect
name: category of semi-normed vector spaces with linear contractions
notation: $\SemiNormVect$
objects: semi-normed vector spaces over $\IC$
morphisms: linear contractions, i.e. linear maps satisfying $|f(x)| \leq |x|$ for every $x$
description: >-
  A semi-norm need not satisfy $|x|=0 \implies x=0$. Equipping a vector space with the zero semi-norm defines a right adjoint to the forgetful functor $\SemiNormVect \to \Vect_{\IC}$.
  The choice of morphisms is similar to that of $\PMet$.
nlab_link: null

tags:
  - analysis

related:
  - NormVect
  - Ban
  - Vect
  - PMet

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor to $\Vect_{\IC}$, and $\Vect_{\IC}$ is locally small (<a href="/category/Vect?proof=locally_small" data-allow-deduced>proof</a>).

  - property: equalizers
    proof: Take the equalizer of the underlying linear maps and restrict the semi-norm. This has the required universal property.
    check_redundancy: false

  - property: products
    proof: >-
      For a family $(V_i)_{i \in I}$, take the subspace $\{v \in \prod_i V_i : \sup_i |v_i| < \infty\}$ with semi-norm $|v| \coloneqq \sup_i |v_i|$.
      Let $f_i : T \to V_i$ be linear contractions and consider the induced linear map $f : T \to \prod_i V_i$ defined by $f(t) \coloneqq (f_i(t))_i$. Since $\sup_i |f_i(t)| \leq |t|$, the map $f$ lands in this subspace and is a linear contraction.
    check_redundancy: false

  - property: coproducts
    proof: >-
      For a family $(V_i)_{i \in I}$, take the direct sum $\bigoplus_i V_i$ of the underlying vector spaces with semi-norm $|v| \coloneqq \sum_i |v_i|$.
      A family of linear contractions $f_i : V_i \to T$ induces the linear map $f : \bigoplus_i V_i \to T$ defined by $f(v) \coloneqq \sum_i f_i(v_i)$, which is a linear contraction since $|f(v)| \leq \sum_i |f_i(v_i)| \leq \sum_i |v_i|$.
    check_redundancy: false

  - property: coequalizers
    proof: >-
      For $f,g : V \rightrightarrows W$, let $U \coloneqq \im(f-g)$ and let $\pi : W \to W/U$ be the projection. We equip the vector space $W/U$ with the quotient semi-norm $|\pi(w)| \coloneqq \inf_{u \in U} |w+u|$. Then $\pi$ is a linear contraction with $\pi \circ f = \pi \circ g$.
      Every linear contraction $h : W \to T$ with $h \circ f = h \circ g$ vanishes on $U$, hence factors uniquely as $h = \bar h \circ \pi$ for a linear map $\bar h : W/U \to T$. For all $w \in W$ and $u \in U$ we have
      $$|\bar h(\pi(w))| = |\bar h(\pi(w+u))| = |h(w+u)| \leq |w+u|.$$
      Taking the infimum over $u \in U$ gives $|\bar h(\pi(w))| \leq |\pi(w)|$, so $\bar h$ is a linear contraction.
    check_redundancy: false

  - property: CIP
    proof: >-
      We already know that $\SemiNormVect$ has products (<a href="/category/SemiNormVect?proof=products">proof</a>) and coproducts (<a href="/category/SemiNormVect?proof=coproducts">proof</a>). It also has zero morphisms, namely the zero linear maps.
      Hence, for a family $(V_i)_{i \in I}$ the canonical morphism from the coproduct to the product is the inclusion of $\bigoplus_{i \in I} V_i$ into $\bigl\{v \in \prod_{i \in I} V_i : \sup_{i \in I} |v_i| < \infty\bigr\}$. It is injective, hence a monomorphism.

  - property: binary CSP
    proof: >-
      By the <a href="/category/SemiNormVect?proof=coproducts">construction</a> of coproducts and the <a href="/category/SemiNormVect?proof=products">construction</a> of products, the canonical morphism $X \sqcup Y \to X \times Y$ is the identity map of the underlying vector space $X \oplus Y$. Hence, it is surjective and therefore an epimorphism.

  - property: filtered colimits
    proof: >-
      Let $(V_i)_{i \in I}$ be a filtered diagram with transition maps $u_{i,k} : V_i \to V_k$ for morphisms $i \to k$, and let $(u_i : V_i \to V)$ be the colimit of the underlying vector spaces. Since the diagram is filtered, every $v \in V$ has a preimage $v_i \in V_i$ under $u_i$ for some $i \in I$. Define
      $$|v| \coloneqq \inf \{|v_i| : i \in I,\ v_i \in V_i,\ u_i(v_i) = v\}.$$

      This is a semi-norm. For $\lambda \in \IC$ and a preimage $v_i$ of $v$, the element $\lambda v_i$ is a preimage of $\lambda v$ with $|\lambda v_i| = |\lambda| \, |v_i|$, hence $|\lambda v| \leq |\lambda| \, |v|$. For $\lambda = 0$ this gives $|0 \cdot v| = 0$. For $\lambda \neq 0$, it also gives $|v| = |\lambda^{-1} (\lambda v)| \leq |\lambda|^{-1} \, |\lambda v|$, so $|\lambda v| = |\lambda| \, |v|$. For the triangle inequality, let $v,w \in V$ and $\varepsilon > 0$. Choose preimages $v_i \in V_i$ of $v$ and $w_j \in V_j$ of $w$ with $|v_i| \leq |v| + \varepsilon$ and $|w_j| \leq |w| + \varepsilon$. Since the diagram is filtered, there are morphisms $i \to k$ and $j \to k$. Then $u_{i,k}(v_i) + u_{j,k}(w_j)$ is a preimage of $v + w$, and since the transition maps are linear contractions,
      $$\begin{align*} |v + w| & \leq |u_{i,k}(v_i) + u_{j,k}(w_j)| \\ & \leq |u_{i,k}(v_i)| + |u_{j,k}(w_j)| \\ & \leq |v_i| + |w_j| \\ & \leq |v| + |w| + 2\varepsilon. \end{align*}$$
      Since $\varepsilon$ is arbitrary, $|v + w| \leq |v| + |w|$.

      By definition, $|u_i(x)| \leq |x|$ for all $x \in V_i$, so each $u_i$ is a linear contraction, and these form a cocone. Let $(f_i : V_i \to T)$ be a cocone of linear contractions. There is a unique linear map $f : V \to T$ with $f \circ u_i = f_i$ for all $i$. For $v \in V$ and a preimage $v_i \in V_i$ of $v$ we have $|f(v)| = |f_i(v_i)| \leq |v_i|$. Taking the infimum over all preimages gives $|f(v)| \leq |v|$, so $f$ is a linear contraction.

      This construction shows that the forgetful functor $\SemiNormVect \to \Vect_{\IC}$ preserves filtered colimits.
    check_redundancy: false

  - property: exact filtered colimits
    proof: >-
      We already know that $\SemiNormVect$ is (finitely) complete (<a href="/category/SemiNormVect?proof=complete" data-allow-deduced>proof</a>). We use the construction of filtered colimits from the <a href="/category/SemiNormVect?proof=filtered_colimits">proof</a> that they exist: for a filtered diagram $(V_i)$, the colimit $(u_i : V_i \to V)$ is the colimit of the underlying vector spaces, and $|v|$ is the infimum of all $|v_i|$, where $v_i \in V_i$ satisfies $u_i(v_i) = v$.

      Consider the functor $P : \SemiNormVect \to \PMet$ that maps $V$ to $(V,d_V)$ with $d_V(x,y) \coloneqq |x-y|$ and is the identity on morphisms. Since $\PMet$ has exact filtered colimits (<a href="/category/PMet?proof=exact_filtered_colimits">proof</a>), it suffices to show that $P$ preserves finite limits and filtered colimits and is conservative.

      By the constructions of finite limits in both categories, $P$ preserves them. It is conservative: if $P(f)$ is an isomorphism, then $f$ is a bijective isometry, since these are the isomorphisms in $\PMet$ (<a href="/category/PMet?proof=isomorphism">proof</a>). Since $f$ is linear and bijective linear isometries are isomorphisms in $\SemiNormVect$ (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>), $f$ is an isomorphism.

      For filtered colimits, let $(V_i)$ be a filtered diagram with colimit $(u_i : V_i \to V)$, and let $x,y \in V$. Then $d_V(x,y)$ is the infimum of all $|w_i|$, where $w_i \in V_i$ is a preimage of $x-y$, while the distance of $x,y$ in the colimit in $\PMet$ is the infimum of all $|x_i - y_i|$, where $x_i,y_i \in V_i$ are preimages of $x,y$. For preimages $x_i,y_i \in V_i$ of $x,y$, the difference $x_i - y_i$ is a preimage of $x-y$, so the first infimum is at most the second one. Conversely, let $w_i \in V_i$ be a preimage of $x-y$. Since the diagram is filtered, there are a morphism $i \to k$ and a preimage $x_k \in V_k$ of $x$. Let $w_k \in V_k$ be the image of $w_i$. Then $w_k$ is a preimage of $x-y$, so $y_k \coloneqq x_k - w_k$ is a preimage of $y$. Since the transition maps are linear contractions, we get $|x_k - y_k| = |w_k| \leq |w_i|$. So the second infimum is at most the first one.

  - property: cocartesian cofiltered limits
    proof: >-
      By the <a href="/category/SemiNormVect?proof=products">construction</a> of products and the <a href="/category/SemiNormVect?proof=equalizers">construction</a> of equalizers, the limit of a small diagram $(Y_i)$ is the space of compatible families $(y_i) \in \prod_i Y_i$ with $\sup_i |y_i| < \infty$, endowed with the semi-norm $|(y_i)| \coloneqq \sup_i |y_i|$. By the <a href="/category/SemiNormVect?proof=coproducts">construction</a> of coproducts, the coproduct $X \oplus Y$ of two semi-normed vector spaces is their direct sum with the semi-norm $|(x,y)| \coloneqq |x| + |y|$.

      Now let $X$ be a semi-normed vector space and $(Y_i)$ be a cofiltered diagram of semi-normed vector spaces. We claim that the canonical map
      $$\textstyle X \oplus \lim_i Y_i \to \lim_i (X \oplus Y_i), \quad (x,(y_i)) \mapsto ((x,y_i))_i,$$
      is a bijective linear isometry, hence an isomorphism (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>). An element of the codomain is a compatible family $((x_i,y_i))_i$ with bounded semi-norms. Since the transition maps are of the form $\id_X \oplus f$, we have $x_i = x_j$ whenever there is a morphism $i \to j$ in the index category. Since the index category is connected, there is some $x \in X$ with $x_i = x$ for all $i$. Moreover, $(y_i)$ is a compatible family, and $\sup_i (|x| + |y_i|) < \infty$ holds if and only if $\sup_i |y_i| < \infty$. This shows that the canonical map is bijective. It is isometric since
      $$\textstyle \sup_i (|x| + |y_i|) = |x| + \sup_i |y_i|.$$
      Notice that this argument only uses that the index category is connected. Hence, $X \oplus -$ even preserves all connected limits.

  - property: pullback-stable regular epimorphisms
    proof: >-
      We already know that $\SemiNormVect$ has pullbacks since it is complete (<a href="/category/SemiNormVect?proof=complete" data-allow-deduced>proof</a>). We will use that a linear contraction is a regular epimorphism if and only if it maps the open unit ball onto the open unit ball (<a href="/category/SemiNormVect?proof=regular_epimorphism">proof</a>).
      So let $f : X \to Y$ be a regular epimorphism and let $g : T \to Y$ be any morphism. By the <a href="/category/SemiNormVect?proof=products">construction</a> of products and the <a href="/category/SemiNormVect?proof=equalizers">construction</a> of equalizers, the pullback $X \times_Y T$ is the subspace of all $(x,t) \in X \oplus T$ with $f(x) = g(t)$, endowed with the semi-norm $|(x,t)| \coloneqq \max(|x|,|t|)$. We need to show that the projection $X \times_Y T \to T$ is a regular epimorphism.
      Let $t \in T$ be an element with $|t| < 1$. Since $g$ is a linear contraction, we have $|g(t)| < 1$. Since $f$ is a regular epimorphism, there is some $x \in X$ with $|x| < 1$ and $f(x) = g(t)$.
      Then $(x,t) \in X \times_Y T$ is a preimage of $t$ with $\max(|x|,|t|) < 1$.

  - property: pushout-stable regular monomorphisms
    proof: >-
      We already know that $\SemiNormVect$ has pushouts since it is cocomplete (<a href="/category/SemiNormVect?proof=cocomplete" data-allow-deduced>proof</a>). We will use that the regular monomorphisms are the isometric injective linear maps (<a href="/category/SemiNormVect?proof=regular_monomorphism">proof</a>).
      So let $i : X \to Y$ be an isometric injective linear map and let $f : X \to T$ be any morphism. By the <a href="/category/SemiNormVect?proof=coproducts">construction</a> of coproducts and the <a href="/category/SemiNormVect?proof=coequalizers">construction</a> of coequalizers, the pushout $T \sqcup_X Y$ is the quotient of the direct sum $T \oplus Y$, equipped with the semi-norm $|(t,y)| \coloneqq |t| + |y|$, modulo the subspace $S \coloneqq \{(-f(x),i(x)) : x \in X\}$, equipped with the quotient semi-norm. We need to show that the linear contraction $\iota : T \to T \sqcup_X Y$, $t \mapsto [(t,0)]$ is isometric and injective.

      For $t \in T$ the semi-norm of $\iota(t)$ is the infimum of the semi-norms of $(t,0) + (-f(x),i(x)) = (t - f(x), i(x))$ for $x \in X$.
      By taking $x=0$ we see that the infimum is $\leq |t|$.
      On the other hand, for any $x \in X$ we compute
      $$\begin{align*} |(t - f(x), i(x))| & = |t - f(x)| + |i(x)| \\ & = |t - f(x)| + |x| \\ & \geq |t - f(x)| + |f(x)| \\ & \geq |t|. \end{align*}$$
      This shows that the infimum is precisely $|t|$, so $\iota$ is isometric.

      If $\iota(t) = 0$, then $(t,0) \in S$, i.e. $(t,0) = (-f(x),i(x))$ for some $x \in X$. Since $i$ is injective, $i(x) = 0$ implies $x = 0$, and hence $t = -f(x) = 0$. So $\iota$ is injective. Alternatively, since the forgetful functor to $\Vect_{\IC}$ preserves pushouts by this construction, this follows from the fact that the regular monomorphisms in $\Vect_{\IC}$ are the injective linear maps, which are stable under pushouts since $\Vect_{\IC}$ is abelian (<a href="/category-implication/dual_abelian_implies_regular">proof</a>).

  - property: extremal generator
    proof: >-
      We will show that the space $\IC$ with its usual norm is an extremal generator. For a semi-normed vector space $X$ let $B_X \coloneqq \{x \in X : |x| \leq 1\}$ be its closed unit ball. The map $\Hom(\IC,X) \to B_X$, $\varphi \mapsto \varphi(1)$ is a bijection, natural in $X$. Notice that for every $x \in X$ and every $\lambda > |x|$ (such as $\lambda \coloneqq |x| + 1$) we have $x/\lambda \in B_X$.

      First, $\IC$ is a generator: if two linear contractions $g,h : X \rightrightarrows Y$ agree when composed with every linear contraction $\IC \to X$, i.e. agree on $B_X$, then for every $x \in X$ and every $\lambda > |x|$ we have $g(x) = \lambda \, g(x/\lambda) = \lambda \, h(x/\lambda) = h(x)$, so $g = h$.

      Now let $f : X \to Y$ be a linear contraction such that the function
      $$f\circ{-} : \Hom(\IC,X)\to\Hom(\IC,Y)$$
      is a bijection. By the natural bijection above, this means that $f$ restricts to a bijection $B_X \to B_Y$. We claim that $f$ is a bijective linear isometry, hence an isomorphism (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>).

      The map $f$ is injective: if $f(x) = 0$, choose $\lambda > |x|$. Then $x/\lambda \in B_X$ and $f(x/\lambda) = 0 = f(0)$, hence $x/\lambda = 0$ and $x = 0$.

      The map $f$ is surjective: for $y \in Y$ choose $\lambda > |y|$. Then $y/\lambda \in B_Y$, so $y/\lambda = f(a)$ for some $a \in B_X$, and $y = f(\lambda a)$.

      The map $f$ is isometric: let $x \in X$. Since $f$ is a linear contraction, we have $|f(x)| \leq |x|$. Conversely, let $\lambda > |f(x)|$. Then $f(x/\lambda) \in B_Y$, so $f(x/\lambda) = f(a)$ for some $a \in B_X$. By injectivity, $x/\lambda = a$, hence $|x| \leq \lambda$. Since $\lambda > |f(x)|$ was arbitrary, $|x| \leq |f(x)|$.
    check_redundancy: false
    # The generated deduction uses "accessible => extremal generating collection"
    # and "extremal generating collection + coproducts + strongly connected => extremal generator",
    # which here would yield the coproduct of all countably-dimensional semi-normed vector spaces.
    # It is better to write down a concrete extremal generator

  - property: extremal cogenerating collection
    proof: >-
      We will show that $\{\IC_1,\IC_0\}$ is an extremal cogenerating collection, where $\IC_1$ is $\IC$ with the usual norm, and $\IC_0$ is $\IC$ with the zero semi-norm. Every linear functional is a linear contraction into $\IC_0$, so $\Hom(X,\IC_0)$ is the algebraic dual of the underlying vector space of $X$. Since $\IC$ is an extremal cogenerator of $\Vect_{\IC}$ (<a href="/category/Vect?proof=extremal_cogenerator">proof</a>), it follows that $\Hom(-,\IC_0)$ is faithful.

      Now let $f : X \to Y$ be a linear contraction such that $\Hom(f,\IC_1)$ and $\Hom(f,\IC_0)$ are bijections. Since $\IC$ is an extremal cogenerator of $\Vect_{\IC}$, the latter implies that $f$ is a linear isomorphism. It remains to show that $f$ is isometric, since bijective linear isometries are isomorphisms (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>). Let $x \in X$. By the Hahn-Banach theorem for semi-norms, there is a linear contraction $\varphi : X \to \IC_1$ with $\varphi(x) = |x|$. Since $\Hom(f,\IC_1)$ is surjective, there is a linear contraction $\psi : Y \to \IC_1$ with $\varphi = \psi \circ f$. Hence $|x| = |\psi(f(x))| \leq |f(x)|$. The reverse inequality holds since $f$ is a linear contraction.

      <strong>Remark.</strong> It then follows from the proof of <a href="/category-implication/dual_extremal_generator_via_coproduct">this result</a> that $\IC_1 \times \IC_0$ is an extremal cogenerator.

  - property: effective congruences
    proof: >-
      Let $q_1,q_2 : R \rightrightarrows X$ be a congruence in $\SemiNormVect$. We may assume that the induced map $R \hookrightarrow X \times X$ is an inclusion of vector spaces. Since the forgetful functor $\SemiNormVect \to \Vect_{\IC}$ preserves finite limits by the <a href="/category/SemiNormVect?proof=products">construction</a> of products and the <a href="/category/SemiNormVect?proof=equalizers">construction</a> of equalizers, the congruence yields a congruence in $\Vect_{\IC}$, which we understand well:
      It is fully classified by the subspace $U \coloneqq \{x \in X : (x,0) \in R\}$ via $R = \{(x,y) \in X \times X : x-y \in U\}$.

      Since $R \hookrightarrow X \times X$ is a linear contraction and $X \times X$ carries the $\max$-semi-norm, the semi-norm $|{-}|_R$ on $R$ satisfies
      $$\max(|x|,|y|) \leq |(x,y)|_R.$$
      We claim that this is an equality, i.e. that $R \hookrightarrow X \times X$ is isometric.

      Since the reflexivity morphism $X \to R$, $x \mapsto (x,x)$ is a split monomorphism, it is isometric, i.e.
      $$|(x,x)|_R = |x|.$$
      Since the transitivity morphism $R \times_X R \to R$ is a linear contraction and the fiber product carries the $\max$-semi-norm, we have
      $$|(x,z)|_R \leq \max(|(x,y)|_R, |(y,z)|_R)$$
      whenever $(x,y) \in R$ and $(y,z) \in R$.

      Now let $(x,z) \in R$ and define $y \coloneqq \frac{1}{2} (x + z)$. Then
      $$(x,y) = \tfrac{1}{2} (x,x) + \tfrac{1}{2} (x,z)$$
      and likewise
      $$(y,z) = \tfrac{1}{2} (z,z) + \tfrac{1}{2} (x,z)$$
      are contained in $R$. We have
      $$|(x,y)|_R \leq \tfrac{1}{2} |x| + \tfrac{1}{2} |(x,z)|_R$$
      and likewise
      $$|(y,z)|_R \leq \tfrac{1}{2} |z| + \tfrac{1}{2} |(x,z)|_R.$$
      Together with the transitivity bound we obtain
      $$\begin{align*} |(x,z)|_R & \leq \max(|(x,y)|_R, |(y,z)|_R) \\ & \leq \tfrac{1}{2} \max(|x|,|z|) + \tfrac{1}{2} |(x,z)|_R, \end{align*}$$
      which proves the claim $|(x,z)|_R \leq \max(|x|,|z|)$.

      Finally, $R$ is the kernel pair of the projection $X \to X/U$, where $X/U$ carries the quotient semi-norm: this is true by construction on the level of vector spaces, and the kernel pair carries the $\max$-semi-norm, just like $R$.

  - property: ℵ₁-accessible
    proof: >-
      Let $U : \SemiNormVect \to \Set$ be the underlying set functor. Recall from the <a href="/category/SemiNormVect?proof=filtered_colimits">proof</a> of filtered colimits that for a filtered diagram $(V_i)$, the colimit $(u_i : V_i \to V)$ is the colimit of the underlying vector spaces, and $|v|$ is the infimum of all $|v_i|$, where $v_i \in V_i$ satisfies $u_i(v_i) = v$. In particular, $U$ preserves filtered colimits.

      <strong>Claim 1.</strong> Let $(V_i)$ be an $\aleph_1$-filtered diagram with colimit $(u_i : V_i \to V)$. For every $v \in V$ there are an index $k$ and some $v_k \in V_k$ with $u_k(v_k) = v$ and $|v_k| = |v|$.

      We adapt the argument of the Claim in the <a href="/category/PMet?proof=aleph1-accessible">proof</a> for $\PMet$. Choose for every $m \geq 1$ an index $i_m$ and some $v_{i_m} \in V_{i_m}$ with $u_{i_m}(v_{i_m}) = v$ and $|v_{i_m}| \leq |v| + 1/m$. Any two of these elements become equal at some later stage, since the underlying vector space of $V$ is the colimit of the underlying vector spaces of the $V_i$. These are countably many conditions, so since the diagram is $\aleph_1$-filtered, there are an index $k$ and morphisms $i_m \to k$ such that all $v_{i_m}$ have the same image $v_k \in V_k$. Since the transition maps are linear contractions, we get $|v_k| \leq |v| + 1/m$ for all $m \geq 1$, hence $|v_k| \leq |v|$. Conversely, $|v| \leq |v_k|$ holds since $u_k$ is a linear contraction. This proves Claim 1.

      For $n \geq 1$ and $c \in \IC^n$, define a subfunctor $D_c \subseteq U^n$ by
      $$\textstyle D_c(X) \coloneqq \left\{(x_1,\ldots,x_n) \in U(X)^n : \left|\sum_{j=1}^n c_jx_j\right| \leq 1\right\}.$$

      <strong>Claim 2.</strong> Each $D_c$ preserves $\aleph_1$-filtered colimits.

      Let $(V_i)$ be an $\aleph_1$-filtered diagram with colimit $(u_i : V_i \to V)$. Since $D_c$ is a subfunctor of $U^n$ and $U^n$ preserves filtered colimits, the comparison map $\colim_i D_c(V_i) \to D_c(V)$ is injective. For surjectivity, let $(x_1,\ldots,x_n) \in D_c(V)$, i.e. $v \coloneqq \sum_{j=1}^n c_jx_j$ satisfies $|v| \leq 1$. We need an index $l$ and some $(x_{1,l},\ldots,x_{n,l}) \in D_c(V_l)$ with $u_l(x_{j,l}) = x_j$ for $1 \leq j \leq n$.

      By Claim 1, there are an index $i$ and some $v_i \in V_i$ with $u_i(v_i) = v$ and $|v_i| = |v|$. Since the diagram is filtered, there are a morphism $i \to k$ and elements $x_{1,k},\ldots,x_{n,k} \in V_k$ with $u_k(x_{j,k}) = x_j$. Let $v_k \coloneqq u_{i,k}(v_i)$, where $u_{i,k} : V_i \to V_k$ is the transition map. Then $u_k(v_k) = u_i(v_i) = v$. Since $u_{i,k}$ and $u_k$ are linear contractions, we have $|v_k| = |v| \leq 1$.

      Both $\sum_{j=1}^n c_jx_{j,k}$ and $v_k$ map to $v$ under $u_k$. Since $U$ preserves filtered colimits, they become equal under the transition map $u_{k,l} : V_k \to V_l$ of some morphism $k \to l$. Then $x_{j,l} \coloneqq u_{k,l}(x_{j,k})$ satisfies $u_l(x_{j,l}) = x_j$, and since $u_{k,l}$ is a linear contraction, we get
      $$\textstyle \left|\sum_{j=1}^n c_jx_{j,l}\right| = |u_{k,l}(v_k)| \leq |v_k| \leq 1.$$
      Hence $(x_{1,l},\ldots,x_{n,l}) \in D_c(V_l)$. This proves Claim 2.

      <strong>Claim 3.</strong> Let $K$ be a semi-normed vector space with a basis $B$, let $X$ be a semi-normed vector space, let $f : B \to U(X)$ be a map, and let $\bar{f} : K \to X$ be its linear extension. Then $\bar{f}$ is a linear contraction if and only if for all $n \geq 1$, $c \in \IQ(i)^n$, and $(b_1,\ldots,b_n) \in D_c(K) \cap B^n$ we have $(f(b_1),\ldots,f(b_n)) \in D_c(X)$.

      If $\bar{f}$ is a linear contraction and $(b_1,\ldots,b_n) \in D_c(K)$, then
      $$\textstyle \left|\sum_{j=1}^n c_jf(b_j)\right| = \left|\bar{f}\bigl(\sum_{j=1}^n c_jb_j\bigr)\right| \leq \left|\sum_{j=1}^n c_jb_j\right| \leq 1.$$

      Conversely, assume the condition. We first show $|\bar{f}(y)| \leq |y|$ for every $y$ in the $\IQ(i)$-linear span of $B$. Write $y = \sum_{j=1}^n c_jb_j$ with $c \in \IQ(i)^n$ and $b_j \in B$. Let $q$ be a rational number with $q > |y|$. Then $c/q \in \IQ(i)^n$ and
      $$\textstyle \left|\sum_{j=1}^n (c_j/q)b_j\right| = |y|/q \leq 1,$$
      so the condition gives
      $$\textstyle |\bar{f}(y)|/q = \left|\sum_{j=1}^n (c_j/q)f(b_j)\right| \leq 1,$$
      i.e. $|\bar{f}(y)| \leq q$. Since this holds for all rational $q > |y|$, we get $|\bar{f}(y)| \leq |y|$.

      Now let $x \in K$ be arbitrary, and write $x = \sum_{j=1}^n a_jb_j$ with $a \in \IC^n$ and $b_j \in B$. Since $\IQ(i)$ is dense in $\IC$, there are $c^{(m)} \in \IQ(i)^n$ with $c^{(m)}_j \to a_j$ for $m \to \infty$ and $1 \leq j \leq n$. Let $x_m \coloneqq \sum_{j=1}^n c^{(m)}_jb_j$. By the triangle inequality and homogeneity,
      $$\begin{align*} |x - x_m| & \leq \textstyle\sum_{j=1}^n |a_j - c^{(m)}_j| \, |b_j|, \\ |\bar{f}(x) - \bar{f}(x_m)| & \leq \textstyle\sum_{j=1}^n |a_j - c^{(m)}_j| \, |f(b_j)|, \end{align*}$$
      and both right-hand sides tend to $0$. Using $|\bar{f}(x_m)| \leq |x_m|$, we obtain
      $$\begin{align*} |\bar{f}(x)| & \leq |\bar{f}(x_m)| + |\bar{f}(x) - \bar{f}(x_m)| \\ & \leq |x_m| + |\bar{f}(x) - \bar{f}(x_m)| \\ & \leq |x| + |x - x_m| + |\bar{f}(x) - \bar{f}(x_m)|. \end{align*}$$
      For $m \to \infty$, this gives $|\bar{f}(x)| \leq |x|$. Hence $\bar{f}$ is a linear contraction. This proves Claim 3.

      <strong>Claim 4.</strong> Every semi-normed vector space $K$ of at most countable algebraic dimension is $\aleph_1$-presentable.

      Choose a basis $B$ of $K$. Since $B$ and $\IQ(i)$ are countable, the following set is countable (this is why Claim 3 uses coefficients in $\IQ(i)$ instead of $\IC$):
      $$T \coloneqq \left\{(n,c,b) : n \geq 1,\ c \in \IQ(i)^n,\ b \in D_c(K) \cap B^n\right\}.$$
      For a semi-normed vector space $X$, let
      $$\textstyle V(X) \coloneqq \prod_{(n,c,b)\in T} U(X)^n.$$
      We have two maps, both natural in $X$: the evaluation map
      $$\textstyle \Hom(B,U(X)) \to V(X), \quad f \mapsto \bigl(f(b_1),\ldots,f(b_n)\bigr)_{(n,c,b) \in T},$$
      and the product of the inclusions
      $$\textstyle \prod_{(n,c,b)\in T} D_c(X) \hookrightarrow V(X).$$
      Since the second map is injective, their pullback is the set of maps $f : B \to U(X)$ satisfying the condition of Claim 3. Hence Claim 3 gives a bijection, natural in $X$,
      $$\textstyle \Hom(K,X) \cong \Hom(B,U(X)) \times_{V(X)} \prod_{(n,c,b)\in T} D_c(X), \quad g \mapsto g|_B.$$
      Since $B$ and $T$ are countable, this expresses $\Hom(K,-)$ as a countable limit of functors preserving $\aleph_1$-filtered colimits (Claim 2). Countable limits commute with $\aleph_1$-filtered colimits in $\Set$ (<a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Prop. 1.59), so $K$ is $\aleph_1$-presentable. This proves Claim 4.

      <strong>Claim 5.</strong> The category $\SemiNormVect$ is $\aleph_1$-accessible.

      Every semi-normed vector space is the colimit of its subspaces of at most countable algebraic dimension, ordered by inclusion, and this diagram is $\aleph_1$-filtered. These subspaces are $\aleph_1$-presentable by Claim 4. Up to isomorphism, the semi-normed vector spaces of at most countable algebraic dimension constitute a set: such a space $K$ has a linear isomorphism $\varphi : \IC^{\oplus \kappa} \to K$ for some cardinal $\kappa \leq \aleph_0$, and $\varphi$ is an isomorphism of semi-normed vector spaces when we equip $\IC^{\oplus \kappa}$ with the semi-norm $x \mapsto |\varphi(x)|$. So every such space is isomorphic to one of the spaces $(\IC^{\oplus \kappa},p)$ with $\kappa \leq \aleph_0$ and $p : \IC^{\oplus \kappa} \to \IR$ a semi-norm, and these form a set.

      <strong>Remark.</strong> The same proof works for semi-normed vector spaces over $\IR$, using $\IQ$ instead of $\IQ(i)$. The thread <a href="https://mathoverflow.net/questions/511025">MO/511025</a> also has other viewpoints.

unsatisfied_properties:
  - property: skeletal
    proof: The trivial semi-normed vector spaces with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: biproducts
    proof: >-
      By the <a href="/category/SemiNormVect?proof=coproducts">construction</a> of coproducts and the <a href="/category/SemiNormVect?proof=products">construction</a> of products, for $X = Y = \IC$ with the usual norm the canonical morphism $X \sqcup Y \to X \times Y$ is the identity map of $\IC^2$, where the element $(1,1)$ has semi-norm $2$ in $X \sqcup Y$, but semi-norm $1$ in $X \times Y$. So the canonical morphism is not isometric, hence not an isomorphism (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>).

  - property: product-stable epimorphisms
    proof: >-
      For $n \geq 1$ the linear contraction $f_n : \IC \to \IC$, $z \mapsto z/n$ is surjective, hence an epimorphism. By the <a href="/category/SemiNormVect?proof=products">construction</a> of products, their product is the map
      $$\textstyle f : \ell^\infty \to \ell^\infty, \quad x \mapsto (x_n/n)_{n \geq 1},$$
      where $\ell^\infty$ is the space of bounded sequences $(x_n)_{n \geq 1}$ in $\IC$ with the norm $|x|_\infty = \sup_{n \geq 1} |x_n|$. Every element $y = f(x)$ of the image satisfies $|y_n| \leq |x|_\infty/n$, hence $\lim_{n \to \infty} y_n = 0$. In particular, $(1,1,\dotsc)$ is not contained in the image. Hence, $f$ is not surjective and therefore not an epimorphism (<a href="/category/SemiNormVect?proof=epimorphism">proof</a>).

  - property: regular subobject classifier
    proof: >-
      If $\Omega$ is a regular subobject classifier, then, since the regular monomorphisms are, up to isomorphism, the inclusions of subspaces (<a href="/category/SemiNormVect?proof=regular_monomorphism">proof</a>), $\Hom(X,\Omega)$ is isomorphic to the set of subspaces of $X$ for any semi-normed vector space $X$. For $X = \IC$ with the usual norm, there are exactly two subspaces, $\{0\}$ and $\IC$. Since $\Hom(\IC,\Omega)$ corresponds to the closed unit ball of $\Omega$ via $\varphi \mapsto \varphi(1)$, we conclude that there are exactly two vectors in $\Omega$ with semi-norm $\leq 1$, which is absurd. (For $\Omega = 0$ there is just one, and for $\Omega \neq 0$ there are infinitely many.)

  - property: regular quotient object classifier
    proof: >-
      Let $\IC$ carry the usual norm. Since a regular epimorphism carries the quotient semi-norm (<a href="/category/SemiNormVect?proof=regular_epimorphism">proof</a>), every regular quotient of $\IC$ is isomorphic to $\IC/U$ with the quotient semi-norm for a subspace $U \subseteq \IC$. Hence, $\IC$ has exactly two regular quotients, $\{0\}$ and $\IC$. If an object $\Psi$ classified regular quotients, then $\Hom(\Psi, \IC)$ would have cardinality $2$. But this is impossible: it contains $0$, and if it contains some $f \neq 0$, then it contains the infinitely many distinct elements $\lambda f$ for $\lambda \in [0,1]$.

  - property: finitely accessible
    proof: >-
      The argument is similar to the <a href="/category/PMet?proof=finitely_accessible">proof</a> for $\PMet$. We will show that finitely presentable objects are zero-dimensional, which implies that no non-trivial space is a colimit of finitely presentable objects.

      Consider a finitely presentable $X$ and $0\neq x\in X$. For $r \geq 0$ let $\IC_r$ be $\IC$ with the semi-norm $|z|_r \coloneqq r|z|$.
      We claim that there is a linear contraction $\varphi : X \to \IC_{|x|}$ with $\varphi(x) = 1$. If $|x| \neq 0$, the Hahn-Banach theorem for semi-norms gives a linear functional $\psi : X \to \IC$ with $\psi(x) = |x|$ and $|\psi(y)| \leq |y|$ for all $y \in X$. Then $\varphi \coloneqq \psi/|x|$ satisfies $\varphi(x) = 1$ and $|\varphi(y)|_{|x|} = |x| \cdot |\varphi(y)| = |\psi(y)| \leq |y|$. If $|x| = 0$, choose a linear functional $\varphi : X \to \IC$ with $\varphi(x) = 1$. Since $\IC_{|x|}$ carries the zero semi-norm, $\varphi : X \to \IC_{|x|}$ is a linear contraction, proving the claim.
      But $\IC_{|x|}$ is the colimit of $\IC_{|x|+1/n}$ with the identity maps as transition maps.
      So $\varphi$ factors through some linear contraction $\varphi' : X\to \IC_{|x|+1/n}$. Since the colimit coprojection $\IC_{|x|+1/n} \to \IC_{|x|}$ is the identity map, we have $\varphi'(x) = \varphi(x) = 1$. But then $|\varphi'(x)|_{|x|+1/n} = |x| + 1/n > |x|$ contradicts the fact that $\varphi'$ is a linear contraction.

  - property: effective cocongruences
    proof: >-
      The argument is similar to the <a href="/category/PMet?proof=effective_cocongruences">proof</a> for $\PMet$, where the pseudo-metric space $(\{0,1\},0)$ represents the pairs of points with distance $0$. Here, the representing object is a bit more complicated, since it has to represent the pairs of points in the closed unit ball whose difference has semi-norm $0$.

      Take $X=\IC$ with the usual norm and $E=\IC\times \IC$ with semi-norm $|(x,y)|_E \coloneqq |x+y|$
      and the inclusions $j_1,j_2 : X \rightrightarrows E$ defined by $j_1(x)=(x,0)$ and $j_2(x)=(0,x)$. They are jointly epimorphic since their images span $E$.
      For an object $T$, a linear map $h : E \to T$ is determined by $a \coloneqq h(1,0)$ and $b \coloneqq h(0,1)$, namely $h(x,y) = ax + by$, and it is a linear contraction if and only if $|a|\leq 1$ and $|a-b|=0$: for necessity evaluate at $(1,0)$ and $(1,-1)$, and for sufficiency use
      $$|ax+by| = |a(x+y)+(b-a)y| \leq |a| \cdot |x+y| + |b-a| \cdot |y| \leq |x+y|.$$
      Identifying $\Hom(X,T)$ with the closed unit ball of $T$, the image of
      $$(j_1^*,j_2^*) : \Hom(E,T) \to \Hom(X,T)^2$$
      is therefore the equivalence relation $a \sim b \iff |a-b|=0$. Thus, $(j_1,j_2)$ is a cocongruence.

      If this cocongruence were effective, then by the dual of <a href="/content/effective-congruence-quotients">this result</a>, it would be the cokernel pair of the equalizer $e$ of $j_1$ and $j_2$.
      The equalizer of $j_1$ and $j_2$ is $e : \{0\} \to X$, and its cokernel pair is the coproduct $X \sqcup X$, i.e. $\IC^2$ with the sum norm and the evident inclusions. The comparison map $X \sqcup X \to E$ is the identity of $\IC^2$, which is not an isomorphism since $|(1,-1)|_E=0\neq 1+1$.

special_objects:
  initial object:
    description: trivial vector space with its unique semi-norm
  terminal object:
    description: trivial vector space with its unique semi-norm
  coproducts:
    description: The coproduct of a family of semi-normed vector spaces $(V_i)_{i \in I}$ is the direct sum $\bigoplus_{i \in I} V_i$ of the underlying vector spaces equipped with the semi-norm $|v| \coloneqq \sum_{i \in I} |v_i|$.
  products:
    description: 'The product of a family of semi-normed vector spaces $(V_i)_{i \in I}$ is the subspace $\bigl\{v \in \prod_{i \in I} V_i : \sup_{i \in I} |v_i| < \infty\bigr\}$ of the product of the underlying vector spaces equipped with the semi-norm $|v| \coloneqq \sup_{i \in I} |v_i|$.'

special_morphisms:
  isomorphism:
    description: bijective linear isometries
    proof: >-
      If $f : V \to W$ is an isomorphism with inverse $g : W \to V$, then $f$ is a bijective linear map, and for $v \in V$ we have $|v| = |g(f(v))| \leq |f(v)| \leq |v|$, hence $|f(v)| = |v|$. Conversely, if $f$ is a bijective linear isometry, its inverse map $g$ is linear, and for $w \in W$ we have $|g(w)| = |f(g(w))| = |w|$. So $g$ is a linear contraction, and it is inverse to $f$.
  monomorphism:
    description: injective linear contractions
    proof: >-
      For the non-trivial direction, let $f : X \to Y$ be a monomorphism. The functor $\Hom(\IC,-) : \SemiNormVect \to \Set$, where $\IC$ carries the usual norm, maps $X$ to the closed unit ball $B_X \coloneqq \{x \in X : |x| \leq 1\}$ via $\varphi \mapsto \varphi(1)$. Since it is representable, it preserves monomorphisms, so $f$ is injective on $B_X$. Now let $x \in X$ with $f(x) = 0$, and choose $\lambda > |x|$. Then $x/\lambda \in B_X$ and $f(x/\lambda) = 0 = f(0)$, hence $x/\lambda = 0$ and $x = 0$. So $f$ is injective.
  epimorphism:
    description: surjective linear contractions
    proof: >-
      Surjective linear contractions are epimorphisms since the forgetful functor $U : \SemiNormVect \to \Vect_{\IC}$ is faithful. Conversely, $U$ has a right adjoint, which equips a vector space with the zero semi-norm. Hence, $U$ preserves epimorphisms, and the epimorphisms in $\Vect_{\IC}$ are surjective (<a href="/category/Vect?proof=epimorphism" data-allow-deduced>proof</a>).
  regular monomorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular monomorphism. (2) $f$ is isometric and injective. (3) $f$ is isomorphic to the inclusion of a subspace of $Y$.
    proof: >-
      (1) implies (2): By the <a href="/category/SemiNormVect?proof=equalizers">construction</a> of equalizers, every regular monomorphism is isomorphic to the inclusion of a subspace with the restricted semi-norm, which is isometric and injective. Since isomorphisms are bijective linear isometries (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>), $f$ is isometric and injective.

      (2) implies (3): The subspace $f(X) \subseteq Y$ carries the restricted semi-norm, and $f$ induces a bijective linear isometry $X \to f(X)$, which is an isomorphism.

      (3) implies (1): Let $U \subseteq Y$ be a subspace, equipped with the restricted semi-norm, and let $p : Y \to Y/U$ be the projection, where $Y/U$ carries the quotient semi-norm as in the <a href="/category/SemiNormVect?proof=coequalizers">construction</a> of coequalizers. By the construction of equalizers, the inclusion $U \hookrightarrow Y$ is the equalizer of $p$ and the zero map $Y \to Y/U$.
  regular epimorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular epimorphism. (2) $f$ is surjective, and the semi-norm on $Y$ is given by $|y| = \inf \{|x| : f(x) = y\}$. (3) $f$ maps the open unit ball of $X$ onto the open unit ball of $Y$.
    proof: >-
      (1) implies (2): By the <a href="/category/SemiNormVect?proof=coequalizers">construction</a> of coequalizers, every regular epimorphism is isomorphic to a projection $\pi : W \to W/U$ for a subspace $U \subseteq W$, with the quotient semi-norm $|\pi(w)| = \inf_{u \in U} |w + u|$, which is the infimum of all $|w'|$ with $\pi(w') = \pi(w)$. Since isomorphisms are bijective linear isometries (<a href="/category/SemiNormVect?proof=isomorphism">proof</a>), $f$ satisfies (2).

      (2) implies (1): Let $U \coloneqq \ker(f)$, and let $X/U$ carry the quotient semi-norm. By the <a href="/category/SemiNormVect?proof=coequalizers">construction</a> of coequalizers, the projection $X \to X/U$ is the coequalizer of the inclusion $U \hookrightarrow X$ and the zero map $U \to X$. Since $f$ vanishes on $U$, its universal property yields a linear contraction $\tilde{f} : X/U \to Y$ induced by $f$, which is bijective since $U = \ker(f)$ and $f$ is surjective. It is isometric by (2) and the definition of the quotient semi-norm. Thus, $\tilde{f}$ is an isomorphism. Since $f$ is the composite of the projection with $\tilde{f}$, it follows that $f$ is a regular epimorphism.

      (2) implies (3): Let $y \in Y$ be an element with $|y| < 1$. Since $|y|$ is the infimum of all $|x|$ with $f(x)=y$, there is some $x$ with $f(x)=y$ and $|x| < 1$.

      (3) implies (2): Let $y \in Y$ and $\varepsilon > 0$. Consider $y' \coloneqq y / (|y| + \varepsilon)$. Then $|y'| < 1$. Thus, by assumption, there is some $x' \in X$ with $|x'| < 1$ and $f(x') =y'$. Let $x \coloneqq (|y| + \varepsilon) x'$. Then $f(x) = y$ and $|x| < |y| + \varepsilon$. In particular, $f$ is surjective. Moreover, the infimum $\inf \{|x| : f(x) = y\}$ is $\leq |y| + \varepsilon$, for every $\varepsilon > 0$, and hence $\leq |y|$. The reverse inequality holds since $f$ is a linear contraction.
