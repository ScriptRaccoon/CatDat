id: walking_morphism
name: walking morphism
notation: $I$
objects: $0$, $1$
morphisms: the two identities and a single morphism from $0$ to $1$
description: >-
  This is also known as the interval category and can be pictured as:
  $$\{0 \to 1\}$$
  It has the property that functors $I \to \C$ are the same as morphisms in $\C$, which explains its name.
nlab_link: https://ncatlab.org/nlab/show/interval+category
keywords:
  - walking arrow
  - interval category

tags:
  - category theory

related:
  - walking_commutative_square
  - walking_composable_pair
  - walking_idempotent
  - walking_isomorphism
  - walking_pair
  - walking_span
  - walking_splitting

satisfied_properties:
  - property: small
    proof: The objects and morphisms form finite sets.

  - property: finite
    proof: There are $2$ objects and $3$ morphisms.

  - property: skeletal
    proof: The two objects are not isomorphic.

  - property: self-dual
    proof: There is an isomorphism $I^\op \to I$ defined by $0 \mapsto 1$, $1 \mapsto 0$, which maps the non-identity morphism to itself.

  - property: semi-strongly connected
    proof: There is a morphism $0 \to 1$.

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory with no operations and the equation $x=y$, required to hold for all elements $x,y$. Its models are precisely the empty set and the singleton set, yielding an equivalence with $I$.

unsatisfied_properties:
  - property: strongly connected
    proof: There is no morphism $1 \to 0$.

special_objects:
  initial object:
    description: $0$
  terminal object:
    description: $1$
  coproducts:
    description: $0 \sqcup x = x$, $1 \sqcup x = 1$
  products:
    description: $0 \times x = 0$, $1 \times x = x$

special_morphisms: {}
