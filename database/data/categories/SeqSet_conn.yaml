id: SeqSet_conn
name: category of connected sequences of sets
notation: $[(\IN,\leq),\Set]_{\conn}$
objects: 'sequences of sets $X_0 \to X_1 \to X_2 \to \cdots$ that are <i>connected</i>, meaning that $\colim_{n \geq 0} X_n$ is a singleton set'
morphisms: commutative diagrams
description: >-
  This is a full subcategory of the <a href="/category/SeqSet">category of sequences of sets</a>, consisting of those sequences
  $$X_0 \to X_1 \to X_2 \to \cdots$$
  whose colimit is a singleton set. Equivalently, the following two conditions are satisfied: (1) There is some $n \geq 0$ such that $X_n \neq \varnothing$. (2) For all $n \geq 0$ and all $x,y \in X_n$, there is some $m \geq n$ such that $x$ and $y$ map to the same element of $X_m$.

  We have added this category as an example of a category with a subobject classifier but without an initial object.
nlab_link: null
tags:
  - set theory

related:
  - SeqSet
  - Setne

comments:
  - This category was suggested by Jonas Frey at <a target="_blank" href="https://mathoverflow.net/questions/515206">MO/515206</a>.

satisfied_properties:
  - property: locally small
    proof: It is a full subcategory of the <a href="/category/SeqSet">category of sequences of sets</a>, which is locally small.

  - property: semi-strongly connected
    proof: It is a full subcategory of the <a href="/category/SeqSet">category of sequences of sets</a>, which is semi-strongly connected.

  - property: finitely complete
    proof: 'The <a href="/category/SeqSet">category of sequences of sets</a> has (finite) limits, defined pointwise. A sequence of sets $X$ is connected if and only if the unique maps $! : X_n \to \{\ast\}$ induce an isomorphism on colimits. Since filtered colimits commute with finite limits in <a href="/category/Set">$\Set$</a>, a finite limit of connected sequences is again connected.'
    check_redundancy: false

  - property: connected colimits
    proof: 'The <a href="/category/SeqSet">category of sequences of sets</a> has (connected) colimits, defined pointwise. A sequence of sets $X$ is connected if and only if the unique maps $! : X_n \to \{\ast\}$ induce an isomorphism on colimits. Since colimits commute with colimits and a connected colimit of singleton sets is a singleton set, a connected colimit of connected sequences is again connected.'

  - property: exact filtered colimits
    proof: Since the subcategory of connected sequences is closed under filtered colimits and finite limits, this follows from the corresponding property of the <a href="/category/SeqSet">category of sequences of sets</a>.

  - property: regular
    proof: We already know that the category has finite limits and coequalizers, and that the inclusion functor into the regular <a href="/category/SeqSet">category of sequences of sets</a> is fully faithful and preserves finite limits and coequalizers. Thus, the claim follows from Lemma 7 <a href="/content/subcategories">here</a>.

  - property: effective congruences
    proof: Since the <a href="/category/SeqSet">category of sequences of sets</a> has effective congruences, finite limits, and coequalizers, and the full subcategory of connected sequences is closed under finite limits and coequalizers, this follows from Lemma 8 <a href="/content/subcategories">here</a>.

  - property: effective cocongruences
    proof: >-
      Since the <a href="/category/SeqSet">category of sequences of sets</a> $[(\IN,\leq),\Set]$ has effective cocongruences, pushouts, and equalizers, and the full subcategory $[(\IN,\leq),\Set]_{\conn}$ is closed under pushouts and equalizers, this follows from Lemma 8 <a href="/content/subcategories">here</a> as long as we can prove that the inclusion functor
      $$[(\IN,\leq),\Set]_{\conn} \hookrightarrow [(\IN,\leq),\Set]$$
      preserves jointly epimorphic parallel pairs. This is not immediate because connected sequences are not closed under binary coproducts. In fact, we can prove the stronger statement that the inclusion preserves jointly epimorphic pairs, not necessarily parallel ones.

      Let $f : X \to Z$ and $g : Y \to Z$ be jointly epimorphic morphisms in $[(\IN,\leq),\Set]_{\conn}$. We will prove that they are jointly epimorphic in $[(\IN,\leq),\Set]$. Consider the subsequence $U \subseteq Z$ defined by
      $$U_n \coloneqq (f_n)_*(X_n) \cup (g_n)_*(Y_n).$$
      Since $X_n \neq \varnothing$ for some $n$, we also have $U_n \neq \varnothing$ for some $n$. Any two elements of $U_n$ eventually become equal in $Z$ and hence in $U$. Thus, $U$ is connected. Therefore, the pushout $P \coloneqq Z \sqcup_U Z$ is also connected. The two coprojections $i_1,i_2 : Z \rightrightarrows P$ satisfy $i_1 \circ f = i_2 \circ f$ and $i_1 \circ g = i_2 \circ g$. Since $f$ and $g$ are jointly epimorphic, we conclude that $i_1 = i_2$, and hence $U = Z$. Thus,
      $$Z_n = (f_n)_*(X_n) \cup (g_n)_*(Y_n)$$
      for every $n$, so $f$ and $g$ are pointwise jointly epimorphic and therefore jointly epimorphic in $[(\IN,\leq),\Set]$.

  - property: subobject classifier
    proof: >-
      Define the map ("truncated subtraction") $s : \IN \to \IN$ by $s(k) = \max(0,k-1)$. We claim that the sequence
      $$\Omega = \bigl(\IN \xrightarrow{s} \IN \xrightarrow{s} \IN \xrightarrow{s} \cdots\bigr)$$
      is a subobject classifier, where $\top : 1 \to \Omega$ is given by the elements $0 \in \IN$ in every degree. Clearly, $\Omega$ is connected. Consider a monomorphism $U \to X$. By the classification of monomorphisms below, we may assume that $U \subseteq X$ is a subsequence, i.e. $U_n \subseteq X_n$ for each $n$, and the transition maps $X_n \to X_{n+1}$ restrict to the transition maps $U_n \to U_{n+1}$.

      For $x_n \in X_n$, we claim that there is some $k \geq 0$ such that its image $x_{n+k} \in X_{n+k}$ belongs to $U_{n+k}$. In fact, there is some $u_n \in U_n$, and connectedness of $X$ yields some $k \geq 0$ such that the image of $u_n$ in $X_{n+k}$ is equal to $x_{n+k}$. This image belongs to $U_{n+k}$. Therefore, the map
      $$\chi_n : X_n \to \IN, \quad x_n \mapsto \min \{k \geq 0 : x_{n+k} \in U_{n+k}\}$$
      is well-defined. We claim that the diagram
      $$\begin{CD}
      X_n @>{x_n \mapsto x_{n+1}}>> X_{n+1} \\
      @V{\chi_n}VV @VV{\chi_{n+1}}V \\
      \IN @>>{s}> \IN
      \end{CD}$$
      commutes. In other words, if $k$ is the smallest number such that $x_{n+k} \in U_{n+k}$, then $s(k)$ is the smallest number $k'$ such that $x_{n+1+k'} \in U_{n+1+k'}$. If $k=0$, then $x_n \in U_n$, hence $x_{n+1} \in U_{n+1}$, so that $k'=0=s(k)$. Now assume $k > 0$, so that $s(k)=k-1$. Then $k'=k-1$, since $x_{n+1+(k-1)} \in U_{n+1+(k-1)}$ and, if $\ell < k-1$, then $\ell+1 < k$, so $x_{n+1+\ell} = x_{n+(\ell+1)} \notin U_{n+(\ell+1)}$ by the definition of $k$.

      Thus, $\chi = (\chi_n) : X \to \Omega$ is a well-defined morphism of sequences. Since $\chi_n^*(\{0\}) = U_n$ for each $n$, the canonical morphism $U \to X \times_{\Omega} 1$ is an isomorphism. It remains to show that $\chi$ is unique with this property.

      Let $\alpha : X \to \Omega$ be another morphism of sequences with $\alpha_n^*(\{0\}) = U_n$ for every $n$, and in particular $(\alpha_n)|_{U_n} = 0$. If $x_n \in X_n$ is any element, choose $k \geq 0$ minimal such that $x_{n+k} \in U_{n+k}$, where $x_{n+k}$ denotes the image of $x_n$ as before. We claim that
      $$\alpha_n(x_n) = k.$$
      For $k=0$, this is clear. Otherwise, we have
      $$0 = \alpha_{n+k}(x_{n+k}) = s(\alpha_{n+k-1}(x_{n+k-1})),$$
      and $\alpha_{n+k-1}(x_{n+k-1}) \neq 0$ since $x_{n+k-1} \notin U_{n+k-1}$. Hence
      $$\alpha_{n+k-1}(x_{n+k-1})=1.$$
      For any $i \geq 1$, the only preimage of $i$ under $s$ is $i+1$. Hence, by induction on $i \in \{1,\dotsc,k\}$, we obtain
      $$\alpha_{n+k-i}(x_{n+k-i})=i,$$
      which for $i=k$ gives the desired result.
    label: SeqSet_conn_subobject_classifier

  - property: cogenerator
    proof: >-
      We claim that the subobject classifier $\Omega$ constructed above is a cogenerator. In other words, if $f,g : X \rightrightarrows Y$ are distinct morphisms of connected sequences, then there is a subobject $U \subseteq Y$ such that $f^*(U) \neq g^*(U)$ as subobjects of $X$.

      Choose some $n \geq 0$ and $x_n \in X_n$ such that $f_n(x_n) \neq g_n(x_n)$ in $Y_n$. Define the subsequence $U \subseteq Y$ by
      $$U_k = \begin{cases}
      \varnothing & k < n \\
      Y_n \setminus \{f_n(x_n)\} & k = n \\
      Y_k & k > n.
      \end{cases}$$
      Since $U_k = Y_k$ for $k > n$ and $Y$ is connected, it follows that $U$ is connected. Since $f_n(x_n) \notin U_n$, the set $f^*(U)_n = (f_n)^*(U_n)$ does not contain $x_n$. On the other hand, $g^*(U)_n = (g_n)^*(U_n)$ does contain $x_n$ because $g_n(x_n) \in U_n$. Hence, $f^*(U) \neq g^*(U)$.
    references:
      - SeqSet_conn_subobject_classifier

  - property: finitely accessible
    proof: >-
      Let $X$ be a sequence of finite sets such that there is some $k \geq 0$ for which $X_n \to X_{n+1}$ is bijective for all $n \geq k$. Then it is easy to check that $X$ is finitely presentable in the category of sequences of sets $[(\IN,\leq),\Set]$, using the fact that finite sets are finitely presentable in $\Set$. (One can show that every finitely presentable object has this form, but we will not need this fact.) It follows that if $X$ is a sequence of finite sets that eventually consists of singletons, i.e. is of the form
      $$X_0 \to \cdots \to X_{k-1} \to \{\ast\} \to \{\ast\} \to \cdots,$$
      then $X$ is finitely presentable in $[(\IN,\leq),\Set]_{\conn}$. The collection of isomorphism classes of such sequences is essentially small. It remains to prove that every connected sequence of sets is a filtered colimit of such sequences.

      Let $X$ be any connected sequence. Consider the set $P$ of subsequences $U \subseteq X$ (meaning that $U_n \subseteq X_n$ and the transition maps of $U$ are restrictions of the transition maps of $X$) such that each $U_n$ is finite and there is some $k \geq 0$ such that $U_n$ is a singleton for every $n \geq k$. Then $(P,\subseteq)$ is a partially ordered set.

      Let us check that $(P,\subseteq)$ is directed. First, it is non-empty, because we may choose some element $x_n \in X_n$, and then the sequence
      $$\varnothing \to \cdots \to \varnothing \to \{x_n\} \to \{x_{n+1}\} \to \cdots$$
      belongs to $P$, where the empty sets occupy the indices $0,1,\dotsc,n-1$ and $x_m$ denotes the image of $x_n$ in $X_m$ for any $m \geq n$.

      Now let $U,V \in P$. There is some $k \geq 0$ such that both $U_n$ and $V_n$ are singletons for every $n \geq k$. Write $U_k = \{u_k\}$ and $V_k = \{v_k\}$. Then $u_k,v_k \in X_k$, so there is some $m \geq k$ such that $u_k$ and $v_k$ have the same image $x_m \in X_m$. Since $U \subseteq X$ and $V \subseteq X$ are subsequences, we have $x_m \in U_m$ and $x_m \in V_m$, so $U_m = \{x_m\}$ and $V_m = \{x_m\}$. Define $W \subseteq X$ by $W_n = U_n \cup V_n$ for $n \leq m$ and $W_n = \{x_n\}$ for $n \geq m$, where $x_n$ denotes the image of $x_m$ in $X_n$. Then $W \in P$, and clearly $U \subseteq W$ and $V \subseteq W$, as required.

      We claim that the canonical morphism
      $$\colim_{U \in P} U \to X$$
      induced by the inclusion maps $U \hookrightarrow X$ is an isomorphism. In other words, for every $n \geq 0$, the component
      $$\colim_{U \in P} U_n \to X_n$$
      is an isomorphism. It is injective since $(P,\leq)$ is directed and each $U_n \hookrightarrow X_n$ is injective. To show surjectivity, let $x_n \in X_n$. As before, consider the sequence $U$ defined by
      $$\varnothing \to \cdots \to \varnothing \to \{x_n\} \to \{x_{n+1}\} \to \cdots.$$
      It belongs to $P$, and the element $x_n \in U_n$ induces an element of $\colim_{U \in P} U_n$ that maps to $x_n \in X_n$.

  - property: multi-complete
    proof: 'We will prove that the inclusion functor $[(\IN,\leq),\Set]_{\conn} \hookrightarrow [(\IN,\leq),\Set]$ has a <a href="https://ncatlab.org/nlab/show/multi-adjoint" target="_blank">right multi-adjoint</a>, so that multi-limits in the category $[(\IN,\leq),\Set]_{\conn}$ can be constructed by applying this adjoint to multi-limits in the category $[(\IN,\leq),\Set]$ (which is even complete). For a sequence of sets $X$ (not necessarily connected) and an element $c \in \colim(X)$, let $X^c \subseteq X$ be the subsequence consisting of those elements that map to $c$ in the colimit. That is, if $(u_n : X_n \to \colim(X))_{n \geq 0}$ is the colimit cocone, we define $(X^c)_n \coloneqq (u_n)^*(\{c\})$. It is easy to see that $X^c$ is connected. We claim that the family of inclusion maps $(X^c \to X)_{c \in \colim(X)}$ is multi-universal, i.e. that every morphism $f : Y \to X$ from a connected sequence $Y$ to $X$ factors uniquely through $X^c \hookrightarrow X$ for a unique $c \in \colim(X)$. Indeed, $f$ induces a map $\{\ast\} = \colim(Y) \to \colim(X)$, which corresponds to an element $c \in \colim(X)$, namely $u_n(f_n(y_n))$ for any $y_n \in Y_n$ and $n \geq 0$. This element is independent of the choice of $y_n$ and $n$. Hence, we have $f_n(y_n) \in (u_n)^*(\{c\})$ for all $y_n \in Y_n$ and $n \geq 0$, so $f$ factors through $X^c \hookrightarrow X$.'

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: locally finite
    proof: The endomorphisms of the sequence $\IN \to \{\ast\} \to \{\ast\} \to \cdots$ correspond to the endomorphisms of the set $\IN$.

  - property: disjoint finite products
    proof: >-
      If $X,Y$ are connected sequences with $X_0 = \varnothing$ and $Y_0 \neq \varnothing$, for example
      $$\begin{align*}
      X & = \bigl(\varnothing \to \{\ast\} \to \{\ast\} \to \cdots\bigr), \\
      Y & = \bigl(\{\ast\} \to \{\ast\} \to \{\ast\} \to \cdots\bigr),
      \end{align*}$$
      then the projection $X \times Y \to Y$ is not an epimorphism. Indeed, by the classification of epimorphisms below, this would require $X_0 \times Y_0 \to Y_0$ to be surjective, which is not the case.

  - property: generator
    proof: >-
      Assume that $G$ is a generator. For every $n \geq 0$, consider the sequence
      $$\varnothing \to \cdots \to \varnothing \to \IN \to \{\ast\} \to \{\ast\} \to \cdots,$$
      where the empty sets occupy the indices $0,1,\dotsc,n$. It is connected and has a non-trivial endomorphism. Thus, there must be a morphism from $G$ to this sequence that distinguishes the two endomorphisms. Hence, $G_0,\dotsc,G_n$ must be empty, while $G_{n+1}$ must be non-empty. Since this holds for every $n$, we obtain a contradiction.

  - property: ℵ₁-cofiltered
    proof: >-
      For every $n \geq 0$ consider the sequence $X^n$ defined by
      $$\varnothing \to \cdots \to \varnothing \to \{\ast\} \to \{\ast\} \to \cdots,$$
      where the empty sets occupy the indices $0,1,\dotsc,n$. Clearly, $X^n$ is connected. If there were a connected sequence $Y$ admitting morphisms $Y \to X^n$ for every $n \geq 0$, then $Y_0=\cdots=Y_n=\varnothing$ for every $n \geq 0$. Thus, $Y$ would be the empty sequence, which is not connected. Therefore, the countable family $(X^n)_{n \geq 0}$ has no cone.

  - property: binary copowers
    proof: >-
      We show that the coproduct $1+1$ does not exist in $[(\IN,\leq),\Set]_{\conn}$, where $1$ denotes the terminal object, the constant sequence with value $\{\ast\}$. Since a morphism $1 \to X$ corresponds to an element of $X_0$, this would amount to a universal connected sequence of sets $X$ equipped with two elements $x,x' \in X_0$. Choose $k \geq 0$ such that their images in $X_k$ coincide. Then, by the universal property, for every connected sequence $Y$ and every pair of elements $y,y' \in Y_0$, their images in $Y_k$ must coincide. A counterexample is the sequence $Y$ defined by
      $$\{0,1\} \xrightarrow{\id} \cdots \xrightarrow{\id} \{0,1\} \xrightarrow{!} \{0\} \xrightarrow{!} \{0\} \xrightarrow{!} \cdots,$$
      where $Y_k = \{0,1\}$ and $Y_{k+1}=\{\ast\}$. It is connected, but the elements $0,1 \in Y_0$ only become equal in $Y_{k+1}$.
      Another counterexample is the subobject classifier $\Omega$, whose elements $0,k+1 \in \Omega_0$ become equal only after $k+1$ steps.

      Here is an alternative proof that the coproduct $1+1$, and in fact most coproducts, do not exist. The projection functor $[(\IN,\leq),\Set]_{\conn} \to \Set$, $X \mapsto X_n$, has a right adjoint that maps a set $S$ to the connected sequence
      $$S \xrightarrow{\id} \cdots \xrightarrow{\id} S \xrightarrow{!} \{\ast\} \xrightarrow{!} \{\ast\} \xrightarrow{!} \cdots,$$
      where the singleton sets start at index $n+1$, because a morphism from $X$ to this sequence corresponds to a map $X_n \to S$. In particular, the projection functor is cocontinuous. Hence, any colimit, if it exists, must be computed pointwise. Since the pointwise coproduct $1+1$ is not connected, it does not exist in $[(\IN,\leq),\Set]_{\conn}$.
    references:
      - SeqSet_conn_subobject_classifier

  - property: countable powers
    proof: >-
      First, we prove that the inclusion functor $[(\IN,\leq),\Set]_{\conn} \hookrightarrow [(\IN,\leq),\Set]$ is continuous. By the Yoneda Lemma, the Hom-functors $\Hom(n,-)$ for $n \geq 0$ form an extremal generating collection of the functor category $[(\IN,\leq),\Set]$. The corresponding sequence is
      $$\varnothing \to \cdots \to \varnothing \to \{\ast\} \to \{\ast\} \to \cdots,$$
      where $\{\ast\}$ starts at index $n$, and this sequence is clearly connected. The claim now follows from the dual of Lemma 1 <a href="/content/inclusion-functors">here</a>. Alternatively, each projection functor $[(\IN,\leq),\Set]_{\conn} \to \Set$, $X \mapsto X_n$, is representable by the sequence just described and hence continuous.

      Thus, it suffices to prove that connected sequences are not closed under countable powers, which are defined pointwise. Consider the subobject classifier
      $$\Omega = \bigl(\IN \xrightarrow{s} \IN \xrightarrow{s} \IN \xrightarrow{s} \cdots\bigr)$$
      with $s(k) = \max(0,k-1)$. We will prove that $\Omega^{\IN}$ is not connected. For the two elements $n,0 \in \Omega_0 = \IN$, their images in $\Omega_k = \IN$ coincide if and only if $k \geq n$. It follows that the two elements $(0,1,2,\dotsc)$ and $(0,0,\dotsc)$ of $\Omega_0^{\IN}$ have the same image in $\Omega_k^{\IN}$ if and only if $k \geq n$ for every $n \geq 0$. Thus, no such $k$ exists, and $\Omega^{\IN}$ is not connected.
    label: SeqSet_conn_no_countable_powers
    references:
      - SeqSet_conn_subobject_classifier

  - property: ℵ₁-cofiltered limits
    proof: Since we already know that the inclusion functor $[(\IN,\leq),\Set]_{\conn} \hookrightarrow [(\IN,\leq),\Set]$ is continuous, it suffices to construct an $\aleph_1$-cofiltered diagram of connected sequences whose limit sequence is not connected. An example is given in <a target="_blank" href="https://mathoverflow.net/questions/515431">MO/515431</a>.
    references:
      - SeqSet_conn_no_countable_powers

  - property: natural numbers object
    proof: >-
      Assume that a natural numbers object $(N,z,s)$ exists in $[(\IN,\leq),\Set]_{\conn}$. The morphism $z : 1 \to N$ corresponds to an element $z \in N_0$. The functor
      $$[(\IN,\leq),\Set]_{\conn} \to \Set, \quad X \mapsto X_0$$
      has a right adjoint mapping a set $S$ to the connected sequence
      $$S \xrightarrow{!} \{\ast\} \xrightarrow{!} \{\ast\} \xrightarrow{!} \cdots,$$
      and it preserves terminal objects. Thus, by Lemma 5 <a href="/content/natural_numbers_objects">here</a>, the triple $(N_0,z,s_0)$ is a natural numbers object of $\Set$, and therefore isomorphic to the standard natural numbers object $(\IN, 0, x \mapsto x+1)$. In particular, $N_0$ is infinite.

      For every $k \geq 0$ consider the connected sequence $X$ defined by
      $$N_0 \xrightarrow{\id} \cdots \xrightarrow{\id} N_0 \xrightarrow{!} \{\ast\} \xrightarrow{!} \{\ast\} \xrightarrow{!} \cdots,$$
      where the singleton sets start at index $k+1$. The element $z \in N_0 = X_0$ induces a morphism $z : 1 \to X$. We define the endomorphism $r : X \to X$ by using the map $s_0 : N_0 \to N_0$ at indices $0,\dotsc,k$ and the unique maps at indices $> k$. Since $(N,z,s)$ is a natural numbers object, there is a unique morphism of sequences $f : N \to X$ such that $f_0(z)=z$ and $r \circ f = f \circ s$. Evaluating this equation at index $0$ yields $s_0 \circ f_0 = f_0 \circ s_0$, so that $f_0 = \id_{N_0}$. Furthermore, naturality of $f : N \to X$ for $0 \to k$ shows that the diagram
      $$\begin{CD}
      N_0 @>{N_{0 \to k}}>> N_k \\
      @V{\id}VV @VV{f_k}V \\
      N_0 @>>{\id}> N_0
      \end{CD}$$
      commutes. In particular, each transition map $N_0 \to N_k$ is injective. It follows that the induced map $N_0 \to \colim_k N_k$ is injective. But this contradicts the fact that $N_0$ is infinite and $\colim_k N_k$ is a singleton set.

  - property: coaccessible
    proof: >-
      We will find a family of morphisms in $[(\IN,\leq),\Set]_{\conn}$ such that an object $X$ is projective to the family if and only if $X_k \to X_{k+1}$ is an isomorphism for each $k \geq 1$. Then $X_k$ is a singleton for each $k \geq 1$, and the full subcategory of such objects is equivalent to <a href="/category/Set">$\Set$</a>, which is not coaccessible. It will then follow from the dual of Prop. 4.7 in <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a> that $[(\IN,\leq),\Set]_{\conn}$ is not coaccessible.

      Let $k \geq 1$. Consider the monomorphism of connected sequences $U^{[k]} \hookrightarrow V^{[k]}$ defined by
      $$\begin{CD}
      \{a\} @>>> \cdots @>>> \{a\} @>>> \{a\} @>>> \{a\} @>>> \cdots \\
      @VVV @. @VVV @VVV @VVV @. \\
      \{a\} @>>> \cdots @>>> \{a\} @>>> \{a, b\} @>>> \{a\} @>>> \cdots
      \end{CD}$$
      with the evident maps, where $\{a,b\}$ has index $k+1$ in $V^{[k]}$. Given a sequence $X$, a morphism $X \to V^{[k]}$ is the same as a map $X_{k+1} \to \{a,b\}$ such that the composite
      $$X_k \to X_{k+1} \to \{a,b\}$$
      is constant at $a$.
      $$\begin{CD}
      X_k @>>> X_{k+1} \\
      @VVV @VVV \\
      \{a\} @>>> \{a, b\}
      \end{CD}$$
      It lifts to a morphism $X \to U^{[k]}$ if and only if the map $X_{k+1} \to \{a,b\}$ is constant at $a$. Hence, $X$ is projective to $U^{[k]} \hookrightarrow V^{[k]}$ if and only if $X_k \to X_{k+1}$ is surjective.

      Next, consider the epimorphism of connected sequences $A^{[k]} \twoheadrightarrow B^{[k]}$ defined by
      $$\begin{CD}
      \{a,b\} @>>> \cdots @>>> \{a,b\} @>>> \{a,b\} @>>> \{a\} @>>> \cdots \\
      @VVV @. @VVV @VVV @VVV @. \\
      \{a,b\} @>>> \cdots @>>> \{a,b\} @>>> \{a\} @>>> \{a\} @>>> \cdots,
      \end{CD}$$
      where the last $\{a,b\}$ has index $k+1$ in $A^{[k]}$ (and index $k$ in $B^{[k]}$). A morphism $X \to B^{[k]}$ corresponds to a map $X_k \to \{a,b\}$, and it lifts to a morphism $X \to A^{[k]}$ if and only if there is a map $X_{k+1} \to \{a,b\}$ extending $X_k \to \{a,b\}$. Thus, $X$ is projective to $A^{[k]} \twoheadrightarrow B^{[k]}$ if and only if the map
      $$\Hom(X_{k+1},\{a,b\}) \to \Hom(X_k,\{a,b\})$$
      induced by $X_k \to X_{k+1}$ is surjective, which is equivalent to $X_k \to X_{k+1}$ being injective.

      Therefore, the family consisting of all $U^{[k]} \hookrightarrow V^{[k]}$ together with all $A^{[k]} \twoheadrightarrow B^{[k]}$ has the desired property.

  - property: generalized variety
    proof: >-
      First, we will show that every strongly finitely presentable object $X$ of $[(\IN,\leq),\Set]_{\conn}$ has injective transition maps (and hence is subterminal). The proof is rather long but elementary.

      Suppose that $X \in [(\IN,\leq),\Set]_{\conn}$ is strongly finitely presentable, meaning that $\Hom(X,-)$ preserves sifted colimits. For ease of exposition, we will only show that the second transition map $t : X_1 \to X_2$ is injective; evident modifications of the sequences $A,B$ below show that every transition map $X_k \to X_{k+1}$ is injective.

      Define $A$ to be the connected sequence
      $$\begin{CD}
      \{u,u',v\} @>{\id}>> \{u,u',v\} @>>> \{u,v\} @>{!}>> \{\ast\} @>{!}>> \cdots
      \end{CD}$$
      where $u,u'$ map to $u$ and $v$ maps to $v$. Define $B$ to be the connected sequence
      $$\begin{CD}
      \{x,y\} @>{\id}>> \{x,y\} @>{!}>> \{\ast\} @>{!}>> \{\ast\} @>{!}>> \cdots.
      \end{CD}$$
      Define a morphism $f : A \to B$ by the diagram
      $$\begin{CD}
      \{u,u',v\} @>{\id}>> \{u,u',v\} @>>> \{u,v\} @>{!}>> \{\ast\} @>{!}>> \cdots \\
      @VV{f_0}V @VV{f_0}V @VV{!}V @VV{!}V @. \\
      \{x,y\} @>{\id}>> \{x,y\} @>{!}>> \{\ast\} @>{!}>> \{\ast\} @>{!}>> \cdots,
      \end{CD}$$
      where
      $$f_0(u)=x, \quad f_0(u')=y, \quad f_0(v)=x.$$
      Define $g : A \to B$ similarly, but with
      $$g_0(u)=x, \quad g_0(u')=y, \quad g_0(v)=y.$$
      Define a morphism $s : B \to A$ by the diagram
      $$\begin{CD}
      \{x,y\} @>{\id}>> \{x,y\} @>{!}>> \{\ast\} @>{!}>> \{\ast\} @>{!}>> \cdots.\\
      @VV{s_0}V @VV{s_0}V @VV{u}V @VV{!}V @. \\
      \{u,u',v\} @>{\id}>> \{u,u',v\} @>>> \{u,v\} @>{!}>> \{\ast\} @>{!}>> \cdots,
      \end{CD}$$
      where $s_0(x)=u$ and $s_0(y)=u'$. Then $f \circ s = g \circ s = \id_B$, so $f,g$ form a reflexive pair. Since $X$ is strongly finitely presentable, $\Hom(X,-)$ preserves reflexive coequalizers in particular, so the canonical map
      $$\coeq(\Hom(X,f),\Hom(X,g)) \to \Hom(X,\coeq(f,g))$$
      is an isomorphism. The coequalizer of $f,g$ can be computed pointwise. It is obtained from $B$ by identifying $x$ with $y$, and hence is the terminal sequence. In particular, $\Hom(X,\coeq(f,g))$ is a singleton set. Hence, the coequalizer of
      $$\Hom(X,f),\Hom(X,g) : \Hom(X,A) \rightrightarrows \Hom(X,B)$$
      is also a singleton set. We will next describe this coequalizer.

      Morphisms $X \to B$ can be identified with maps $X_1 \to \{x,y\}$, and thus with subsets of $X_1$ by taking the fiber over $x$.
      $$\begin{CD}
      X_0 @>>> X_1 @>>> X_2 @>>> X_2 @>>> \cdots \\
      @VVV @VVV @VV{!}V @VV{!}V @. \\
      \{x,y\} @>{\id}>> \{x,y\} @>{!}>> \{\ast\} @>{!}>> \{\ast\} @>{!}>> \cdots
      \end{CD}$$
      Morphisms $X \to A$ can be identified with commutative squares
      $$\begin{CD}
      X_1 @>{t}>> X_2 \\
      @VVV @VVV \\
      \{u,u',v\} @>>> \{u,v\}.
      \end{CD}$$
      The map $X_2 \to \{u,v\}$ corresponds to a subset $V \subseteq X_2$ by taking the fiber over $u$, and the map $X_1 \to \{u,u',v\}$ corresponds to a pair of subsets $U \subseteq U' \subseteq X_1$ by taking the preimages of $\{u\}$ and $\{u,u'\}$, respectively. The commutativity of the diagram means that $t^*(V) = U'$. Thus, the data of a morphism $X \to A$ can be identified with a pair of subsets $U \subseteq X_1$, $V \subseteq X_2$ satisfying $U \subseteq t^*(V)$, i.e. $t_*(U) \subseteq V$.

      Under these identifications, one can easily check that $\Hom(X,f)$ sends a pair $(U,V)$ to $U \cup (X_1 \setminus t^*(V))$, while $\Hom(X,g)$ sends this pair to $U$. Hence, the coequalizer of $\Hom(X,f)$ and $\Hom(X,g)$ is the quotient of the power set $P(X_1)$ by the equivalence relation $\sim$ generated by
      $$U \sim U \cup (X_1 \setminus t^*(V))$$
      for all $U \subseteq X_1$ and $V \subseteq X_2$ satisfying $U \subseteq t^*(V)$. By replacing $V$ with $X_2 \setminus V$, this can also be described as the equivalence relation generated by
      $$U \sim U \cup t^*(V)$$
      whenever $U \cap t^*(V) = \varnothing$.

      Consider the following property of a subset $U \subseteq X_1$: there is some fiber $t^*(\{y\})$ such that $U \cap t^*(\{y\})$ is a non-empty proper subset of $t^*(\{y\})$. We claim that this property is invariant under $\sim$, i.e. that, for equivalent sets $U$ and $U' \coloneqq U \cup t^*(V)$ as above, $U$ satisfies this property if and only if $U'$ does. Assume first that $U$ has the property. Then $U' \cap t^*(\{y\})$ is non-empty since $U \subseteq U'$. Choose $x \in t^*(\{y\}) \setminus U$. If $x \in U'$, then $x \in t^*(V)$, so $y \in V$, but then $U \cap t^*(\{y\}) \subseteq U \cap t^*(V) = \varnothing$, a contradiction. Thus, $x \notin U'$, showing that $U' \cap t^*(\{y\})$ is a proper subset of $t^*(\{y\})$, and hence $U'$ has the property. Conversely, assume that $U'$ has the property. Then $U \cap t^*(\{y\})$ is a proper subset of $t^*(\{y\})$ since $U \subseteq U'$. Choose $x \in U' \cap t^*(\{y\})$. Since $x \in U'$, either $x \in U$, in which case we are done, or $x \in t^*(V)$. In the latter case, $y \in V$, and hence $t^*(\{y\}) \subseteq t^*(V) \subseteq U'$, contradicting the assumption on $U'$. Thus, $U$ has the property.

      Since the coequalizer of $\Hom(X,f)$ and $\Hom(X,g)$ is a singleton set, all pairs of subsets of $X_1$ are equivalent. Moreover, the subset $\varnothing$ does not have the property discussed above. It follows that no subset of $X_1$ has the property. In particular, if $x \in X_1$, then $\{x\}$ does not have the property for $y=t(x)$, i.e. $\{x\} \cap t^*(\{y\}) = t^*(\{y\})$, so $t^*(\{y\}) = \{x\}$. Therefore, $t$ is injective.

      This finishes the proof that every strongly finitely presentable object $X$ has injective transition maps. Then each $X_n$ embeds into $\colim(X)$, which is a singleton. Thus, each set $X_n$ is subterminal, and it follows easily that $X$ is isomorphic to one of the sequences
      $$\varnothing \to \cdots \to \varnothing \to \{\ast\} \to \{\ast\} \to \cdots,$$
      which are the representable functors $(\IN,\leq) \to \Set$. In $\Set$, a connected colimit of subterminal sets is again subterminal. It follows that the strongly finitely presentable objects of $[(\IN,\leq),\Set]_{\conn}$ are closed under connected colimits, and hence also under sifted colimits. Since not every connected sequence is of this form, $[(\IN,\leq),\Set]_{\conn}$ cannot be a generalized variety.

special_objects:
  terminal object:
    description: the constant sequence $\{\ast\} \to \{\ast\} \to \cdots$
  products:
    description: '[finite case] component-wise defined direct product'

special_morphisms:
  isomorphisms:
    description: morphisms $f = (f_n)_{n \geq 0}$ for which every $f_n$ is bijective
    proof: It is a full subcategory of the <a href="/category/SeqSet">category of sequences of sets</a>, where isomorphisms are characterized as stated.
  monomorphisms:
    description: morphisms $f = (f_n)_{n \geq 0}$ for which every $f_n$ is injective
    proof: Morphisms with injective components are clearly monomorphisms. Conversely, the inclusion functor into the <a href="/category/SeqSet">category of sequences of sets</a> preserves finite limits (by their construction), hence preserves monomorphisms. Since monomorphisms in the category of sequences have injective components, every monomorphism in $[(\IN,\leq),\Set]_{\conn}$ has injective components.
  epimorphisms:
    description: morphisms $f = (f_n)_{n \geq 0}$ for which every $f_n$ is surjective
    proof: Morphisms with surjective components are clearly epimorphisms. Conversely, the inclusion functor into the <a href="/category/SeqSet">category of sequences of sets</a> preserves connected colimits (by their construction), and hence pushouts in particular. It therefore preserves epimorphisms. Since epimorphisms in the category of sequences have surjective components, every epimorphism in $[(\IN,\leq),\Set]_{\conn}$ has surjective components.
