id: BC
name: delooping of the bicyclic monoid
notation: $BC$
objects: a single object $*$
morphisms: 'the elements of the <a href="https://en.wikipedia.org/wiki/Bicyclic_monoid">bicyclic monoid</a> $C \coloneqq \langle p,q : pq = 1 \rangle$'
description: >-
  Every monoid $M$ induces a category $BM$ with a single object $*$, morphisms given by the elements of $M$, and composition given by the monoid operation. Some of the properties of this category depend on the specific monoid.

  In this entry, we take the monoid $C$ freely generated by $p,q$ subject to the relation $pq=1$, known as the bicyclic monoid and often denoted by $C(p,q)$. Every element of $C$ can be uniquely written as $q^n p^m$ for $n,m \geq 0$.

  This category is a one-object version of the <a href="/category/walking_splitting">walking splitting</a>, but its properties are completely different.
nlab_link: null

tags:
  - algebra

related:
  - BD
  - BN
  - BG_c

satisfied_properties:
  - property: small
    proof: This is trivial.

  - property: countable
    proof: This is because the monoid $C$ is countable.

  - property: core-connected
    proof: The category has exactly one object.

  - property: skeletal
    proof: The category has exactly one object.

  - property: self-dual
    proof: The monoid $C$ is isomorphic to its dual $C^{\op}$ by mapping $p \mapsto q$, $q \mapsto p$.

  - property: Cauchy complete
    proof: We need to show that every idempotent of $C$ splits. Assume that $e = q^n p^m$ is idempotent. Thus, $e^2 = q^n p^m q^n p^m$. If $m \geq n$, then $p^m q^n = p^{m-n}$, so that $e^2 = q^n p^{2m-n}$. Thus, $m=2m-n$, i.e. $m=n$. If $m \leq n$, then $p^m q^n = q^{n-m}$, so that $e^2 = q^{2n-m} p^m$. Thus, $n=2n-m$, and again we get $m=n$. Every idempotent therefore has the form $e = q^n p^n$ for some $n \geq 0$. It splits because $p^n q^n = 1$.
    check_redundancy: false

  - property: core-thin
    proof: We need to show that $1$ is the only invertible element of $C$. Assume that $f = q^n p^m$ is invertible. If $m > 0$, then $f = f'p$ for some $f'$, so that $p$ is a split monomorphism. Because of $pq=1$, it is also a split epimorphism. Hence, it must be an isomorphism. But then $pq=1$ implies $qp=1$, which is not correct. Therefore, we must have $m=0$. Then $f=q^n$ is not an isomorphism for $n>0$ since otherwise $q$ would be an isomorphism, from which again $qp=1$ would follow.

  - property: mono-regular
    proof: This follows from our descriptions of monomorphisms and regular monomorphisms below. It shows that in fact, every monomorphism splits.

  - property: reflexive coequalizers
    proof: >-
      It suffices to prove that every reflexive pair $f,g$ satisfies $f=g$. Algebraically, this means that left inverses are uniquely determined in $C$. So assume that $xy=1$ for some $x,y \in C$. In particular, $x$ is an epimorphism and $y$ is a monomorphism. By the classification of these morphisms below, we have $x=p^m$ for some $m \geq 0$ and $y=q^n$ for some $n \geq 0$. If $n > m$, then
      $$1 = xy = p^m q^n = q^{n-m}$$
      is a contradiction. Likewise, if $n < m$, we obtain the contradiction $1 = p^{m-n}$. Therefore, $m=n$. Thus, $x$ is uniquely determined by $y$.

  - property: ℵ₁-accessible
    proof: >-
      We apply Theorem 4 <a href="/content/deloopings-aleph1-accessible">here</a>. We already know that $C$ is countable and that $BC$ is Cauchy complete. It remains to show that $C$ satisfies the ascending chain condition on principal right ideals. Every principal right ideal of $C$ has the form $q^n p^m C = q^n C$, since $p^m q^m = 1$ implies $p^m C = C$. If $q^n C \subseteq q^{n'} C$, then $n \geq n'$. Otherwise, write $q^n = q^{n'} x$ with $x \in C$. Since $q^n$ is a monomorphism, we get $1 = q^{n'-n} x$, so that $q^{n'-n}$ is a split epimorphism, which contradicts the classification of epimorphisms below. Therefore, every ascending chain $q^{n_0} C \subseteq q^{n_1} C \subseteq \cdots$ satisfies $n_0 \geq n_1 \geq \cdots$ and hence becomes stationary.
    label: BC_aleph1-accessible

unsatisfied_properties:
  - property: retract-trivial
    proof: We have $pq=1$, but $qp \neq 1$.

  - property: zero morphisms
    proof: We need to show that $C$ has no absorbing element. Assume that $q^n p^m$ is an absorbing element. Then $q^{n+1} p^m = q (q^n p^m) = q^n p^m$ implies $n+1=n$, a contradiction.

  - property: cokernel pairs
    proof: >-
      We show that $q$ does not have a cokernel pair, i.e. that there is no universal pair of elements $(x,y) \in C^2$ with $xq=yq$; the universal property means that any other such pair $(u,v)$ factors as $u=tx$, $v=ty$ for a unique $t \in C$.

      Assume that $(x,y)$ is a universal pair. Since $(1,1)$ is a valid pair, there is a unique $t \in C$ with $1=tx$ and $1=ty$. In particular, $x$ and $y$ are monomorphisms. By their classification below, we get $x=q^n$, $y=q^k$ for some $n,k \geq 0$. Since $xq=yq$, we actually have $k=n$, i.e. $x=y$.

      Since $(qp)q=q$, also $(qp,1)$ is a valid pair. Hence, there is a unique $t \in C$ with $qp=tx$ and $1=ty$. Since $x=y$, we obtain the contradiction $qp=1$.

  - property: sifted
    proof: >-
      Consider the homomorphism $\deg : C \to (\IZ,+,0)$ defined by $\deg(p)=1$ and $\deg(q)=-1$. To every cospan $(x,y)$ (over the unique pair of objects in $BC$) we associate the number $\deg(x) - \deg(y)$. If a cospan $(x,y)$ has a morphism to another cospan $(u,v)$, i.e. there is some element $t$ with $tx=u$ and $ty=v$, then
      $$\deg(u) - \deg(v) = (\deg(t)+\deg(x)) - (\deg(t)+\deg(y)) = \deg(x) - \deg(y).$$
      Therefore, all cospans in a connected component have the same associated number. In particular, the cospans $(1,1)$ and $(p,1)$ do not lie in the same connected component.
    label: BC_not_sifted

  - property: sequential colimits
    proof: >-
      We will show that the sequence
      $$* \xrightarrow{q} * \xrightarrow{q} * \xrightarrow{q} \cdots$$
      has no colimit. Assume that the sequence has a colimit, i.e. a universal cocone $x=(x_n)$. Write $x_0 = q^a p^b$. Choose some $m > a$ and define the sequence of elements $(c_n)$ by
      $$c_n \coloneqq \begin{cases}
      q^{m-n} & n \leq m \\
      p^{n-m} & n \geq m.
      \end{cases}$$
      It is easy to verify that $(c_n)$ is a cocone. By universality, there is some $h \in C$ such that
      $$c_n = h x_n \tag{1}$$
      for all $n \geq 0$. Write $h = q^c p^d$. For $n=0$ the cocone equality $(1)$ is:
      $$q^{m} = c_0 = h x_0 = q^c p^d q^a p^b.$$
      For $d \geq a$ the right hand side is $q^c p^{d-a+b}$, so that $m=c$ and $0=d-a+b$. For $d < a$ the right hand side is $q^{c+a-d} p^b$, so that $b=0$ and $c=m-a+d \geq m - a > 0$. In each case, we find $c > 0$. That is, $h = qh'$ for some $h' \in C$.

      Next, we evaluate the cocone equality $(1)$ at $n=m+1$. We get
      $$p = c_{m+1} = h x_{m+1} = q (h' x_{m+1}).$$
      Since $p$ is an epimorphism, this implies that $q$ is also an epimorphism, which is a contradiction.
    label: BC_no_sequential_colimits

special_objects: {}

special_morphisms:
  isomorphisms:
    description: only the neutral element $1$
    proof: We have shown this in the proof that the category is core-thin.
  monomorphisms:
    description: the elements $q^n$ for $n \geq 0$
    proof: Since $q$ is a split monomorphism, also $q^n$ is a split monomorphism. For $m > 0$ the element $q^n p^m$ is not a monomorphism, since otherwise $p$ would be a monomorphism, from which we would obtain the contradiction $qp=1$ from $pq=1$.
  epimorphisms:
    description: the elements $p^m$ for $m \geq 0$
    proof: The proof is identical to the proof for monomorphisms. This is also because $C$ is self-dual.
  regular monomorphisms:
    description: the elements $q^n$ for $n \geq 0$
    proof: We already know that these are precisely the monomorphisms. They are split monomorphisms because $q$ is a split monomorphism, and every split monomorphism is a regular monomorphism.
  regular epimorphisms:
    description: the elements $p^m$ for $m \geq 0$
    proof: We already know that these are precisely the epimorphisms. They are split epimorphisms because $p$ is a split epimorphism, and every split epimorphism is a regular epimorphism.
