id: walking_coreflexive_pair
name: walking coreflexive pair
notation: $\Delta^{\leq 1}$
objects: two objects $[0]$ and $[1]$
morphisms: 'the identities, two morphisms $i,j : [0] \rightrightarrows [1]$, a morphism $p : [1] \to [0]$ with $p i = p j = \id_{[0]}$, and the two idempotent morphisms $ip, jp : [1] \rightrightarrows [1]$.'
description: >-
  This category is equal to the truncated simplex category $\Delta^{\leq 1}$, i.e. the full subcategory of $\Delta$ spanned by $[0] = \{0\}$ and $[1] = \{0 < 1\}$; this also explains our notation of the category and its objects.
  $$[0] \begin{array}{c} \xhookrightarrow{~~i~~} \\ \xtwoheadleftarrow{~~p~~} \\ \xhookrightarrow{~~j~~} \end{array} [1]$$
  The morphisms $i,j$ are the two inclusions, $p$ is their unique retraction, and $ip,jp : [1] \rightrightarrows [1]$ are the two constant maps. The name of this category comes from the fact that a functor $\Delta^{\leq 1} \to \C$ is the same as a <a href="https://ncatlab.org/nlab/show/reflexive+pair">coreflexive pair</a> in $\C$. Its dual is therefore the walking reflexive pair.
nlab_link: null
tags:
  - category theory

related:
  - Delta
  - walking_pair
  - walking_splitting

satisfied_properties:
  - property: small
    proof: The objects and morphisms form finite sets.

  - property: finite
    proof: There are $2$ objects and $7$ morphisms, namely $\id_{[0]}$, $\id_{[1]}$, $i$, $j$, $p$, $ip$, $jp$.

  - property: strongly connected
    proof: This is trivial.

  - property: gaunt
    proof: This is obvious.

  - property: terminal object
    proof: The object $[0]$ is terminal since it is already terminal in $\Delta$ (<a href="/category/Delta?proof=terminal_object">proof</a>).

  - property: all epimorphisms split
    proof: The only non-identity epimorphism is $p$ (<a href="/category/walking_coreflexive_pair?proof=epimorphism">proof</a>), and $p i = \id_{[0]}$.

  - property: all monomorphisms split
    proof: The only non-identity monomorphisms are $i$ and $j$ (<a href="/category/walking_coreflexive_pair?proof=monomorphism">proof</a>), and $p i = p j = \id_{[0]}$.

  - property: extremal generator
    proof: The object $[1]$ is an extremal generator even in $\Delta$ (<a href="/category/Delta?proof=extremal_generator">proof</a>); now use Lemma 10 <a href="/content/subcategories">here</a>. A direct proof is also possible.

  - property: extremal cogenerator
    proof: The object $[1]$ is an extremal cogenerator even in $\Delta$ (<a href="/category/Delta?proof=extremal_cogenerator">proof</a>); now use Lemma 10 <a href="/content/subcategories">here</a>. A direct proof is also possible.

  - property: cosifted
    proof: Our <a href="/category/Delta?proof=cosifted">proof</a> that the simplex category is cosifted has only used $[0],[1]$ as auxiliary objects and therefore also shows that $\Delta^{\leq 1}$ is cosifted.

  - property: discretely filtered colimits
    proof: >-
      More generally, we show this for every truncated simplex category $\Delta^{\leq n}$, which we regard as the full subcategory of <a href="/category/Ord">$\Ord$</a> consisting of the ordered sets $\{0 < 1 < \dotsc < k\}$ for $0 \leq k \leq n$. Let $D : \I \to \Delta^{\leq n}$, $i \mapsto (X_i,\leq)$ be a diagram, where $\I$ is a small discretely filtered category. By the <a href="/category/Ord?proof=discretely_filtered_colimits">proof</a> for $\Ord$, $D$ has a colimit $(\iota_i : (X_i,\leq) \to (C,\leq))_{i \in \I}$ in $\Ord$ such that finitely many elements of $C$ lie in the image of a single $\iota_k$. Since the inclusion $\Delta^{\leq n} \hookrightarrow \Ord$ is fully faithful, it suffices to show that $C$ is non-empty and has at most $n+1$ elements. It is non-empty, since $\I$ is inhabited and every $X_i$ is non-empty. Any $n+2$ elements of $C$ lie in the image of some $\iota_k$, and since $X_k$ has at most $n+1$ elements, two of them are equal. This argument is taken from <a href="https://mathoverflow.net/questions/510760/a/510802">MO/510760</a>.

  - property: generalized variety
    proof: This actually holds for every truncated simplex category $\Delta^{\leq n}$. It has sifted colimits, since it even has discretely filtered colimits (<a href="/category/walking_coreflexive_pair?proof=discretely_filtered_colimits" data-allow-deduced>proof</a>). See <a href="https://mathoverflow.net/questions/510827">MO/510827</a> for a proof that every object is strongly finitely presentable.

unsatisfied_properties:
  - property: cofiltered
    proof: 'The morphisms $i,j : [0] \rightrightarrows [1]$ are not equalized by any morphism.'

  - property: coreflexive equalizers
    proof: 'The coreflexive pair $i,j : [0] \rightrightarrows [1]$ has no equalizer, in fact is not equalized by any morphism.'

  - property: cokernel pairs
    proof: Assume that $[1] \xleftarrow{i} [0] \xrightarrow{i} [1]$ has a pushout in $\Delta^{\leq 1}$, where $i(0)=0$. This amounts to a universal totally ordered set of cardinality $\leq 2$ with elements $a,b,c$ satisfying $a \leq b$, $a \leq c$. Since a finite totally ordered set has trivial automorphism group, the automorphism defined by $a \mapsto a$, $b \mapsto c$, $c \mapsto b$ must be the identity, i.e., we have $b = c$. However, in $[1]$ the equations $0 \leq 0$, $0 \leq 1$ then show that the universal property fails.

  - property: natural numbers object
    proof: 'We work with the representation of this category as the full subcategory of $\FinOrd$ consisting of $\{0\}$ and $\{0 < 1\}$. First, the terminal object $\{0\}$ cannot be the underlying object of a natural numbers object: otherwise, by Lemma 3 <a href="/content/natural_numbers_objects">here</a> and the fact that $\{0\}$ is a generator, every endomorphism in the category would be the identity, which is not the case. It remains to show that $(\{0 < 1\}, z, s)$ is not a natural numbers object for any choice of $z \in \{0,1\}$ and $s : \{0 < 1\} \to \{0 < 1\}$. Using the isomorphism of the category that swaps the two morphisms $\{0\} \rightrightarrows \{0 < 1\}$, we may assume that $z = 0$. Every subobject of $\{0 < 1\}$ that contains $0$ and is closed under $s$ is also a natural numbers object and hence must be equal to $\{0 < 1\}$. It follows that $\{0,1\} = \{0,s(0),s^2(0),\dotsc\}$ as sets. In particular, $s(0) \neq 0$, so $s(0) = 1$. (We do not need to determine $s(1)$.) Now apply the universal property to the element $1 \in \{0 < 1\}$ and the zero map $\{0 < 1\} \to \{0 < 1\}$, $n \mapsto 0$. We obtain an order-preserving map $p : \{0 < 1\} \to \{0 < 1\}$ satisfying $p(0) = 1$ and $p(s(n)) = 0$. Thus, $p(1) = p(s(0)) = 0$, so $p(0) > p(1)$, contradicting the fact that $p$ is order-preserving.'

special_objects:
  terminal object:
    description: $[0]$

special_morphisms:
  monomorphism:
    description: the identities and $i$, $j$
    proof: Since $pi = \id$, but $ip \neq \id$, we conclude that $i$ is a monomorphism, but $p$ is not. Likewise, $j$ is a monomorphism. Since $p$ is not a monomorphism, $ip$ and $jp$ are also no monomorphisms.
  epimorphism:
    description: the identities and $p$
    proof: Since $pi = \id$, but $ip \neq \id$, we conclude that $p$ is an epimorphism, but $i$ is not. Hence, also $ip$ is not an epimorphism. Likewise, $j$ and $jp$ are no epimorphisms.
