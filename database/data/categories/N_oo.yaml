id: N_oo
name: partially ordered set of extended natural numbers
notation: $(\IN \cup \{\infty\}, \leq)$
objects: natural numbers and $\infty$
morphisms: 'a unique morphism $(n, m) : n \to m$ if $n \leq m$, where of course $n \leq \infty$ for all $n$'
description: This category is a completed version of the thin <a href="/category/N">category of natural numbers</a>.
nlab_link: null
keywords:
  - poset of extended natural numbers

tags:
  - number theory

related:
  - N
  - On
  - real_interval

satisfied_properties:
  - property: small
    proof: This is trivial.

  - property: countable
    proof: This is trivial.

  - property: semi-strongly connected
    proof: This is trivial.

  - property: direct
    proof: This is because the natural numbers with $\infty$ with respect to $<$ are well-founded.

  - property: finitary algebraic
    proof: >-
      Since every subset of $\IN \cup \{\infty\}$ has a supremum, all coproducts, and hence all colimits exist. Every natural number is strongly finitely presentable, and $\infty$ is the colimit of all $n < \infty$. This shows that the category is locally strongly finitely presentable, which is equivalent to being finitary algebraic.

      Alternatively, we can use the finitary algebraic theory with sorts $(S_n)_{n \in \IN}$, unary operations $S_{n+1} \to S_n$, and equations $x = y$ for all elements $x,y$ of each sort $S_n$. In a model $M$, every set $M_n$ has at most one element, and the set $\{k \in \IN : M_k \neq \varnothing\}$ is a lower set of $\IN$. Hence, it is either $\{k \in \IN : k < n\}$ for some $n \in \IN$, or all of $\IN$, which corresponds to $\infty$. A morphism of models $M \to M'$ exists if and only if $M_k \neq \varnothing$ implies $M'_k \neq \varnothing$ for all $k$, and it is then unique. Thus, the category of models is isomorphic to $\IN \cup \{\infty\}$ with the order $\leq$.

  - property: dually finitary algebraic
    proof: >-
      We show that the dual category $(\IN \cup \{\infty\}, \geq)$ is equivalent to the category of models of a finitary algebraic theory. The theory has sorts $(S_n)_{n \in \IN}$, unary operations $S_n \to S_{n+1}$, and equations $x = y$ for all elements $x,y$ of each sort $S_n$. In a model $M$, every set $M_n$ has at most one element, and the set $\{k \in \IN : M_k \neq \varnothing\}$ is an upper set of $\IN$. Hence, it is either $\{k \in \IN : k \geq n\}$ for some $n \in \IN$, or empty, which corresponds to $\infty$. A morphism of models $M \to M'$ exists if and only if $M_k \neq \varnothing$ implies $M'_k \neq \varnothing$ for all $k$, and it is then unique. Thus, the category of models is isomorphic to $\IN \cup \{\infty\}$ with the order $\geq$.
    check_redundancy: false

unsatisfied_properties:
  - property: essentially finite
    proof: This is trivial.

  - property: self-dual
    proof: This is because every upper set is infinite, but every lower set is finite.

  - property: inverse
    proof: Consider the strictly increasing sequence $0 < 1 < 2 < \cdots$.

  - property: extremal generator
    proof: The poset $\IN_\infty$ has infinitely many non-minimal elements $1, 2, \dotsc, \infty$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal generator cannot exist.

  - property: extremal cogenerator
    proof: The poset $\IN_\infty$ has infinitely many non-maximal elements $0, 1, 2, \dotsc$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal cogenerator cannot exist.

special_objects:
  initial object:
    description: $0$
  terminal object:
    description: $\infty$
  coproducts:
    description: supremum
  products:
    description: infimum

special_morphisms:
  isomorphism:
    description: only the identity morphisms
    proof: This is true for every poset (regarded as a thin category).
