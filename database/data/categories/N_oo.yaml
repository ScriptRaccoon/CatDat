id: N_oo
name: partially ordered set of extended natural numbers
notation: $(\IN \cup \{\infty\}, \leq)$
objects: natural numbers and $\infty$
morphisms: 'a unique morphism $(n, m) : n \to m$ if $n \leq m$, where of course $n \leq \infty$ for all $n$'
description: This category is a completed version of the thin <a href="/category/N">category of natural numbers</a>.
nlab_link: null

tags:
  - number theory

related:
  - N
  - On
  - real_interval

satisfied_properties:
  - property: small
    proof: This is trivial.

  - property: countable
    proof: This is trivial.

  - property: coproducts
    proof: Take the supremum.
    check_redundancy: false

  - property: semi-strongly connected
    proof: This is trivial.

  - property: direct
    proof: This is because the natural numbers with $\infty$ with respect to $<$ are well-founded.

  - property: finitary algebraic
    proof: >-
      We already saw that coproducts, and therefore colimits exist. Every natural number is strongly finitely presentable, and $\infty$ is the colimit of all $n < \infty$. This shows that the category is locally strongly finitely presentable, which is equivalent to being finitary algebraic.
      Alternatively, we may use the finitary algebraic theory with sorts $(S_n)_{n \in \IN}$, unary operations $S_n \to S_{n+1}$, and the equations $x=y$ for elements $x,y$ of sort $S_n$. The models of this theory are given by $(0,\dotsc,0,1,1,\dotsc)$, where $1$ starts at index $n \in \IN$, as well as $(0,0,\dotsc)$, which corresponds to $\infty$.

unsatisfied_properties:
  - property: essentially finite
    proof: This is trivial.

  - property: self-dual
    proof: This is because every upper set is infinite, but every lower set is finite.

  - property: inverse
    proof: Consider the strictly increasing sequence $0 < 1 < 2 < \cdots$.

  - property: extremal generator
    proof: The poset $\IN_\infty$ has infinitely many non-minimal elements $1, 2, \dotsc, \infty$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal generator cannot exist.

  - property: extremal cogenerator
    proof: The poset $\IN_\infty$ has infinitely many non-maximal elements $0, 1, 2, \dotsc$. Therefore, by the corollary <a href="/content/thin_extremal_generator">here</a>, an extremal cogenerator cannot exist.

special_objects:
  initial object:
    description: $0$
  terminal object:
    description: $\infty$
  coproducts:
    description: supremum
  products:
    description: infimum

special_morphisms:
  isomorphisms:
    description: only the identity morphisms
    proof: This is true for every poset (regarded as a thin category).
