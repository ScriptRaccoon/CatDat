id: Met_c
name: category of metric spaces with continuous maps
notation: $\Met_c$
objects: metric spaces
morphisms: continuous maps
description: This category is equivalent to the subcategory of $\Top$ (or $\Haus$) that consists of metrizable topological spaces. Hence, the metrics only play a secondary role here.
nlab_link: https://ncatlab.org/nlab/show/metrisable+topological+space

tags:
  - analysis

related:
  - Haus
  - Met
  - Met_oo
  - Top

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Met_c \to \Set$ and $\Set$ is locally small.

  - property: semi-strongly connected
    proof: Every non-empty metric space is weakly terminal (by using constant maps).

  - property: equalizers
    proof: Just restrict the metric to the equalizer built from the sets.

  - property: countable products
    proof: For finite products, we take the cartesian product with, say, the sup-metric. The product of countably many metric spaces $(X_i,d_i)_{i \geq 0}$ is given by the cartesian product $\prod_{i \geq 0} X_i$ with the metric $d(x,y) \coloneqq \sum_{i \geq 0} d_i(x_i,y_i)/(1 + d_i(x_i,y_i))$. See Engelking's book <i>General Topology</i>.

  - property: coproducts
    proof: See <a href="https://math.stackexchange.com/questions/5004389" target="_blank">MSE/5004389</a>.
    check_redundancy: false

  - property: well-powered
    proof: This follows easily from the fact that monomorphisms are injective in this category.

  - property: well-copowered
    proof: 'If $f : X \to Y$ is an epimorphism, then $f(X)$ is dense in $Y$ (see below). Hence, there is an injective map $Y \to X^{\IN}$, which bounds the size of $Y$.'

  - property: infinitary extensive
    proof: This follows from Lemma 11 <a href="/content/subcategories">here</a> since <a href="/category/Top">$\Top$</a> is infinitary extensive and its full subcategory $\Met_c$ of metrizable topological spaces is closed under pullbacks and coproducts in $\Top$.

  - property: effective cocongruences
    proof: 'Suppose we have a cocongruence $f, g : X \rightrightarrows E$ in $\Met_c$. Then the image in $\Haus$ is a coreflexive corelation (since epimorphisms in both categories are continuous maps with dense image). By <a href="https://mathoverflow.net/a/509582/2841" target="_blank">MO/509548</a>, that implies that image is of the form $X +_S X$ for a closed subset $S$ of $X$. Since $S$ is metrizable, and the functor $\Met_c \to \Haus$ is fully faithful <a href="https://ncatlab.org/nlab/show/reflected+limit#FullSubcategoryInclusionReflectCoLimits" target="_blank">and therefore reflects colimits</a>, we conclude that $E$ is effective in $\Met_c$.'

  - property: extremal generator
    proof: 'We claim the metric space $G \coloneqq \{ 1/n : n \in \IN_{> 0} \} \cup \{ 0 \}$, with the metric inherited from $\IR$, is an extremal generator. First, the one-point metric space is a generator since it represents the forgetful functor $\Met_c \to \Set$; and since we have an epimorphism $! : G \to 1$, it follows that $G$ is a generator as well. Now, suppose we have a continuous function $f : X \to Y$ of metric spaces such that $f \circ {-} : \Hom(G, X) \to \Hom(G, Y)$ is a bijection. Then since $G$ is a generator, we can conclude that $f$ is a monomorphism, i.e. injective on the underlying sets. Also, considering a constant function $G \to Y$ with image $y$, we see that $f$ is surjective on the underlying sets. Finally, the fact that $f$ induces a bijection between $\Hom(G, X)$ and $\Hom(G, Y)$ implies that a sequence $(x_n)_{n\in \IN}$ in $X$ has limit $L$ if and only if $(f(x_n))_{n\in \IN}$ has limit $f(L)$ in $Y$. This shows that $f$ is a homeomorphism.'

  - property: extremal cogenerator
    proof: >-
      The space $\IR$ with the usual metric is a cogenerator. To see this, suppose we have $x, y \in X$ with $f(x) = f(y)$ for each continuous $f : X \to \IR$. In particular, this folds for $f(z) \coloneqq d(x, z)$, implying that
      $$d(x, y) = f(y) = f(x) = d(x, x) = 0,$$
      so $x = y$.

      In fact, $\IR$ is an extremal cogenerator. To see this, suppose $f : X \to Y$ is a continuous function of metric spaces such that ${-} \circ f : \Hom(Y, \IR) \to \Hom(X, \IR)$ is a bijection. We first show that $f$ is injective on the underlying sets. Thus, suppose we have $x_1, x_2 \in X$ with $f(x_1) = f(x_2)$. Then the function $d(x_1, {-}) : X \to \IR$ is continuous, so there exists a continuous function $\varphi : Y \to \IR$ such that $d(x_1, x) = \varphi(f(x))$ for each $x \in X$. In particular,
      $$d(x_1, x_2) = \varphi(f(x_2)) = \varphi(f(x_1)) = d(x_1, x_1) = 0,$$
      so $x_1 = x_2$.

      Now, the fact that ${-} \circ f$ is a bijection, and $\IR$ is a cogenerator, implies that $f$ is an epimorphism, i.e. its image is dense in $Y$. We claim that in fact $f$ is surjective on underlying sets. Suppose, for the sake of contradiction, that we had $y \in Y \setminus \im(f)$. Then we can define a continuous function
      $$X \to \IR, \, x \mapsto \frac{1}{d(f(x), y)}.$$
      By the assumption on $f$, there exists continuous $\varphi : Y \to \IR$ such that
      $$\varphi(f(x)) = \frac{1}{d(f(x), y)}$$
      for each $x \in X$. However, since $f$ has dense image, there is a sequence $(x_n)_{n=1}^\infty$ of points of $X$ such that $f(x_n) \to y$, while
      $$\lim_{n\to \infty} \varphi(f(x_n)) = \lim_{n\to \infty} \frac{1}{d(f(x_n), y)} = \infty.$$
      This makes it impossible for $\varphi$ to be continuous at $y$, giving a contradiction.

      Finally, since we have shown $f$ is bijective on underlying sets, to show $f$ is a homeomorphism, it suffices to show that $f$ is closed. Thus, let $F \subseteq X$ be closed. Then $d({-}, F) : X \to \IR$ is a continuous function, so there exists $\varphi : Y \to \IR$ such that $\varphi(f(x)) = d(x, F)$ for each $x\in X$. That implies that $f_*(F) = \{ y\in Y : \varphi(y) = 0 \}$ is closed.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: The inclusion $\IQ \hookrightarrow \IR$ provides a counterexample.

  - property: ℵ₂-small powers
    proof: See <a href="https://math.stackexchange.com/questions/139168" target="_blank">MSE/139168</a> for a proof that uncountable powers do not exist.

  - property: Malcev
    proof: 'Consider the metric subspace $\{(a,b) \in \IR^2 : a \leq b\}$ of $\IR^2$.'

  - property: regular subobject classifier
    proof: 'We recycle the proof from <a href="/category/Haus">$\Haus$</a>: Assume that there is a regular subobject classifier $\Omega$. By the classification of regular monomorphisms, we would have an isomorphism between $\Hom(X,\Omega)$ and the set of closed subsets of $X$ for any metric space $X$. If we take $X = 1$ we see that $\Omega$ has two points. Since $\Omega$ is Hausdorff, $\Omega \cong 1 + 1$ must be discrete. But then $\Hom(X,\Omega)$ is isomorphic to the set of all clopen subsets of $X$, of which there are usually far fewer than closed subsets (consider $X = [0,1]$).'

  - property: sequential colimits
    proof: See <a href="https://mathoverflow.net/questions/510316" target="_blank">MO/510316</a> for a proof that the diagram $\IN \to \Met_c$, $n \mapsto \IR^n$ does not have a colimit.

  - property: ℵ₁-filtered colimits
    proof: See <a href="https://mathoverflow.net/questions/511433" target="_blank">MO/511433</a> for a proof that the diagram $\omega_1 \to \Met_c$, $\alpha \mapsto \IR^\alpha$ does not have a colimit.

  - property: regular
    proof: >-
      We will find a morphism $f : X \to Y$ in $\Met_c$ whose kernel pair has no coequalizer. The idea is to represent the <a href="https://doi.org/10.1016/0166-8641(95)00016-X" target="_blank">sequential fan</a> $S_\omega$ as such a coequalizer in $\Top$, and generalize the diagonal argument showing that it is not metrizable.


      For $n \geq 1$ consider the subspace
      $$S_n := \{1/k : k \geq 1\} \cup \{0\}$$
      of $\IR$, so that $\Hom(S_n,Y)$ corresponds to convergent sequences in $Y$. Each $S_n$ has diameter $1$, so we can endow the coproduct space
      $$X := \textstyle\coprod_n S_n$$
      with a metric that extends the metric on each $S_n$ and in which points in $S_n$ and $S_m$ for $n \neq m$ have distance $1$. The points of $X$ will be written as $(n,x)$, where $x \in S_n$. If $p_n$ denotes the $n$th prime number, we have $\lim_{k \to \infty} p_n^{-k} = 0$ in $\IR$, so we have a continuous map $S_n \to \IR$ mapping $1/k \mapsto p_n^{-k}$ and $0 \mapsto 0$. Together, these yield a continuous map
      $$f : X \to \IR, \, (n,0) \mapsto 0, \, (n,1/k) \mapsto p_n^{-k}.$$
      Let $\pi_1,\pi_2 : E \rightrightarrows X$ be the kernel pair of $f$. Since $p_n^{-k}$ completely determines $n$ and $k$, $E$ consists precisely of the diagonal and all $((n,0),(m,0))$ for $n,m \geq 1$. Thus, the coequalizer of $\pi_1,\pi_2$ in $\Top$ is the quotient of $X$ that identifies all limit points $(n,0)$ for $n \geq 1$; this space is known as the sequential fan $S_\omega$.


      Now assume that $\pi_1,\pi_2$ have a coequalizer $q : X \to Q$ in $\Met_c$, i.e. the universal continuous map from $X$ into a metrizable space such that the point
      $$0_Q := q(n,0) \in Q$$
      does not depend on the choice of $n$. Since $Q$ is metrizable, there is a countable decreasing neighborhood basis $(B_m)_{m \geq 1}$ of $0_Q \in Q$. Then $U_m := q^{-1}(B_m)$ is an open neighborhood of $(n,0) \in X$ for any $n$, and in particular of $(m,0)$. Hence, $U_m \cap S_m$ contains almost all points of $S_m$. In particular, we may choose a point $x_m \in U_m \cap S_m$ that is isolated in $S_m$.


      Define the subset $A := \{x_m : m \geq 1\}$ of $X$ and let $g : X \to \IR$ be its characteristic function, so that $g(a)=1$ for $a \in A$ and $g(x) = 0$ for $x \in X \setminus A$. To show that $g$ is continuous, it suffices to consider each restriction $g|_{S_m} : S_m \to \IR$. This is the characteristic function of the isolated point $x_m \in S_m$, hence continuous.


      Since $g(n,0) = 0$ for all $n \geq 1$, there is a unique continuous map $\tilde{g} : Q \to \IR$ satisfying $\tilde{g} \circ q = g$. The points $q(x_m)$ in $Q$ converge to $0_Q$ because for all $k \geq m$ we have $x_k \in U_k$, hence $q(x_k) \in B_k \subseteq B_m$. Since $\tilde{g}$ is continuous, it follows that $\tilde{g}(q(x_m)) = g(x_m) = 1$ converges to $\tilde{g}(0_Q) = \tilde{g}(q(n,0)) = g(n,0) = 0$, which is a contradiction.


      Sketch of an alternative proof: Consider the coproduct $X := \coprod_n \IR^n$ in $\Met_c$. The canonical inclusions $\IR^n \to \ell^2$ into the Hilbert space of square-summable sequences yield a continuous map $f : X \to \ell^2$. A coequalizer of the kernel pair of $f$ would be a colimit of the sequence
      $$\IR \hookrightarrow \IR^2 \hookrightarrow \IR^3 \cdots$$
      where each map appends a zero coordinate, and we have seen above that this sequential colimit does not exist.

  - property: quotients of congruences
    proof: In the previous proof we have constructed a morphism whose kernel pair does not have a coequalizer, and every kernel pair is a congruence.

special_objects:
  initial object:
    description: empty metric space
  terminal object:
    description: singleton space
  coproducts:
    description: Given metric spaces $(X_i,d_i)$ with $d_i \leq 1$ w.l.o.g, we endow the disjoint union $\coprod_i X_i$ with the metric $d$ that extends the metrics $d_i$ and satisfies $d(x,y) = 1$ when $x,y$ are in different $X_i$.
  products:
    description: '[countable case] In the finite case, take direct products with the metric $d(x,y) = \sup_i d_i(x_i,y_i)$, but other metrics such as $d(x,y) = \sum_i d_i(x_i,y_i)$ also work. In the countable case, one can assume $d_i \leq 1$ and then define $d(x,y) = \sum_i d_i(x,y) / 2^i$.'

special_morphisms:
  isomorphisms:
    description: homeomorphisms
    proof: This works as for topological spaces.
  monomorphisms:
    description: injective continuous maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphisms:
    description: continuous maps with dense image
    proof: See <a href="https://math.stackexchange.com/questions/937387" target="_blank">MSE/937387</a>.
  regular monomorphisms:
    description: embeddings of closed subspaces
    proof: A reference is Example 7.58 (3) in <a href="https://ncatlab.org/nlab/show/Abstract+and+Concrete+Categories" target="_blank">Joy of Cats</a>, but a proof is missing there.
