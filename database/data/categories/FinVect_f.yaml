id: FinVect_f
name: category of finite-dimensional vector spaces [finite field]
notation: $\FinVect_K$
objects: finite-dimensional vector spaces over a finite field $K$
morphisms: linear maps
description: This is the special case of <a href="/category/FinVect">$\FinVect_K$</a> where $K$ is a finite field (e.g. $K = \IF_2$). We use this assumption in order to determine all properties of this category.
nlab_link: https://ncatlab.org/nlab/show/FinDimVect
parent: FinVect

tags:
  - algebra

related:
  - Vect
  - Ab_fg

satisfied_properties:
  - property: essentially countable
    proof: Every object is isomorphic to $K^n$ for some $n \in \IN$, and $\Hom(K^n,K^m) \cong M_{m \times n}(K)$ is finite by assumption, hence a countable set.

  - property: locally finite
    proof: Each hom-set $\Hom(K^n,K^m) \cong M_{m \times n}(K)$ is finite by assumption.

unsatisfied_properties: []

special_objects: {}

special_morphisms: {}
