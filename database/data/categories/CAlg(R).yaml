id: CAlg(R)
name: category of commutative algebras
notation: $\CAlg(R)$
objects: commutative algebras over a commutative ring $R \neq 0$
morphisms: maps preserving the ring and module structure
description: This category is a generalization of the category of commutative rings, which we get for $R = \IZ$. In general, $\CAlg(R) \cong R \,/\, \CRing$. We assume our rings (and algebras) to be unital. For $R = 0$ we would get the trivial category, which is why we exclude this here.
nlab_link: https://ncatlab.org/nlab/show/CommAlg
keywords:
  - commutative R-algebras

tags:
  - algebra

related:
  - Alg(R)
  - R-Mod

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\CAlg(R) \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of a commutative $R$-algebra.

  - property: strict terminal object
    proof: 'If $f : 0 \to A$ is a homomorphism of $R$-algebras, then $A$ satisfies $1=f(1)=f(0)=0$, so that $A=0$.'
    check_redundancy: false

  - property: Malcev
    proof: This follows in the same way as for <a href="/category/Grp">$\Grp$</a>; see also <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Example 2.2.5.
    references:
      - Grp_malcev

  - property: coextensive
    proof: >-
      We already know that $\CAlg(R)$ has products and pushouts, since it is one-sorted finitary algebraic. Concretely, the pushout of a span $A \leftarrow S \rightarrow B$ can be constructed as the tensor product $A \otimes_S B$ with the obvious multiplication. Finite products are disjoint because the projection $p_1 : A \times B \to A$ is clearly surjective, hence an epimorphism, and the tensor product $A \otimes_{p_1,A \times B,p_2} B = 0$ is the zero ring (the terminal object), since
      $$a \otimes b = a \cdot p_1(1,0) \otimes b = a \otimes p_2(1,0) \cdot b = a \otimes 0 = 0.$$
      It remains to check that finite products are stable under pushouts. Let
      $$f : A \times B \to T$$
      be an algebra homomorphism, and consider the pushouts
      $$\begin{align*}
      T_A & \coloneqq A \otimes_{p_1,A \times B,f} T \\
      T_B & \coloneqq B \otimes_{p_2,A \times B,f} T.
      \end{align*}$$
      We need to prove that the canonical homomorphism
      $$T \to T_A \times T_B$$
      is an isomorphism. Since $p_1 : A \times B \to A$ is surjective with kernel $0 \times B = \langle (0,1) \rangle$, we have $T_A = T/\langle f(0,1)\rangle$, and likewise, $T_B = T/\langle f(1,0) \rangle$. The elements $f(1,0)$ and $f(0,1)$ are orthogonal idempotents in $T$. Therefore, the claim follows from the well-known result in commutative algebra that if $A$ is a commutative algebra and $e \in A$ is an idempotent, then the canonical homomorphism
      $$A \to A/\langle e \rangle \times A/\langle 1-e \rangle$$
      is an isomorphism. One can also deduce this from the Chinese Remainder Theorem.

      An alternative proof, which we only sketch, uses the category of locally ringed spaces <a href="/category/LRS_R">$\LRS_R$</a> over $R$, which is infinitary extensive. It follows that the category of affine $R$-schemes is extensive by Lemma 11 <a href="/content/subcategories">here</a>, and this category is anti-equivalent to $\CAlg(R)$. This argument is not circular since our proof of extensivity of $\LRS_R$ does not use coextensivity of $\CAlg(R)$.

unsatisfied_properties:
  - property: skeletal
    proof: The zero $R$-algebras with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: semi-strongly connected
    proof: Choose a maximal ideal $\m$ of $R$, so $K \coloneqq R/\m$ is a field. If $\CAlg(R)$ is semi-strongly connected, then also $\CAlg(K)$ is semi-strongly connected. This has been disproven in <a href="https://math.stackexchange.com/questions/5129689">MSE/5129689</a>.

  - property: coregular
    proof: See <a href="https://math.stackexchange.com/questions/3745302">MSE/3745302</a>.

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \CAlg(R) \to \Set$ and the relation $E \subseteq U^2$ defined by $E(A) \coloneqq \{(a,b) \in U(A)^2 : ab = a^2\}$. Both are representable: $U$ by $R[X]$ and $E$ by $R[X,Y] / \langle XY-X^2 \rangle$. It is clear that $E$ is reflexive, but not symmetric.'

  - property: regular quotient object classifier
    proof: 'Assume that $P \to R$ is a regular quotient object classifier. If $J$ denotes the kernel of $P \to R$, every ideal $I \subseteq A$ of any commutative $R$-algebra has the form $I = \langle \varphi(J) \rangle$ for a unique homomorphism $\varphi : P \to A$. If $\sigma : A \to A$ is an automorphism with $\sigma(I)=I$, then uniqueness gives us $\sigma \circ \varphi = \varphi$, which means that $\varphi(J)$ lies in $A^{\sigma}$, the fixed algebra of $\sigma$. But then $I$ is generated by elements in $A^{\sigma} \cap I$. If $K$ is a residue field of $R$, this fails for $A = K[X,Y]$, $I = \langle X,Y \rangle$, $\sigma(X)=Y$, $\sigma(Y)=X$. The fixed algebra is the subalgebra of symmetric polynomials, which is $K[X+Y,XY]$. So $\langle X,Y \rangle$ is generated by symmetric polynomials without constant term, which implies $\langle X,Y \rangle \subseteq \langle X+Y,XY \rangle$ in $K[X,Y]$. But reducing an equation like $X = a(X,Y) \cdot (X+Y) + b(X,Y) \cdot (XY)$ modulo $\langle X^2,Y^2,XY \rangle$ yields a contradiction.'
    label: CAlg(R)_no_regular_quotient_object_classifier

  - property: coparametrized conatural numbers object
    proof: >-
      By the dual of Lemma 4 <a href="/content/natural_numbers_objects">here</a>, it suffices to show that the canonical homomorphism $\delta : A \otimes_R R^{\IN} \to A^{\IN}$ given by $a \otimes (r_n)_n \mapsto (r_n a)_n$ is not necessarily an isomorphism (which will show in particular that $\CAlg(R)$ is not countably codistributive). Since $R \neq 0$, there is a commutative $R$-algebra $K$ which is a field. Now let $A$ be any commutative $K$-algebra which is infinite-dimensional as a $K$-vector space, for example $A = K[X]$. We claim that the image of $\delta$ is contained in the union of the subsets $V^{\IN} \subseteq A^{\IN}$, where $V$ runs through the finite-dimensional $K$-linear subspaces of $A$. This implies that $\delta$ is not surjective: choose a sequence $(a_n)_n \in A^{\IN}$ of linearly independent elements, for example $a_n \coloneqq X^n$ in $K[X]$. If $(a_n)_n \in V^{\IN}$ for some $K$-linear subspace $V \subseteq A$, then $V$ contains infinitely many linearly independent elements, so $V$ is not finite-dimensional.

      To prove the claim, note that the definition of $\delta$ makes sense for every $R$-module $M$ and gives an $R$-linear map $\delta_M : M \otimes_R R^{\IN} \to M^{\IN}$ which is natural in $M$, with $\delta = \delta_A$. Every element of $A \otimes_R R^{\IN}$ is a finite sum of elementary tensors $b \otimes (r_n)_n$, hence lies in the image of $V \otimes_R R^{\IN} \to A \otimes_R R^{\IN}$, where $V \subseteq A$ is the $K$-linear subspace spanned by the finitely many elements $b \in A$ occurring in the sum. It is finite-dimensional, and it is an $R$-submodule since $R$ acts on $A$ via the structure homomorphism $R \to K$. The claim now follows from the commutative diagram
      $$\begin{CD}
      V \otimes_R R^{\IN} @>{\delta_V}>> V^{\IN} \\
      @VVV @VVV \\
      A \otimes_R R^{\IN} @>>{\delta_A}> A^{\IN}.
      \end{CD}$$

  - property: cototal
    # TODO: refactor this once we add "hypercocomplete"
    proof: >-
      In fact, it is not hypercocomplete, and the proof will be similar to the proof of <a href="/content/missing_cogenerator">this lemma</a>. To start, for each infinite cardinal $\kappa \ge \card(U(R))$, choose a field $F_\kappa$ of cardinality $\kappa$ including a quotient field of $R$. (For example, fix some such quotient field $R / \m$ and then let $F_\kappa$ be the extension of $R / \m$ by $\kappa$ many indeterminates.) We first claim that for any commutative $R$-algebra $A$ with $\kappa > \card(U(A))$, there is exactly one $R$-algebra homomorphism $\varphi : R \times F_\kappa \to A$, which can be described as the projection $R \times F_\kappa \to R$ followed by the unique morphism $R \to A$. To see this, note that for any other such morphism $\varphi$, we must have $\varphi(0, 1) \ne 0$. It follows that the rng homomorphism $F_\kappa \to A$ formed by composing $F_\kappa \to R \times F_\kappa$, $x \mapsto (0, x)$, with $\varphi$ is non-zero, and it is therefore injective since $F_\kappa$ was chosen to be a field. This gives a contradiction.

      It follows that for any commutative $R$-algebra $A$, the collection of cocones $R \times F_\kappa \to A$ from the discrete diagram on $R \times F_\kappa$ is essentially small. On the other hand, we claim that $\CAlg(R)$ has no coproduct of all $R \times F_\kappa$, showing that it is not hypercocomplete. To see this, suppose we had such a coproduct $A$, and choose a cardinal $\kappa$ greater than $\max(\card(U(A)), \card(U(R)), \aleph_0)$. Then the coprojection $R \times F_\kappa \to A$ would be split injective, where we can construct the splitting $A \to R\times F_\kappa$ such that the $\kappa$ component is the identity, whereas for $\lambda \ne \kappa$, the $\lambda$ component is given by the projection $R \times F_\lambda \to R$ composed with the unique morphism $R \to R \times F_\kappa$. However, from this injection, we would get $\card(U(A)) \ge \card(U(R \times F_\kappa)) = \kappa$, giving a contradiction.
    label: CAlg(R)_not_cototal

  - property: product-stable epimorphisms
    proof: >-
      For $R = \IZ$, this is <a href="https://doi.org/10.1081/AGB-100002403">Burgess–Raphael</a>, Cor. 3.5, and the general case follows from their results as well. For a reduced commutative ring $A$, the homomorphism $A \to T(A)$ into its universal von Neumann regular ring is an epimorphism of commutative rings. The <i>regularity degree</i> of $A$ is the smallest $k$ such that every element of $T(A)$ is a sum of $k$ elements of the form $a b^*$ with $a,b \in A$, where $b^*$ is the quasi-inverse of $b$ (defined below for products of fields). By Cor. 3.5 there, a product of such epimorphisms is not an epimorphism if the regularity degrees are unbounded. Now choose a field $K$ that is an $R$-algebra. By Theorem 3.1 there, the regularity degree of $K[X_1,\dotsc,X_n]$ is at least $n+1$, since its Krull dimension is $n$. Since $\CAlg(R) \cong R \,/\, \CRing$, a homomorphism of commutative $R$-algebras is an epimorphism in $\CAlg(R)$ if and only if it is one in $\CRing$, and products in $\CAlg(R)$ are direct products. Hence, the product of the epimorphisms $K[X_1,\dotsc,X_n] \to T(K[X_1,\dotsc,X_n])$ is not an epimorphism in $\CAlg(R)$.

      However, the paper relies on the theory of $T(A)$, partially from other sources: its construction via the patch topology and Pierce sheaves, the fact that every element of $T(A)$ has the form $\sum_{i=1}^{k} a_i b_i^*$, and the fact that epimorphisms out of von Neumann regular rings are surjective. Therefore, we give a direct proof, which avoids $T(A)$. The epimorphisms below are similar to the ones in the proof of Theorem 3.1 there.

      Let $C$ be a commutative ring and $c \in C$. An element $u \in C$ with $c^2 u = c$ and $u^2 c = u$ is called a <i>quasi-inverse</i> of $c$. It is well known that there is at most one quasi-inverse; see <a href="https://arxiv.org/abs/1605.04832">Lombardi–Quitté</a>, Ch. IV, Section 8, the paragraph after Fact 8.8.

      For example, every element $b$ of a product of fields $\prod_i F_i$ has a quasi-inverse $b^*$, whose components are $b_i^{-1}$ where $b_i \neq 0$, and $0$ where $b_i = 0$. Indeed, $b b^*$ is the idempotent whose components are $1$ where $b_i \neq 0$, and $0$ where $b_i = 0$. Multiplying it with $b$ and $b^*$, respectively, gives $b^2 b^* = b$ and $(b^*)^2 b = b^*$.

      Choose a field $K$ that is an $R$-algebra, for example a quotient of $R$ by a maximal ideal. For $n \geq 1$, let $A_n \coloneqq K[X_1,\dotsc,X_n]$. For $1 \leq i \leq n$, let $L_{n,i} \coloneqq K(X_i,\dotsc,X_n)$, and let $\pi_{n,i} : A_n \to L_{n,i}$ be the homomorphism with $X_j \mapsto 0$ for $j < i$ and $X_j \mapsto X_j$ for $j \geq i$. Let
      $$\textstyle B_n \coloneqq \prod_{i=1}^{n} L_{n,i} = K(X_1,\dotsc,X_n) \times K(X_2,\dotsc,X_n) \times \dotsb \times K(X_n)$$
      and
      $$\varphi_n : A_n \to B_n, \quad a \mapsto (\pi_{n,i}(a))_{1 \leq i \leq n}.$$

      <strong>Claim 1.</strong> The homomorphism $\varphi_n : A_n \to B_n$ is an epimorphism.

      Let $g,h : B_n \rightrightarrows C$ be homomorphisms of commutative $R$-algebras with $g \circ \varphi_n = h \circ \varphi_n$. Then
      $$D \coloneqq \{b \in B_n : g(b) = h(b)\}$$
      is a subalgebra of $B_n$ that contains $\varphi_n(A_n)$. For $a \in A_n$, both $g(\varphi_n(a)^*)$ and $h(\varphi_n(a)^*)$ are quasi-inverses of $g(\varphi_n(a)) = h(\varphi_n(a))$, hence they are equal by uniqueness of quasi-inverses, i.e. $\varphi_n(a)^* \in D$. For $1 \leq i \leq n$, the component $\pi_{n,j}(X_i)$ of $\varphi_n(X_i)$ is $X_i \neq 0$ for $j \leq i$ and $0$ for $j > i$. So
      $$d_i \coloneqq \varphi_n(X_i) \varphi_n(X_i)^* \in D$$
      is the idempotent whose components are $1$ for $j \leq i$ and $0$ for $j > i$. With $d_0 \coloneqq 0$, the element $\varepsilon_i \coloneqq d_i - d_{i-1} \in D$ has component $1$ at $i$ and $0$ elsewhere. Every element of $L_{n,i}$ has the form $u/v$ with $u,v \in K[X_i,\dotsc,X_n] \subseteq A_n$ and $v \neq 0$. Then $\pi_{n,i}(v) = v \neq 0$, so that $\varepsilon_i \varphi_n(u) \varphi_n(v)^* \in D$ has component $u/v$ at $i$ and $0$ elsewhere. Since every element of $B_n$ is a sum of such elements, we get $D = B_n$, i.e. $g = h$.

      <strong>Claim 2.</strong> Let $f : A \to B$ be an epimorphism of commutative $R$-algebras and $g : B \to L$ be an algebra homomorphism into a field $L$. Let $F \subseteq L$ be the subfield generated by $g(f(A))$. Then $g(B) \subseteq F$.

      Let $F' \subseteq L$ be the subfield generated by $g(B)$, so that $F \subseteq F'$. Since epimorphisms of fields in $\CRing$ are isomorphisms (see <a href="https://stacks.math.columbia.edu/tag/04VV">SP/04VV</a>), it suffices to show that the inclusion $F \hookrightarrow F'$ is an epimorphism in $\CRing$. Let $u,v : F' \rightrightarrows C$ be homomorphisms of commutative rings that agree on $F$. Then $u \circ g$ and $v \circ g$ agree on $f(A)$. As observed above, $f$ is also an epimorphism in $\CRing$, so that $u \circ g = v \circ g$. Thus, $u$ and $v$ agree on $g(B)$. The set of elements of $F'$ on which $u$ and $v$ agree is a subfield, since ring homomorphisms preserve inverses. Since it contains $g(B)$, it is equal to $F'$, i.e. $u = v$.

      Now let $I \coloneqq \{(n,i) \in \IN_{>0}^2 : i \leq n\}$, $A \coloneqq \prod_{n \geq 1} A_n$, and $B \coloneqq \prod_{n \geq 1} B_n = \prod_{(n,i) \in I} L_{n,i}$, and consider the product
      $$\textstyle \Phi \coloneqq \prod_{n \geq 1} \varphi_n : A \to B.$$

      <strong>Claim 3.</strong> The homomorphism $\Phi : A \to B$ is not an epimorphism.

      The idea is that the components of an element of $\Phi(A)$ at $(n,1),\dotsc,(n,n)$ all come from the same polynomial, so that a quotient of two such elements agrees with the element of $B$ with components $X_i$ at no more than one $(n,i)$ for each $n$, and that we can choose a homomorphism from $B$ into a field which ignores all sets of indices with a bounded number of elements of each form $(n,i)$; then Claim 2 gives a contradiction.

      Assume that $\Phi$ is an epimorphism. For $b \in B$, let $\supp(b) \subseteq I$ be the set of all $(n,i)$ with $b_{n,i} \neq 0$. Let $J \subseteq B$ be the set of all $b \in B$ for which there is some $k \in \IN$ such that $\supp(b)$ contains, for each $n$, at most $k$ elements of the form $(n,i)$. Since $\supp(0) = \varnothing$, and $\supp(b + b') \subseteq \supp(b) \cup \supp(b')$ and $\supp(b' b) \subseteq \supp(b)$ for all $b,b' \in B$, this is an ideal. It does not contain $1$, since $\supp(1) = I$ contains $n$ elements of the form $(n,i)$. Choose a maximal ideal $\m$ of $B$ with $J \subseteq \m$, and let $g : B \to B/\m$ be the projection. Let $x \in B$ be the element with components $x_{n,i} \coloneqq X_i$. By Claim 2, $g(x)$ lies in the subfield of $B/\m$ generated by $g(\Phi(A))$. Since $g(\Phi(A))$ is a subring of $B/\m$, this subfield consists of the quotients of its elements. Hence, there are $a,s \in A$ with $g(\Phi(s)) \neq 0$ and $g(x) \, g(\Phi(s)) = g(\Phi(a))$. This means that $\Phi(s) \notin \m$ and
      $$y \coloneqq x \, \Phi(s) - \Phi(a) \in \m.$$
      Its components are
      $$y_{n,i} = X_i \, \pi_{n,i}(s_n) - \pi_{n,i}(a_n) = \pi_{n,i}(X_i s_n - a_n).$$

      We claim that for each $n \geq 1$, there is at most one $i$ with $y_{n,i} = 0$ and $\Phi(s)_{n,i} \neq 0$. To see this, let $i < j$ with $y_{n,i} = 0$ and $y_{n,j} = 0$. It suffices to show that $\Phi(s)_{n,j} = \pi_{n,j}(s_n)$ vanishes. The kernels of $\pi_{n,i}$ and $\pi_{n,j}$ are the prime ideals $P_{n,i} \coloneqq (X_1,\dotsc,X_{i-1})$ and $P_{n,j} \coloneqq (X_1,\dotsc,X_{j-1})$. By the formula for $y_{n,i}$ and $y_{n,j}$ above, we have $X_i s_n - a_n \in P_{n,i} \subseteq P_{n,j}$ and $X_j s_n - a_n \in P_{n,j}$. Subtracting the first element from the second gives $(X_j - X_i) s_n \in P_{n,j}$. Since $X_i \in P_{n,j}$, we get $X_j s_n \in P_{n,j}$. Since $P_{n,j}$ is a prime ideal with $X_j \notin P_{n,j}$, we conclude $s_n \in P_{n,j}$, i.e. $\pi_{n,j}(s_n) = 0$.

      Let $e \coloneqq 1 - y y^* \in B$ be the idempotent whose components are $1$ where $y_{n,i} = 0$, and $0$ elsewhere. Since $y \in \m$, we have $1 - e = y y^* \in \m$. By what we have just shown, $\supp(e \, \Phi(s))$ contains, for each $n$, at most one element of the form $(n,i)$, so that $e \, \Phi(s) \in J \subseteq \m$. Hence, we get $\Phi(s) = e \, \Phi(s) + (1 - e) \, \Phi(s) \in \m$, a contradiction.

      Together with Claim 1, this shows that $\CAlg(R)$ does not have product-stable epimorphisms.

special_objects:
  initial object:
    description: $R$
  terminal object:
    description: trivial algebra
  coproducts:
    description: tensor products over $R$
  products:
    description: direct products with pointwise operations

special_morphisms:
  epimorphism:
    description: a homomorphism of algebras which is an epimorphism of commutative rings
    proof: The forgetful functor $\CAlg(R) \to \CRing$ is faithful and hence reflects epimorphisms, but it also preserves epimorphisms since it preserves pushouts (since $\CAlg(R) \cong R / \CRing$). For epimorphisms of commutative rings see the page for <a href="/category/CRing">$\CRing$</a>.
