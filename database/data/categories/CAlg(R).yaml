id: CAlg(R)
name: category of commutative algebras
notation: $\CAlg(R)$
objects: commutative algebras over a commutative ring $R \neq 0$
morphisms: maps preserving the ring and module structure
description: This category is a generalization of the category of commutative rings, which we get for $R = \IZ$. In general, $\CAlg(R) \cong R \,/\, \CRing$. We assume our rings (and algebras) to be unital. For $R = 0$ we would get the trivial category, which is why we exclude this here.
nlab_link: https://ncatlab.org/nlab/show/CommAlg

tags:
  - algebra

related:
  - Alg(R)
  - R-Mod

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\CAlg(R) \to \Set$ and $\Set$ is locally small.

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of a commutative algebra.

  - property: strict terminal object
    proof: 'If $f : 0 \to A$ is a homomorphism of $R$-algebras, then $A$ satisfies $1=f(1)=f(0)=0$, so that $A=0$.'
    check_redundancy: false

  - property: Malcev
    proof: This follows in the same way as for <a href="/category/Grp">$\Grp$</a>, see also Example 2.2.5 in <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories" target="_blank">Malcev, protomodular, homological and semi-abelian categories</a>.
    references:
      - grp_malcev

  - property: coextensive
    proof: >-
      We already know that $\CAlg(R)$ has products and pushouts, since it is one-sorted finitary algebraic. Concretely, the pushout of a span $A \leftarrow S \rightarrow B$ can be constructed as the tensor product $A \otimes_S B$ with the obvious multiplication. Finite products are disjoint because the projection $p_1 : A \times B \to A$ is clearly surjective, hence an epimorphism, and the tensor product $A \otimes_{p_1,A \times B,p_2} B = 0$ is the zero ring (the terminal object), since
      $$a \otimes b = a \cdot p_1(1,0) \otimes b = a \otimes p_2(1,0) \cdot b = a \otimes 0 = 0.$$
      It remains to check that finite products are stable under pushouts. Let
      $$f : A \times B \to T$$
      be an algebra homomorphism, and consider the pushouts
      $$\begin{align*}
      T_A & \coloneqq A \otimes_{p_1,A \times B,f} T \\
      T_B & \coloneqq B \otimes_{p_2,A \times B,f} T.
      \end{align*}$$
      We need to prove that the canonical homomorphism
      $$T \to T_A \times T_B$$
      is an isomorphism. Since $p_1 : A \times B \to A$ is surjective with kernel $0 \times B = \langle (0,1) \rangle$, we have $T_A = T/\langle f(1,0)\rangle$, and likewise, $T_B = T/\langle f(0,1) \rangle$. The elements $f(1,0)$ and $f(0,1)$ are orthogonal idempotents in $T$. Therefore, the claim follows from the well-known result in commutative algebra that if $A$ is a commutative algebra and $e \in A$ is an idempotent, then the canonical homomorphism
      $$A \to A/\langle e \rangle \times A/\langle 1-e \rangle$$
      is an isomorphism. One can also deduce this from the Chinese Remainder Theorem.

      An alternative proof, which we only sketch, uses the category of locally ringed spaces <a href="/category/LRS_R">$\LRS_R$</a> over $R$, which is infinitary extensive. It follows that the category of affine $R$-schemes is extensive by Lemma 11 <a href="/content/subcategories">here</a>, and this category is anti-equivalent to $\CAlg(R)$. This argument is not circular since our proof of extensivity of $\LRS_R$ does not use coextensivity of $\CAlg(R)$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: Take a prime ideal $P \subseteq R$ and consider the commutative $R$-algebra $A \coloneqq R/P$ (which is an integral domain). Then the inclusion $A \hookrightarrow Q(A)$ is a counterexample.

  - property: cogenerating set
    proof: 'We apply <a href="/content/missing_cogenerating_sets">this lemma</a> to the collection of commutative $R$-algebras which are fields: If $F$ is a commutative $R$-algebra that is also a field and $A$ is a non-trivial commutative $R$-algebra, any algebra homomorphism $F \to A$ is injective. For every infinite cardinal $\kappa$ the field of rational functions in $\kappa$ variables over some residue field of $R$ has cardinality $\geq \kappa$ and a non-trivial automorphism (swap two variables).'

  - property: countably codistributive
    proof: 'The canonical homomorphism $A \otimes_R R^{\IN} \to A^{\IN}$ is given by $a \otimes (r_n)_n \mapsto (r_n a)_n$ and does not have to be surjective: Since $R \neq 0$, there is a commutative $R$-algebra $K$ which is a field. Now take $A \coloneqq K[X]$ and consider the sequence $(X^n)_{n} \in A^{\IN}$.'

  - property: semi-strongly connected
    proof: Choose a maximal ideal $\m$ of $R$, so $K \coloneqq R/\m$ is a field. If $\CAlg(R)$ is semi-strongly connected, then also $\CAlg(K)$ is semi-strongly connected. This has been disproven in <a href="https://math.stackexchange.com/questions/5129689" target="_blank">MSE/5129689</a>.

  - property: coregular
    proof: See <a href="https://math.stackexchange.com/questions/3745302" target="_blank">MSE/3745302</a>.

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \CAlg(R) \to \Set$ and the relation $S \subseteq U^2$ defined by $S(A) \coloneqq \{(a,b) \in U(A)^2 : ab = a^2\}$. Both are representable: $U$ by $R[X]$ and $S$ by $R[X,Y] / \langle XY-X^2 \rangle$. It is clear that $S$ is reflexive, but not symmetric.'

  - property: regular quotient object classifier
    proof: 'Assume that $P \to R$ is a regular quotient object classifier. If $J$ denotes the kernel of $P \to R$, every ideal $I \subseteq A$ of any commutative $R$-algebra has the form $I = \langle \varphi(J) \rangle$ for a unique homomorphism $\varphi : P \to A$. If $\sigma : A \to A$ is an automorphism with $\sigma(I)=I$, then uniqueness gives us $\sigma \circ \varphi = \varphi$, which means that $\varphi(J)$ lies in $A^{\sigma}$, the fixed algebra of $\sigma$. But then $I$ is generated by elements in $A^{\sigma} \cap I$. If $K$ is a residue field of $R$, this fails for $A = K[X,Y]$, $I = \langle X,Y \rangle$, $\sigma(X)=Y$, $\sigma(Y)=X$. The fixed algebra is the subalgebra of symmetric polynomials, which is $K[X+Y,XY]$. So $\langle X,Y \rangle$ is generated by symmetric polynomials without constant term, which implies $\langle X,Y \rangle \subseteq \langle X+Y,XY \rangle$ in $K[X,Y]$. But reducing an equation like $X = a(X,Y) \cdot (X+Y) + b(X,Y) \cdot (XY)$ modulo $\langle X^2,Y^2,XY \rangle$ yields a contradiction.'
    label: calg_no_regular_quotient_object_classifier

  - property: cofiltered-limit-stable epimorphisms
    proof: >-
      Let $K$ be a field over $R$. Consider the epimorphism of sequences
      $$\begin{CD}
      \cdots @>>> K[X] @>>> K[X] @>>> K[X] \\
      @. @VVV @VVV @VVV \\
      \cdots @>>> K[X]/\langle X^3 \rangle @>>> K[X]/\langle X^2 \rangle @>>> K[X]/\langle X \rangle
      \end{CD}$$
      In the limit, it induces the inclusion $K[X] \hookrightarrow K[[X]]$, where $K[[X]]$ is the algebra of formal power series over $K$. It is clearly not surjective, but this is not sufficient, we need to argue that it is not an epimorphism in $\CAlg(R)$, or equivalently, in $\CRing$. For a proof, see <a href="https://math.stackexchange.com/questions/2391187" target="_blank">MSE/2391187</a>.

special_objects:
  initial object:
    description: $R$
  terminal object:
    description: trivial algebra
  coproducts:
    description: tensor products over $R$
  products:
    description: direct products with pointwise operations

special_morphisms:
  epimorphisms:
    description: a homomorphism of algebras which is an epimorphism of commutative rings
    proof: The forgetful functor $\CAlg(R) \to \CRing$ is faithful and hence reflects epimorphisms, but it also preserves epimorphisms since it preserves pushouts (since $\CAlg(R) \cong R / \CRing$). For epimorphisms of commutative rings see the page for <a href="/category/CRing">$\CRing$</a>.
