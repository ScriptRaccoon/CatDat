id: R-Mod_div
name: category of left modules over a division ring
notation: $R{-}\Mod$
objects: left $R$-modules
morphisms: $R$-linear maps
description: This is the special case of <a href="/category/R-Mod">$R{-}\Mod$</a> where $R$ is a division ring (also known as a skew-field).
nlab_link: https://ncatlab.org/nlab/show/module
parent: R-Mod
keywords:
  - skew-field
  - R-modules

tags:
  - algebra

related:
  - M-Set

satisfied_properties:
  - property: all epimorphisms split
    proof: If $R$ is a division ring, then by linear algebra every $R$-module has a basis, hence is projective. Therefore, every epimorphism, i.e. every surjective linear map, splits.

unsatisfied_properties: []

special_objects: {}

special_morphisms: {}
