id: TorsFreeAb
name: category of torsion-free abelian groups
notation: $\TorsFreeAb$
objects: torsion-free abelian groups
morphisms: group homomorphisms
description: This category is a typical example of a well-behaved additive category which is <i>not</i> abelian. It contains the category of free abelian groups.
nlab_link: https://ncatlab.org/nlab/show/torsion-free+module

tags:
  - algebra

related:
  - Ab
  - FreeAb
  - TorsAb

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\TorsFreeAb \to \Ab$ and $\Ab$ is locally small.

  - property: complete
    proof: The embedding $\TorsFreeAb \hookrightarrow \Ab$ is closed under limits and <a href="/category/Ab">$\Ab$</a> is complete.
    check_redundancy: false

  - property: cocomplete
    proof: 'The embedding $\TorsFreeAb \hookrightarrow \Ab$ has a left adjoint, sending an abelian group $A$ to its torsion-free reflection $A/T(A)$, where $T(A)$ is the torsion subgroup of $A$. Since <a href="/category/Ab">$\Ab$</a> is cocomplete, $\TorsFreeAb$ is cocomplete as well. The colimit of a diagram of torsion-free abelian groups is the torsion-free reflection of the colimit of the underlying abelian groups. Notice that the reflection is not required in the case of coproducts: the direct sum of torsion-free abelian groups is again torsion-free. It is also not required for filtered colimits.'
    check_redundancy: false
    label: torsfreeab_cocomplete

  - property: finitely accessible
    proof: We already saw that filtered colimits exist and are preserved by the forgetful functor to $\Ab$. Every torsion-free abelian group is the filtered colimit of its finitely generated subgroups, which are in fact free. Finitely generated free abelian groups are finitely presentable in $\Ab$ and therefore also in $\TorsFreeAb$.

  - property: preadditive
    proof: It is a full subcategory of the preadditive category <a href="/category/Ab">$\Ab$</a>.

  - property: regular
    proof: This follows from Lemma 7 <a href="/content/subcategories">here</a> applied to the inclusion functor $\TorsFreeAb \hookrightarrow \Ab$ into the regular category $\Ab$ and the description of regular epimorphisms below.

  - property: coregular
    proof: >-
      It suffices to prove that regular monomorphisms (which are classified below) are stable under pushouts. Let $i : A \to B$ be a regular monomorphism in $\TorsFreeAb$, i.e. $i$ is injective and its $\Ab$-cokernel $B/i(A)$ is torsion-free, and let $f : B \to C$ be any morphism in $\TorsFreeAb$. Their $\Ab$-pushout is
      $$P = (B \times C)/\{(i(a),-f(a)): a \in A\}.$$
      It is torsion-free: If $n \in \IZ \setminus \{0\}$ and $n (b,c) = (i(a),-f(a))$, there is some $a' \in A$ with $b = i(a')$ since $B/i(A)$ is torsion-free. It follows $n a' = a$, and then $c = -f(a')$ since $C$ is torsion-free. Thus, $(b,c) = (i(a'),-f(a'))$, which proves our claim. Therefore, $P$ is also the pushout in $\TorsFreeAb$. The homomorphism $j : C \to P$, $j(c) = [0,c]$ is injective (since <a href="/category/Ab">$\Ab$</a> is coregular, but a direct proof is also easy), and by the universal property of $P$ its $\Ab$-cokernel is isomorphic to the $\Ab$-cokernel of $i$, which is torsion-free.

  - property: extremal cogenerating set
    proof: >-
      The additive group $\IQ$ is a cogenerator since every torsion-free abelian group $A$ embeds into $A \otimes \IQ$, which is a vector space over $\IQ$, and by linear algebra $K$ is a cogenerator in the category of vector spaces over $K$.

      We claim that $S \coloneqq \{\IQ\} \cup \{\IZ_p : p \text{~prime}\}$ is an extremal cogenerating set, where $\IZ_p$ is the additive group of the $p$-adic integers. To establish this, we will show that for any torsion-free group $G$, the canonical morphism $\alpha : G \to \prod_{Q\in S} \prod_{f\in\Hom(G,Q)} Q$ is in fact a regular monomorphism, and therefore an extremal monomorphism. By equivalent condition (4) in the characterization below of regular monomorphisms, this is equivalent to showing $\alpha$ is injective, and whenever we have $x\in G$ and prime $p$ such that $\alpha(x)$ is $p$-divisible in the product, then $x$ is $p$-divisible in $G$. From the above, including $\IQ$ in $S$ is already sufficient to make $\alpha$ a monomorphism, i.e. an injective homomorphism.

      We will prove the second part of this condition by establishing the contrapositive for each prime $p$; thus, suppose we have $x\in G$ which is not $p$-divisible. Let $\{y_i : i \in I\}$ be a subset of $G$ including $x = y_{i_0}$ whose images in $G / pG$ form a basis for this $\IZ / p \IZ$-vector space. We will now prove by induction that for each $n$, $G / p^n G$ is a free $\IZ / p^n \IZ$-module with basis given by the images of $y_i$. The base case $n=1$ is true by assumption. Now for the inductive step from $n$ to $n+1$, for $g \in G$ we can find $a_i \in \IZ$ (all but finitely many equal to zero) such that $g \in \sum_{i\in I} a_i y_i + p^n G$. Since $G$ is torsion-free, there exists a unique $h$ such that $g = \sum_{i\in I} a_i y_i + p^n h$. Now projecting $h$ into $G / pG$, we can find $b_i \in \IZ$ such that $h \in \sum_{i\in I} b_i y_i + pG$. Hence, $g \in \sum_{i\in I} (a_i + p^n b_i) y_i + p^{n+1} G$. The uniqueness of the coefficients up to congruence modulo $p^{n+1}$ follows from the fact that there are unique choices of $a_i$ with $0 \le a_i < p^n$, and then the $b_i$ are unique up to congruence modulo $p$.

      Now for each $n$, let $\varphi_n : G / p^n G \to \IZ / p^n \IZ$ be the coordinate projection at $i_0$. These are compatible in $n$ (since the basis has been chosen uniformly), hence yield a homomorphism
      $$\varphi : G \to \lim_n (G / p^n G) \to \lim_n (\IZ / p^n \IZ) = \IZ_p.$$
      We have $\varphi(x) = 1$; thus, the $(\IZ_p, \varphi)$ component of $\alpha(x)$ is not $p$-divisible, implying that $\alpha(x)$ itself is not $p$-divisible.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: 'It can be checked directly that $2 : \IZ \to \IZ$ is both a monomorphism and an epimorphism, but no isomorphism (see also <a href="/morphism/multiply-2">here</a>). This also follows from the general classification of mono- and epimorphisms below.'

  - property: CSP
    proof: The canonical homomorphism $\bigoplus_{n \geq 0} \IZ \to \prod_{n \geq 0} \IZ$ is injective, but not an epimorphism, since the quotient $\prod_{n \geq 0} \IZ / \bigoplus_{n \geq 0} \IZ$ is not torsion. In fact, it is torsion-free and non-zero.

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: direct sums
  products:
    description: direct products

special_morphisms:
  isomorphisms:
    description: bijective group homomorphisms
    proof: It is a full subcategory of $\Ab$, for which we know that isomorphisms are bijective homomorphisms.
  monomorphisms:
    description: injective group homomorphisms
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the group $\IZ$), hence preserves monomorphisms.
  epimorphisms:
    description: 'homomorphisms $f : A \to B$ such that $B/f(A)$ is a torsion group'
    proof: The homomorphism $f$ is an epimorphism iff its cokernel in $\TorsFreeAb$ is trivial. As with all types of colimits, the cokernel is the torsion-free reflection of the cokernel in $\Ab$, which is $B/f(A)$. This is trivial iff $B/f(A)$ is torsion.
  regular monomorphisms:
    description: 'For a homomorphism $f : A \to B$ the following are equivalent: (1) $f$ is a regular monomorphism. (2) $f$ is injective and $B/f(A)$ is torsion-free, i.e., $f$ is the inclusion of a <i>saturated subgroup</i>. (3) $f$ is injective and whenever we have $n \in \IZ \setminus \{0\}$ and $a \in A$ such that $f(a)$ is $n$-divisible in $B$, then $a$ is $n$-divisible in $A$. (4) $f$ is injective and whenever we have $p$ prime and $a\in A$ such that $f(a)$ is $p$-divisible in $B$, then $a$ is $p$-divisible in $A$.'
    proof: >-
      (1) implies (2): If $f : A \to B$ is the kernel of $g : B \to C$ in $\TorsFreeAb$, it is also the kernel of $f$ in $\Ab$, so we know that $f$ is injective with $f(A) = \{b \in B : g(b) = 0\}$. If $n \in \IZ \setminus \{0\}$ and $b\in B$ satisfy $g(n b) = 0$, then also $g(b)=0$ since $C$ is torsion-free. This shows that $B/f(A)$ is torsion-free.

      (2) implies (1): If $f$ is injective and $B/f(A)$ is torsion-free, then $f$ is the kernel of the natural homomorphism $B \to B/f(A)$.

      (2) implies (3): If $f(a)$ is $n$-divisible, say $f(a) = nb$. Then $n[b] = 0$ for $[b] \in B/f(A)$, so $[b] = 0$. This implies $b \in f(A)$; say $f(a') = b$. Then $f(na') = nb = f(a)$, so by injectivity of $f$, we get $a = na'$.

      (3) implies (2): Suppose we have $n \in \IZ \setminus \{0\}$ and $b \in B$ such that letting $[b] \in B/f(A)$ be the image, $n[b] = 0$. That implies $nb \in f(A)$; say $nb = f(a)$ for $a \in A$. Then $f(a)$ is $n$-divisible, so $a$ is $n$-divisible; say $a = n a'$. This gives $n f(a') = f(a) = nb$. Since $B$ is torsion-free, we conclude $f(a') = b$, so $[b] = 0$ in $B/f(A)$.

      (3) implies (4): This is trivial.

      (4) implies (3): It is sufficient to show that the set of $n \in \IZ \setminus \{0\}$ such that $n$-divisibility of $f(a)$ implies $n$-divisibility of $a$ for all $a \in A$ is closed under multiplication: then since this set contains all primes by assumption, and it is easy to see it contains $-1$, it must be all of $\IZ \setminus \{0\}$. Thus, suppose we have $m$ and $n$ in this set, and suppose that $a\in A$ is such that $f(a)$ is $mn$-divisible. Then in particular, $f(a)$ is $n$-divisible, so $a$ is $n$-divisible; say $a = n a'$. Since $B$ is torsion-free, we must have that $f(a')$ is $m$-divisible, so $a'$ is $m$-divisible; say $a' = m a''$. Then $a = mn a''$, showing that $a$ is $mn$-divisible.
  regular epimorphisms:
    description: surjective group homomorphisms
    proof: 'By the construction of the coequalizer in $\TorsFreeAb$ as the torsion-free reflection of the coequalizer in $\Ab$, every regular epimorphism is surjective. Conversely, if $f : A \to B$ is a surjective homomorphism of torsion-free abelian groups, in $\Ab$ it is the coequalizer of the two projections $A \times_B A \rightrightarrows A$, and $A \times_B A$ is also torsion-free. Hence, it is also the coequalizer of these projections in $\TorsFreeAb$.'
