id: FreeAb
name: category of free abelian groups
notation: $\FreeAb$
objects: free abelian groups
morphisms: group homomorphisms
description: This is the full subcategory of $\Ab$ consisting of the <a href="https://ncatlab.org/nlab/show/free+abelian+group">free abelian groups</a>. Since $\IZ$ is a principal ideal domain, these coincide with the <a href="https://ncatlab.org/nlab/show/projective+module">projective</a> $\IZ$-modules, so that $\FreeAb \cong \Proj(\IZ)$.
nlab_link: null
keywords:
  - free modules
  - free Z-modules

tags:
  - algebra

related:
  - Ab
  - TorsFreeAb
  - FreeAb_fg

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\FreeAb \to \Set$ and $\Set$ is locally small.

  - property: additive
    proof: The embedding $\FreeAb \hookrightarrow \Ab$ is closed under (finite) direct sums, and <a href="/category/Ab">$\Ab$</a> is additive.

  - property: coproducts
    proof: This is because free abelian groups are closed under direct sums of abelian groups.

  - property: equalizers
    proof: This follows from the fact that a subgroup of a free abelian group is again free abelian.
    check_redundancy: false

  - property: extremal generator
    proof: The group $\IZ$ is an extremal generator even in <a href="/category/Grp">$\Grp$</a>. Now apply Lemma 10 <a href="/content/subcategories">here</a>.
    references:
      - Grp_extremal_generator

  - property: cogenerator
    proof: It is easy to check that $\IZ$ is a cogenerator for free abelian groups.

  - property: well-powered
    proof: This is clear since the monomorphisms are injective.

  - property: well-copowered
    proof: See <a href="https://math.stackexchange.com/questions/5025660">MSE/5025660</a>.

  - property: coequalizers of kernel pairs
    proof: 'Let $f : A \to B$ be a homomorphism of free abelian groups. The coequalizer of its kernel pair $A \times_B A \rightrightarrows A$ in $\Ab$ is the image $\im(f)$. As a subgroup of $B$, it is also free abelian. Then it is also the coequalizer of the kernel pair in $\FreeAb$.'

  - property: pullback-stable regular epimorphisms
    proof: This is clear since regular epimorphisms coincide with the surjective homomorphisms (see below).

unsatisfied_properties:
  - property: balanced
    proof: 'The homomorphism $2 : \IZ \to \IZ$ is a counterexample.'

  - property: skeletal
    proof: This is trivial.

  - property: countable powers
    proof: First, the inclusion functor $\FreeAb \hookrightarrow \Ab$ is continuous since the forgetful functor $\Ab \to \Set$ is continuous and conservative, while the forgetful functor $\FreeAb \to \Set$ is representable (by $\IZ$) and hence continuous. Thus, if the power $\IZ^{\IN}$ exists in $\FreeAb$, it is isomorphic to the power $\IZ^{\IN}$ in $\Ab$. But it is <a href="https://groupprops.subwiki.org/wiki/Baer-Specker_group_is_not_free_abelian">well-known</a> that $\IZ^{\IN}$ is not free abelian.
    label: FreeAb_continuous_inclusion

  - property: sequential colimits
    proof: See <a href="https://mathoverflow.net/questions/509715">MO/509715</a>.

  - property: ℵ₁-filtered colimits
    proof: It is shown in <a href="https://mathoverflow.net/questions/511426">MO/511426</a> that the $\aleph_1$-filtered diagram of countable subgroups of $\IZ^{\IN}$ does not have a colimit in $\FreeAb$.

  - property: ℵ₁-cofiltered limits
    proof: >-
      We have already seen that the inclusion functor $\FreeAb \hookrightarrow \Ab$ is continuous, so it suffices to construct an $\aleph_1$-cofiltered diagram of free abelian groups whose limit in $\Ab$ is not free abelian. Such a diagram can be obtained from constructions in the literature. In <a href="https://shop.elsevier.com/books/almost-free-modules/eklof/978-0-444-50492-0">Eklof–Mekler</a>, Example VIII.1.1, a ladder system on a stationary set $E$ of countable limit ordinals is used to construct an $\aleph_1$-free abelian group $A$ of cardinality $\aleph_1$, together with a filtration $(A_\nu)_{\nu < \omega_1}$ by countable subgroups and projections $\pi_\nu : A \to A_\nu$ for $\nu \notin E$. This group is not free, since its $\Gamma$-invariant is the class of $E$ (see Section IV.0 there). By Example VIII.1.10 there, after a slight modification of the filtration, the projections satisfy $\pi_\nu \circ \pi_\tau = \pi_\nu$ for all $\nu < \tau$ outside of $E$, so that the groups $A_\nu$ for $\nu \notin E$ together with the restrictions of the projections form the desired diagram. Since the coherence of the projections is only sketched there, we give a self-contained proof for the special case where $E$ consists of all countable limit ordinals, following the construction in Section IV.0 there.

      Let $\Lambda \subseteq \omega_1$ be the set of countable limit ordinals $\delta > 0$. For every $\delta \in \Lambda$, choose a strictly increasing sequence $(\eta_\delta(k))_{k \geq 0}$ of ordinals with supremum $\delta$. Let $V$ be the $\IQ$-vector space with basis $\{x_\nu : \nu < \omega_1\} \cup \{z_\delta : \delta \in \Lambda\}$. For $\delta \in \Lambda$ and $n \geq 0$, we define
      $$\textstyle y_{\delta,n} \coloneqq 2^{-n} \bigl(z_\delta + \sum_{k < n} 2^k x_{\eta_\delta(k)}\bigr) \in V,$$
      so that $y_{\delta,0} = z_\delta$ and $2 y_{\delta,n+1} = y_{\delta,n} + x_{\eta_\delta(n)}$. Let $G \subseteq V$ be the subgroup generated by all $x_\nu$ and all $y_{\delta,n}$. For $\gamma < \omega_1$, let $G_\gamma \subseteq G$ be the subgroup generated by the $x_\nu$ with $\nu < \gamma$ and the $y_{\delta,n}$ with $\delta < \gamma$. These subgroups are countable and form an increasing chain with union $G$, and $G_\delta = \bigcup_{\gamma < \delta} G_\gamma$ for $\delta \in \Lambda$.

      <strong>Claim 1.</strong> Each $G_\gamma$ is free abelian. To see this, enumerate the countable set $\Lambda \cap \gamma$ as $\delta_0, \delta_1, \dotsc$ (finite or infinite) and write $\eta_i \coloneqq \eta_{\delta_i}$. For $i \neq j$, the images of the sequences $\eta_i$ and $\eta_j$ have finite intersection: if, say, $\delta_j < \delta_i$, then only finitely many $\eta_i(k)$ are smaller than $\delta_j$. Hence, we may choose $N_i \geq 0$ such that for all $k \geq N_i$ the ordinal $\eta_i(k)$ does not lie in the image of any $\eta_j$ with $j < i$. In particular, the sets $T_i \coloneqq \{\eta_i(k) : k \geq N_i\}$ are pairwise disjoint. We claim that $G_\gamma$ is free with basis
      $$\textstyle B \coloneqq \{x_\nu : \nu < \gamma, \, \nu \notin \bigcup_i T_i\} \cup \{y_{\delta_i,n} : n \geq N_i\}.$$
      The subgroup generated by $B$ contains $x_{\eta_i(k)} = 2 y_{\delta_i,k+1} - y_{\delta_i,k}$ for $k \geq N_i$, hence all $x_\nu$ with $\nu < \gamma$, and then, by downward induction on $n$, also $y_{\delta_i,n} = 2 y_{\delta_i,n+1} - x_{\eta_i(n)}$ for $n < N_i$. So $B$ generates $G_\gamma$. For the linear independence, consider a relation
      $$\textstyle \sum_\nu a_\nu x_\nu + \sum_{i,n} b_{i,n} y_{\delta_i,n} = 0$$
      with finitely many non-zero integer coefficients, where $\nu$ and $(i,n)$ range over the indices occurring in $B$. Assume that some $b_{i,n}$ is non-zero. Let $i$ be maximal such that $b_{i,n} \neq 0$ for some $n$, and let $M$ be maximal with $b_{i,M} \neq 0$. If $M = N_i$, then the $z_{\delta_i}$-coordinate of the left-hand side is $2^{-M} b_{i,M} \neq 0$, since $z_{\delta_i}$ occurs only in the $y_{\delta_i,n}$. If $M > N_i$, then $\xi \coloneqq \eta_i(M-1)$ lies in $T_i$, and we consider the $x_\xi$-coordinate of the left-hand side. Now, $x_\xi$ does not occur in the first sum because $\xi \in T_i$, it does not occur in $y_{\delta_j,n}$ for $j < i$ because $\xi$ is not in the image of $\eta_j$, we have $b_{j,n} = 0$ for $j > i$, and $x_\xi$ occurs in $y_{\delta_i,n}$ only for $n \geq M$, with coefficient $2^{M-1-n}$, and $b_{i,n} = 0$ for $n > M$ by the choice of $M$. Hence, the $x_\xi$-coordinate is $b_{i,M}/2 \neq 0$. Both cases contradict the relation. Therefore, all $b_{i,n}$ vanish, and then all $a_\nu$ vanish as well.

      <strong>Claim 2.</strong> For every $\alpha < \omega_1$, there is a retraction $p_\alpha : G \to G_{\alpha+1}$ of the inclusion $G_{\alpha+1} \hookrightarrow G$ such that $p_\alpha|_{G_{\beta+1}} \circ p_\beta = p_\alpha$ for all $\alpha \leq \beta$. To see this, let $P_\alpha : V \to V$ be the linear map defined by $P_\alpha(x_\nu) \coloneqq x_\nu$ for $\nu \leq \alpha$, $P_\alpha(x_\nu) \coloneqq 0$ for $\nu > \alpha$, $P_\alpha(z_\delta) \coloneqq z_\delta$ for $\delta \leq \alpha$, and
      $$\textstyle P_\alpha(z_\delta) \coloneqq -\sum_{k \,:\, \eta_\delta(k) \leq \alpha} 2^k x_{\eta_\delta(k)} \quad \text{for } \delta > \alpha.$$
      The sum is finite since the supremum of the $\eta_\delta(k)$ is $\delta > \alpha$. We first show that $P_\alpha$ fixes every element of $G_{\alpha+1}$. It suffices to check this on the generators of $G_{\alpha+1}$. For $\nu \leq \alpha$, we have $P_\alpha(x_\nu) = x_\nu$ by definition. For $\delta \in \Lambda$ with $\delta \leq \alpha$, we have $P_\alpha(z_\delta) = z_\delta$, and $\eta_\delta(k) < \delta \leq \alpha$ implies $P_\alpha(x_{\eta_\delta(k)}) = x_{\eta_\delta(k)}$ for all $k$, so that
      $$\textstyle P_\alpha(y_{\delta,n}) = 2^{-n} \bigl(P_\alpha(z_\delta) + \sum_{k < n} 2^k P_\alpha(x_{\eta_\delta(k)})\bigr) = 2^{-n} \bigl(z_\delta + \sum_{k < n} 2^k x_{\eta_\delta(k)}\bigr) = y_{\delta,n}.$$
      Next, we show that $P_\alpha$ maps $G$ into $G_{\alpha+1}$. Again, it suffices to check this on the generators of $G$. The generators of $G_{\alpha+1}$ are fixed by $P_\alpha$, and $P_\alpha(x_\nu) = 0$ for $\nu > \alpha$. It remains to consider $y_{\delta,n}$ with $\delta > \alpha$. Here, we have $P_\alpha(x_{\eta_\delta(k)}) = x_{\eta_\delta(k)}$ if $\eta_\delta(k) \leq \alpha$ and $P_\alpha(x_{\eta_\delta(k)}) = 0$ otherwise, and therefore
      $$\begin{align*}
      P_\alpha(y_{\delta,n}) & = \textstyle 2^{-n} \bigl(P_\alpha(z_\delta) + \sum_{k < n} 2^k P_\alpha(x_{\eta_\delta(k)})\bigr) \\
      & = \textstyle 2^{-n} \bigl(-\sum_{k \,:\, \eta_\delta(k) \leq \alpha} 2^k x_{\eta_\delta(k)} + \sum_{k < n \,:\, \eta_\delta(k) \leq \alpha} 2^k x_{\eta_\delta(k)}\bigr) \\
      & = \textstyle -\sum_{k \geq n \,:\, \eta_\delta(k) \leq \alpha} 2^{k-n} x_{\eta_\delta(k)} \in G_{\alpha+1}.
      \end{align*}$$
      Thus, $P_\alpha$ restricts to a homomorphism $p_\alpha : G \to G_{\alpha+1}$, and $p_\alpha(g) = g$ for all $g \in G_{\alpha+1}$. That is, $p_\alpha$ is a retraction of the inclusion $G_{\alpha+1} \hookrightarrow G$. Now let $\alpha \leq \beta$. We show that $P_\alpha \circ P_\beta = P_\alpha$ by checking it on the basis of $V$. For $\nu \leq \beta$, we have $P_\beta(x_\nu) = x_\nu$, hence $P_\alpha(P_\beta(x_\nu)) = P_\alpha(x_\nu)$. For $\nu > \beta$, we have $P_\beta(x_\nu) = 0$, hence $P_\alpha(P_\beta(x_\nu)) = 0$, and also $P_\alpha(x_\nu) = 0$ since $\nu > \beta \geq \alpha$. For $\delta \leq \beta$, we have $P_\beta(z_\delta) = z_\delta$, hence $P_\alpha(P_\beta(z_\delta)) = P_\alpha(z_\delta)$. Finally, let $\delta > \beta$, so that also $\delta > \alpha$. For every $k$ with $\eta_\delta(k) \leq \beta$, we have $P_\alpha(x_{\eta_\delta(k)}) = x_{\eta_\delta(k)}$ if $\eta_\delta(k) \leq \alpha$ and $P_\alpha(x_{\eta_\delta(k)}) = 0$ otherwise. Since $\alpha \leq \beta$, every $k$ with $\eta_\delta(k) \leq \alpha$ also satisfies $\eta_\delta(k) \leq \beta$. Therefore,
      $$\textstyle P_\alpha(P_\beta(z_\delta)) = -\sum_{k \,:\, \eta_\delta(k) \leq \beta} 2^k P_\alpha(x_{\eta_\delta(k)}) = -\sum_{k \,:\, \eta_\delta(k) \leq \alpha} 2^k x_{\eta_\delta(k)} = P_\alpha(z_\delta).$$
      Restricting to $G$, we get $p_\alpha|_{G_{\beta+1}} \circ p_\beta = p_\alpha$.

      <strong>Claim 3.</strong> $G$ is not free abelian. Assume that $G$ has a basis $E$. For every $g \in G$, let $\supp(g) \subseteq E$ be the finite set of basis elements occurring in the unique representation of $g$ as a linear combination of elements of $E$. Moreover, for every $e \in E$, choose some $\gamma(e) < \omega_1$ with $e \in G_{\gamma(e)}$, which is possible since $G = \bigcup_{\gamma < \omega_1} G_\gamma$. We define countable ordinals $\gamma_0 < \gamma_1 < \cdots$ recursively. Let $\gamma_0 \coloneqq 0$. If $\gamma_m$ has been defined, the set
      $$\textstyle E_m \coloneqq \bigcup_{g \in G_{\gamma_m}} \supp(g) \subseteq E$$
      is countable, since $G_{\gamma_m}$ is countable and each $\supp(g)$ is finite. Hence, the ordinal
      $$\textstyle \gamma_{m+1} \coloneqq \sup\bigl(\{\gamma_m + 1\} \cup \{\gamma(e) : e \in E_m\}\bigr)$$
      is countable, as a supremum of countably many countable ordinals. By construction, $\gamma_m < \gamma_{m+1}$, and $E_m \subseteq G_{\gamma_{m+1}}$ since $e \in G_{\gamma(e)} \subseteq G_{\gamma_{m+1}}$ for all $e \in E_m$. Thus, every element of $G_{\gamma_m}$ is a linear combination of elements of $E \cap G_{\gamma_{m+1}}$. The supremum $\delta$ of the strictly increasing sequence $(\gamma_m)_{m \geq 0}$ is a countable limit ordinal with $\delta > 0$, so $\delta \in \Lambda$, and $G_\delta = \bigcup_m G_{\gamma_m}$ is generated by $E \cap G_\delta$. Hence, $G = G_\delta \oplus H$, where $H$ is the free abelian group generated by $E \setminus G_\delta$. Let $q : G \to H$ be the projection. Since $x_{\eta_\delta(k)} \in G_\delta$ for all $k$, we have
      $$\textstyle q(z_\delta) = q\bigl(2^n y_{\delta,n} - \sum_{k < n} 2^k x_{\eta_\delta(k)}\bigr) = 2^n q(y_{\delta,n})$$
      for all $n \geq 0$. Since no non-zero element of the free abelian group $H$ is divisible by all powers of $2$, we get $q(z_\delta) = 0$, that is, $z_\delta \in G_\delta$. But $G_\delta$ is contained in the subspace of $V$ spanned by the $x_\nu$ with $\nu < \delta$ and the $z_\lambda$ with $\lambda < \delta$, which does not contain $z_\delta$. This is a contradiction.

      <strong>Claim 4.</strong> There is an $\aleph_1$-cofiltered diagram $D : \omega_1^{\op} \to \FreeAb$ whose limit $L$ in $\Ab$ is not free abelian. To see this, we define $D$ by $D(\alpha) \coloneqq G_{\alpha+1}$, which is free by Claim 1, and for $\alpha \leq \beta$ we let $D(\beta) \to D(\alpha)$ be the restriction of $p_\alpha$ to $G_{\beta+1}$. This is a functor: $D(\alpha \leq \alpha)$ is the identity of $G_{\alpha+1}$ since $p_\alpha$ is a retraction of the inclusion $G_{\alpha+1} \hookrightarrow G$, and for $\alpha \leq \beta \leq \gamma$ restricting the equation $p_\alpha|_{G_{\beta+1}} \circ p_\beta = p_\alpha$ from Claim 2 to $G_{\gamma+1}$ gives $D(\alpha \leq \beta) \circ D(\beta \leq \gamma) = D(\alpha \leq \gamma)$. Let $L$ be the limit of $D$ in $\Ab$, with limit projections $\pi_\alpha : L \to D(\alpha)$. The homomorphisms $p_\alpha : G \to D(\alpha)$ form a cone over $D$, since $D(\alpha \leq \beta) \circ p_\beta = p_\alpha|_{G_{\beta+1}} \circ p_\beta = p_\alpha$ for $\alpha \leq \beta$ by Claim 2. Hence, there is a unique homomorphism $\varphi : G \to L$ with $\pi_\alpha \circ \varphi = p_\alpha$ for all $\alpha < \omega_1$. It is injective: Let $g \in G$ with $\varphi(g) = 0$. Since $G = \bigcup_{\gamma < \omega_1} G_\gamma$, there is some $\alpha < \omega_1$ with $g \in G_\alpha \subseteq G_{\alpha+1}$. Since $p_\alpha$ is a retraction of the inclusion $G_{\alpha+1} \hookrightarrow G$, we get $g = p_\alpha(g) = \pi_\alpha(\varphi(g)) = \pi_\alpha(0) = 0$. Since subgroups of free abelian groups are free, Claim 3 implies that $L$ is not free abelian.
    references:
      - FreeAb_continuous_inclusion

  - property: coaccessible
    proof: >-
      Assume that $\FreeAb$ is $\kappa$-coaccessible for a regular cardinal $\kappa$. In particular, every free abelian group is a limit of $\kappa$-copresentable free abelian groups. We claim that every $\kappa$-copresentable free abelian group is trivial. Since the forgetful functor $\FreeAb \to \Set$ is representable (by $\IZ$), it preserves limits, so that every limit of trivial groups is trivial. This is a contradiction, since $\IZ$ is not trivial.

      To prove the claim, let $Q$ be a $\kappa$-copresentable free abelian group. Let $(e_\beta)_{\beta < \kappa}$ be the standard basis of $\bigoplus_{\beta < \kappa} \IZ$. For $\alpha < \kappa$, let $D(\alpha)$ be the subgroup generated by all $e_\beta$ with $\alpha \leq \beta < \kappa$, which is free abelian. Since $\kappa$ is regular, $(\kappa,\leq)$ is $\kappa$-filtered, so that the inclusions $D(\alpha') \subseteq D(\alpha)$ for $\alpha \leq \alpha'$ form a $\kappa$-cofiltered diagram $D : (\kappa,\leq)^{\op} \to \FreeAb$. Its limit in $\Ab$ is the intersection $\bigcap_{\alpha < \kappa} D(\alpha) = 0$: every non-zero element $x \in D(0)$ has a non-zero coefficient at some $e_\beta$, so that $x \notin D(\beta + 1)$. Since $\FreeAb$ is a full subcategory of $\Ab$ and $0$ is free abelian, $0$ is also the limit of $D$ in $\FreeAb$.

      Since $Q$ is $\kappa$-copresentable, we have
      $$\textstyle \colim_{\alpha < \kappa} \Hom(D(\alpha),Q) \cong \Hom(0,Q) = 0.$$
      For $q \in Q$, let $f_q : D(0) \to Q$ be the homomorphism with $f_q(e_\beta) = q$ for all $\beta < \kappa$. The homomorphism $Q \to \colim_{\alpha < \kappa} \Hom(D(\alpha),Q)$ mapping $q$ to the class of $f_q$ is injective: since the colimit is filtered, if the class of $f_q$ is zero, then the restriction of $f_q$ to some $D(\alpha)$ is zero, so that $q = f_q(e_\alpha) = 0$. Hence, $Q = 0$.

undecidable_properties:
  - property: accessible
    proof: The question whether this category is accessible is undecidable in ZFC. See <a href="https://math.stackexchange.com/questions/720885">MSE/720885</a>.

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: direct sums
  products:
    description: '[finite case] direct sums'

special_morphisms:
  isomorphisms:
    description: bijective homomorphisms
    proof: It is a full subcategory of $\Ab$, for which we know that isomorphisms are bijective homomorphisms.
  monomorphisms:
    description: injective homomorphisms
    proof: The non-trivial direction follows from the observation that the forgetful functor to $\Set$ is representable (by $\IZ$), hence preserves monomorphisms.
  epimorphisms:
    description: 'homomorphisms $f : A \to B$ with the property that $f(A)$ is not contained in a proper direct summand of $B$'
    proof: 'Let $f : A \to B$ be a morphism of free abelian groups such that $f(A)$ is not contained in a proper direct summand of $B$. Then $f$ is an epimorphism: If $t : B \to C$ is a morphism with $t \circ f = 0$, we want to show $t = 0$. Since the image of $t$ is free abelian (as a subgroup of $C$), we may assume that $t$ is surjective. Since $C$ is free, $t$ splits, so by the splitting lemma its kernel $K$ is a direct summand of $B$. It contains $f(A)$ because of $t \circ f = 0$. By assumption, $K = B$, so that $t = 0$. Conversely, assume that $f : A \to B$ is an epimorphism, and that $f(A)$ is contained in a direct summand $K$ of $B$. Let $L$ be a complement of $K$ in $B$ (which is free abelian) and let $p : B \to L$ be the projection. Then $p \circ f = 0$, so $p = 0$. But then $L = 0$, which means $K = B$.'
  regular monomorphisms:
    description: 'injective homomorphisms $f : A \to B$ with the property that $B/f(A)$ is free abelian (which are automatically split monomorphisms)'
    proof: 'If $f$ is injective and $B/f(A)$ is free abelian, then $f$ is a kernel of the canonical projection $B \to B/f(A)$. Since $B/f(A)$ is free abelian, the sequence $0 \to A \to B \to B/f(A) \to 0$ splits, so by the splitting lemma, $f$ is a split monomorphism. Conversely, if $f$ is a kernel of some homomorphism $g : B \to C$ of free abelian groups, by applying $\Hom(\IZ,-)$ we see that it is also the kernel in $\Ab$. In particular, $f$ is injective, and the quotient $B/f(A)$ embeds into $C$ and is therefore free abelian.'
  regular epimorphisms:
    description: surjective homomorphisms (which are automatically split epimorphisms)
    proof: 'If $f : A \to B$ is a surjective homomorphism in $\FreeAb$ with kernel $K$, then $f$ is the cokernel of $K \hookrightarrow A$ in $\Ab$. Since $K$ is free abelian, this remains true in $\FreeAb$. Moreover, $f$ splits since $B$ is projective. Conversely, assume that $f : A \to B$ is a regular epimorphism in $\FreeAb$ and hence the cokernel of some homomorphism $g : C \to A$ in $\FreeAb$. Consider the image factorization $A \to \im(f) \hookrightarrow B$ in $\Ab$. Here, $\im(f)$ is also free abelian. Since $\im(f) \hookrightarrow B$ is a monomorphism in $\FreeAb$ and $f$ is a regular, hence extremal, epimorphism, $\im(f) \hookrightarrow B$ is an isomorphism. Thus, $f$ is surjective.'
