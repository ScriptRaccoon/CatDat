id: Ab_fg
name: category of finitely generated abelian groups
notation: $\Ab_{\fg}$
objects: finitely generated abelian groups
morphisms: group homomorphisms
description: This is the full subcategory of $\Ab$ that consists of the finitely generated abelian groups.
nlab_link: https://ncatlab.org/nlab/show/finitely+generated+module
keywords:
  - finitely generated Z-modules

tags:
  - algebra

related:
  - Ab
  - FinAb
  - Grp_fg
  - FinVect_c
  - FreeAb_fg

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Ab_{\fg} \to \Set$ and $\Set$ is locally small.

  - property: abelian
    proof: This follows from the corresponding fact for abelian groups and from the fact that subgroups of finitely generated abelian groups are also finitely generated.

  - property: extremal generator
    proof: The group $\IZ$ is an extremal generator since it represents the forgetful functor to $\Set$ which is faithful and conservative.
    label: Ab_fg_extremal_generator

  - property: essentially countable
    proof: Every finitely generated abelian group is isomorphic to a group of the form $\IZ^n / U$, where $n \in \IN$ and $U$ is a subgroup of $\IZ^n$. Since $\IZ^n$ is Noetherian as a $\IZ$-module, $U$ is finitely generated, hence the category $\Ab_\fg$ has only countably many objects up to isomorphism. Furthermore, for any objects $A \cong \IZ^n / U$ and $B \cong \IZ^m / T$, the hom-set $\Hom(A,B)$ is countable. Indeed, precomposition with the quotient map yields an injection $\Hom(A,B) \hookrightarrow \Hom(\IZ^n, B) \cong B^n$, and $B^n$ is countable.

  - property: ℵ₁-accessible
    proof: The inclusion $\Ab_{\fg} \hookrightarrow \Ab$ is closed under $\aleph_1$-filtered colimits by <a href="https://mathoverflow.net/questions/400763/">MO/400763</a>. In particular, $\Ab_{\fg}$ has $\aleph_1$-filtered colimits. Since $\Ab_{\fg}$ is essentially small, there is a set $G$ such that every f.g. abelian group is isomorphic to one in $G$. So trivially it is also an $\aleph_1$-filtered colimit of such objects (take the constant diagram). Finally, every object of $\Ab_{\fg} = \Ab_{\fp}$ is finitely presentable in $\Ab$, a fortiori $\aleph_1$-presentable, and hence also $\aleph_1$-presentable in $\Ab_{\fg}$.
    label: Ab_fg_aleph1-accessible

  - property: ℵ₁-coaccessible
    proof: >-
      We will show that the inclusion $\Ab_\fg \hookrightarrow \Ab$ is closed under $\aleph_1$-cofiltered limits and that every object of $\Ab_\fg$ is $\aleph_1$-copresentable. This suffices: since $\Ab_\fg$ is essentially small, there is a set $G$ such that every finitely generated abelian group is isomorphic to one in $G$, and then every object is trivially an $\aleph_1$-cofiltered limit of objects in $G$ (take the constant diagram).

      Let $D : \I \to \Ab_\fg$ be an $\aleph_1$-cofiltered diagram, and let $(p_i : L \to D(i))_{i \in \I}$ be a limit cone of $D$ in $\Ab$. Everything follows from these two facts, which we prove at the end:

      <ol>
      <li>For every $i \in \I$ there is a morphism $i_\infty \to i$ such that $p_i(L) = \im(D(i_\infty \to i))$.</li>
      <li>There is some $j \in \I$ for which $p_j : L \to D(j)$ is injective.</li>
      </ol>

      By (2), $L$ is isomorphic to a subgroup of the finitely generated abelian group $D(j)$, and hence is finitely generated. Since $\Ab_\fg$ is a full subcategory of $\Ab$, it follows that $(p_i)_{i \in \I}$ is also a limit cone in $\Ab_\fg$.

      Now let $A$ be a finitely generated abelian group. We need to show that the canonical homomorphism
      $$\Phi : \colim_{i \in \I^{\op}} \Hom(D(i),A) \to \Hom(L,A), \quad [g : D(i) \to A] \mapsto g \circ p_i$$
      is bijective. Since $\I^{\op}$ is filtered, the colimit may be computed in $\Set$ as well as in $\Ab$.

      Injectivity: Since $\Phi$ is a homomorphism, it suffices to show that its kernel is trivial. Let $g : D(i) \to A$ be a homomorphism with $g \circ p_i = 0$. By (1), $g$ vanishes on $\im(D(i_\infty \to i))$, i.e. $g \circ D(i_\infty \to i) = 0$. Hence $[g] = 0$.

      Surjectivity: Let $f : L \to A$ be a homomorphism. By (2), there is some $j \in \I$ such that $p_j$ is injective. Let $k \coloneqq j_\infty$ and $K \coloneqq \ker(D(k \to j)) \subseteq D(k)$. Then $p_k$ is injective as well, since $p_j = D(k \to j) \circ p_k$. We claim that
      $$D(k) = p_k(L) \oplus K.$$
      Let $x \in D(k)$. By (1), we have $D(k \to j)(x) \in p_j(L)$, so there is some $y \in L$ with
      $$D(k \to j)(x) = p_j(y) = D(k \to j)(p_k(y)).$$
      Hence $x - p_k(y) \in K$, showing $x \in p_k(L) + K$. If $y \in L$ satisfies $p_k(y) \in K$, then $p_j(y) = 0$, so $y = 0$ since $p_j$ is injective. This proves the claim. Since $p_k$ corestricts to an isomorphism $L \to p_k(L)$, the claim yields a homomorphism $r : D(k) \to L$ with $r \circ p_k = \id_L$. Then $g \coloneqq f \circ r : D(k) \to A$ satisfies
      $$\Phi([g]) = f \circ r \circ p_k = f.$$

      It remains to prove (1) and (2). We proceed in three steps.

      <strong>Step 1: minimal images.</strong> For $i \in \I$ let
      $$S_i \coloneqq \{\im(D(j \to i)) : j \to i\}.$$
      This is a set of subgroups of $D(i)$. Since every subgroup of $D(i)$ is finitely generated, $D(i)$ has only countably many subgroups. Hence $S_i$ is countable as well. For every $H \in S_i$, choose a morphism $i_H \to i$ such that $H = \im(D(i_H \to i))$. Since $\I$ is $\aleph_1$-cofiltered, the diagram consisting of the morphisms $i_H \to i$ admits a cone. That is, there exists a morphism $i_\infty \to i$ together with morphisms $i_\infty \to i_H$ over $i$ for every $H \in S_i$. Now consider the subgroup
      $$M(i) \coloneqq \im(D(i_\infty \to i)) \subseteq D(i).$$
      It belongs to $S_i$, but it is also contained in every $H \in S_i$, since $i_\infty \to i$ factors through $i_H \to i$. Hence $M(i)$ is the minimal element of $S_i$ with respect to inclusion.

      For every morphism $k \to i_\infty$ we have
      $$M(i) = \im(D(k \to i)),$$
      since the inclusion $\supseteq$ is obvious, while $\subseteq$ follows from the minimality just established.

      Now let $u : i \to j$ be a morphism. We claim that $D(u)$ maps $M(i)$ onto $M(j)$. Since $\I$ is cofiltered, we can find a commutative diagram
      $$\begin{CD}
      k @>>> i_\infty @>>> i \\
      @V{=}VV @. @VV{u}V \\
      k @>>> j_\infty @>>> j.
      \end{CD}$$
      Hence
      $$M(j) = \im(D(k \to j)) = D(u)(\im(D(k \to i))) = D(u)(M(i)).$$
      We denote the surjective homomorphism $M(i) \to M(j)$ induced by $D(u)$ by $M(u)$. Finally, if $(q_i : X \to D(i))_{i \in \I}$ is a cone over $D$, then $q_i = D(i_\infty \to i) \circ q_{i_\infty}$ shows $q_i(X) \subseteq M(i)$. Hence cones over $D$ correspond to cones over $M : \I \to \Ab$. In particular, $p_i(L) \subseteq M(i)$, and $L$ together with the corestrictions $L \to M(i)$ of the $p_i$ is a limit of $M$.

      <strong>Step 2: maximal rank and torsion.</strong> For $i \in \I$ let $T(i) \subseteq M(i)$ denote the torsion subgroup, which is finite, and let $F(i) \coloneqq M(i)/T(i)$, which is a finitely generated free abelian group. For a morphism $u : i \to j$ consider the commutative diagram with exact rows:
      $$\begin{CD}
      0 @>>> T(i) @>>> M(i) @>>> F(i) @>>> 0 \\
      @. @VVV @VV{M(u)}V @VVV @. \\
      0 @>>> T(j) @>>> M(j) @>>> F(j) @>>> 0
      \end{CD}$$
      Since $M(u)$ is surjective, so is $F(i) \to F(j)$, and hence $\rank(M(i)) \geq \rank(M(j))$. If moreover $\rank(M(i)) = \rank(M(j))$, then $F(i) \to F(j)$ is a surjective homomorphism between finitely generated free abelian groups of the same rank, hence an isomorphism, and the snake lemma shows that $T(i) \to T(j)$ is surjective, so that $\card(T(i)) \geq \card(T(j))$.

      The set $\{\rank(M(i)) : i \in \I\}$ is bounded. Indeed, otherwise for every $n \in \IN$ we could choose an object $i_n \in \I$ such that $\rank(M(i_n)) \geq n$. Choosing a cone $(k \to i_n)_{n \in \IN}$, we would obtain $\rank(M(k)) \geq n$ for all $n$, which is impossible since $M(k)$ is finitely generated. Therefore the natural number
      $$R \coloneqq \max\{\rank(M(i)) : i \in \I\}$$
      is well-defined. Similarly, the set $\{\card(T(i)) : i \in \I, \, \rank(M(i)) = R\}$ is bounded: otherwise we could choose objects $i_n$ with $\rank(M(i_n)) = R$ and $\card(T(i_n)) \geq n$, and a cone $(k \to i_n)_{n \in \IN}$. Then $\rank(M(k)) = R$ by maximality of $R$, hence $\card(T(k)) \geq n$ for all $n$, which is impossible since $T(k)$ is finite. Therefore the natural number
      $$N \coloneqq \max\{\card(T(i)) : i \in \I, \, \rank(M(i)) = R\}$$
      is well-defined. Let $\J \subseteq \I$ be the full subcategory of those objects $i \in \I$ with $\rank(M(i)) = R$ and $\card(T(i)) = N$. It is non-empty. We claim:

      $(\ast)$ If $u : k \to j$ is a morphism with $j \in \J$, then $k \in \J$ and $M(u) : M(k) \to M(j)$ is an isomorphism.

      Indeed, we have $\rank(M(k)) \geq \rank(M(j)) = R$, so $\rank(M(k)) = R$ by maximality of $R$. Then $\card(T(k)) \geq \card(T(j)) = N$, so $\card(T(k)) = N$ by maximality of $N$. Thus $k \in \J$. Moreover, $T(k) \to T(j)$ is a surjective map between finite sets of the same cardinality, hence bijective. Since also $F(k) \to F(j)$ is bijective, the snake lemma shows that $M(u)$ is bijective.

      <strong>Step 3: proof of (1) and (2).</strong> Let $j \in \J$. We claim that $p_j$ corestricts to an isomorphism $L \to M(j)$. This proves (2), and also (1) for $i = j$. Since $\I$ is cofiltered, it is cosifted, and by $(\ast)$, the morphism $M(u)$ is an isomorphism for every morphism $u : k \to j$. Hence, by the dual of Lemma 1 <a href="/content/sifted-colimits-in-groupoids">here</a>, $M(j)$ is a limit of $M : \I \to \Ab$, where the projection to $M(j)$ is the identity. By Step 1, $L$ together with the corestrictions $L \to M(i)$ of the $p_i$ is also a limit of $M$. Thus, the comparison isomorphism between the two limits is the corestriction of $p_j$ to $L \to M(j)$.

      To prove (1) in general, let $i \in \I$. Choose some $j_0 \in \J$. Since $\I$ is cofiltered, there are morphisms $j \to j_0$ and $j \to i$, and $j \in \J$ by $(\ast)$. Since $M(j \to i)$ is surjective by Step 1, we conclude
      $$M(i) = D(j \to i)(M(j)) = D(j \to i)(p_j(L)) = p_i(L).$$

unsatisfied_properties:
  - property: small
    proof: Even the collection of trivial groups is not small.

  - property: locally finite
    proof: The group $\Hom(\IZ,\IZ) \cong \IZ$ is not finite.

  - property: skeletal
    proof: This is trivial.

  - property: countable
    proof: This is trivial.

  - property: split abelian
    proof: The short exact sequence $0 \xrightarrow{} \IZ \xrightarrow{p} \IZ \xrightarrow{} \IZ/p \xrightarrow{} 0$ does not split.

  - property: cogenerator
    proof: Let $Q$ be a finitely generated abelian group. By their well-known classification, we have $Q = F \oplus T$ for a free abelian group $F$ and a finite abelian group $T$. Let $p$ be a prime number which does not divide the order of $T$. Then $\Hom(\IZ/p, Q) = 0$, but $\IZ/p \neq 0$. Therefore, $Q$ is not a cogenerator.

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: '[finite case] direct sums'
  products:
    description: '[finite case] direct products'

special_morphisms:
  isomorphism:
    description: bijective homomorphisms
    proof: It is a full subcategory of $\Ab$, for which we know that isomorphisms are bijective homomorphisms.
  monomorphism:
    description: injective homomorphisms
    proof: 'Let $f : A \to B$ be a monomorphism of finitely generated abelian groups. Let $a \in A$ be in the kernel of $f$. Then we may view $a$ as a morphism $a : \IZ \to A$ with $f \circ a = 0$, and $\IZ$ is finitely generated. Hence, $a = 0$.'
  epimorphism:
    description: surjective homomorphisms
    proof: Use the same proof as for abelian groups.
