id: Quiv_fc
name: category of quivers with finite components
notation: $\Quiv_{\fc}$
objects: quivers whose connected components are finite
morphisms: morphisms of quivers
description: Here, zigzags are allowed in the definition of a connected quiver (just like in the definition of a connected category). Thus, the objects are precisely the coproducts of finite quivers. We have included this category solely as an example of a category with a subobject classifier that does not have coequalizers. Note that $\Quiv_{\fc}$ is the <a href="https://ncatlab.org/nlab/show/free+coproduct+completion" target="_blank">free coproduct completion</a> of the category of finite connected quivers.
nlab_link: null

tags:
  - graph theory

related:
  - Quiv
  - Euclid_coprod

satisfied_properties:
  - property: locally small
    proof: It is a full subcategory of <a href="/category/Quiv">$\Quiv$</a>, which is locally small.

  - property: finite products
    proof: The category <a href="/category/Quiv">$\Quiv$</a> has finite products. The full subcategory $\Quiv_{\fc} \subseteq \Quiv$ is closed under finite products because every object of $\Quiv_{\fc}$ is a coproduct of finite quivers, $\Quiv$ is infinitary distributive, and finite products of finite quivers are finite.
    check_redundancy: false

  - property: equalizers
    proof: This follows because <a href="/category/Quiv">$\Quiv$</a> has equalizers and $\Quiv_{\fc} \subseteq \Quiv$ is closed under subquivers. Namely, every subquiver of a coproduct of finite quivers decomposes as a coproduct of subquivers of these finite quivers, and a subquiver of a finite quiver is finite.
    check_redundancy: false

  - property: subobject classifier
    proof: >-
      The previous proofs show that $\Quiv_{\fc} \subseteq \Quiv$ is closed under finite limits. The subobject classifier $\Omega$ of <a href="/category/Quiv">$\Quiv$</a> is finite; see <a target="_blank" href="https://ncatlab.org/nlab/show/Quiv">nLab</a> for a detailed description. Hence, $\top : 1 \to \Omega$ is a morphism in $\Quiv_{\fc}$. If $X \hookrightarrow Y$ is a monomorphism in $\Quiv_{\fc}$, it is also a monomorphism in $\Quiv$ since the inclusion functor preserves pullbacks. Hence, there is a unique morphism of quivers $Y \to \Omega$ such that
      $$\begin{CD} X @>>> Y \\ @V{!}VV @VVV \\ 1 @>>> \Omega \end{CD}$$
      is a pullback square in $\Quiv$, i.e. a pullback square in $\Quiv_{\fc}$.

  - property: infinitary extensive
    proof: Since <a href="/category/Quiv">$\Quiv$</a> is infinitary extensive and $\Quiv_{\fc} \subseteq \Quiv$ is closed under coproducts and pullbacks, this follows from Lemma 11 <a href="/content/subcategories">here</a>.

  - property: cokernel pairs
    proof: 'We will show that $\Quiv_{\fc} \subseteq \Quiv$ is closed under cokernel pairs. More generally, let $f : G \to H$ be a morphism of quivers with $H \in \Quiv_{\fc}$. Write $H = \coprod_i H_i$ as a coproduct of finite quivers. Since $\Quiv$ is infinitary extensive, we have $G = \coprod_i f^*(H_i)$, and $f$ decomposes as a coproduct of morphisms $f_i : f^*(H_i) \to H_i$. Then $H \sqcup_G H = \coprod_i (H_i \sqcup_{f^*(H_i)} H_i)$. Each quiver $H_i \sqcup_{f^*(H_i)} H_i$ is finite because it is a quotient of the finite quiver $H_i \sqcup H_i$. Thus, $H \sqcup_G H$ belongs to $\Quiv_{\fc}$.'

  - property: coequalizers of kernel pairs
    proof: 'Let $f : G \to H$ be a morphism in $\Quiv_{\fc}$. In $\Quiv$, the coequalizer of the kernel pair of $f$ is simply the image of $f$. Since $\Quiv_{\fc} \subseteq \Quiv$ is closed under subquivers, this image belongs to $\Quiv_{\fc}$. The universal property of a coequalizer persists in $\Quiv_{\fc}$.'

  - property: extremal cogenerating collection
    proof: >-
      We claim that the "chaotic" quiver $G = (\{a,b\},\{a,b\} \times \{a,b\})$ and the quiver $H = (\{a\},\{\ell,\ell'\})$ with one vertex and two loops form an extremal cogenerating collection. Indeed, $\Hom(-,G)$ is isomorphic to the contravariant functor $(V,E) \mapsto P(V)$, and $\Hom(-,H)$ is isomorphic to the contravariant functor $(V,E) \mapsto P(E)$. The combined functor $(V,E) \mapsto (P(V),P(E))$ is faithful and conservative because the <a href="/functor/power_set_contravariant">contravariant power set functor</a> $P : \Set^{\op} \mapsto \Set$ is faithful and conservative.

      Remark: The same proof works for $\Quiv$.
    label: Quiv_fc_extremal_cogenerators

  - property: well-copowered
    proof: This follows immediately from the description of epimorphisms below.

  - property: epi-regular
    proof: Any epimorphism $f = (f_V,f_E)$ in $\Quiv_{\fc}$ has surjective components $f_V,f_E$ by the classification below. Hence, it is the coequalizer of its kernel pair in $\Quiv$. Since the kernel pair belongs to $\Quiv_{\fc}$, it is also the coequalizer in $\Quiv_{\fc}$.

  - property: ℵ₁-accessible
    proof: >-
      First, we show that $\Quiv_{\fc} \subseteq \Quiv$ is closed under $\aleph_1$-filtered colimits. Let $D : \I \to \Quiv_{\fc}$ be an $\aleph_1$-filtered diagram, and let $C$ be its colimit quiver in $\Quiv$. Thus, the set of vertices is given by $V_C = \colim_{i \in \I} V_{D(i)}$, and the set of edges is given by $E_C = \colim_{i \in \I} E_{D(i)}$. Consider a vertex $v$ of $C$. It has a preimage vertex $v_{i_0}$ in some $D(i_0)$. For each morphism $i_0 \to i$, consider its image $v_i$ in $D(i)$, and let $C(i) \subseteq D(i)$ denote the connected component of $v_i$. Then it is easy to see that the connected component of $v$ is identified with $\colim_{i_0 \to i} C(i)$. Since <a href="/category/FinSet">$\FinSet$</a> is closed under $\aleph_1$-filtered colimits in $\Set$ (the proof is identical to the proof for <a href="/category/Ab_fg">$\Ab_{\fg}$</a> in <a href="https://mathoverflow.net/a/511519" target="_blank">MO/400763</a>), it follows that the collection of finite quivers is closed under $\aleph_1$-filtered colimits in $\Quiv$. Since each $C(i)$ is finite, it follows that the connected component of $v$ is finite, as required.

      Let $S \subseteq \Ob(\Quiv_{\fc})$ be the collection of quivers with countably many components, each of them finite. Note that, up to isomorphism, these constitute a set. (More precisely, there is a set $S' \subseteq S$ such that every object in $S$ is isomorphic to some object in $S'$, so that we may equally work with $S'$.) Each quiver in $S$ has countably many vertices and edges, and hence is $\aleph_1$-presentable in $\Quiv$ (either by a direct argument or by using Corollary 3.13 in <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a>). Since the inclusion $\Quiv_{\fc} \hookrightarrow \Quiv$ preserves $\aleph_1$-filtered colimits, it follows that each quiver in $S$ is also $\aleph_1$-presentable in $\Quiv_{\fc}$.

      Finally, every quiver $G$ in $\Quiv_{\fc}$ can be written as $\coprod_{i \in I} G_i$ with finite quivers $G_i$, and therefore expressed as the $\aleph_1$-filtered colimit of the quivers $\coprod_{i \in C} G_i$ in $S$, where $C$ runs through the countable subsets of $I$.

  - property: ℵ₁-cofiltered limits
    proof: >-
      We show that $\Quiv_{\fc} \subseteq \Quiv$ is closed under $\aleph_1$-cofiltered limits. Let $D : \I \to \Quiv_{\fc}$ be an $\aleph_1$-cofiltered diagram, and let $L$ be its limit in $\Quiv$. Consider a vertex $v \in V_L$, and let $C(v) \subseteq L$ denote its connected component. For each $i \in \I$, let $C(v_i) \subseteq D(i)$ be the connected component of $v_i \in V_{D(i)}$. Each transition map $D(i \to j) : D(i) \to D(j)$ maps $C(v_i)$ into $C(v_j)$. Thus, we can construct the quiver $\lim_{i \in \I} C(v_i)$. It is finite because <a href="/category/FinSet">$\FinSet$</a> is closed under $\aleph_1$-cofiltered limits in $\Set$. Since each projection map $L \to D(i)$ maps $C(v)$ into $C(v_i)$, there is an embedding $C(v) \hookrightarrow \lim_{i \in \I} C(v_i)$. Hence, $C(v)$ is finite.
    references:
      - finset_aleph1-cofiltered-limits

  - property: effective cocongruences
    proof: More generally, let $G \rightrightarrows H$ be a coreflexive corelation in $\Quiv_{\fc}$. Since binary coproducts exist and the inclusion functor $\Quiv_{\fc} \hookrightarrow \Quiv$ preserves epimorphisms, it is a coreflexive corelation in $\Quiv$. Since <a href="/category/Quiv">$\Quiv$</a> is co-Malcev and has effective cocongruences (by <a href=/category-implication/regular_epi-regular_extensive_consequences">this result</a>), the pair $G \rightrightarrows H$ is the cokernel pair of some morphism $E \to G$ in $\Quiv$, namely (since equalizers exist, see <a href="/content/effective-congruence-quotients">here</a>) the equalizer of $G \rightrightarrows H$. Since $G$ belongs to $\Quiv_{\fc}$, also $E$ belongs to $\Quiv_{\fc}$. It follows that $G \rightrightarrows H$ is also the cokernel pair of $E \to G$ in $\Quiv_{\fc}$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: semi-strongly connected
    proof: We can recycle the proof from <a href="/category/Quiv">$\Quiv$</a>, which only uses finite auxiliary quivers.
    references:
      - Quiv_not_semi-strongly_connected

  - property: generator
    proof: We can recycle the proof from <a href="/category/Quiv">$\Quiv$</a>, which only uses finite auxiliary quivers.
    references:
      - Quiv_no_generator

  - property: countable powers
    proof: >-
      First, note that the forgetful functor $\Quiv_{\fc} \to \Set$, $(V,E) \mapsto V$, is represented by the quiver $\bullet$ (one vertex, no edges), and hence preserves limits. Similarly, the forgetful functor $(V,E) \mapsto E$ is represented by the quiver $\bullet \to \bullet$ (two vertices, one edge), and hence also preserves limits. We conclude that the forgetful functor $\Quiv_{\fc} \to \Quiv$ preserves limits. Alternatively, this follows from Lemma 1 <a href="/content/inclusion-functors">here</a>, since $\Quiv_{\fc}$ contains an extremal generating set of $\Quiv$, namely the two quivers mentioned above.

      Now let $G$ be the quiver with vertices $a,b$, one loop $a \to a$, and one edge $a \to b$. If the power $G^{\IN}$ exists in $\Quiv_{\fc}$, it must be the power in $\Quiv$. It has the vertex $(a,a,\dotsc)$, which admits an edge to every sequence of vertices consisting of $a$ and $b$. Thus, its connected component is infinite, which is a contradiction.

  - property: sequential colimits
    proof: >-
      First, note that the inclusion functor $\Quiv_{\fc} \to \Quiv$ preserves colimits. This is because $\Quiv$ is cocomplete, $\Quiv_{\fc}$ contains an extremal cogenerating collection of $\Quiv$ (by our proof that $\Quiv_{\fc}$ has one), and Lemma 1 <a href="/content/inclusion-functors">here</a>. Thus, it suffices to show that $\Quiv_{\fc}$ is not closed under sequential colimits in $\Quiv$.

      Consider the path quiver $P_n$ with $n$ vertices and $n-1$ edges. It is finite, hence belongs to $\Quiv_{\fc}$, and there is a canonical embedding $P_n \hookrightarrow P_{n+1}$. The colimit of this sequence in $\Quiv$ is the path quiver $P_\infty$ with infinitely many vertices. It is connected but not finite, hence does not belong to $\Quiv_{\fc}$.
    label: Quiv_fc_no_sequential_colimits
    references:
      - Quiv_fc_extremal_cogenerators

  - property: quotients of congruences
    proof: Since the category is infinitary extensive and we have just identified a sequence of monomorphisms without a colimit, there is a congruence without a quotient by Lemma 1 <a href="/content/monic_sequential_colimits">here</a>.
    references:
      - Quiv_fc_no_sequential_colimits

  - property: coaccessible
    proof: >-
      The proof is very similar to the proof for <a href="/category/Top">$\Top$</a>. Let $D$ be the quiver with vertices $0,1$ and no edges, and let $I$ be the quiver with vertices $0,1$ and the four edges $i \to j$ for $i,j \in \{0,1\}$. There is a canonical morphism $p : D \to I$. By definition, a quiver $G = (V,E)$ is projective to $p$ if the map
      $$p_* : \Hom(G,D) \to \Hom(G,I)$$
      is surjective. Note that $\Hom(G,I) \cong \Hom(V,\{0,1\})$ and that
      $$\Hom(G,D) \cong \begin{cases}
      \Hom(V,\{0,1\}) & E = \varnothing \\
      \varnothing & E \neq \varnothing.
      \end{cases}$$
      Thus, $G$ is projective to $p$ if and only if $G$ has no edges, i.e. $G$ is discrete. Every discrete quiver belongs to $\Quiv_{\fc}$. This shows that the full subcategory of quivers in $\Quiv_{\fc}$ that are projective to $p$ is equivalent to $\Set$. Since <a href="/category/Set">$\Set$</a> is not coaccessible, it follows from the dual of Prop. 4.7 in <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a> that $\Quiv_{\fc}$ is not coaccessible.
    references:
      - top_not_coaccessible

special_objects:
  initial object:
    description: the quiver with no vertices and hence no edges
  terminal object:
    description: the quiver with one vertex and one loop
  coproducts:
    description: just as in <a href="/category/Quiv">$\Quiv$</a>
  products:
    description: '[finite case] just as in <a href="/category/Quiv">$\Quiv$</a>'

special_morphisms:
  isomorphisms:
    description: morphisms $f = (f_V, f_E)$ such that $f_V$ and $f_E$ are bijective
    proof: This description holds in <a href="/category/Quiv">$\Quiv$</a>.
  monomorphisms:
    description: morphisms $f = (f_V, f_E)$ such that $f_V$ and $f_E$ are injective
    proof: For the non-trivial direction, the construction of finite limits shows that the forgetful functor $\Quiv_{\fc} \to \Quiv$ preserves finite limits and hence preserves monomorphisms. The monomorphisms in $\Quiv$ have the stated description.
  epimorphisms:
    description: morphisms $f = (f_V, f_E)$ such that $f_V$ and $f_E$ are surjective
    proof: >-
      For the non-trivial direction, let $f = (f_V,f_E) : (V,E) \to (V',E')$ be an epimorphism. Consider the "chaotic" quiver $G = (\{a,b\},\{a,b\} \times \{a,b\})$. It is finite, so the map $f^* : \Hom((V',E'),G) \to \Hom((V,E),G)$ is injective. This map identifies with $(f_V)^* : \Hom(V',\{0,1\}) \to \Hom(V,\{0,1\})$. Hence, $f_V$ is surjective. Now consider the quiver $H = (\{a\},\{\ell,\ell'\})$ with one vertex and two loops. It is finite, so the map $f^* : \Hom((V',E'),H) \to \Hom((V,E),H)$ is injective. This map identifies with $(f_E)^* : \Hom(E',\{\ell,\ell'\}) \to \Hom(E,\{\ell,\ell'\})$. Hence, $f_E$ is surjective.
