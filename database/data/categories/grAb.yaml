satisfied_properties: []

unsatisfied_properties:
  - property: all epimorphisms split
    proof: The functor $\Ab \to \grAb$ that maps an abelian group to the graded abelian group concentrated in degree $0$ is fully faithful and exact. Hence, the claim follows from the contrapositive of Lemma 15 <a href="/content/subcategories">here</a>, since <a href="/category/Ab">$\Ab$</a> does not have all epimorphisms split.

  - property: one-sorted finitary algebraic
    proof: From the description of $\grAb$ using a $\IZ$-sorted algebraic theory and <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Theorem 3.12, we see that a finitely presentable object of $\grAb \cong \Ab^{\IZ}$ is a graded abelian group $(A_n)_{n \in \IZ}$ such that each $A_n$ is finitely presentable and $A_n = 0$ for all but finitely many degrees $n$. Thus, it cannot be a generator, since it cannot distinguish homomorphisms concentrated in degrees outside the finite set of degrees. However, every one-sorted finitary algebraic category has a finitely presentable generator, namely the free algebra on one generator.

