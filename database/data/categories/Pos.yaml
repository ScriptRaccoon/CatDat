id: Pos
name: category of partially ordered sets
notation: $\Pos$
objects: partially ordered sets (aka posets) $(X,\leq)$, i.e. sets $X$ equipped with a reflexive, transitive, and antisymmetric relation $\leq$
morphisms: order-preserving functions
description: Despite the many similarities with <a href="/category/PreOrd">$\PreOrd$</a>, the main difference is that the forgetful functor $\Pos \to \Set$ has no right adjoint. It is a full subcategory of <a href="/category/Bin">$\Bin$</a>.
nlab_link: https://ncatlab.org/nlab/show/Pos
keywords:
  - posets
  - partial orders

tags:
  - order theory
  - relational structures

related:
  - PreOrd
  - Ord
  - Pos_noiso
  - Bin

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Pos \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: locally finitely presentable
    proof: See <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Example 1.10.

  - property: cartesian closed
    proof: The <a href="/category/PreOrd?proof=cartesian_closed">proof</a> for $\PreOrd$ works verbatim, since for posets $(P,\leq),(Q,\leq)$ the pointwise preorder on $\Hom((P,\leq),(Q,\leq))$ is antisymmetric.

  - property: semi-strongly connected
    proof: Every non-empty poset is weakly terminal (by using constant maps).

  - property: infinitary extensive
    proof: $\PreOrd$ is infinitary extensive (<a href="/category/PreOrd?proof=infinitary_extensive" data-allow-deduced>proof</a>), and this property is inherited by its full subcategory $\Pos$, since it is closed under pullbacks and coproducts in $\PreOrd$.

  - property: pushout-stable regular monomorphisms
    proof: See <a href="https://math.stackexchange.com/questions/5130295">MSE/5130295</a>.

  - property: product-stable epimorphisms
    proof: The forgetful functor $\Pos \to \Set$ is faithful and preserves products, being representable by $\{\ast\}$, and epimorphisms (<a href="/category/Pos?proof=epimorphism">proof</a>). Since $\Set$ has product-stable epimorphisms (<a href="/category/Set?proof=product-stable_epimorphisms" data-allow-deduced>proof</a>), so does $\Pos$.

  - property: extremal generator
    proof: We have that $\{0 < 1\}$ is an extremal generator even in $\PreOrd$ (<a href="/category/PreOrd?proof=extremal_generator">proof</a>), hence also in the full subcategory $\Pos$.

  - property: extremal cogenerator
    proof: >-
      We prove that the poset $\{0 < 1\}$ is an extremal cogenerator. First, to prove it is a cogenerator: Let $(P,\leq)$ be a poset and $a,b \in P$ be two elements such that $f(a) = f(b)$ for all order-preserving maps $f : (P,\leq) \to \{0 < 1 \}$. This means that $a$ and $b$ lie in the same upper sets. In particular, $b$ lies in the upper set generated by $a$, meaning $a \leq b$, and similarly we deduce $b \leq a$. Thus, $a = b$.

      Now, suppose we have a morphism $f : (P,\leq) \to (Q,\leq)$ such that
      $${-} \circ f : \Hom((Q,\leq), \{0<1\}) \to \Hom((P,\leq), \{0<1\})$$
      is a bijection. Since it is injective and $\{0<1\}$ is a cogenerator, we get that $f$ is an epimorphism and therefore $f : P \to Q$ is surjective (<a href="/category/Pos?proof=epimorphism">proof</a>). On the other hand, the fact that $f$ induces a bijection of upper sets implies that $f : P \to Q$ is also injective, and also that $f(a_1) \le f(a_2)$ implies $a_1 \le a_2$. Therefore, $f$ is an isomorphism.

unsatisfied_properties:
  - property: skeletal
    proof: The posets with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: balanced
    proof: The identity map $(\{0,1\},=) \to \{0 < 1\}$ from the discrete order provides a counterexample.

  - property: Malcev
    proof: 'Consider the subposet $\{(a,b) \in \IN^2 : a \leq b \}$ of $(\IN,\leq)^2$.'

  - property: co-Malcev
    proof: The <a href="/category/PreOrd?proof=co-Malcev">proof</a> for $\PreOrd$ works verbatim, with the forgetful functor $\Pos \to \Set$.

  - property: regular subobject classifier
    proof: Assume that there is a regular subobject classifier $(\Omega,\leq)$, so that, since the regular monomorphisms are the embeddings (<a href="/category/Pos?proof=regular_monomorphism">proof</a>), $\Hom((P,\leq),(\Omega,\leq))$ is isomorphic to the set of subsets of $P$ for every poset $(P,\leq)$. By taking $P = \{\ast\}$ we see that $\Omega$ has $2$ elements, so that either $(\Omega,\leq) \cong (\{0,1\},=)$ or $(\Omega,\leq) \cong \{0 < 1\}$. By taking $(P,\leq) = \{0 < 1\}$ we see that $\Omega$ has four pairs $(x,y)$ with $x \leq y$. But $(\{0,1\},=)$ has only two and $\{0 < 1\}$ has only three such pairs.

  - property: effective cocongruences
    proof: >-
      Consider $(\IR,\leq)$ with the standard order, and let $C \coloneqq \IR \times \{ 0, 1 \}$ with the partial order such that $(x, m) \le (y, n)$ if and only if $x < y$ or $(x, m) = (y, n)$. The two maps $(\IR,\leq) \rightrightarrows (C,\leq)$ will be $x \mapsto (x, 0)$ and $x \mapsto (x, 1)$ respectively. For any poset $(P, \leq)$, the induced equivalence relation on the set of order-preserving functions $(\IR,\leq) \to (P,\leq)$ is that $f \sim g$ if and only if $f(x) \le g(y)$ and $g(x) \le f(y)$ whenever $x < y$. This relation is clearly reflexive and symmetric; for transitivity, if $f \sim g$ and $g \sim h$, then whenever $x < y$, we have $f(x) \le g(\frac{x+y}{2}) \le h(y)$ and similarly $h(x) \le g(\frac{x+y}{2}) \le f(y)$, showing that $f \sim h$.

      On the other hand, if this cocongruence on $(\IR,\leq)$ were effective, i.e. the cokernel pair of some order-preserving map $(P,\leq) \to (\IR,\leq)$, then $P$ must be empty since the two maps $\IR \rightrightarrows C$ agree nowhere. So $(C,\leq)$ would have to be the coproduct $(\IR,\leq) \sqcup (\IR,\leq)$, giving a contradiction.

special_objects:
  initial object:
    description: empty poset
  terminal object:
    description: singleton poset
  coproducts:
    description: disjoint union with the obvious partial order in which distinct summands are incomparable
  products:
    description: direct products with the evident partial order

special_morphisms:
  isomorphism:
    description: bijective functions that are order-preserving and order-reflecting
    proof: This is easy.
  monomorphism:
    description: injective order-preserving functions
    proof: The same <a href="/category/Set?proof=monomorphism">proof</a> as for $\Set$ can be used.
  epimorphism:
    description: surjective order-preserving functions
    proof: 'Clearly, surjective maps are epimorphisms. Conversely, assume that $f : (P,\leq) \to (Q,\leq)$ is an order-preserving map which is not surjective. Choose $q \in Q \setminus f(P)$. The order-preserving maps $(Q,\leq) \to \{0 < 1\}$ correspond to the upper sets in $Q$, and composing them with $f$ corresponds to taking their $f$-preimages. Consider the two upper sets $Q_{> q}$ and $Q_{\geq q}$. Their $f$-preimages are the same since $q \notin f(P)$. Therefore, $f$ is not an epimorphism.'
  regular monomorphism:
    description: embeddings
    proof: The <a href="/category/PreOrd?proof=regular_monomorphism">proof</a> for $\PreOrd$ works verbatim, with "partial order" in place of "preorder".
