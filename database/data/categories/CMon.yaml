id: CMon
name: category of commutative monoids
notation: $\CMon$
objects: commutative monoids
morphisms: monoid homomorphisms
description: This is the full subcategory of $\Mon$ that consists of commutative monoids. It is a typical example of a one-sorted finitary algebraic category and the "non-additive version" of $\CRing$.
nlab_link: https://ncatlab.org/nlab/show/category+of+monoids
keywords:
  - abelian monoids

tags:
  - algebra

related:
  - Ab
  - CRing
  - Mon

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\CMon \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: pointed
    proof: The trivial monoid is a zero object.
    check_redundancy: false

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of a commutative monoid.

  - property: biproducts
    proof: This follows from the explicit construction of coproducts and products.

unsatisfied_properties:
  - property: skeletal
    proof: The trivial monoids with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: balanced
    # This can be deduced, but the direct counterexample is instructive and
    # important for many readers.
    proof: The inclusion of additive monoids $\IN \hookrightarrow \IZ$ is a counterexample.
    check_redundancy: false

  - property: Malcev
    proof: 'Consider the submonoid $\{(a,b) : a \leq b \}$ of $\IN^2$.'

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \CMon \to \Set$ and the relation $R \subseteq U^2$ defined by $R(A) \coloneqq \{(a,b) \in U(A)^2 : ab = a^2\}$. Both are representable: $U$ by the free monoid on a single generator and $R$ by the free commutative monoid on two generators $x,y$ subject to the relation $xy=x^2$. It is clear that $R$ is reflexive, but not symmetric.'

  - property: cogenerator
    proof: See <a href="https://mathoverflow.net/questions/509232">MO/509232</a>.

  - property: coregular
    proof: >-
      We can show this analogously to the case of commutative rings <a href="https://math.stackexchange.com/a/3746890">MSE/3746890</a>, since all rings considered there are monoid algebras. We will find a homomorphism $f : M \to N$ of commutative monoids with cokernel pair $j_1,j_2 : N \rightrightarrows P$, such that the homomorphism $f' : M \to \eq(j_1,j_2)$ induced by $f$ is not an epimorphism, proving that $\CMon$ is not coregular.

      Consider the commutative monoid $\IN^2$ and its submonoid
      $$U \coloneqq \{(m,n) \in \IN^2 : m \geq n\}$$
      with the inclusion $f : U \hookrightarrow \IN^2$. Write $\IN^2 = \langle x,y \rangle$ with the standard free generators $x = (1,0)$ and $y = (0,1)$. Then $U$ is generated by $x$ and $x+y$, since for $m \geq n$ we have
      $$(m,n) = (m-n) \cdot (1,0) + n \cdot (1,1).$$
      Therefore, the cokernel pair of $f$ evaluates to
      $$\begin{align*}
      P \coloneqq \IN^2 \sqcup_U \IN^2 & = \langle x,y,x',y' : x=x', \, x+y=x'+y' \rangle \\
      & = \langle x,y,y' : x+y=x+y' \rangle
      \end{align*}$$
      with canonical homomorphisms $j_1,j_2 : \IN^2 \rightrightarrows P$ defined by $j_1(m,n) = mx + ny$ and $j_2(m,n) = mx + ny'$. To compute $\eq(j_1,j_2)$, we need to understand $P$ better. It is the quotient of $\langle x,y,y' \rangle \cong \IN^3$ by the smallest congruence that identifies $(1,1,0)$ with $(1,0,1)$. Define the relation $\sim$ on $\IN^3$ as follows:
      $$(a,b,c) \sim (a',b',c') \iff (a = a') \, \land \, (b+c=b'+c') \, \land \, (a=0 \Rightarrow b=b').$$
      It is easy to check that $\sim$ is a congruence. It satisfies $(1,1,0) \sim (1,0,1)$. Conversely, let $\approx$ be a congruence with $(1,1,0) \approx (1,0,1)$. If $a \geq 1$ and $b \geq 1$, then we compute
      $$\begin{align*}
      (a,b,c) & = (a-1,b-1,c) + (1,1,0) \\
      & \approx (a-1,b-1,c) + (1,0,1) \\
      & = (a,b-1,c+1).
      \end{align*}$$
      By induction, it follows for all $a \geq 1$ that
      $$(a,b,c) \approx (a,0,b+c).$$
      To show that $\approx$ contains $\sim$, let $(a,b,c) \sim (a',b',c')$. If $a=0$, then $b=b'$ and $c=c'$, and we are done. If $a \geq 1$, then
      $$(a,b,c) \approx (a,0,b+c) = (a',0,b'+c') \approx (a',b',c').$$
      This finishes the proof that $\sim$ is the congruence with $P = \IN^3 / {\sim}$. Using this, the equalizer of $j_1,j_2$ consists of those $(m,n) \in \IN^2$ such that
      $$(m,n,0) \sim (m,0,n).$$
      This is automatic for $m \geq 1$, and for $m=0$ it forces $n=0$. Therefore,
      $$E \coloneqq \eq(j_1,j_2) = \{(m,n) \in \IN^2 : m = 0 \Rightarrow n = 0\}.$$
      The homomorphism $f' : U \to E$ induced by $f : U \hookrightarrow \IN^2$ is just the inclusion map. We claim that it is not an epimorphism. Consider the commutative monoid
      $$T \coloneqq \{0,a,b,\infty\},$$
      where $0$ is the identity and the sum of any two non-zero elements is $\infty$. Define the maps $u,v : E \rightrightarrows T$ by
      $$u(m,n) = \begin{cases} 0 & m=n=0 \\
      a & m=1 \\
      \infty & m \geq 2
      \end{cases}$$
      and
      $$v(m,n) = \begin{cases} 0 & m=n=0 \\
      a & m=1, \, n \leq 1 \\
      b & m=1, \, n \geq 2 \\
      \infty & m \geq 2.
      \end{cases}$$
      Both are homomorphisms: adding two non-zero elements of $E$ yields an element whose first coordinate is at least $2$, so its image is $\infty$, precisely the sum of their non-zero images. They agree on $U$, because the only case where $u$ and $v$ differ is $m=1$, $n \geq 2$, so that $m < n$. But $u \neq v$ since
      $$u(1,2) = a \neq b = v(1,2).$$

  - property: regular subobject classifier
    proof: We can use exactly the same proof as for <a href="/category/Mon">$\Mon$</a>.
    references:
      - Mon_no_regular_subobject_classifier

  - property: regular quotient object classifier
    proof: 'If $P \in \CMon$ is a regular quotient object classifier, this means that every surjective homomorphism of commutative monoids $A \to B$ is the cokernel of a unique homomorphism $P \to A$. But there are many surjective homomorphisms which are not cokernels at all: Consider the Boolean monoid $(\{0,1\},\vee)$ with $1 \vee 1 = 1$ and the surjective homomorphism $f : (\IN,+) \to (\{0,1\},\vee)$ defined by $f(0)=0$ and $f(n)=1$ for $n \geq 1$. It has trivial kernel, but is not an isomorphism, so it cannot be a cokernel.'
    label: CMon_no_regular_quotient_object_classifier

  - property: product-stable epimorphisms
    proof: >-
      We will find an epimorphism $U \hookrightarrow S$ of commutative monoids such that the product of countably many copies of it, $U^{\IN} \hookrightarrow S^{\IN}$, is not an epimorphism. We write commutative monoids additively.

      By the classification of epimorphisms (see below), the inclusion $U \hookrightarrow S$ of a submonoid is an epimorphism if and only if every $d \in S$ has a chain $(p_0,q_0),\dotsc,(p_k,q_k)$ over $U$, i.e. a sequence in $S \times S$ from $(d,0)$ to $(0,d)$ such that each step replaces a pair $(p+u,q)$ by $(p,q+u)$, or $(p,q+u)$ by $(p+u,q)$, for some $p,q \in S$ and $u \in U$. The number $k$ is called the <i>length</i> of the chain. Since $p_0 + q_0 = d$ and each step preserves the sum of the two entries, we have $p_j + q_j = d$ for all $j$.

      If $S$ is cancellative, the criterion simplifies: then $p_j$ is uniquely determined by $q_j$, and a chain for $d$ over $U$ is the same as a sequence $q_0,\dotsc,q_k \in S$ with $q_0 = 0$ and $q_k = d$ such that each $q_j$ is a summand of $d$ (i.e. $d = p_j + q_j$ for some $p_j \in S$) and for each $j < k$ there is some $u \in U$ with $q_{j+1} = q_j + u$ or $q_j = q_{j+1} + u$. Indeed, if $q_{j+1} = q_j + u$, then
      $$p_{j+1} + u + q_j = p_{j+1} + q_{j+1} = d = p_j + q_j,$$
      hence $p_j = p_{j+1} + u$ by cancellation, so the $j$-th step replaces $(p_{j+1} + u, q_j)$ by $(p_{j+1}, q_j + u)$. The case $q_j = q_{j+1} + u$ is symmetric.

      Now consider $\sigma : \IQ^2 \to \IQ$, $\sigma(x,y) \coloneqq x + y$, the submonoid
      $$S \coloneqq \{s \in \IQ^2 : \sigma(s) > 0\} \cup \{(0,0)\}$$
      of $\IQ^2$, and its submonoid $U \coloneqq \IQ_{\geq 0}^2$. Notice that $\sigma(s) \geq 0$ for all $s \in S$. Since $S$ is cancellative, a chain for $d \in S$ over $U$ is the same as a sequence $q_0,\dotsc,q_k \in S$ with $q_0 = 0$, $q_k = d$, $d - q_j \in S$, and $q_{j+1} - q_j \in U \cup (-U)$ for all $j < k$.

      <strong>Claim 1.</strong> The inclusion $U \hookrightarrow S$ is an epimorphism.

      By the classification of epimorphisms, we need to find a chain for every $d = (x,y) \in S$. If $d \in U$, then $q_0 \coloneqq 0$, $q_1 \coloneqq d$ is a chain. Otherwise, since swapping the coordinates preserves $S$ and $U$, we may assume $y < 0$. Let $r \coloneqq -y > 0$ and $e \coloneqq \sigma(d)/3 > 0$, so that $x = r + 3e$. Let $i \geq 1$ be the integer with $(i-1) e < r \leq i e$. We will construct a chain $q_0,\dotsc,q_{2i+2}$ of length $2i+2$. Every intermediate point $q_j$ must satisfy $0 < \sigma(q_j) < 3e$. Therefore, we walk down a staircase between the lines $\sigma = e$ and $\sigma = 2e$, as in the following picture, where each arrow is labeled with the difference of its endpoints:
      $$\begin{CD}
      q_0 @>{(2e,0)}>> q_1 \\
      @. @VV{(0,-e)}V \\
      @. q_2 @>{(e,0)}>> q_3 \\
      @. @. @VV{(0,-e)}V \\
      @. @. q_4 @. \smash{\begin{array}{c} \\ \\ \\ \ddots \end{array}} \\
      @. @. @. @. \\
      @. @. @. @. q_{2i+1} @>{d - q_{2i+1}}>> d
      \end{CD}$$
      The last arrow is drawn horizontally for simplicity, but it usually also goes up (see below). Explicitly, let $q_0 \coloneqq (0,0)$,
      $$\begin{align*}
      q_{2j-1} & \coloneqq ((j+1)e, -(j-1)e) && (1 \leq j \leq i+1), \\
      q_{2j} & \coloneqq ((j+1)e, -je) && (1 \leq j \leq i),
      \end{align*}$$
      and $q_{2i+2} \coloneqq d$. The steps are in $U \cup (-U)$: we have $q_1 - q_0 = (2e,0)$, $q_{2j} - q_{2j-1} = (0,-e)$, $q_{2j+1} - q_{2j} = (e,0)$, and finally
      $$d - q_{2i+1} = (r + 3e - (i+2)e, \, -r + ie) = (r - (i-1)e, \, ie - r) \in U.$$
      For $1 \leq j \leq 2i+1$ we have $\sigma(q_j) \in \{e,2e\}$, hence also $\sigma(d - q_j) = 3e - \sigma(q_j) \in \{e,2e\}$, so that $q_j, d - q_j \in S$. For $j = 0$ we have $q_0 = 0$ and $d - q_0 = d$, and for $j = 2i+2$ we have $q_{2i+2} = d$ and $d - q_{2i+2} = 0$. This is a chain for $d$.

      <strong>Claim 2.</strong> For $n \in \IN$, the element $d_n \coloneqq (n+1,-n) \in S$ has no chain over $U$ of length $\leq n$.

      The idea is that $d_n$ is far away from $0$, while the band $0 \leq \sigma \leq \sigma(d_n) = 1$ containing the chain is narrow, so that every step is short. In detail, let $q_0,\dotsc,q_k$ be a chain for $d_n$. Since $q_j \in S$ and $d_n - q_j \in S$, we have $\sigma(q_j) \geq 0$ and $1 - \sigma(q_j) = \sigma(d_n - q_j) \geq 0$, so that $0 \leq \sigma(q_j) \leq 1$. Write $q_{j+1} - q_j = \pm (a,b)$ with $(a,b) \in U$, so that $a,b \geq 0$. Since $\sigma$ is linear, we have
      $$\sigma(q_{j+1}) - \sigma(q_j) = \sigma(q_{j+1} - q_j) = \pm (a + b).$$
      Since $\sigma(q_j)$ and $\sigma(q_{j+1})$ both lie in $[0,1]$, their distance is $\leq 1$. Hence, we get
      $$a \leq a + b = |\sigma(q_{j+1}) - \sigma(q_j)| \leq 1.$$
      Thus the first coordinate changes by at most $1$ in each step. Since it changes from $0$ to $n+1$, we get $k \geq n+1$.

      Finally, assume that $U^{\IN} \hookrightarrow S^{\IN}$ is an epimorphism. Since products in $\CMon$ are direct products with pointwise operations, $U^{\IN}$ is a submonoid of $S^{\IN}$, and the classification of epimorphisms provides a chain of some length $k$ for $(d_n)_{n \in \IN}$ over $U^{\IN}$. Its projection to the $n$-th coordinate is a chain of length $k$ for $d_n$ over $U$. By Claim 2, $k \geq n+1$ for all $n \in \IN$, a contradiction. Together with Claim 1, this shows that $\CMon$ does not have product-stable epimorphisms.

  - property: effective cocongruences
    proof: A counterexample, based on the counterexample for <a href="/category/Pos">$\Pos$</a>, is given at <a href="https://mathoverflow.net/questions/511792">MO/511792</a>.
    references:
      - Pos_no_effective_cocongruences

special_objects:
  initial object:
    description: trivial monoid
  terminal object:
    description: trivial monoid
  coproducts:
    description: direct sums
  products:
    description: direct products with pointwise operations

special_morphisms:
  epimorphism:
    description: >-
      For a homomorphism $f : T \to S$ of commutative monoids, written additively, the following are equivalent: (1) $f$ is an epimorphism in $\CMon$. (2) $f$ is an epimorphism in $\Mon$, which in turn can be characterized by <a href="https://en.wikipedia.org/wiki/Isbell's_zigzag_theorem">Isbell's zigzag theorem</a>. (3) Every $d \in S$ has a <i>chain</i> over $U \coloneqq f(T)$, meaning a sequence $(p_0,q_0),\dotsc,(p_k,q_k)$ in $S \times S$ with $(p_0,q_0) = (d,0)$ and $(p_k,q_k) = (0,d)$ such that each step replaces a pair $(p+u,q)$ by $(p,q+u)$, or $(p,q+u)$ by $(p+u,q)$, for some $p,q \in S$ and $u \in U$.
    proof: >-
      The implication (2) $\implies$ (1) is trivial. The implication (1) $\implies$ (2) requires a proof, which can be found at <a href="https://math.stackexchange.com/a/5133596">MSE/5133488</a>.

      For (1) $\iff$ (3), notice first that $f$ is an epimorphism iff the inclusion $U \hookrightarrow S$ is one, since the corestriction $T \to U$ of $f$ is surjective, hence an epimorphism. Moreover, $U \hookrightarrow S$ is an epimorphism iff the two coprojections $i_1,i_2 : S \rightrightarrows S \sqcup_U S$ are equal. Since coproducts in $\CMon$ are direct sums, we have $S \sqcup_U S = (S \times S)/{\sim}$ with $i_1(s) = [(s,0)]$ and $i_2(s) = [(0,s)]$, where $\sim$ is the congruence generated by $(u,0) \sim (0,u)$ for $u \in U$. We claim that $\sim$ is the equivalence relation generated by
      $$(p+u,q) \sim (p,q+u) \quad (p,q \in S, \, u \in U).$$
      Indeed, these relations are the translates of the relations $(u,0) \sim (0,u)$ by the elements $(p,q) \in S \times S$, so they hold in every congruence that contains $(u,0) \sim (0,u)$. Conversely, the equivalence relation generated by them is invariant under translation (apply the translation to each step), hence a congruence, since $x \sim x'$ and $y \sim y'$ imply $x + y \sim x' + y \sim x' + y'$. This proves the claim. It follows that $(d,0) \sim (0,d)$ holds iff $d$ has a chain over $U$. Hence, $i_1 = i_2$ holds iff every $d \in S$ has a chain over $U$.
