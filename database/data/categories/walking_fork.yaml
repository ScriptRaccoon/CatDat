id: walking_fork
name: walking fork
notation: $\Fork$
objects: three objects $0,1,2$
morphisms: 'one morphism $i : 0 \to 1$, two morphisms $f,g : 1 \rightrightarrows 2$, one morphism $0 \to 2$ (namely, $f \circ i = g \circ i$), and the identities'
description: >-
  This category can be pictured as:
  $$\{0 \to 1 \rightrightarrows 2\}$$
  Its name comes from the fact that a functor $\Fork \to \C$ is the same as a <a href="https://ncatlab.org/nlab/show/fork" target="_blank">fork</a> in $\C$. It can also be realized as the category of ordered sets of cardinality $\leq 2$ with injective order-preserving maps.
nlab_link: null
tags:
  - category theory

related:
  - walking_commutative_square
  - walking_composable_pair
  - walking_pair
  - forked_commutative_square

satisfied_properties:
  - property: small
    proof: This is trivial.

  - property: finite
    proof: This is trivial.

  - property: semi-strongly connected
    proof: This is obvious.

  - property: skeletal
    proof: The three objects are clearly not isomorphic.

  - property: one-way
    proof: This is trivial.

  - property: cogenerator
    proof: It is easy to check that $2$ is a cogenerator.

  - property: left cancellative
    proof: It is easy to check that $i,f,g$ are monomorphisms.

  - property: equalizers
    proof: The only pair of distinct parallel morphisms is $f,g$, and their equalizer is $i$.

  - property: extremal generator
    proof: >-
      It is easy to check that $\Hom(1, {-})$ sends the category
      $$0 \to 1 \rightrightarrows 2$$
      to the diagram in $\Set$
      $$\varnothing \to \{ \id_1 \} \rightrightarrows \{ f, g \}.$$
      From this, it is easy to see that $\Hom(1, {-})$ is faithful and conservative, so $1$ is an extremal generator.

  - property: locally cartesian closed
    proof: We need to check that every slice category is cartesian closed. The slice category over $0$ is the <a href="/category/1">trivial category</a>. The slice category over $1$ is the <a href="/category/walking_morphism">walking morphism</a>. Finally, the slice category over $2$ ist the <a href="/category/walking_commutative_square">walking commutative square</a>. All of these are cartesian closed, see their pages for details.

unsatisfied_properties:
  - property: strongly connected
    proof: There is no morphism $1 \to 0$.

  - property: binary powers
    proof: 'Assume that $X \coloneqq 2 \times 2$ exists. Since there is a diagonal morphism $2 \to X$, we must have $X = 2$, and the two projections $p_1,p_2 : X \rightrightarrows 2$ must be equal to the identity. But $f,g$ induce a morphism $(f,g) : 1 \to X$ with $p_1 (f,g) = f$ and $p_2 (f,g) = g$, so that $f=g$, a contradiction.'

  - property: extremal cogenerator
    proof: >-
      Since any cogenerator must distinguish $f,g : 1 \rightrightarrows 2$ and the only object which has a morphism from $2$ is $2$, the only cogenerator is $2$. The unique morphism $h : 0 \to 2$ is not an isomorphism, but ${-} \circ h : \Hom(2,2) \to \Hom(0,2)$ is a bijection since both sides are singletons. Thus, $2$ is not an extremal cogenerator.

special_objects:
  initial object:
    description: $0$

special_morphisms:
  epimorphisms:
    description: the identities and $f,g$
    proof: This is easily checked.
  regular monomorphisms:
    description: the identities and $i$
    proof: First, $i$ is the equalizer of $f,g$. The morphism $f$ is an epimorphism (and a monomorphism), but no isomorphism, hence cannot be a regular monomorphism. The same holds for $g$.
