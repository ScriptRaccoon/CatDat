id: Alg(R)
name: category of algebras
notation: $\Alg(R)$
objects: algebras over a commutative ring $R \neq 0$
morphisms: maps preserving the ring and module structure
description: This category is a generalization of the category of rings, which we get for $R = \IZ$. We assume our rings (and algebras) to be unital. For $R = 0$ we would get the trivial category, which is why we exclude this here.
nlab_link: https://ncatlab.org/nlab/show/Alg
keywords:
  - R-algebras
  - associative algebras

tags:
  - algebra

related:
  - CAlg(R)
  - R-Mod

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Alg(R) \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory of an $R$-algebra.

  - property: strict terminal object
    proof: 'If $f : 0 \to A$ is an algebra homomorphism, then $A$ satisfies $1=f(1)=f(0)=0$, so that $A=0$.'

  - property: disjoint finite products
    proof: 'Let $A,B$ be two $R$-algebras. To show that $A \sqcup_{A \times B} B$ is trivial, let $T$ be an $R$-algebra which admits homomorphisms $f : A \to T$, $g : B \to T$ with $f(p_1(a,b))=g(p_2(a,b))$ for all $(a,b) \in A \times B$, i.e. $f(a)=g(b)$. Applying this to $a=1$, $b=0$ yields $1=0$ in $T$. Hence, $T = 0$.'

  - property: finite-product-stable epimorphisms
    proof: >-
      For $R = \IZ$, this is <a href="https://eudml.org/doc/139538">Storrer</a>, Cor. 2.3. Here is a direct proof for arbitrary $R$.

      Let $f : A \to B$ be an epimorphism and $T$ be an $R$-algebra. It suffices to show that $\id_T \times f : T \times A \to T \times B$ is an epimorphism. Let $g,h : T \times B \rightrightarrows C$ be algebra homomorphisms with $g \circ (\id_T \times f) = h \circ (\id_T \times f)$. The central idempotent $e' \coloneqq (0,1)$ of $T \times B$ lies in the image of $\id_T \times f$, so $\varepsilon' \coloneqq g(e') = h(e')$ is an idempotent of $C$ (not necessarily central, but this is not needed). Since $(0,b) = e' \cdot (0,b) \cdot e'$ for all $b \in B$, we have $g(0,b) = \varepsilon' \cdot g(0,b) \cdot \varepsilon'$, and hence the map
      $$g' : B \to \varepsilon' C \varepsilon', \quad b \mapsto g(0,b)$$
      is an algebra homomorphism into the corner algebra $\varepsilon' C \varepsilon'$ with unit $\varepsilon'$. In the same way, $h' : B \to \varepsilon' C \varepsilon'$, $b \mapsto h(0,b)$ is an algebra homomorphism. Since $g' \circ f = h' \circ f$ and $f$ is an epimorphism, we get $g' = h'$. For all $t \in T$ and $b \in B$, we conclude
      $$g(t,b) = g(t,0) + g'(b) = h(t,0) + h'(b) = h(t,b),$$
      where $g(t,0) = h(t,0)$ holds because $(t,0)$ lies in the image of $\id_T \times f$.

  - property: Malcev
    proof: This follows in the same way as for <a href="/category/Grp">$\Grp$</a>; see also <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Example 2.2.5.
    references:
      - Grp_malcev

unsatisfied_properties:
  - property: skeletal
    proof: The zero $R$-algebras with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: semi-strongly connected
    proof: This is because already the full subcategory <a href="/category/CAlg(R)">$\CAlg(R)$</a> of commutative algebras is not semi-strongly connected.

  - property: cototal
    proof: Essentially the same proof as for <a href="/category/CAlg(R)">$\CAlg(R)$</a> works here.
    references:
      - CAlg(R)_not_cototal

  - property: codistributive
    proof: 'If $\sqcup$ denotes the coproduct of $R$-algebras (see <a href="https://math.stackexchange.com/questions/625874">MSE/625874</a> for their description) and $A$ is an $R$-algebra, the canonical morphism $A \sqcup R^2 \to (A \sqcup R)^2 = A^2$ is not necessarily an isomorphism. For example, for $A = R[X]$, the coproduct on the left-hand side has the algebra presentation $\langle X,E : E^2=E \rangle$ and is therefore not commutative: the homomorphism to $M_2(R)$ defined by $X \mapsto \bigl(\begin{smallmatrix} 0 & 1 \\ 0 & 0 \end{smallmatrix}\bigr)$ and $E \mapsto \bigl(\begin{smallmatrix} 1 & 0 \\ 0 & 0 \end{smallmatrix}\bigr)$ maps $XE$ to $0$ and $EX$ to $\bigl(\begin{smallmatrix} 0 & 1 \\ 0 & 0 \end{smallmatrix}\bigr) \neq 0$.'
    label: Alg(R)_not_codistributive

  - property: coparametrized conatural numbers object
    proof: >-
      By the dual of Lemma 4 <a href="/content/natural_numbers_objects">here</a>, it suffices to show that for some $R$-algebra $A$ the canonical homomorphism $A \sqcup R^{\IN} \to A^{\IN}$ is not an isomorphism. We take $A \coloneqq R[X]$. Since $A^{\IN}$ is commutative, it suffices to show that $R[X] \sqcup R^{\IN}$ is not commutative. The surjective homomorphism $R^{\IN} \to R^2$, $(r_n)_n \mapsto (r_0,r_1)$ induces a surjective homomorphism $R[X] \sqcup R^{\IN} \to R[X] \sqcup R^2$. Since $R[X] \sqcup R^2$ is not commutative (see the proof above that $\Alg(R)$ is not codistributive), neither is $R[X] \sqcup R^{\IN}$.
    references:
      - Alg(R)_not_codistributive

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \Alg(R) \to \Set$ and the relation $E \subseteq U^2$ defined by $E(A) \coloneqq \{(a,b) \in U(A)^2 : ab = a^2\}$. Both are representable: $U$ by $R[X]$ and $E$ by $R \langle X,Y \rangle / \langle XY-X^2 \rangle$. It is clear that $E$ is reflexive, but not symmetric.'

  - property: pushout-stable regular monomorphisms
    proof: 'Since $R \neq 0$, there is an infinite field $K$ with a homomorphism $R \to K$. Since $K$ is infinite, we may choose some $\lambda \in K \setminus \{0,1\}$. Let $B \coloneqq M_2(K)$ and $A \coloneqq K \times K$. Then $A \to B$, $(x,y) \mapsto \diag(x,y)$ is a regular monomorphism: A direct calculation shows that a matrix is diagonal iff it commutes with $M \coloneqq \bigl(\begin{smallmatrix} 1 & 0 \\ 0 & \lambda \end{smallmatrix}\bigr)$, so that $A \to B$ is the equalizer of the identity $B \to B$ and the conjugation $B \to B$, $X \mapsto M X M^{-1}$. Consider the homomorphism $A \to K$, $(a,b) \mapsto a$. We claim that $K \to K \sqcup_A B$ is not a monomorphism, because in fact, the pushout $K \sqcup_A B$ is zero: Since $A \to K$ is surjective with kernel $0 \times K$, the pushout is $B/\langle 0 \times K \rangle$, which is $0$ because $B$ is simple (<a href="https://math.stackexchange.com/questions/22629">proof</a>) or via a direct calculation with elementary matrices.'
    label: Alg(R)_not_coregular

  - property: regular quotient object classifier
    proof: We may copy the proof for <a href="/category/CAlg(R)">$\CAlg(R)$</a> (since the proof there did not use that $P$ is commutative). Alternatively, any regular quotient object classifier in $\Alg(R)$ would produce one in the reflective subcategory $\CAlg(R)$ by Lemma 1 <a href="/content/subcategories">here</a> (dualized).
    references:
      - CAlg(R)_no_regular_quotient_object_classifier

  - property: cocartesian cofiltered limits
    proof: >-
      Consider the algebra $A = R[X]$ and the sequence of algebras $B_n = R[Y]/(Y^{n+1})$ with projections $B_{n+1} \to B_n$, whose limit is $R[[Y]]$. Every element in the coproduct of algebras $R[X] \sqcup R[[Y]]$ has a finite "free product" length. Now consider the elements
      $$w_n = (1 + XY) (1+XY^2) \cdots (1+X Y^n) \in A \sqcup B_n.$$
      Because of $w_n \equiv w_{n-1} \bmod Y^n$, these form an element $w \in \lim_n (A \sqcup B_n)$. Expanding $w_n$, the longest term is $XY XY^2 \cdots X Y^n$ of "free product" length $2n$, which is unbounded.

  - property: product-stable epimorphisms
    proof: >-
      We already know that <a href="/category/CAlg(R)">$\CAlg(R)$</a> does not have this property. Now apply the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> to the forgetful functor $\CAlg(R) \to \Alg(R)$. It preserves products, and it preserves epimorphisms by <a href="https://math.stackexchange.com/a/5133596">MSE/5133488</a>.

      For $R = \IZ$, an alternative counterexample is given in the remarks after Cor. 2.3 in <a href="https://eudml.org/doc/139538">Storrer</a>.

  - property: effective cocongruences
    proof: '<a href="https://mathoverflow.net/a/510809">MO/510744</a> presents a counterexample for $\Ring$, and it can be easily generalized to $\Alg(R)$: Let $X \coloneqq R[p] / (p^2-p)$ with cocongruence $C \coloneqq R \langle p, q \rangle / (p^2-p, q^2-q, pq-q, qp-p)$.'

undecidable_properties:
  - property: coproduct-stable monomorphisms
    proof: >-
      This depends on $R$. For $R = \IZ$, even finite-coproduct-stable monomorphisms fail, see <a href="/category/Ring">$\Ring$</a>.

      Now let $R = K$ be a field. Monomorphisms are injective homomorphisms. Let $(f_i : A_i \to B_i)_{i \in I}$ be a family of injective homomorphisms of $K$-algebras. If some $A_i$ is zero, then so is $B_i$, and both coproducts are zero. Otherwise, choose for each $i$ a $K$-basis of $A_i$ of the form $\{1\} \cup T_i$. Since $f_i$ is injective, $\{1\} \cup f_i(T_i)$ is linearly independent in $B_i$, and we may extend it to a $K$-basis $\{1\} \cup T'_i$ of $B_i$ with $f_i(T_i) \subseteq T'_i$. By <a href="https://math.berkeley.edu/~gbergman/papers/coproducts1.pdf">Bergman</a>, Prop. 4.1 (applied to the standard module $N = \coprod_{i \in I} A_i$ with $N_0 = K$ and $N_i = 0$), the coproduct $\coprod_{i \in I} A_i$ has a $K$-basis consisting of the products $t_1 \cdots t_n$ with $n \geq 0$, $t_k \in T_{i_k}$, and $i_k \neq i_{k+1}$, and similarly for $\coprod_{i \in I} B_i$. The coproduct homomorphism maps $t_1 \cdots t_n$ to $f_{i_1}(t_1) \cdots f_{i_n}(t_n)$, which is again such a basis element of $\coprod_{i \in I} B_i$. Since each $f_i$ is injective on $T_i$, distinct basis elements are mapped to distinct basis elements. Hence, the coproduct homomorphism is injective.
    label: Alg(R)_coproduct-stable_monos

  - property: finite-coproduct-stable monomorphisms
    proof: This depends on $R$. For $R = \IZ$ it fails, see <a href="/category/Ring">$\Ring$</a>. For a field $R = K$ it holds, since even coproduct-stable monomorphisms hold (see above).
    references:
      - Alg(R)_coproduct-stable_monos

special_objects:
  initial object:
    description: $R$
  terminal object:
    description: zero algebra
  coproducts:
    description: see <a href="https://math.stackexchange.com/questions/625874">MSE/625874</a>
  products:
    description: direct products with pointwise operations

special_morphisms: {}
