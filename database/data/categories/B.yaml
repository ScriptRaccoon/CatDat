id: B
name: category of finite sets and bijections
notation: $\IB$
objects: finite sets
morphisms: bijective maps
description: This category is also known as the permutation groupoid. It appears in the definition of a combinatorial species.
nlab_link: https://ncatlab.org/nlab/show/permutation+groupoid
keywords:
  - permutation groupoid

tags:
  - combinatorics
  - set theory

related:
  - FI
  - FS
  - FinSet
  - Set_bij

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\IB \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: locally finite
    proof: There is a faithful functor $\IB \to \FinSet$, and $\FinSet$ is locally finite (<a href="/category/FinSet?proof=locally_finite" data-allow-deduced>proof</a>).

  - property: inhabited
    proof: For example, $\varnothing$ is an object.

  - property: groupoid
    proof: The inverse of a bijection is a bijection.

  - property: essentially countable
    proof: Every finite set is isomorphic to $\{1,\dotsc,n\}$ for some $n \in \IN$.

unsatisfied_properties:
  - property: small
    proof: Even the collection of singletons is not small, since every set $X$ yields the singleton $\{X\}$.

  - property: countable
    proof: Even the collection of all singletons is not countable, since every set $X$ yields the singleton $\{X\}$.

  - property: skeletal
    proof: The sets $\{0\}$ and $\{1\}$ are isomorphic but not equal.

  - property: generator
    proof: 'We show more generally that if a groupoid has a generator $G$, then every object $X$ with a non-trivial automorphism $\sigma$ is isomorphic to $G$. Since $\sigma, \id_X : X \rightrightarrows X$ are distinct, there is a morphism $h : G \to X$ with $\sigma \circ h \neq h$, and $h$ is an isomorphism. Now $\IB$ is a groupoid, and the non-isomorphic objects $\{0,1\}$ and $\{0,1,2\}$ both have non-trivial automorphisms.'

  - property: essentially finite
    proof: This is trivial.

special_objects: {}

special_morphisms: {}
