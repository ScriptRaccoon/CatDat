id: Bin_irr
name: category of sets equipped with an irreflexive binary relation
notation: $\Bin_{\irr}$
alternative_notation: $\DiGraph_{NL}$
objects: pairs $(X,R)$, where $X$ is a set and $R \subseteq X \times X$ is an irreflexive binary relation
morphisms: >-
  A morphism $(X,R) \to (Y,S)$ is a relation-preserving map, i.e. a map $f : X \to Y$ such that $(x,x') \in R$ implies $(f(x),f(x')) \in S$.
description: >-
  The pair $(X,R)$ can also be interpreted as a directed graph without loops (with vertex set $X$ and edge set $R$), and the morphisms are precisely morphisms of directed graphs. Thus,
  $$\Bin_{\irr} = \DiGraph_{NL},$$
  and $\DiGraph_{NL}$ can be interpreted as the full subcategory of $\Quiv$, the <a href="/category/Quiv">category of quivers</a>, consisting of quivers with no loops and at most one edge between any pair of vertices. In the proofs below, however, we will mostly not use the graph-theoretic interpretation and instead work with binary relations. This simplifies the exposition and has the additional advantage that we do not need to deal with the varying definitions of the term "directed graph" in the literature (in particular, there is no complete consensus on whether loops are allowed). Instead, we can focus on the unambiguous notion of an irreflexive binary relation.

  There are major categorical differences between $\Bin_{\irr}$ and $\Bin$; for example, $\Bin_{\irr}$ has no terminal object.

  It turns out that this category behaves exactly like <a href="/category/Bin_symm_irr">$\Bin_{\symm,\irr}$</a> (i.e. the category of undirected graphs, with loops not allowed), and the proofs of the properties are very similar.
nlab_link: null
keywords:
  - loopless directed graphs

tags:
  - graph theory
  - relational structures

related:
  - Bin
  - Bin_symm_irr
  - Bin_refl
  - Bin_symm
  - Bin_symm_refl
  - Quiv

satisfied_properties:
  - property: locally small
    proof: This is obvious.

  - property: connected limits
    proof: In fact, $\Bin_{\irr}$ is closed under all non-empty limits in <a href="/category/Bin">$\Bin$</a>. If $\I \to \Bin$, $i \mapsto (X_i,R_i)$ is a non-empty diagram, its limit is $(\lim_{i \in \I} X_i,R)$, where $R$ consists of pairs $(x,y)$ such that $(x_i,y_i) \in R_i$ for every $i \in \I$. If each $R_i$ is irreflexive, then $R$ is irreflexive, because if $(x,x) \in R$, we may choose any $i \in \I$ and obtain the contradiction $(x_i,x_i) \in R_i$.
    check_redundancy: false

  - property: binary products
    proof: We have just seen that all non-empty limits exist.

  - property: infinitary extensive
    proof: It is easy to check that $\Bin_{\irr} \subseteq \Bin$ is closed under coproducts (see below for their concrete description), and we already know that it is also closed under pullbacks. Since <a href="/category/Bin">$\Bin$</a> is infinitary extensive, the claim therefore follows from Lemma 11 <a href="/content/subcategories">here</a>.

  - property: finitely accessible
    proof: >-
      First, we claim that $\Bin_{\irr} \subseteq \Bin$ is closed under filtered colimits. In fact, the colimit of a filtered diagram $i \mapsto (X_i,R_i)$ in <a href="/category/Bin">$\Bin$</a> is $(\colim_i X_i, R)$, where $R$ consists of all pairs $(\iota_i(x),\iota_i(y))$ for some index $i$ and some $(x,y) \in R_i$. If each $R_i$ is irreflexive, then $R$ is irreflexive as well, because otherwise there would be some index $i$ and some $(x,y) \in R_i$ such that $\iota_i(x)=\iota_i(y)$ in the colimit. Hence, there is some morphism $i \to j$ such that $x$ and $y$ have the same image in $X_j$. If $z \in X_j$ denotes this common image, we obtain $(z,z) \in R_j$, a contradiction.

      The rest of the proof is the same as for the finite accessibility of <a href="/category/Bin">$\Bin$</a>.
    label: Bin_irr_finitely_accessible
    references:
      - Bin_finitely_accessible

  - property: locally cartesian closed
    proof: If $X \to Y$ is a morphism in $\Bin$ and $Y \in \Bin_{\irr}$, then $X \in \Bin_{\irr}$ as well (since any element in $X$ that relates to itself is mapped to an element in $Y$ that relates to itself). Thus, if $Y$ is any object of $\Bin_{\irr}$, then $\Bin_{\irr} / Y = \Bin / Y$. Hence, the claim follows since <a href="/category/Bin">$\Bin$</a> is locally cartesian closed.

  - property: cokernel pairs
    proof: 'If $X \to Y$ is a morphism in $\Bin$ and $Y \in \Bin_{\irr}$, then $X \in \Bin_{\irr}$ as well. Using this, we can show that $\Bin_{\irr} \subseteq \Bin$ is closed under cokernel pairs. In fact, if $f : X \to Y$ is a morphism in $\Bin_{\irr}$ and $Y \sqcup_X Y$ is the pushout in <a href="/category/Bin">$\Bin$</a>, then the codiagonal $\nabla : Y \sqcup_X Y \to Y$ shows that $Y \sqcup_X Y$ belongs to $\Bin_{\irr}$.'

  - property: coequalizers of kernel pairs
    proof: We already know that kernel pairs exist; in fact, $\Bin_{\irr} \subseteq \Bin$ is closed under kernel pairs. Moreover, <a href="/category/Bin">$\Bin$</a> has coequalizers. We again use the fact that if $X \to Y$ is a morphism in $\Bin$ and $Y \in \Bin_{\irr}$, then $X \in \Bin_{\irr}$ as well. Namely, if $X \to Y$ is a morphism in $\Bin_{\irr}$ and $X \to C$ is the coequalizer of its kernel pair in $\Bin$, then there is a morphism $C \to Y$ (since $X \to Y$ coequalizes its kernel pair), so $C \in \Bin_{\irr}$. We conclude that $X \to C$ is also the coequalizer of the kernel pair in $\Bin_{\irr}$.

  - property: cocartesian cofiltered limits
    proof: This follows from the corresponding property of <a href="/category/Bin">$\Bin$</a> because the inclusion functor $\Bin_{\irr} \hookrightarrow \Bin$ is fully faithful and preserves binary coproducts and cofiltered limits (in fact, all coproducts and all non-empty limits).

  - property: generator
    proof: The object $(\{\ast\},\varnothing)$ is a generator because it represents the forgetful functor $\Bin_{\irr} \to \Set$, $(X,R) \mapsto X$, which is faithful.

  - property: well-copowered
    proof: This follows easily from the description of epimorphisms below.

  - property: effective cocongruences
    proof: >-
      Let $q_1, q_2 : X \rightrightarrows Y$ be a cocongruence in $\Bin_{\irr}$. Then $(q_1;q_2) : X \sqcup X \to Y$ is an epimorphism, i.e. surjective on underlying sets, and hence an epimorphism in $\Bin$. The pushout $Y \sqcup_{q_2,X,q_1} Y$ in $\Bin$ has no loops since, using the common retraction $Y \to X$ of $q_1,q_2$ (the coreflexivity morphism), it admits a morphism to $X$. Therefore, we obtain coreflexivity, cosymmetry, and cotransitivity morphisms in $\Bin_{\irr}$, and these are also such morphisms in $\Bin$. Hence, $q_1, q_2 : X \rightrightarrows Y$ is a cocongruence in $\Bin$. Since <a href="/category/Bin">$\Bin$</a> has effective cocongruences, there is a morphism $T \to X$ whose cokernel pair is $X \rightrightarrows Y$ in $\Bin$. Since $T$ admits a morphism to $X \in \Bin_{\irr}$, we have $T \in \Bin_{\irr}$. It follows that $T \to X$ also has cokernel pair $X \rightrightarrows Y$ in $\Bin_{\irr}$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: semi-strongly connected
    proof: >-
      Interpreting the objects of $\Bin_{\irr}$ as directed graphs without loops, we may use the same counterexample as for <a href="/category/Quiv">$\Quiv$</a>, since directed cycles have no multiple edges and no loops. Concretely, there is no morphism between these two objects:
      $$\begin{align*}
      C_2 & = \bigl(\{0,1\}, \{(0,1),(1,0)\}\bigr) \\
      C_3 & = \bigl(\{0,1,2\}, \{(0,1),(1,2),(2,0)\}\bigr)
      \end{align*}$$
    references:
      - Quiv_not_semi-strongly_connected

  - property: filtered
    proof: >-
      The two morphisms
      $$(\{a\},\varnothing) \rightrightarrows \bigl(\{a,a'\},\{(a,a')\}\bigr)$$
      in $\Bin_{\irr}$ are not coequalized by any morphism, since such a morphism would necessarily identify $a$ and $a'$, and hence would map $a$ to an element that relates to itself.

  - property: quotients of congruences
    proof: >-
      Consider any object $(X,R)$ with $R \neq \varnothing$. The maximal congruence $(X,R) \times (X,R) \rightrightarrows (X,R)$ has no quotient in $\Bin_{\irr}$. In fact, it is not even coequalized by any morphism $f : (X,R) \to (Y,S)$ in $\Bin_{\irr}$. This would be a map $f : X \to Y$ such that $f(x)=f(x')$ for all $(x,x') \in X \times X$ and $(f(x),f(x')) \in S$ for all $(x,x') \in R$. Pick some $(x,x') \in R$. Then $(f(x),f(x)) = (f(x),f(x')) \in S$, which is a contradiction.
    label: Bin_irr_no_quotients_congruences

  - property: extremal generator
    proof: Let $(X,R)$ be any object of $\Bin_{\irr}$. We will prove that $\Hom((X,R),-)$ is not conservative. If $R$ is non-empty, consider the unique morphism from $(\varnothing,\varnothing)$ to $(\{\ast\},\varnothing)$. It is not an isomorphism, but since $(X,R)$ has no morphism to either object, the functor $\Hom((X,R),-)$ maps it to an isomorphism between empty sets. If $R$ is empty, consider the canonical bijective morphism from $(\{a,b\},\varnothing)$ to $(\{a,b\},\{(a,b)\})$. It is not an isomorphism, but $\Hom((X,R),-)$ maps it to the identity of $\Hom(X,\{a,b\})$.
    label: Bin_irr_no_extremal_generator

  - property: cogenerating collection
    proof: >-
      Assume that a cogenerating collection $S$ exists in $\Bin_{\irr}$. Let $\kappa \geq 2$ be a cardinal that is greater than all $\card(Y)$ for $(Y,R) \in S$. Let $X$ be a set of cardinality $\kappa$. Then $(X, (X \times X) \setminus \Delta_X)$ is a valid object of $\Bin_{\irr}$. Any non-trivial permutation of $X$ induces a non-trivial automorphism of it. In particular, there must be a morphism $(X, (X \times X) \setminus \Delta_X) \to (Y,R)$ for some $(Y,R) \in S$. This is a map of sets $f : X \to Y$ such that for all $x \neq x'$ the pair $(f(x),f(x'))$ belongs to $R$, which requires $f(x) \neq f(x')$. Therefore, $f : X \to Y$ is injective, and we obtain the contradiction $\card(X) \leq \card(Y) < \kappa$.
    label: Bin_irr_no_cogenerating_collection

  - property: cofiltered-limit-stable epimorphisms
    proof: We can copy the proof from <a href="/category/Bin">$\Bin$</a>.
    references:
      - Bin_no_cofiltered-limit-stable_epis

special_objects:
  initial object:
    description: $(\varnothing,\varnothing)$, which can be seen as the directed graph with no vertices and no edges
  coproducts:
    description: The coproduct of a family $(X_i,R_i)_{i \in I}$ is $(\coprod_{i \in I} X_i, \coprod_{i \in I} R_i)$, where $\coprod_{i \in I} R_i \subseteq \coprod_{i \in I} (X_i \times X_i) \subseteq \coprod_{i \in I} X_i \times \coprod_{i \in I} X_i$. On the level of directed graphs, this means that we take the disjoint union of vertices and edges, with no edges between distinct components.
  products:
    description: '[non-empty case] The product of a <i>non-empty</i> family $(X_i,R_i)_{i \in I}$ is $(\prod_{i \in I} X_i, \prod_{i \in I} R_i)$, where $\prod_{i \in I} R_i \subseteq \prod_{i \in I} (X_i \times X_i) \cong \prod_i X_i \times \prod_i X_i$.'

special_morphisms:
  isomorphisms:
    description: bijective maps that preserve and reflect the relation
    proof: This is easy to check.
  monomorphisms:
    description: injective relation-preserving maps
    proof: For the non-trivial direction, the construction of pullbacks (or, more generally, all non-empty limits) shows that the forgetful functor $\Bin_{\irr} \to \Bin$ preserves pullbacks, and hence preserves monomorphisms. Moreover, the monomorphisms in <a href="/category/Bin">$\Bin$</a> have already been identified as being injective.
  epimorphisms:
    description: surjective relation-preserving maps
    proof: 'For the non-trivial direction, the construction of cokernel pairs shows that the forgetful functor $\Bin_{\irr} \to \Bin$ preserves cokernel pairs, and hence preserves epimorphisms (using the general fact that $f : X \to Y$ is an epimorphism if and only if $\nabla : Y \sqcup_X Y \to Y$ is an isomorphism). Moreover, the epimorphisms in <a href="/category/Bin">$\Bin$</a> have already been identified as being surjective.'
  regular monomorphisms:
    description: injective maps that reflect and preserve the relation
    proof: 'First of all, we know that the regular monomorphisms in <a href="/category/Bin">$\Bin$</a> have this description. The forgetful functor $\Bin_{\irr} \to \Bin$ preserves equalizers, in fact all non-empty limits (by their construction), and hence preserves regular monomorphisms. This proves one direction. Now assume that $X \to Y$ is a morphism in $\Bin_{\irr}$ that is injective and reflects the relation, i.e. is an embedding. Then it is a regular monomorphism in $\Bin$. Since $\Bin$ has cokernel pairs, it follows that $X \to Y$ is the equalizer of its cokernel pair $Y \rightrightarrows Y \sqcup_X Y$ (see <a href="/morphism-property/effective_monomorphism">here</a>). Since $Y \sqcup_X Y \in \Bin_{\irr}$ (see our proof that cokernel pairs exist), we conclude that $X \to Y$ is also the equalizer of its cokernel pair in $\Bin_{\irr}$.'
  regular epimorphisms:
    description: >-
      morphisms $f : (X,R) \to (Y,S)$ such that $f : X \to Y$ is surjective and $S = \{(f(x),f(x')) : (x,x') \in R\}$
    proof: >-
      Assume first that $f : (X,R) \to (Y,S)$ is a morphism in $\Bin_{\irr}$ such that $f$ is surjective and $S = \{(f(x),f(x')) : (x,x') \in R\}$. Then we already know that $f$ is the coequalizer of its kernel pair in <a href="/category/Bin">$\Bin$</a>. Since the kernel pair is contained in $\Bin_{\irr}$, it is also a coequalizer in $\Bin_{\irr}$.

      Conversely, assume that $f : (X,R) \to (Y,S)$ is a regular epimorphism in $\Bin_{\irr}$. In particular, it is an epimorphism, so that $f : X \to Y$ is surjective by what we have seen before. We may factor $f$ in $\Bin_{\irr}$ as
      $$(X,R) \to (Y,S') \hookrightarrow (Y,S),$$
      where $S' \coloneqq \{(f(x),f(x')) : (x,x') \in R\} \subseteq S$. Here, $(Y,S') \hookrightarrow (Y,S)$ is a monomorphism since the underlying map $\id_Y : Y \to Y$ is injective. Since $f$ is a regular epimorphism, hence an extremal epimorphism, $(Y,S') \hookrightarrow (Y,S)$ must be an isomorphism. That is, we have $S' = S$, as required.
