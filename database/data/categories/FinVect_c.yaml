id: FinVect_c
name: category of finite-dimensional vector spaces [countable field]
notation: $\FinVect_K$
objects: finite-dimensional vector spaces over a countably infinite field $K$
morphisms: linear maps
description: This is the special case of <a href="/category/FinVect">$\FinVect_K$</a> where $K$ is a countably infinite field (e.g. $K = \IQ$). We use this assumption in order to determine all properties of this category.
nlab_link: https://ncatlab.org/nlab/show/FinDimVect
parent: FinVect

tags:
  - algebra

related:
  - Vect
  - Ab_fg
  - FreeAb_fg

satisfied_properties:
  - property: essentially countable
    proof: Every object is isomorphic to $K^n$ for some $n \in \IN$, and $\Hom(K^n,K^m) \cong M_{m \times n}(K)$ is a countable set because $K$ is countable by assumption.

unsatisfied_properties:
  - property: locally finite
    proof: The hom-set $\Hom(K,K) \cong K$ is infinite by assumption.

special_objects: {}

special_morphisms: {}
