id: Met
name: category of metric spaces with non-expansive maps
notation: $\Met$
objects: metric spaces
morphisms: non-expansive maps $f$, meaning $d(f(x),f(y)) \leq d(x,y)$ for all $x,y$
description: In contrast to continuous maps, which only refer to the induced topology, non-expansive maps are closer related to the metrics themselves. This category is badly-behaved, though, especially when compared with $\Met_{\infty}$.
nlab_link: https://ncatlab.org/nlab/show/Met

tags:
  - analysis

related:
  - Ban
  - Met_c
  - Met_oo
  - PMet

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Met \to \Set$ and $\Set$ is locally small.

  - property: strict initial object
    proof: The empty metric space is initial and clearly strict.

  - property: semi-strongly connected
    proof: Every non-empty metric space is weakly terminal (by using constant maps).

  - property: equalizers
    proof: Just restrict the metric to the equalizer built from the sets.

  - property: binary products
    proof: The product of two metric spaces $(X,d)$, $(Y,d)$ is $(X \times Y,d)$ with $d((x_1,y_1),(x_2,x_2)) \coloneqq \sup(d(x_1,x_2),d(y_1,y_2))$.
    check_redundancy: false

  - property: terminal object
    proof: The one-point metric space is terminal.
    check_redundancy: false

  - property: coequalizers
    proof: This is because the category of pseudo-metric spaces <a href="/category/PMet">$\PMet$</a> has coequalizers and $\Met \hookrightarrow \PMet$ has a left adjoint, mapping a pseudo-metric space $X$ to $X /{\sim}$ where $x \sim y \iff d(x,y)=0$. Concretely, we take the coequalizer in the category of pseudo-metric spaces and then identify points with distance zero.

  - property: filtered colimits
    proof: This is because the category of pseudo-metric spaces <a href="/category/PMet">$\PMet$</a> has filtered colimits and $\Met \hookrightarrow \PMet$ has a left adjoint, mapping a pseudo-metric space $X$ to $X /{\sim}$ where $x \sim y \iff d(x,y)=0$. Concretely, we take the filtered colimit in the category of pseudo-metric spaces and then identify points with distance zero.
    check_redundancy: false

  - property: cartesian filtered colimits
    proof: >-
      We already saw that filtered colimits and finite products exist. The canonical map $\colim_i (X \times Y_i) \to X \times \colim_i Y_i$ is an isomorphism for filtered diagrams $(Y_i)$: It is surjective by the concrete description of filtered colimits. It is isometric because of the elementary observation
      $$\textstyle\inf_i \max(r, s_i) = \max(r, \inf_i s_i)$$
      for $r, s_i \in \IR$, where $i \leq j \implies s_i \geq s_j$.
    label: met_cartesian_filtered_colimits

  - property: ℵ₁-cofiltered limits
    proof: >-
      Let $D : \I \to \Met$ be an $\aleph_1$-cofiltered diagram. This diagram has a limit in the complete category <a href="/category/Met_oo">$\Met_\infty$</a>, obtained by equipping the limit of the underlying sets with the supremum metric $d(x,y) = \sup_i d(x_i,y_i)$. It remains to show that $d(x,y) < \infty$.
      Suppose otherwise. Then for every $n \in \IN$ there exists an object $i_n \in \I$ such that $d(x_{i_n},y_{i_n}) \geq n$. Since $\I$ is $\aleph_1$-cofiltered, there exists a cone $(j \to i_n)_{n \in \IN}$. Since the maps $D(j) \to D(i_n)$ are non-expansive, we have
      $$d(x_j,y_j) \geq d(x_{i_n},y_{i_n}) \geq n$$
      for every $n \in \IN$. This is impossible since the metric on $D(j)$ takes only finite values.
    label: met_aleph1_cofiltered_limits

  - property: well-copowered
    proof: 'If $f : X \to Y$ is an epimorphism, then $f(X)$ is dense in $Y$ (see below). Hence, there is an injective map $Y \to X^{\IN}$, which bounds the size of $Y$.'

  - property: extremal generator
    proof: >-
      Let $G$ be the metric space with underlying set $\IR_{\ge 0}$ equipped with the metric where $d(x,y) = 0$ if $x=y$, and otherwise $d(x,y) = x+y$. We claim that $G$ is an extremal generator.

      First, to see that $G$ is a generator, note that the one-point metric space $1$ is a generator since it represents the forgetful functor $\Met \to \Set$ which is faithful. Since we have an epimorphism $! : G \twoheadrightarrow 1$, then $G$ is also a generator.

      Now, suppose that $f : X \to Y$ is a non-expansive map of metric spaces such that $f \circ {-} : \Hom(G, X) \to \Hom(G, Y)$ is a bijection. By considering constant maps from $G$, we see that $f$ is a bijection on underlying sets. Now suppose we have $x_1, x_2 \in X$ with $d(f(x_1), f(x_2)) = \varepsilon > 0$. Then there is a non-expansive map $\varphi : G \to Y$ which maps $\varepsilon$ to $f(x_2)$ and every other element of $\IR_{\ge 0}$ to $f(x_1)$. Therefore, there is a non-expansive map $\psi : G \to X$ such that $\varphi = f \circ \psi$. Since $f$ is injective on underlying sets, we must have $\psi(\varepsilon) = x_2$ and $\psi(0) = x_1$. Hence,
      $$\begin{align*}
      d(x_1, x_2) &= d(\psi(0), \psi(\varepsilon)) \\
      & \le d(0, \varepsilon) \\
      & = \varepsilon \\
      & = d(f(x_1), f(x_2)) \\
      & \le d(x_1, x_2).
      \end{align*}$$
      This shows that $f$ is isometric.
    label: met_extremal_generator

  - property: extremal cogenerator
    proof: >-
      We claim that $\IR_+$ (where $0 \notin \IR+$) with metric inherited from the usual metric on $\IR$ is a cogenerator. Let $a,b \in X$ be two points of a metric space such that $f(a)=f(b)$ for all non-expansive maps $f : X \to \IR_+$. This applies in particular to $f(x) \coloneqq d(a,x)+1$ and shows that $1=d(a,a)+1=d(a,b)+1$, so that $a=b$.

      In fact, $\IR_+$ is an extremal cogenerator. To see this, suppose that $f : X \to Y$ is a non-expansive map of metric spaces such that ${-} \circ f : \Hom(Y, \IR_+) \to \Hom(X, \IR_+)$ is a bijection. First of all, since ${-} \circ f$ is injective and $\IR_+$ is a cogenerator, $f$ is an epimorphism, so it has dense image (see below). Now for each $x \in X$, we have a non-expansive map
      $$\varphi : X \to \IR_+, \,x' \mapsto d(x, x') + 1.$$
      By the assumption, there exists a non-expansive map $\psi : Y \to \IR_+$ such that $\psi \circ f = \varphi$. Therefore,
      $$\begin{align*}
      d(x, x') &= |d(x, x') - d(x, x)| \\
      & = |\varphi(x') - \varphi(x)| \\
      & = |\psi(f(x')) - \psi(f(x))| \\
      & \le d(f(x), f(x')) \\
      & \le d(x,x').
      \end{align*}$$
      This shows that $f$ is isometric, which in particular implies $f$ is injective on underlying sets.

      It remains to show $f$ is surjective on underlying sets. To see this, suppose to the contrary that we have $y \in Y \setminus f(X)$. Then we have a non-expansive map
      $$\varphi : X \to \IR_+,\, x \mapsto d(y, f(x)).$$
      By the assumption on $f$, there exists a non-expansive map $\psi : Y \to \IR_+$ such that $\psi \circ f = \varphi$. However, since $\psi$ (seen as a function with codomain $\IR$) and $d(y, {-})$ are two continuous functions $Y \to \IR$ which agree on the dense subset $f(X)$, they must be the same function. Thus, $\psi(y) = d(y, y) = 0$, giving a contradiction.


      Note: $\IR$ is not an extremal cogenerator. This is because for example the non-isomorphism $(0, 1) \hookrightarrow [0, 1]$ induces a bijection $\Hom([0, 1], \IR) \to \Hom((0, 1), \IR)$. To see this, suppose we have a non-expansive map $f : (0, 1) \to \IR$. Then since $f$ is uniformly continuous in particular, it is well known that $\lim_{x\to 0^+} f(x)$ and $\lim_{x\to 1^-} f(x)$ both exist and are finite. If we extend $f$ with these values at 0 and 1 respectively, then it is straightforward to check that the resulting function is still non-expansive. This shows that $\Hom([0, 1], \IR) \to \Hom((0, 1), \IR)$ is surjective; and since $(0, 1) \hookrightarrow [0, 1]$ is an epimorphism, $\Hom([0, 1], \IR) \to \Hom((0, 1), \IR)$ is also injective. (The same proof also shows that $\IR_{\ge 0}$ is not an extremal cogenerator.)
    label: met_extremal_cogenerator

  - property: ℵ₁-accessible
    proof: >-
      For $\alpha=n$ or $\alpha=\infty$, let $I_\alpha$ denote the metric space (with $\infty$ allowed) consisting of exactly two points at distance $\alpha$.
      Let $e_n : I_\infty \to I_n$ be the identity-on-points morphism in $\Met_\infty$. Then $M \in \Met_\infty$ belongs to $\Met$ iff every morphism $I_\infty \to M$ factors through some $e_n$. In other words, using the terminology from Section 4.B of <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a>, the category $\Met$ is precisely the cone-injectivity class with respect to the cone $(e_n)_{n \in \IN}$ in $\Met_\infty$. Since <a href="/category/Met_oo">$\Met_\infty$</a> is accessible, this already implies that $\Met$ is accessible by Prop. 4.16 in loc. cit., but an additional argument below is needed to show $\aleph_1$-accessibility.

      It is known that an object in $\Met_\infty$ is $\aleph_1$-presentable iff the underlying set is countable (see Lem. 2.6 in <a href="https://doi.org/10.1016/j.jpaa.2021.106974" target="_blank">Approximate injectivity and smallness in metric-enriched categories</a> by Adamek-Rosicky).
      In particular, the metric space $I_\infty$ is $\aleph_1$-presentable in $\Met_\infty$, which straightforwardly implies that the cone-injectivity class $\Met\subseteq\Met_\infty$ is closed under $\aleph_1$-filtered colimits.
      Then, countable metric spaces in $\Met$ are $\aleph_1$-presentable not only in $\Met_\infty$, but also in $\Met$.
      On the other hand, every object in $\Met_\infty$ is an $\aleph_1$-filtered colimit of its countable isometric subspaces, and the same is true in $\Met$.
      Hence, $\Met$ is $\aleph_1$-accessible.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: essentially small
    proof: This is trivial.

  - property: locally finite
    proof: This is obvious.

  - property: strict terminal object
    proof: This is trivial.

  - property: balanced
    proof: The inclusion $\IQ \hookrightarrow \IR$ is a counterexample; it is an epimorphism since $\IQ$ is dense in $\IR$. Alternatively, consider the identity map $(X,2d) \to (X,d)$ for any non-trivial metric space $(X,d)$.

  - property: Malcev
    proof: 'Consider the metric subspace $\{(a,b) \in \IR^2 : a \leq b\}$ of $\IR^2$.'

  - property: countable powers
    proof: 'Assume that the power $P = \IR^{\IN}$ exists, where $\IR$ has the usual metric. Since the forgetful functor $\Met \to \Set$ is representable, it preserves limits, powers in particular. Thus, we may assume that $P$ is the set of sequences of numbers and that the projections $p_n : P \to \IR$ are given by $p_n(x) = x_n$. Now consider the sequences $x = (n)_n$ and $y = (0)_n$. Since each $p_n$ is non-expansive, we get $d(x,y) \geq d(p_n(x),p_n(y)) = d(n,0) = n$. But then $d(x,y) = \infty$, a contradiction.'

  - property: binary copowers
    proof: The coproduct of two non-empty metric spaces does not exist, see <a href="https://math.stackexchange.com/questions/1778408" target="_blank">MSE/1778408</a>. For example, the copower $\IR \sqcup \IR$ does not exist. We only get coproducts when allowing $\infty$ as a distance, as in <a href="/category/Met_oo">$\Met_{\infty}$</a>.

  - property: cartesian closed
    proof: This is proven in <a href="https://math.stackexchange.com/questions/5131457" target="_blank">MSE/5131457</a>.

  - property: filtered-colimit-stable monomorphisms
    proof: >-
      The following example is taken from Rem. 2.7 in <a href="https://doi.org/10.1016/j.jpaa.2021.106974" target="_blank">Approximate injectivity and smallness in metric-enriched categories</a> by Adamek-Rosicky.
      For $n \geq 1$ let $X_n$ denote the metric space with underlying set $\{0,1\}$ in which $0,1$ have distance $1/n$. We have bijective non-expansive maps $X_n \to X_{n+1}$, $x \mapsto x$. The colimit of this sequence in <a href="/category/PMet">$\PMet$</a> is $\{0,1\}$ where $0,1$ have distance $0$, so the colimit in $\Met$ collapses to $\{0\}$. Therefore, the colimit of the monomorphisms $X_1 \to X_n$, $x \mapsto x$ is the non-injective map $X_1 \to \{0\}$.
    label: met_no_filtered_colimit_stable_monos

  - property: natural numbers object
    proof: >-
      If $(N,z,s)$ is a natural numbers object in $\Met$, then
      $$1 \xrightarrow{z} N \xleftarrow{s} N$$
      is a coproduct cocone by <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, Part A, Lemma 2.5.5. Since there is a map $1 \to N$, we have $N \neq \varnothing$. However, the coproduct of two non-empty metric spaces does not exist, see <a href="https://math.stackexchange.com/questions/1778408" target="_blank">MSE/1778408</a>.

  - property: effective congruences
    proof: 'Any kernel pair of $h : X \to Z$ in $\Met$ corresponds to a closed subset of $X\times X$. However, there are plenty of non-closed congruences, such as $\Delta \cup (\IQ \times \IQ) \subseteq \IR \times \IR$ with the subspace metric.'

  - property: effective cocongruences
    proof: >-
      We will define a cocongruence on the interval $(0,1) \subseteq \IR$ where $E \coloneqq (-1, 0) \cup (0, 1) \subseteq \IR$, and the two maps $(0, 1) \rightrightarrows E$ are the inclusion map and $x \mapsto -x$. Then for any metric space $X$, the induced relation on non-expansive maps $(0, 1) \to X$ is that $f \sim g$ if and only if
      $$d(f(x), g(y)) \le x+y$$
      for each $x, y \in (0, 1)$. This is reflexive since $d(f(x), f(y)) \le |x-y| < x+y$, and it is clearly symmetric. For transitivity, suppose $f\sim g$ and $g\sim h$. Then for any $\varepsilon > 0$, we have
      $$d(f(x), h(y)) \le d(f(x), g(\varepsilon)) + d(g(\varepsilon), h(y)) \le (x + \varepsilon) + (y + \varepsilon).$$
      Since this holds for every $\varepsilon > 0$, we conclude $d(f(x), h(y)) \le x+y$.
      On the other hand, if this cocongruence were effective, then by the dual of <a href="/content/effective-congruence-quotients">this result</a>, it would be the cokernel pair of the equalizer of the two inclusion maps. However, that equalizer is empty, so $E$ would have to be a binary copower of $(0,1)$, which does not exist in $\Met$.
    label: met_no_effective_cocongruences

  - property: regular
    proof: We can take the same counterexample as for <a href="/category/PMet">$\PMet$</a>.
    references:
      - pmet_not_regular

special_objects:
  initial object:
    description: empty metric space
  terminal object:
    description: singleton space
  products:
    description: '[finite case] direct products with the metric $d(x,y) = \sup_i d_i(x_i,y_i)$'

special_morphisms:
  isomorphisms:
    description: bijective isometries
    proof: This is easy.
  monomorphisms:
    description: injective non-expansive maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphisms:
    description: non-expansive maps with dense image
    proof: See <a href="https://math.stackexchange.com/questions/937387" target="_blank">MSE/937387</a>.
