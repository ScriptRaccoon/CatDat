id: Met
name: category of metric spaces with non-expansive maps
notation: $\Met$
objects: >-
  A metric space is a pair $(X,d_X)$ consisting of a set $X$ and a map $d_X : X \times X \to [0,\infty)$ such that $d_X(x,y) = 0$ holds if and only if $x = y$, $d_X(x,y) = d_X(y,x)$, and $d_X(x,z) \leq d_X(x,y) + d_X(y,z)$ for all $x,y,z \in X$.
morphisms: >-
  A morphism $(X,d_X) \to (Y,d_Y)$ is a non-expansive map (also called short map or $1$-Lipschitz map), i.e. a map $f : X \to Y$ such that $d_Y(f(x),f(x')) \leq d_X(x,x')$ for all $x,x' \in X$.
description: >-
  In contrast to continuous maps, which only refer to the induced topology, non-expansive maps are more closely related to the metrics themselves. This category is badly behaved, though, especially when compared with $\Met_{\infty}$: since the distance $\infty$ is not allowed, it lacks, for example, binary coproducts (where points in different summands would have distance $\infty$) and countable products (where the supremum of the distances may be $\infty$).

  The inclusion of $\Met$ into the category <a href="/category/PMet">$\PMet$</a> of pseudo-metric spaces has a left adjoint $L : \PMet \to \Met$. It maps a pseudo-metric space $(X,d_X)$ to the metric space $(X/{\sim},\bar{d}_X)$, where $x \sim y \iff d_X(x,y) = 0$ and $\bar{d}_X([x],[y]) \coloneqq d_X(x,y)$.
nlab_link: https://ncatlab.org/nlab/show/Met
keywords:
  - short maps
  - 1-Lipschitz maps

tags:
  - analysis

related:
  - Ban
  - Met_c
  - Met_oo
  - PMet

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Met \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: strict initial object
    proof: The empty set $\varnothing$ with its unique metric is initial and clearly strict.

  - property: semi-strongly connected
    proof: Every non-empty metric space is weakly terminal (by using constant maps).

  - property: equalizers
    proof: Just restrict the metric to the equalizer built from the sets.

  - property: binary products
    proof: The product of two metric spaces $(X,d_X)$, $(Y,d_Y)$ is $(X \times Y,d)$ with $d((x_1,y_1),(x_2,y_2)) \coloneqq \sup(d_X(x_1,x_2),d_Y(y_1,y_2))$.
    check_redundancy: false

  - property: terminal object
    proof: The one-point set $\{\ast\}$ with its unique metric is terminal. We denote this metric space by $\{\ast\}$ as well.
    check_redundancy: false

  - property: coequalizers
    proof: This is because <a href="/category/PMet">$\PMet$</a> has coequalizers and the inclusion $\Met \hookrightarrow \PMet$ has the left adjoint $L$ (see the description). Concretely, we take the coequalizer in $\PMet$ and then apply $L$, i.e. identify points with distance $0$.

  - property: filtered colimits
    proof: This is because <a href="/category/PMet">$\PMet$</a> has filtered colimits and the inclusion $\Met \hookrightarrow \PMet$ has the left adjoint $L$ (see the description). Concretely, we take the filtered colimit in $\PMet$ and then apply $L$, i.e. identify points with distance $0$.
    check_redundancy: false

  - property: cartesian filtered colimits
    proof: >-
      We already saw that filtered colimits and finite products exist. The canonical map $\colim_i (M \times N_i) \to M \times \colim_i N_i$ is an isomorphism for filtered diagrams $(N_i)$: It is surjective by the concrete description of filtered colimits. It is isometric because of the elementary observation
      $$\textstyle\inf_i \max(r, s_i) = \max(r, \inf_i s_i)$$
      for $r, s_i \in \IR$, where $i \leq j \implies s_i \geq s_j$.
    label: Met_cartesian_filtered_colimits

  - property: ℵ₁-cofiltered limits
    proof: >-
      Let $D : \I \to \Met$ be an $\aleph_1$-cofiltered diagram with $D(i) = (X_i,d_i)$. By the proof for <a href="/category/PMet">$\PMet$</a>, its limit in $\PMet$ is $(X,d)$, where $X$ is the limit of the sets $X_i$, with projections $p_i : X \to X_i$, and $d(x,y) = \sup_{i \in \I} d_i(p_i(x),p_i(y))$. This is a metric: if $d(x,y) = 0$, then $d_i(p_i(x),p_i(y)) = 0$, hence $p_i(x) = p_i(y)$ for all $i \in \I$, which means $x = y$. Since $\Met$ is a full subcategory of $\PMet$, it follows that $(X,d)$ is also the limit in $\Met$.
    references:
      - PMet_aleph1_cofiltered_limits

  - property: ℵ₁-accessible
    proof: >-
      We use the proof for <a href="/category/PMet">$\PMet$</a>. Let $(X_i,d_i)_{i \in I}$ be a diagram of metric spaces indexed by an $\aleph_1$-directed poset $I$, and let $(u_i : (X_i,d_i) \to (X,d))_{i \in I}$ be its colimit in $\PMet$. We claim that $d$ is a metric. Let $x,y \in X$ with $d(x,y) = 0$. By the claim in the proof for $\PMet$, applied to $S \coloneqq \{x,y\}$, there are $k \in I$ and preimages $x_k,y_k \in X_k$ of $x,y$ with $d_k(x_k,y_k) = d(x,y) = 0$. Since $d_k$ is a metric, we get $x_k = y_k$, and hence $x = y$. Since $\Met$ is a full subcategory of $\PMet$, it follows that $(X,d)$ is also the colimit in $\Met$. (This fails for $\aleph_0$-directed colimits, see the example for filtered-colimit-stable monomorphisms below.)

      Consequently, every countable metric space is $\aleph_1$-presentable in $\Met$, since it is $\aleph_1$-presentable in $\PMet$. Likewise, every metric space is the $\aleph_1$-directed colimit of its countable subspaces in $\Met$, since this holds in $\PMet$. Hence, $\Met$ is $\aleph_1$-accessible.
    label: Met_aleph1_accessible
    references:
      - PMet_aleph1_accessible
      - Met_no_filtered_colimit_stable_monos

  - property: well-copowered
    proof: 'If $f : (X,d_X) \to (Y,d_Y)$ is an epimorphism, then $f(X)$ is dense in $Y$ (see below). Hence, there is an injective map $Y \to X^{\IN}$, which bounds the size of $Y$.'

  - property: extremal generator
    proof: >-
      The extremal generator of <a href="/category/PMet">$\PMet$</a> is $\IR_{\geq 0} \sqcup \{0'\}$, where distinct $x,y \in \IR_{\geq 0}$ have distance $x+y$ and $x$ has distance $x$ to $0'$. The inclusion $\Met \hookrightarrow \PMet$ is fully faithful and has the left adjoint $L$ (see the description). By Lemma 9 <a href="/content/subcategories">here</a>, $L$ maps the extremal generator of $\PMet$ to an extremal generator of $\Met$. It identifies $0$ and $0'$, which yields $\IR_{\geq 0}$, where distinct $x,y$ have distance $x+y$.
    references:
      - PMet_extremal_generator

  - property: extremal cogenerator
    proof: >-
      Let $d$ be the usual metric on $\IR$ and its restrictions to subsets of $\IR$. We claim that $(\IR_+,d)$ (where $0 \notin \IR_+$) is a cogenerator. Let $(X,d_X)$ be a metric space and $a,b \in X$ be two points such that $f(a)=f(b)$ for all morphisms $f : (X,d_X) \to (\IR_+,d)$. This applies in particular to $f(x) \coloneqq d_X(a,x)+1$ and shows that $1=d_X(a,a)+1=d_X(a,b)+1$, so that $a=b$.

      In fact, $(\IR_+,d)$ is an extremal cogenerator. To see this, suppose that $f : (X,d_X) \to (Y,d_Y)$ is a morphism such that
      $${-} \circ f : \Hom((Y,d_Y), (\IR_+,d)) \to \Hom((X,d_X), (\IR_+,d))$$
      is a bijection. First of all, since ${-} \circ f$ is injective and $(\IR_+,d)$ is a cogenerator, $f$ is an epimorphism, so it has dense image (see below). Now for each $x \in X$, we have a morphism
      $$\varphi : (X,d_X) \to (\IR_+,d), \quad x' \mapsto d_X(x, x') + 1.$$
      By the assumption, there exists a morphism $\psi : (Y,d_Y) \to (\IR_+,d)$ such that $\psi \circ f = \varphi$. Therefore,
      $$\begin{align*}
      d_X(x, x') &= |d_X(x, x') - d_X(x, x)| \\
      & = |\varphi(x') - \varphi(x)| \\
      & = |\psi(f(x')) - \psi(f(x))| \\
      & \le d_Y(f(x), f(x')) \\
      & \le d_X(x,x').
      \end{align*}$$
      This shows that $f$ is isometric, which in particular implies that $f : X \to Y$ is injective.

      It remains to show that $f : X \to Y$ is surjective. To see this, suppose to the contrary that we have $y \in Y \setminus f(X)$. Then we have a morphism
      $$\varphi : (X,d_X) \to (\IR_+,d), \quad x \mapsto d_Y(y, f(x)).$$
      By the assumption on $f$, there exists a morphism $\psi : (Y,d_Y) \to (\IR_+,d)$ such that $\psi \circ f = \varphi$. However, since $\psi$ (seen as a function with codomain $\IR$) and $d_Y(y, {-})$ are two continuous functions $Y \to \IR$ which agree on the dense subset $f(X)$, they must be the same function. Thus, $\psi(y) = d_Y(y, y) = 0$, giving a contradiction.

      Note: $(\IR,d)$ is not an extremal cogenerator. For example, the inclusion $((0, 1),d) \hookrightarrow ([0, 1],d)$ is not an isomorphism, but every non-expansive map $((0, 1),d) \to (\IR,d)$ extends uniquely to a non-expansive map $([0, 1],d) \to (\IR,d)$. To see this, let $f : ((0, 1),d) \to (\IR,d)$ be a non-expansive map. Then since $f$ is uniformly continuous in particular, it is well known that $\lim_{x\to 0^+} f(x)$ and $\lim_{x\to 1^-} f(x)$ both exist and are finite. If we extend $f$ with these values at 0 and 1 respectively, then it is straightforward to check that the resulting function is still non-expansive. The extension is unique since $(0, 1)$ is dense in $[0, 1]$. (The same proof also shows that $(\IR_{\ge 0},d)$ is not an extremal cogenerator.)
    label: Met_extremal_cogenerator

unsatisfied_properties:
  - property: skeletal
    proof: The metric spaces with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: locally finite
    proof: This is obvious.

  - property: balanced
    proof: Let $d$ be the usual metric on $\IR$ and its restriction to $\IQ$. The inclusion $(\IQ,d) \hookrightarrow (\IR,d)$ is a counterexample; it is an epimorphism since $\IQ$ is dense in $\IR$. Alternatively, consider the identity map $(X,2d) \to (X,d)$ for any non-trivial metric space $(X,d)$.
    label: Met_not_balanced

  - property: Malcev
    proof: 'Let $d$ be the usual metric on $\IR$. Consider the relation $(S,d_S)$ on $(\IR,d)$, where $S \coloneqq \{(a,b) \in \IR^2 : a \leq b\}$ and $d_S$ is the restriction of the product metric.'
    label: Met_not_malcev

  - property: countable powers
    proof: The inclusion $\Met \hookrightarrow \PMet$ has the left adjoint $L$ (see the description), hence preserves limits. Let $d$ be the usual metric on $\IR$. If a power of countably many copies of $(\IR,d)$ existed in $\Met$, it would also be a power in <a href="/category/PMet">$\PMet$</a>. But the proof for $\PMet$ shows that this power does not exist.
    references:
      - PMet_no_countable_powers

  - property: binary copowers
    proof: The coproduct of two non-empty metric spaces does not exist; see <a href="https://math.stackexchange.com/questions/1778408">MSE/1778408</a>. For example, the binary copower of $(\IR,d)$, where $d$ is the usual metric, does not exist. We only get coproducts when allowing $\infty$ as a distance, as in <a href="/category/Met_oo">$\Met_{\infty}$</a>.

  - property: cartesian closed
    proof: This is proven in <a href="https://math.stackexchange.com/questions/5131457">MSE/5131457</a>.

  - property: filtered-colimit-stable monomorphisms
    proof: >-
      The following example is taken from <a href="https://doi.org/10.1016/j.jpaa.2021.106974">Adámek–Rosický</a>, Rem. 2.7.
      For $n \geq 1$ let $X_n$ denote the metric space with underlying set $\{0,1\}$ in which $0,1$ have distance $1/n$. We have bijective non-expansive maps $X_n \to X_{n+1}$, $x \mapsto x$. The colimit of this sequence in <a href="/category/PMet">$\PMet$</a> is $\{0,1\}$ where $0,1$ have distance $0$, so the colimit in $\Met$ collapses to $\{0\}$. Therefore, the colimit of the monomorphisms $X_1 \to X_n$, $x \mapsto x$ is the non-injective map $X_1 \to \{0\}$.
    label: Met_no_filtered_colimit_stable_monos

  - property: natural numbers object
    proof: By Lemma 2 <a href="/content/natural_numbers_objects">here</a>, if $(N,z,s)$ is a natural numbers object, then $N \cong \{\ast\} \sqcup N$. Since there is a map $\{\ast\} \to N$, we have $N \neq \varnothing$. However, the coproduct of two non-empty metric spaces does not exist; see <a href="https://math.stackexchange.com/questions/1778408">MSE/1778408</a>.

  - property: effective congruences
    proof: 'Any kernel pair of a morphism $h : (X,d_X) \to (Z,d_Z)$ in $\Met$ corresponds to a closed subset of $X \times X$. However, there are plenty of non-closed congruences, such as $(R,d_R)$ on $(\IR,d)$, where $d$ is the usual metric, $R \coloneqq \Delta \cup (\IQ \times \IQ) \subseteq \IR \times \IR$, and $d_R$ is the restriction of the product metric. Alternatively, the proof for <a href="/category/PMet">$\PMet$</a> works verbatim, since all spaces involved there are metric spaces.'
    references:
      - PMet_no_effective_congruences

  - property: effective cocongruences
    proof: >-
      Let $d$ be the usual metric on $\IR$ and its restrictions to subsets of $\IR$. We will define a cocongruence on $((0,1),d)$ given by $(C,d)$, where $C \coloneqq (-1, 0) \cup (0, 1) \subseteq \IR$, and the two maps $((0, 1),d) \rightrightarrows (C,d)$ are the inclusion map and $x \mapsto -x$. Then for any metric space $(X,d_X)$, the induced relation on non-expansive maps $((0, 1),d) \to (X,d_X)$ is that $f \sim g$ if and only if
      $$d_X(f(x), g(y)) \le x+y$$
      for each $x, y \in (0, 1)$. This is reflexive since $d_X(f(x), f(y)) \le |x-y| < x+y$, and it is clearly symmetric. For transitivity, suppose $f\sim g$ and $g\sim h$. Then for any $\varepsilon > 0$, we have
      $$d_X(f(x), h(y)) \le d_X(f(x), g(\varepsilon)) + d_X(g(\varepsilon), h(y)) \le (x + \varepsilon) + (y + \varepsilon).$$
      Since this holds for every $\varepsilon > 0$, we conclude $d_X(f(x), h(y)) \le x+y$.
      On the other hand, if this cocongruence were effective, then by the dual of <a href="/content/effective-congruence-quotients">this result</a>, it would be the cokernel pair of the equalizer of the two inclusion maps. However, that equalizer is empty, so $(C,d)$ would have to be a binary copower of $((0,1),d)$, which does not exist in $\Met$.
    label: Met_no_effective_cocongruences

  - property: pullback-stable regular epimorphisms
    proof: We can take the same counterexample as for <a href="/category/PMet">$\PMet$</a>.
    references:
      - PMet_not_regular

  - property: regular subobject classifier
    proof: >-
      Assume that $\top : \{\ast\} \to (\Omega,d_\Omega)$ is a regular subobject classifier. We can identify $\top$ with a point $\top \in \Omega$. Then for every metric space $(X,d_X)$ and every regular monomorphism into it, which we may assume to be an inclusion $(Y,d_Y) \hookrightarrow (X,d_X)$, where $Y \subseteq X$ and $d_Y$ is the restriction of $d_X$, there is a unique morphism $f : (X,d_X) \to (\Omega,d_\Omega)$ such that $f^*(\{\top\}) = Y$.

      The set $\Omega$ is identified with $\Hom(\{\ast\},(\Omega,d_\Omega)) \cong \Sub_{\reg}(\{\ast\})$. There are two regular subobjects of $\{\ast\}$, namely $\{\ast\} \subseteq \{\ast\}$ and $\varnothing \subseteq \{\ast\}$ (the latter being the equalizer of, say, two maps $\{\ast\} \rightrightarrows \{0,1\}$). Thus, $\Omega$ has exactly two points, so that $d_\Omega$ induces the discrete topology. In particular, $\{\top\}$ is clopen in $\Omega$. Since $f$ is continuous, the universal property then implies that every subset $Y \subseteq X$ as above is clopen in $X$. But this is not the case: for example, with the standard metric $d$ on $\IR$, the inclusion $([0,\infty),d) \hookrightarrow (\IR,d)$ is the equalizer of $\id : (\IR,d) \to (\IR,d)$ and the absolute value function $|{-}| : (\IR,d) \to (\IR,d)$.
    label: Met_no_regular_subobject_classifier

  - property: coaccessible
    proof: >-
      We use the proof for <a href="/category/PMet">$\PMet$</a>. The diagram $D$ defined there takes values in $\Met$, and its limit in $\PMet$, the empty space, is a metric space. Since $\Met$ is a full subcategory of $\PMet$, it is also the limit in $\Met$. The rest of the proof is identical.
    references:
      - PMet_not_coaccessible

special_objects:
  initial object:
    description: empty set with its unique metric
  terminal object:
    description: one-point set with its unique metric
  products:
    description: '[finite case] $(\prod_i X_i,d)$ for metric spaces $(X_i,d_i)$, where $d(x,y) = \sup_i d_i(x_i,y_i)$'

special_morphisms:
  isomorphism:
    description: bijective isometries
    proof: This is easy.
  monomorphism:
    description: injective non-expansive maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphism:
    description: non-expansive maps with dense image
    proof: See <a href="https://math.stackexchange.com/questions/937387">MSE/937387</a>.
  regular monomorphism:
    description: isometric embeddings with closed image
    proof: 'The same proof as for <a href="/category/Met_c">$\Met_\c$</a> works. The only difference is that the equalizer of two morphisms $(X,d_X) \rightrightarrows (Y,d_Y)$ in $\Met$ is $(E,d_E)$, where $E \subseteq X$ is the equalizer of the underlying maps and $d_E$ is the restriction of $d_X$, so equalizers are isometric embeddings. For the converse, note that the maps used there, the constant maps $X \to \IR$ and $d_X(A,-) : X \to \IR$ are non-expansive with respect to the usual metric on $\IR$.'
