id: PreOrd
name: category of preordered sets
notation: $\PreOrd$
objects: preordered sets, i.e. sets equipped with a reflexive, transitive relation
morphisms: order-preserving functions
description: Even though there are many similarities with $\Pos$, the main difference is that the forgetful functor $\PreOrd \to \Set$ has a right adjoint, mapping $X$ to $(X , X \times X)$ (chaotic preorder).
nlab_link: https://ncatlab.org/nlab/show/PreOrd

tags:
  - order theory

related:
  - Pos
  - Mono
  - Cat

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\PreOrd \to \Set$ and $\Set$ is locally small.

  - property: locally finitely presentable
    proof: The same proof as for <a href="/category/Pos">$\Pos$</a> works, cf. <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories" target="_blank">Adamek-Rosicky</a>, Example 1.10.
    references:
      - pos_lfp

  - property: cartesian closed
    proof: For preordered sets $P,Q$ we endow $\Hom(P,Q)$ with the preorder in which $f \leq g$ holds iff $f(p) \leq g(p)$ for all $p \in P$. The universal evaluation map is $\Hom(P,Q) \times P \to Q$, $(f,p) \mapsto f(p)$, it is order-preserving, and it satisfies the universal property.

  - property: semi-strongly connected
    proof: Every non-empty preordered set is weakly terminal (by using constant maps).

  - property: infinitary extensive
    proof: 'This can be deduced from the infinitary extensivity of <a href="/category/Set">$\Set$</a> as follows. We already know that coproducts and pullbacks exist, and these are preserved by the forgetful functor to $\Set$. More concretely, coproducts are disjoint unions of the underlying sets equipped with the evident partial order that leaves the distinct summands incomparable. Since coproducts are disjoint in $\Set$ and the empty set has a unique preorder, it follows immediately that coproducts are disjoint in $\PreOrd$ as well. It remains to show that coproducts are stable under pullbacks. Let $(P_i)_{i \in I}$ be a family of preordered sets and let $f : T \to \coprod_{i \in I} P_i$ be an order-preserving map. Consider the pullbacks $T_i \coloneqq f^*(P_i)$. These are just the preimages of $P_i$ under $f$, with the partial order induced from $T$. Since coproducts in $\Set$ are stable under pullbacks, the canonical order-preserving map $\coprod_{i \in I} T_i \to T$ is bijective. It remains to show that it is order-reflecting. Since each $T_i \to T$ is order-reflecting, this amounts to proving that, for $x \in T_i$ and $y \in T_j$ with $i \neq j$, we never have $x \leq y$ in $T$. But such a relation would imply $f(x) \leq f(y)$ in $\coprod_{i \in I} P_i$, where $f(x) \in P_i$ and $f(y) \in P_j$, which contradicts the concrete description of the coproduct.'

  - property: coregular
    proof: See <a href="https://math.stackexchange.com/questions/5130295" target="_blank">MSE/5130295</a>.

  - property: regular subobject classifier
    proof: The set $\{0,1\}$ with the chaotic preorder $(0 \leq 1$, $1 \leq 0)$ is a regular subobject classifier since order-preserving maps $P \to \{0,1\}$ correspond to subsets of $P$.

  - property: extremal generator
    proof: 'We claim that $\{ 0 < 1 \}$ is an extremal generator. First, the singleton preordered set $1$ is a generator, since it represents the forgetful functor $\PreOrd \to \Set$ which is faithful. Since we have an epimorphism $\{ 0 < 1 \} \to 1$, it follows that $\{ 0 < 1 \}$ is also a generator. Now, suppose we have a morphism $f : P \to Q$ such that $f \circ {-} : \Hom(\{0<1\}, P) \to \Hom(\{0<1\}, Q)$ is a bijection. Then considering constant functions, we can see that $f$ must be a bijection on the underlying sets. Now, suppose we have $p_1, p_2 \in P$ such that $f(p_1) \le f(p_2)$. Then that induces a morphism $\{0,1\} \to Q$ with $0 \mapsto f(p_1), 1 \mapsto f(p_2)$. The corresponding morphism $\{0<1\}\to P$ must send $0\mapsto p_1, 1 \mapsto p_2$, showing that $p_1 \le p_2$. It follows that $f$ is an isomorphism.'
    label: preord_extremal_generator

  - property: extremal cogenerator
    proof: >-
      Endow the set $\{ 0,1 \}$ with the preorder $0 \leq 1$, $1 \leq 0$ (which is not a partial order), and call this object $\{0,1\}_c$. Then every map $P \to \{0,1\}$ is order-preserving. Therefore, $\{0,1\}_c$ represents the functor taking $(P, \le)$ to the power set of $P$. Now since the set $\{ 0,1 \}$ is a cogenerator in $\Set$, it follows that $\{0,1\}_c$ is a cogenerator of $\PreOrd$.

      We now claim that $\{0,1\}_c$ together with $\{ 0 < 1 \}$ form an extremal cogenerating set. Thus, suppose we have a morphism $f : P \to Q$ such that ${-} \circ f$ induces a bijection for morphisms both to $\{0,1\}_c$ and to $\{ 0 < 1 \}$. Then since $\{0,1\}$ is an extremal cogenerator in $\Set$, it follows that $f$ is a bijection on the underlying sets. Now, suppose we have $p_1, p_2 \in P$ such that $f(p_1) \le f(p_2)$. Then we can define an increasing function $\varphi : P \to \{0<1\}$ which sends $p \mapsto 1$ if $p_1 \le p$, and $p \mapsto 0$ otherwise. By the assumption on $f$, there is an increasing function $\psi : Q \to \{0<1\}$ such that $\psi \circ f = \varphi$. Since $1 = \psi(f(p_1)) \le \psi(f(p_2))$, it follows that $\varphi(p_2) = 1$, so $p_1 \le p_2$. We conclude that $f$ is an isomorphism.

      Finally, by <a href="/content/generator_construction">this result</a>, we can conclude that the product of $\{0,1\}_c$ and $\{0<1\}$ is an extremal cogenerator.

unsatisfied_properties:
  - property: regular
    proof: See Example 3.14 at the <a href="https://ncatlab.org/nlab/show/regular+category" target="_blank">nLab</a>.

  - property: skeletal
    proof: This is trivial.

  - property: co-Malcev
    proof: 'See <a href="https://mathoverflow.net/questions/509552">MO/509552</a>: Consider the forgetful functor $U : \PreOrd \to \Set$ and the relation $R \subseteq U^2$ defined by $R(A) \coloneqq \{(a,b) \in U(A)^2 : a \leq b\}$. Both are representable: $U$ by the singleton preordered set and $R$ by $\{0 \leq 1 \}$. It is clear that $R$ is reflexive, but not symmetric.'

  - property: cofiltered-limit-stable epimorphisms
    proof: We know that <a href="/category/Set">$\Set$</a> does not have this property. Now use the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> applied to the functor $\Set \to \PreOrd$ that equips a set with the chaotic preorder.

  - property: effective cocongruences
    proof: 'Consider the preordered set $E \coloneqq \{ a, b \}$ with the chaotic preorder. This represents the functor which sends a preordered set to the pairs of elements $x,y$ with $x \le y$ and $y \le x$. Therefore, it defines a cocongruence $1 \rightrightarrows E$, where the maps are the two possible functions. However, this cannot be effective: for any map $h : Z \to 1$ which equalizes the two functions, $Z$ must be empty. But that means the cokernel pair of $h$ is the two-element preordered set with the trivial preorder.'

special_objects:
  initial object:
    description: empty preordered set
  terminal object:
    description: singleton preordered set
  coproducts:
    description: disjoint union with the obvious preorder that leaves the distinct summands incomparable
  products:
    description: direct products with the evident preorder

special_morphisms:
  isomorphisms:
    description: bijective functions that are order-preserving and order-reflecting
    proof: This is easy.
  monomorphisms:
    description: injective order-preserving functions
    proof: The same proof as for <a href="/category/Set">$\Set$</a> can be used.
  epimorphisms:
    description: surjective order-preserving functions
    proof: Clearly, surjective maps are epimorphisms. The converse follows since, as mentioned, the forgetful functor $\PreOrd \to \Set$ has a right adjoint hence preserves epimorphisms.
  regular monomorphisms:
    description: embeddings
    proof: 'Every regular monomorphism is an embedding by the explicit construction of equalizers. For the converse, let $i : P \to Q$ be an embedding, which we may assume to be an inclusion. Consider the cokernel pair $C \coloneqq Q \cup_P Q$. It exists because the category has pushouts, but we can (and need to) describe it more concretely: As a set, $C$ is a disjoint union of $P$ and two copies of $Q \setminus P$. The elements will be denoted by $p,q_1,q_2$. The $i$th inclusion map $Q \to C$ maps $p \in P$ to itself and $q \in Q \setminus P$ to $q_i$. The ordering is directly induced by $Q$: We have $p \leq p''$ in $C$ iff $p \leq p''$ in $P$, we have $p \leq q_i$ iff $p \leq q$ in $Q$, etc. One verifies that this indeed defines a preorder, and by construction the two maps $Q \rightrightarrows C$ are order-preserving and have equalizer $P$.'
