special_objects:
  initial object:
    description: empty set with the unique action
  terminal object:
    description: singleton set with the unique action
  coproducts:
    description: disjoint union with the obvious action
  products:
    description: direct product with the obvious action

special_morphisms:
  isomorphisms:
    description: bijective morphisms
    proof: This is easy to check.
  monomorphisms:
    description: injective morphisms
    proof: Injective morphisms are clearly monomorphisms. The converse follows since the forgetful functor to $\Set$ preserves limits, pullbacks in particular, and therefore preserves monomorphisms.
  epimorphisms:
    description: surjective morphisms
    proof: Surjective morphisms are clearly epimorphisms. The converse follows since the forgetful functor to $\Set$ preserves colimits, pushouts in particular, and therefore preserves epimorphisms.
