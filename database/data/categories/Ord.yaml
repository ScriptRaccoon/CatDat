id: Ord
name: category of ordered sets
notation: $\Ord$
objects: ordered sets $(X,\leq)$
morphisms: order-preserving maps
description: Ordered sets are total by definition, i.e. partially ordered sets $(X,\leq)$ such that $x \leq y$ or $y \leq x$ for all $x,y \in X$. The category $\Ord$ is a full subcategory of <a href="/category/Pos">$\Pos$</a>, and <a href="/category/FinOrd">$\FinOrd$</a> is a full subcategory of it.
nlab_link: https://ncatlab.org/nlab/show/total+order
keywords:
  - totally ordered sets
  - linearly ordered sets

tags:
  - order theory
  - relational structures

related:
  - PreOrd
  - Pos
  - FinOrd

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Ord \to \Set$ and <a href="/category/Set">$\Set$</a> is locally small.

  - property: semi-strongly connected
    proof: Every non-empty ordered set is weakly terminal (by using constant maps).

  - property: strict initial object
    proof: The empty ordered set is initial, and every map into the empty set is bijective.

  - property: terminal object
    proof: Take the singleton set with the unique order.

  - property: extremal generator
    proof: The ordered set $\{0 < 1\}$ is an extremal generator, even for <a href="/category/PreOrd">$\PreOrd$</a>. Now apply Lemma 10 <a href="/content/subcategories">here</a>.

  - property: extremal cogenerator
    proof: The ordered set $\{0 < 1\}$ is an extremal cogenerator, even for <a href="/category/Pos">$\Pos$</a>. Now apply Lemma 10 <a href="/content/subcategories">here</a>.

  - property: equalizers
    proof: >-
      The equalizer of two order-preserving maps $f,g : (X,\leq) \rightrightarrows (Y,\leq)$ in <a href="/category/Pos">$\Pos$</a> is $(E,\leq)$, where $E \coloneqq \{x \in X : f(x) = g(x)\}$ carries the restricted order, which is an ordered set. Since the inclusion $\Ord \hookrightarrow \Pos$ is fully faithful, it is also the equalizer in $\Ord$.

  - property: coequalizers
    proof: >-
      Let $f,g : (X,\leq) \rightrightarrows (Y,\leq)$ be two morphisms in $\Ord$, and let $q : (Y,\leq) \to (C,\leq)$ be their coequalizer in <a href="/category/Pos">$\Pos$</a>. By the construction of coequalizers in $\Pos$, the map $q : Y \to C$ is surjective. Hence, every two elements of $C$ have the form $q(y)$ and $q(y')$ with $y,y' \in Y$, and they are comparable since $y,y'$ are comparable and $q$ is order-preserving. Thus, $(C,\leq)$ is an ordered set. Since the inclusion $\Ord \hookrightarrow \Pos$ is fully faithful, $q$ is also the coequalizer in $\Ord$.

  - property: cosifted limits
    proof: >-
      More generally, let $\I$ be a small category such that for all objects $i,j \in \I$ there is an object $k \in \I$ with morphisms $k \to i$ and $k \to j$. Then every diagram $D : \I \to \Ord$, $i \mapsto (X_i,\leq)$ has a limit, which is computed as in <a href="/category/Pos">$\Pos$</a>. Since the inclusion $\Ord \hookrightarrow \Pos$ is fully faithful, it suffices to show that the limit $(L,\leq)$ of $D$ in $\Pos$ is an ordered set.

      Recall that $L$ is the set of compatible families $x = (x_i)_{i \in \I}$ with $x_i \in X_i$, where $x \leq y$ if and only if $x_i \leq y_i$ for all $i \in \I$. Let $x,y \in L$ with $x \not\leq y$. Then there is some $i \in \I$ with $x_i \not\leq y_i$, i.e. $y_i < x_i$. Let $j \in \I$, and choose morphisms $u : k \to i$ and $v : k \to j$. If $x_k \leq y_k$, then $x_i = D(u)(x_k) \leq D(u)(y_k) = y_i$, a contradiction. Hence, $y_k \leq x_k$, and therefore $y_j = D(v)(y_k) \leq D(v)(x_k) = x_j$. Since $j$ was arbitrary, this shows $y \leq x$.

  - property: sifted colimits
    proof: >-
      Let $D : \I \to \Ord$, $i \mapsto (X_i,\leq)$ be a diagram, where $\I$ is a small sifted category, and let $U : \Ord \to \Set$ be the forgetful functor. We show that $D$ has a colimit, and that $U$ preserves it. Let $(\iota_i : X_i \to X)_{i \in \I}$ be the colimit of $U \circ D$ in $\Set$. Since $\I$ is sifted, colimits over $\I$ commute with finite products in $\Set$. Hence, the maps $\iota_i \times \iota_i : X_i^2 \to X^2$ form a colimit as well, and similarly for $X^3$. We define a relation $\leq$ on $X$ as follows: $x \leq y$ holds if there are some $i \in \I$ and $u \leq v$ in $X_i$ with $x = \iota_i(u)$ and $y = \iota_i(v)$.

      Since order-preserving maps preserve binary minima and maxima, the maps
      $$X_i^2 \to X_i^2, \quad (u,v) \mapsto (\min(u,v),\max(u,v))$$
      are natural in $i$. Therefore, they induce a map $\sigma : X^2 \to X^2$ with
      $$\sigma(\iota_i(u),\iota_i(v)) = (\iota_i(\min(u,v)),\iota_i(\max(u,v))).$$
      For all $x,y \in X$ this formula shows: (1) $\sigma(x,y)$ is $(x,y)$ or $(y,x)$, and its first entry is $\leq$ its second entry; (2) $\sigma(x,y) = \sigma(y,x)$; (3) if $x \leq y$, then $\sigma(x,y) = (x,y)$, by choosing $u \leq v$ as in the definition.

      We claim that $\leq$ is a total order on $X$. By (1), it is total and in particular reflexive. If $x \leq y$ and $y \leq x$, then $(x,y) = \sigma(x,y) = \sigma(y,x) = (y,x)$ by (3) and (2), so that $x = y$. For transitivity, let $x \leq y \leq z$, where we may assume $x \neq y \neq z$. Since the maps $\iota_i \times \iota_i \times \iota_i : X_i^3 \to X^3$ form a colimit, they are jointly surjective. Hence, there are $i \in \I$ and $u,v,w \in X_i$ with $x = \iota_i(u)$, $y = \iota_i(v)$, and $z = \iota_i(w)$. If $v < u$, then $\sigma(x,y) = (\iota_i(v),\iota_i(u)) = (y,x)$, but also $\sigma(x,y) = (x,y)$ by (3), which contradicts $x \neq y$. Hence, $u \leq v$, and similarly $v \leq w$. Then $u \leq w$, which shows $x \leq z$.

      By definition of $\leq$, every map $\iota_i : (X_i,\leq) \to (X,\leq)$ is order-preserving. Let $(f_i : (X_i,\leq) \to (Y,\leq))_{i \in \I}$ be a cocone in $\Ord$, and let $f : X \to Y$ be the unique map with $f \circ \iota_i = f_i$ for all $i$. If $x \leq y$ in $X$, choose $u \leq v$ in some $X_i$ as in the definition; then $f(x) = f_i(u) \leq f_i(v) = f(y)$. Hence, $f$ is order-preserving, and $(X,\leq)$ with the maps $\iota_i$ is the colimit of $D$ in $\Ord$.
    check_redundancy: false

  - property: finitely accessible
    proof: >-
      We claim that every finite ordered set $(X,\leq)$ is strongly finitely presentable, i.e. $\Hom((X,\leq),-) : \Ord \to \Set$ preserves sifted colimits. In particular, every finite ordered set is finitely presentable.

      To see this, let $n$ be the number of elements of $X$, and let $U : \Ord \to \Set$ be the forgetful functor. We may identify $\Hom((X,\leq),-)$ with the subfunctor of $U^n$ of increasing $n$-tuples. Sorting $n$-tuples defines a retraction $U^n \to \Hom((X,\leq),-)$ of the inclusion, which is natural since order-preserving maps commute with sorting. The functor $U^n$ preserves sifted colimits, since $U$ does (see the proof for sifted colimits) and sifted colimits commute with finite products in $\Set$. Now, for a sifted diagram $D : \I \to \Ord$, $i \mapsto (Y_i,\leq)$ with colimit $(C,\leq)$, the canonical map
      $$\colim_i \Hom((X,\leq),(Y_i,\leq)) \to \Hom((X,\leq),(C,\leq))$$
      is a retract of the canonical map $\colim_i Y_i^n \to C^n$, which is bijective. Hence, it is bijective as well.

      The finite ordered sets form an essentially small collection. Finally, every ordered set $(X,\leq)$ is the filtered colimit of the ordered sets $(F,\leq)$, where $F$ runs through the finite subsets of $X$ with the restricted order. This can be seen directly, but it also follows from our construction of sifted colimits.

  - property: generalized variety
    proof: >-
      We already know that $\Ord$ has sifted colimits. By the claim in the proof of finite accessibility, the finite ordered sets are strongly finitely presentable, and every ordered set is a filtered colimit, hence a sifted colimit, of finite ordered sets.

      <strong>Remark.</strong> In <a href="http://www.tac.mta.ca/tac/volumes/8/n3/8-03abs.html">Adámek–Rosický</a>, Example 4.3(3), $\Ord$ is said to be <a href="/category-property/multi-algebraic">multi-algebraic</a>, in particular to have connected limits, by giving an FPC-sketch for it. This is not correct, since it does not even have binary products, which are pullbacks over the terminal object. The models of this sketch are the ordered sets, but its morphisms are the strictly increasing maps, since they have to preserve the strict order relation. The sketch in <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Example 2.57, cited there, does describe $\Ord$, but it is not an FPC-sketch, since it includes a pushout cocone.

  - property: mono-regular
    proof: >-
      Let $i : (X,\leq) \to (Y,\leq)$ be a monomorphism, i.e. an injective order-preserving map (see below). Since $i$ is strictly increasing, it reflects the order, so we may assume that $X \subseteq Y$ is a subset with the restricted order and that $i$ is the inclusion. Consider the set $C \coloneqq Y \times \{0,1\}$ with the lexicographic order, and define $f,g : (Y,\leq) \rightrightarrows (C,\leq)$ by $f(y) \coloneqq (y,0)$ and
      $$g(y) \coloneqq \begin{cases} (y,0) & y \in X, \\ (y,1) & y \notin X. \end{cases}$$
      Both maps are order-preserving, since $y < y'$ implies $(y,m) < (y',n)$ for all $m,n \in \{0,1\}$. By the proof for equalizers, the equalizer of $f,g$ in $\Ord$ is computed as in $\Pos$, so it is $(X,\leq)$, since $\{y \in Y : f(y) = g(y)\} = X$. Hence, $i$ is a regular monomorphism.

  - property: all epimorphisms split
    proof: >-
      Let $p : (X,\leq) \to (Y,\leq)$ be an epimorphism, i.e. a surjective order-preserving map (see below). Choose a map $s : Y \to X$ with $s(y) \in p^*(\{y\})$ for all $y \in Y$, so that $p \circ s = \id_Y$. To see that $s$ is order-preserving, let $y < y'$ in $Y$. If $s(y') \leq s(y)$, then $y' = p(s(y')) \leq p(s(y)) = y$, a contradiction. Hence, $s(y) < s(y')$.

  - property: effective cocongruences
    proof: >-
      Let $j_1,j_2 : (X,\leq) \rightrightarrows (C,\leq)$ be a cocongruence. In particular, each of $j_1,j_2$ is a split monomorphism, and there is an order-preserving map $s : (C,\leq) \to (C,\leq)$ with $s \circ j_1 = j_2$ and $s \circ j_2 = j_1$. Let $x \in X$. Since $j_1(x)$ and $j_2(x)$ are comparable and the situation is symmetric, we may assume $j_1(x) \leq j_2(x)$. Applying $s$ yields $j_2(x) \leq j_1(x)$, so that $j_1(x) = j_2(x)$. Hence, $j_1 = j_2$. Since the pair $j_1,j_2$ is jointly epimorphic, $j_1$ is an epimorphism, hence an isomorphism. Thus, the cocongruence is isomorphic to $\id_X, \id_X : (X,\leq) \rightrightarrows (X,\leq)$, which is the cokernel pair of $\id_X$.

unsatisfied_properties:
  - property: skeletal
    proof: The ordered sets with underlying sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: locally finite
    proof: The maps $\{\ast\} \to (\IN,\leq)$ correspond to the elements of $\IN$, so there are infinitely many.

  - property: core-thin
    proof: The map $(\IZ,\leq) \to (\IZ,\leq)$, $n \mapsto n+1$ is a non-trivial automorphism.

  - property: binary powers
    proof: >-
      We show more generally that a family of ordered sets $(X_k,\leq)_{k \in I}$, where $I$ has at least two elements and every $X_k$ has at least two elements, has no product. (In particular, the power $\{0 < 1\} \times \{0 < 1\}$ does not exist.) Assume that its product $(P,\leq)$ exists, with projections $p_k : (P,\leq) \to (X_k,\leq)$. Choose distinct indices $i,j \in I$, elements $u_i < v_i$ in $X_i$ and $u_j < v_j$ in $X_j$, and an element $w_k \in X_k$ for every $k \in I \setminus \{i,j\}$. By the universal property applied to maps $\{\ast\} \to (X_k,\leq)$, there are elements $x,y \in P$ with $p_i(x) = u_i$, $p_j(x) = v_j$, $p_i(y) = v_i$, $p_j(y) = u_j$, and $p_k(x) = p_k(y) = w_k$ for all other $k$. If $x \leq y$, then $v_j = p_j(x) \leq p_j(y) = u_j$, and if $y \leq x$, then $v_i = p_i(y) \leq p_i(x) = u_i$. Both are contradictions.

  - property: binary copowers
    proof: >-
      We show more generally that two non-empty ordered sets $(X,\leq),(Y,\leq)$ have no coproduct. (In particular, the copower $\{0 < 1\} \sqcup \{0 < 1\}$ does not exist.) Assume that their coproduct $(C,\leq)$ exists, with coprojections $i : (X,\leq) \to (C,\leq)$ and $j : (Y,\leq) \to (C,\leq)$. Choose elements $x \in X$ and $y \in Y$. By symmetry, we may assume $i(x) \leq j(y)$. Then the constant maps $(X,\leq) \to \{0 < 1\}$ with value $1$ and $(Y,\leq) \to \{0 < 1\}$ with value $0$ do not factor through $(C,\leq)$: an order-preserving map $f : (C,\leq) \to \{0 < 1\}$ with $f(i(X)) = \{1\}$ and $f(j(Y)) = \{0\}$ would satisfy $1 = f(i(x)) \leq f(j(y)) = 0$, a contradiction.

  - property: natural numbers object
    proof: >-
      Assume that the ordered set $(N,\leq)$ with an element $z \in N$ and an order-preserving map $s : (N,\leq) \to (N,\leq)$ is a natural numbers object. If $z \leq s(z)$, consider $a \coloneqq 1$ in $\{0 < 1\}$ and the constant map $g : \{0 < 1\} \to \{0 < 1\}$ with value $0$. The induced order-preserving map $\Phi : (N,\leq) \to \{0 < 1\}$ satisfies $\Phi(z) = 1$ and $\Phi(s(z)) = g(1) = 0$, which contradicts $z \leq s(z)$. If $s(z) \leq z$, the same argument with $a \coloneqq 0$ and the constant map with value $1$ yields $\Phi(z) = 0$ and $\Phi(s(z)) = 1$, which contradicts $s(z) \leq z$.

  - property: cofiltered-limit-stable epimorphisms
    proof: >-
      For $n \in \IN$ consider the set $X_n \coloneqq \{k \in \IN : k \geq n\}$ with the usual order, and the inclusions $(X_{n+1},\leq) \hookrightarrow (X_n,\leq)$. The maps $(X_n,\leq) \to \{\ast\}$ are surjective, hence epimorphisms (see below), and they form a morphism from this sequence to the constant sequence with value $\{\ast\}$. By the proof for cosifted limits, limits of such sequences are computed as in <a href="/category/Pos">$\Pos$</a>, hence on the underlying sets as in $\Set$. Therefore, the limit of the $(X_n,\leq)$ is the ordered set with underlying set $\bigcap_{n \in \IN} X_n = \varnothing$, and the limit of the constant sequence is $\{\ast\}$. The induced map $\varnothing \to \{\ast\}$ is not an epimorphism.

  - property: coaccessible
    proof: >-
      Assume that $\Ord$ is $\kappa$-coaccessible for a regular cardinal $\kappa$. For $\alpha < \kappa$ consider the set $X_\alpha \coloneqq \{\beta < \kappa : \beta \geq \alpha\}$ of ordinals with the usual order, and the inclusions $(X_{\alpha'},\leq) \hookrightarrow (X_\alpha,\leq)$ for $\alpha \leq \alpha'$. By the proof for cosifted limits, the limit of this diagram $D : (\kappa,\geq) \to \Ord$, $\alpha \mapsto (X_\alpha,\leq)$ is computed as in <a href="/category/Pos">$\Pos$</a>, hence on the underlying sets as in $\Set$. Thus, its underlying set is $\bigcap_{\alpha < \kappa} X_\alpha = \varnothing$, so it is the initial object. Every map $(X_\alpha,\leq) \to \{\ast\}$ is a split epimorphism, since $X_\alpha$ is non-empty. By the lemma <a href="/content/decreasing-chains-coaccessible">here</a>, applied to the unique morphism $! : (X_0,\leq) \to \{\ast\}$, the ordered set $\{\ast\}$ is initial, a contradiction.

special_objects:
  initial object:
    description: empty ordered set
  terminal object:
    description: singleton ordered set

special_morphisms:
  isomorphism:
    description: bijective order-preserving maps
    proof: >-
      For the non-trivial direction, let $f : (X,\leq) \to (Y,\leq)$ be a bijective order-preserving map. We show that its inverse map is order-preserving. Let $y \leq y'$ in $Y$, and let $x,x' \in X$ with $f(x) = y$ and $f(x') = y'$. If $x' < x$, then $f(x') \leq f(x)$ since $f$ is order-preserving, and $f(x') \neq f(x)$ since $f$ is injective. Hence, $y' < y$, a contradiction. Since $x$ and $x'$ are comparable, we conclude that $x \leq x'$.
  monomorphism:
    description: injective order-preserving maps
    proof: For the non-trivial direction, the forgetful functor $\Ord \to \Set$ is representable by $\{\ast\}$, hence preserves monomorphisms.
  epimorphism:
    description: surjective order-preserving maps
    proof: The proof for <a href="/category/Pos">$\Pos$</a> works verbatim, since it only uses order-preserving maps into $\{0 < 1\}$.
