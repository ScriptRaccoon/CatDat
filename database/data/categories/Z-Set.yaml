id: Z-Set
name: category of Z-sets
notation: $\IZ{-}\Set$
objects: sets with an action of the additive group $\IZ$
morphisms: maps that are compatible with the action
description: 'This is the special case of the <a href="/category/M-Set">category of $M$-sets</a>, where $M$ is the additive group of integers. Objects can be identified with pairs $(X,\sigma)$, where $X$ is a set and $\sigma : X \to X$ is a permutation on $X$. A morphism $(X,\sigma) \to (Y,\tau)$ is a map $f : X \to Y$ satisfying $\tau \circ f = f \circ \sigma$.'
nlab_link: https://ncatlab.org/nlab/show/MSet
parent: M-Set

tags:
  - set theory
  - combinatorics

related:
  - Z-FinSet
  - Set
  - R-Mod

satisfied_properties: []

unsatisfied_properties:
  - property: semi-strongly connected
    proof: In general, if $G$ is a group and $H,K$ are subgroups of $G$, then there is a morphism of $G$-sets $G/H \to G/K$ if and only if $H$ is contained in a conjugate of $K$. In particular, if $G$ is abelian, this requires $H \subseteq K$. Thus, if $G$ is an abelian group with two subgroups that are not contained in each other, $G{-}\Set$ is not semi-strongly connected. The additive group $\IZ$ has this property; for instance, consider $2\IZ$ and $3\IZ$. See also <a href="https://math.stackexchange.com/questions/5129804" target="_blank">MSE/5129804</a>.
    label: Z-Set_not_semi-strongly_connected

special_objects: {}

special_morphisms: {}
