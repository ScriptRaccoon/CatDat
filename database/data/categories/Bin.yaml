id: Bin
name: category of sets equipped with a binary relation
notation: $\Bin$
alternative_notation: $\DiGraph$
objects: pairs $(X,R)$, where $X$ is a set and $R \subseteq X \times X$ is a binary relation on $X$
morphisms: >-
  A morphism $(X,R) \to (Y,S)$ is a relation-preserving map, i.e. a map $f : X \to Y$ such that $(x,x') \in R$ implies $(f(x),f(x')) \in S$.
description: >-
  The pair $(X,R)$ can also be interpreted as a directed graph (with vertex set $X$ and edge set $R$), where loops are allowed, and the morphisms are precisely the morphisms of directed graphs. Thus,
  $$\Bin = \DiGraph,$$
  and $\DiGraph$ can be interpreted as the full subcategory of $\Quiv$, the <a href="/category/Quiv">category of quivers</a>, consisting of quivers with at most one edge between any pair of vertices. In the proofs below, however, we will mostly not use the graph-theoretic interpretation and instead work with binary relations. This simplifies the exposition and has the additional advantage that we do not need to deal with the varying definitions of the term "directed graph" in the literature (in particular, there is no complete consensus on whether loops are allowed). Instead, we can work with the unambiguous notion of a binary relation.

  The category $\Bin$ is a typical example of a quasitopos.
nlab_link: null
keywords:
  - directed graphs

tags:
  - graph theory
  - relational structures

related:
  - Quiv
  - Bin_irr
  - Bin_symm
  - Bin_symm_irr
  - Bin_refl
  - Bin_symm_refl
  - Pos
  - PreOrd

comments:
  - The forgetful functor $\Bin \to \Set$ has a left adjoint mapping a set $X$ to $(X,\varnothing)$.
  - The forgetful functor $\Bin \to \Set$ has a right adjoint mapping a set $X$ to $(X,X \times X)$.

satisfied_properties:
  - property: locally small
    proof: This is obvious.

  - property: complete
    proof: If $\I \to \Bin$, $i \mapsto (X_i,R_i)$ is a diagram, its limit is $(\lim_{i \in \I} X_i,R)$, where $R$ consists of pairs $(x,y)$ such that $(x_i,y_i) \in R_i$ for every $i \in \I$. The universal property is easy to check.
    check_redundancy: false

  - property: cocomplete
    proof: If $\I \to \Bin$, $i \mapsto (X_i,R_i)$ is a diagram, its colimit is $(\colim_{i \in \I} X_i,R)$, where $R$ consists of pairs $(\iota_i(x),\iota_i(y))$ for $i \in \I$ and $(x,y) \in R_i$. The universal property is easy to check.
    check_redundancy: false

  - property: infinitary extensive
    proof: We can copy the proof for <a href="/category/PreOrd">$\PreOrd$</a>.
    references:
      - PreOrd_infinitary_extensive

  - property: finitely accessible
    proof: Using the description of colimits, it is easy to see that $(X,R)$ is finitely presentable when $X$ is a finite set. The collection of such objects, up to isomorphism, is essentially small. Moreover, every object $(X,R)$ can be written as the filtered colimit of $(F,R|_F)$, where $F$ runs through the finite subsets of $X$.
    label: Bin_finitely_accessible

  - property: locally cartesian closed
    proof: >-
      Let $(X,R)$ be a fixed object. We say that $x$ relates to $x'$ when $(x,x') \in R$ and suppress the relation set $R$ from the notation. For two objects $Y \to X$ and $Z \to X$ in $\Bin / X$, we define their exponential to be the set $\coprod_{x \in X} \Hom(Y_x,Z_x)$ (the exponential in $\Set / X$), where $Y_x$ denotes the fiber over $x$, equipped with the following relation: a map $f : Y_x \to Z_x$ relates to a map $g : Y_{x'} \to Z_{x'}$ when $x$ relates to $x'$ and, for all $y \in Y_x$ and $y' \in Y_{x'}$, if $y$ relates to $y'$, then $f(y)$ relates to $g(y')$. The projection map $\coprod_{x \in X} \Hom(Y_x,Z_x) \to X$ is relation-preserving by construction.

      Let us check the universal property of an exponential. Given an object $A \to X$ in $\Bin / X$, a morphism $\alpha : A \to \coprod_{x \in X} \Hom(Y_x,Z_x)$ over $X$ is in particular a morphism in $\Set / X$ and thus corresponds to a morphism $\beta : A \times_X Y \to Z$ in $\Set / X$ via $\beta(a,y) = \alpha(a)(y)$. It remains to check that $\alpha$ is relation-preserving if and only if $\beta$ is relation-preserving.

      That $\alpha$ is relation-preserving means that if $a \in A_x$ relates to $a' \in A_{x'}$, then the map $\alpha(a) : Y_x \to Z_x$ relates to the map $\alpha(a') : Y_{x'} \to Z_{x'}$, i.e., that $x$ relates to $x'$ (which is automatic since $a$ relates to $a'$ and $A \to X$ is relation-preserving) and that if $y \in Y_x$ relates to $y' \in Y_{x'}$, then $\alpha(a)(y)$ relates to $\alpha(a')(y')$. In other words, if $(a,y)$ relates to $(a',y')$ in the pullback $A \times_X Y$, then $\beta(a,y)$ relates to $\beta(a',y')$. This is precisely the statement that $\beta$ is relation-preserving.
    label: Bin_exponentials

  - property: regular subobject classifier
    proof: By the description of regular monomorphisms below, the poset of regular subobjects of $(X,R)$ is isomorphic to the poset of subsets of $X$. The subsets of $X$ correspond to morphisms from $(X,R)$ into the object $\Omega \coloneqq (\{0,1\}, \{0,1\} \times \{0,1\})$, which shows that $\Omega$ is a regular subobject classifier.

  - property: generator
    proof: The object $(\{\ast\},\varnothing)$ is a generator because it represents the forgetful functor $\Bin \to \Set$, $(X,R) \mapsto X$, which is faithful.

  - property: extremal cogenerator
    proof: >-
      We claim that the set $Q \coloneqq \{0,1,2,3\}$ equipped with the relation
      $$R_Q \coloneqq (Q \times Q) \setminus \{(0,1),(3,3)\}$$
      is an extremal cogenerator of $\Bin$. First, to show that it is a cogenerator, assume that $f,g : (X,R) \rightrightarrows (Y,S)$ are distinct morphisms. Choose $x \in X$ with $f(x) \neq g(x)$. Define the map $h : Y \to Q$ by $h(f(x))=0$ and $h(y)=2$ for $y \neq f(x)$. Since $1,3 \notin \im(h)$, we obtain a morphism $h : (Y,S) \to (Q,R_Q)$, and it satisfies $h \circ f \neq h \circ g$ since $h(f(x)) = 0$, while $h(g(x)) = 2$.

      To show that $(Q,R_Q)$ is extremal, let $f : (X,R) \to (Y,S)$ be a morphism such that
      $$f^* : \Hom((Y,S),(Q,R_Q)) \to \Hom((X,R),(Q,R_Q))$$
      is bijective. Since $(Q,R_Q)$ is a cogenerator, it follows that $f$ is both a monomorphism and an epimorphism. By the classification of monomorphisms and epimorphisms below, this means that $f : X \to Y$ is bijective. It remains to show that $f$ is relation-reflecting.

      Assume for contradiction that $x,x' \in X$ satisfy $(f(x),f(x')) \in S$, but $(x,x') \notin R$. There are two cases to consider.

      <strong>Case 1:</strong> $x \neq x'$. Define the map $h : X \to Q$ by $h(x)=0$, $h(x')=1$, and $h(p)=2$ for $p \neq x,x'$. Then $h : (X,R) \to (Q,R_Q)$ is a morphism since the only pair in $X \times X$ whose image is not in $R_Q$ is the pair $(x,x')$, which is not contained in $R$. By assumption, there is a morphism $g : (Y,S) \to (Q,R_Q)$ such that $g \circ f = h$. Since $(f(x),f(x')) \in S$, it follows that
      $$(0,1) = (h(x),h(x')) = (g(f(x)),g(f(x'))) \in R_Q,$$
      which is a contradiction.

      <strong>Case 2:</strong> $x = x'$. Define the map $h : X \to Q$ by $h(x)=3$ and $h(p)=2$ for $p \neq x$. Then $h : (X,R) \to (Q,R_Q)$ is a morphism since the only pair in $X \times X$ whose image is not in $R_Q$ is the pair $(x,x)$, which is not contained in $R$. By assumption, there is a morphism $g : (Y,S) \to (Q,R_Q)$ such that $g \circ f = h$. Since $(f(x),f(x)) \in S$, it follows that
      $$(3,3) = (h(x),h(x)) = (g(f(x)),g(f(x))) \in R_Q,$$
      which is a contradiction.
    label: Bin_extremal_cogenerator

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: semi-strongly connected
    proof: >-
      Interpreting the objects of $\Bin$ as directed graphs, we may use the same counterexample as for <a href="/category/Quiv">$\Quiv$</a>, since directed cycles have no multiple edges. Concretely, there is no morphism between these two objects:
      $$\begin{align*}
      C_2 & = \bigl(\{0,1\}, \{(0,1),(1,0)\}\bigr) \\
      C_3 & = \bigl(\{0,1,2\}, \{(0,1),(1,2),(2,0)\}\bigr)
      \end{align*}$$
    references:
      - Quiv_not_semi-strongly_connected

  - property: extremal generator
    proof: Let $(X,R) \in \Bin$. We will prove that $\Hom((X,R),-)$ is not conservative. If $R$ is non-empty, consider the unique morphism from $(\varnothing,\varnothing)$ to $(\{\ast\},\varnothing)$. It is not an isomorphism, but since $(X,R)$ has no morphism to either object, the functor $\Hom((X,R),-)$ maps it to an isomorphism between empty sets. If $R$ is empty, consider the unique morphism from $(\{\ast\},\varnothing)$ to $(\{\ast\},\{(\ast,\ast)\})$. It is not an isomorphism, but since $(X,R) = (X,\varnothing)$ has a unique morphism to each of these objects, the functor $\Hom((X,R),-)$ maps it to an isomorphism between singleton sets.
    label: Bin_no_extremal_generator

  - property: cofiltered-limit-stable epimorphisms
    proof: We already know that <a href="/category/Set">$\Set$</a> does not have this property. Now apply the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> to the functor $\Set \to \Bin$, $X \mapsto (X,\varnothing)$.
    label: Bin_no_cofiltered-limit-stable_epis

  - property: co-Malcev
    proof: >-
      Consider the set $X = \{x\}$ with the relation $R_X = \{(x,x)\}$ and the set $Y = \{x,x'\}$ with the relation $R_Y = \{(x,x),(x',x'),(x,x')\}$. There are two canonical morphisms $q,q' : (X,R_X) \rightrightarrows (Y,R_Y)$ defined by $q(x)=x$ and $q'(x)=x'$. They are jointly surjective and have a common retraction $(Y,R_Y) \to (X,R_X)$, namely the unique map $Y \to X$ sending both $x$ and $x'$ to $x$. Thus, $q,q'$ form a coreflexive corelation. It is not cosymmetric, since otherwise there would be a morphism $s : (Y,R_Y) \to (Y,R_Y)$ satisfying $s(x)=x'$ and $s(x')=x$, which would imply $(x',x) \in R_Y$, contrary to the definition of $R_Y$.
    label: Bin_not_co-Malcev

special_objects:
  initial object:
    description: $(\varnothing,\varnothing)$, which can be seen as the directed graph with no vertices and no directed edges
  terminal object:
    description: $(\{\ast\},\{(\ast,\ast)\})$, which can be seen as the directed graph with a single vertex and a loop
  coproducts:
    description: The coproduct of a family $(X_i,R_i)_{i \in I}$ is $(\coprod_{i \in I} X_i, \coprod_{i \in I} R_i)$, where $\coprod_{i \in I} R_i \subseteq \coprod_{i \in I} (X_i \times X_i) \subseteq \coprod_{i \in I} X_i \times \coprod_{i \in I} X_i$.
  products:
    description: The product of a family $(X_i,R_i)_{i \in I}$ is $(\prod_{i \in I} X_i, \prod_{i \in I} R_i)$, where $\prod_{i \in I} R_i \subseteq \prod_{i \in I} (X_i \times X_i) \cong \prod_i X_i \times \prod_i X_i$.

special_morphisms:
  isomorphisms:
    description: bijective maps that preserve and reflect the relation
    proof: This is easy to check.
  monomorphisms:
    description: injective relation-preserving maps
    proof: For the non-trivial direction, the construction of limits shows that the forgetful functor $\Bin \to \Set$ is continuous, so that it preserves monomorphisms in particular. Another explanation for this fact is that the forgetful functor is right adjoint to the functor mapping a set $X$ to $(X,\varnothing)$.
  epimorphisms:
    description: surjective relation-preserving maps
    proof: For the non-trivial direction, the construction of colimits shows that the forgetful functor $\Bin \to \Set$ is cocontinuous, so that it preserves epimorphisms in particular. Another explanation for this fact is that the forgetful functor is left adjoint to the functor mapping a set $X$ to $(X,X \times X)$.
  regular monomorphisms:
    description: injective maps that reflect and preserve the relation
    proof: 'The equalizer of two morphisms $f,g : (X,R) \rightrightarrows (Y,S)$ is constructed as $(E,R|_E)$, where $E = \{x \in X : f(x) = g(x)\}$ is the equalizer of $f,g : X \rightrightarrows Y$. The inclusion map $(E,R|_E) \hookrightarrow (X,R)$ reflects and preserves the relation. Conversely, let $(X,R)$ be an object and let $E \subseteq X$ be a subset. Then $E \subseteq X$ is the equalizer of the two maps $1,\chi_E : X \rightrightarrows \{0,1\}$, which induce morphisms $1,\chi_E : (X,R) \rightrightarrows (\{0,1\}, \{0,1\} \times \{0,1\})$ with equalizer $(E,R|_E)$.'
  regular epimorphisms:
    description: >-
      morphisms $f : (X,R) \to (Y,S)$ such that $f : X \to Y$ is surjective and $S = \{(f(x),f(x')) : (x,x') \in R\}$
    proof: >-
      The coequalizer of two morphisms $f,g : (X,R) \rightrightarrows (Y,S)$ in $\Bin$ can be constructed as $\pi : (Y,S) \twoheadrightarrow (C,T)$, where $\pi : Y \twoheadrightarrow C$ is the coequalizer of $f,g : X \rightrightarrows Y$ in $\Set$ and $T = \{(\pi(y),\pi(y')) : (y,y') \in S\}$. Thus, $\pi : (Y,S) \twoheadrightarrow (C,T)$ has the claimed property.

      Conversely, assume that $f : (X,R) \to (Y,S)$ is a morphism such that $f$ is surjective and $S = \{(f(x),f(x')) : (x,x') \in R\}$. This property of $S$ means that a map on $Y$ is relation-preserving whenever its composition with $f$ is relation-preserving on $X$. (The situation is completely analogous to <a href="/category/Top">$\Top$</a>, but much simpler.) Then $f : (X,R) \to (Y,S)$ is the coequalizer of its kernel pair $(X,R) \times_{(Y,S)} (X,R) \rightrightarrows (X,R)$ because of the corresponding statement in $\Set$.
