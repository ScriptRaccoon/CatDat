id: FinSet_power_3
name: category of finite sets of cardinality a power of 3
notation: $\FinSet_{3^\bullet}$
objects: finite sets whose cardinality is a power of $3$
morphisms: maps
description: 'This is the full subcategory of $\FinSet$ consisting of finite sets whose cardinality is $3^k$ for some $k \in \IN$. We have included this category only because of its interesting property combinations.'
nlab_link: null

tags:
  - set theory

related:
  - FinSet
  - FinSet_even
  - FinSet_odd

satisfied_properties:
  - property: locally small
    proof: It is a full subcategory of $\FinSet$, which is locally small (<a href="/category/FinSet?proof=locally_small" data-allow-deduced>proof</a>).

  - property: locally finite
    proof: This property is inherited from $\FinSet$, which is locally finite (<a href="/category/FinSet?proof=locally_finite" data-allow-deduced>proof</a>).

  - property: essentially countable
    proof: This property is inherited from $\FinSet$, which is essentially countable (<a href="/category/FinSet?proof=essentially_countable" data-allow-deduced>proof</a>).

  - property: strongly connected
    proof: Use constant maps.

  - property: all epimorphisms split
    proof: Apply <a href="/content/subcategories#lemma_15">Lemma 15 on subcategories</a> to the inclusion $\FinSet_{3^\bullet} \hookrightarrow \Set$, which preserves epimorphisms since these are surjective in $\FinSet_{3^\bullet}$ (<a href="/category/FinSet_power_3?proof=epimorphism">proof</a>) and in $\Set$ (<a href="/category/Set?proof=epimorphism">proof</a>), and use that $\Set$ has all epimorphisms split (<a href="/category/Set?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

  - property: all monomorphisms split
    proof: Apply the dual of <a href="/content/subcategories#lemma_15">Lemma 15 on subcategories</a> to the inclusion $\FinSet_{3^\bullet} \hookrightarrow \Setne$, which preserves monomorphisms since these are injective in $\FinSet_{3^\bullet}$ (<a href="/category/FinSet_power_3?proof=monomorphism">proof</a>) and in $\Setne$ (<a href="/category/Setne?proof=monomorphism">proof</a>), and use that $\Setne$ has all monomorphisms split (<a href="/category/Setne?proof=all_monomorphisms_split" data-allow-deduced>proof</a>).

  - property: cartesian closed
    proof: 'We use that $\FinSet$ is cartesian closed (<a href="/category/FinSet?proof=cartesian_closed" data-allow-deduced>proof</a>). Since $\{3^n : n \geq 0\}$ is closed under finite products (we have $3^0=1$ and $3^n 3^m = 3^{n+m}$) and thus under exponentiation, it follows that $\FinSet_{3^\bullet}$ is closed under finite cartesian products and exponential objects in $\FinSet$.'

  - property: extremal generator
    proof: The set $\{0,1,2\}$ is an extremal generator even in <a href="/category/Set">$\Set$</a>. Now apply <a href="/content/subcategories#lemma_10">Lemma 10 on subcategories</a>.

  - property: extremal cogenerator
    proof: The set $\{0,1,2\}$ is an extremal cogenerator even in <a href="/category/Set">$\Set$</a>. Now apply <a href="/content/subcategories#lemma_10">Lemma 10 on subcategories</a>.

  - property: effective congruences
    proof: Let $R \rightrightarrows X$ be a congruence in $\FinSet_{3^\bullet}$. By applying the (functorial) definition to the test object $T = \{\ast\}$, we see that it is a congruence in $\Set$, i.e. an equivalence relation, such that $R$ and $X$ are finite sets of cardinality a power of $3$. Since for every $n \in \IN$ we have $n \leq 3^n$, the finite set $X/R$ embeds into a finite set $Q$ of cardinality a power of $3$. Then $R \rightrightarrows X$ is the kernel pair of $X \twoheadrightarrow X/R \hookrightarrow Q$ in $\FinSet_{3^\bullet}$.

  - property: effective cocongruences
    proof: >-
      We will prove that, in fact, every cocongruence is trivial. Let $X \rightrightarrows C$ be a cocongruence in $\FinSet_{3^\bullet}$. The induced map
      $$\Hom(C,\{0,1,2\}) \to \Hom(X,\{0,1,2\})^2 \cong \Hom(X+X, \{0,1,2\})$$
      is injective, which implies that $X+X \to C$ is surjective (where $X+X$ denotes the coproduct in $\Set$, which does not exist in $\FinSet_{3^\bullet}$). It follows that $X \rightrightarrows C$ is a coreflexive corelation in $\Set$. Since $\Set$ is co-Malcev (<a href="/category/Set?proof=co-Malcev" data-allow-deduced>proof</a>) and has effective cocongruences (by <a href="/category-implication/regular_epi-regular_extensive_consequences">this result</a>), there is a subset $Y \subseteq X$ such that $C \cong X \sqcup_Y X$ in $\Set$, with $X \rightrightarrows C$ corresponding to the two pushout inclusions. If $X$ has cardinality $3^n$, the cardinality of $C$ lies in the interval $[3^n,2 \cdot 3^n]$ and is a power of $3$. Thus, $C$ also has cardinality $3^n$. It follows that $Y=X$ and that the cocongruence is isomorphic to $\id_X,\id_X : X \rightrightarrows X$. In particular, it is the cokernel pair of $\id_X : X \to X$.

  - property: coquotients of cocongruences
    proof: We have just seen that every cocongruence is trivial and therefore has a coquotient (<a href="/category/FinSet_power_3?proof=effective_cocongruences">proof</a>).

unsatisfied_properties:
  - property: skeletal
    proof: The two sets $\{0\}$ and $\{1\}$ are isomorphic but not equal.

  - property: small
    proof: Even the collection of all singleton sets is not a set, since every set $X$ yields the singleton $\{X\}$.

  - property: countable
    proof: Even the collection of all singletons is not countable, since every set $X$ yields the singleton $\{X\}$.

  - property: Cauchy complete
    proof: 'Consider the idempotent map $e : \{0,1,2\} \to \{0,1,2\}$ defined by $e(0)=0$, $e(1)=1$, $e(2)=1$. If it splits in $\FinSet_{3^\bullet}$ as $\{0,1,2\} \to X \to \{0,1,2\}$, this would also be a splitting in $\FinSet$, making $X$ isomorphic to $\im(e)=\{0,1\}$. But then $X$ is not a valid object of $\FinSet_{3^\bullet}$.'

  - property: right collapsible
    proof: 'The maps $0,1 : \{\ast\} \rightrightarrows \{0,1,2\}$ are not equalized by any morphism, since this would amount to a set $X$ in $\FinSet_{3^\bullet}$ such that $! : X \to \{\ast\}$ factors through $\varnothing$, i.e. $X = \varnothing$, but $0$ is not a power of $3$.'

  - property: binary copowers
    proof: >-
      First, notice that the inclusion functor $\FinSet_{3^\bullet} \hookrightarrow \Set$ is cocontinuous. This follows from <a href="/content/inclusion-functors#lemma_1">Lemma 1 on inclusion functors</a> since $\FinSet_{3^\bullet}$ contains the extremal cogenerator $\{0,1,2\}$ of $\Set$. Therefore, if a binary copower $X+X$ exists in $\FinSet_{3^\bullet}$, and $X$ has $3$ elements, $X+X$ must be the disjoint union, which, however, has $6$ elements, which is not a power of $3$.

      Remark: If we instead consider finite sets of cardinality a power of $2$, then binary copowers do exist, but binary coproducts still do not exist, since $2^0+2^1=3$ is not a power of $2$.

  - property: kernel pairs
    proof: >-
      First, notice that the inclusion functor $\FinSet_{3^\bullet} \hookrightarrow \Set$ is continuous since it is representable. Therefore, if a map $f : X \to Y$ has a kernel pair in $\FinSet_{3^\bullet}$, it must be the set $\{(x,x') \in X \times X : f(x)=f(x')\}$.
      But consider the map $f : \{0,1,2\} \to \{0,1,2\}$ defined by $f(0)=0$, $f(1)=1$, $f(2)=1$. Then the set in question is given by
      $$\{(0,0), (1,1), (2,2), (1,2), (2,1) \}.$$
      It has cardinality $5$, which, however, is not a power of $3$.

  - property: quotients of congruences
    proof: >-
      Partition a finite set $X$ of cardinality $9$ into sets of cardinalities $1,1,3,4$. This yields an equivalence relation $R \subseteq X \times X$ with
      $$\card(R) = 1^2 + 1^2 + 3^2 + 4^2 = 27 = 3^3.$$
      Thus, $R \rightrightarrows X$ is a congruence in $\FinSet_{3^\bullet}$. We already know that the inclusion functor $\FinSet_{3^\bullet} \hookrightarrow \Set$ is cocontinuous (<a href="/category/FinSet_power_3?proof=binary_copowers">proof</a>), so a quotient in $\FinSet_{3^\bullet}$ must be the quotient taken in $\Set$. However, since there are $4$ equivalence classes, the set $X/R$ has cardinality $4$. Thus, the quotient does not exist in $\FinSet_{3^\bullet}$.

  - property: natural numbers object
    proof: By <a href="/content/natural_numbers_objects#lemma_2">Lemma 2 on natural numbers objects</a>, if $(N,z,s)$ is a natural numbers object, then $N \cong \{\ast\} \sqcup N$. But there is no finite set with this property.

special_objects:
  terminal object:
    description: singleton set
  products:
    description: '[finite case] direct products'

special_morphisms:
  isomorphism:
    description: bijective maps
    proof: It is a full subcategory of $\Set$, in which isomorphisms are bijective maps (<a href="/category/Set?proof=isomorphism" data-allow-deduced>proof</a>).
  monomorphism:
    description: injective maps
    proof: The non-trivial direction follows since the forgetful functor to $\Set$ is representable (by the singleton set), and hence preserves monomorphisms.
  epimorphism:
    description: surjective maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is cocontinuous by <a href="/content/inclusion-functors#lemma_1">Lemma 1 on inclusion functors</a> since $\FinSet_{3^\bullet}$ contains the extremal cogenerator $\{0,1,2\}$ of $\Set$. In particular, it preserves epimorphisms.
