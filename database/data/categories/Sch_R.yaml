id: Sch_R
name: category of schemes
notation: $\Sch_R$
objects: schemes over $R \neq 0$, i.e. locally ringed spaces over $R$ that have an open covering by affine schemes over $R$
morphisms: morphisms of locally ringed spaces over $R$
description: Here, $R$ is a fixed non-trivial commutative ring. The general properties of this category will not depend on the choice of $R$. For $R = \IZ$ we obtain the category $\Sch$ of schemes.
nlab_link: https://ncatlab.org/nlab/show/scheme

tags:
  - algebraic geometry

related:
  - LRS_R
  - Top
  - CAlg(R)
  - Z

comments:
  - Regular monomorphisms are discussed at <a href="https://mathoverflow.net/questions/66279">MO/66279</a>.
  - Epimorphisms are discussed at <a href="https://mathoverflow.net/questions/56564">MO/56564</a>. It is not clear if they can be classified.

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Sch_R \to \LRS_R$ and <a href="/category/LRS_R">$\LRS_R$</a> is locally small.

  - property: terminal object
    proof: The scheme $\Spec(R)$ is terminal.

  - property: pullbacks
    proof: This is the well-known construction of the fiber product of schemes; see e.g. EGA I, Chap. I, Thm. 3.2.1. Alternatively, one can show that $\Sch_R$ is closed under pullbacks in the category <a href="/category/LRS_R">$\LRS_R$</a>, which has pullbacks.

  - property: concretizable
    proof: This is because <a href="/category/LRS_R">$\LRS_R$</a> is concretizable.

  - property: well-powered
    proof: See <a href="https://mathoverflow.net/questions/160681">MO/160681</a>.

  - property: infinitary extensive
    proof: This follows from Lemma 11 <a href="/content/subcategories">here</a> since <a href="/category/LRS_R">$\LRS_R$</a> is infinitary extensive and its full subcategory $\Sch_R$ is closed under pullbacks and coproducts in $\LRS_R$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: Choose a residue field $K$ of $R$. The canonical morphism $$\Spec(K[X]/X \times K[X,X^{-1}]) \longrightarrow \Spec(K[X])$$ is a mono- and an epimorphism, but no isomorphism.

  - property: countable powers
    proof: While all diagrams of affine schemes have a limit in the category of schemes, one can show that an infinite product of quasi-compact non-empty schemes only exists when almost all of them are affine; see <a href="https://mathoverflow.net/questions/65506">MO/65506</a>. Thus, for example, the power $(\IP^1_R)^{\IN}$ does not exist.

  - property: Malcev
    proof: Consider the subscheme $V(x-y) \cup V(y) \subseteq \IA^2_R$. It contains the diagonal but it is not symmetric.

  - property: semi-strongly connected
    proof: This is because already the full subcategory of affine $R$-schemes is not semi-strongly connected, because its dual <a href="/category/CAlg(R)">$\CAlg(R)$</a> is not semi-strongly connected.

  - property: generating collection
    proof: If $S$ is a generating collection of $R$-schemes, then the collection of affine opens of the schemes in $S$ would also be a generating collection. This is then also a generating collection of the category of affine $R$-schemes, corresponding to a cogenerating collection of <a href="/category/CAlg(R)">$\CAlg(R)$</a>, which we know does not exist.

  - property: cokernel pairs
    proof: Choose a residue field $K$ of $R$. Then the span $\IA^1_K \leftarrow \Spec(K(t)) \rightarrow \IA^1_K$ has no pushout; see <a href="https://mathoverflow.net/questions/9961">MO/9961</a>.

  - property: sequential colimits
    proof: It is shown in <a href="https://mathoverflow.net/questions/511944">MO/511944</a> that the diagram $$\IA^1_R \hookrightarrow \IA^2_R \hookrightarrow \IA^3_R \hookrightarrow \cdots$$ has no colimit.

  - property: coequalizers of kernel pairs
    proof: >-
      We have a diagram of closed immersions of affine spaces
      $$\begin{array}{cccc}
      \IA^1_R & \to & \IA^2_R & \to ~ \cdots \\[1ex]
      \downarrow & \swarrow & & \\[1ex]
      \IA^\infty_R, &&&
      \end{array}$$
      where $\IA^n_R = \Spec(R[X_1,\dotsc,X_n])$ and $\IA^\infty_R = \Spec(R[X_1,X_2,\dotsc])$. By <a href="https://mathoverflow.net/questions/511944">MO/511944</a>, the sequence $\IA^1_R \hookrightarrow \IA^2_R \hookrightarrow \cdots$ has no colimit. Moreover, we already know that $\Sch_R$ is infinitary extensive. Hence, Lemma 2 <a href="/content/monic_sequential_colimits">here</a> implies that $\Sch_R$ does not have coequalizers of kernel pairs. Specifically, the kernel pair of $\coprod_{n \geq 0} \IA^n_R \to \IA^\infty_R$ has no coequalizer.

  - property: pullback-stable regular epimorphisms
    proof: >-
      Let $A \coloneqq R[t^2,t^3]$, $B \coloneqq R[t]$, so that $A \subseteq B$ consists of the polynomials $b = \sum_n b_n t^n$ with $b_1 = 0$. Let $X \coloneqq \Spec(B)$, $Y \coloneqq \Spec(A)$, and let $p : X \to Y$ be the morphism induced by the inclusion $A \hookrightarrow B$. For a field $R$, this is the normalization of the cuspidal cubic curve. We claim that $p$ is a regular epimorphism, but that its pullback along some closed immersion is not even an epimorphism.

      First, we show that $A$ is the equalizer of the two homomorphisms $B \rightrightarrows B \otimes_A B$, $b \mapsto b \otimes 1$ and $b \mapsto 1 \otimes b$. Let $R[\varepsilon]$ be the algebra of dual numbers, where $\varepsilon^2 = 0$. The two homomorphisms $\alpha_0,\alpha_1 : B \rightrightarrows R[\varepsilon]$ defined by $\alpha_0(t) \coloneqq 0$ and $\alpha_1(t) \coloneqq \varepsilon$ both map $t^2$ and $t^3$ to $0$, so they agree on $A$. Hence, they induce a homomorphism $\alpha : B \otimes_A B \to R[\varepsilon]$ with $\alpha(b \otimes b') = \alpha_0(b) \, \alpha_1(b')$. If $b \in B$ satisfies $b \otimes 1 = 1 \otimes b$, then
      $$b_0 = \alpha_0(b) = \alpha(b \otimes 1) = \alpha(1 \otimes b) = \alpha_1(b) =  b_0 + b_1 \varepsilon,$$
      hence $b_1 = 0$, i.e. $b \in A$.

      Next, we show that $p$ is the coequalizer of its kernel pair
      $$p_1,p_2 : X \times_Y X = \Spec(B \otimes_A B) \rightrightarrows X$$
      in <a href="/category/LRS_R">$\LRS_R$</a>, and hence also in its full subcategory $\Sch_R$. Recall from the proof of cocompleteness of $\LRS_R$ that coequalizers in $\LRS_R$ are computed as in ringed spaces: the underlying space is the coequalizer of the underlying spaces, and the structure sheaf is the equalizer of the push-forwards of the structure sheaves. Since $B$ is integral over $A$, the continuous map $|p|$ is surjective and closed by the lying over and going up theorems (<a href="https://stacks.math.columbia.edu/tag/00GQ">SP/00GQ</a>, <a href="https://stacks.math.columbia.edu/tag/00GU">SP/00GU</a>, <a href="https://stacks.math.columbia.edu/tag/00HZ">SP/00HZ</a>), hence a quotient map. If $x_1,x_2 \in |X|$ satisfy $|p|(x_1) = |p|(x_2)$, then there is some $z \in |X \times_Y X|$ with $|p_1|(z) = x_1$ and $|p_2|(z) = x_2$ by <a href="https://stacks.math.columbia.edu/tag/01JT">SP/01JT</a>. Hence, $|p|$ is the coequalizer of $|p_1|,|p_2|$ in <a href="/category/Top">$\Top$</a>. Let $q \coloneqq p \circ p_1 = p \circ p_2$. Since $p$ and $q$ are affine, the diagram of sheaves
      $$\O_Y \to |p|_* \O_X \rightrightarrows |q|_* \O_{X \times_Y X}$$
      is the one associated with the diagram of $A$-modules $A \to B \rightrightarrows B \otimes_A B$. Since the functor $M \mapsto \widetilde{M}$ is exact, the first step implies that it is an equalizer diagram. This shows that $p$ is a regular epimorphism.

      Finally, let $I \coloneqq t^2 A$. The pullback of $p$ along the closed immersion $\Spec(A/I) \hookrightarrow Y$ is the morphism $p' : \Spec(B/IB) \to \Spec(A/I)$ induced by the canonical homomorphism
      $$j : A/I \to B/IB.$$
      We claim that $p'$ is not an epimorphism. In fact, since the functor $\Spec : \CAlg(R)^{\op} \to \Sch_R$ is right adjoint to the global sections functor $\Gamma : \Sch_R \to \CAlg(R)^{\op}$, the latter preserves epimorphisms. So if $p'$ were an epimorphism, then $\Gamma(p') = j$ would be a monomorphism in $\CAlg(R)$, i.e. injective. But every element of $I$ has a vanishing coefficient at $t^3$, so $t^3 \notin I$, whereas $t^3 = t^2 \cdot t \in IB$. Thus, $[t^3] \in A/I$ a non-zero element in $\ker(j)$.

  - property: regular subobject classifier
    proof: The proof for <a href="/category/LRS_R">$\LRS_R$</a> translates verbatim to $\Sch_R$.
    references:
      - LRS_R_no_regular_subobject_classifier

special_objects:
  initial object:
    description: empty scheme $X \cong \Spec(0)$, given by $|X| \coloneqq \varnothing$ and $\O_X(\varnothing) \coloneqq 0$
  terminal object:
    description: affine scheme $\Spec(R)$
  coproducts:
    description: The coproduct $X$ of a family $(X_i)_{i \in I}$ is given by $|X| \coloneqq \coprod_{i \in I} |X_i|$ and $\O_X(U) \coloneqq \prod_{i \in I} \O_{X_i}(U \cap |X_i|)$ for open subsets $U \subseteq |X|$.
  products:
    description: '[finite case] There are two descriptions. (a) The product in <a href="/category/LRS_R">$\LRS_R$</a> (see there) is a scheme. (b) The idea is to use $\Spec(A) \times \Spec(B) = \Spec(A \otimes_R B)$ and then to glue affine pieces together. See <a href="https://en.wikipedia.org/wiki/%C3%89l%C3%A9ments_de_g%C3%A9om%C3%A9trie_alg%C3%A9brique">Grothendieck–Dieudonné</a>, EGA I (1971), Ch. I, Thm. 3.2.1.'

special_morphisms:
  isomorphism:
    description: 'A morphism $f : X \to Y$ is an isomorphism iff $|f| : |X| \to |Y|$ is a homeomorphism and $f^\sharp : \O_Y \to |f|_* \O_X$ is an isomorphism of sheaves.'
    proof: This description is inherited from <a href="/category/LRS_R">$\LRS_R$</a>.
  monomorphism:
    description: 'A morphism $f : X \to Y$ is a monomorphism iff $|f| : |X| \to |Y|$ is injective and for every $x \in |X|$ the stalk map $f^\sharp_x : \O_{Y,|f|(x)} \to \O_{X,x}$ is an epimorphism of commutative rings.'
    proof: >-
      Assume that $f$ satisfies the two conditions. Then every stalk map $f^\sharp_x$ is also an epimorphism in the category of local commutative rings and local homomorphisms. By the classification of monomorphisms in <a href="/category/LRS_R">$\LRS_R$</a>, $f$ is a monomorphism in $\LRS_R$, hence also in its full subcategory $\Sch_R$.

      Conversely, assume that $f$ is a monomorphism. The proof for $\LRS_R$ shows that $|f|$ is injective, since the locally ringed spaces with a single point and a field $F$ as stalk used there are the schemes $\Spec(F)$. Now let $x \in |X|$ and $y \coloneqq |f|(x)$. Recall that there is a canonical morphism $\iota_x : \Spec(\O_{X,x}) \to X$, and that the square
      $$\begin{CD} \Spec(\O_{X,x}) @>{\iota_x}>> X \\ @V{\Spec(f^\sharp_x)}VV @VV{f}V \\ \Spec(\O_{Y,y}) @>>{\iota_y}> Y \end{CD}$$
      commutes. We claim that $\iota_x$ is a monomorphism. Indeed, choose an affine open neighborhood $U \cong \Spec(A)$ of $x$, and let $\p \subseteq A$ be the prime ideal corresponding to $x$, so that $\O_{X,x} \cong A_\p$. Then $\iota_x$ is the composite of $\Spec(A_\p) \to \Spec(A)$ and the open embedding $U \hookrightarrow X$. The former is a monomorphism since the localization $A \to A_\p$ is an epimorphism of $R$-algebras and $\Spec : \CAlg(R)^{\op} \to \Sch_R$ is a right adjoint (of the global sections functor), and open embeddings are monomorphisms.

      Hence, $f \circ \iota_x = \iota_y \circ \Spec(f^\sharp_x)$ is a monomorphism, and therefore $\Spec(f^\sharp_x)$ is a monomorphism. Since $\Spec : \CAlg(R)^{\op} \to \Sch_R$ is fully faithful, $f^\sharp_x$ is an epimorphism in $\CAlg(R)$. This means that it is an epimorphism of commutative rings, since $\CAlg(R)$ is the coslice category of the category of commutative rings under $R$, and epimorphisms in a coslice category are the same as in the underlying category.

      The same classification is proven in <a href="https://math.stackexchange.com/questions/1650634/a/5145540">MSE/1650634</a>. For a classification of monomorphisms locally of finite type, see <a href="https://en.wikipedia.org/wiki/%C3%89l%C3%A9ments_de_g%C3%A9om%C3%A9trie_alg%C3%A9brique">Grothendieck–Dieudonné</a>, EGA IV<sub>4</sub> (1967), Prop. 17.2.6.

      Alternatively, the inclusion functor $\Sch_R \to \LRS_R$ preserves pullbacks (<a href="https://stacks.math.columbia.edu/tag/01JN">SP/01JN</a>), hence monomorphisms. Since it is also faithful, the monomorphisms in $\Sch_R$ are exactly the morphisms of schemes that are monomorphisms in $\LRS_R$, i.e. those $f$ for which $|f|$ is injective and the stalk maps are epimorphisms in the category of local commutative rings. This description only looks weaker than the one above: in general, an epimorphism of local commutative rings need not be an epimorphism of commutative rings (see the example in $\LRS_R$), but for the stalk maps of a morphism of schemes with injective underlying map, both notions agree by the proof above.
