id: Top_*
name: category of pointed topological spaces
notation: $\Top_*$
objects: pointed topological spaces
morphisms: pointed continuous functions
description: This category plays an important role in algebraic topology and homotopy theory. Although it may appear similar to $\Top$, adding a base point drastically changes its categorical properties. In particular, it introduces a zero object.
nlab_link: https://ncatlab.org/nlab/show/pointed+topological+space

tags:
  - topology

related:
  - Set_*
  - Top

satisfied_properties:
  - property: locally small
    proof: There is a faithful forgetful functor $\Top_* \to \Set_*$, and $\Set_*$ is locally small (<a href="/category/Set_*?proof=locally_small" data-allow-deduced>proof</a>).

  - property: pointed
    proof: The singleton space $\{0\}$ with base point $0$ is a zero object.
    check_redundancy: false

  - property: complete
    proof: This follows from $\Top_* \cong 1 / \Top$ and the fact that $\Top$ is complete (<a href="/category/Top?proof=complete" data-allow-deduced>proof</a>). Concretely, the limit of pointed spaces $(X_i,x_i)$ is the limit of the underlying spaces $X_i$ equipped with the base point that projects down to each $x_i$.
    check_redundancy: false

  - property: coequalizers
    proof: This follows immediately from the fact that $\Top$ has coequalizers (<a href="/category/Top?proof=coequalizers" data-allow-deduced>proof</a>).
    check_redundancy: false

  - property: coproducts
    proof: This follows from $\Top_* \cong 1 / \Top$ and the fact that $\Top$ has wide pushouts (<a href="/category/Top?proof=wide_pushouts" data-allow-deduced>proof</a>).
    check_redundancy: false

  - property: well-powered
    proof: This is clear since the monomorphisms are the injective pointed continuous maps (<a href="/category/Top_*?proof=monomorphism">proof</a>).

  - property: well-copowered
    proof: This is clear since the epimorphisms are the surjective pointed continuous maps (<a href="/category/Top_*?proof=epimorphism">proof</a>).

  - property: generator
    proof: The discrete space $\{0,1\}$ with base point $0$ is a generator since it represents the forgetful functor $\Top_* \to \Set$.

  - property: regular subobject classifier
    proof: The indiscrete two-point space $\{0,1\}$ with base point $1$ is a regular subobject classifier since pointed continuous maps $X \to \{0,1\}$ correspond to pointed subsets of $X$ (by taking the fiber of $1$ as usual).

  - property: counital
    proof: Since embeddings are regular monomorphisms in this category (<a href="/category/Top_*?proof=regular_monomorphism">proof</a>) and hence strong monomorphisms, it suffices to prove that the canonical morphism $X \vee Y \hookrightarrow X \times Y$ is an embedding. For a proof, see <a href="https://math.stackexchange.com/questions/4055988">MSE/4055988</a>.

  - property: CIP
    proof: This follows since $\Set_*$ has this property (<a href="/category/Set_*?proof=CIP" data-allow-deduced>proof</a>) and the forgetful functor preserves products and coproducts.

  - property: cocartesian cofiltered limits
    proof: >-
      We continue the <a href="/category/Set_*?proof=cocartesian_cofiltered_limits">proof</a> for $\Set_*$ by showing that the natural bijective map
      $$\textstyle \alpha : X \vee \lim_i Y_i \to \lim_i (X \vee Y_i)$$
      is open. It suffices to consider open sets of two types: (1) If $U \subseteq X$ is open, the $\alpha$-image of $U \vee \lim_i Y_i$ is $p_{i_0}^*(U \vee Y_{i_0})$ for any chosen index $i_0$, hence open. (2) If $i$ is an index and $V_i \subseteq Y_i$ is open, then the $\alpha$-image of $X \vee (p_i^*(V_i) \cap \lim_i Y_i)$ is $p_i^*(X \vee V_i)$, hence open.

  - property: filtered-colimit-stable monomorphisms
    proof: This follows from Lemma 2 <a href="/content/subcategories">here</a> applied to the forgetful functor to $\Set$.

  - property: product-stable epimorphisms
    proof: Apply the dual of Lemma 2 <a href="/content/subcategories">here</a> to the forgetful functor $\Top_* \to \Set$, which preserves products (<a href="/category/Top_*?proof=complete">proof</a>) and epimorphisms (<a href="/category/Top_*?proof=epimorphism">proof</a>).

  - property: coregular
    proof: This follows from the dual of Lemma 7 <a href="/content/subcategories">here</a> applied to the forgetful functor $\Top_* \to \Top$, using that $\Top$ is coregular (<a href="/category/Top?proof=coregular" data-allow-deduced>proof</a>) and that the regular monomorphisms in $\Top_*$ are the embeddings (<a href="/category/Top_*?proof=regular_monomorphism">proof</a>).

  - property: extremal cogenerator
    proof: >-
      It is easily checked that the indiscrete two-point space $\{0,1\}$ with base point $1$ is a cogenerator, using the fact that the pointed set $\{0,1\}$ with base point $1$ is a cogenerator of $\Set_*$ (<a href="/category/Set_*?proof=cogenerator">proof</a>). If $S$ is the Sierpiński space on $\{0,1\}$, we claim that adding $(S, 0)$ and $(S, 1)$ gives an extremal cogenerating collection. To see this, let $f : X \to Y$ be a continuous function. Then $f$ inducing a bijection on maps to $(\{0,1\},1)$ implies that the underlying function of $f$ is bijective. In particular, because $f$ is injective, we see that for $V$ an open subset of $Y$, $f^*(V)$ contains the base point of $X$ if and only if $V$ contains the base point of $Y$. Also, $f$ inducing a bijection on maps to $(S, 1)$ implies that $f^* : \Open(Y) \to \Open(X)$ is bijective on the open sets containing the base points, and $f$ inducing a bijection on maps to $(S, 0)$ implies that $f^* : \Open(Y) \to \Open(X)$ is bijective on the open sets not containing the base points. From these observations, we can conclude that $f$ is a homeomorphism.

      Now, by <a href="/content/generator_construction">this result</a>, we get that the product of these three pointed topological spaces is an extremal cogenerator of $\Top_*$.

unsatisfied_properties:
  - property: skeletal
    proof: The pointed one-point spaces $(\{0\},0)$ and $(\{1\},1)$ are zero objects, hence isomorphic, but not equal.

  - property: pullback-stable regular epimorphisms
    proof: See Example 3.14 at the <a href="https://ncatlab.org/nlab/show/regular+category">nLab</a>. The proof also works for pointed spaces (resp. posets) by using the base points $a$ and $0$.

  - property: cartesian filtered colimits
    proof: 'The functor $\IQ \times - : \Top_* \to \Top_*$ does not preserve colimits; see <a href="https://math.stackexchange.com/questions/2969372">MSE/2969372</a>. The counterexample also works for pointed spaces.'

  - property: co-Malcev
    proof: 'We can adjust the <a href="/category/Top?proof=co-Malcev">proof</a> for $\Top$ as follows: Consider the forgetful functor $U : \Top_* \to \Set$ and the relation $R \subseteq U^2$ defined by $R(X) \coloneqq \{(x,y) \in U(X)^2 : x \in \overline{\{y\}} \}$. Both are representable: $U$ by the discrete space $\{0,1\}$ with base point $0$ and $R$ by the Sierpiński space with an isolated base point added. It is clear that $R$ is reflexive, but not symmetric.'

  - property: unital
    proof: 'The joint image of $X \to X \times Y \leftarrow Y$ is just $\{(x,0) : x \in X\} \cup \{(0,y) : y \in Y\}$ (where $0$ denotes the base point), which is clearly a proper subset of $X \times Y$ when both $X,Y$ are non-trivial.'

  - property: CSP
    # TODO: remove duplication with unital proof, cf. #382
    proof: 'The image of $X \vee Y$ in $X \times Y$ is just $\{(x,0) : x \in X\} \cup \{(0,y) : y \in Y\}$ (where $0$ denotes the base point), which is clearly a proper subset when both $X,Y$ are non-trivial.'

  - property: regular quotient object classifier
    proof: 'If there were a regular quotient object classifier, every regular epimorphism would be a cokernel. By considering discrete spaces, it would follow that every surjective pointed map between pointed sets is a cokernel, i.e. that $\Set_*$ is conormal (<a href="/category/Set_*?proof=conormal">proof</a>). But we already know that this is not the case, since cokernels are "injective away from the base point".'

  - property: coaccessible
    proof: >-
      Apply the corollary <a href="/content/decreasing-chains-coaccessible">here</a> to the functor $F : \Set \to \Top_*$ that maps a set $X$ to the discrete space $X_+ \coloneqq \{\ast\} \sqcup X$ with base point $\ast$. Here, $F(\{\ast\})$ is not initial. Let $\kappa$ be a regular cardinal. Since $\Top_*$ is complete (<a href="/category/Top_*?proof=complete" data-allow-deduced>proof</a>) and the forgetful functor $\Top_* \to \Set$ preserves limits, the limit of the pointed spaces $F(\kappa_{\geq \alpha})$ has the underlying set $\{\ast\} \sqcup \bigcap_{\alpha < \kappa} \kappa_{\geq \alpha} = \{\ast\}$. Hence, it is the zero object.

  - property: cofiltered-limit-stable epimorphisms
    proof: We already know that $\Set_*$ does not have this property (<a href="/category/Set_*?proof=cofiltered-limit-stable_epimorphisms" data-allow-deduced>proof</a>). Now apply the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> to the functor $\Set_* \to \Top_*$ that equips a pointed set with the indiscrete topology.

  - property: effective congruences
    proof: Suppose that $\Top_*$ had effective congruences. Then by <a href="/content/coslice-effective-congruences">this result</a>, $\Top$ would also have effective congruences, which is not the case (<a href="/category/Top?proof=effective_congruences" data-allow-deduced>proof</a>).

  - property: effective cocongruences
    proof: 'This counterexample is adapted from the <a href="/category/Top?proof=effective_cocongruences">counterexample</a> for $\Top$. Consider the pointed topological space $I \coloneqq \{ \ast, a, b \}$ with topology $\{ \varnothing, \{ \ast \}, \{ a, b \}, \{ \ast, a, b \} \}$. This represents the functor which sends a pointed topological space $X$ to the pairs of indistinguishable points of $X$. Therefore, we get a cocongruence $\{ \ast, a \} \rightrightarrows I$ on the discrete space $\{ \ast, a \}$, where the maps are $\ast \mapsto \ast, a \mapsto a$ and $\ast \mapsto \ast, a \mapsto b$, respectively. However, this cannot be effective: if we have $h : Z \to \{ \ast, a \}$ which equalizes the cocongruence, then $h$ must be the constant function with value $\ast$. But that means the cokernel pair of $h$ is the discrete space on $\{ \ast, a, b \}$.'

  - property: extremal generating collection
    proof: 'The argument is similar to the <a href="/category/Top?proof=extremal_generating_collection">proof</a> for $\Top$: if $S$ is a set of pointed topological spaces and $\kappa$ is an infinite regular cardinal greater than $\card(G)$ for every $G\in S$, we show as before that morphisms from $S$ cannot detect the failure of $(\kappa \sqcup \{ \kappa \}, 0) \to (\kappa + 1, 0)$ to be an isomorphism (where as before, we use the standard order topology on both $\kappa$ and $\kappa + 1$).'

special_objects:
  initial object:
    description: singleton space with the unique base point
  terminal object:
    description: singleton space with the unique base point
  coproducts:
    description: wedge sum, aka one-point union
  products:
    description: direct product with the <a href="https://en.wikipedia.org/wiki/Product_topology">product topology</a> and the obvious base point

special_morphisms:
  isomorphism:
    description: pointed homeomorphisms
    proof: This is easy.
  monomorphism:
    description: injective pointed continuous maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the discrete two-point space), hence preserves monomorphisms.
  epimorphism:
    description: surjective pointed continuous maps
    proof: 'For the non-trivial direction: The forgetful functor $\Top_* \to \Top$ preserves pushouts and hence also epimorphisms, and the epimorphisms in $\Top$ are surjective (<a href="/category/Top?proof=epimorphism" data-allow-deduced>proof</a>).'
  regular monomorphism:
    description: embeddings
    proof: 'Equalizers are embeddings by their construction. Conversely, if $f : X \to Y$ is an embedding, then $f$ is the equalizer of the two characteristic maps $\chi_Y, \chi_{f(X)} : Y \rightrightarrows \{0,1\}$, where $\{0,1\}$ carries the indiscrete topology and $1$ is the base point.'
  regular epimorphism:
    description: surjective pointed quotient maps
    proof: 'Regular epimorphisms are surjective pointed quotient maps by the explicit construction of coequalizers. Conversely, if $q : X \to Y$ is a surjective pointed quotient map, then one checks that $q$ is the coequalizer of its kernel pair $X \times_Y X \rightrightarrows X$: This is true for the underlying pointed sets, and continuity of the induced morphism follows since $q$ is a quotient map.'
