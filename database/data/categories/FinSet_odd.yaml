id: FinSet_odd
name: category of finite sets of odd cardinality
notation: $\FinSet_{\odd}$
objects: finite sets of odd cardinality
morphisms: maps
description: This is the full subcategory of $\FinSet$ consisting of finite sets of odd cardinality, for example $\{0\}$ and $\{0,1,2\}$, but not $\varnothing$. We have included this category only because of its interesting property combinations.
nlab_link: null

tags:
  - set theory

related:
  - FinSet
  - FinSet_even
  - FinSet_power_3

satisfied_properties:
  - property: locally small
    proof: It is a full subcategory of <a href="/category/FinSet">$\FinSet$</a>, which is locally small.

  - property: locally finite
    proof: This property is inherited from <a href="/category/FinSet">$\FinSet$</a>.

  - property: essentially countable
    proof: This property is inherited from <a href="/category/FinSet">$\FinSet$</a>.

  - property: all epimorphisms split
    proof: Apply Lemma 15 <a href="/content/subcategories">here</a> to the inclusion $\FinSet_{\odd} \hookrightarrow \Set$, which preserves epimorphisms since these are surjective in both categories (<a href="/category/FinSet_odd?proof=epimorphism">proof</a> for $\FinSet_{\odd}$ and <a href="/category/Set?proof=epimorphism">proof</a> for $\Set$), and use that <a href="/category/Set">$\Set$</a> has all epimorphisms split.

  - property: all monomorphisms split
    proof: Apply the dual of Lemma 15 <a href="/content/subcategories">here</a> to the inclusion $\FinSet_{\odd} \hookrightarrow \Setne$, which preserves monomorphisms since these are injective in both categories (<a href="/category/FinSet_odd?proof=monomorphism">proof</a> for $\FinSet_{\odd}$ and <a href="/category/Setne?proof=monomorphism">proof</a> for $\Setne$), and use that <a href="/category/Setne">$\Setne$</a> has all monomorphisms split.

  - property: strongly connected
    proof: Use constant maps.

  - property: cartesian closed
    proof: This follows from the fact that the product of finitely many odd natural numbers is again odd. Hence, powers of odd numbers are also odd.

  - property: kernel pairs
    proof: >-
      If $f : X \to Y$ is a map of finite sets with odd cardinality, then we claim that its kernel pair in $\FinSet$, the set $\{(x,x') \in X \times X : f(x) = f(x')\}$, also has odd cardinality. It decomposes into the diagonal $\{(x,x): x \in X\} \cong X$, which has odd cardinality, and the set of pairs $(x,x')$ with $x \neq x'$ and $f(x) = f(x')$. The latter has even cardinality since $C_2$ acts on it via $(x,x') \mapsto (x',x)$ without fixed points. Now use that "odd + even = odd".

  - property: extremal generator
    proof: The set $\{0\}$ is an extremal generator even in $\Set$ (<a href="/category/Set?proof=extremal_generator">proof</a>). Now apply Lemma 10 <a href="/content/subcategories">here</a>.

  - property: extremal cogenerator
    proof: The set $\{0,1,2\}$ is an extremal cogenerator even in <a href="/category/Set">$\Set$</a>. Now apply Lemma 10 <a href="/content/subcategories">here</a>.

  - property: effective congruences
    proof: Let $R \rightrightarrows X$ be a congruence in $\FinSet_{\odd}$. By applying the (functorial) definition to the test object $T = \{\ast\}$, we see that it is a congruence in $\Set$, i.e. an equivalence relation, such that $R$ and $X$ are finite sets of odd cardinality. The finite set $X/R$ embeds into a finite set $Q$ of odd cardinality (either $X/R$ or $X/R + \{\ast\}$). Then $R \rightrightarrows X$ is the kernel pair of $X \twoheadrightarrow X/R \hookrightarrow Q$ in $\FinSet_{\odd}$.

  - property: effective cocongruences
    proof: >-
      Let $X \rightrightarrows C$ be a cocongruence in $\FinSet_{\odd}$. The induced map
      $$\Hom(C,\{0,1,2\}) \to \Hom(X,\{0,1,2\})^2 \cong \Hom(X+X, \{0,1,2\})$$
      is injective, which implies that $X+X \to C$ is surjective (where $X+X$ denotes the coproduct in $\Set$, which does not exist in $\FinSet_{\odd}$). It follows that $X \rightrightarrows C$ is a coreflexive corelation in $\Set$. Since <a href="/category/Set">$\Set$</a> is co-Malcev and has effective cocongruences (by <a href="/category-implication/regular_epi-regular_extensive_consequences">this result</a>), there is a subset $Y \subseteq X$ such that $C \cong X \sqcup_Y X$ in $\Set$, with $X \rightrightarrows C$ corresponding to the two pushout inclusions. We have $\card(C) = 2 \card(X) - \card(Y)$, so $\card(Y)$ is odd. Hence, $C \cong X \sqcup_Y X$ remains true in $\FinSet_{\odd}$.

  - property: coquotients of cocongruences
    proof: We have just seen that every cocongruence in $\FinSet_{\odd}$ is of the form $X \rightrightarrows X \sqcup_Y X$ for some subset $Y \subseteq X$ of odd cardinality (<a href="/category/FinSet_odd?proof=effective_cocongruences">proof</a>). The equalizer in $\Set$ is the inclusion $Y \hookrightarrow X$. Since this morphism lies in $\FinSet_{\odd}$, it is also the equalizer in $\FinSet_{\odd}$.

unsatisfied_properties:
  - property: skeletal
    proof: The two sets $\{0\}$ and $\{1\}$ are isomorphic but not equal.

  - property: small
    proof: Even the collection of all singleton sets is not a set, since every set $X$ yields the singleton $\{X\}$.

  - property: countable
    proof: Even the collection of all singletons is not countable, since every set $X$ yields the singleton $\{X\}$.

  - property: Cauchy complete
    proof: 'The map $e : \{0,1,2\} \to \{0,1,2\}$, $0 \mapsto 0$, $1 \mapsto 1$, $2 \mapsto 1$ is idempotent and does not split in $\FinSet_{\odd}$, since a splitting $\{0,1,2\} \to X \to \{0,1,2\}$ would also be a splitting in $\FinSet$, making $X$ isomorphic to $\im(e) = \{0,1\}$.'

  - property: cofiltered
    proof: 'The maps $0,1 : \{\ast\} \rightrightarrows \{0,1,2\}$ are not equalized by any morphism, since this would amount to a set $X$ in $\FinSet_{\odd}$ such that $! : X \to \{\ast\}$ factors through $\varnothing$, i.e. $X = \varnothing$, which is not a valid object of $\FinSet_{\odd}$.'

  - property: binary copowers
    proof: A direct proof is possible, but it is best to first establish that the inclusion functor $\FinSet_{\odd} \hookrightarrow \Set$ is cocontinuous. This follows from Lemma 1 <a href="/content/inclusion-functors">here</a> since $\FinSet_{\odd}$ contains the extremal cogenerator $\{0,1,2\}$ of $\Set$. Therefore, binary copowers exist only if $\FinSet_{\odd}$ is closed under binary copowers in $\Set$. But $\{0\} \sqcup \{0\}$ does not have odd cardinality.

  - property: natural numbers object
    proof: By Lemma 2 <a href="/content/natural_numbers_objects">here</a>, if $(N,z,s)$ is a natural numbers object, then $N \cong \{\ast\} \sqcup N$. But there is no finite set with this property.

special_objects:
  terminal object:
    description: singleton set
  products:
    description: '[finite case] direct products'

special_morphisms:
  isomorphism:
    description: bijective maps
    proof: It is a full subcategory of $\Set$, in which isomorphisms are bijective maps.
  monomorphism:
    description: injective maps
    proof: 'The non-trivial direction follows since the inclusion functor to $\Set$ is representable (by the singleton set), and hence preserves monomorphisms.'
  epimorphism:
    description: surjective maps
    proof: For the non-trivial direction, the inclusion functor to $\Set$ is cocontinuous by Lemma 1 <a href="/content/inclusion-functors">here</a> since $\FinSet_{\odd}$ contains the extremal cogenerator $\{0,1,2\}$ of $\Set$. In particular, it preserves epimorphisms.
