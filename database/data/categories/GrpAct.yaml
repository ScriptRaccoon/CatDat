id: GrpAct
name: category of group actions
notation: $\GrpAct$
objects: pairs $(G,X)$ consisting of a group $G$ and a set $X$ with a left action of $G$, written $g \cdot x$
morphisms: 'A morphism $(G,X) \to (H,Y)$ is a pair $(\varphi,f)$ consisting of a group homomorphism $\varphi : G \to H$ and a map $f : X \to Y$ such that $f(g \cdot x) = \varphi(g) \cdot f(x)$ for all $g \in G$ and $x \in X$.'
description: >-
  This category combines the categories $G{-}\Set$ for all groups $G$ (see <a href="/category/M-Set">$M{-}\Set$</a>). More precisely, it is the Grothendieck construction of the functor $\Grp^{\op} \to \Cat^+$ that maps a group $G$ to $G{-}\Set$ and a homomorphism to the restriction functor.
nlab_link: null
keywords:
  - G-sets

tags:
  - algebra

related:
  - Grp
  - Set
  - M-Set
  - Z-Set

satisfied_properties:
  - property: locally small
    proof: 'The collection of morphisms $(G,X) \to (H,Y)$ is a subcollection of $\Hom(G,H) \times \Hom(X,Y)$, which is a set since <a href="/category/Grp">$\Grp$</a> and <a href="/category/Set">$\Set$</a> are locally small.'

  - property: semi-strongly connected
    proof: 'Let $(G,X)$ and $(H,Y)$ be two objects. If $Y \neq \varnothing$, choose $y \in Y$. Then the trivial homomorphism $G \to H$ and the constant map $X \to Y$ with value $y$ form a morphism $(G,X) \to (H,Y)$. If $Y = \varnothing$, then the trivial homomorphism $H \to G$ and the empty map $\varnothing \to X$ form a morphism $(H,Y) \to (G,X)$.'

  - property: finitary algebraic
    proof: 'Consider the algebraic theory with two sorts $G,X$, the operations of a group on $G$ (multiplication $G \times G \to G$, unit $1 \to G$, inverse $G \to G$), and an operation $G \times X \to X$, subject to the group axioms and the axioms of a left action. Its models are precisely group actions, and the homomorphisms of models are precisely the morphisms of $\GrpAct$.'

  - property: disjoint coproducts
    proof: >-
      Let $(G_i,X_i)_{i \in I}$ be a family of objects and $G \coloneqq \coprod_{i \in I} G_i$. We use the description of the coproduct below. The coproduct inclusion $(G_i,X_i) \to (G, \coprod_{j \in I} G \times_{G_j} X_j)$ consists of the inclusion $G_i \to G$, which is injective, and the map $X_i \to G \times_{G_i} X_i$, $x \mapsto [1,x]$, which is injective as well: if $[1,x] = [1,x']$, there is some $g \in G_i$ with $(1,x') = (g^{-1}, g \cdot x)$, so $g = 1$ and $x = x'$. Hence, the inclusions are monomorphisms (see below). For $i \neq j$, the pullback of the two inclusions is computed component-wise. Its group is $G_i \cap G_j = 1$ inside the free product $G$, and its set is empty since the images of $X_i$ and $X_j$ lie in different summands. So the pullback is the initial object $(1,\varnothing)$.

  - property: mono-regular
    proof: >-
      For an object $(G,X)$, let $F(X)$ be the free group on $X$. The action of $G$ on $X$ extends uniquely to an action of $G$ on $F(X)$ by automorphisms, so that the semidirect product $F(X) \rtimes G$ is defined. We regard $X$ and $G$ as subsets of it. Consider the functor $S : \GrpAct \to \Grp$ that maps $(G,X)$ to $F(X) \rtimes G$, and a morphism $(\varphi,f) : (G,X) \to (H,Y)$ to the homomorphism
      $$S(\varphi,f) : F(X) \rtimes G \to F(Y) \rtimes H, \quad (w,g) \mapsto (F(f)(w),\varphi(g)),$$
      where $F(f) : F(X) \to F(Y)$ is the homomorphism induced by $f$. This is a homomorphism since $F(f)(g \cdot w) = \varphi(g) \cdot F(f)(w)$ holds for all $g \in G$ and $w \in F(X)$: both sides are homomorphisms in $w$, and they agree on $X$ since $f(g \cdot x) = \varphi(g) \cdot f(x)$.

      <strong>Claim.</strong> $S$ is left adjoint to the functor $R : \Grp \to \GrpAct$, $K \mapsto (K,K)$, where $K$ acts on itself by conjugation. The unit at $(G,X)$ consists of the inclusions of $G$ and $X$ into $F(X) \rtimes G$.

      By the universal property of the semidirect product, a homomorphism $F(X) \rtimes G \to K$ corresponds to a pair of homomorphisms $\alpha : F(X) \to K$ and $\psi : G \to K$ satisfying $\alpha(g \cdot w) = \psi(g) \, \alpha(w) \, \psi(g)^{-1}$ for all $g \in G$ and $w \in F(X)$, namely its restrictions. Since both sides are homomorphisms in $w$, it suffices to require this for $w \in X$. Hence, such a homomorphism corresponds to a pair of a homomorphism $\psi : G \to K$ and a map $h : X \to K$ satisfying $h(g \cdot x) = \psi(g) \, h(x) \, \psi(g)^{-1}$, which is precisely a morphism $(\psi,h) : (G,X) \to (K,K)$. Here, $\psi$ and $h$ are the restrictions of the homomorphism to $G$ and $X$. For the identity of $F(X) \rtimes G$, these are the inclusions.

      Now let $(H,Y) \hookrightarrow (G,X)$ be a monomorphism. By the classification of monomorphisms (see below), we may assume that $H \subseteq G$ is a subgroup and $Y \subseteq X$ is an $H$-invariant subset. Then $S$ maps it to the inclusion of the subgroup $F(Y) \rtimes H \subseteq F(X) \rtimes G$, which is a regular monomorphism since <a href="/category/Grp">$\Grp$</a> is mono-regular. As a right adjoint, $R$ preserves equalizers and hence regular monomorphisms. By naturality of the unit, we have a commutative square
      $$\begin{CD} (H,Y) @>>> (F(Y) \rtimes H,\, F(Y) \rtimes H) \\ @VVV @VVV \\ (G,X) @>>> (F(X) \rtimes G,\, F(X) \rtimes G) \end{CD}$$
      whose right morphism is therefore a regular monomorphism. The square is a pullback: since limits are computed component-wise, this amounts to $G \cap (F(Y) \rtimes H) = H$ and $X \cap (F(Y) \rtimes H) = X \cap F(Y) = Y$ inside $F(X) \rtimes G$, which holds by construction of the semidirect product. Since regular monomorphisms are stable under pullback, the inclusion $(H,Y) \hookrightarrow (G,X)$ is a regular monomorphism.
    label: GrpAct_mono_regular

  - property: effective cocongruences
    proof: >-
      We apply Proposition 2 <a href="/content/cocongruences_of_groups">here</a>. We already know that $\GrpAct$ has equalizers, and it is balanced since it is mono-regular. It remains to show that $\GrpAct$ has good pushouts of monomorphisms, as defined on that page.

      To this end, we apply Lemma 4 on that page to the functor $S : \GrpAct \to \Grp$, $(G,X) \mapsto F(X) \rtimes G$ from the proof of mono-regularity. Here, $\GrpAct$ is cocomplete, $\Grp$ has good pushouts of monomorphisms by Proposition 1 on that page, and $S$ preserves pushouts as a left adjoint. We verify the remaining assumptions of the lemma in the following claims.

      <strong>Claim 1.</strong> $S$ is faithful.

      This holds since $\varphi$ and $f$ are the restrictions of $S(\varphi,f)$ to $G$ and $X$.

      <strong>Claim 2.</strong> $S$ preserves monomorphisms.

      This is elementary and was already remarked in the proof of mono-regularity.

      <strong>Claim 3.</strong> $S$ preserves pullbacks of pairs of monomorphisms.

      By the classification of monomorphisms (see below), it suffices to consider two subobjects $(G_1,X_1), (G_2,X_2) \subseteq (G,X)$, where $G_i \subseteq G$ is a subgroup and $X_i \subseteq X$ is a $G_i$-invariant subset. Since limits are computed component-wise, their pullback is $(G_1 \cap G_2, X_1 \cap X_2)$. Inside $F(X) \rtimes G$, whose underlying set is $F(X) \times G$, we have
      $$\begin{align*}
      (F(X_1) \rtimes G_1) \cap (F(X_2) \rtimes G_2) &= (F(X_1) \cap F(X_2)) \rtimes (G_1 \cap G_2) \\
      &= F(X_1 \cap X_2) \rtimes (G_1 \cap G_2).
      \end{align*}$$
      Here, $F(X_1) \cap F(X_2) = F(X_1 \cap X_2)$ holds since every element of $F(X)$ is represented by a unique reduced word, and it lies in $F(X_i)$ if and only if all letters of this word lie in $X_i$.
    references:
      - GrpAct_mono_regular

unsatisfied_properties:
  - property: skeletal
    proof: 'The objects $(\IZ,\varnothing)$ and $(2\IZ,\varnothing)$ are distinct but isomorphic.'

  - property: strict initial object
    proof: 'The initial object is $(1,\varnothing)$, the empty set with the action of the trivial group. For every non-trivial group $G$, the unique morphism $(G,\varnothing) \to (1,\varnothing)$ is not an isomorphism.'

  - property: generator
    proof: >-
      Assume that $(G,X)$ is a generator. The functor $\Set \to \GrpAct$, $Y \mapsto (1,Y)$ is fully faithful and right adjoint to the functor $\GrpAct \to \Set$ that maps $(G,X)$ to the set of orbits $G \backslash X$, since a morphism $(G,X) \to (1,Y)$ is a map $X \to Y$ that is constant on the orbits of $G$. By Lemma 9 <a href="/content/subcategories">here</a>, $G \backslash X$ is a generator of <a href="/category/Set">$\Set$</a>, so that $X \neq \varnothing$. But then there is no morphism $(G,X) \to (\IZ,\varnothing)$. Therefore, $(G,X)$ does not distinguish the two distinct morphisms $(\id_\IZ,\id_\varnothing), (0,\id_\varnothing) : (\IZ,\varnothing) \rightrightarrows (\IZ,\varnothing)$, where $0 : \IZ \to \IZ$ is the trivial homomorphism.
    label: GrpAct_no_generator

  - property: cogenerating collection
    proof: >-
      The functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ is fully faithful and left adjoint to the forgetful functor $U : \GrpAct \to \Grp$, $(G,X) \mapsto G$, since every homomorphism $G \to H$ extends uniquely to a morphism $(G,\varnothing) \to (H,Y)$. By the dual of Lemma 9 <a href="/content/subcategories">here</a>, $U$ maps a cogenerating collection of $\GrpAct$ to a cogenerating collection of $\Grp$. But <a href="/category/Grp">$\Grp$</a> has no cogenerating collection.
    label: GrpAct_no_cogenerating_collection

  - property: Malcev
    proof: 'Apply the contrapositive of Lemma 13 <a href="/content/subcategories">here</a> to the fully faithful functor $\Set \to \GrpAct$, $Y \mapsto (1,Y)$ from the proof for generators, which preserves finite limits as a right adjoint. Here, we use that <a href="/category/Set">$\Set$</a> is not Malcev.'
    references:
      - GrpAct_no_generator

  - property: co-Malcev
    proof: 'Apply the contrapositive of the dual of Lemma 13 <a href="/content/subcategories">here</a> to the fully faithful functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ from the proof for cogenerating collections, which preserves finite colimits as a left adjoint. Here, we use that <a href="/category/Grp">$\Grp$</a> is not co-Malcev.'
    references:
      - GrpAct_no_cogenerating_collection

  - property: regular subobject classifier
    proof: >-
      Apply the contrapositive of Lemma 1 <a href="/content/subcategories">here</a> to the fully faithful functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ from the proof for cogenerating collections, which is left adjoint to the forgetful functor $U$. By the classification of monomorphisms (see below), every monomorphism into $(G,\varnothing)$ is, up to isomorphism, the image under $L$ of a subgroup inclusion $H \hookrightarrow G$, which is a regular monomorphism since <a href="/category/Grp">$\Grp$</a> is mono-regular. Here, we use that $\Grp$ does not have a regular subobject classifier.
    references:
      - GrpAct_no_cogenerating_collection

  - property: regular quotient object classifier
    proof: >-
      Apply the contrapositive of the dual of Lemma 1 <a href="/content/subcategories">here</a> to the fully faithful functor $\Set \to \GrpAct$, $Y \mapsto (1,Y)$ from the proof for generators, which is right adjoint to the orbit functor. By the classification of epimorphisms (see below), every epimorphism $(1,X) \to (H,Y)$ is surjective in both components, so that $H = 1$. Hence, every epimorphism with domain $(1,X)$ is, up to isomorphism, the image of a surjective map $X \to Y$, which is a regular epimorphism in $\Set$. Here, we use that <a href="/category/Set">$\Set$</a> does not have a regular quotient object classifier.
    references:
      - GrpAct_no_generator

  - property: cofiltered-limit-stable epimorphisms
    proof: >-
      Apply the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> to the faithful functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ from the proof for cogenerating collections. As a left adjoint, it preserves epimorphisms. It also preserves connected limits, in particular cofiltered limits, since limits in $\GrpAct$ are computed component-wise and a connected limit of empty sets is empty. Here, we use that <a href="/category/Grp">$\Grp$</a> does not have cofiltered-limit-stable epimorphisms.
    references:
      - GrpAct_no_cogenerating_collection

  - property: cocartesian cofiltered limits
    proof: >-
      Apply the contrapositive of the dual of Lemma 4 <a href="/content/subcategories">here</a> to the fully faithful functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ from the proof for cogenerating collections. As a left adjoint, it preserves binary coproducts. It also preserves connected limits, in particular cofiltered limits, since limits in $\GrpAct$ are computed component-wise and a connected limit of empty sets is empty. Here, we use that <a href="/category/Grp">$\Grp$</a> does not have cocartesian cofiltered limits.
    references:
      - GrpAct_no_cogenerating_collection

  - property: pushout-stable regular monomorphisms
    proof: >-
      Apply the contrapositive of Lemma 14 <a href="/content/subcategories">here</a> to the fully faithful functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ from the proof for cogenerating collections. As a left adjoint, it preserves pushouts. It also preserves connected limits, in particular equalizers, since limits in $\GrpAct$ are computed component-wise and a connected limit of empty sets is empty. Hence, it preserves regular monomorphisms. Here, we use that <a href="/category/Grp">$\Grp$</a> does not have pushout-stable regular monomorphisms.
    references:
      - GrpAct_no_cogenerating_collection

  - property: parametrized natural numbers object
    proof: >-
      Assume that there is a parametrized natural numbers object. Then, by Lemma 4 <a href="/content/natural_numbers_objects">here</a>, for every object $A$ the canonical morphism $\coprod_{n \in \IN} A \to A \times \coprod_{n \in \IN} 1$ is an isomorphism, where $1 = (1,\{\ast\})$ is the terminal object. For $A \coloneqq (\IZ,\varnothing)$, we have $\coprod_{n \in \IN} A = (F,\varnothing)$, where $F$ is the free group on countably many generators, since the functor $L : \Grp \to \GrpAct$, $G \mapsto (G,\varnothing)$ from the proof for cogenerating collections is a left adjoint. Similarly, $\coprod_{n \in \IN} 1 = (1,\IN)$, since the functor $\Set \to \GrpAct$, $Y \mapsto (1,Y)$ is left adjoint to $(G,X) \mapsto X$. Hence, $A \times \coprod_{n \in \IN} 1 = (\IZ,\varnothing) \times (1,\IN) = (\IZ,\varnothing)$. But $F$ is not isomorphic to $\IZ$, since it is not even abelian.
    references:
      - GrpAct_no_cogenerating_collection

special_objects:
  terminal object:
    description: the trivial group acting on a singleton set $(1,\{\ast\})$
  initial object:
    description: the trivial group acting on the empty set $(1,\varnothing)$
  products:
    description: 'the product $(\prod_i G_i, \prod_i X_i)$ with the component-wise action'
  coproducts:
    description: 'For a family $(G_i,X_i)_{i \in I}$, let $G \coloneqq \coprod_{i \in I} G_i$ be the free product. The coproduct is $(G, \coprod_{i \in I} G \times_{G_i} X_i)$, where $G \times_{G_i} X_i$ is the quotient of $G \times X_i$ by the action $h \cdot (g,x) \coloneqq (g h^{-1}, h \cdot x)$ of $G_i$, and $G$ acts by left multiplication on the first component.'

special_morphisms:
  isomorphism:
    description: morphisms $(\varphi,f)$ such that $\varphi$ and $f$ are bijective
    proof: 'This holds in every finitary algebraic category: the inverse of a morphism with bijective components is again a morphism.'
  monomorphism:
    description: morphisms $(\varphi,f)$ such that $\varphi$ and $f$ are injective
    proof: 'This holds in every finitary algebraic category: the forgetful functors to sets, one for each sort, are jointly faithful and hence jointly reflect monomorphisms, and they are representable (by free algebras) and hence preserve monomorphisms.'
  epimorphism:
    description: morphisms $(\varphi,f)$ such that $\varphi$ and $f$ are surjective
    proof: >-
      For the non-trivial direction, let $(\varphi,f) : (G,X) \to (H,Y)$ be an epimorphism. Since $\varphi(g) \cdot f(x) = f(g \cdot x)$, the subset $f(X) \subseteq Y$ is invariant under the subgroup $\varphi(G) \subseteq H$. Hence, $(\varphi,f)$ factors through the inclusion $(\varphi(G),f(X)) \hookrightarrow (H,Y)$, which is therefore an epimorphism. It is also a monomorphism. Since $\GrpAct$ is mono-regular, it is balanced, so the inclusion is an isomorphism. Hence, $\varphi(G) = H$ and $f(X) = Y$.
