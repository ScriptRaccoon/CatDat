id: Set_ff
name: category of sets with finite-to-one maps
notation: $\Set_\ff$
objects: sets
morphisms: 'maps $f : X \to Y$ with the property that for every $y \in Y$ the fiber $f^*(\{y\})$ is a finite set'
description: In this variant of $\Set$ we only consider maps with finite fibers, which are commonly called <i>finite-to-one</i>. Equivalently, every preimage of a finite set is again finite, and this description makes it obvious that composition is well-defined.
nlab_link: null

tags:
  - set theory

related:
  - FinSet
  - Set

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Set_\ff \to \Set$ and $\Set$ is locally small.

  - property: extremal generator
    proof: The singleton set (which is <i>not</i> terminal) is an extremal generator as it represents the forgetful functor $\Set_\ff \to \Set$ which is faithful and conservative.

  - property: semi-strongly connected
    proof: From set theory it is known that for all sets $X,Y$ there is an injective map $X \to Y$ or an injective map $Y \to X$, and injective maps are finite-to-one.

  - property: equalizers
    proof: 'Equalizers can be constructed as in <a href="/category/Set">$\Set$</a> because of the following trivial observation: if $f : X \to Y$ is a finite-to-one map and $E \subseteq Y$ is a subset with $f(X) \subseteq E$, then the induced map $f^E : X \to E$ is also finite-to-one.'

  - property: pullbacks
    proof: 'Pullbacks can be constructed as in <a href="/category/Set">$\Set$</a>. Namely, for two finite-to-one maps $f : X \to S$ and $g : Y \to S$, the projections from $X \times_S Y = \{(x,y) \in X \times Y : f(x)=g(y)\}$ to $X$ resp. $Y$ are finite-to-one since the fiber over $x \in X$ identifies with $g^*(\{f(x)\})$ and the fiber over $y \in Y$ identifies with $f^*(\{g(y)\})$. Moreover, if $h : T \to X \times_S Y$ is a map whose components $h_X : T \to X$ and $h_Y : T \to Y$ are finite-to-one, then $h$ is finite-to-one because of $h^*(\{x\}) = (h_X)^*(\{(x,y)\}) \cap (h_Y)^*(\{y\})$ for $(x,y) \in X \times_S Y$.'
    check_redundancy: false
    label: Set_ff_pullbacks

  - property: locally cartesian closed
    proof: If $X$ is a set, the equivalence $\Set/X \simeq \Set^X$, $f \mapsto (f^*(\{x\}))_{x \in X}$ restricts to an equivalence $\Set_\ff / X \simeq \FinSet^X$. This category is cartesian closed since <a href="/category/FinSet">$\FinSet$</a> is cartesian closed and products of cartesian closed categories are cartesian closed.

  - property: finite coproducts
    proof: 'The disjoint union $X+Y$ of two sets $X,Y$ with the inclusion maps $X \rightarrow X+Y \leftarrow Y$ is a coproduct: The inclusions are injective, hence finite-to-one. If $f : X \to T$, $g : Y \to T$ are finite-to-one maps, the induced map $(f;g) : X + Y \to T$ is finite-to-one since the fiber of $t \in T$ is $f^*(\{t\}) + g^*(\{t\})$, which is finite.'
    check_redundancy: false

  - property: cokernel pairs
    proof: >-
      Let $f : X \to Y$ be a finite-to-one map. Consider the cokernel pair $i_1,i_2 : Y \rightrightarrows Y \sqcup_X Y$ in $\Set$. The maps $i_1,i_2$ are injective, in fact split monomorphisms in $\Set$, and therefore finite-to-one. To show that this cokernel pair is also a cokernel pair in $\Set_\ff$, it suffices to show that a map $h : Y \sqcup_X Y \to T$ is finite-to-one whenever both restrictions $h \circ i_1, h \circ i_2 : Y \rightrightarrows T$ are finite-to-one. Since $i_1,i_2$ are jointly surjective, we have
      $$h^* \{y\} \subseteq (i_1)_* (h \circ i_1)^* \{y\} \cup (i_2)_* (h \circ i_2)^* \{y\},$$
      and the right-hand side is finite.

  - property: extensive
    proof: We have already seen that finite coproducts exist in $\Set_\ff$, and pullbacks exist since the category is locally cartesian closed, although a direct argument is also possible. The forgetful functor $\Set_\ff \to \Set$ preserves finite coproducts and pullbacks, and is clearly faithful and conservative (but not full). Therefore, the claim follows from the extensivity of $\Set$ and Lemma 11 <a href="/content/subcategories">here</a>.

  - property: epi-regular
    proof: 'If $f : X \to Y$ is an epimorphism in $\Set_\ff$, i.e. a surjective finite-to-one map, it is a coequalizer of the two maps $p_1, p_2 : X \times_Y Y \rightrightarrows Y$ in $\Set$. These maps are finite-to-one (see the proof that pullbacks exist), and their coequalizer is also $f$ in $\Set_\ff$: It suffices to observe that if $h : Y \to T$ is a map such that $h \circ f$ is finite-to-one, then $h$ is finite-to-one as well. In fact, surjectivity of $f$ implies $h^*(\{t\}) = f_*((h \circ f)^*(\{t\}))$ for $t \in T$.'
    label: Set_ff_epi_regular
    references:
      - Set_ff_pullbacks

  - property: pullback-stable regular epimorphisms
    proof: We have seen that a morphism is a regular epimorphism if and only if it is surjective and that pullbacks can be constructed just like in $\Set$. Therefore, the claim follows from the corresponding property of <a href="/category/Set">$\Set$</a>.
    references:
      - Set_ff_epi_regular
      - Set_ff_pullbacks

  - property: well-copowered
    proof: This is clear since the epimorphisms are surjective.

  - property: quotients of congruences
    proof: 'A congruence on a set $X$ in $\Set_\ff$ is the same as an equivalence relation $R$ on $X$ whose equivalence classes are finite. In that case, the usual quotient map $p : X \to X/R$ is finite-to-one. Moreover, if $h : X/R \to Y$ is a map such that $h \circ p : X \to Y$ is finite-to-one, then $h$ is finite-to-one as well because $h^*(\{y\}) \subseteq p^*((h \circ p)^*(\{y\}))$ for all $y \in Y$. Therefore, $p$ is also the quotient in $\Set_\ff$.'
    label: set_ff_quotients_congruences

  - property: effective congruences
    proof: 'Let $f, g : E \rightrightarrows X$ be a congruence in $\Set_\ff$. From the proof on quotients of congruences in $\Set_\ff$, we have a quotient map $p : X \to X/E$ in $\Set_\ff$, and $E$ is the kernel pair of $p$ in $\Set$. It remains to see that $E$ is also the kernel pair of $p$ in $\Set_\ff$. Thus, suppose we have $x_1, x_2 : T \rightrightarrows X$ with $p \circ x_1 = p \circ x_2$. Then there is a unique $e : T \to E$ in $\Set$ with $x_1 = f\circ e$ and $x_2 = g\circ e$. Since $f\circ e$ is finite-to-one, we must have $e$ is finite-to-one as well.'
    references:
      - set_ff_quotients_congruences

  - property: effective cocongruences
    proof: 'Suppose we have a cocongruence $f, g : X \rightrightarrows E$ in $\Set_\ff$. Then it is a coreflexive corelation in $\Set$. Since <a href="/category/Set">$\Set$</a> is co-Malcev and has effective cocongruences, that implies $E$ is the cokernel pair of some function $h : Z \to X$ in $\Set$. By the dual of <a href="/content/effective-congruence-quotients">this result</a>, if $\inc_Y : Y \hookrightarrow X$ is the equalizer of $f$ and $g$, then $E$ is also the cokernel pair of $\inc_Y$ in $\Set$. It remains to see that $E$ is the cokernel pair of $\inc_Y$ in $\Set_\ff$ as well. Thus, suppose $a, b : X \rightrightarrows T$ are such that $a |_Y = b |_Y$. Then there is a unique $c : E\to T$ in $\Set$ with $a = c\circ f$ and $b = c\circ g$. Since $(f;g) : X + X \to E$ is surjective and $c \circ (f;g) = (a;b)$ is finite-to-one, we see $c$ is finite-to-one as well.'

  - property: ℵ₁-accessible
    proof: 'We first show that $\aleph_1$-directed colimits exist and are preserved by the forgetful functor to $\Set$. Let $(X_i)_{i \in I}$ be a diagram in $\Set_\ff$ indexed by a $\aleph_1$-directed poset $I$. Let $(u_i : X_i \to X)$ be the colimit in $\Set$. Each map $u_i$ is finite-to-one: Otherwise, some fiber $u_i^*(\{x\}) \subseteq X_i$ contains infinitely many elements $a_1,a_2,\dotsc$. For every $n \geq 1$ we find $i_n \geq i$ such that $a_1,a_n$ have the same image in $X_{i_n}$. Let $i_\infty \in I$ be an upper bound of all $i_n$. Then all $a_n$ have the same image in $X_{i_\infty}$. This is a contradiction since $X_i \to X_{i_\infty}$ is finite-to-one. Now if $f : X \to Y$ is a map such that each $f \circ u_i$ is finite-to-one, then $f$ is finite-to-one as well: If a fiber $f^*(\{y\})$ contains infinitely many distinct elements $x_1,x_2,\dotsc$, there is some index $i$ such that all have a preimage in $X_i$, but then $(f \circ u_i)^*(\{y\})$ would be infinite. This concludes the proof that $\aleph_1$-directed colimits exist. In $\Set$, every set $X$ is the $\aleph_1$-directed colimit of its countable subsets. This remains true in $\Set_\ff$ because a map $X \to Y$ is finite-to-one as long as each restriction to a countable subset of $X$ is finite-to-one. Moreover, every countable set is $\aleph_1$-presentable in $\Set$, but also in $\Set_\ff$.'

  - property: ℵ₁-cofiltered limits
    proof: 'We derive this from the fact that <a href="/category/FinSet">$\FinSet$</a> is closed under $\aleph_1$-cofiltered limits in $\Set$. Let $D : \I \to \Set_\ff$ be an $\aleph_1$-cofiltered diagram. Let $(p_i : L \to D(i))_{i \in \I}$ be the limit cone in $\Set$. Each $p_i$ is finite-to-one, because the fiber over $d \in D(i)$ is the limit of the $\aleph_1$-cofiltered diagram $\tilde{D} : I/i \to \FinSet$ which maps $j \to i$ to $D(j \to i)^*(\{d\})$. To verify the universal property, let $(f_i : T \to D(i))_{i \in \I}$ be a cone in $\Set_\ff$. There is a unique map $f : T \to L$ such that $p_i f = f_i$ for every $i \in \I$, and it remains to prove that $f$ is finite-to-one. Choose any $i \in \I$. Then for every $x \in L$ we have $f^*(\{x\}) \subseteq f_i^*(\{p_i(x)\})$, and the latter set is finite.'
    references:
      - finset_aleph1-cofiltered-limits

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: locally finite
    proof: If $X$ is an infinite set, there are infinitely many maps $1 \to X$. They are injective and hence finite-to-one.

  - property: strongly connected
    proof: Already $\Set$ is not strongly connected.

  - property: binary powers
    proof: 'More generally, if $X,Y$ are two non-empty sets such that $X \times Y$ exists in $\Set_\ff$, then both $X$ and $Y$ must be finite. In fact, the forgetful functor to $\Set$ is representable, so it must preserve products. This means we can assume $X \times Y$ is the usual cartesian product with the usual projections. Since $p_1 : X \times Y \to X$ is finite-to-one and $X$ is non-empty, $Y$ is finite. By symmetry, also $X$ is finite. (Conversely, if $X$ and $Y$ are finite, or one of them is empty, then indeed $X \times Y$ exists.)'

  - property: countable copowers
    proof: 'Assume that the copower $X \coloneqq \IN \otimes 1$ exists, where $1$ is the singleton set. This is a set with a map $i : \IN \to X$ (not necessarily finite-to-one) such that for every other such map $j : \IN \to Y$ there is a unique finite-to-one map $f : X \to Y$ with $f \circ i = j$. Applying this to $j : \IN \to 1$, we see that $X$ is finite. Applying the universal property to maps $j : \IN \to \{0,1\}$, we see that for every subset $E \subseteq \IN$ there is a unique finite subset $F \subseteq X$ with $i^*(F) = E$. But finiteness of $F$ is automatic, so $i^* : P(X) \to P(\IN)$ is bijective. But then $P(\IN)$ is finite, which is absurd.'

  - property: filtered
    proof: 'Consider the maps $f,g : \IN \rightrightarrows \IN$ defined by $f(x)=x$ and $g(x)=2x$. They are injective, hence finite-to-one. If a map $h : \IN \to X$ coequalizes them, we have $h(x)=h(2x)$, in particular $h(1)=h(2^n)$ for all $n \in \IN$. Thus, $h$ is not finite-to-one.'

  - property: sequential limits
    proof: Consider the set $[n] \coloneqq \{0,\dotsc,n\}$ for $n \in \IN$. The forgetful functor to $\Set$ is representable (by the singleton set), hence preserves all limits. Thus, if the diagram of truncation maps $\cdots \twoheadrightarrow [2] \twoheadrightarrow [1] \twoheadrightarrow [0]$ has a limit in $\Set_\ff$, its underlying set is isomorphic to the limit taken in $\Set$, which is $\IN \cup \{\infty\}$. But there is no finite-to-one map $\IN \cup \{\infty\} \to [0]$.

  - property: cogenerating set
    proof: 'Suppose that $S$ is a set of objects of $\Set_\ff$, and let $\kappa$ be an uncountable cardinal greater than $\card(Q)$ for each $Q \in S$. Then for each $Q \in S$, $\Hom(\kappa, Q) = \varnothing$ (or else we would have $\kappa = \card(\kappa) \le \aleph_0 \cdot \card(Q) = \max(\aleph_0, \card(Q)) < \kappa$ giving a contradiction). This makes it impossible for any morphisms from $\kappa$ to an object of $S$ to distinguish the two morphisms $0, 1 : 1 \rightrightarrows \kappa$.'

special_objects:
  initial object:
    description: empty set
  coproducts:
    description: '[finite case] disjoint union'

special_morphisms:
  isomorphisms:
    description: bijective maps
    proof: This is easy.
  monomorphisms:
    description: injective maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the singleton), hence preserves monomorphisms.
  epimorphisms:
    description: surjective maps with finite fibers
    proof: 'For the non-trivial direction, if $f : X \to Y$ is an epimorphism in this category, then in particular $f^* : \Hom(Y,2) \to \Hom(X,2)$ is injective, which identifies with $f^* : E(Y) \to E(X)$, where $E(-)$ denotes the set of finite subsets. Then for all $y \in Y$ we have $f^*(\{y\}) \neq f^*(\varnothing) = \varnothing$, so that $y$ has a preimage.'
