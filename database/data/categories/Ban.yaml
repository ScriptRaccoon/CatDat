id: Ban
name: category of Banach spaces with linear contractions
notation: $\Ban$
objects: Banach spaces over $\IC$
morphisms: linear contractions, i.e. linear maps of norm $\leq 1$
description: The choice of morphisms is similar to that of $\Met$, which yields better categorical properties.
nlab_link: https://ncatlab.org/nlab/show/Banach+space
keywords:
  - complete normed spaces

tags:
  - analysis

related:
  - Met
  - Vect
  - SemiNormVect

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Ban \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: pointed
    proof: The trivial Banach space $\{0\}$ is a zero object.
    check_redundancy: false

  - property: CIP
    proof: This is immediate from the concrete description of coproducts and products.

  - property: binary CSP
    proof: >-
      By the constructions of coproducts and products, the canonical morphism $X \sqcup Y \to X \times Y$ is the identity map of the underlying vector space $X \oplus Y$. Hence, it is surjective and therefore an epimorphism. This is the same argument as for $\SemiNormVect$ (<a href="/category/SemiNormVect?proof=binary_CSP">proof</a>).

  - property: locally ℵ₁-presentable
    proof: See <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Example 1.48.

  - property: cartesian filtered colimits
    proof: If $X$ is a Banach space and $(Y_i)$ is a filtered diagram of Banach spaces, the canonical map $\colim_i (X \times Y_i) \to X \times \colim_i Y_i$ is the completion of the canonical map in the category of normed vector spaces with non-expansive linear maps. Now the claim follows directly from the fact that $\Met$ has cartesian filtered colimits (<a href="/category/Met?proof=cartesian_filtered_colimits" data-allow-deduced>proof</a>).

  - property: cocartesian cofiltered limits
    proof: >-
      Limits and binary coproducts of Banach spaces are constructed as in $\SemiNormVect$: the limit of a small diagram $(Y_i)$ is the space of compatible families $(y_i) \in \prod_i Y_i$ with $\sup_i |y_i| < \infty$, endowed with the norm $|(y_i)| \coloneqq \sup_i |y_i|$, which is complete, and the coproduct $X \oplus Y$ of two Banach spaces is their direct sum with the norm $|(x,y)| \coloneqq |x| + |y|$, which is complete as well. Hence, the <a href="/category/SemiNormVect?proof=cocartesian_cofiltered_limits">proof</a> for $\SemiNormVect$ works verbatim. In particular, $X \oplus -$ even preserves all connected limits.

  - property: extremal cogenerator
    proof: >-
      The Hahn-Banach theorem implies that $\IC$ is a cogenerator. We claim that it is in fact an extremal cogenerator. Thus, suppose $f : X \to Y$ is a morphism such that ${-} \circ f : \Hom(Y, \IC) \to \Hom(X, \IC)$ is bijective on the underlying sets. Then for any non-zero $x \in X$, by the Hahn-Banach theorem, there exists $\varphi \in X^*$ such that $|\varphi| = 1$ and $\varphi(x) = |x|$. Since $|\varphi| = 1$, we see that $\varphi$ is a morphism $X \to \IC$ in $\Ban$; so by the assumption, there exists a morphism $\psi : Y \to \IC$ such that $\varphi = \psi \circ f$. Therefore, $|x| = |\psi(f(x))| \le |f(x)|$; and conversely, since $f$ is a morphism, $|f(x)| \le |x|$. On the other hand, if $x = 0$, then certainly $|f(x)| = |x| = 0$. This shows that $f$ is isometric and therefore a regular monomorphism (<a href="/category/Ban?proof=regular_monomorphism">proof</a>). On the other hand, since $\IC$ is a cogenerator and ${-} \circ f$ is injective, we see that $f$ is also an epimorphism. Hence, $f$ is an isomorphism.

  - property: pullback-stable regular epimorphisms
    proof: >-
      Pullbacks of Banach spaces are constructed as in $\SemiNormVect$, namely as closed subspaces of the direct sum with the $\max$-norm. A linear contraction is a regular epimorphism if and only if it maps the open unit ball onto the open unit ball, both in $\Ban$ (<a href="/category/Ban?proof=regular_epimorphism">proof</a>) and in $\SemiNormVect$ (<a href="/category/SemiNormVect?proof=regular_epimorphism">proof</a>). Hence, the <a href="/category/SemiNormVect?proof=pullback-stable_regular_epimorphisms">proof</a> for $\SemiNormVect$ works verbatim.

  - property: pushout-stable regular monomorphisms
    proof: >-
      We will use that the regular monomorphisms are the isometric linear maps (<a href="/category/Ban?proof=regular_monomorphism">proof</a>).
      So let $i : X \to Y$ be an isometric linear map and let $f : X \to T$ be any morphism. The pushout $T \sqcup_X Y$ can be constructed as the quotient of the direct sum $T \oplus Y$, equipped with the $1$-norm, modulo the closure of the subspace $S \coloneqq \{(-f(x),i(x)) : x \in X\}$.

      We claim that $S$ is already closed. Let $(x_n)$ be a sequence in $X$ such that $(-f(x_n),i(x_n))$ converges to some $(t,y) \in T \oplus Y$. Since $i$ is isometric, we have $|x_n - x_m| = |i(x_n) - i(x_m)|$, so $(x_n)$ is a Cauchy sequence. Since $X$ is complete, it converges to some $x \in X$. Since $f$ and $i$ are continuous, we get $(t,y) = (-f(x),i(x)) \in S$.

      Hence, the pushout in $\Ban$ is constructed as in $\SemiNormVect$, and the <a href="/category/SemiNormVect?proof=pushout-stable_regular_monomorphisms">proof</a> for $\SemiNormVect$ shows that $\iota : T \to T \sqcup_X Y$ is isometric.

  - property: effective congruences
    proof: >-
      Let $q_1,q_2 : R \rightrightarrows X$ be a congruence in $\Ban$. We may assume that the induced map $R \hookrightarrow X \times X$ is an inclusion of vector spaces. Since finite limits of Banach spaces are constructed as in $\SemiNormVect$ and the inclusion $\Ban \hookrightarrow \SemiNormVect$ is fully faithful, $q_1,q_2$ is also a congruence in $\SemiNormVect$. Let $U \coloneqq \{x \in X : (x,0) \in R\}$. The <a href="/category/SemiNormVect?proof=effective_congruences">proof</a> for $\SemiNormVect$ shows that $R \hookrightarrow X \times X$ is isometric and that $R$ is the kernel pair of the projection $X \to X/U$ in $\SemiNormVect$.

      Since $R$ is complete and $R \hookrightarrow X \times X$ is isometric, $R$ is a closed subspace of $X \times X$. It follows that $U$, the preimage of $R$ under $X \to X \times X$, $x \mapsto (x,0)$, is a closed subspace of $X$, so that $X/U$ is a Banach space. Since the inclusion $\Ban \hookrightarrow \SemiNormVect$ is fully faithful, it reflects limits, so $R$ is the kernel pair of $X \to X/U$ in $\Ban$ as well.

  - property: effective cocongruences
    proof: >-
      <strong>Idea.</strong> For congruences, we could reduce to vector spaces, where a congruence is just the relation "the difference lies in a subspace". Cocongruences are much harder to grasp directly, but they turn into congruences after dualizing: applying $\Hom(-,\IC)$ to a cocongruence on $X$ yields an equivalence relation on the unit ball of $X^*$, and by the Hahn-Banach theorem a Banach space and its norm are determined by its functionals. So we try to mimic the argument for congruences on the dual side. The equivalence relation is convex, which suggests that it is again given by a subspace of $X^*$, and this subspace should be the annihilator of the equalizer of the cocongruence. Two obstacles have to be overcome: the relation only lives on the unit ball, not on a vector space, so we can only move in small steps; and in order to get back from $X^*$ to $X$, the subspace has to be weak-$*$ closed. This is where the compactness of the unit ball and the Krein–Šmulian theorem enter.

      Let $j_1,j_2 : X \rightrightarrows C$ be a cocongruence in $\Ban$. Let $U \coloneqq \{x \in X : j_1(x) = j_2(x)\}$ be their equalizer, and let $\iota_1,\iota_2 : X \rightrightarrows Z$ be the cokernel pair of the inclusion $U \hookrightarrow X$. Since $j_1,j_2$ agree on $U$, there is a unique morphism $h : Z \to C$ with $h \circ \iota_1 = j_1$ and $h \circ \iota_2 = j_2$. We show that $h$ is an isomorphism, which proves that $j_1,j_2$ is effective.

      Since $j_1,j_2$ are jointly epimorphic and factor through $h$, the morphism $h$ is an epimorphism, i.e. it has dense image (<a href="/category/Ban?proof=epimorphism">proof</a>). Since an isometric linear map between Banach spaces has closed image, it suffices to prove that $h$ is isometric. For this, it suffices to show that every morphism $\psi : Z \to \IC$ factors as $\psi = \varphi \circ h$ for some morphism $\varphi : C \to \IC$. Indeed, then $|\psi(z)| = |\varphi(h(z))| \leq |h(z)|$ for all $z \in Z$, and since by the Hahn-Banach theorem $|z|$ is the supremum of all $|\psi(z)|$, we get $|z| \leq |h(z)|$. The reverse inequality holds since $h$ is a contraction.

      By the universal property of $Z$, morphisms $Z \to \IC$ correspond to pairs of morphisms $a,b : X \rightrightarrows \IC$ with $a|_U = b|_U$, and $\varphi \circ h$ corresponds to the pair $(\varphi \circ j_1, \varphi \circ j_2)$. Let $B \coloneqq \Hom(X,\IC)$, which is the closed unit ball of the dual space $X^*$, and let
      $$E \coloneqq \{(\varphi \circ j_1, \varphi \circ j_2) : \varphi \in \Hom(C,\IC)\} \subseteq B \times B.$$
      We need to show that $(a,b) \in E$ for all $a,b \in B$ with $a|_U = b|_U$.

      By the definition of a cocongruence, $E$ is an equivalence relation on $B$. Since $E$ is the image of the closed unit ball of $C^*$ under the linear map $C^* \to X^* \times X^*$, $\varphi \mapsto (\varphi \circ j_1, \varphi \circ j_2)$, it is convex and satisfies $\lambda E \subseteq E$ for all $\lambda \in \IC$ with $|\lambda| \leq 1$. Since this map is continuous with respect to the weak-$*$ topologies and the closed unit ball of $C^*$ is weak-$*$ compact by the <a href="https://en.wikipedia.org/wiki/Banach%E2%80%93Alaoglu_theorem">Banach–Alaoglu theorem</a>, $E$ is weak-$*$ compact. In particular, $E$ is weak-$*$ closed and norm closed. Now consider
      $$\begin{align*}
      D & \coloneqq \{d \in X^* : (d,0) \in E\} \subseteq B, \\
      N & \coloneqq \textstyle \bigcup_{t > 0} t D \subseteq X^*.
      \end{align*}$$
      Then $D$ is convex, weak-$*$ closed, and satisfies $\lambda D \subseteq D$ for $|\lambda| \leq 1$.

      <strong>Claim 1.</strong> $N$ is a linear subspace of $X^*$.

      It contains $0 \in D$. If $f = t d$ with $t > 0$ and $d \in D$, and $\lambda \in \IC$ is non-zero, then $\lambda f = (|\lambda| t) \cdot (\lambda/|\lambda|) d \in N$ since $(\lambda/|\lambda|) d \in D$. If $f = s d$ and $g = t e$ with $s,t > 0$ and $d,e \in D$, then
      $$f + g = (s + t) \cdot \bigl(\tfrac{s}{s+t} d + \tfrac{t}{s+t} e\bigr) \in N$$
      since $\tfrac{s}{s+t} d + \tfrac{t}{s+t} e \in D$ by convexity.

      <strong>Claim 2.</strong> For $a,b \in B$ we have $(a,b) \in E$ if and only if $a - b \in N$.

      If $(a,b) \in E$, then also $(-b,-b) \in E$ by reflexivity, and convexity yields
      $$\bigl(\tfrac{1}{2}(a-b), 0\bigr) = \tfrac{1}{2} (a,b) + \tfrac{1}{2} (-b,-b) \in E.$$
      Hence $\tfrac{1}{2}(a-b) \in D$ and $a - b \in N$. Conversely, assume $a - b = t d$ with $t > 0$ and $d \in D$. Let $0 < r < 1$. Choose an integer $n \geq 1$ with $\delta \coloneqq rt/n \leq 1 - r$, and define
      $$z_k \coloneqq r b + k \delta d \in X^*$$
      for $0 \leq k \leq n$. Then $z_0 = rb$ and $z_n = rb + rtd = ra$. Since
      $$z_k = rb + \tfrac{k}{n} (ra - rb) = (1 - \tfrac{k}{n}) rb + \tfrac{k}{n} ra,$$
      we have $|z_k| \leq r \leq 1 - \delta$. Hence $z_k/(1-\delta) \in B$, so that $(z_k/(1-\delta), z_k/(1-\delta)) \in E$ by reflexivity. For $0 \leq k < n$, convexity yields
      $$(z_{k+1}, z_k) = \delta (d,0) + (1-\delta) \bigl(\tfrac{z_k}{1-\delta}, \tfrac{z_k}{1-\delta}\bigr) \in E.$$
      By transitivity, $(ra, rb) = (z_n, z_0) \in E$. Since $E$ is norm closed, letting $r \to 1$ gives $(a,b) \in E$.

      <strong>Claim 3.</strong> $N$ is weak-$*$ closed.

      For $b = 0$, Claim 2 says that $N \cap B = D$. Since $N$ is a linear subspace (Claim 1), we get $N \cap tB = t(N \cap B) = tD$ for all $t > 0$, which is weak-$*$ closed. By the <a href="https://en.wikipedia.org/wiki/Krein%E2%80%93Smulian_theorem">Krein–Šmulian theorem</a>, a convex subset of $X^*$ is weak-$*$ closed if its intersections with all closed balls $tB$ are weak-$*$ closed. Hence, $N$ is weak-$*$ closed.

      <strong>Claim 4.</strong> $U = \{x \in X : f(x) = 0 \text{ for all } f \in N\}$.

      Let $x \in U$ and $f \in N$, say $f = t d$ with $t > 0$ and $d \in D$. Since $(d,0) \in E$, there is a morphism $\varphi : C \to \IC$ with $d = \varphi \circ j_1$ and $0 = \varphi \circ j_2$. Hence
      $$d(x) = \varphi(j_1(x)) = \varphi(j_2(x)) = 0,$$
      and therefore $f(x) = t d(x) = 0$.

      Conversely, let $x \in X$ with $f(x) = 0$ for all $f \in N$, and let $\varphi : C \to \IC$ be a morphism. Since $(\varphi \circ j_1, \varphi \circ j_2) \in E$, Claim 2 shows that $\varphi \circ j_1 - \varphi \circ j_2 \in N$. Hence $\varphi(j_1(x)) - \varphi(j_2(x)) = 0$. Since this holds for every $\varphi \in \Hom(C,\IC)$, the Hahn-Banach theorem gives $j_1(x) = j_2(x)$, i.e. $x \in U$.

      Now we can finish the proof. Recall that for every linear subspace $M \subseteq X^*$, the functionals on $X$ vanishing on $\{x \in X : f(x) = 0 \text{ for all } f \in M\}$ form the weak-$*$ closure of $M$ (see <a href="https://arxiv.org/abs/2112.11166v8">van Neerven</a>, Prop. 4.49). Since $N$ is weak-$*$ closed (Claim 3), it consists of all functionals on $X$ vanishing on $U$ by Claim 4. Now let $a,b \in B$ with $a|_U = b|_U$. Then $a - b$ vanishes on $U$, so $a - b \in N$, and Claim 2 gives $(a,b) \in E$.

unsatisfied_properties:
  - property: skeletal
    proof: The zero Banach spaces with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: biproducts
    proof: >-
      By the constructions of coproducts and products, for $X = Y = \IC$ the canonical morphism $X \sqcup Y \to X \times Y$ is the identity map of $\IC^2$, where the element $(1,1)$ has norm $2$ in $X \sqcup Y$, but norm $1$ in $X \times Y$. So the canonical morphism is not isometric, hence not an isomorphism (<a href="/category/Ban?proof=isomorphism">proof</a>). This is the same argument as for $\SemiNormVect$ (<a href="/category/SemiNormVect?proof=biproducts">proof</a>).

  - property: product-stable epimorphisms
    proof: >-
      We adapt the <a href="/category/SemiNormVect?proof=product-stable_epimorphisms">counterexample</a> for $\SemiNormVect$. By the description of products, the product of the epimorphisms $f_n : \IC \to \IC$, $z \mapsto z/n$, for $n \geq 1$, is the map $f : \ell^\infty \to \ell^\infty$, $x \mapsto (x_n/n)_{n \geq 1}$, where $\ell^\infty$ is the space of bounded sequences $(x_n)_{n \geq 1}$ in $\IC$ with the norm $|x|_\infty = \sup_{n \geq 1} |x_n|$, and every element $y$ of its image satisfies $\lim_{n \to \infty} y_n = 0$. Let $e \coloneqq (1,1,\dotsc)$. For every $n \geq 1$ we have $|y - e|_\infty \geq |y_n - 1| \geq 1 - |y_n|$, and the right-hand side tends to $1$ for $n \to \infty$. Hence, $|y - e|_\infty \geq 1$. Hence, $f$ does not have dense image and is not an epimorphism (<a href="/category/Ban?proof=epimorphism">proof</a>).

  - property: regular subobject classifier
    proof: >-
      The <a href="/category/SemiNormVect?proof=regular_subobject_classifier">proof</a> for $\SemiNormVect$ works verbatim, using that the regular monomorphisms are, up to isomorphism, the inclusions of closed subspaces (<a href="/category/Ban?proof=regular_monomorphism">proof</a>), and that $\{0\}$ and $\IC$ are the only closed subspaces of $\IC$.

  - property: regular quotient object classifier
    proof: >-
      The <a href="/category/SemiNormVect?proof=regular_quotient_object_classifier">proof</a> for $\SemiNormVect$ works verbatim, using that a regular epimorphism carries the quotient norm (<a href="/category/Ban?proof=regular_epimorphism">proof</a>).

  - property: filtered-colimit-stable monomorphisms
    proof: 'The argument is similar to the <a href="/category/Met?proof=filtered-colimit-stable_monomorphisms">proof</a> for $\Met$. For $n \geq 1$ let $X_n$ be the Banach space with underlying vector space $\IC$ and the norm $|x|_n \coloneqq \frac{1}{n} |x|$. For $n \leq m$ the identity map provides a morphism $X_n \to X_m$, which is clearly a monomorphism (also an epimorphism by the way, but an isomorphism iff $n=m$). Let $X$ be the colimit of all $X_n$ in the category of semi-normed vector spaces. It is constructed as the colimit in the category of vector spaces with the semi-norm $|x| \coloneqq \inf \{|x|_m : n \leq m \}$ for $x \in X_n$. So clearly, the semi-norm is zero. Hence, the colimit in the category of normed vector spaces is $0$. The colimit in the category of Banach spaces is its completion, which is also $0$. Thus, the monomorphisms $X_1 \hookrightarrow X_n$ become the zero map $X_1 \to 0$ in the colimit, which is not a monomorphism.'

special_objects:
  initial object:
    description: trivial Banach space
  terminal object:
    description: trivial Banach space
  coproducts:
    description: 'The coproduct of a family of Banach spaces $(X_i,|{-}|)_{i \in I}$ is the subspace $\bigl\{x \in \prod_{i \in I} X_i : \sum_{i \in I} |x_i| < \infty\bigr\}$ of their vector space product equipped with the $1$-norm $|x|_1 \coloneqq \sum_{i \in I} |x_i|$.'
  products:
    description: 'The product of a family of Banach spaces $(X_i,|{-}|)_{i \in I}$ is the subspace $\bigl\{x \in \prod_{i \in I} X_i : \sup_{i \in I} |x_i| < \infty\bigr\}$ of their vector space product equipped with the $\sup$-norm $|x|_\infty \coloneqq \sup_{i \in I} |x_i|$.'

special_morphisms:
  isomorphism:
    description: bijective linear isometries
    proof: >-
      Since $\Ban$ is a full subcategory of $\SemiNormVect$, its isomorphisms are the isomorphisms of $\SemiNormVect$ between Banach spaces, which are the bijective linear isometries (<a href="/category/SemiNormVect?proof=isomorphism" data-allow-deduced>proof</a>).
  monomorphism:
    description: injective linear contractions
    proof: >-
      The <a href="/category/SemiNormVect?proof=monomorphism">proof</a> for $\SemiNormVect$ works verbatim, since it only uses the representable functor $\Hom(\IC,-)$, and $\IC$ is a Banach space.
  epimorphism:
    description: linear contractions with dense image
    proof: >-
      If $f : X \to Y$ has dense image, then it is an epimorphism, since two continuous maps $Y \to T$ that agree on a dense subset are equal.

      Conversely, let $f : X \to Y$ be an epimorphism. The subspace $U \coloneqq \overline{f(X)} \subseteq Y$ is closed. It is well-known that the quotient $Y/U$ is also a Banach space with a projection $p : Y \to Y/U$. Since $p \circ f = 0 = 0 \circ f$, we infer $p = 0$, so that $U = Y$.
  regular monomorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular monomorphism. (2) $f$ is isometric. (3) $f$ is isomorphic to the inclusion of a closed subspace of $Y$.
    proof: >-
      (1) implies (2): This follows immediately from the concrete construction of equalizers.

      (2) implies (3): The image of $f$ is complete, hence closed. The rest is clear.

      (3) implies (1): If $U \subseteq Y$ is a closed subspace, then the inclusion is the kernel of the projection $Y \to Y/U$, where $Y/U$ is the well-known quotient Banach space.
  regular epimorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular epimorphism. (2) $f$ is surjective, and the norm on $Y$ is given by $|y| = \inf \{|x| : f(x) = y\}$. (3) $f$ maps the open unit ball of $X$ onto the open unit ball of $Y$.
    proof: >-
      (1) implies (2): This follows immediately from the concrete construction of coequalizers, and the quotient Banach space in particular.

      (2) implies (1): Let $U \coloneqq \ker(f)$. Then $U$ is a closed subspace of $X$, and $f$ induces a bijective linear contraction $\tilde{f} : X/U \to Y$. It is isometric by assumption on $f$ and the definition of the norm on $X/U$. Thus, $\tilde{f}$ is an isomorphism. Since $X/U$ is the cokernel of $U \hookrightarrow X$, it follows that $f$ is a regular epimorphism.

      (2) is equivalent to (3): This only concerns the norms, so the <a href="/category/SemiNormVect?proof=regular_epimorphism">proof</a> for $\SemiNormVect$ works verbatim.
