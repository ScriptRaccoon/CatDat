id: Ban
name: category of Banach spaces with linear contractions
notation: $\Ban$
objects: Banach spaces over $\IC$
morphisms: linear contractions, i.e. linear maps of norm $\leq 1$
description: The choice of morphisms is similar to that of $\Met$, which yields better categorical properties.
nlab_link: https://ncatlab.org/nlab/show/Banach+space
keywords:
  - complete normed spaces

tags:
  - analysis

related:
  - Met
  - Vect

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Ban \to \Set$ and $\Set$ is locally small.

  - property: pointed
    proof: The trivial Banach space $\{0\}$ is a zero object.
    check_redundancy: false

  - property: CIP
    proof: This is immediate from the concrete description of coproducts and products.

  - property: locally ℵ₁-presentable
    proof: See <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Example 1.48.

  - property: cartesian filtered colimits
    proof: If $X$ is a Banach space and $(Y_i)$ is a filtered diagram of Banach spaces, the canonical map $\colim_i (X \times Y_i) \to X \times \colim_i Y_i$ is the completion of the canonical map in the category of normed vector spaces with non-expansive linear maps. Now the claim follows directly from <a href="/category/Met">$\Met$</a>.

  - property: cocartesian cofiltered limits
    proof: >-
      Recall that the limit of a small diagram $(Y_i)$ in $\Ban$ is the space of compatible families $(y_i) \in \prod_i Y_i$ with $\sup_i |y_i| < \infty$, endowed with the norm $|(y_i)| \coloneqq \sup_i |y_i|$, and that the coproduct $X \oplus Y$ of two Banach spaces is their direct sum with the norm $|(x,y)| \coloneqq |x| + |y|$.

      Now let $X$ be a Banach space and $(Y_i)$ be a cofiltered diagram of Banach spaces. We claim that the canonical map
      $$\textstyle X \oplus \lim_i Y_i \to \lim_i (X \oplus Y_i), \quad (x,(y_i)) \mapsto ((x,y_i))_i,$$
      is an isometric isomorphism. An element of the codomain is a compatible family $((x_i,y_i))_i$ with bounded norms. Since the transition maps are of the form $\id_X \oplus f$, we have $x_i = x_j$ whenever there is a morphism $i \to j$ in the index category. Since the index category is connected, there is some $x \in X$ with $x_i = x$ for all $i$. Moreover, $(y_i)$ is a compatible family, and $\sup_i (|x| + |y_i|) < \infty$ holds if and only if $\sup_i |y_i| < \infty$. This shows that the canonical map is bijective. It is isometric since
      $$\textstyle \sup_i (|x| + |y_i|) = |x| + \sup_i |y_i|.$$
      Notice that this argument only uses that the index category is connected. Hence, $X \oplus -$ even preserves all connected limits.

  - property: extremal cogenerator
    proof: >-
      The Hahn-Banach theorem implies that $\IC$ is a cogenerator. We claim that it is in fact an extremal cogenerator. Thus, suppose $f : X \to Y$ is a morphism such that ${-} \circ f : \Hom(Y, \IC) \to \Hom(X, \IC)$ is bijective on the underlying sets. Then for any non-zero $x \in X$, by the Hahn-Banach theorem, there exists $\varphi \in X^*$ such that $|\varphi| = 1$ and $\varphi(x) = |x|$. Since $|\varphi| = 1$, we see that $\varphi$ is a morphism $X \to \IC$ in $\Ban$; so by the assumption, there exists a morphism $\psi : Y \to \IC$ such that $\varphi = \psi \circ f$. Therefore, $|x| = |\psi(f(x))| \le |f(x)|$; and conversely, since $f$ is a morphism, $|f(x)| \le |x|$. On the other hand, if $x = 0$, then certainly $|f(x)| = |x| = 0$. This shows that $f$ is isometric and therefore a regular monomorphism (see below). On the other hand, since $\IC$ is a cogenerator and ${-} \circ f$ is injective, we see that $f$ is also an epimorphism. Hence, $f$ is an isomorphism.

  - property: pullback-stable regular epimorphisms
    proof: >-
      We will use the classification of regular epimorphisms via open unit balls below.
      So let $f : X \to Y$ be a regular epimorphism and let $g : T \to Y$ be any morphism. We need to show that the projection $X \times_Y T \to T$ is a regular epimorphism.
      Let $t \in T$ be an element of norm $<1$. Since $g$ is a linear contraction, $g(t)$ has norm $<1$. Since $f$ is a regular epimorphism, there is some $x \in X$ with norm $<1$ and $f(x) = g(t)$.
      Then $(x,t) \in X \times_Y T$ is a preimage of $t$ with norm $\max(|x|,|t|) < 1$.

  - property: pushout-stable regular monomorphisms
    proof: >-
      We will use the classification of regular monomorphisms as isometric linear maps below.
      So let $i : X \to Y$ be an isometric linear map and let $f : X \to T$ be any morphism. We need to show that the linear contraction $\iota : T \to T \sqcup_X Y$ is isometric as well. The pushout can be constructed as the quotient of the direct sum $T \oplus Y$, equipped with the $1$-norm, modulo the closure of the subspace containing all $(-f(x),i(x))$ for $x \in X$. Using that $i$ is an isometry, it is easily checked that this subspace is already closed.
      For $t \in T$ the norm of $\iota(t) = [(t,0)]$ is the infimum of the norms of $(t,0) + (-f(x),i(x)) = (t - f(x), i(x))$ for $x \in X$.
      By taking $x=0$ we see that the infimum is $\leq |t|$.
      On the other hand, for any $x \in X$ we compute
      $$\begin{align*}
      |(t - f(x), i(x))| & = |t - f(x)| + |i(x)| \\
      & = |t - f(x)| + |x| \\
      & \geq |t - f(x)| + |f(x)| \geq |t|.
      \end{align*}$$
      This shows that the infimum is precisely $|t|$.

  - property: effective congruences
    proof: >-
      Let $q_1,q_2 : R \rightrightarrows X$ be a congruence in $\Ban$. We may assume that the induced map $R \hookrightarrow X \times X$ is an inclusion of vector spaces. Since the forgetful functor $\Ban \to \Vect$ preserves finite limits, the congruence yields a congruence in $\Vect$, which we understand well:
      It is fully classified by the subspace $U \coloneqq \{x \in X : (x,0) \in R\}$ via $R = \{(x,y) \in X \times X : x-y \in U\}$.

      Since $R \hookrightarrow X \times X$ is a linear contraction, the norm $|{-}|_R$ on $R$ satisfies
      $$\max(|x|,|y|) \leq |(x,y)|_R.$$
      We claim that this is an equality, i.e. that $R \hookrightarrow X \times X$ is an isometry.

      Since the reflexivity morphism $X \to R$, $x \mapsto (x,x)$ is a split monomorphism, it is isometric, i.e.
      $$|(x,x)|_R = |x|.$$
      Since the transitivity morphism $R \times_X R \to R$ is a linear contraction and the fiber product carries the $\max$-norm, we have
      $$|(x,z)|_R \leq \max(|(x,y)|_R, |(y,z)|_R)$$
      whenever $(x,y) \in R$ and $(y,z) \in R$.

      Now let $(x,z) \in R$ and define $y \coloneqq \frac{1}{2} (x + z)$. Then
      $$(x,y) = \tfrac{1}{2} (x,x) + \tfrac{1}{2} (x,z)$$
      and likewise
      $$(y,z) = \tfrac{1}{2} (z,z) + \tfrac{1}{2} (x,z)$$
      are contained in $R$. We have
      $$|(x,y)|_R \leq \tfrac{1}{2} |x| + \tfrac{1}{2} |(x,z)|_R$$
      and likewise
      $$|(y,z)|_R \leq \tfrac{1}{2} |z| + \tfrac{1}{2} |(x,z)|_R$$
      Together with the transitivity bound we obtain
      $$\begin{align*}
      |(x,z)|_R & \leq \max(|(x,y)|_R, |(y,z)|_R) \\
      & \leq \tfrac{1}{2} \max(|x|,|z|) + \tfrac{1}{2} |(x,z)|_R,
      \end{align*}$$
      which proves the claim $|(x,z)|_R \leq \max(|x|,|z|)$.

      Since $R \hookrightarrow X \times X$ is an isometry, $R$ is a closed subspace of $X \times X$. It follows that also $U$ is a closed subspace of $X$. Finally, $R$ is the kernel pair of the projection $X \to X/U$ since this is true by construction on the level of vector spaces and the kernel pair carries the $\max$-norm, just like $R$.

  - property: effective cocongruences
    proof: >-
      <strong>Idea.</strong> For congruences, we could reduce to vector spaces, where a congruence is just the relation "the difference lies in a subspace". Cocongruences are much harder to grasp directly, but they turn into congruences after dualizing: applying $\Hom(-,\IC)$ to a cocongruence on $X$ yields an equivalence relation on the unit ball of $X^*$, and by the Hahn-Banach theorem a Banach space and its norm are determined by its functionals. So we try to mimic the argument for congruences on the dual side. The equivalence relation is convex, which suggests that it is again given by a subspace of $X^*$, and this subspace should be the annihilator of the equalizer of the cocongruence. Two obstacles have to be overcome: the relation only lives on the unit ball, not on a vector space, so we can only move in small steps; and in order to get back from $X^*$ to $X$, the subspace has to be weak-$*$ closed. This is where the compactness of the unit ball and the Krein–Šmulian theorem enter.

      Let $j_1,j_2 : X \rightrightarrows C$ be a cocongruence in $\Ban$. Let $U \coloneqq \{x \in X : j_1(x) = j_2(x)\}$ be their equalizer, and let $\iota_1,\iota_2 : X \rightrightarrows Z$ be the cokernel pair of the inclusion $U \hookrightarrow X$. Since $j_1,j_2$ agree on $U$, there is a unique morphism $h : Z \to C$ with $h \circ \iota_1 = j_1$ and $h \circ \iota_2 = j_2$. We show that $h$ is an isomorphism, which proves that $j_1,j_2$ is effective.

      Since $j_1,j_2$ are jointly epimorphic and factor through $h$, the morphism $h$ is an epimorphism, i.e. it has dense image (see below). Since an isometric linear map between Banach spaces has closed image, it suffices to prove that $h$ is isometric. For this, it suffices to show that every morphism $\psi : Z \to \IC$ factors as $\psi = \varphi \circ h$ for some morphism $\varphi : C \to \IC$. Indeed, then $|\psi(z)| = |\varphi(h(z))| \leq |h(z)|$ for all $z \in Z$, and since by the Hahn-Banach theorem $|z|$ is the supremum of all $|\psi(z)|$, we get $|z| \leq |h(z)|$. The reverse inequality holds since $h$ is a contraction.

      By the universal property of $Z$, morphisms $Z \to \IC$ correspond to pairs of morphisms $a,b : X \rightrightarrows \IC$ with $a|_U = b|_U$, and $\varphi \circ h$ corresponds to the pair $(\varphi \circ j_1, \varphi \circ j_2)$. Let $B \coloneqq \Hom(X,\IC)$, which is the closed unit ball of the dual space $X^*$, and let
      $$E \coloneqq \{(\varphi \circ j_1, \varphi \circ j_2) : \varphi \in \Hom(C,\IC)\} \subseteq B \times B.$$
      We need to show that $(a,b) \in E$ for all $a,b \in B$ with $a|_U = b|_U$.

      By the definition of a cocongruence, $E$ is an equivalence relation on $B$. Since $E$ is the image of the closed unit ball of $C^*$ under the linear map $C^* \to X^* \times X^*$, $\varphi \mapsto (\varphi \circ j_1, \varphi \circ j_2)$, it is convex and satisfies $\lambda E \subseteq E$ for all $\lambda \in \IC$ with $|\lambda| \leq 1$. Since this map is continuous with respect to the weak-$*$ topologies and the closed unit ball of $C^*$ is weak-$*$ compact by the <a href="https://en.wikipedia.org/wiki/Banach%E2%80%93Alaoglu_theorem">Banach–Alaoglu theorem</a>, $E$ is weak-$*$ compact. In particular, $E$ is weak-$*$ closed and norm closed. Now consider
      $$\begin{align*}
      D & \coloneqq \{d \in X^* : (d,0) \in E\} \subseteq B, \\
      N & \coloneqq \textstyle \bigcup_{t > 0} t D \subseteq X^*.
      \end{align*}$$
      Then $D$ is convex, weak-$*$ closed, and satisfies $\lambda D \subseteq D$ for $|\lambda| \leq 1$.

      <strong>Claim 1.</strong> $N$ is a linear subspace of $X^*$.

      It contains $0 \in D$. If $f = t d$ with $t > 0$ and $d \in D$, and $\lambda \in \IC$ is non-zero, then $\lambda f = (|\lambda| t) \cdot (\lambda/|\lambda|) d \in N$ since $(\lambda/|\lambda|) d \in D$. If $f = s d$ and $g = t e$ with $s,t > 0$ and $d,e \in D$, then
      $$f + g = (s + t) \cdot \bigl(\tfrac{s}{s+t} d + \tfrac{t}{s+t} e\bigr) \in N$$
      since $\tfrac{s}{s+t} d + \tfrac{t}{s+t} e \in D$ by convexity.

      <strong>Claim 2.</strong> For $a,b \in B$ we have $(a,b) \in E$ if and only if $a - b \in N$.

      If $(a,b) \in E$, then also $(-b,-b) \in E$ by reflexivity, and convexity yields
      $$\bigl(\tfrac{1}{2}(a-b), 0\bigr) = \tfrac{1}{2} (a,b) + \tfrac{1}{2} (-b,-b) \in E.$$
      Hence $\tfrac{1}{2}(a-b) \in D$ and $a - b \in N$. Conversely, assume $a - b = t d$ with $t > 0$ and $d \in D$. Let $0 < r < 1$. Choose an integer $n \geq 1$ with $\delta \coloneqq rt/n \leq 1 - r$, and define
      $$z_k \coloneqq r b + k \delta d \in X^*$$
      for $0 \leq k \leq n$. Then $z_0 = rb$ and $z_n = rb + rtd = ra$. Since
      $$z_k = rb + \tfrac{k}{n} (ra - rb) = (1 - \tfrac{k}{n}) rb + \tfrac{k}{n} ra,$$
      we have $|z_k| \leq r \leq 1 - \delta$. Hence $z_k/(1-\delta) \in B$, so that $(z_k/(1-\delta), z_k/(1-\delta)) \in E$ by reflexivity. For $0 \leq k < n$, convexity yields
      $$(z_{k+1}, z_k) = \delta (d,0) + (1-\delta) \bigl(\tfrac{z_k}{1-\delta}, \tfrac{z_k}{1-\delta}\bigr) \in E.$$
      By transitivity, $(ra, rb) = (z_n, z_0) \in E$. Since $E$ is norm closed, letting $r \to 1$ gives $(a,b) \in E$.

      <strong>Claim 3.</strong> $N$ is weak-$*$ closed.

      For $b = 0$, Claim 2 says that $N \cap B = D$. Since $N$ is a linear subspace (Claim 1), we get $N \cap tB = t(N \cap B) = tD$ for all $t > 0$, which is weak-$*$ closed. By the <a href="https://en.wikipedia.org/wiki/Krein%E2%80%93Smulian_theorem">Krein–Šmulian theorem</a>, a convex subset of $X^*$ is weak-$*$ closed if its intersections with all closed balls $tB$ are weak-$*$ closed. Hence, $N$ is weak-$*$ closed.

      <strong>Claim 4.</strong> $U = \{x \in X : f(x) = 0 \text{ for all } f \in N\}$.

      Let $x \in U$ and $f \in N$, say $f = t d$ with $t > 0$ and $d \in D$. Since $(d,0) \in E$, there is a morphism $\varphi : C \to \IC$ with $d = \varphi \circ j_1$ and $0 = \varphi \circ j_2$. Hence
      $$d(x) = \varphi(j_1(x)) = \varphi(j_2(x)) = 0,$$
      and therefore $f(x) = t d(x) = 0$.

      Conversely, let $x \in X$ with $f(x) = 0$ for all $f \in N$, and let $\varphi : C \to \IC$ be a morphism. Since $(\varphi \circ j_1, \varphi \circ j_2) \in E$, Claim 2 shows that $\varphi \circ j_1 - \varphi \circ j_2 \in N$. Hence $\varphi(j_1(x)) - \varphi(j_2(x)) = 0$. Since this holds for every $\varphi \in \Hom(C,\IC)$, the Hahn-Banach theorem gives $j_1(x) = j_2(x)$, i.e. $x \in U$.

      Now we can finish the proof. Recall that for every linear subspace $M \subseteq X^*$, the functionals on $X$ vanishing on $\{x \in X : f(x) = 0 \text{ for all } f \in M\}$ form the weak-$*$ closure of $M$ (see <a href="https://arxiv.org/abs/2112.11166v8">van Neerven</a>, Prop. 4.49). Since $N$ is weak-$*$ closed (Claim 3), it consists of all functionals on $X$ vanishing on $U$ by Claim 4. Now let $a,b \in B$ with $a|_U = b|_U$. Then $a - b$ vanishes on $U$, so $a - b \in N$, and Claim 2 gives $(a,b) \in E$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: The linear map $\IC \to \IC$, $x \mapsto x/2$ with the usual norm on $\IC$ is a counterexample. It is bijective, hence a mono- and epimorphism, but not isometric and therefore no isomorphism.

  - property: CSP
    proof: By using the concrete description of products and coproducts, for the constant family $X_n = \IC$ equipped with the usual norm, the canonical morphism $\coprod_n X_n \to \prod_n X_n$ becomes the canonical inclusion map $\ell^1 \hookrightarrow \ell^\infty$. This is not an epimorphism (i.e., has no dense image) since the closure of the image is precisely $c_0$. So for example, $(1,1,\dotsc)$ is not contained in the closure of the image.

  - property: regular subobject classifier
    proof: If $\Omega$ is a regular subobject classifier, then by the classification of regular monomorphisms, $\Hom(X,\Omega)$ is isomorphic to the set of closed subspaces of $X$ for any Banach space $X$. For $X = \IC$ this implies that there are exactly two vectors in $\Omega$ with norm $\leq 1$, which is absurd. (For $\Omega = 0$ there is just one, and for $\Omega \neq 0$ there are infinitely many.)

  - property: regular quotient object classifier
    proof: >-
      Assume that $\Psi$ is a regular quotient object classifier in $\Ban$. For a Banach space $X$ let $S(X)$ be the set of closed subspaces of $X$. Then for any Banach space $X$ the map
      $$\Hom(\Psi,X) \to S(X), \quad f \mapsto \overline{\im(f)}$$
      is bijective. In particular, there is a morphism $f : \Psi \to X$ with dense image, i.e. an epimorphism. But this contradicts the already established fact that $\Ban$ is well-copowered (since it is locally presentable).
      Alternatively, we may use that for every cardinal $\kappa$ the Banach space $\ell^2(\kappa^+)$ has no dense subset of size $\kappa$.

  - property: unital
    proof: The canonical morphism $X \sqcup Y \to X \times Y$ is injective, and therefore a monomorphism. Hence, if it were also a strong epimorphism, it would be an isomorphism. However, for example, when $X = Y = \IC$, the norms do not agree.

  - property: counital
    proof: The canonical morphism $X \sqcup Y \to X \times Y$ is surjective, and therefore an epimorphism. Hence, if it were also a strong monomorphism, it would be an isomorphism. However, for example, when $X = Y = \IC$, the norms do not agree.

  - property: filtered-colimit-stable monomorphisms
    proof: 'The proof is similar to <a href="/category/Met">$\Met$</a>. For $n \geq 1$ let $X_n$ be the Banach space with underlying vector space $\IC$ and the norm $|x|_n \coloneqq \frac{1}{n} |x|$. For $n \leq m$ the identity map provides a morphism $X_n \to X_m$, which is clearly a monomorphism (also an epimorphism by the way, but an isomorphism iff $n=m$). Let $X$ be the colimit of all $X_n$ in the category of semi-normed vector spaces. It is constructed as the colimit in the category of vector spaces with the semi-norm $|x| \coloneqq \inf \{|x|_m : n \leq m \}$ for $x \in X_n$. So clearly, the semi-norm is zero. Hence, the colimit in the category of normed vector spaces is $0$. The colimit in the category of Banach spaces is its completion, which is also $0$. Thus, the monomorphisms $X_1 \hookrightarrow X_n$ become the zero map $X_1 \to 0$ in the colimit, which is not a monomorphism.'
    references:
      - Met_no_filtered_colimit_stable_monos

  - property: cofiltered-limit-stable epimorphisms
    proof: 'We show that epimorphisms are not stable under sequential limits. Let $X_n = Y_n = \IC$ for all $n \geq 0$, equipped with the usual norm. The transition morphism $Y_{n+1} \to Y_n$ is the identity, and the transition morphism $X_{n+1} \to X_n$ is $x \mapsto x/2$. The morphisms $X_n \to Y_n$, $x \mapsto x/2^n$ are compatible with the transitions, and they are surjective, hence epimorphisms. Now we check $\lim_n X_n = 0$: An element $(x_n) \in \lim_n X_n$ is a family of complex numbers satisfying $x_n = x_{n+1}/2$ <i>and</i> $\sup_n |x_n| < \infty$. But then $x_n = 2^n x_0$ and this can only be bounded when $x_0=0$. Hence, $0 = \lim_n X_n \to \lim_n Y_n = \IC$ is no epimorphism.'

special_objects:
  initial object:
    description: trivial Banach space
  terminal object:
    description: trivial Banach space
  coproducts:
    description: 'The coproduct of a family of Banach spaces $(X_i,|{-}|)_{i \in I}$ is the subspace $\bigl\{x \in \prod_{i \in I} X_i : \sum_{i \in I} |x_i| < \infty\bigr\}$ of their vector space product equipped with the $1$-norm $|x|_1 \coloneqq \sum_{i \in I} |x_i|$.'
  products:
    description: 'The product of a family of Banach spaces $(X_i,|{-}|)_{i \in I}$ is the subspace $\bigl\{x \in \prod_{i \in I} X_i : \sup_{i \in I} |x_i| < \infty\bigr\}$ of their vector space product equipped with the $\sup$-norm $|x|_\infty \coloneqq \sup_{i \in I} |x_i|$.'

special_morphisms:
  isomorphism:
    description: bijective linear isometries
    proof: This is easy.
  monomorphism:
    description: injective linear contractions
    proof: 'The unit ball functor $U : \Ban \to \Set$ is faithful and representable (by $\IC$), hence reflects and preserves monomorphisms.'
  epimorphism:
    description: linear contractions with dense image
    proof: 'Let $f : X \to Y$ be an epimorphism of Banach spaces. The subspace $U \coloneqq \overline{f(X)} \subseteq Y$ is closed. It is well-known that the quotient $Y/U$ is also a Banach space with a projection $p : Y \to Y/U$. Since $p \circ f = 0 = 0 \circ f$, we infer $p = 0$, so that $U = Y$.'
  regular monomorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular monomorphism. (2) $f$ is isometric. (3) $f$ is isomorphic to the inclusion of a closed subspace of $Y$.
    proof: >-
      (1) implies (2): This follows immediately from the concrete construction of equalizers.

      (2) implies (3): The image of $f$ is complete, hence closed. The rest is clear.

      (3) implies (1): If $U \subseteq Y$ is a closed subspace, then the inclusion is the kernel of the projection $Y \to Y/U$, where $Y/U$ is the <a href="https://math.stackexchange.com/questions/319867">well-known</a> quotient Banach space.
  regular epimorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular epimorphism. (2) The norm on $Y$ is given by $|y| = \inf \{|x| : f(x) = y\}$. (3) $f$ maps the open unit ball of $X$ onto the open unit ball of $Y$.
    proof: >-
      First of all, notice that all three conditions imply that $f$ is surjective.

      (1) implies (2): This follows immediately from the concrete construction of coequalizers, and the quotient Banach space in particular.

      (2) implies (1): Let $U \coloneqq \ker(f)$. Then $U$ is a closed subspace of $X$, and $f$ induces a bijective linear contraction $\tilde{f} : X/U \to Y$. It is isometric by assumption on $f$ and the definition of the norm on $X/U$. Thus, $\tilde{f}$ is an isomorphism. Since $X/U$ is the cokernel of $U \hookrightarrow X$, it follows that $f$ is a regular epimorphism.

      (2) implies (3): Let $y \in Y$ be an element with $|y| < 1$. Since $|y|$ is the infimum of all $|x|$ with $f(x)=y$, there is some $x$ with $f(x)=y$ and $|x| < 1$.

      (3) implies (2): Let $y \in Y$. Since $f$ is a linear contraction, the inequality $|y| \leq \inf \{|x| : f(x) = y\}$ holds. Let $\varepsilon > 0$. Consider $y' \coloneqq y / (|y| + \varepsilon)$. Then $|y'| < 1$. Thus, by assumption, there is some $x' \in X$ with $|x'| < 1$ and $f(x') =y'$. Let $x \coloneqq (|y| + \varepsilon) x'$. Then $f(x) = y$ and $|x| < |y| + \varepsilon$. Thus, the infimum in question is $\leq |y| + \varepsilon$, for every $\varepsilon > 0$, and hence $\leq |y|$.
