id: Ban
name: category of Banach spaces with linear contractions
notation: $\Ban$
objects: Banach spaces over $\IC$
morphisms: linear contractions, i.e. linear maps of norm $\leq 1$
description: 'The choice of morphisms is similar to that of $\Met$, which yields better categorical properties. In the proofs of properties, we use that the inclusion $J : \Ban \hookrightarrow \NormVect$ has a left adjoint, the completion (<a href="/functor/forget_complete?proof=right_adjoint">proof</a>).'
nlab_link: https://ncatlab.org/nlab/show/Banach+space
keywords:
  - complete normed spaces

tags:
  - analysis

related:
  - NormVect
  - SemiNormVect
  - Met
  - Vect

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Ban \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: complete
    proof: >-
      We already know that $\NormVect$ is complete (<a href="/category/NormVect?proof=complete" data-allow-deduced>proof</a>). Since the inclusion $J : \Ban \hookrightarrow \NormVect$ is fully faithful and has a left adjoint, $\Ban$ is closed under limits in $\NormVect$. Hence, $\Ban$ is complete, and by the <a href="/category/NormVect?proof=complete">construction</a> of limits in $\NormVect$, the limit of a diagram of Banach spaces $(X_i)$ is a subspace of $\prod_i X_i$ with the norm $|x| \coloneqq \sup_i |x_i|$. In particular, the product of $(X_i)$ is the subspace $\bigl\{x \in \prod_i X_i : \sup_i |x_i| < \infty\bigr\}$.
    check_redundancy: false

  - property: coproducts
    proof: >-
      Let $(X_i)_{i \in I}$ be a family of Banach spaces. Since the completion functor $\NormVect \to \Ban$ is a left adjoint, it preserves coproducts, so the coproduct of $(X_i)$ in $\Ban$ is the completion of their coproduct in $\NormVect$, which is the direct sum $\bigoplus_i X_i$ with the norm $|x| \coloneqq \sum_i |x_i|$ (<a href="/category/NormVect?proof=coproducts">proof</a>). We claim that this completion is the subspace
      $$\textstyle X \coloneqq \bigl\{x \in \prod_{i \in I} X_i : \sum_{i \in I} |x_i| < \infty\bigr\}$$
      with the norm $|x| \coloneqq \sum_i |x_i|$. For this, it suffices to show that $\bigoplus_i X_i$ is dense in $X$ and that $X$ is complete. This is well-known, but we repeat the proof for convenience.

      Let $x \in X$ and $\varepsilon > 0$. Choose a finite subset $F \subseteq I$ with $\sum_{i \in I \setminus F} |x_i| < \varepsilon$, and let $x' \in \bigoplus_i X_i$ be defined by $x'_i \coloneqq x_i$ for $i \in F$ and $x'_i \coloneqq 0$ otherwise. Then $|x - x'| = \sum_{i \in I \setminus F} |x_i| < \varepsilon$. So $\bigoplus_i X_i$ is dense in $X$.

      Let $(x^{(n)})_{n \geq 1}$ be a Cauchy sequence in $X$. Since $|x_i| \leq |x|$ for all $x \in X$, the sequence $(x^{(n)}_i)_{n \geq 1}$ is a Cauchy sequence in $X_i$ for every $i \in I$, hence converges to some $x_i \in X_i$. Let $\varepsilon > 0$, and choose $N \geq 1$ with $|x^{(n)} - x^{(m)}| \leq \varepsilon$ for all $n,m \geq N$. For every finite subset $F \subseteq I$ and all $n,m \geq N$ we get $\sum_{i \in F} |x^{(n)}_i - x^{(m)}_i| \leq \varepsilon$, and letting $m \to \infty$ gives $\sum_{i \in F} |x^{(n)}_i - x_i| \leq \varepsilon$. Taking the supremum over all finite subsets $F$, we get $\sum_{i \in I} |x^{(n)}_i - x_i| \leq \varepsilon$ for all $n \geq N$. Hence, $x \coloneqq (x_i)_{i \in I}$ satisfies $x^{(N)} - x \in X$, so that $x = x^{(N)} - (x^{(N)} - x) \in X$, and $|x^{(n)} - x| \leq \varepsilon$ for all $n \geq N$. So $(x^{(n)})$ converges to $x$.

      In particular, for a finite family $(X_i)$, the coproduct is the direct sum $\bigoplus_i X_i$ with the norm $|x| \coloneqq \sum_i |x_i|$, as in $\NormVect$.
    check_redundancy: false

  - property: coequalizers
    proof: >-
      Let $f,g : W \rightrightarrows X$ be linear contractions between Banach spaces. By the <a href="/category/NormVect?proof=coequalizers">construction</a> of coequalizers in $\NormVect$, their coequalizer there is the projection $q : X \to X/\overline{U}$ with $U \coloneqq \im(f - g)$ and the quotient norm $|q(x)| = \inf_{u \in \overline{U}} |x + u|$. As the quotient of a Banach space by a closed subspace, $X/\overline{U}$ is a Banach space (see <a href="https://arxiv.org/abs/2112.11166v8">van Neerven</a>, Section 1.1.b). Since the inclusion $J : \Ban \hookrightarrow \NormVect$ is fully faithful, it reflects colimits, so $q$ is also the coequalizer in $\Ban$.
    check_redundancy: false

  - property: CIP
    proof: >-
      Zero morphisms are given by the zero maps. By the <a href="/category/Ban?proof=coproducts">construction</a> of coproducts and the <a href="/category/Ban?proof=complete">construction</a> of products, for a family $(X_i)_{i \in I}$ of Banach spaces the canonical morphism from the coproduct to the product is the inclusion of $\bigl\{x \in \prod_{i \in I} X_i : \sum_{i \in I} |x_i| < \infty\bigr\}$ into $\bigl\{x \in \prod_{i \in I} X_i : \sup_{i \in I} |x_i| < \infty\bigr\}$. It is injective, hence a monomorphism.

  - property: binary CSP
    proof: >-
      By the <a href="/category/Ban?proof=coproducts">construction</a> of coproducts and the <a href="/category/Ban?proof=complete">construction</a> of products, the canonical morphism $X \sqcup Y \to X \times Y$ is the identity map of the underlying vector space $X \oplus Y$. Hence, it is surjective and therefore an epimorphism. This is the same <a href="/category/SemiNormVect?proof=binary_CSP">argument</a> as for $\SemiNormVect$.

  - property: cartesian filtered colimits
    proof: >-
      Filtered colimits exist in $\Ban$, since it has coproducts (<a href="/category/Ban?proof=coproducts" data-allow-deduced>proof</a>) and coequalizers (<a href="/category/Ban?proof=coequalizers" data-allow-deduced>proof</a>), and it has finite products since it is complete (<a href="/category/Ban?proof=complete" data-allow-deduced>proof</a>). We already know that $\NormVect$ has cartesian filtered colimits (<a href="/category/NormVect?proof=cartesian_filtered_colimits" data-allow-deduced>proof</a>). We apply <a href="/content/subcategories#lemma_16">Lemma 16 on subcategories</a> to the inclusion $J : \Ban \hookrightarrow \NormVect$ and its left adjoint, the completion functor $\NormVect \to \Ban$. It preserves binary products, even all products (<a href="/functor/normed_completion?proof=preserves_products" data-allow-deduced>proof</a>).

  - property: cocartesian cofiltered limits
    proof: >-
      Limits (<a href="/category/Ban?proof=complete">proof</a>) and finite coproducts (<a href="/category/Ban?proof=coproducts">proof</a>) exist in $\Ban$ and are constructed as in $\NormVect$. We already know that $\NormVect$ has cocartesian cofiltered limits (<a href="/category/NormVect?proof=cocartesian_cofiltered_limits" data-allow-deduced>proof</a>). This property is inherited by $\Ban$, since the inclusion $J : \Ban \hookrightarrow \NormVect$ is fully faithful and preserves limits and finite coproducts.

  - property: extremal cogenerator
    proof: >-
      Since $\IC$ is a cogenerator of $\NormVect$ (<a href="/category/NormVect?proof=cogenerator">proof</a>) and a Banach space, and $\Ban$ is a full subcategory of $\NormVect$, it is also a cogenerator of $\Ban$. We claim that it is in fact an extremal cogenerator. Let $f : X \to Y$ be a linear contraction such that ${-} \circ f : \Hom(Y,\IC) \to \Hom(X,\IC)$ is bijective. Since $\IC$ is a cogenerator and ${-} \circ f$ is injective, $f$ is an epimorphism, i.e. it has dense image (<a href="/category/Ban?proof=epimorphism" data-allow-deduced>proof</a>).

      Next, we show that $f$ is isometric. Let $x \in X$. By the Hahn-Banach theorem, there is a linear functional $\varphi : X \to \IC$ with $\varphi(x) = |x|$ and $|\varphi(z)| \leq |z|$ for all $z \in X$. Then $\varphi$ is a morphism in $\Ban$, so by the surjectivity of ${-} \circ f$ there is a morphism $\psi : Y \to \IC$ with $\varphi = \psi \circ f$. Hence, $|x| = |\psi(f(x))| \leq |f(x)| \leq |x|$.

      Since $X$ is complete and $f$ is isometric, $f(X)$ is complete, hence closed in $Y$. Since $f(X)$ is also dense, we get $f(X) = Y$. So $f$ is a bijective linear isometry, hence an isomorphism (<a href="/category/Ban?proof=isomorphism" data-allow-deduced>proof</a>).

      <strong>Remark.</strong> The argument fails in $\NormVect$: it still shows that $f$ is isometric and an epimorphism, i.e. has dense image (<a href="/category/NormVect?proof=epimorphism" data-allow-deduced>proof</a>), but if $X$ is not complete, the image of $f$ need not be closed. In fact, $\NormVect$ has no extremal cogenerator (<a href="/category/NormVect?proof=extremal_cogenerator" data-allow-deduced>proof</a>).

  - property: pullback-stable regular epimorphisms
    proof: >-
      Apply the dual of <a href="/content/subcategories#lemma_14">Lemma 14 on subcategories</a> to the fully faithful inclusion $J : \Ban \hookrightarrow \NormVect$. As a right adjoint, it preserves pullbacks. It preserves regular epimorphisms, since coequalizers in $\Ban$ are constructed as in $\NormVect$ (<a href="/category/Ban?proof=coequalizers">proof</a>). Finally, $\NormVect$ has pullback-stable regular epimorphisms (<a href="/category/NormVect?proof=pullback-stable_regular_epimorphisms" data-allow-deduced>proof</a>).

  - property: pushout-stable regular monomorphisms
    proof: >-
      We already know that $\NormVect$ has pushout-stable regular monomorphisms (<a href="/category/NormVect?proof=pushout-stable_regular_monomorphisms" data-allow-deduced>proof</a>). We apply <a href="/content/subcategories#lemma_14">Lemma 14 on subcategories</a> to the inclusion $J : \Ban \hookrightarrow \NormVect$. As a right adjoint, it preserves regular monomorphisms. It preserves pushouts, since binary coproducts (<a href="/category/Ban?proof=coproducts">proof</a>) and coequalizers (<a href="/category/Ban?proof=coequalizers">proof</a>) in $\Ban$ are constructed as in $\NormVect$.

  - property: ℵ₁-accessible
    proof: >-
      We adapt the <a href="/category/NormVect?proof=aleph1-accessible">proof</a> for $\NormVect$.

      First, the inclusion $J : \Ban \hookrightarrow \NormVect$ preserves $\aleph_1$-filtered colimits. To see this, let $(V_i)_{i \in \I}$ be an $\aleph_1$-filtered diagram of Banach spaces with colimit $(u_i : V_i \to V)$ in $\NormVect$, which is also its colimit in $\SemiNormVect$ by the proof for $\NormVect$. We show that $V$ is complete. Recall that a normed vector space is complete if and only if every absolutely convergent series in it converges (see <a href="https://arxiv.org/abs/2112.11166v8">van Neerven</a>, Prop. 1.3). So let $(v_m)_{m \geq 1}$ be a sequence in $V$ with $\sum_{m \geq 1} |v_m| < \infty$. By Claim 1 in the <a href="/category/SemiNormVect?proof=aleph1-accessible">proof</a> for $\SemiNormVect$ and by using that $\I$ is $\aleph_1$-filtered, there are an index $k$ and elements $w_m \in V_k$ with $u_k(w_m) = v_m$ and $|w_m| \leq |v_m|$ for all $m \geq 1$. So the series $\sum_{m \geq 1} w_m$ converges absolutely. Since $V_k$ is complete, it converges to some $s \in V_k$. Since $u_k$ is a linear contraction, hence continuous, the series $\sum_{m \geq 1} v_m = \sum_{m \geq 1} u_k(w_m)$ converges to $u_k(s)$. Since $J$ is fully faithful, it reflects colimits, so $V$ is also the colimit in $\Ban$.

      Now let $K$ be a separable Banach space, i.e. a Banach space with a countable dense subset. The linear span of a countable dense subset is a dense subspace $K_0 \subseteq K$ of countable algebraic dimension, and $K$ is the completion of $K_0$. Hence, we have $\Hom(K,-) \cong \Hom(K_0,J(-))$, which preserves $\aleph_1$-filtered colimits, since $J$ does and $K_0$ is $\aleph_1$-presentable in $\NormVect$ by the proof for $\NormVect$. So $K$ is $\aleph_1$-presentable. Every Banach space $X$ is the colimit in $\SemiNormVect$ of its closed separable subspaces, ordered by inclusion: the colimit of the underlying vector spaces is their union, which is $X$, since every $x \in X$ lies in the closed subspace $\IC x$, which is separable with the countable dense subset $\IQ(i) x$, and the semi-norm of the colimit is the norm of $X$, since all inclusions are isometric. This diagram is $\aleph_1$-filtered, since the closed linear span of countably many separable subspaces is separable, and it consists of Banach spaces, so $X$ is also its colimit in $\Ban$. Finally, up to isomorphism the separable Banach spaces constitute a set, since each of them is the completion of a normed vector space of countable algebraic dimension, and these constitute a set up to isomorphism by the proof for $\NormVect$.

      <strong>Remark.</strong> Together with cocompleteness, it follows that $\Ban$ is locally $\aleph_1$-presentable. See <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Example 1.48 for an alternative proof using totally convex spaces.

  - property: effective congruences
    proof: >-
      Let $q_1,q_2 : R \rightrightarrows X$ be a congruence in $\Ban$. We may assume that the induced map $R \hookrightarrow X \times X$ is an inclusion of vector spaces. Since limits in $\Ban$ are constructed as in $\NormVect$ (<a href="/category/Ban?proof=complete">proof</a>), hence as in $\SemiNormVect$ (<a href="/category/NormVect?proof=complete">proof</a>), and the inclusion $\Ban \hookrightarrow \SemiNormVect$ is fully faithful, $q_1,q_2$ is also a congruence in $\SemiNormVect$. Let $U \coloneqq \{x \in X : (x,0) \in R\}$. The <a href="/category/SemiNormVect?proof=effective_congruences">proof</a> for $\SemiNormVect$ shows that $R \hookrightarrow X \times X$ is isometric and that $R$ is the kernel pair of the projection $X \to X/U$ in $\SemiNormVect$.

      Since $R$ is complete and $R \hookrightarrow X \times X$ is isometric, $R$ is a closed subspace of $X \times X$. It follows that $U$, the preimage of $R$ under $X \to X \times X$, $x \mapsto (x,0)$, is a closed subspace of $X$, so that $X/U$ is a Banach space. Since the inclusion $\Ban \hookrightarrow \SemiNormVect$ is fully faithful, it reflects limits, so $R$ is the kernel pair of $X \to X/U$ in $\Ban$ as well.

      <strong>Remark.</strong> The argument fails in $\NormVect$, since the subspace $U$ need not be closed there, whereas the kernel of a linear contraction is closed. In fact, $\NormVect$ does not have effective congruences (<a href="/category/NormVect?proof=effective_congruences" data-allow-deduced>proof</a>).

  - property: effective cocongruences
    proof: >-
      <strong>Idea.</strong> For congruences, we could reduce to vector spaces, where a congruence is just the relation "the difference lies in a subspace". Cocongruences are much harder to grasp directly, but they turn into congruences after dualizing: applying $\Hom(-,\IC)$ to a cocongruence on $X$ yields an equivalence relation on the unit ball of $X^*$, and by the Hahn-Banach theorem a Banach space and its norm are determined by its functionals. So we try to mimic the argument for congruences on the dual side. The equivalence relation is convex, which suggests that it is again given by a subspace of $X^*$, and this subspace should be the annihilator of the equalizer of the cocongruence. Two obstacles have to be overcome: the relation only lives on the unit ball, not on a vector space, so we can only move in small steps; and in order to get back from $X^*$ to $X$, the subspace has to be weak-$*$ closed. This is where the compactness of the unit ball and the Krein–Šmulian theorem enter.

      Let $j_1,j_2 : X \rightrightarrows C$ be a cocongruence in $\Ban$. Let $U \coloneqq \{x \in X : j_1(x) = j_2(x)\}$ be their equalizer, and let $\iota_1,\iota_2 : X \rightrightarrows Z$ be the cokernel pair of the inclusion $U \hookrightarrow X$. Since $j_1,j_2$ agree on $U$, there is a unique morphism $h : Z \to C$ with $h \circ \iota_1 = j_1$ and $h \circ \iota_2 = j_2$. We show that $h$ is an isomorphism, which proves that $j_1,j_2$ is effective.

      Since $j_1,j_2$ are jointly epimorphic and factor through $h$, the morphism $h$ is an epimorphism, i.e. it has dense image (<a href="/category/Ban?proof=epimorphism" data-allow-deduced>proof</a>). Since an isometric linear map between Banach spaces has closed image, it suffices to prove that $h$ is isometric. For this, it suffices to show that every morphism $\psi : Z \to \IC$ factors as $\psi = \varphi \circ h$ for some morphism $\varphi : C \to \IC$. Indeed, then $|\psi(z)| = |\varphi(h(z))| \leq |h(z)|$ for all $z \in Z$, and since by the Hahn-Banach theorem $|z|$ is the supremum of all $|\psi(z)|$, we get $|z| \leq |h(z)|$. The reverse inequality holds since $h$ is a contraction.

      By the universal property of $Z$, morphisms $Z \to \IC$ correspond to pairs of morphisms $a,b : X \rightrightarrows \IC$ with $a|_U = b|_U$, and $\varphi \circ h$ corresponds to the pair $(\varphi \circ j_1, \varphi \circ j_2)$. Let $B \coloneqq \Hom(X,\IC)$, which is the closed unit ball of the dual space $X^*$, and let
      $$E \coloneqq \{(\varphi \circ j_1, \varphi \circ j_2) : \varphi \in \Hom(C,\IC)\} \subseteq B \times B.$$
      We need to show that $(a,b) \in E$ for all $a,b \in B$ with $a|_U = b|_U$.

      By the definition of a cocongruence, $E$ is an equivalence relation on $B$. Since $E$ is the image of the closed unit ball of $C^*$ under the linear map $C^* \to X^* \times X^*$, $\varphi \mapsto (\varphi \circ j_1, \varphi \circ j_2)$, it is convex and satisfies $\lambda E \subseteq E$ for all $\lambda \in \IC$ with $|\lambda| \leq 1$. Since this map is continuous with respect to the weak-$*$ topologies and the closed unit ball of $C^*$ is weak-$*$ compact by the <a href="https://en.wikipedia.org/wiki/Banach%E2%80%93Alaoglu_theorem">Banach–Alaoglu theorem</a>, $E$ is weak-$*$ compact. In particular, $E$ is weak-$*$ closed and norm closed. Now consider
      $$\begin{align*}
      D & \coloneqq \{d \in X^* : (d,0) \in E\} \subseteq B, \\
      N & \coloneqq \textstyle \bigcup_{t > 0} t D \subseteq X^*.
      \end{align*}$$
      Then $D$ is convex, weak-$*$ closed, and satisfies $\lambda D \subseteq D$ for $|\lambda| \leq 1$.

      <strong>Claim 1.</strong> $N$ is a linear subspace of $X^*$.

      It contains $0 \in D$. If $f = t d$ with $t > 0$ and $d \in D$, and $\lambda \in \IC$ is non-zero, then $\lambda f = (|\lambda| t) \cdot (\lambda/|\lambda|) d \in N$ since $(\lambda/|\lambda|) d \in D$. If $f = s d$ and $g = t e$ with $s,t > 0$ and $d,e \in D$, then
      $$f + g = (s + t) \cdot \bigl(\tfrac{s}{s+t} d + \tfrac{t}{s+t} e\bigr) \in N$$
      since $\tfrac{s}{s+t} d + \tfrac{t}{s+t} e \in D$ by convexity.

      <strong>Claim 2.</strong> For $a,b \in B$ we have $(a,b) \in E$ if and only if $a - b \in N$.

      If $(a,b) \in E$, then also $(-b,-b) \in E$ by reflexivity, and convexity yields
      $$\bigl(\tfrac{1}{2}(a-b), 0\bigr) = \tfrac{1}{2} (a,b) + \tfrac{1}{2} (-b,-b) \in E.$$
      Hence $\tfrac{1}{2}(a-b) \in D$ and $a - b \in N$. Conversely, assume $a - b = t d$ with $t > 0$ and $d \in D$. Let $0 < r < 1$. Choose an integer $n \geq 1$ with $\delta \coloneqq rt/n \leq 1 - r$, and define
      $$z_k \coloneqq r b + k \delta d \in X^*$$
      for $0 \leq k \leq n$. Then $z_0 = rb$ and $z_n = rb + rtd = ra$. Since
      $$z_k = rb + \tfrac{k}{n} (ra - rb) = (1 - \tfrac{k}{n}) rb + \tfrac{k}{n} ra,$$
      we have $|z_k| \leq r \leq 1 - \delta$. Hence $z_k/(1-\delta) \in B$, so that $(z_k/(1-\delta), z_k/(1-\delta)) \in E$ by reflexivity. For $0 \leq k < n$, convexity yields
      $$(z_{k+1}, z_k) = \delta (d,0) + (1-\delta) \bigl(\tfrac{z_k}{1-\delta}, \tfrac{z_k}{1-\delta}\bigr) \in E.$$
      By transitivity, $(ra, rb) = (z_n, z_0) \in E$. Since $E$ is norm closed, letting $r \to 1$ gives $(a,b) \in E$.

      <strong>Claim 3.</strong> $N$ is weak-$*$ closed.

      For $b = 0$, Claim 2 says that $N \cap B = D$. Since $N$ is a linear subspace (Claim 1), we get $N \cap tB = t(N \cap B) = tD$ for all $t > 0$, which is weak-$*$ closed. By the <a href="https://en.wikipedia.org/wiki/Krein%E2%80%93Smulian_theorem">Krein–Šmulian theorem</a>, a convex subset of $X^*$ is weak-$*$ closed if its intersections with all closed balls $tB$ are weak-$*$ closed. Hence, $N$ is weak-$*$ closed.

      <strong>Claim 4.</strong> $U = \{x \in X : f(x) = 0 \text{ for all } f \in N\}$.

      Let $x \in U$ and $f \in N$, say $f = t d$ with $t > 0$ and $d \in D$. Since $(d,0) \in E$, there is a morphism $\varphi : C \to \IC$ with $d = \varphi \circ j_1$ and $0 = \varphi \circ j_2$. Hence
      $$d(x) = \varphi(j_1(x)) = \varphi(j_2(x)) = 0,$$
      and therefore $f(x) = t d(x) = 0$.

      Conversely, let $x \in X$ with $f(x) = 0$ for all $f \in N$, and let $\varphi : C \to \IC$ be a morphism. Since $(\varphi \circ j_1, \varphi \circ j_2) \in E$, Claim 2 shows that $\varphi \circ j_1 - \varphi \circ j_2 \in N$. Hence $\varphi(j_1(x)) - \varphi(j_2(x)) = 0$. Since this holds for every $\varphi \in \Hom(C,\IC)$, the Hahn-Banach theorem gives $j_1(x) = j_2(x)$, i.e. $x \in U$.

      Now we can finish the proof. Recall that for every linear subspace $M \subseteq X^*$, the functionals on $X$ vanishing on $\{x \in X : f(x) = 0 \text{ for all } f \in M\}$ form the weak-$*$ closure of $M$ (see <a href="https://arxiv.org/abs/2112.11166v8">van Neerven</a>, Prop. 4.49). Since $N$ is weak-$*$ closed (Claim 3), it consists of all functionals on $X$ vanishing on $U$ by Claim 4. Now let $a,b \in B$ with $a|_U = b|_U$. Then $a - b$ vanishes on $U$, so $a - b \in N$, and Claim 2 gives $(a,b) \in E$.

unsatisfied_properties:
  - property: skeletal
    proof: The zero Banach spaces with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: biproducts
    proof: >-
      By the <a href="/category/Ban?proof=coproducts">construction</a> of coproducts and the <a href="/category/Ban?proof=complete">construction</a> of products, for $X = Y = \IC$ the canonical morphism $X \sqcup Y \to X \times Y$ is the identity map of $\IC^2$, where the element $(1,1)$ has norm $2$ in $X \sqcup Y$, but norm $1$ in $X \times Y$. So the canonical morphism is not isometric, hence not an isomorphism (<a href="/category/Ban?proof=isomorphism" data-allow-deduced>proof</a>). This is the same <a href="/category/SemiNormVect?proof=biproducts">argument</a> as for $\SemiNormVect$.

  - property: regular subobject classifier
    proof: >-
      The <a href="/category/SemiNormVect?proof=regular_subobject_classifier">proof</a> for $\SemiNormVect$ works verbatim, using that the regular monomorphisms are, up to isomorphism, the inclusions of closed subspaces (<a href="/category/Ban?proof=regular_monomorphism" data-allow-deduced>proof</a>), and that $\{0\}$ and $\IC$ are the only closed subspaces of $\IC$.

  - property: regular quotient object classifier
    proof: >-
      The <a href="/category/SemiNormVect?proof=regular_quotient_object_classifier">proof</a> for $\SemiNormVect$ works verbatim, using that a regular epimorphism carries the quotient norm (<a href="/category/Ban?proof=regular_epimorphism" data-allow-deduced>proof</a>).

  - property: product-stable epimorphisms
    proof: >-
      Products in $\Ban$ are constructed as in $\NormVect$ (<a href="/category/Ban?proof=complete">proof</a>), and the epimorphisms are the linear contractions with dense image, both in $\Ban$ (<a href="/category/Ban?proof=epimorphism" data-allow-deduced>proof</a>) and in $\NormVect$ (<a href="/category/NormVect?proof=epimorphism" data-allow-deduced>proof</a>). Since the <a href="/category/NormVect?proof=product-stable_epimorphisms">counterexample</a> for $\NormVect$ is a product of epimorphisms $\IC \to \IC$, and $\IC$ is a Banach space, it works verbatim in $\Ban$.

  - property: filtered-colimit-stable monomorphisms
    proof: >-
      The <a href="/category/NormVect?proof=filtered-colimit-stable_monomorphisms">counterexample</a> for $\NormVect$ works here as well: the spaces $X_n$ there are Banach spaces, and since the completion functor $\NormVect \to \Ban$ is a left adjoint, the colimit in $\Ban$ is the completion of the colimit $0$ in $\NormVect$, which is $0$.

special_objects:
  initial object:
    description: trivial Banach space
  terminal object:
    description: trivial Banach space
  coproducts:
    description: 'The coproduct of a family of Banach spaces $(X_i,|{-}|)_{i \in I}$ is the subspace $\bigl\{x \in \prod_{i \in I} X_i : \sum_{i \in I} |x_i| < \infty\bigr\}$ of their vector space product equipped with the $1$-norm $|x|_1 \coloneqq \sum_{i \in I} |x_i|$.'
  products:
    description: 'The product of a family of Banach spaces $(X_i,|{-}|)_{i \in I}$ is the subspace $\bigl\{x \in \prod_{i \in I} X_i : \sup_{i \in I} |x_i| < \infty\bigr\}$ of their vector space product equipped with the $\sup$-norm $|x|_\infty \coloneqq \sup_{i \in I} |x_i|$.'

special_morphisms:
  isomorphism:
    description: bijective linear isometries
    proof: >-
      Since $\Ban$ is a full subcategory of $\SemiNormVect$, its isomorphisms are the isomorphisms of $\SemiNormVect$ between Banach spaces, which are the bijective linear isometries (<a href="/category/SemiNormVect?proof=isomorphism" data-allow-deduced>proof</a>).
  monomorphism:
    description: injective linear contractions
    proof: >-
      The <a href="/category/SemiNormVect?proof=monomorphism">proof</a> for $\SemiNormVect$ works verbatim, since it only uses the representable functor $\Hom(\IC,-)$, and $\IC$ is a Banach space.

      Alternatively, for the non-trivial direction, the inclusion $J : \Ban \hookrightarrow \NormVect$ is a right adjoint, hence preserves monomorphisms, and the monomorphisms in $\NormVect$ are injective (<a href="/category/NormVect?proof=monomorphism" data-allow-deduced>proof</a>).
  epimorphism:
    description: linear contractions with dense image
    proof: >-
      The inclusion $J : \Ban \hookrightarrow \NormVect$ preserves finite colimits, since finite coproducts (<a href="/category/Ban?proof=coproducts">proof</a>) and coequalizers (<a href="/category/Ban?proof=coequalizers">proof</a>) in $\Ban$ are constructed as in $\NormVect$. In particular, $J$ preserves pushouts and therefore epimorphisms. Since $J$ is faithful, it also reflects epimorphisms. Hence, the epimorphisms in $\Ban$ are the epimorphisms in $\NormVect$ between Banach spaces, which are the linear contractions with dense image (<a href="/category/NormVect?proof=epimorphism" data-allow-deduced>proof</a>).
  regular monomorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular monomorphism. (2) $f$ is isometric. (3) $f$ is isomorphic to the inclusion of a closed subspace of $Y$.
    proof: >-
      The <a href="/category/NormVect?proof=regular_monomorphism">proof</a> for $\NormVect$ works verbatim, since limits in $\Ban$ are constructed as in $\NormVect$ (<a href="/category/Ban?proof=complete">proof</a>), and the quotient of a Banach space by a closed subspace is a Banach space. Moreover, the image of an isometric linear map from a Banach space is complete, hence closed, so that (2) is equivalent to being isometric with closed image.
  regular epimorphism:
    description: >-
      For a linear contraction $f : X \to Y$ the following are equivalent: (1) $f$ is a regular epimorphism. (2) $f$ is surjective, and the norm on $Y$ is given by $|y| = \inf \{|x| : f(x) = y\}$. (3) $f$ maps the open unit ball of $X$ onto the open unit ball of $Y$.
    proof: >-
      The <a href="/category/NormVect?proof=regular_epimorphism">proof</a> for $\NormVect$ works verbatim, since coequalizers in $\Ban$ are constructed as in $\NormVect$ (<a href="/category/Ban?proof=coequalizers">proof</a>).
