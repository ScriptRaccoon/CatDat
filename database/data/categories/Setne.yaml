id: Setne
name: category of non-empty sets
notation: $\Setne$
objects: non-empty sets
morphisms: maps
description: This entry demonstrates that removing an object (the empty set) can drastically change the properties of a category. In particular, this category is neither complete nor cocomplete.
nlab_link: https://ncatlab.org/nlab/show/inhabited+set
keywords:
  - inhabited sets

tags:
  - set theory

related:
  - Set
  - Set_c_inf

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Setne \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: extremal generator
    proof: The one-point set is an extremal generator even in $\Set$ (<a href="/category/Set?proof=extremal_generator">proof</a>). Now use <a href="/content/subcategories#lemma_10">Lemma 10 on subcategories</a>.
    check_redundancy: false

  - property: extremal cogenerator
    proof: The two-point set is an extremal cogenerator even in $\Set$ (<a href="/category/Set?proof=extremal_cogenerator">proof</a>). Now use <a href="/content/subcategories#lemma_10">Lemma 10 on subcategories</a>.

  - property: all epimorphisms split
    proof: Apply <a href="/content/subcategories#lemma_15">Lemma 15 on subcategories</a> to the inclusion $\Setne \hookrightarrow \Set$, which preserves epimorphisms since these are surjective in $\Setne$ (<a href="/category/Setne?proof=epimorphism">proof</a>) and in $\Set$ (<a href="/category/Set?proof=epimorphism">proof</a>), and use that $\Set$ has all epimorphisms split (<a href="/category/Set?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

  - property: all monomorphisms split
    proof: 'Let $i : X \to Y$ be a monomorphism, i.e. an injective map (<a href="/category/Setne?proof=monomorphism">proof</a>). Since $X$ is non-empty, we may choose an element $x_0 \in X$. Then the map $r : Y \to X$ with $r(i(x)) = x$ for $x \in X$ and $r(y) = x_0$ for $y \notin i(X)$ satisfies $r \circ i = \id_X$.'

  - property: products
    proof: Take the product of non-empty sets inside of <a href="/category/Set">$\Set$</a> and observe that it is non-empty by the axiom of choice.
    check_redundancy: false

  - property: cartesian closed
    proof: This is because $\Set$ is cartesian closed (<a href="/category/Set?proof=cartesian_closed" data-allow-deduced>proof</a>) and since for non-empty sets $X,Y$ there is at least one function $X \to Y$.

  - property: kernel pairs
    proof: >-
      This is because $\Set$ has kernel pairs (<a href="/category/Set?proof=kernel_pairs" data-allow-deduced>proof</a>), and for a map $f : X \to Y$ between non-empty sets $X,Y$ the kernel pair $\{(x,x') \in X \times X : f(x) = f(x')\}$ is also non-empty.

  - property: binary coproducts
    proof: The disjoint union of two non-empty sets is non-empty.

  - property: equalizers of cokernel pairs
    proof: 'Let $f : X \to Y$ be a map of non-empty sets. The cokernel pair $i_1,i_2 : Y \rightrightarrows Y \sqcup_X Y$ in <a href="/category/Set">$\Set$</a> is clearly also a cokernel pair in $\Setne$. Moreover, the equalizer of $i_1,i_2$ in $\Set$ is non-empty because it contains the elements of $X$.'

  - property: strongly connected
    proof: Use constant maps.

  - property: finitely accessible
    proof: Since the inclusion $\Setne \hookrightarrow \Set$ is closed under non-empty colimits, it is also closed under filtered colimits. Therefore, non-empty finite sets are still finitely presentable in $\Setne$, and every non-empty set is written as a filtered colimit of them.

  - property: generalized variety
    proof: Since the inclusion $\Setne \hookrightarrow \Set$ is closed under non-empty colimits, it is also closed under sifted colimits. Therefore, non-empty finite sets are still strongly finitely presentable in $\Setne$, and every non-empty set is written as a sifted colimit of them.

  - property: parametrized natural numbers object
    proof: Any parametrized natural numbers object in $\Set$, such as $(\IN,0,n \mapsto n+1)$, is clearly also one in $\Setne$.

  - property: multi-complete
    proof: Let $D$ be a diagram in $\Setne$, and let $L$ be a limit of $D$ in $\Set$. If $L$ is non-empty, it gives a limit in $\Setne$ as well. If $L$ is the empty set, there is no cone over $D$ in $\Setne$; hence the empty set of cones gives a multi-limit of $D$ in $\Setne$.

unsatisfied_properties:
  - property: skeletal
    proof: The sets $\{0\}$ and $\{1\}$ are terminal objects, hence isomorphic, but not equal.

  - property: right collapsible
    proof: The two maps $\{0\} \rightrightarrows \{0,1\}$ are equalized by no map $X \to \{0\}$ in this category.

  - property: sequential limits
    proof: Assume that the sequence of inclusions $\cdots \to \IN_{\geq 2} \to \IN_{\geq 1} \to \IN_{\geq 0} = \IN$ has a limit $X$, consisting of maps $X \to \IN_{\geq n}$. Since $X$ is non-empty, there is a map $\{\ast\} \to X$. This corresponds to a family of compatible maps $\{\ast\} \to \IN_{\geq n}$, i.e. to compatible elements in $\IN_{\geq n}$. But the set $\bigcap_{n \geq 0} \IN_{\geq n}$ is empty.

  - property: ℵ₁-cofiltered limits
    proof: 'Since the forgetful functor $\Setne \to \Set$ is representable, it preserves limits. Thus it suffices to find an $\aleph_1$-cofiltered diagram of non-empty sets whose limit in $\Set$ is empty. Let $R$ be an uncountable set (such as $\IR$) and consider the poset $P$ of subsets $A \subseteq R$ whose complement $R \setminus A$ is countable; in particular, every such $A$ is non-empty. Then $P$ is $\aleph_1$-cofiltered, since a countable union of countable sets is countable. The limit of the diagram $P \to \Setne$, $A \mapsto A$, in $\Set$ is the intersection $\bigcap_{A \in P} A$ in $R$, which is empty, because for every $r \in R$ we have $r \notin R \setminus \{r\} \in P$.'

  - property: coquotients of cocongruences
    proof: The two maps $\{0\} \rightrightarrows \{0,1\}$ form a cocongruence on $\{0\}$ &mdash; namely the cofull cocongruence on $\{0\}$ &mdash; but they do not have an equalizer.

  - property: coaccessible
    proof: >-
      Assume that $\Setne$ is $\kappa$-coaccessible for a regular cardinal $\kappa$. In particular, $\Setne$ has $\kappa$-cofiltered limits. For $\alpha < \kappa$, let $D(\alpha) \coloneqq \{ \beta \mid \alpha \leq \beta < \kappa \}$, which is non-empty. The inclusions $D(\alpha') \subseteq D(\alpha)$ for $\alpha \leq \alpha'$ form a diagram $D : (\kappa,\geq) \to \Setne$, which is $\kappa$-cofiltered since $\kappa$ is regular. It has no limit, since it does not even admit a cone: if $(f_\alpha : Y \to D(\alpha))_{\alpha < \kappa}$ is a cone, then every $f_\alpha$ agrees with $f_0$ as a map to $D(0)$, so that the image of $f_0$ is contained in $\bigcap_{\alpha < \kappa} D(\alpha) = \varnothing$, which is impossible since $Y$ is non-empty.

special_objects:
  terminal object:
    description: singleton set
  products:
    description: direct products

special_morphisms:
  isomorphism:
    description: bijective maps
    proof: It is a full subcategory of $\Set$, for which isomorphisms are bijective maps (<a href="/category/Set?proof=isomorphism" data-allow-deduced>proof</a>).
  monomorphism:
    description: injective maps
    proof: For the non-trivial direction, the forgetful functor to $\Set$ is representable (by the terminal object), hence preserves monomorphisms.
  epimorphism:
    description: surjective maps
    proof: 'For the non-trivial direction, let $f : X \to Y$ be an epimorphism of non-empty sets. Then the inclusion $f(X) \hookrightarrow Y$ is an epimorphism as well, but also a split monomorphism (we can just map everything in $Y \setminus f(X)$ to a fixed element of $f(X)$). As such, it must be an isomorphism.'
