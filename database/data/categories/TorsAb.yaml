id: TorsAb
name: category of torsion abelian groups
notation: $\TorsAb$
objects: torsion abelian groups
morphisms: group homomorphisms
description: This category is a Grothendieck abelian category containing all finite abelian groups.
nlab_link: https://ncatlab.org/nlab/show/torsion+subgroup

tags:
  - algebra

related:
  - Ab
  - FinAb
  - TorsFreeAb

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\TorsAb \to \Ab$, and $\Ab$ is locally small (<a href="/category/Ab?proof=locally_small" data-allow-deduced>proof</a>).

  - property: cocomplete
    proof: The embedding $\TorsAb \hookrightarrow \Ab$ is closed under colimits, and $\Ab$ is cocomplete (<a href="/category/Ab?proof=cocomplete" data-allow-deduced>proof</a>).
    check_redundancy: false

  - property: complete
    proof: The embedding $\TorsAb \hookrightarrow \Ab$ has a right adjoint, sending an abelian group $A$ to its torsion subgroup $T(A)$. Since $\Ab$ is complete (<a href="/category/Ab?proof=complete" data-allow-deduced>proof</a>), $\TorsAb$ is complete as well. The limit of a diagram of torsion abelian groups is the torsion subgroup of the limit of the underlying abelian groups. Notice that the torsion subgroup is not required in the case of equalizers, since a subgroup of a torsion abelian group is already torsion. Also, a <i>finite</i> product of torsion abelian groups is already torsion.
    check_redundancy: false

  - property: preadditive
    proof: It is a full subcategory of the preadditive category $\Ab$.

  - property: normal
    proof: 'If $f : A \to B$ is a monomorphism, it is injective (<a href="/category/TorsAb?proof=monomorphism">proof</a>). In <a href="/category/Ab">$\Ab$</a> it is then the kernel of $B \to B/f(A)$. Since $B/f(A)$ is torsion, it is also the kernel in $\TorsAb$.'

  - property: conormal
    proof: 'If $f : A \to B$ is an epimorphism, it is surjective (<a href="/category/TorsAb?proof=epimorphism">proof</a>). In <a href="/category/Ab">$\Ab$</a> it is then the cokernel of its kernel $K \hookrightarrow A$. Since $K$ is torsion, it is also the cokernel in $\TorsAb$.'

  - property: finitely accessible
    proof: We already know that (filtered) colimits exist and are preserved by the forgetful functor to $\Ab$ (<a href="/category/TorsAb?proof=cocomplete">proof</a>). Every torsion abelian group is the filtered colimit of its finitely generated subgroups (which are finite). These are finitely presentable in $\Ab$, hence also in $\TorsAb$.

unsatisfied_properties:
  - property: skeletal
    proof: The trivial groups with underlying sets $\{0\}$ and $\{1\}$ are zero objects, hence isomorphic, but not equal.

  - property: all epimorphisms split
    proof: Apply the contrapositive of Lemma 15 <a href="/content/subcategories">here</a> to the inclusion $\FinAb \hookrightarrow \TorsAb$, which preserves epimorphisms since these are surjective in $\FinAb$ (<a href="/category/FinAb?proof=epimorphism">proof</a>) and in $\TorsAb$ (<a href="/category/TorsAb?proof=epimorphism">proof</a>), and use that $\FinAb$ does not have all epimorphisms split (<a href="/category/FinAb?proof=all_epimorphisms_split" data-allow-deduced>proof</a>).

  - property: finitary algebraic
    proof: >-
      Assume that it is the category of models of a many-sorted finitary algebraic theory. For each sort $s$ let $F_s$ be the free algebra on one generator of sort $s$. One of them must be non-trivial, since otherwise the category would be thin. So assume $F_s \neq 0$. It is finitely presentable, hence a finite abelian group, and regular projective. Any direct summand will have the same properties. So we find that some $\IZ/p^k$ (with $k \geq 1$ and $p$ prime) is regular projective. However, the exact sequence in $\TorsAb$
      $$0 \to \IZ/p \to \IZ/p^{k+1} \to \IZ/p^k \to 0$$
      does not split.

special_objects:
  initial object:
    description: trivial group
  terminal object:
    description: trivial group
  coproducts:
    description: direct sums
  products:
    description: torsion subgroup of the direct product

special_morphisms:
  isomorphism:
    description: bijective group homomorphisms
    proof: It is a full subcategory of $\Ab$, for which isomorphisms are bijective homomorphisms (<a href="/category/Ab?proof=isomorphism" data-allow-deduced>proof</a>).
  monomorphism:
    description: injective group homomorphisms
    proof: 'For the non-trivial direction, assume $f : A \to B$ is a monomorphism and $a \in A$ satisfies $f(a)=0$. Choose $n \geq 1$ with $n a = 0$. Then $a$ corresponds to a homomorphism of torsion abelian groups $\tilde{a} : \IZ/n \to A$ satisfying $f \circ \tilde{a} = 0$. Hence, $\tilde{a} = 0$, which means $a = 0$.'
  epimorphism:
    description: surjective homomorphisms
    proof: Clearly, surjective homomorphisms are epimorphisms. The converse follows since the forgetful functor $\TorsAb \to \Ab$ has a right adjoint, hence preserves epimorphisms.
