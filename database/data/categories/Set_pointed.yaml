id: Set_*
name: category of pointed sets
notation: $\Set_*$
objects: pointed sets
morphisms: pointed maps
description: This is the category of sets with a distinguished element, often called the base point. A map is called pointed when it preserves the base point.
nlab_link: https://ncatlab.org/nlab/show/pointed+set

tags:
  - set theory

related:
  - Set
  - Top_*
  - Setne

satisfied_properties:
  - property: locally small
    proof: There is a forgetful functor $\Set_* \to \Set$, and $\Set$ is locally small (<a href="/category/Set?proof=locally_small" data-allow-deduced>proof</a>).

  - property: pointed
    proof: The singleton set is a zero object.
    check_redundancy: false

  - property: one-sorted finitary algebraic
    proof: Take the one-sorted algebraic theory with just one constant.

  - property: all epimorphisms split
    proof: 'Let $p : X \to Y$ be an epimorphism, i.e. a surjective pointed map (<a href="/category/Set_*?proof=epimorphism">proof</a>). Choose a section $s : Y \to X$ of the underlying map with $s(\ast_Y) = \ast_X$, which is possible since $p(\ast_X) = \ast_Y$. Then $s$ is a pointed map.'

  - property: all monomorphisms split
    proof: 'Let $i : X \to Y$ be a monomorphism, i.e. an injective pointed map (<a href="/category/Set_*?proof=monomorphism" data-allow-deduced>proof</a>). Then the map $r : Y \to X$ with $r(i(x)) = x$ for $x \in X$ and $r(y) = \ast_X$ for $y \notin i(X)$ is pointed and satisfies $r \circ i = \id_X$.'

  - property: subobject classifier
    proof: The pointed set $(\{0,1\},1)$ is a subobject classifier.

  - property: cogenerator
    proof: The pointed set $(\{0,1\},1)$ is a cogenerator.

  - property: co-Malcev
    proof: Malcev categories are closed under slice categories by <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Prop. 2.2.14. It follows that co-Malcev categories are closed under coslice categories, and $\Set_*$ is a coslice category of $\Set$, which is co-Malcev (<a href="/category/Set?proof=co-Malcev" data-allow-deduced>proof</a>).

  - property: cocartesian cofiltered limits
    proof: >-
      Let $X$ be a pointed set and $(Y_i)$ be a cofiltered diagram of pointed sets. Base points will be denoted by $0$. The canonical map $X \vee \lim_i Y_i \to \lim_i (X \vee Y_i)$ is injective since the wedge sum naturally embeds into the product and the natural map $X \vee \prod_i Y_i \to \prod_i (X \times Y_i)$ is injective. Now let $z = (z_i) \in \lim_i (X \vee Y_i)$.

      <strong>Case 1:</strong> There is some index $i$ with $z_i \in X \setminus \{0\}$. We claim $z_j \in X$ for any index $j$ and $z_j = z_i$ in $X$, so that $z$ has a preimage in $X$. To see this, choose an index $k \leq i,j$. The map $X \vee Y_k \to X \vee Y_i$ maps $z_k \mapsto z_i$, is the identity on $X$, and maps $Y_k$ into $Y_i$. Hence, $z_k \notin Y_k$, since otherwise $z_i \in Y_i \cap X = \{0\}$. Thus, $z_k \in X \setminus \{0\}$ and $z_k = z_i$. Since $X \vee Y_k \to X \vee Y_j$ maps $z_k \mapsto z_j$ and is the identity on $X$, we conclude that $z_j \in X$ and $z_j = z_k = z_i$.

      <strong>Case 2:</strong> We have $z_i \in Y_i$ for all $i$. Then clearly $(z_i) \in \lim_i Y_i$ is a preimage.

  - property: CIP
    proof: The coproduct (wedge sum) of a family of pointed sets $(X_i)_{i \in I}$ can be realized as the subset of $\prod_{i \in I} X_i$ consisting of those tuples $x$ such that $x_i = 0$ for all but (at most) one index.

  - property: Barr-coexact
    proof: We have that $\Set_*^{\op}$ is a slice category of $\Set^{\op}$, which in turn is monadic over $\Set$. Therefore, by combining results from <a href="http://www.springer.com/us/book/9781402019616">Borceux–Bourn</a>, Appendix A, and the <a href="https://ncatlab.org/nlab/show/colimits+in+categories+of+algebras#exact">nLab</a>, $\Set_*^{\op}$ is Barr-exact.

unsatisfied_properties:
  - property: skeletal
    proof: The pointed sets $(\{0\},0)$ and $(\{1\},1)$ are zero objects, hence isomorphic, but not equal.

  - property: binary CSP
    proof: 'Let $X,Y$ be non-trivial pointed sets with base points denoted by $0$. The image of the canonical map $X \vee Y \to X \times Y$ is $\{(x,0) : x \in X\} \cup \{(0,y) : y \in Y\}$, which does not contain $(x,y)$ for $x \neq 0$ and $y \neq 0$. Hence, the map is not surjective, and therefore not an epimorphism (<a href="/category/Set_*?proof=epimorphism">proof</a>).'

  - property: conormal
    proof: 'Every cokernel is "injective away from the base point". Formally, if $p : A \to B$ is a cokernel in $\Set_*$, it has the property that $p(x)=p(y) \neq 0$ implies $x=y$ (where $0$ denotes the base point). Clearly this is not satisfied for every surjective pointed map; consider $(\IN,0) \to (\{0,1\},0)$ defined by $0 \mapsto 0$ and $x \mapsto 1$ for $x > 0$.'

  - property: cofiltered-limit-stable epimorphisms
    proof: We already know that $\Set$ does not have this property (<a href="/category/Set?proof=cofiltered-limit-stable_epimorphisms" data-allow-deduced>proof</a>). Now apply the contrapositive of the dual of Lemma 2 <a href="/content/subcategories">here</a> to the functor $\Set \to \Set_*$ that freely adds a base point.

special_objects:
  initial object:
    description: singleton pointed set
  terminal object:
    description: singleton pointed set
  coproducts:
    description: wedge sum, aka one-point union
  products:
    description: direct products

special_morphisms:
  epimorphism:
    description: surjective morphisms
    proof: 'If $f : X \to Y$ is an epimorphism of pointed sets, then the inclusion $i : f(X) \hookrightarrow Y$ is an epimorphism as well. But it is also a split monomorphism (we may map everything in $Y \setminus f(X)$ to the base point of $f(X)$, and do not touch the rest), hence an isomorphism.'
