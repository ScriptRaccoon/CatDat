id: LRS_R
name: category of locally ringed spaces
notation: $\LRS_R$
objects: locally ringed spaces over $R \neq 0$, i.e. pairs $(X,\O_X)$ consisting of a topological space and a sheaf of commutative $R$-algebras on it whose stalks are local rings
morphisms: 'A morphism $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ consists of a continuous map $f : X \to Y$ and a homomorphism $f^\sharp : \O_Y \to f_* \O_X$ of sheaves of $R$-algebras such that for every $x \in X$ the induced map on stalks $f_x : \O_{Y,f(x)} \to \O_{X,x}$ is local.'
description: Here, $R$ is a fixed non-trivial commutative ring. The general properties of this category will not depend on the choice of $R$. For $R = \IZ$ we obtain the category $\LRS$ of locally ringed spaces.
nlab_link: https://ncatlab.org/nlab/show/locally+ringed+topological+space

tags:
  - algebraic geometry

related:
  - Sch_R
  - Top
  - CAlg(R)

comments:
  - Monomorphisms $X \to Y$ can be formally described by the condition that the diagonal morphism $X \to X \times_Y X$ is an isomorphism. Since the fiber product of locally ringed spaces has a concrete description (<a href="https://math.stackexchange.com/questions/1033675">MSE/1033675</a>), we thus have a description of the monomorphisms, albeit a very complicated one. At least, we can say that every monomorphism is injective.

satisfied_properties:
  - property: locally small
    proof: For two ringed spaces $(X,\O_X), (Y,\O_Y)$, the collection of morphisms $X \to Y$ of ringed spaces is the collection $\coprod_{f \in \Hom(X,Y)} \Hom(\O_Y,f_* \O_X)$, which is a set since $\Hom(X,Y)$ is a set and each $\Hom(\O_Y,f_* \O_X)$ is a set.

  - property: complete
    proof: See <a href="https://arxiv.org/abs/1103.2139">Gillam</a>. See also <a href="https://math.stackexchange.com/questions/1033675">MSE/1033675</a>.

  - property: cocomplete
    proof: See Demazure-Gabriel's "Groupes algébriques", I. §1. 1.6. Specifically, the forgetful functor from locally ringed spaces to ringed spaces preserves colimits, and colimits of ringed spaces are built from colimits of topological spaces and limits of commutative rings, see <a href="https://math.stackexchange.com/questions/1646202">MSE/1646202</a>.

  - property: well-copowered
    proof: This follows from the characterization of epimorphisms below.

  - property: concretizable
    proof: >-
      Consider the functor $F : \LRS_R \to \Set \times \Set^{\op}$ defined on objects by
      $$\textstyle F(X,\O_X) \coloneqq \bigl(|X|,\coprod_{U \subseteq X} |\O_X(U)|\bigr),$$
      where $U$ runs through the open subsets of $X$ and $|{-}|$ denotes the underlying set of a topological space or ring, respectively. If $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ is a morphism of locally ringed spaces, then we get a map of sets $|f| : |X| \to |Y|$, and the ring homomorphisms $f^\sharp(V) : \O_Y(V) \to \O_X(f^*(V))$ for opens $V \subseteq Y$ induce a map of sets
      $$\textstyle \alpha : \coprod_{V \subseteq Y} \O_Y(V) \to \coprod_{U \subseteq X} \O_X(U)$$
      defined by $\alpha \circ \iota_V = \iota_{f^*(V)} \circ f^\sharp(V)$. We let $F(f,f^\sharp) \coloneqq (|f|,\alpha)$. It is easy to verify that $F$ is a functor.

      To show that $F$ is faithful, assume that $(f,f^\sharp)$ and $(g,g^\sharp)$ are two morphisms with the same image under $F$. Then $|f| = |g|$, hence $f = g$. Also, we have
      $$\iota_{f^*(V)} \circ f^\sharp(V) = \iota_{g^*(V)} \circ g^\sharp(V)$$
      for every open subset $V \subseteq Y$. Since $\iota_{f^*(V)} = \iota_{g^*(V)}$ is a monomorphism of sets, we conclude that $f^\sharp(V) = g^\sharp(V)$. Thus, $f^\sharp = g^\sharp$. We have shown $(f,f^\sharp) = (g,g^\sharp)$, as required.

      Since <a href="/category/Set_op">$\Set^{\op}$</a> is concretizable (say, via the contravariant power set functor), and <a href="/category/SetxSet">$\Set \times \Set$</a> is also concretizable (because it is locally small and has a generating collection), it follows that $\LRS_R$ is concretizable.

  - property: infinitary extensive
    proof: >-
      The proof works for both ringed and locally ringed spaces and relies on the fact that <a href="/category/Top">$\Top$</a> is infinitary extensive.

      First, recall some basic facts about open embeddings (often called open immersions in the context of schemes). If $(X,\O_X)$ is a locally ringed space and $U \subseteq X$ is an open subset, then, letting $\O_U \coloneqq (\O_X)|_U$, the pair $(U,\O_U)$ is again a locally ringed space. There is an inclusion morphism $(i,i^\sharp) : (U,\O_U) \to (X,\O_X)$, where $i$ is the inclusion map and $i^\sharp : \O_X \to i_* \O_U$ is defined via restriction maps. This is a monomorphism, and a morphism into $(X,\O_X)$ factors through it if and only if the image of its underlying map is contained in $U$. We will refer to any monomorphism isomorphic to one of this form as an open embedding.

      Pullbacks along open embeddings exist and are themselves open embeddings. Indeed, if $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ is a morphism of locally ringed spaces and $V \subseteq Y$ is an open subset, then $f^*(V) \subseteq X$ is an open subset, and $(f^*(V),\O_{f^*(V)}) \hookrightarrow (X,\O_X)$ is the pullback of $(f,f^\sharp)$ along $(V,\O_V) \hookrightarrow (Y,\O_Y)$.

      Since $\LRS_R$ is cocomplete, coproducts exist. Concretely, the coproduct of a family of locally ringed spaces $(X_i,\O_{X_i})$ is the locally ringed space $(X,\O_X)$, where $X \coloneqq \coprod_i X_i$ and $\O_X(U) \coloneqq \prod_i \O_{X_i}(U \cap X_i)$. Notice that the coproduct inclusions are open embeddings. Hence, pullbacks along coproduct inclusions exist.

      That coproducts are disjoint in $\LRS_R$ follows from the corresponding property of $\Top$ together with the following observations. By the descriptions above, the forgetful functor $\LRS_R \to \Top$ preserves coproducts and pullbacks along open embeddings (although it does not preserve pullbacks in general), and the empty topological space admits a unique structure sheaf, up to isomorphism, making it into a locally ringed space.

      It remains to prove that coproducts are stable under pullbacks. To this end, let $(f,f^\sharp) : (T,\O_T) \to \coprod_i (X_i,\O_{X_i})$ be a morphism. Then $T_i \coloneqq f^*(X_i) \subseteq T$ is an open subset, and for $i \neq j$ we have $T_i \cap T_j = \varnothing$ because $X_i \cap X_j = \varnothing$ in the coproduct. We must show that the canonical morphism $(g,g^\sharp) : \coprod_i (T_i,\O_{T_i}) \to (T,\O_T)$ is an isomorphism. The underlying continuous map $g$ is a homeomorphism because coproducts in $\Top$ are stable under pullbacks. It therefore remains to show that $g^\sharp : \O_T \to g_* \O$, where $\O$ denotes the structure sheaf of the coproduct, is an isomorphism. Equivalently, for every open subset $U \subseteq T$, we must show that the canonical ring homomorphism
      $$\textstyle \O_T(U) \to \prod_{i \in I} \O_{T_i}(U \cap T_i) = \prod_{i \in I} \O_T(U \cap T_i)$$
      is an isomorphism. This is precisely the sheaf axiom applied to the open cover of $U$ by the pairwise disjoint open subsets $U \cap T_i$.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: Choose a residue field $K$ of $R$. The canonical morphism $$\Spec(K[X]/X \times K[X,X^{-1}]) \longrightarrow \Spec(K[X])$$ is a mono- and an epimorphism, but no isomorphism.

  - property: semi-strongly connected
    proof: This is because already the full subcategory <a href="/category/Sch_R">$\Sch_R$</a> of $R$-schemes is not semi-strongly connected.

  - property: Malcev
    proof: This is because already the full subcategory <a href="/category/Sch_R">$\Sch_R$</a> of $R$-schemes is not Malcev.

  - property: co-Malcev
    proof: 'We can adjust the proof for <a href="/category/Top">$\Top$</a> (see <a href="https://mathoverflow.net/questions/509548">MO/509548</a>) as follows: Let $K$ be a residue field of $R$, let $X$ be a singleton and $C = \{u,v\}$ be the Sierpiński space where $\{u\}$ is open, but $\{v\}$ is not. Endow both with the sheaf of locally constant functions to $K$. Thus, $\O_X(X) = K$, $\O_C(C) = \O_C(\{u\}) = K$. Let $j_1, j_2 : X \rightrightarrows C$ be the two canonical morphisms with images $u$ and $v$, respectively. They form a coreflexive corelation that is not cosymmetric.'
    references:
      - Top_not_co-malcev

  - property: total
    proof: 'The adjunction between the global sections functor and the $\Spec$ functor (<a href="https://en.wikipedia.org/wiki/%C3%89l%C3%A9ments_de_g%C3%A9om%C3%A9trie_alg%C3%A9brique">Grothendieck–Dieudonné</a>, EGA I (1971), Ch. 1, Prop. 1.6.3) makes $\CAlg(R)^{\op}$ into a reflective subcategory of $\LRS_R$. Therefore, if $\LRS_R$ were total, then <a href="/category/CAlg(R)">$\CAlg(R)$</a> would be cototal by <a href="https://www.numdam.org/item/?id=CTGDC_1986__27_2_109_0">Kelly</a>, Cor. 6.2, which we know is not the case.'

  - property: cartesian closed
    proof: This is Corollary 4(a) <a href="/content/Top-embeds-in-LRS">here</a>.
    check_redundancy: false

  - property: cartesian filtered colimits
    proof: This is Corollary 4(b) <a href="/content/Top-embeds-in-LRS">here</a>.

  - property: effective cocongruences
    proof: This is Corollary 4(e) <a href="/content/Top-embeds-in-LRS">here</a>.

  - property: pushout-stable regular monomorphisms
    proof: >-
      Choose a maximal ideal $\m$ of $R$ and let $K \coloneqq R/\m$. We first reduce the claim to $\LRS_K$, which is the full subcategory of $\LRS_R$ consisting of those $X$ with $\m \O_X = 0$. Equivalently, $X$ admits a morphism $X \to \Spec(K)$ in $\LRS_R$, which is then unique. It follows that $\LRS_K$ is closed under pushouts in $\LRS_R$, and that every $T$ with a morphism $T \to X \in \LRS_K$ lies in $\LRS_K$. Hence, pushouts and equalizers in $\LRS_K$ are the same as in $\LRS_R$, and therefore also regular monomorphisms, since these are the equalizers of their cokernel pairs (by the dual of <a href="/content/regular-epis-kernel-pairs">this lemma</a>). So if $\LRS_R$ had pushout-stable regular monomorphisms, then so would $\LRS_K$.

      So it suffices to construct, for every field $K$, a counterexample in $\LRS_K$. In fact, we will find a regular monomorphism $i : X \to Y$ which is the identity on underlying spaces, and a morphism $f : X \to Z$ to a one-point space such that $Z \to Y \sqcup_X Z$ is not a regular monomorphism. The idea is that $\O_Y$ has an infinitesimal direction over two open subsets which cannot be glued to a global section, whereas $\O_X$ has a global section in this direction. Collapsing the space to a point only keeps the global sections, so this direction gets lost.

      Let $K[\varepsilon]$ be the commutative algebra of dual numbers, where $\varepsilon^2 = 0$, and let $L \coloneqq K[\varepsilon_1,\varepsilon_2]$ be the commutative algebra where $\varepsilon_1^2 = \varepsilon_1 \varepsilon_2 = \varepsilon_2^2 = 0$, so that $1,\varepsilon_1,\varepsilon_2$ is a basis of $L$ over $K$.

      Let $S \coloneqq \{x,y_1,y_2\}$ be the space whose open subsets are
      $$\varnothing, \quad \{x\}, \quad U_1 \coloneqq \{x,y_1\}, \quad U_2 \coloneqq \{x,y_2\}, \quad S.$$
      Since $\{x\}$, $U_1$, $U_2$ are the smallest open neighborhoods of $x$, $y_1$, $y_2$, respectively, the stalks of a sheaf $F$ of $K$-algebras on $S$ are $F_x = F(\{x\})$, $F_{y_1} = F(U_1)$, $F_{y_2} = F(U_2)$. Every open cover of a non-empty open subset $U \subseteq S$ contains $U$ itself, unless $U = S$ and the cover contains $U_1$ and $U_2$. Hence, besides $F(\varnothing) = 0$, which is forced by the empty cover of $\varnothing$, the sheaf condition only needs to be checked for the cover $S = U_1 \cup U_2$ with $U_1 \cap U_2 = \{x\}$. It follows that a sheaf $F$ of $K$-algebras on $S$ is determined by the cospan of restriction maps
      $$F(U_1) \xrightarrow{\rho_1} F(\{x\}) \xleftarrow{\rho_2} F(U_2)$$
      via $F(S) = F(U_1) \times_{F(\{x\})} F(U_2)$, and that a morphism of such sheaves is the same as a family of homomorphisms on $U_1$, $U_2$, $\{x\}$ that is compatible with the restriction maps.

      Let $X \coloneqq (S,\O_X)$ and $Y \coloneqq (S,\O_Y)$, where $\O_X$ and $\O_Y$ are the sheaves given by the cospans
      $$K[\varepsilon] \xrightarrow{\id} K[\varepsilon] \xleftarrow{\id} K[\varepsilon], \qquad K[\varepsilon] \xrightarrow{\rho_1} L \xleftarrow{\rho_2} K[\varepsilon],$$
      respectively, with $\rho_1(\varepsilon) \coloneqq \varepsilon_1$ and $\rho_2(\varepsilon) \coloneqq \varepsilon_2$. Both are locally ringed spaces since their stalks $K[\varepsilon]$ and $L$ are local rings. We have $\O_X(S) = K[\varepsilon]$. A pair $(\lambda_1 + \mu_1 \varepsilon, \lambda_2 + \mu_2 \varepsilon) \in K[\varepsilon]^2$ lies in $\O_Y(S) = K[\varepsilon] \times_L K[\varepsilon]$ iff
      $$\lambda_1 + \mu_1 \varepsilon_1 = \lambda_2 + \mu_2 \varepsilon_2 \quad \text{in } L,$$
      i.e. iff $\lambda_1 = \lambda_2$ and $\mu_1 = \mu_2 = 0$. Hence, $\O_Y(S) \cong K$ consists only of the constants: unlike in $\O_X$, the sections $\varepsilon$ over $U_1$ and $U_2$ do not glue.

      Define the morphism $i \coloneqq (\id_S,\pi) : X \to Y$, where $\pi : \O_Y \to \O_X$ is the identity on $U_1$ and $U_2$, and on $\{x\}$ it is the homomorphism
      $$\pi_x : L \to K[\varepsilon], \quad \pi_x(\varepsilon_1) \coloneqq \pi_x(\varepsilon_2) \coloneqq \varepsilon.$$
      This is compatible with the restriction maps since $\pi_x \circ \rho_1 = \pi_x \circ \rho_2 = \id$. On global sections, $\pi$ is the inclusion $K \hookrightarrow K[\varepsilon]$. The stalk maps of $i$ are surjective homomorphisms of local rings, hence local. Since $i$ is the identity on underlying spaces and its stalk maps are surjective, $i$ is a regular monomorphism by the classification of regular monomorphisms (see below).

      Let $Z \coloneqq \Spec(K[\varepsilon])$, and let $f : X \to Z$ be the morphism corresponding to the identity $K[\varepsilon] \to \O_X(S) = K[\varepsilon]$. Recall from the proof of cocompleteness that pushouts in $\LRS_K$ are computed as in ringed spaces: the underlying space is the pushout of the underlying spaces, and the structure sheaf is the fiber product of the push-forwards of the structure sheaves. Hence, the underlying space of $P \coloneqq Y \sqcup_X Z$ is the pushout of $\id_S$ and $S \to Z$, which is a point, and its algebra of global sections is
      $$\O_Y(S) \times_{\O_X(S)} \O_Z(Z) = K \times_{K[\varepsilon]} K[\varepsilon] \cong K.$$
      So $P \cong \Spec(K)$, and the stalk map of the morphism $j : Z \to P$ is the inclusion $K \hookrightarrow K[\varepsilon]$. Since it is not surjective, $j$ is not a regular monomorphism by the classification of regular monomorphisms.

special_objects:
  initial object:
    description: empty space
  terminal object:
    description: $\Spec(R)$
  coproducts:
    description: disjoint union with the product sheaf
  products:
    description: See <a href="https://arxiv.org/abs/1103.2139">Gillam</a>. See also <a href="https://math.stackexchange.com/questions/1033675">MSE/1033675</a>.

special_morphisms:
  isomorphisms:
    description: 'A morphism $(f,f^\sharp) : (X, \O_X) \to (Y,\O_Y)$ is an isomorphism iff $f : X \to Y$ is a homeomorphism and $f^\sharp : \O_Y \to f_* \O_X$ is an isomorphism of sheaves.'
    proof: This is easy.
  epimorphisms:
    description: 'A morphism $(f,f^\sharp) : (X, \O_X) \to (Y,\O_Y)$ is an epimorphism iff $f : X \to Y$ is surjective and $f^\sharp : \O_Y \to f_* \O_X$ is a monomorphism of sheaves.'
    proof: >-
      It is obvious that morphisms with this property are epimorphisms. For the opposite, assume that $(f,f^\sharp) : (X, \O_X) \to (Y,\O_Y)$ is an epimorphism. Then the codiagonal
      $$(Y,\O_Y) \sqcup_{(X,\O_X)} (Y,\O_Y) \to (Y,\O_Y)$$
      is an isomorphism. By construction of the pushout, the underlying space of the pushout is $Y \sqcup_X Y$. Hence, $f$ is an epimorphism in $\Top$, i.e. it is surjective. For open subsets $V \subseteq Y$ the preimage in the pushout is $V \sqcup_{f^{-1}(V)} V$, and its ring of sections is the pullback $\O_Y(V) \times_{\O_X(f^{-1}(V))} \O_Y(V)$. Since the diagonal
      $$\O_Y(V) \to \O_Y(V) \times_{\O_X(f^{-1}(V))} \O_Y(V)$$
      is an isomorphism, the map $f^\sharp(V) : \O_Y(V) \to \O_X(f^{-1}(V))$ is a monomorphism. Hence, $f^\sharp$ is a monomorphism of sheaves.
  regular monomorphisms:
    description: 'A morphism $i : Z \to Y$ is a regular monomorphism iff its underlying continuous map is an embedding and its stalk maps $\O_{Y,i(z)} \to \O_{Z,z}$ are surjective for all $z \in Z$.'
    proof: >-
      For a morphism $\varphi : T \to Y$ and $t \in T$, we write $\varphi_t : \O_{Y,\varphi(t)} \to \O_{T,t}$ for the stalk map, so that the germ of $\varphi^\sharp(b)$ at $t$ is $\varphi_t(b_{\varphi(t)})$ for every local section $b$ of $\O_Y$. We will use the following simple fact twice: if $\alpha : A \to B$ is a surjective homomorphism of local rings and $\beta : B \to C$ is a homomorphism into a local ring such that $\beta \circ \alpha$ is local, then $\beta$ is local, since every non-unit of $B$ is the image of a non-unit of $A$.

      We first observe that every morphism $\varphi : T \to Y$ factors as $\varphi = j \circ e$, where $e$ is an epimorphism and $j$ is a morphism whose underlying continuous map is an embedding and whose stalk maps are surjective. Let $Y' \coloneqq \varphi(T) \subseteq Y$ carry the subspace topology, let $\iota : Y' \hookrightarrow Y$ be the inclusion, and let $\varphi' : T \to Y'$ be the continuous surjection with $\varphi = \iota \circ \varphi'$. The sheaf map $\varphi^\sharp : \O_Y \to \varphi_* \O_T = \iota_* \varphi'_* \O_T$ corresponds to a morphism of sheaves $\iota^{-1} \O_Y \to \varphi'_* \O_T$ on $Y'$, and we let $\O_{Y'} \subseteq \varphi'_* \O_T$ be its image. For $t \in T$ and $y \coloneqq \varphi(t)$, the stalk $\O_{Y',y}$ is the image of $\O_{Y,y}$ in $(\varphi'_* \O_T)_y$. It is a quotient of the local ring $\O_{Y,y}$, and it is non-zero since $\varphi_t$ factors through it and $\O_{T,t} \neq 0$. Hence, $\O_{Y',y}$ is local, and $(Y',\O_{Y'})$ is a locally ringed space. We obtain a factorization $\varphi = j \circ e$ with the morphisms
      $$j \coloneqq (\iota, \O_Y \to \iota_* \iota^{-1} \O_Y \to \iota_* \O_{Y'}) : Y' \to Y,$$
      $$e \coloneqq (\varphi', \O_{Y'} \hookrightarrow \varphi'_* \O_T) : T \to Y'.$$
      Here, the stalk maps $j_y : \O_{Y,y} \to \O_{Y',y}$ are surjective, hence local, and since $e_t \circ j_y = \varphi_t$ is local, $e_t$ is local by the simple fact above. The underlying map of $e$ is surjective and its sheaf map is a monomorphism, so $e$ is an epimorphism by the classification of epimorphisms (see above).

      Now let $i : Z \to Y$ be a regular monomorphism, and let $i = j \circ e$ be the factorization from above. Since $i$ is an extremal monomorphism and $e$ is an epimorphism, $e$ is an isomorphism. Hence, the underlying map of $i$ is an embedding, and its stalk maps $i_z = e_z \circ j_{i(z)}$ are surjective.

      For the converse direction, we first prove a factorization criterion. Let $i : Z \to Y$ be a morphism whose underlying map is an embedding and whose stalk maps $i_z : \O_{Y,i(z)} \to \O_{Z,z}$ are surjective. Let $\varphi : T \to Y$ be a morphism with $\varphi(T) \subseteq i(Z)$ such that $\varphi_t$ vanishes on $\ker(i_z)$ whenever $\varphi(t) = i(z)$. We claim that $\varphi$ factors uniquely through $i$. We may assume that $Z \subseteq Y$ is a subspace and that $i$ is the inclusion map. Then $\varphi = i \circ \varphi'$ for a unique continuous map $\varphi' : T \to Z$. Let $U \subseteq Z$ be open and $a \in \O_Z(U)$. Since the stalk maps of $i$ are surjective, every $z \in U$ has an open neighborhood $V \subseteq Y$ with $Z \cap V \subseteq U$ and a section $b \in \O_Y(V)$ such that $i^\sharp(b) = a$ on $Z \cap V$: first choose $b$ with the correct germ at $z$, then shrink $V$, using that $Z$ carries the subspace topology. We call such a section $b$ a local lift of $a$. If $b \in \O_Y(V)$ and $b' \in \O_Y(V')$ are local lifts of $a$, then for every $t \in \varphi^*(V \cap V')$ with $z \coloneqq \varphi(t)$ we have $b_z - b'_z \in \ker(i_z)$, hence $\varphi_t(b_z) = \varphi_t(b'_z)$. This means that $\varphi^\sharp(b)$ and $\varphi^\sharp(b')$ agree on $\varphi^*(V \cap V')$. Since the sets $\varphi^*(V) = (\varphi')^*(Z \cap V)$ for local lifts $b \in \O_Y(V)$ of $a$ cover $(\varphi')^*(U)$, the sections $\varphi^\sharp(b)$ glue to a section $\psi(a) \in \O_T((\varphi')^*(U))$. Since sums and products of local lifts are local lifts, this defines a morphism of sheaves $\psi : \O_Z \to \varphi'_* \O_T$. It satisfies $\psi(i^\sharp(b)) = \varphi^\sharp(b)$ for every local section $b$ of $\O_Y$, which means $i \circ (\varphi',\psi) = \varphi$. Its stalk maps satisfy $\psi_t \circ i_{\varphi'(t)} = \varphi_t$, so they are local by the simple fact above. Finally, if $\psi' : \O_Z \to \varphi'_* \O_T$ is another morphism with $i \circ (\varphi',\psi') = \varphi$, then $\psi'(a)$ restricts to $\psi'(i^\sharp(b)) = \varphi^\sharp(b)$ on $\varphi^*(V)$ for every local lift $b \in \O_Y(V)$ of $a$, so $\psi' = \psi$. This proves the claim.

      Finally, let $i : Z \to Y$ be a morphism whose underlying map is an embedding and whose stalk maps are surjective. We show that $i$ is the equalizer of its cokernel pair. We may assume that $Z \subseteq Y$ is a subspace and that $i$ is the inclusion map. Recall from the proof of cocompleteness that pushouts in $\LRS_R$ are computed as in ringed spaces: the underlying space is the pushout of the underlying spaces, and the structure sheaf is the fiber product of the push-forwards of the structure sheaves. Hence, the cokernel pair $u_1,u_2 : Y \rightrightarrows W$ of $i$ looks as follows. The underlying space of $W$ consists of two copies of $Y$ glued along $Z$, and $u_1,u_2$ are the two inclusions. The open subsets of $W$ correspond to pairs $(V_1,V_2)$ of open subsets of $Y$ with $Z \cap V_1 = Z \cap V_2$, and
      $$\O_W(V_1,V_2) = \O_Y(V_1) \times_{\O_Z(Z \cap V_1)} \O_Y(V_2),$$
      where the sheaf maps of $u_1,u_2$ are the two projections.

      Clearly, $u_1 \circ i = u_2 \circ i$. Now let $\varphi : T \to Y$ be a morphism with $u_1 \circ \varphi = u_2 \circ \varphi$. Since the forgetful functor $\Top \to \Set$ is a left adjoint, it preserves pushouts. Hence, the underlying set of $W$ is the quotient of $Y \sqcup Y$ that identifies the two copies of each $z \in Z$ and nothing else (this is already an equivalence relation). So $u_1(y) = u_2(y)$ only holds for $y \in Z$, and we get $\varphi(T) \subseteq Z$. Let $t \in T$, let $z \coloneqq \varphi(t)$, and let $a \in \ker(i_z)$. After shrinking, $a$ is the germ of a section $s \in \O_Y(V)$ over an open neighborhood $V$ of $z$ such that $i^\sharp(s) = 0$ in $\O_Z(Z \cap V)$. Thus, $(s,0)$ is a section of $\O_W$ over $(V,V)$. Since $u_1 \circ \varphi$ and $u_2 \circ \varphi$ have the same sheaf map, the two composites
      $$\O_W(V,V) \rightrightarrows \O_Y(V) \xrightarrow{\varphi^\sharp} \O_T(\varphi^*(V))$$
      agree, so that $\varphi^\sharp(s) = \varphi^\sharp(0) = 0$. Taking germs at $t$, we get $\varphi_t(a) = \varphi_t(s_z) = \varphi^\sharp(s)_t = 0$. By the factorization criterion, $\varphi$ factors uniquely through $i$.
