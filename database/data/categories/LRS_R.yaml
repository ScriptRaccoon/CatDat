id: LRS_R
name: category of locally ringed spaces
notation: $\LRS_R$
objects: locally ringed spaces over $R \neq 0$, i.e. pairs $(X,\O_X)$ consisting of a topological space and a sheaf of commutative $R$-algebras on it whose stalks are local rings
morphisms: 'A morphism $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ consists of a continuous map $f : X \to Y$ and a homomorphism $f^\sharp : \O_Y \to f_* \O_X$ of sheaves of $R$-algebras such that for every $x \in X$ the induced map on stalks $f^\sharp_x : \O_{Y,f(x)} \to \O_{X,x}$ is local.'
description: Here, $R$ is a fixed non-trivial commutative ring. The general properties of this category will not depend on the choice of $R$. For $R = \IZ$ we obtain the category $\LRS$ of locally ringed spaces.
nlab_link: https://ncatlab.org/nlab/show/locally+ringed+topological+space

tags:
  - algebraic geometry

related:
  - Sch_R
  - Top
  - CAlg(R)

satisfied_properties:
  - property: locally small
    proof: For two ringed spaces $(X,\O_X), (Y,\O_Y)$, the collection of morphisms $X \to Y$ of ringed spaces is the collection $\coprod_{f \in \Hom(X,Y)} \Hom(\O_Y,f_* \O_X)$, which is a set since $\Hom(X,Y)$ is a set and each $\Hom(\O_Y,f_* \O_X)$ is a set.

  - property: complete
    proof: See <a href="https://arxiv.org/abs/1103.2139">Gillam</a>. See also <a href="https://math.stackexchange.com/questions/1033675">MSE/1033675</a>.

  - property: cocomplete
    proof: >-
      Colimits are computed as in ringed spaces: for a diagram $(X_i,\O_{X_i})_{i \in I}$ in $\LRS_R$, let $X \coloneqq \colim_i X_i$ be the colimit of the underlying spaces with colimit maps $u_i : X_i \to X$, and let $\O_X \coloneqq \lim_i (u_i)_* \O_{X_i}$ be the limit of the push-forwards of the structure sheaves. Then $(X,\O_X)$ is a locally ringed space, the morphisms $(u_i, \O_X \to (u_i)_* \O_{X_i})$ have local stalk maps, and they form a colimit in $\LRS_R$. See Demazure–Gabriel, <i>Groupes algébriques</i>, Tome I, Ch. I, §1, 1.6. See also <a href="https://math.stackexchange.com/questions/1646202">MSE/1646202</a>.
    check_redundancy: false

  - property: infinitary extensive
    proof: >-
      The proof works for both ringed and locally ringed spaces and relies on the fact that <a href="/category/Top">$\Top$</a> is infinitary extensive.

      First, recall some basic facts about open embeddings (often called open immersions in the context of schemes). If $(X,\O_X)$ is a locally ringed space and $U \subseteq X$ is an open subset, then, letting $\O_U \coloneqq (\O_X)|_U$, the pair $(U,\O_U)$ is again a locally ringed space. There is an inclusion morphism $(i,i^\sharp) : (U,\O_U) \to (X,\O_X)$, where $i$ is the inclusion map and $i^\sharp : \O_X \to i_* \O_U$ is defined via restriction maps. This is a monomorphism, and a morphism into $(X,\O_X)$ factors through it if and only if the image of its underlying map is contained in $U$. We will refer to any monomorphism isomorphic to one of this form as an open embedding.

      Pullbacks along open embeddings exist and are themselves open embeddings. Indeed, if $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ is a morphism of locally ringed spaces and $V \subseteq Y$ is an open subset, then $f^*(V) \subseteq X$ is an open subset, and $(f^*(V),\O_{f^*(V)}) \hookrightarrow (X,\O_X)$ is the pullback of $(f,f^\sharp)$ along $(V,\O_V) \hookrightarrow (Y,\O_Y)$.

      Since $\LRS_R$ is cocomplete, coproducts exist. Concretely, the coproduct of a family of locally ringed spaces $(X_i,\O_{X_i})$ is the locally ringed space $(X,\O_X)$, where $X \coloneqq \coprod_i X_i$ and $\O_X(U) \coloneqq \prod_i \O_{X_i}(U \cap X_i)$. Notice that the coproduct inclusions are open embeddings. Hence, pullbacks along coproduct inclusions exist.

      That coproducts are disjoint in $\LRS_R$ follows from the corresponding property of $\Top$ together with the following observations. By the descriptions above, the forgetful functor $\LRS_R \to \Top$ preserves coproducts and pullbacks along open embeddings (although it does not preserve pullbacks in general), and the empty topological space admits a unique structure sheaf, up to isomorphism, making it into a locally ringed space.

      It remains to prove that coproducts are stable under pullbacks. To this end, let $(f,f^\sharp) : (T,\O_T) \to \coprod_i (X_i,\O_{X_i})$ be a morphism. Then $T_i \coloneqq f^*(X_i) \subseteq T$ is an open subset, and for $i \neq j$ we have $T_i \cap T_j = \varnothing$ because $X_i \cap X_j = \varnothing$ in the coproduct. We must show that the canonical morphism $(g,g^\sharp) : \coprod_i (T_i,\O_{T_i}) \to (T,\O_T)$ is an isomorphism. The underlying continuous map $g$ is a homeomorphism because coproducts in $\Top$ are stable under pullbacks. It therefore remains to show that $g^\sharp : \O_T \to g_* \O$, where $\O$ denotes the structure sheaf of the coproduct, is an isomorphism. Equivalently, for every open subset $U \subseteq T$, we must show that the canonical ring homomorphism
      $$\textstyle \O_T(U) \to \prod_{i \in I} \O_{T_i}(U \cap T_i) = \prod_{i \in I} \O_T(U \cap T_i)$$
      is an isomorphism. This is precisely the sheaf axiom applied to the open cover of $U$ by the pairwise disjoint open subsets $U \cap T_i$.

  - property: extremal cogenerator
    proof: >-
      Let $\RS_R$ be the category of ringed spaces over $R$, which is defined like $\LRS_R$, but without the conditions on stalks and stalk maps. By <a href="https://arxiv.org/abs/1103.2139">Gillam</a>, Cor. 6 (stated there for $R = \IZ$, but the proof works verbatim for every $R$), the inclusion functor $\LRS_R \to \RS_R$ has a right adjoint $L : \RS_R \to \LRS_R$. The inclusion functor is faithful, and it is conservative since the inverse of an isomorphism of ringed spaces has bijective, hence local, stalk maps. By the dual of Lemma 9 <a href="/content/subcategories">here</a>, $L$ maps extremal cogenerators of $\RS_R$ to extremal cogenerators of $\LRS_R$. So it suffices to find an extremal cogenerator of $\RS_R$.

      Let $Q$ be the ringed space over $R$ whose underlying space is $\{0,1\}^2$ with the open subsets
      $$\varnothing,\quad W \coloneqq \{0,1\} \times \{1\},\quad \{0,1\}^2,$$
      and whose structure sheaf is given by
      $$\begin{align*}
      \O_Q(\{0,1\}^2) & \coloneqq R, \\
      \O_Q(W) & \coloneqq R[T], \\
      \O_Q(\varnothing) & \coloneqq 0,
      \end{align*}$$
      with the inclusion $R \hookrightarrow R[T]$ as the restriction map. This is a sheaf since every open cover of a non-empty open subset contains this subset. We claim that $Q$ is an extremal cogenerator of $\RS_R$.

      A morphism $X \to Q$ in $\RS_R$ consists of a function $(h,k) : X \to \{0,1\}^2$ such that $U \coloneqq k^*(\{1\})$ is open, together with $R$-algebra homomorphisms $R \to \O_X(X)$ and $R[T] \to \O_X(U)$ that are compatible with the restriction maps. The first homomorphism is unique, the second one is determined by the image $s \in \O_X(U)$ of $T$, and the compatibility is automatic. Let $S(X)$ be the set of pairs $(U,s)$ with $U \subseteq X$ open and $s \in \O_X(U)$. We obtain a bijection
      $$\Hom_{\RS_R}(X,Q) \cong \Hom_{\Set}(X,\{0,1\}) \times S(X).$$
      Under this bijection, precomposition with a morphism $(f,f^\sharp) : X \to Y$ is the product of the maps
      $$\alpha_f : \Hom_{\Set}(Y,\{0,1\}) \to \Hom_{\Set}(X,\{0,1\}), \quad h \mapsto h \circ f,$$
      $$\beta_f : S(Y) \to S(X), \quad (V,s) \mapsto (f^*(V), f^\sharp(s)).$$
      All four sets are non-empty, since they contain the constant function with value $0$ and the pair $(\varnothing,0)$, respectively. Hence, the product map determines $\alpha_f$ and $\beta_f$, and it is bijective if and only if $\alpha_f$ and $\beta_f$ are.

      To show that $Q$ is a cogenerator, let $(f,f^\sharp),(g,g^\sharp) : X \rightrightarrows Y$ be two morphisms that induce the same map by precomposition, so that $\alpha_f = \alpha_g$ and $\beta_f = \beta_g$. Since $\{0,1\}$ is a cogenerator of <a href="/category/Set">$\Set$</a>, the first equation implies $f = g$. The second equation means $f^\sharp(s) = g^\sharp(s)$ for all open subsets $V \subseteq Y$ and $s \in \O_Y(V)$, i.e. $f^\sharp = g^\sharp$.

      Now let $(f,f^\sharp) : X \to Y$ be a morphism such that precomposition with it is bijective, so that $\alpha_f$ and $\beta_f$ are bijective. Since $\{0,1\}$ is an extremal cogenerator of $\Set$, $f$ is bijective. Since every pair $(U,0)$ lies in the image of $\beta_f$, every open subset of $X$ has the form $f^*(V)$ for an open subset $V \subseteq Y$, so $f$ is a homeomorphism. Finally, $\beta_f$ is the disjoint union of the maps $f^\sharp : \O_Y(V) \to \O_X(f^*(V))$, and $V \mapsto f^*(V)$ is a bijection between the open subsets of $Y$ and $X$. Hence, each of these maps is bijective. This shows that $f^\sharp : \O_Y \to f_* \O_X$ is an isomorphism, so that $(f,f^\sharp)$ is an isomorphism of ringed spaces.
    references:
      - Set_extremal_cogenerator

  - property: well-copowered
    proof: This follows from the characterization of epimorphisms below.

  - property: well-powered
    proof: >-
      Let $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ be a monomorphism. By the classification of monomorphisms (see below), $f : X \to Y$ is injective, and the stalk maps $f^\sharp_x : \O_{Y,f(x)} \to \O_{X,x}$ are epimorphisms in the category of local commutative rings. By <a href="/content/local-ring-epimorphisms">this lemma</a>, every stalk of $\O_X$ has cardinality at most
      $$\textstyle \lambda \coloneqq \max\bigl(\aleph_0, \sup_{y \in Y} |\O_{Y,y}|\bigr).$$
      Fix a set $S$ of cardinality $\lambda$, and choose injective maps $\O_{X,x} \to S$. Since a section of $\O_X$ is determined by its germs, we obtain injective maps $\O_X(U) \to S^U$ for all open subsets $U \subseteq X$, which are compatible with the restriction maps. Transporting the structure along these maps and along $f$, we see that $(X,\O_X)$ is isomorphic to a locally ringed space $(X',\O_{X'})$ with $X' \subseteq Y$ and $\O_{X'}(U) \subseteq S^U$ for all open subsets $U \subseteq X'$, such that the restriction maps are the projections. These locally ringed spaces form a set, and for each of them there is only a set of morphisms $(X',\O_{X'}) \to (Y,\O_Y)$. Hence, $\Sub(Y,\O_Y)$ is essentially small.

unsatisfied_properties:
  - property: skeletal
    proof: This is trivial.

  - property: balanced
    proof: Choose a residue field $K$ of $R$. The canonical morphism $$\Spec(K[X]/X \times K[X,X^{-1}]) \longrightarrow \Spec(K[X])$$ is a mono- and an epimorphism, but no isomorphism.

  - property: semi-strongly connected
    proof: This is because already the full subcategory <a href="/category/Sch_R">$\Sch_R$</a> of $R$-schemes is not semi-strongly connected.

  - property: Malcev
    proof: This is because already the full subcategory <a href="/category/Sch_R">$\Sch_R$</a> of $R$-schemes is not Malcev.

  - property: co-Malcev
    proof: 'We can adjust the proof for <a href="/category/Top">$\Top$</a> (see <a href="https://mathoverflow.net/questions/509548">MO/509548</a>) as follows: Let $K$ be a residue field of $R$, let $X$ be a singleton and $C = \{u,v\}$ be the Sierpiński space where $\{u\}$ is open, but $\{v\}$ is not. Endow both with the sheaf of locally constant functions to $K$. Thus, $\O_X(X) = K$, $\O_C(C) = \O_C(\{u\}) = K$. Let $j_1, j_2 : X \rightrightarrows C$ be the two canonical morphisms with images $u$ and $v$, respectively. They form a coreflexive corelation that is not cosymmetric.'
    references:
      - Top_not_co-malcev

  - property: total
    proof: 'The adjunction between the global sections functor and the $\Spec$ functor (<a href="https://en.wikipedia.org/wiki/%C3%89l%C3%A9ments_de_g%C3%A9om%C3%A9trie_alg%C3%A9brique">Grothendieck–Dieudonné</a>, EGA I (1971), Ch. 1, Prop. 1.6.3) makes $\CAlg(R)^{\op}$ into a reflective subcategory of $\LRS_R$. Therefore, if $\LRS_R$ were total, then <a href="/category/CAlg(R)">$\CAlg(R)$</a> would be cototal by <a href="https://www.numdam.org/item/?id=CTGDC_1986__27_2_109_0">Kelly</a>, Cor. 6.2, which we know is not the case.'

  - property: cartesian filtered colimits
    proof: This is Corollary 4(b) <a href="/content/Top-embeds-in-LRS">here</a>.

  - property: effective cocongruences
    proof: This is Corollary 4(e) <a href="/content/Top-embeds-in-LRS">here</a>.

  - property: pushout-stable regular monomorphisms
    proof: >-
      Choose a maximal ideal $\m$ of $R$ and let $K \coloneqq R/\m$. We first reduce the claim to $\LRS_K$, which is the full subcategory of $\LRS_R$ consisting of those $X$ with $\m \O_X = 0$. Equivalently, $X$ admits a morphism $X \to \Spec(K)$ in $\LRS_R$, which is then unique. It follows that $\LRS_K$ is closed under pushouts in $\LRS_R$, and that every $T$ with a morphism $T \to X \in \LRS_K$ lies in $\LRS_K$. Hence, pushouts and equalizers in $\LRS_K$ are the same as in $\LRS_R$, and therefore also regular monomorphisms, since these are the equalizers of their cokernel pairs (by the dual of <a href="/content/regular-epis-kernel-pairs">this lemma</a>). So if $\LRS_R$ had pushout-stable regular monomorphisms, then so would $\LRS_K$.

      So it suffices to construct, for every field $K$, a counterexample in $\LRS_K$. In fact, we will find a regular monomorphism $i : X \to Y$ which is the identity on underlying spaces, and a morphism $f : X \to Z$ to a one-point space such that $Z \to Y \sqcup_X Z$ is not a regular monomorphism. The idea is that $\O_Y$ has an infinitesimal direction over two open subsets which cannot be glued to a global section, whereas $\O_X$ has a global section in this direction. Collapsing the space to a point only keeps the global sections, so this direction gets lost.

      Let $K[\varepsilon]$ be the commutative algebra of dual numbers, where $\varepsilon^2 = 0$, and let $L \coloneqq K[\varepsilon_1,\varepsilon_2]$ be the commutative algebra where $\varepsilon_1^2 = \varepsilon_1 \varepsilon_2 = \varepsilon_2^2 = 0$, so that $1,\varepsilon_1,\varepsilon_2$ is a basis of $L$ over $K$.

      Let $S \coloneqq \{x,y_1,y_2\}$ be the space whose open subsets are
      $$\varnothing, \quad \{x\}, \quad U_1 \coloneqq \{x,y_1\}, \quad U_2 \coloneqq \{x,y_2\}, \quad S.$$
      Since $\{x\}$, $U_1$, $U_2$ are the smallest open neighborhoods of $x$, $y_1$, $y_2$, respectively, the stalks of a sheaf $F$ of $K$-algebras on $S$ are $F_x = F(\{x\})$, $F_{y_1} = F(U_1)$, $F_{y_2} = F(U_2)$. Every open cover of a non-empty open subset $U \subseteq S$ contains $U$ itself, unless $U = S$ and the cover contains $U_1$ and $U_2$. Hence, besides $F(\varnothing) = 0$, which is forced by the empty cover of $\varnothing$, the sheaf condition only needs to be checked for the cover $S = U_1 \cup U_2$ with $U_1 \cap U_2 = \{x\}$. It follows that a sheaf $F$ of $K$-algebras on $S$ is determined by the cospan of restriction maps
      $$F(U_1) \xrightarrow{\rho_1} F(\{x\}) \xleftarrow{\rho_2} F(U_2)$$
      via $F(S) = F(U_1) \times_{F(\{x\})} F(U_2)$, and that a morphism of such sheaves is the same as a family of homomorphisms on $U_1$, $U_2$, $\{x\}$ that is compatible with the restriction maps.

      Let $X \coloneqq (S,\O_X)$ and $Y \coloneqq (S,\O_Y)$, where $\O_X$ and $\O_Y$ are the sheaves given by the cospans
      $$K[\varepsilon] \xrightarrow{\id} K[\varepsilon] \xleftarrow{\id} K[\varepsilon], \qquad K[\varepsilon] \xrightarrow{\rho_1} L \xleftarrow{\rho_2} K[\varepsilon],$$
      respectively, with $\rho_1(\varepsilon) \coloneqq \varepsilon_1$ and $\rho_2(\varepsilon) \coloneqq \varepsilon_2$. Both are locally ringed spaces since their stalks $K[\varepsilon]$ and $L$ are local rings. We have $\O_X(S) = K[\varepsilon]$. A pair $(\lambda_1 + \mu_1 \varepsilon, \lambda_2 + \mu_2 \varepsilon) \in K[\varepsilon]^2$ lies in $\O_Y(S) = K[\varepsilon] \times_L K[\varepsilon]$ iff
      $$\lambda_1 + \mu_1 \varepsilon_1 = \lambda_2 + \mu_2 \varepsilon_2 \quad \text{in } L,$$
      i.e. iff $\lambda_1 = \lambda_2$ and $\mu_1 = \mu_2 = 0$. Hence, $\O_Y(S) \cong K$ consists only of the constants: unlike in $\O_X$, the sections $\varepsilon$ over $U_1$ and $U_2$ do not glue.

      Define the morphism $i \coloneqq (\id_S,\pi) : X \to Y$, where $\pi : \O_Y \to \O_X$ is the identity on $U_1$ and $U_2$, and on $\{x\}$ it is the homomorphism
      $$\pi_x : L \to K[\varepsilon], \quad \pi_x(\varepsilon_1) \coloneqq \pi_x(\varepsilon_2) \coloneqq \varepsilon.$$
      This is compatible with the restriction maps since $\pi_x \circ \rho_1 = \pi_x \circ \rho_2 = \id$. On global sections, $\pi$ is the inclusion $K \hookrightarrow K[\varepsilon]$. The stalk maps of $i$ are surjective homomorphisms of local rings, hence local. Since $i$ is the identity on underlying spaces and its stalk maps are surjective, $i$ is a regular monomorphism by the classification of regular monomorphisms (see below).

      Let $Z \coloneqq \Spec(K[\varepsilon])$, and let $f : X \to Z$ be the morphism corresponding to the identity $K[\varepsilon] \to \O_X(S) = K[\varepsilon]$. Recall from the proof of cocompleteness that pushouts in $\LRS_K$ are computed as in ringed spaces: the underlying space is the pushout of the underlying spaces, and the structure sheaf is the fiber product of the push-forwards of the structure sheaves. Hence, the underlying space of $P \coloneqq Y \sqcup_X Z$ is the pushout of $\id_S$ and $S \to Z$, which is a point, and its algebra of global sections is
      $$\O_Y(S) \times_{\O_X(S)} \O_Z(Z) = K \times_{K[\varepsilon]} K[\varepsilon] \cong K.$$
      So $P \cong \Spec(K)$, and the stalk map of the morphism $j : Z \to P$ is the inclusion $K \hookrightarrow K[\varepsilon]$. Since it is not surjective, $j$ is not a regular monomorphism by the classification of regular monomorphisms.

  - property: filtered-colimit-stable monomorphisms
    proof: >-
      Choose a residue field $K$ of $R$. Let $V \coloneqq K^{(\IN)}$ with basis $(e_m)_{m \in \IN}$, and let $V_n \subseteq V$ be the subspace spanned by the $e_m$ with $m \geq n$. Then $V_0 \supseteq V_1 \supseteq \cdots$ and $\bigcap_{n \in \IN} V_n = 0$. Let $\sigma : V \to K$ be the linear map with $\sigma(e_m) = 1$ for all $m$, which sums the coefficients.

      For a $K$-vector space $W$, let $K \oplus W$ be its square-zero extension. It is a local ring with nilpotent maximal ideal $W$, and it is functorial in $W$: a linear map $f : W \to W'$ induces the homomorphism $K \oplus W \to K \oplus W'$, $(\lambda,w) \mapsto (\lambda,f(w))$. For example, $K \oplus K$ is isomorphic to the algebra $K[\varepsilon]$ of dual numbers, where $\varepsilon^2 = 0$, via $(\lambda,\mu) \mapsto \lambda + \mu \varepsilon$.

      Let $A_n \coloneqq K \oplus V_n$. Then $\Spec(A_n)$ is a one-point space with the ring $A_n$. The inclusions $V_{n+1} \hookrightarrow V_n$ induce inclusions $A_{n+1} \hookrightarrow A_n$, hence morphisms $\Spec(A_n) \to \Spec(A_{n+1})$, which form a filtered diagram indexed by $\IN$. The restriction $V_n \to K$ of $\sigma$ induces the homomorphism
      $$p_n : A_n \to K[\varepsilon], \quad (\lambda,v) \mapsto \lambda + \sigma(v) \varepsilon.$$
      It is surjective since $\sigma(e_n) = 1$, and $p_{n+1}$ is the restriction of $p_n$ to $A_{n+1}$ by functoriality. Hence, the morphisms $\Spec(p_n) : \Spec(K[\varepsilon]) \to \Spec(A_n)$ form a morphism from the constant diagram $(\Spec(K[\varepsilon]))_n$ to the diagram $(\Spec(A_n))_n$. Each $\Spec(p_n)$ is a monomorphism by the classification of monomorphisms (see below): its underlying map is a map between one-point spaces, and its stalk map $p_n$ is surjective, hence an epimorphism of local commutative rings.

      The colimit of the constant diagram is $\Spec(K[\varepsilon])$. Recall from the proof of cocompleteness that colimits in $\LRS_R$ are computed as in ringed spaces: the underlying space is the colimit of the underlying spaces, and the structure sheaf is the limit of the push-forwards of the structure sheaves. Hence, the colimit of the diagram $(\Spec(A_n))_n$ is a one-point space with the ring
      $$\textstyle \lim_n A_n = \bigcap_{n \in \IN} A_n = K \oplus \bigcap_{n \in \IN} V_n = K,$$
      i.e. it is $\Spec(K)$, and the induced morphism $\Spec(K[\varepsilon]) \to \Spec(K)$ corresponds to the inclusion $K \hookrightarrow K[\varepsilon]$. This inclusion is not an epimorphism of local commutative rings, since the identity of $K[\varepsilon]$ and the local homomorphism $K[\varepsilon] \to K[\varepsilon]$, $\varepsilon \mapsto 0$, agree on $K$. Hence, the morphism $\Spec(K[\varepsilon]) \to \Spec(K)$ is not a monomorphism by the classification of monomorphisms.

  - property: regular subobject classifier
    proof: >-
      The idea is the same as for <a href="/category/CAlg(R)">$\CAlg(R)$</a>: a classifying morphism is invariant under automorphisms that preserve the subobject. Instead of the polynomial ring $K[X,Y]$ used there, we work with the local Artinian ring $K[X,Y]/\langle X,Y \rangle^2$, since its spectrum is a one-point space, and morphisms from such a space into a locally ringed space are described by a single point and a stalk map.

      Assume that $\top : \Spec(R) \to \Omega$ is a regular subobject classifier. Let $K$ be a residue field of $R$, and let $A \coloneqq K[X,Y]/\langle X,Y \rangle^2$, whose elements can be written uniquely as $a + bX + cY$ with $a,b,c \in K$. The projection $\pi : A \to K$, $a + bX + cY \mapsto a$ is surjective, hence a regular epimorphism in $\CAlg(R)$. Since $\Spec : \CAlg(R)^{\op} \to \LRS_R$ is fully faithful and a right adjoint, $\Spec(\pi) : \Spec(K) \to \Spec(A)$ is a regular monomorphism. So there is a unique morphism $\chi : \Spec(A) \to \Omega$ such that the square
      $$\begin{CD} \Spec(K) @>{\Spec(\pi)}>> \Spec(A) \\ @V{!}VV @VV{\chi}V \\ \Spec(R) @>>{\top}> \Omega \end{CD}$$
      is a pullback. Let $p \in \Omega$ be the image of the unique point of $\Spec(A)$, and let $\varphi : \O_{\Omega,p} \to A$ be the stalk map of $\chi$.

      Let $\sigma : A \to A$ be the automorphism that swaps $X$ and $Y$. Since $\pi \circ \sigma = \pi$, the square
      $$\begin{CD} \Spec(K) @>{\Spec(\pi)}>> \Spec(A) \\ @V{\id}VV @VV{\Spec(\sigma)}V \\ \Spec(K) @>>{\Spec(\pi)}> \Spec(A) \end{CD}$$
      commutes, and it is a pullback since $\Spec(\sigma)$ is an isomorphism. Pasting it on top of the first square shows that $\chi \circ \Spec(\sigma)$ also classifies $\Spec(\pi)$, so that $\chi \circ \Spec(\sigma) = \chi$ by uniqueness. On stalks, this means $\sigma \circ \varphi = \varphi$, i.e. $\varphi$ takes values in the fixed ring
      $$A^\sigma = \{a + b(X+Y) : a,b \in K\}.$$
      Now let $u : A \to A/\langle X+Y \rangle$ be the quotient map, and let $v : A \to A/\langle X+Y \rangle$ map $a + bX + cY$ to the class of $a$, so that $v$ factors through $\pi$. Both $u$ and $v$ map $a + b(X+Y)$ to the class of $a$, so they agree on $A^\sigma$. A morphism from the one-point space $\Spec(A/\langle X+Y \rangle)$ to $\Omega$ is the same as a point of $\Omega$ together with a local homomorphism from its stalk to $A/\langle X+Y \rangle$. For $\chi \circ \Spec(u)$ and $\chi \circ \Spec(v)$, these are $p$ together with $u \circ \varphi$ and $v \circ \varphi$, which coincide since $\varphi$ takes values in $A^\sigma$. Since $\Spec(v)$ factors through $\Spec(\pi)$, it follows that
      $$\chi \circ \Spec(u) = \chi \circ \Spec(v) = \top \circ {!}.$$
      Since the first square is a pullback, $\Spec(u)$ factors through $\Spec(\pi)$. Since $\Spec$ is fully faithful, $u$ factors through $\pi$. But then $X \in \ker(\pi) \subseteq \ker(u) = \langle X+Y \rangle$, which is a contradiction.
    label: LRS_R_no_regular_subobject_classifier
    references:
      - CAlg(R)_no_regular_quotient_object_classifier

special_objects:
  initial object:
    description: empty space
  terminal object:
    description: $\Spec(R)$
  coproducts:
    description: disjoint union with the product sheaf
  products:
    description: See <a href="https://arxiv.org/abs/1103.2139">Gillam</a>. See also <a href="https://math.stackexchange.com/questions/1033675">MSE/1033675</a>.

special_morphisms:
  isomorphisms:
    description: 'A morphism $(f,f^\sharp) : (X, \O_X) \to (Y,\O_Y)$ is an isomorphism iff $f : X \to Y$ is a homeomorphism and $f^\sharp : \O_Y \to f_* \O_X$ is an isomorphism of sheaves.'
    proof: This is easy.
  monomorphisms:
    description: 'A morphism $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ is a monomorphism iff $f : X \to Y$ is injective and for every $x \in X$ the stalk map $f^\sharp_x : \O_{Y,f(x)} \to \O_{X,x}$ is an epimorphism in the category of local commutative rings and local homomorphisms.'
    proof: >-
      For a local commutative $R$-algebra $T$, let $(\{\ast\},T)$ denote the one-point space with the ring $T$. A morphism $(\{\ast\},T) \to (X,\O_X)$ is the same as a point $x \in X$ together with a local homomorphism of $R$-algebras $\O_{X,x} \to T$, and its composite with $(f,f^\sharp)$ corresponds to the point $f(x)$ together with the composite $\O_{Y,f(x)} \xrightarrow{f^\sharp_x} \O_{X,x} \to T$.

      If $x_1,x_2 \in X$ satisfy $f(x_1) = f(x_2) \eqqcolon y$, then there are a field $F$ and morphisms $\bar{x}_1,\bar{x}_2 : (\{\ast\},F) \rightrightarrows (X,\O_X)$ with images $x_1,x_2$ that have the same composite with $(f,f^\sharp)$. Indeed, the residue fields $\kappa(x_1)$ and $\kappa(x_2)$ are extensions of $\kappa(y)$. Since $\kappa(x_1) \otimes_{\kappa(y)} \kappa(x_2) \neq 0$, it has a quotient field $F$, which comes with homomorphisms $\kappa(x_i) \to F$ that agree on $\kappa(y)$. We regard $F$ as an $R$-algebra via $\kappa(y)$. For $i = 1,2$, let $\bar{x}_i$ be the morphism corresponding to the point $x_i$ and the local homomorphism $\O_{X,x_i} \to \kappa(x_i) \to F$. Its composite with $(f,f^\sharp)$ corresponds to the point $y$ and the local homomorphism
      $$\O_{Y,y} \to \O_{X,x_i} \to \kappa(x_i) \to F,$$
      which equals $\O_{Y,y} \to \kappa(y) \to \kappa(x_i) \to F$ and therefore does not depend on $i$.

      Assume that $(f,f^\sharp)$ is a monomorphism. To show that $f$ is injective, let $x_1,x_2 \in X$ with $f(x_1) = f(x_2)$. Since $(f,f^\sharp)$ is a monomorphism, the morphisms $\bar{x}_1,\bar{x}_2$ from above agree, so that $x_1 = x_2$. Thus, $f$ is injective. Next, let $x \in X$, $y \coloneqq f(x)$, and let $u,v : \O_{X,x} \rightrightarrows T$ be local homomorphisms into a local commutative ring $T$ with $u \circ f^\sharp_x = v \circ f^\sharp_x$. We regard $T$ as an $R$-algebra via $u$, which is the same as via $v$, since $R \to \O_{X,x}$ factors through $f^\sharp_x$. The morphisms $(\{\ast\},T) \to (X,\O_X)$ corresponding to $(x,u)$ and $(x,v)$ have the same composite with $(f,f^\sharp)$, namely the one corresponding to $(y,u \circ f^\sharp_x)$. Since $(f,f^\sharp)$ is a monomorphism, we get $u = v$. Thus, $f^\sharp_x$ is an epimorphism of local commutative rings.

      Conversely, assume that $(f,f^\sharp)$ satisfies the two conditions, and let $(g,g^\sharp),(h,h^\sharp) : (Z,\O_Z) \rightrightarrows (X,\O_X)$ be two morphisms with $(f,f^\sharp) \circ (g,g^\sharp) = (f,f^\sharp) \circ (h,h^\sharp)$. Since $f$ is injective, $f \circ g = f \circ h$ implies $g = h$. For $z \in Z$ and $x \coloneqq g(z)$, the stalk maps $g^\sharp_z, h^\sharp_z : \O_{X,x} \rightrightarrows \O_{Z,z}$ are local homomorphisms with $g^\sharp_z \circ f^\sharp_x = h^\sharp_z \circ f^\sharp_x$, which implies $g^\sharp_z = h^\sharp_z$. So for every open subset $U \subseteq X$ and $s \in \O_X(U)$, the sections $g^\sharp(s), h^\sharp(s) \in \O_Z(g^*(U))$ have the same germs, which means $g^\sharp(s) = h^\sharp(s)$. Hence, $(g,g^\sharp) = (h,h^\sharp)$.
  epimorphisms:
    description: 'A morphism $(f,f^\sharp) : (X, \O_X) \to (Y,\O_Y)$ is an epimorphism iff $f : X \to Y$ is surjective and $f^\sharp : \O_Y \to f_* \O_X$ is a monomorphism of sheaves.'
    proof: >-
      It is obvious that morphisms with this property are epimorphisms. For the opposite, assume that $(f,f^\sharp) : (X, \O_X) \to (Y,\O_Y)$ is an epimorphism. Then the codiagonal
      $$(Y,\O_Y) \sqcup_{(X,\O_X)} (Y,\O_Y) \to (Y,\O_Y)$$
      is an isomorphism. By construction of the pushout, the underlying space of the pushout is $Y \sqcup_X Y$. Hence, $f$ is an epimorphism in $\Top$, i.e. it is surjective. For open subsets $V \subseteq Y$ the preimage in the pushout is $V \sqcup_{f^{-1}(V)} V$, and its ring of sections is the pullback $\O_Y(V) \times_{\O_X(f^{-1}(V))} \O_Y(V)$. Since the diagonal
      $$\O_Y(V) \to \O_Y(V) \times_{\O_X(f^{-1}(V))} \O_Y(V)$$
      is an isomorphism, the map $f^\sharp(V) : \O_Y(V) \to \O_X(f^{-1}(V))$ is a monomorphism. Hence, $f^\sharp$ is a monomorphism of sheaves.
  regular monomorphisms:
    description: 'A morphism $i : Z \to Y$ is a regular monomorphism iff its underlying continuous map is an embedding and its stalk maps $\O_{Y,i(z)} \to \O_{Z,z}$ are surjective for all $z \in Z$.'
    proof: >-
      For a morphism $\varphi : T \to Y$ and $t \in T$, we write $\varphi_t : \O_{Y,\varphi(t)} \to \O_{T,t}$ for the stalk map, so that the germ of $\varphi^\sharp(b)$ at $t$ is $\varphi_t(b_{\varphi(t)})$ for every local section $b$ of $\O_Y$. We will use the following simple fact twice: if $\alpha : A \to B$ is a surjective homomorphism of local rings and $\beta : B \to C$ is a homomorphism into a local ring such that $\beta \circ \alpha$ is local, then $\beta$ is local, since every non-unit of $B$ is the image of a non-unit of $A$.

      We first observe that every morphism $\varphi : T \to Y$ factors as $\varphi = j \circ e$, where $e$ is an epimorphism and $j$ is a morphism whose underlying continuous map is an embedding and whose stalk maps are surjective. Let $Y' \coloneqq \varphi(T) \subseteq Y$ carry the subspace topology, let $\iota : Y' \hookrightarrow Y$ be the inclusion, and let $\varphi' : T \to Y'$ be the continuous surjection with $\varphi = \iota \circ \varphi'$. The sheaf map $\varphi^\sharp : \O_Y \to \varphi_* \O_T = \iota_* \varphi'_* \O_T$ corresponds to a morphism of sheaves $\iota^{-1} \O_Y \to \varphi'_* \O_T$ on $Y'$, and we let $\O_{Y'} \subseteq \varphi'_* \O_T$ be its image. For $t \in T$ and $y \coloneqq \varphi(t)$, the stalk $\O_{Y',y}$ is the image of $\O_{Y,y}$ in $(\varphi'_* \O_T)_y$. It is a quotient of the local ring $\O_{Y,y}$, and it is non-zero since $\varphi_t$ factors through it and $\O_{T,t} \neq 0$. Hence, $\O_{Y',y}$ is local, and $(Y',\O_{Y'})$ is a locally ringed space. We obtain a factorization $\varphi = j \circ e$ with the morphisms
      $$j \coloneqq (\iota, \O_Y \to \iota_* \iota^{-1} \O_Y \to \iota_* \O_{Y'}) : Y' \to Y,$$
      $$e \coloneqq (\varphi', \O_{Y'} \hookrightarrow \varphi'_* \O_T) : T \to Y'.$$
      Here, the stalk maps $j_y : \O_{Y,y} \to \O_{Y',y}$ are surjective, hence local, and since $e_t \circ j_y = \varphi_t$ is local, $e_t$ is local by the simple fact above. The underlying map of $e$ is surjective and its sheaf map is a monomorphism, so $e$ is an epimorphism by the classification of epimorphisms (see above).

      Now let $i : Z \to Y$ be a regular monomorphism, and let $i = j \circ e$ be the factorization from above. Since $i$ is an extremal monomorphism and $e$ is an epimorphism, $e$ is an isomorphism. Hence, the underlying map of $i$ is an embedding, and its stalk maps $i_z = e_z \circ j_{i(z)}$ are surjective.

      For the converse direction, we first prove a factorization criterion. Let $i : Z \to Y$ be a morphism whose underlying map is an embedding and whose stalk maps $i_z : \O_{Y,i(z)} \to \O_{Z,z}$ are surjective. Let $\varphi : T \to Y$ be a morphism with $\varphi(T) \subseteq i(Z)$ such that $\varphi_t$ vanishes on $\ker(i_z)$ whenever $\varphi(t) = i(z)$. We claim that $\varphi$ factors uniquely through $i$. We may assume that $Z \subseteq Y$ is a subspace and that $i$ is the inclusion map. Then $\varphi = i \circ \varphi'$ for a unique continuous map $\varphi' : T \to Z$. Let $U \subseteq Z$ be open and $a \in \O_Z(U)$. Since the stalk maps of $i$ are surjective, every $z \in U$ has an open neighborhood $V \subseteq Y$ with $Z \cap V \subseteq U$ and a section $b \in \O_Y(V)$ such that $i^\sharp(b) = a$ on $Z \cap V$: first choose $b$ with the correct germ at $z$, then shrink $V$, using that $Z$ carries the subspace topology. We call such a section $b$ a local lift of $a$. If $b \in \O_Y(V)$ and $b' \in \O_Y(V')$ are local lifts of $a$, then for every $t \in \varphi^*(V \cap V')$ with $z \coloneqq \varphi(t)$ we have $b_z - b'_z \in \ker(i_z)$, hence $\varphi_t(b_z) = \varphi_t(b'_z)$. This means that $\varphi^\sharp(b)$ and $\varphi^\sharp(b')$ agree on $\varphi^*(V \cap V')$. Since the sets $\varphi^*(V) = (\varphi')^*(Z \cap V)$ for local lifts $b \in \O_Y(V)$ of $a$ cover $(\varphi')^*(U)$, the sections $\varphi^\sharp(b)$ glue to a section $\psi(a) \in \O_T((\varphi')^*(U))$. Since sums and products of local lifts are local lifts, this defines a morphism of sheaves $\psi : \O_Z \to \varphi'_* \O_T$. It satisfies $\psi(i^\sharp(b)) = \varphi^\sharp(b)$ for every local section $b$ of $\O_Y$, which means $i \circ (\varphi',\psi) = \varphi$. Its stalk maps satisfy $\psi_t \circ i_{\varphi'(t)} = \varphi_t$, so they are local by the simple fact above. Finally, if $\psi' : \O_Z \to \varphi'_* \O_T$ is another morphism with $i \circ (\varphi',\psi') = \varphi$, then $\psi'(a)$ restricts to $\psi'(i^\sharp(b)) = \varphi^\sharp(b)$ on $\varphi^*(V)$ for every local lift $b \in \O_Y(V)$ of $a$, so $\psi' = \psi$. This proves the claim.

      Finally, let $i : Z \to Y$ be a morphism whose underlying map is an embedding and whose stalk maps are surjective. We show that $i$ is the equalizer of its cokernel pair. We may assume that $Z \subseteq Y$ is a subspace and that $i$ is the inclusion map. Recall from the proof of cocompleteness that pushouts in $\LRS_R$ are computed as in ringed spaces: the underlying space is the pushout of the underlying spaces, and the structure sheaf is the fiber product of the push-forwards of the structure sheaves. Hence, the cokernel pair $u_1,u_2 : Y \rightrightarrows W$ of $i$ looks as follows. The underlying space of $W$ consists of two copies of $Y$ glued along $Z$, and $u_1,u_2$ are the two inclusions. The open subsets of $W$ correspond to pairs $(V_1,V_2)$ of open subsets of $Y$ with $Z \cap V_1 = Z \cap V_2$, and
      $$\O_W(V_1,V_2) = \O_Y(V_1) \times_{\O_Z(Z \cap V_1)} \O_Y(V_2),$$
      where the sheaf maps of $u_1,u_2$ are the two projections.

      Clearly, $u_1 \circ i = u_2 \circ i$. Now let $\varphi : T \to Y$ be a morphism with $u_1 \circ \varphi = u_2 \circ \varphi$. Since the forgetful functor $\Top \to \Set$ is a left adjoint, it preserves pushouts. Hence, the underlying set of $W$ is the quotient of $Y \sqcup Y$ that identifies the two copies of each $z \in Z$ and nothing else (this is already an equivalence relation). So $u_1(y) = u_2(y)$ only holds for $y \in Z$, and we get $\varphi(T) \subseteq Z$. Let $t \in T$, let $z \coloneqq \varphi(t)$, and let $a \in \ker(i_z)$. After shrinking, $a$ is the germ of a section $s \in \O_Y(V)$ over an open neighborhood $V$ of $z$ such that $i^\sharp(s) = 0$ in $\O_Z(Z \cap V)$. Thus, $(s,0)$ is a section of $\O_W$ over $(V,V)$. Since $u_1 \circ \varphi$ and $u_2 \circ \varphi$ have the same sheaf map, the two composites
      $$\O_W(V,V) \rightrightarrows \O_Y(V) \xrightarrow{\varphi^\sharp} \O_T(\varphi^*(V))$$
      agree, so that $\varphi^\sharp(s) = \varphi^\sharp(0) = 0$. Taking germs at $t$, we get $\varphi_t(a) = \varphi_t(s_z) = \varphi^\sharp(s)_t = 0$. By the factorization criterion, $\varphi$ factors uniquely through $i$.
  regular epimorphisms:
    description: 'A morphism $(f,f^\sharp) : (X,\O_X) \to (Y,\O_Y)$ with kernel pair $p_1,p_2 : X \times_Y X \rightrightarrows X$ is a regular epimorphism iff $f : X \to Y$ is a surjective quotient map, $f^\sharp : \O_Y \to f_* \O_X$ is a monomorphism of sheaves, and for every open subset $V \subseteq Y$, every section $s \in \O_X(f^*(V))$ with $p_1^\sharp(s) = p_2^\sharp(s)$ lies in the image of $f^\sharp : \O_Y(V) \to \O_X(f^*(V))$. Moreover, a morphism $\Spec(\varphi) : \Spec(B) \to \Spec(A)$ of affine schemes is a regular epimorphism iff $\varphi : A \to B$ is a regular monomorphism in $\CAlg(R)$ and $\Spec(\varphi)$ is a surjective quotient map.'
    proof: >-
      We denote a morphism $(\varphi,\varphi^\sharp) : (T,\O_T) \to (X,\O_X)$ simply by $\varphi : T \to X$. Now let $f : X \to Y$ be a morphism. Since $\LRS_R$ is complete, $f$ has a kernel pair $p_1,p_2 : X \times_Y X \rightrightarrows X$, and by <a href="/content/regular-epis-kernel-pairs">this lemma</a>, $f$ is a regular epimorphism iff it is the coequalizer of $p_1,p_2$. Recall from the proof of cocompleteness that colimits in $\LRS_R$ are computed as in ringed spaces: the underlying space is the colimit of the underlying spaces, and the structure sheaf is the limit of the push-forwards of the structure sheaves. Hence, the coequalizer $q : X \to Q$ of $p_1,p_2$ looks as follows. The underlying space of $Q$ is the coequalizer of the underlying continuous maps of $p_1,p_2$, the structure sheaf is given by
      $$\O_Q(W) = \{s \in \O_X(q^*(W)) : p_1^\sharp(s) = p_2^\sharp(s)\}$$
      for open subsets $W \subseteq Q$, and $q^\sharp : \O_Q \to q_* \O_X$ is the inclusion. Let $c : Q \to Y$ be the unique morphism with $c \circ q = f$. Then $f$ is a regular epimorphism iff $c$ is an isomorphism.

      Since the forgetful functor $\LRS_R \to \Top$ preserves colimits, it preserves regular epimorphisms. So if $f$ is a regular epimorphism, then its underlying continuous map is a regular epimorphism of <a href="/category/Top">$\Top$</a>, i.e. a surjective quotient map. Assume from now on that $f$ is a surjective quotient map.

      Let $x_1,x_2 \in X$ with $f(x_1) = f(x_2)$. By the proof for monomorphisms (see above), there are a field $F$ and morphisms $\bar{x}_1,\bar{x}_2 : (\{\ast\},F) \rightrightarrows X$ with images $x_1,x_2$ and $f \circ \bar{x}_1 = f \circ \bar{x}_2$, where $(\{\ast\},F)$ is the one-point space with the ring $F$. The induced morphism $(\bar{x}_1,\bar{x}_2) : (\{\ast\},F) \to X \times_Y X$ maps the unique point of $(\{\ast\},F)$ to a point $t$ with $p_1(t) = x_1$ and $p_2(t) = x_2$. So every continuous map $g : X \to Z$ with $g \circ p_1 = g \circ p_2$ satisfies $g(x_1) = g(x_2)$. Since $f$ is a surjective quotient map, every such $g$ factors uniquely through $f$. Hence, on underlying spaces, both $f$ and $q$ are coequalizers of $p_1,p_2$ in $\Top$, so the underlying continuous map of $c$ is a homeomorphism.

      Consequently, $c$ is an isomorphism iff $c^\sharp : \O_Y \to c_* \O_Q$ is an isomorphism. For an open subset $V \subseteq Y$, we have $q^*(c^*(V)) = f^*(V)$ and therefore
      $$(c_* \O_Q)(V) = \{s \in \O_X(f^*(V)) : p_1^\sharp(s) = p_2^\sharp(s)\}.$$
      Since $c \circ q = f$ and $q^\sharp$ is the inclusion, $c^\sharp$ maps a section $b \in \O_Y(V)$ to $f^\sharp(b)$. Hence, $f$ is a regular epimorphism iff for every open subset $V \subseteq Y$, the map $f^\sharp : \O_Y(V) \to \O_X(f^*(V))$ is injective and its image is $(c_* \O_Q)(V)$. Since $f \circ p_1 = f \circ p_2$, the image is always contained in $(c_* \O_Q)(V)$, which proves the first statement.

      Finally, let $\varphi : A \to B$ be a homomorphism of commutative $R$-algebras, and let $f \coloneqq \Spec(\varphi) : X \to Y$ with $X \coloneqq \Spec(B)$ and $Y \coloneqq \Spec(A)$. Recall that $\Spec : \CAlg(R)^{\op} \to \LRS_R$ is fully faithful and right adjoint to the global sections functor. If $f$ is a regular epimorphism, then $f$ is a surjective quotient map by the above, and $\varphi$ is a regular monomorphism in $\CAlg(R)$, since the global sections functor $\LRS_R \to \CAlg(R)^{\op}$ is a left adjoint, hence preserves regular epimorphisms, and maps $f$ to $\varphi$. Conversely, assume these two conditions. Since $\Spec$ is a right adjoint, it maps the cokernel pair $u_1, u_2 : B \rightrightarrows B \otimes_A B$ of $\varphi$ to a kernel pair of $f$, so we may take $X \times_Y X = \Spec(B \otimes_A B)$ and $p_i = \Spec(u_i)$. By the above, we need to show that $f^\sharp : \O_Y(V) \to (c_* \O_Q)(V)$ is bijective for every open subset $V \subseteq Y$. Since $\O_Y$ and $c_* \O_Q$ are sheaves on $Y$, it suffices to check this for the basic open subsets $V = D(g)$ with $g \in A$, where it means that
      $$A_g \to B_g \rightrightarrows (B \otimes_A B)_g$$
      is an equalizer diagram. This is the localization at $g$ of the diagram $A \to B \rightrightarrows B \otimes_A B$, which is an equalizer diagram since $\varphi$ is the equalizer of its cokernel pair by the dual of <a href="/content/regular-epis-kernel-pairs">this lemma</a>. Since localization is exact, it preserves equalizers.
