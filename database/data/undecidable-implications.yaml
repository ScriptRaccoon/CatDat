# implications P ===> Q that can neither be proven nor refuted in ZFC
# (they are not used for deductions; duals are listed by hand)

category:
  - id: accessible_well-copowered_undecidable
    assumption: accessible
    conclusion: well-copowered
    proof: >-
      If <a href="https://en.wikipedia.org/wiki/Vop%C4%9Bnka%27s_principle">Vopěnka's principle</a> holds, then every accessible category is well-copowered (<a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Cor. 6.8). Hence, if Vopěnka's principle is consistent with ZFC, ZFC does not prove that some accessible category is not well-copowered. Conversely, if every accessible category is well-copowered, then there are arbitrarily large <a href="https://en.wikipedia.org/wiki/Measurable_cardinal">measurable cardinals</a> (<a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Example A.19). Since it is consistent with ZFC that there are no measurable cardinals (for example, there are none in Gödel's <a href="https://en.wikipedia.org/wiki/Constructible_universe">constructible universe</a> $L$), ZFC does not prove either that every accessible category is well-copowered. See also <a href="https://mathoverflow.net/questions/323744">MO/323744</a> and the section on well-copoweredness at the <a href="https://ncatlab.org/nlab/show/accessible+category">nLab</a>.

  - id: coaccessible_well-powered_undecidable
    assumption: coaccessible
    conclusion: well-powered
    proof: >-
      By duality, this is equivalent to the <a href="/category-implications?proof=accessible_well-copowered_undecidable">undecidable implication</a> that every accessible category is well-copowered.

  - id: finitely_accessible_well-copowered_undecidable
    assumption: finitely accessible
    conclusion: well-copowered
    proof: >-
      This proof is written so that it can also be followed by readers who are not experts in model theory. In a nutshell, we build a finitely accessible category of models of a set-theoretic theory, in which the models built from the levels $V_\gamma$ of the set-theoretic universe admit at most one morphism into any object if there is no measurable cardinal. Then the inclusion of the countable substructure generated by the constants is an epimorphism, and some countable object has a collection of pairwise non-isomorphic quotients of this form that is not essentially small.

      If <a href="https://en.wikipedia.org/wiki/Vop%C4%9Bnka%27s_principle">Vopěnka's principle</a> holds, then every accessible category is well-copowered (<a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Cor. 6.8), hence every finitely accessible category is well-copowered. Therefore, if Vopěnka's principle is consistent with ZFC, ZFC does not prove that some finitely accessible category is not well-copowered. Conversely, we show below that if there is no <a href="https://en.wikipedia.org/wiki/Measurable_cardinal">measurable cardinal</a>, then some finitely accessible category is not well-copowered. Since it is consistent with ZFC that there are no measurable cardinals (for example, there are none in Gödel's <a href="https://en.wikipedia.org/wiki/Constructible_universe">constructible universe</a> $L$), ZFC does not prove either that every finitely accessible category is well-copowered.

      <strong>Construction.</strong> Let $\L_0$ be the language with a binary relation symbol $\in$ and constant symbols $c_\omega$ and $c_n$ for $n < \omega$. Let $\L$ be the countable language that expands $\L_0$ by a $k$-ary relation symbol $R_\varphi$ for each $\L_0$-formula $\varphi$ with free variables among $\bar{x} = (x_1,\dotsc,x_k)$, and by a $k$-ary function symbol $f_\varphi$ for each $\L_0$-formula $\varphi$ with free variables among $(\bar{x},y)$. (We regard $\vee$, $\to$, and $\forall$ as abbreviations.) Let $T$ be the $\L$-theory whose axioms are the universal closures of the following formulas:
      <ol>
      <li>$R_\varphi(\bar{x}) \leftrightarrow \varphi(\bar{x})$ for every atomic $\L_0$-formula $\varphi$,</li>
      <li>$R_{\neg \varphi}(\bar{x}) \leftrightarrow \neg R_\varphi(\bar{x})$ and $R_{\varphi \wedge \psi}(\bar{x}) \leftrightarrow R_\varphi(\bar{x}) \wedge R_\psi(\bar{x})$,</li>
      <li>$R_\varphi(\bar{x},y) \to R_{\exists y \varphi}(\bar{x})$ and $R_{\exists y \varphi}(\bar{x}) \to R_\varphi(\bar{x},f_\varphi(\bar{x}))$,</li>
      <li>$R_\varepsilon$, where $\varepsilon$ is the axiom of extensionality.</li>
      </ol>
      This combines two standard techniques of model theory, Morleyization (the relations $R_\varphi$) and Skolemization (the functions $f_\varphi$). Since these formulas contain no quantifiers, all axioms are universal.

      Let $M$ be a model of $T$. Every $\L_0$-formula $\varphi$ is built from atomic $\L_0$-formulas using $\neg$, $\wedge$, and $\exists$, so by induction on this construction, using axioms 1–3, the interpretation of $R_\varphi$ in $M$ consists of the tuples that satisfy $\varphi$ in the $\L_0$-reduct of $M$. By axiom 3, $f_\varphi$ is then a Skolem function for $\varphi$, that is, if the $\L_0$-reduct of $M$ satisfies $\exists y \varphi(\bar{a},y)$, then it satisfies $\varphi(\bar{a},f_\varphi(\bar{a}))$. By axiom 4, the $\L_0$-reduct of $M$ satisfies extensionality.

      For a model $M$ of $T$, we write $\in_M$ for the interpretation of $\in$ in $M$. We say that $M$ is <i>$\omega$-standard</i> if every element $m$ of $M$ with $m \in_M c_\omega^M$ is equal to $c_n^M$ for some $n < \omega$. (We do not require the converse $c_n^M \in_M c_\omega^M$, since it is not needed below.) Let $\K$ be the category of $\omega$-standard models of $T$, whose morphisms are the homomorphisms of $\L$-structures, i.e., the maps that preserve constants, functions, and relations. A morphism $h : M \to N$ of $\K$ preserves $R_{\neg(x_1 = x_2)}$ and every $R_{\neg \varphi}$, so $h$ is injective and reflects every relation $R_\varphi$. Thus $h$ is an elementary embedding of the $\L_0$-reducts.

      Every substructure $M'$ of an object $M$ of $\K$ is a model of $T$, since $T$ is universal, and $M'$ is $\omega$-standard, since it contains the constants $c_n^M$, and the relation $\in_{M'}$ is the restriction of $\in_M$. Hence $M'$ is an object of $\K$, and the inclusion $M' \hookrightarrow M$ is a morphism.

      <strong>Claim 1.</strong> $\K$ has filtered colimits.

      Let $D : \I \to \K$ be a filtered diagram. Choose a colimit cocone $(u_i : |D(i)| \to C)_{i \in \I}$ of the underlying sets $|D(i)|$. Since $\I$ is filtered, every finite family of elements of $C$ lies in some $\im(u_i)$, and since all morphisms of $\K$ are injective, every $u_i$ is injective. Since the transition maps preserve and reflect all relations, there is a unique $\L$-structure on $C$ such that every $u_i$ preserves and reflects all relations and preserves constants and functions: a relation holds for a finite tuple if and only if it holds for a preimage of the tuple in some $D(i)$, and functions are computed in some $D(i)$. In particular, every $u_i : D(i) \to C$ is a homomorphism by construction. Then $C$ is a model of $T$, since $T$ is universal and every finite tuple of $C$ comes from some $D(i)$. Moreover, $C$ is $\omega$-standard: if $m \in_C c_\omega^C$, write $m = u_i(m')$; then $m' \in_{D(i)} c_\omega^{D(i)}$, so $m' = c_n^{D(i)}$ for some $n$, and hence $m = c_n^C$. For every cocone $(v_i : D(i) \to N)_{i \in \I}$ in $\K$, the induced map $v : C \to N$ is a homomorphism, since every finite tuple of $C$ comes from some $D(i)$. Thus $C$ is a colimit of $D$ in $\K$.

      <strong>Claim 2.</strong> $\K$ is finitely accessible.

      First, every finitely generated object $A$ of $\K$ is finitely presentable. Let $a_1,\dotsc,a_k$ generate $A$ (i.e., $A$ is the only substructure containing them), and let $h : A \to C$ be a morphism into the colimit $C$ of a filtered diagram $D$, constructed as in the proof of Claim 1. There is some $i$ such that $h(a_1),\dotsc,h(a_k) \in \im(u_i)$. Since $\im(u_i)$ is a substructure of $C$ and $h(A)$ is the substructure generated by $h(a_1),\dotsc,h(a_k)$, we have $h(A) \subseteq \im(u_i)$. Since $u_i$ is injective and reflects all relations, $h = u_i \circ h'$ for a morphism $h' : A \to D(i)$. If two morphisms $h' : A \to D(i)$ and $h'' : A \to D(i')$ satisfy $u_i \circ h' = u_{i'} \circ h''$, choose morphisms $i \to l$ and $i' \to l$ in $\I$; then the composites $A \to D(l)$ agree after composition with the injective map $u_l$, so they agree. Thus $\Hom(A,-)$ preserves filtered colimits.

      Next, every object of $\K$ is the directed union, hence the filtered colimit (by the construction in the proof of Claim 1), of its finitely generated substructures, which are finitely presentable. Since $\L$ is countable, every finitely generated object is countable, hence isomorphic to an object whose underlying set is a subset of $\IN$, and these objects form a set. This proves Claim 2.

      For every limit ordinal $\gamma > \omega$, let $A_\gamma$ be the following expansion of $(V_\gamma,\in)$, where $V_\gamma$ is the $\gamma$-th level of the <a href="https://en.wikipedia.org/wiki/Von_Neumann_universe">von Neumann hierarchy</a>, to a model of $T$: let $c_\omega \coloneqq \omega$ and $c_n \coloneqq n$, let $R_\varphi$ consist of the tuples $\bar{x}$ with $(V_\gamma,\in) \models \varphi(\bar{x})$, and, using a well-order of $V_\gamma$, let $f_\varphi(\bar{x})$ be the least $y$ with $(V_\gamma,\in) \models \varphi(\bar{x},y)$ if there is one, and $\varnothing$ otherwise. Axioms 1–3 hold by the definition of satisfaction, and axiom 4 holds since $V_\gamma$ is transitive. Moreover, $A_\gamma$ is $\omega$-standard, since the elements of $c_\omega = \omega$ are the natural numbers $n = c_n$, so it is an object of $\K$. Since $\gamma > \omega$ is a limit ordinal, for every $x \in V_\gamma$, every subset of $x$ and every map $\omega \to P(x)$ lies in $V_\gamma$.

      <strong>Claim 3.</strong> Assume that there is no measurable cardinal. Let $j : A_\gamma \to M$ be a morphism of $\K$ and $x \in V_\gamma$. Then the elements $m$ of $M$ with $m \in_M j(x)$ are exactly the elements $j(y)$ with $y \in x$.

      Since $j$ preserves $\in$, we have $j(y) \in_M j(x)$ for $y \in x$. Assume, for a contradiction, that there is an element $m$ of $M$ with $m \in_M j(x)$ and $m \neq j(y)$ for all $y \in x$. Let
      $$\U \coloneqq \{S \subseteq x : m \in_M j(S)\}.$$

      Let $S,S' \subseteq x$. We use that $j$ is an elementary embedding of the $\L_0$-reducts as follows. The $\L_0$-formula $\forall z \, (z \in w \leftrightarrow z \in u \wedge z \in v)$ holds in $V_\gamma$ for $(u,v,w) = (S,S',S \cap S')$, hence in $M$ for $(u,v,w) = (j(S),j(S'),j(S \cap S'))$. Here, $\forall z$ ranges over all elements of $M$, not only over those in the image of $j$. So the $M$-elements of $j(S \cap S')$ are exactly the common $M$-elements of $j(S)$ and $j(S')$. In the same way, the $M$-elements of $j(x \setminus S)$ are the $M$-elements of $j(x)$ that are not $M$-elements of $j(S)$; if $S \subseteq S'$, then every $M$-element of $j(S)$ is an $M$-element of $j(S')$; and for $y \in x$, the only $M$-element of $j(\{y\})$ is $j(y)$. Since $m \in_M j(x)$, it follows that $\U$ is an ultrafilter on $x$. It is non-principal, since $j(y) \neq m$ implies $\{y\} \notin \U$ for $y \in x$.

      We claim that for every partition $(S_n)_{n < \omega}$ of $x$ into non-empty subsets, some $S_n$ lies in $\U$. The map $s : \omega \to P(x)$, $n \mapsto S_n$, regarded as a set of pairs as usual, lies in $V_\gamma$. Using Kuratowski pairs $(n,S) = \{\{n\},\{n,S\}\}$, the statement $z \in s(n)$ is expressed by an $\L_0$-formula in $z$, $n$, and $s$. In $V_\gamma$, every $z \in x$ is an element of $s(n)$ for some $n \in c_\omega$, and the elements of $s(c_n)$ are the elements of $S_n$ for all $n < \omega$. As before, using that $j$ is elementary, $M$ satisfies the same statements for $j(x)$, $j(s)$, and $j(S_n)$. Since $m \in_M j(x)$, there is an element $m'$ of $M$ with $m' \in_M c_\omega^M$ such that $m$ is an $M$-element of $j(s)(m')$, in the sense of this formula. Since $M$ is $\omega$-standard, $m' = c_n^M$ for some $n < \omega$, and therefore $m \in_M j(S_n)$, i.e., $S_n \in \U$.

      Let $\kappa$ be the least cardinal such that there is a partition $(P_\alpha)_{\alpha < \kappa}$ of $x$ into non-empty subsets, none of which lies in $\U$. It exists because the partition into singletons has this property, and $\kappa$ is infinite since $\U$ is an ultrafilter, and uncountable by the previous paragraph. Let $p : x \to \kappa$ map each element to the index $\alpha$ of the subset $P_\alpha$ containing it, and let $\F \coloneqq \{Y \subseteq \kappa : p^*(Y) \in \U\}$. Then $\F$ is an ultrafilter on $\kappa$, which is non-principal since $p^*(\{\alpha\}) = P_\alpha \notin \U$. It is $\kappa$-complete: a partition of $\kappa$ into fewer than $\kappa$ non-empty subsets pulls back along the surjective map $p$ to a partition of $x$ into fewer than $\kappa$ non-empty subsets, one of which lies in $\U$ by the minimality of $\kappa$. Hence $\kappa$ is a measurable cardinal, which is a contradiction.

      <strong>Claim 4.</strong> Assume that there is no measurable cardinal. Then for every object $M$ of $\K$, there is at most one morphism $A_\gamma \to M$.

      Let $j,k : A_\gamma \rightrightarrows M$ be two morphisms. We show $j(x) = k(x)$ for all $x \in V_\gamma$ by $\in$-induction. By Claim 3 and the induction hypothesis, the $M$-elements of $j(x)$ are the elements $j(y) = k(y)$ with $y \in x$, which are the $M$-elements of $k(x)$. Since $M$ satisfies extensionality, $j(x) = k(x)$.

      <strong>Claim 5.</strong> Assume that there is no measurable cardinal. Then $\K$ is not well-copowered.

      For every limit ordinal $\gamma > \omega$, let $B_\gamma$ be the substructure of $A_\gamma$ generated by $\varnothing$. By Claim 4, the inclusion $B_\gamma \hookrightarrow A_\gamma$ is an epimorphism in $\K$. For limit ordinals $\gamma \neq \delta$, the objects $A_\gamma$ and $A_\delta$ are not isomorphic: an isomorphism $h : A_\gamma \to A_\delta$ restricts to an isomorphism $(V_\gamma,\in) \to (V_\delta,\in)$, so $h(x) = \{h(y) : y \in x\}$ for all $x \in V_\gamma$, since $V_\delta$ is transitive, and by $\in$-induction, $h(x) = x$ for all $x$, and therefore $V_\gamma = V_\delta$, a contradiction. Every $B_\gamma$ is countable, and the countable objects of $\K$ form only a set of isomorphism classes, whereas the collection of limit ordinals $\gamma > \omega$ is not essentially small. Hence there is a countable object $B$ such that $B \cong B_\gamma$ for a collection of limit ordinals $\gamma$ that is not essentially small. The resulting epimorphisms $B \cong B_\gamma \hookrightarrow A_\gamma$ are pairwise non-isomorphic quotients of $B$, so $\K$ is not well-copowered.

      <strong>Remark.</strong> Another finitely accessible category that is not well-copowered if there is no measurable cardinal is constructed at <a href="https://mathoverflow.net/a/518069">MO/515681</a>, without using model theory. The proof there is based on a theorem (<a href="https://doi.org/10.1215/ijm/1255456274">Isbell</a>, 2.5) which states that there is no measurable cardinal if and only if the functor $\Set^{\op} \to \End(\IN){-}\Set$, $X \mapsto \IN^X$ is fully faithful.

  - id: finitely_coaccessible_well-powered_undecidable
    assumption: finitely coaccessible
    conclusion: well-powered
    proof: >-
      By duality, this is equivalent to the <a href="/category-implications?proof=finitely_accessible_well-copowered_undecidable">undecidable implication</a> that every finitely accessible category is well-copowered.

  - id: aleph1-accessible_well-copowered_undecidable
    assumption: ℵ₁-accessible
    conclusion: well-copowered
    proof: >-
      We show more generally that for every regular cardinal $\kappa$, ZFC neither proves nor refutes that every $\kappa$-accessible category is well-copowered; here we only need the case $\kappa = \aleph_1$. If <a href="https://en.wikipedia.org/wiki/Vop%C4%9Bnka%27s_principle">Vopěnka's principle</a> holds, then every accessible category is well-copowered (<a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Cor. 6.8), hence every $\kappa$-accessible category is well-copowered. Therefore, if Vopěnka's principle is consistent with ZFC, ZFC does not prove that some $\kappa$-accessible category is not well-copowered. Conversely, every finitely accessible category is $\kappa$-accessible, which follows from <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Thm. 2.11 (iii), and if there is no <a href="https://en.wikipedia.org/wiki/Measurable_cardinal">measurable cardinal</a>, then some finitely accessible category is not well-copowered (<a href="/category-implications?proof=finitely_accessible_well-copowered_undecidable">proof</a>). Since it is consistent with ZFC that there are no measurable cardinals, ZFC does not prove that every $\kappa$-accessible category is well-copowered.

  - id: aleph1-coaccessible_well-powered_undecidable
    assumption: ℵ₁-coaccessible
    conclusion: well-powered
    proof: >-
      By duality, this is equivalent to the <a href="/category-implications?proof=aleph1-accessible_well-copowered_undecidable">undecidable implication</a> that every $\aleph_1$-accessible category is well-copowered.
