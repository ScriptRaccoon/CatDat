id: co-Malcev
relation: is
description: >-
  A category is <i>co-Malcev</i> when its dual is Malcev, i.e. when it has finite colimits and every internal coreflexive corelation is an internal equivalence corelation. That is, if $j_1, j_2 : X \rightrightarrows C$ is a jointly epimorphic pair with a common retraction $C \to X$, then $j_1, j_2$ is also cosymmetric and cotransitive, i.e. a <a href="/category-property/coquotients_of_cocongruences">cocongruence</a>.

  This terminology is not standard, but we have added it to properly formulate the interesting theorem that the dual of an elementary topos is Malcev, i.e., that every elementary topos is co-Malcev.

  Remark: If $\D$ has this property, $\C$ has finite colimits, and $U : \C \to \D$ is a fully faithful functor that preserves finite colimits, then $\C$ has this property as well. To settle this property, we often use that $\C$ is co-Malcev if and only if the category of representable functors $\C \to \Set^+$ is Malcev.
