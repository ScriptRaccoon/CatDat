id: directed limits
relation: has
description: A category has <i>directed limits</i> if it has limits of diagrams indexed by codirected posets. This is actually equivalent to having cofiltered limits. Directed limits are also known as <i>inverse limits</i> or <i>projective limits</i>.
nlab_link: https://ncatlab.org/nlab/show/directed+limit
dual: directed colimits
invariant_under_equivalences: true

keywords:
