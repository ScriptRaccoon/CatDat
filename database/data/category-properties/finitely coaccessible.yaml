id: finitely coaccessible
relation: is
description: A category is <i>finitely coaccessible</i> if its opposite category is finitely accessible. That is, it has cofiltered limits and there is an essentially small collection $G$ of finitely copresentable objects such that every object is a cofiltered limit of objects in $G$.
