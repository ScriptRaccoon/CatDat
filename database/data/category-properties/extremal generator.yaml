id: extremal generator
relation: has an
description: >-
  An object $G$ of a category is called an <i>extremal generator</i> if it is a generator and for every morphism $f : A \to B$, if $f\circ{-} : \Hom(G,A)\to\Hom(G,B)$ is a bijection, then $f$ is an isomorphism. Equivalently, the functor $\Hom(G,-) : \C \to \Set^+$ is faithful and conservative. This property refers to the existence of an extremal generator.

  In a locally essentially small category with small coproducts, it is also equivalent to the condition that the canonical morphism
  $$\textstyle\bigsqcup_{f\in\Hom(G,A)} G \to A$$
  is an extremal epimorphism for every object $A$, explaining the terminology (see Prop. 5.3 at the <a href="https://ncatlab.org/nlab/show/separator" target="_blank">nLab</a>).

  By definition, $G$ is an extremal generator if and only if $\{G\}$ is an <a href="/category-property/extremal_generating_set">extremal generating set</a>.
