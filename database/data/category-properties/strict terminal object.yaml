id: strict terminal object
relation: has a
description: A <i>strict terminal object</i> of a category $\C$ is a terminal object $1$ such that every morphism $1 \to A$ is an isomorphism. Equivalently, the coslice category $1/\C$ is <a href="/category-property/trivial">trivial</a>. This property refers to the existence of a strict terminal object.
nlab_link: https://ncatlab.org/nlab/show/strict+terminal+object
dual: strict initial object
invariant_under_equivalences: true

