id: all monomorphisms split
relation: has
description: >-
  A category <i>has all monomorphisms split</i> if every monomorphism $i : X \to Y$ is split, i.e. there is a morphism $r : Y \to X$ with $r \circ i = \id_X$.
nlab_link: https://ncatlab.org/nlab/show/split+monomorphism
dual: all epimorphisms split
invariant_under_equivalences: true
keywords:
  - split monomorphism

related:
  - mono-regular
  - retract-trivial
  - split abelian

tags:
  - morphism behavior
