id: cocartesian cofiltered limits
relation: has
description: >-
  In a category $\C$, which we assume to have cofiltered limits and finite coproducts, we say that <i>cofiltered limits are cocartesian</i> if for every finite set $I$ the coproduct functor $\coprod : \C^I \to \C$ preserves cofiltered limits. Equivalently, for every $X \in \C$ the functor $X \sqcup - : \C \to \C$ preserves cofiltered limits.

  This is not standard terminology; its dual has been suggested in <a href="https://mathoverflow.net/questions/510240">MO/510240</a>. We have added it to the database since it clarifies the relationship between many related properties.

  Remark: If $\D$ has this property, $\C$ has cofiltered limits and finite coproducts, and $U : \C \to \D$ is a conservative (e.g. fully faithful) functor that preserves cofiltered limits and binary coproducts, then $\C$ has this property as well.
nlab_link: null
dual: cartesian filtered colimits
invariant_under_equivalences: true

