id: extensive
relation: is
description: >-
  A category $\C$ is <i>extensive</i> when it has finite coproducts and, for every finite family of objects $(A_i)_{i \in I}$, the coproduct functor
  $$\textstyle \prod_{i \in I} (\C/A_i) \to \C/(\coprod_{i \in I} A_i),$$
  which maps a family of morphisms $(X_i \to A_i)_{i \in I}$ to their coproduct $\coprod_{i \in I} X_i \to \coprod_{i \in I} A_i$, is an equivalence of categories. By <a href="/category-implication/extensive_characterization">this result</a>, this is equivalent to $\C$ having <a href="/category-property/pullback-stable_finite_coproducts">pullback-stable finite coproducts</a> and <a href="/category-property/disjoint_finite_coproducts">disjoint finite coproducts</a>.

  In the literature, the definition usually only requires this for binary coproducts, which is equivalent by <a href="/content/extensive-characterization#corollary">this corollary</a>. We use finite families to match the definitions of <a href="/category-property/countably_extensive">countably extensive</a> and <a href="/category-property/infinitary_extensive">infinitary extensive</a> categories.

  Remark: If $\D$ has this property, $\C$ has finite coproducts and pullbacks along coproduct inclusions, and $U : \C \to \D$ is a conservative (e.g. fully faithful) functor that preserves both, then $\C$ has this property as well.
nlab_link: https://ncatlab.org/nlab/show/extensive+category
dual: coextensive
invariant_under_equivalences: true

