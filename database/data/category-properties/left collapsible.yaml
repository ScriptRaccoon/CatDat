id: left collapsible
relation: is
description: >-
  We call a category <i>left collapsible</i> if every parallel pair $f,g : X \rightrightarrows Y$ is coequalized by some morphism, i.e. there is a morphism $h : Y \to Z$ with $h \circ f = h \circ g$ (not necessarily universal).

  By induction, every finite family of parallel morphisms $f_1,\dotsc,f_n : X \to Y$ is then coequalized by some morphism: if $h : Y \to Z$ coequalizes $f_1,\dotsc,f_{n-1}$ and $k : Z \to Z'$ coequalizes $h \circ f_{n-1}, h \circ f_n$, then $k \circ h$ coequalizes $f_1,\dotsc,f_n$.

  This is one of the conditions in the definition of a <a href="/category-property/filtered">filtered</a> category: a category is filtered if and only if it is <a href="/category-property/discretely filtered">discretely filtered</a> and left collapsible.

  A monoid $M$, regarded as a one-object category, is left collapsible if and only if for all $a,b \in M$ there is some $m \in M$ with $m a = m b$. The terminology comes from semigroup theory, see <a href="https://arxiv.org/abs/2112.10198">Rogers</a>, Def. 2.2.47.
