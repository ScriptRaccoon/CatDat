id: multi-initial object
relation: has a
description: A category has a <i>multi-initial object</i> if the empty diagram has a multi-colimit. That is, there is an essentially small collection of objects $\I$ such that for every object $Y$ there is a unique object $X \in \I$ with a unique morphism $X \to Y$. A category has a multi-initial object if and only if the collection of its connected components is essentially small and each connected component has an initial object.
nlab_link: https://ncatlab.org/nlab/show/multilimit
dual: multi-terminal object
invariant_under_equivalences: true

