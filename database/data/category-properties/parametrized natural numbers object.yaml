id: parametrized natural numbers object
relation: has a
description: >-
  A <i>parametrized natural numbers object</i> in a category with finite products is a triple
  $$(N,\, z : 1 \to N,\, s : N \to N)$$
  satisfying the following universal property: for all $f : A \to X$, $g : X \to X$ there is a unique $\Phi : A \times N \to X$ such that the diagram
  $$\begin{CD}
  A \times 1 @>{\id_A \times z}>> A \times N @>{\id_A \times s}>> A \times N \\
  @V{p_1}V{\sim}V @V{\Phi} VV @VV{\Phi}V \\
  A @>>{f}> X @>>{g}> X
  \end{CD}$$
  commutes. In element notation, this means $\Phi(a,z)=f(a)$ and $\Phi(a,s(n)) = g(\Phi(a,n))$.

  This concept is an abstraction of the set of natural numbers, which indeed provides a parametrized natural numbers object for the category of sets. If we specialize the universal property to $A=1$, we get the notion of a <a href="/category-property/natural_numbers_object">natural numbers object</a>. The parametrized version is more natural (sic!) for categories that are not cartesian closed (cf. <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant">Johnstone</a>, Part A, Remark 2.5.3).
nlab_link: https://ncatlab.org/nlab/show/natural+numbers+object
dual: coparametrized conatural numbers object
invariant_under_equivalences: true

