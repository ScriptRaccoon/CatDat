id: quasicotopos
relation: is a
description: >-
  A <i>quasicotopos</i> is a category whose opposite is a quasitopos. This means that it is finitely complete, finitely cocomplete, locally cocartesian coclosed, and has a regular quotient object classifier. This terminology is not standard.
