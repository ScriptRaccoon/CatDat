id: multi-terminal object
relation: has a
description: A category has a <i>multi-terminal object</i> if the empty diagram has a multi-limit. That is, there is an essentially small collection of objects $\I$ such that for every object $Y$ there is a unique object $X \in \I$ with a unique morphism $Y \to X$. A category has a multi-terminal object if and only if the collection of its connected components is essentially small and each connected component has a terminal object.
nlab_link: https://ncatlab.org/nlab/show/multilimit
dual: multi-initial object
invariant_under_equivalences: true

