id: filtered-colimit-stable monomorphisms
relation: has
description: >-
  A category has <i>filtered-colimit-stable monomorphisms</i> if it has filtered colimits and for every filtered diagram of monomorphisms $(X_i \to Y_i)$ also their colimit $\colim_i X_i \to \colim_i Y_i$ is a monomorphism.

  Remark: If $\D$ has this property, $\C$ has filtered colimits, and $U : \C \to \D$ is a faithful functor that preserves monomorphisms and filtered colimits, then $\C$ has this property as well.
nlab_link: null
dual: cofiltered-limit-stable epimorphisms
invariant_under_equivalences: true

