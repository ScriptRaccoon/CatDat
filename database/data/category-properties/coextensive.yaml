id: coextensive
relation: is
description: >-
  A category $\C$ is <i>coextensive</i> when it has finite products and for all objects $A,B \in \C$ the product functor $A/\C \times B/\C \to (A \times B)/\C$ is an equivalence of categories. Equivalently (by using the characterization of extensive categories), pushouts along binary product projections exist, binary products are <a href="/category-property/disjoint_finite_products">disjoint</a>, and binary products are <a href="/category-property/pushout-stable_binary_products">stable under pushouts</a>. The prototypical example is the category of commutative rings.

  Remark: If $\D$ has this property, $\C$ has finite products and pushouts along product projections, and $U : \C \to \D$ is a conservative (e.g. fully faithful) functor that preserves both, then $\C$ has this property as well.
