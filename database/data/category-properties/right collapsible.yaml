id: right collapsible
relation: is
description: >-
  We call a category <i>right collapsible</i> if every parallel pair $f,g : X \rightrightarrows Y$ is equalized by some morphism, i.e. there is a morphism $h : Z \to X$ with $f \circ h = g \circ h$ (not necessarily universal).

  By induction, every finite family of parallel morphisms $f_1,\dotsc,f_n : X \to Y$ is then equalized by some morphism: if $h : Z \to X$ equalizes $f_1,\dotsc,f_{n-1}$ and $k : Z' \to Z$ equalizes $f_{n-1} \circ h, f_n \circ h$, then $h \circ k$ equalizes $f_1,\dotsc,f_n$.

  This is one of the conditions in the definition of a <a href="/category-property/cofiltered">cofiltered</a> category: a category is cofiltered if and only if it is <a href="/category-property/discretely cofiltered">discretely cofiltered</a> and right collapsible.

  A monoid $M$, regarded as a one-object category, is right collapsible if and only if for all $a,b \in M$ there is some $m \in M$ with $a m = b m$. The terminology comes from semigroup theory, see <a href="https://arxiv.org/abs/2112.10198">Rogers</a>, Def. 2.2.47.
