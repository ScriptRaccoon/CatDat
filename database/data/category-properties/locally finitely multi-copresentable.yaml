id: locally finitely multi-copresentable
relation: is
description: A category is <i>locally finitely multi-copresentable</i> if its opposite category is locally finitely multi-presentable. Equivalently, it is finitely coaccessible and multi-complete. This is also equivalent to being finitely coaccessible and having connected colimits.
