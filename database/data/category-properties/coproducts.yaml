id: coproducts
relation: has
description: 'Given a family of objects $(A_i)_{i \in I}$, a <i>coproduct</i> $\coprod_{i \in I} A_i$ is defined as an object with morphisms $i_i : A_i \to \coprod_{i \in I} A_i$ satisfying the following universal property: For every object $T$ and every family of morphisms $(f_i : A_i \to T)_{i \in I}$ there is a unique morphism $f : \coprod_{i \in I} A_i \to T$ such that $f \circ i_i = f_i$ for all $i \in I$. We say that a category has <i>coproducts</i> if every small family $(A_i)_{i \in I}$ (i.e., $I$ is a set) has a coproduct.'
nlab_link: https://ncatlab.org/nlab/show/coproduct
dual: products
invariant_under_equivalences: true

