id: cogenerator
relation: has a
description: >-
  This property refers to the existence of a cogenerator. An object $Q$ of a category $\C$ is called a <i>cogenerator</i> if for all parallel morphisms $f,g : A \rightrightarrows B$ such that $h \circ f = h \circ g$ for every morphism $h : B \to Q$, we have $f = g$. Equivalently, the functor
  $$\Hom(-,Q) : \C^{\op} \to \Set^+$$
  is faithful. By definition, $Q$ is a cogenerator if and only if $\{Q\}$ is a <a href="/category-property/cogenerating_collection">cogenerating collection</a>.
nlab_link: https://ncatlab.org/nlab/show/cogenerator
dual: generator
invariant_under_equivalences: true

