id: binary CIP
relation: satisfies
description: >-
  A category satisfies <i>binary CIP</i> ("binary coproducts inject into products") if it has zero morphisms, binary products, binary coproducts, and for all objects $X,Y$ the canonical morphism
  $$\alpha : X \sqcup Y \to X \times Y$$
  defined by $\alpha \circ \iota_X = (\id_X,0)$ and $\alpha \circ \iota_Y = (0,\id_Y)$ is a monomorphism.
  This is not standard terminology. This property has been added to clarify relationships between other properties, in particular those concerning the commutation between limits and colimits.

  If the category also has a zero object, then for every finite family of objects $X_1,\dotsc,X_n$ the canonical morphism $\mu_n : X_1 \sqcup \cdots \sqcup X_n \to X_1 \times \cdots \times X_n$ is a monomorphism. For $n \leq 1$ it is an identity, and for $n \geq 2$ this follows by induction, since
  $$\mu_n = (\mu_{n-1} \times \id_{X_n}) \circ \alpha$$
  with $\alpha : (X_1 \sqcup \cdots \sqcup X_{n-1}) \sqcup X_n \to (X_1 \sqcup \cdots \sqcup X_{n-1}) \times X_n$, and products of monomorphisms are monomorphisms.
