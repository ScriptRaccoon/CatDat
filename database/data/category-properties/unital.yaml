id: unital
relation: is
description: 'A category is <i>unital</i> if it has a zero object, finite limits, and for all objects $X,Y$ the two morphisms $(\id_X,0) : X \hookrightarrow X \times Y$ and $(0,\id_Y) : Y \hookrightarrow X \times Y$ are jointly strongly epimorphic. Since finite limits exist, this means that they are jointly epimorphic and that every monomorphism into $X \times Y$ through which both factor is an isomorphism, i.e. there is no proper subobject of $X \times Y$ that contains $X$ and $Y$. Here, the second condition already implies the first, since equalizers exist. When binary coproducts exist, the canonical morphism $X \sqcup Y \to X \times Y$ therefore must be a <a href="https://ncatlab.org/nlab/show/strong+epimorphism">strong epimorphism</a>.'
nlab_link: https://ncatlab.org/nlab/show/unital+category
dual: counital
invariant_under_equivalences: true

