id: Grothendieck quasitopos
relation: is a
description: A <i>Grothendieck quasitopos</i> is a category that is equivalent to the category of biseparated presheaves on a bisite, i.e. sheaves on a site that are also separated with respect to a second Grothendieck topology on the same category.
