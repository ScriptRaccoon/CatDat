id: Grothendieck quasitopos
relation: is a
description: A <i>Grothendieck quasitopos</i> is a category that is equivalent to the category $\BiSep(\C, J, K)$ of biseparated presheaves on a bisite $(\C, J, K)$, i.e. to the category of $K$-separated $J$-sheaves on $\C$ where $J$ and $K$ are Grothendieck topologies on $\C$ such that $J\subset K$. Equivalently, a category is a Grothendieck quasitopos if and only if it is equivalent to the full subcategory of separated objects for a <a href="https://ncatlab.org/nlab/show/Lawvere-Tierney+topology" target="_blank">Lawvere-Tierney topology</a> on a Grothendieck topos. For the equivalence, see <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, C2.2.13.
nlab_link: https://ncatlab.org/nlab/show/Grothendieck+quasitopos
dual: Grothendieck quasicotopos
invariant_under_equivalences: true

