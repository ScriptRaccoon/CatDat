id: countably coextensive
relation: is
description: >-
  A category $\C$ is <i>countably coextensive</i> if it has countable products and, for every countable family of objects $(A_i)_{i \in I}$, the product functor
  $$\textstyle \prod_{i \in I} (A_i/\C) \to (\prod_{i \in I} A_i) / \C,$$
  which maps a family of morphisms $(A_i \to X_i)_{i \in I}$ to their product $\prod_{i \in I} A_i \to \prod_{i \in I} X_i$, is an equivalence of categories. By <a href="/category-implication/dual_countably_extensive_characterization">this result</a>, this is equivalent to $\C$ having <a href="/category-property/pushout-stable_countable_products">pushout-stable countable products</a> and <a href="/category-property/disjoint_finite_products">disjoint finite products</a>.

  The only difference between this property and the property of being <a href="/category-property/infinitary_coextensive">infinitary coextensive</a> is that we restrict ourselves to countable families.

  Remark: If $\D$ has this property, $\C$ has countable products and pushouts along product projections, and $U : \C \to \D$ is a conservative (e.g. fully faithful) functor that preserves both, then $\C$ has this property as well.
