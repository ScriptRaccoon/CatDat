id: pushout-stable countable products
relation: has
description: >-
  A category $\C$ has <i>pushout-stable countable products</i> if it has countable products and, for every countable family of objects $(A_i)_{i \in I}$ and every morphism $\prod_{i \in I} A_i \to T$, the pushouts $T_i \coloneqq T \sqcup_{\prod_{i \in I} A_i} A_i$ exist and the canonical morphism $T \to \prod_{i \in I} T_i$ is an isomorphism.
nlab_link: null
dual: pullback-stable countable coproducts
invariant_under_equivalences: true
keywords:
  - couniversal countable products

