id: effective cocongruences
relation: has
description: >-
  A <a href="/category-property/coquotients_of_cocongruences">cocongruence</a> $j_1,j_2 : X \rightrightarrows C$ is <i>effective</i> if it is the cokernel pair of some morphism, i.e. if there is a morphism $h : Y \to X$ such that we have a pushout square
  $$\begin{CD} Y @> h >> X \\ @V h VV @VV j_1 V \\ X @>> j_2 > C. \end{CD}$$
  A category <i>has effective cocongruences</i> if every cocongruence in the category is effective.
nlab_link: null
dual: effective congruences
invariant_under_equivalences: true

