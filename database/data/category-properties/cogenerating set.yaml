id: cogenerating set
relation: has a
description: >-
  A set of objects $S$ is called a <i>cogenerating set</i> if for every pair of parallel morphisms $f,g : A \rightrightarrows B$, $f = g$ holds if and only if for every morphism $h : B \to Q$ with $Q \in S$ we have $h \circ f = h \circ g$. Equivalently, the functor $(\Hom(-,Q))_{Q \in S} : \C^{\op} \to (\Set^+)^S$ is faithful. This property refers to the existence of a cogenerating set.

  In a locally essentially small category with small products, it is also equivalent to the condition that the canonical morphism
  $$A \to \textstyle\prod_{Q\in S} \prod_{f\in\Hom(A,Q)} Q$$
  is a monomorphism for every object $A$.
nlab_link: https://ncatlab.org/nlab/show/cogenerator
dual: generating set
invariant_under_equivalences: true

