id: infinitary extensive
relation: is
description: >-
  A category $\C$ is <i>infinitary extensive</i> when it has coproducts and, for every family of objects $(A_i)_{i \in I}$, the coproduct functor
  $$\textstyle \prod_{i \in I} (\C/A_i) \to \C/(\coprod_{i \in I} A_i),$$
  which maps a family of morphisms $(X_i \to A_i)_{i \in I}$ to their coproduct $\coprod_{i \in I} X_i \to \coprod_{i \in I} A_i$, is an equivalence of categories. By <a href="/category-implication/infinitary_extensive_characterization">this result</a>, this is equivalent to $\C$ having <a href="/category-property/pullback-stable_coproducts">pullback-stable coproducts</a> and <a href="/category-property/disjoint_coproducts">disjoint coproducts</a>.

  Remark: If $\D$ has this property, $\C$ has coproducts and pullbacks along coproduct inclusions, and $U : \C \to \D$ is a conservative (e.g. fully faithful) functor that preserves both, then $\C$ has this property as well.
nlab_link: https://ncatlab.org/nlab/show/extensive+category
dual: infinitary coextensive
invariant_under_equivalences: true

related:
