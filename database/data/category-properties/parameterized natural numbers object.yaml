id: parametrized natural numbers object
relation: has a
description: >-
  A <i>parametrized natural numbers object</i> in a category with finite products is a triple
  $$(N,\, z : 1 \to N,\, s : N \to N)$$
  satisfying the following universal property: for all $f : A \to X$, $g : X \to X$ there is a unique $\Phi : A \times N \to X$ such that $\Phi(a,z)=f(a)$ and $\Phi(a,s(n)) = g(\Phi(a,n))$ in element notation.

  This concept is an abstraction of the set of natural numbers, which indeed provides a parametrized natural numbers object for the category of sets. If we specialize the universal property to $A=1$, we get the notion of a <a href="/category-property/natural_numbers_object">natural numbers object</a>. The parametrized version is more natural (sic!) for categories that are not cartesian closed (cf. <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, Part A, Remark 2.5.3).
nlab_link: https://ncatlab.org/nlab/show/natural+numbers+object
dual: null
invariant_under_equivalences: true

