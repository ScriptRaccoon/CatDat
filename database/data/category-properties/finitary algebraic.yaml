id: finitary algebraic
relation: is
description: >-
  We call a category <i>finitary algebraic</i> if it is equivalent to the category of models of a many-sorted finitary algebraic theory. There are several equivalent conditions:
  <ol>
  <li>It is equivalent to the category of finite-product-preserving $\L \to \Set$ from a small category $\L$ with finite products (=Lawvere theory).</li>
  <li>It is equivalent to the category of models of a small finite-product sketch.</li>
  <li>It is equivalent to the Eilenberg&ndash;Moore category of a finitary (=filtered-colimit-preserving) monad on $\Set^S$ for some set $S$.</li>
  <li>It is equivalent to the Eilenberg&ndash;Moore category of a sifted-colimit-preserving monad on $\Set^S$ for some set $S$. (cf. [<a href="https://doi.org/10.2168/LMCS-8(3:14)2012" target="_blank">KR12</a>, Proposition 3.3])</li>
  <li>It is <a href="https://ncatlab.org/nlab/show/locally+strongly+finitely+presentable+category">locally strongly finitely presentable</a>, i.e. it is cocomplete and there is a set $G$ of strongly finitely presentable objects such that every object is a sifted colimit of objects from $G$.</li>
  </ol>
  A category satisfying this property is simply called a <i>variety</i> (of finitary algebras) by some authors, although one should be aware that this term is sometimes used only for the <a href="/category-property/one-sorted_finitary_algebraic">one-sorted case</a>.
nlab_link: https://ncatlab.org/nlab/show/algebraic+category
dual: null
invariant_under_equivalences: true

