id: skeletal
relation: is
description: 'A category is <i>skeletal</i> when isomorphic objects are already equal. Every category is equivalent to a skeletal category (using the axiom of choice). In a skeletal category, initial and terminal objects are uniquely determined (if they exist), since any two of them are isomorphic. This is why most categories appearing in practice are not skeletal; for example, every singleton set is a terminal object of $\Set$.'
