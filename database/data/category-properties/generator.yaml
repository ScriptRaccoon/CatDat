id: generator
relation: has a
description: >-
  This property refers to the existence of a generator. An object $G$ of a category $\C$ is called a <i>generator</i> if for all parallel morphisms $f,g : A \rightrightarrows B$ such that $f \circ h = g \circ h$ for every morphism $h : G \to A$, we have $f = g$. Equivalently, the functor
  $$\Hom(G,-) : \C \to \Set^+$$
  is faithful. By definition, $G$ is a generator if and only if $\{G\}$ is a <a href="/category-property/generating_collection">generating collection</a>.
nlab_link: https://ncatlab.org/nlab/show/separator
dual: cogenerator
invariant_under_equivalences: true

