id: directed colimits
relation: has
description: A category has <i>directed colimits</i> if it has colimits of diagrams indexed by directed posets. This is actually equivalent to having filtered colimits. Directed colimits are (somewhat confusingly) also known as <i>direct limits</i> or <i>inductive limits</i>.
nlab_link: https://ncatlab.org/nlab/show/directed+colimit
dual: directed limits
invariant_under_equivalences: true

