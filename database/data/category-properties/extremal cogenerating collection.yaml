id: extremal cogenerating collection
relation: has an
description: >-
  This property refers to the existence of an extremal cogenerating collection. A collection of objects $S \subseteq \Ob(\C)$ in a category $\C$ is called an <i>extremal cogenerating collection</i> if it is a <a href="/category-property/cogenerating_collection">cogenerating collection</a> and for every morphism $f : A \to B$, $f$ is an isomorphism if and only if for every object $Q \in S$ we have ${-} \circ f : \Hom(B, Q) \to \Hom(A, Q)$ is a bijection. Equivalently, the functor
  $(\Hom(-,Q))_{Q \in S} : \C^{\op} \to (\Set^+)^S$
  is faithful and conservative. If $\C$ is locally essentially small and has products, it is also equivalent to the condition that the canonical morphism
  $$\textstyle A \to \prod_{Q\in S} \prod_{f\in\Hom(A,Q)} Q$$
  is an extremal monomorphism for every object $A$, explaining the terminology (see Prop. 5.3 at the <a href="https://ncatlab.org/nlab/show/separator" target="_blank">nLab</a>). The term "extremal cogenerating set" is more common, but within our <a href="/content/foundations">foundations</a>, the collection $S$ is not necessarily a set; it is just isomorphic to a set.

nlab_link: https://ncatlab.org/nlab/show/separator
dual: extremal generating collection
invariant_under_equivalences: true

