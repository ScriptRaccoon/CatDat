id: countably extensive
relation: is
description: >-
  A category $\C$ is <i>countably extensive</i> if it has countable coproducts and, for every countable family of objects $(A_i)_{i \in I}$, the coproduct functor
  $$\textstyle \prod_{i \in I} (\C/A_i) \to \C/(\coprod_{i \in I} A_i),$$
  which maps a family of morphisms $(X_i \to A_i)_{i \in I}$ to their coproduct $\coprod_{i \in I} X_i \to \coprod_{i \in I} A_i$, is an equivalence of categories. By <a href="/category-implication/countably_extensive_characterization">this result</a>, this is equivalent to $\C$ having <a href="/category-property/pullback-stable_countable_coproducts">pullback-stable countable coproducts</a> and <a href="/category-property/disjoint_finite_coproducts">disjoint finite coproducts</a>.

  The only difference between this property and the property of being <a href="/category-property/infinitary_extensive">infinitary extensive</a> is that we restrict ourselves to countable families. A typical example of a countably extensive category which is not infinitary extensive is the <a href="/category/Meas">category of measurable spaces</a>.

  Remark: If $\D$ has this property, $\C$ has countable coproducts and pullbacks along coproduct inclusions, and $U : \C \to \D$ is a conservative (e.g. fully faithful) functor that preserves both, then $\C$ has this property as well.
