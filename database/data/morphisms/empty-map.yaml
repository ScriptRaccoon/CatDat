id: empty-map
name: map from the empty set
notation: $!$
associated:
  category: Set
description: 'For every set $X$ there is a unique map $! : \varnothing \hookrightarrow X$, the empty map. In this entry, we require that $X$ is non-empty.'
nlab_link: https://ncatlab.org/nlab/show/empty+set
keywords:
  - empty map

tags:
  - set theory

related: []

satisfied_properties:
  - property: monomorphism
    proof: It is vacuously injective.

  - property: constant
    proof: The map is vacuously constant, and by <a href="/content/constant_morphisms#lemma_1">Lemma 1 on constant morphisms</a> this means that the morphism in $\Set$ is constant.

  - property: coconstant
    proof: This is because $\varnothing$ is initial; see also the dual of <a href="/content/constant_morphisms#lemma_4">Lemma 4 on constant morphisms</a>.

unsatisfied_properties:
  - property: split monomorphism
    proof: There is no map $X \to \varnothing$.
