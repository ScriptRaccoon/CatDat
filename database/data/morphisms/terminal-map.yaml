id: terminal-map
name: map into the singleton set
notation: $!$
associated:
  category: Set
description: 'For every set $X$ there is a unique map $! : X \to \{\ast\}$. In this entry, we require that $X$ has at least $2$ elements.'
nlab_link: null
keywords:
  - terminal map

tags:
  - set theory

related: []

satisfied_properties:
  - property: split epimorphism
    proof: 'Take any element $x \in X$. The corresponding map $x : \{\ast\} \to X$ is a section of $! : X \to \{\ast\}$.'

  - property: constant
    proof: This is clear because $\{\ast\}$ is terminal; see also <a href="/content/constant_morphisms#lemma_4">Lemma 4 on constant morphisms</a>.

unsatisfied_properties:
  - property: monomorphism
    proof: Since $X$ has two different elements by assumption, which trivially have the same image, the map is not injective.

  - property: coconstant
    proof: 'A direct proof is possible, but we can also argue as follows: Since the map is an epimorphism, if it were coconstant, by the dual of <a href="/content/constant_morphisms#lemma_5">Lemma 5 on constant morphisms</a>, $\{\ast\}$ would be co-subterminal, which is absurd.'
