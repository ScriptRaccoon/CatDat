id: Ab_fg_tensor
name: symmetric monoidal category of finitely generated abelian groups
notation: $(\Ab_{\fg},\otimes,\IZ)$
associated:
  underlying_category: Ab_fg
description: This is the full symmetric monoidal subcategory of $(\Ab,\otimes,\IZ)$ spanned by the finitely generated abelian groups. This is well-defined because $\IZ$ is finitely generated and the tensor product of two finitely generated abelian groups is finitely generated.
nlab_link: null
keywords:
  - finitely generated Z-modules

tags:
  - algebra

related:
  - Ab_tensor
  - FinVect_tensor

satisfied_properties:
  - property: closed
    proof: Since $(\Ab,\otimes,\IZ)$ is closed (<a href="/symmetric_monoidal_category/Ab_tensor?proof=closed" data-allow-deduced>proof</a>), it suffices to prove that for abelian groups $A,B$ with internal Hom $[A,B]$, if $A$ and $B$ are finitely generated, then $[A,B]$ is finitely generated. Since there is an epimorphism $\IZ^n \to A$, there is a monomorphism $[A,B] \to [\IZ^n,B] \cong B^n$. Since $B^n$ is finitely generated, the claim follows from the fact that subgroups of finitely generated abelian groups are finitely generated. (This also shows that the corresponding statement for finitely generated modules over a ring holds only when the ring is Noetherian.)

  - property: well-pointed
    proof: In fact, $\IZ$ is even an extremal generator of $\Ab_{\fg}$ (<a href="/category/Ab_fg?proof=extremal_generator">proof</a>).

unsatisfied_properties:
  - property: finitely complete
    proof: The same <a href="/symmetric_monoidal_category/Ab_tensor?proof=finitely_complete">counterexample</a> as for $(\Ab,\otimes,\IZ)$ works here.

  - property: strict
    proof: The same <a href="/symmetric_monoidal_category/R-Mod_tensor?proof=strict">proof</a> as for $(R{-}\Mod,\otimes,R)$ works here.

  - property: infinitary distributive
    # TODO: automate this with category_conclusions
    proof: This is because $\Ab_{\fg}$ does not have coproducts (<a href="/category/Ab_fg?proof=coproducts" data-allow-deduced>proof</a>).

  - property: infinitary codistributive
    # TODO: automate this with category_conclusions
    proof: This is because $\Ab_{\fg}$ does not have products (<a href="/category/Ab_fg?proof=products" data-allow-deduced>proof</a>).

  - property: well-copointed
    proof: The same <a href="/symmetric_monoidal_category/Ab_tensor?proof=well-copointed">counterexample</a> as for $(\Ab,\otimes,\IZ)$ works here.
