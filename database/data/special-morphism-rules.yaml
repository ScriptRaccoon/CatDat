- property: groupoid
  kind: isomorphism
  description: every morphism

- property: gaunt
  kind: isomorphism
  description: only the identities

- property: thin
  kind: monomorphism
  description: every morphism

- property: thin
  kind: epimorphism
  description: every morphism

- property: left cancellative
  kind: monomorphism
  description: every morphism

- property: right cancellative
  kind: epimorphism
  description: every morphism

- property: left cancellative
  kind: regular epimorphism
  description: same as isomorphisms
  proof: A regular epimorphism which is a monomorphism must be an isomorphism.

- property: right cancellative
  kind: regular monomorphism
  description: same as isomorphisms
  proof: A regular monomorphism which is an epimorphism must be an isomorphism.

- property: one-sorted finitary algebraic
  kind: isomorphism
  description: bijective morphisms
  proof: The inverse of a bijective morphism is again a morphism.

- property: one-sorted finitary algebraic
  kind: monomorphism
  description: injective morphisms
  proof: The forgetful functor to sets is faithful, hence reflects monomorphisms, and it is continuous (even representable), hence preserves monomorphisms.

- property: one-sorted finitary algebraic
  kind: regular epimorphism
  description: surjective morphisms
  proof: The construction of coequalizers shows that every regular epimorphism is surjective. Conversely, the fundamental theorem on homomorphisms states that every surjective homomorphism $A \to B$ is the coequalizer of the two projections $A \times_B A \rightrightarrows A$.

- property: mono-regular
  kind: regular monomorphism
  description: same as monomorphisms

- property: epi-regular
  kind: regular epimorphism
  description: same as epimorphisms

- property: subobject-trivial
  kind: monomorphism
  description: same as isomorphisms

- property: quotient-trivial
  kind: epimorphism
  description: same as isomorphisms

- property: regular-subobject-trivial
  kind: regular monomorphism
  description: same as isomorphisms

- property: regular-quotient-trivial
  kind: regular epimorphism
  description: same as isomorphisms
