id: regular monomorphism
relation: is a
description: 'A morphism $m : A \to B$ is a <i>regular monomorphism</i> if it is the equalizer of a pair of morphisms $f,g : B \rightrightarrows C$. In many categories appearing in practice, this is the same as an embedding. This property is strongly related to other types of monomorphisms by the implications below; see also <a href="/content/relationships-epis-monos">this overview</a>.'
nlab_link: https://ncatlab.org/nlab/show/regular+monomorphism
invariant_under_equivalences: true
dual: regular epimorphism
related:
