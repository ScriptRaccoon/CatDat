id: epimorphism
relation: is an
description: 'A morphism $e : A \to B$ is an <i>epimorphism</i> if it is right-cancellative, i.e. if $f \circ e = g \circ e$ for two morphisms $f,g : B \rightrightarrows T$, then $f = g$. In many concrete categories appearing in practice, these are are a bit harder to understand than monomorphisms; in particular, epimorphisms usually are not to be confused with surjective structure-preserving maps. Stronger types of epimorphisms (such as regular epimorphisms) are often much better understood.'
nlab_link: https://ncatlab.org/nlab/show/epimorphism
invariant_under_equivalences: true
dual: monomorphism
related:
  - isomorphism
  - regular epimorphism

tags:
