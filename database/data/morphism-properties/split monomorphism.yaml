id: split monomorphism
relation: is a
description: 'A morphism $m : A \to B$ is a <i>split monomorphism</i> if there is a morphism $e : B \to A$ with $e \circ m = \id_A$. Split monomorphisms are also called <i>sections</i> or <i>coretractions</i>.'
