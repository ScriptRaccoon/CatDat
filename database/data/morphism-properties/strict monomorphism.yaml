id: strict monomorphism
relation: is a
description: >-
  A morphism $m : A \to B$ is a <i>strict monomorphism</i> if it is the joint equalizer of all pairs of morphisms $f,g : B \rightrightarrows C$ that it equalizes. That is, $m$ is a monomorphism, and a morphism $t : T \to B$ factors through $m$ if we have $f \circ t = g \circ t$ for all morphisms $f,g : B \rightrightarrows C$ that satisfy $f \circ m = g \circ m$. That is, the minimal requirement for a morphism to factor through $m$ is actually sufficient.

  By the implications below, strict monomorphisms are closely related to effective and regular monomorphisms. Every effective monomorphism is regular and hence strict, and in a category with pushouts, every strict monomorphism is effective. Thus, in categories with pushouts, all three mentioned classes of monomorphisms coincide. See also <a href="/content/relationships-epis-monos">this overview</a>.
nlab_link: https://ncatlab.org/nlab/show/strict+monomorphism
invariant_under_equivalences: true
dual: strict epimorphism
