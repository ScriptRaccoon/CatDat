id: monomorphism
relation: is a
description: 'A morphism $m : A \to B$ is a <i>monomorphism</i> if it is left-cancellative, i.e. if $m \circ f = m \circ g$ for two morphisms $f,g : T \rightrightarrows A$, then $f = g$. In many concrete categories appearing in practice, these are injective structure-preserving maps.'
nlab_link: https://ncatlab.org/nlab/show/monomorphism
invariant_under_equivalences: true
dual: epimorphism
related:
  - isomorphism
  - regular monomorphism

tags:
  - types of monomorphisms
