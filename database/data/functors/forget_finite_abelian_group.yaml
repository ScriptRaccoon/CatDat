id: forget_finite_abelian_group
name: forgetful functor from finite abelian groups to abelian groups
notation: $U_{\FinAb, \Ab}$
associated:
  domain: FinAb
  codomain: Ab
  left_adjoint: null
  right_adjoint: null
description: 'This is the inclusion functor $\FinAb \hookrightarrow \Ab$ that maps a finite abelian group to itself, regarded as an abelian group that has "forgotten" that it is finite. It provides an example of a fully faithful functor that is neither finitary nor cofinitary.'
nlab_link: https://ncatlab.org/nlab/show/forgetful+functor
keywords:
  - inclusion functor

tags:
  - algebra
  - forgetful

related:
  - forget_finite_group
  - forget_torsion

satisfied_properties:
  - property: fully faithful
    proof: This is trivial.

  - property: exact
    proof: This follows from the construction of finite limits and colimits in $\FinAb$.

  - property: preserves products
    proof: The proof is identical to the <a href="/functor/forget_finite_group?proof=preserves_products">proof</a> that the inclusion functor $\FinGrp \hookrightarrow \Grp$ preserves products.

  - property: preserves coproducts
    proof: The proof is a minor variation of the proof that products are preserved, using the fact that finite coproducts and finite products coincide. Namely, one can show that a family of finite abelian groups has a coproduct in $\FinAb$ if and only if almost all groups are trivial.

unsatisfied_properties:
  - property: dominant
    proof: This is trivial.

  - property: finitary
    proof: We can take the same <a href="/functor/forget_finite_group?proof=finitary">counterexample</a> as for the inclusion functor $\FinGrp \hookrightarrow \Grp$, which only involves abelian groups.

  - property: cofinitary
    proof: We can take the same <a href="/functor/forget_finite_group?proof=cofinitary">counterexample</a> as for the inclusion functor $\FinGrp \hookrightarrow \Grp$, which only involves abelian groups.

  - property: left-invertible
    proof: We can use the same <a href="/functor/forget_finite_group?proof=left-invertible">proof</a> as for the inclusion functor $\FinGrp \hookrightarrow \Grp$.
