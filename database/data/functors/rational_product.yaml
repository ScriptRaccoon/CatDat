id: rational_product
name: rational product functor
notation: $- \times \IQ$
domain: Top
codomain: Top
description: This functor maps a topological space $X$ to the topological space $X \times \IQ$, where $\IQ \subseteq \IR$ carries the usual topology. It is a typical example of a functor that preserves epimorphisms but not regular epimorphisms.
nlab_link: null
left_adjoint: null

tags:
  - topology

related:
  - countable_copower_sets

satisfied_properties:
  - property: cofinitary
    proof: 'In any category $\C$ with binary products, for every object $Q$, the functor $- \times Q : \C \to \C$ preserves cofiltered limits. This is essentially because limits commute with limits.'

  - property: preserves equalizers
    proof: 'In any category $\C$ with equalizers, for every object $Q$, the functor $- \times Q : \C \to \C$ preserves equalizers. This is essentially because limits commute with limits.'

  - property: preserves monomorphisms
    proof: 'In any category $\C$, for every object $Q$, the functor $- \times Q : \C \to \C$ preserves monomorphisms. This is straightforward to check.'

  - property: preserves coproducts
    proof: This is because <a href="/category/Top">$\Top$</a> is infinitary extensive.

  - property: dominant
    proof: For every space $X$ there is a split monomorphism $X \hookrightarrow X \times \IQ$, $x \mapsto (x,0)$.

  - property: preserves epimorphisms
    proof: 'Since $\Set$ is cartesian closed, the functor $- \times \IQ : \Set \to \Set$ is a left adjoint and therefore preserves epimorphisms (of course, a direct calculation is also possible). Since the <a href="/functor/forget_topology">forgetful functor $\Top \to \Set$</a> preserves binary products and preserves and reflects epimorphisms, it follows that $- \times \IQ : \Top \to \Top$ also preserves epimorphisms.'

  - property: conservative
    proof: >-
      Let $f : X \to Y$ be a continuous map such that $f \times \IQ$ is a homeomorphism. It follows immediately that $f$ is injective and surjective. It remains to show that $f^{-1} : Y \to X$ is continuous. This is because it can be written as the composition of continuous maps
      $$Y \xrightarrow{0} Y \times \IQ \xrightarrow{(f \times \IQ)^{-1}} X \times \IQ \xrightarrow{p_1} X.$$

unsatisfied_properties:
  - property: preserves terminal objects
    proof: The one-point space is mapped to $\IQ$.

  - property: preserves binary products
    proof: The canonical continuous map $(X \times Y) \times \IQ \to (X \times \IQ) \times (Y \times \IQ)$ sends an element $((x,y),q)$ to $((x,q),(y,q))$. It is clearly injective, but not surjective as soon as $X$ and $Y$ are non-empty.

  - property: essentially surjective
    proof: If $X$ is a non-empty space, then $X \times \IQ$ is infinite. Thus, every non-empty finite space is not in the image.

  - property: finitary
    proof: See <a href="https://math.stackexchange.com/questions/1255678" target="_blank">MSE/1255678</a>.

  - property: preserves regular epimorphisms
    proof: >-
      Based on the description of regular epimorphisms as surjective quotient maps, this amounts to finding a surjective quotient map $p : X \to Y$ such that the map $p \times \IQ : X \times \IQ \to Y \times \IQ$ (which is certainly surjective) is not a quotient map. The standard example is the projection $p : \IQ \to \IQ / \IZ$ (where $\IZ$ is collapsed to a point); see Brown's <i>Topology and Groupoids</i>, the Example after Theorem 4.3.2 on p. 111. A weaker statement, namely that coequalizers are not preserved, is proven in <a href="https://math.stackexchange.com/questions/2969372" target="_blank">MSE/2969372</a>.

  - property: essentially injective
    proof: By <a href="https://en.wikipedia.org/wiki/Sierpi%C5%84ski's_theorem_on_metric_spaces" target="_blank">Sierpinski's theorem on metric spaces</a>, there is a homeomorphism between $\IQ$ and the coproduct $\IQ \sqcup \IQ$. Alternatively, this can be deduced from <a href="https://en.wikipedia.org/wiki/Cantor's_isomorphism_theorem" target="_blank">Cantor's isomorphism theorem on dense linear orders</a>. Thus, $1 \times \IQ \cong 2 \times \IQ$, but of course $1 \not\cong 2$, where $2 = 1 \sqcup 1$ is the discrete space with two points.
