id: brauer_group
name: Brauer group functor
notation: $\Br$
domain: Fld
codomain: Ab
description: The Brauer group $\Br(K)$ of a field $K$ consists of equivalence classes of central simple algebras over $K$, where $A \sim B$ iff $A \otimes_K M_n(K) \cong B \otimes_K M_n(K)$ for some $n \geq 0$. The group structure is given by $[A] \cdot [B] := [A \otimes_K B]$, $1 := [K]$ and $[A]^{-1} := [A^{\op}]$. A homomorphism $K \to L$ induces the homomorphism $\Br(K) \to \Br(L)$ defined by $[A] \mapsto [A \otimes_K L]$.
nlab_link: https://ncatlab.org/nlab/show/Brauer+group
left_adjoint: null

tags:
  - algebra

related: []

comments:
  - 'For the image of the functor $\Br : \Fld \to \Ab$, see <a href="https://mathoverflow.net/questions/130778/">MO/130778</a>.'

satisfied_properties:
  - property: preserves terminal objects
    # TODO: automate this
    proof: This is trivial since $\Fld$ has no terminal object.

  - property: preserves initial objects
    # TODO: automate this
    proof: This is trivial since $\Fld$ has no initial object.

  - property: finitary
    proof: >-
      Let $F = \colim_i F_i$ be a filtered colimit of fields. We first show that the canonical map
      $$\alpha : \colim_i \Br(F_i) \to \Br(F)$$
      is surjective. Let $A$ be a central simple algebra over $F$. Since it finite-dimensional, it has a finite presentation over $F$. The relations are non-commutative polynomials in $F$, thus have coefficients in some $F_i$ (more precisely, the image of $F_i \to F$ in $F$). We may therefore lift this presentation to $F_i$ and find an algebra $A_i$ over $F_i$ with an isomorphism $A_i \otimes_{F_i} F \cong A$. We need to show that $A_i$ is a central simple algebra. First, we have $A_i \neq 0$ and $\dim_{F_i}(A_i) = \dim_F(A) < \infty$. If $x \in Z(A_i)$, then $x \otimes 1 \in Z(A_i \otimes_{F_i} F) = F$. From linear algebra we know that the intersection of $A_i$ and $F$ in $A_i \otimes_{F_i} F$ is $F_i$, so that $x \in F_i$, as claimed. Finally, to show that $A_i$ is simple, let $I$ be a two-sided ideal in $A_i$. Then $I \otimes_{F_i} F$ is a two-sided ideal in the tensor product. Thus, it is either zero, which also gives $I=0$ by linear algebra, or it is $A_i \otimes_{F_i} F$, which gives $I=A_i$ by linear algebra. Therefore, $[A_i]$ is a well-defined preimage of $[A]$ in $\Br(F_i)$.

      To show that the canonical map $\alpha$ is injective, choose an element in its kernel. It is induced by an element in some $\Br(F_i)$, say $[A]$ for a central simple algebra $A$ over $F_i$. Then $[A \otimes_{F_i} F] = 1$ in $\Br(F)$ means that there is some $n \geq 0$ such that
      $$A \otimes_{F_i} M_n(F) \cong A \otimes_{F_i} F \otimes_F M_n(F) \cong M_n(F)$$
      as $F$-algebras. Since $M_n(F) = M_n(F_i) \otimes_{F_i} F$, this means that
      $$(A \otimes_{F_i} M_n(F_i)) \otimes_{F_i} F \cong M_n(F_i) \otimes_{F_i} F.$$
      In general, if $R,S$ are two finitely presentable $F_i$-algebras with an isomorphism of $F$-algebras
      $$R \otimes_{F_i} F \cong S \otimes_{F_i} F,$$
      then there is some $i \to j$ such that this isomorphism is induced by an isomorphism of $F_j$-algebras
      $$R \otimes_{F_i} F_j \cong S \otimes_{F_i} F_j;$$
      this is easily checked by using the finite presentations and $F = \colim_i F_i$. Therefore, in our case, there is some $i \to j$ and an isomorphism between
      $$(A \otimes_{F_i} M_n(F_i)) \otimes_{F_i} F_j \cong (A \otimes_{F_i} F_j) \otimes_{F_j} M_n(F_j)$$
      and $M_n(F_i) \otimes_{F_i} F_j \cong M_n(F_j)$. In other words, $[A]$ is contained in the kernel of $\Br(F_i) \to \Br(F_j)$, which means that it vanishes in the colimit, as claimed.

  - property: preserves epimorphisms
    proof: It needs to be shown that if $K \to L$ is a purely inseparable field extension, then $\Br(K) \to \Br(L)$ is surjective. This is Theorem 4.1.5 in Jacobson's <a href=" https://doi.org/10.1007/978-3-642-02429-0" target="_blank">Finite-Dimensional Division Algebras over Fields</a>.

unsatisfied_properties:
  - property: essentially injective
    proof: The Brauer group of any algebraically closed field is trivial. A reference is <a href="https://link.springer.com/book/10.1007/978-1-4612-0889-1">Noncommutative Algebra</a> by Farb-Dennis, the examples after Proposition 4.3.

  - property: faithful
    proof: The identity $\IC \to \IC$ and the complex conjugation $\IC \to \IC$ are mapped to the same endomorphism of $\Br(\IC)$ because $\Br(\IC)$ is trivial.

  - property: conservative
    proof: Take any proper embedding of two algebraically closed fields, for example $\overline{\IQ} \hookrightarrow \IC$. It is mapped to an isomorphism since the Brauer group of an algebraically closed field is trivial.

  - property: full
    proof: The group $\Br(\IR)$ is cyclic of order $2$ (generated by the quaternion algebra) by Frobenius' theorem on real division algebras; a reference is <a href="https://link.springer.com/book/10.1007/978-1-4612-0889-1">Noncommutative Algebra</a> by Farb-Dennis, the examples after Proposition 4.3. In particular, there are two homomorphisms of groups $\Br(\IR) \to \Br(\IR)$. But it is well-known that there is only one homomorphism of fields $\IR \to \IR$, the identity (<a href="https://math.stackexchange.com/questions/449404">MSE/449404</a>).

  - property: preserves regular monomorphisms
    proof: The embedding $\IR \hookrightarrow \IC$ is a regular monomorphism in $\Fld$ as it is the equalizer of the identity and the complex conjugation on $\IC$. However, the induced homomorphism $\Br(\IR) \to \Br(\IC)$ is not injective since $\Br(\IC)$ is trivial while $\Br(\IR)$ is cyclic of order $2$.

  - property: dominant
    proof: This is because the Brauer group of a field is always a torsion group, see Corollary 4.15 in <a href="https://link.springer.com/book/10.1007/978-1-4612-0889-1">Noncommutative Algebra</a> by Farb-Dennis.

  - property: preserves binary products
    proof: >-
      A functor preserving binary products also preserves <a href="https://ncatlab.org/nlab/show/subterminal+object" target="_blank">subterminal objects</a>. In $\Fld$, the field $\IQ$ is subterminal. However, $\Br(\IQ)$ is not subterminal in $\Ab$, since otherwise it would be trivial, which is not the case. In fact, the rational quaternion algebra
      $$H(\IQ) = \langle i,j : i^2=j^2=-1,\, ij=-ji \rangle_{\IQ}$$
      is a non-trivial central finite-dimensional division algebra over $\mathbb{Q}$, and more precisely, $\Br(\IQ)$ is an infinite abelian group. See for example Exercise 4 in Section 12.5 in <a href="">Associative Algebras</a> by Pierce.

  - property: preserves binary coproducts
    proof: If $K$ is any field of characteristic $0$, then $K \sqcup \IQ = K$ in $\Fld$. More precisely, the cospan $\IQ \rightarrow K \leftarrow K$ is a coproduct, where the map on the right is the identity. However, the cospan $\Br(\IQ) \rightarrow \Br(K) \leftarrow \Br(K)$ is not a coproduct in $\Ab$, since otherwise the group $\Br(\IQ)$ would be trivial.

  - property: cofinitary
    proof: >-
      Let $p$ be a prime number. We will prove that the limit of the sequence of Frobenius homomorphisms
      $$\cdots \xrightarrow{F} \IF_p(T) \xrightarrow{F} \IF_p(T) \xrightarrow{F} \IF_p(T) \tag{S}$$
      is not preserved by the Brauer group functor. The limit of the sequence $(S)$ consists of sequences of rational functions $a_n \in \IF_p(T)$ with $a_n = a_{n+1}^p$ for every $n \geq 0$. Then $a_n = (a_{n+m})^{p^m}$ for every $m \geq 0$, which implies $a_n \in \IF_p$: if an irreducible polynomial $f \in \IF_p[T]$ appears with some multiplicity $v \in \IZ$ in $a_n$, then $p^m \mid v$ for all $m$, so that $v=0$. The Frobenius is the identity on $\IF_p$, so that the limit of the sequence $(S)$ is $\IF_p$. By Wedderburn's little theorem, $\Br(\IF_p)$ is trivial.

      Therefore, it suffices to prove that the limit of the sequence
      $$\cdots \xrightarrow{\Br(F)} \Br(\IF_p(T)) \xrightarrow{\Br(F)} \Br(\IF_p(T)) \tag{S'}$$
      is non-trivial. By Theorem 4.1.2 in Jacobson's <a href=" https://doi.org/10.1007/978-3-642-02429-0" target="_blank">Finite-Dimensional Division Algebras over Fields</a>, $\Br(F)$ is the map $a \mapsto a^p$ (resp. $a \mapsto pa$ in additive notation). Moreover, $\Br(\IF_p(T))$ is $p$-divisible by Theorem 4.1.6 in op.cit. Therefore, it remains to prove that $\Br(\IF_p(T))$ is non-trivial, since then we can recursively construct a non-trivial element in the limit of $(S')$.

      One way of proving that this group is non-trivial is by using the Faddeev exact sequence which actually computes $\Br(\IF_p(T))$ as an infinite direct sum of copies of $\IQ / \IZ$; see Corollary 6.4.6 in Gille-Szamuely's <a href="https://doi.org/10.1017/CBO9780511607219">Central Simple Algebras and Galois Cohomology</a>.
  # TODO: find a more elementary proof that Br(F_p(T)) is non-trivial.
