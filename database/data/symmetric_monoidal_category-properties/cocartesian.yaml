id: cocartesian
relation: is
description: 'A symmetric monoidal category is called <i>cocartesian</i> when its underlying category has finite coproducts and the symmetric monoidal structure is induced by these finite coproducts; that is, $A \otimes B = A \sqcup B$, and so on.'
