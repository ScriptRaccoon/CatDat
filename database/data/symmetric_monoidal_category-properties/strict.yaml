id: strict
relation: is
description: 'A symmetric monoidal category is called <i>strict</i> when its associator, symmetry, left unitor, and right unitor are identities. A strict symmetric monoidal category is simply a commutative monoid object in $(\Cat^+,\times,1)$.'
