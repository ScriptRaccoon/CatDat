id: well-copointed
relation: is
description: 'A symmetric monoidal category $(\C,\otimes,1)$ is called <i>well-copointed</i> if the monoidal unit $1$ is a cogenerator. Equivalently, the functor $\Hom(-,1) : \C^{\op} \to \Set^+$ is faithful.'
