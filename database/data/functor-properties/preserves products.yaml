id: preserves products
relation: preserves
description: A functor $F$ <i>preserves products</i> when for every family of objects $(A_i)$ in the domain whose product $\prod_i A_i$ exists, the product $\prod_i F(A_i)$ also exists in the codomain and the canonical morphism $F(\prod_i A_i) \to \prod_i F(A_i)$ is an isomorphism.
nlab_link: https://ncatlab.org/nlab/show/preserved+limit
invariant_under_equivalences: true
dual: preserves coproducts
related:
  - preserves finite products
  - preserves terminal objects
  - continuous

tags:
  - limit preservation
