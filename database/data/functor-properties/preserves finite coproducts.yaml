id: preserves finite coproducts
relation: preserves
description: A functor $F$ <i>preserves finite coproducts</i> when for every finite family of objects $(A_i)$ in the domain whose coproduct $\coprod_i A_i$ exists, the coproduct $\coprod_i F(A_i)$ also exists in the codomain and the canonical morphism $\coprod_i F(A_i) \to F(\coprod_i A_i)$ is an isomorphism.
nlab_link: https://ncatlab.org/nlab/show/preserved+colimit
invariant_under_equivalences: true
dual: preserves finite products
