# results on equalizers, coreflexive coequalizers, and kernels

- id: equalizers_criterion
  assumptions:
    - binary products
    - pullbacks
  conclusions:
    - equalizers
  proof: 'The equalizer of $f,g : X \rightrightarrows Y$ is the pullback of $(f,g) : X \to Y \times Y$ with the diagonal $Y \to Y \times Y$.'

- id: coreflexive_equalizers_are_equalizers
  assumptions:
    - equalizers
  conclusions:
    - coreflexive equalizers
  proof: This is trivial.

- id: equalizers_via_coreflexive_equalizers
  assumptions:
    - binary products
    - coreflexive equalizers
  conclusions:
    - equalizers
  proof: 'If $f,g : X \rightrightarrows Y$ are two morphisms, we have a coreflexive pair $(\id_X,f), (\id_X,g) : X \rightrightarrows X \times Y$. A morphism with codomain $X$ equalizes $f$ and $g$ if and only if it equalizes $(\id_X,f)$ and $(\id_X,g)$. Thus, their equalizers agree.'

- id: equalizers_consequence
  assumptions:
    - equalizers
  conclusions:
    - Cauchy complete
  proof: 'If $e : X \to X$ is an idempotent, then the equalizer of $e, \id_X : X \rightrightarrows X$ provides a splitting of $e$.'

- id: multi_equalizers_consequence
  assumptions:
    - multi-complete
  conclusions:
    - Cauchy complete
  proof: 'More precisely, if a category has multi-equalizers, then it is Cauchy complete. Namely, if $e : X \to X$ is an idempotent morphism, a cone over $e,\id_X$ is a morphism $f : Y \to X$ with $f = e \circ f$. In particular, $e : X \to X$ is such a cone, and $f$ can be regarded as a morphism of cones $f \to e$. This shows that the category of cones is connected. A multi-terminal object in the category of cones is therefore a terminal object, i.e. an equalizer of $e,\id_X$, and hence a splitting of $e$ (cf. <a href="/category-implication/equalizers_consequence">this result</a>).'

- id: reflexive_pair_trivial_2
  assumptions:
    - subobject-trivial
  conclusions:
    - coreflexive equalizers
    - reflexive coequalizers
  proof: Any parallel pair of morphisms with a common section (or retraction) must be a pair of equal isomorphisms.

- id: one-way_reflexive
  assumptions:
    - one-way
  conclusions:
    - reflexive coequalizers
  proof: 'Every reflexive pair is equal: If $f s = g s = \id$, then since $s f  = \id$ (one-way), we must have $f = s^{-1}$, and likewise $g = s^{-1}$.'

- id: kernels_condition
  assumptions:
    - kernels
  conclusions:
    - zero morphisms
  proof: This is part of our definition of having kernels.

- id: kernels_criterion
  assumptions:
    - equalizers
    - zero morphisms
  conclusions:
    - kernels
  proof: This is trivial.

- id: equalizers_via_kernels
  assumptions:
    - kernels
    - preadditive
  conclusions:
    - equalizers
  proof: The equalizer of $f,g$ is the kernel of $f-g$.
