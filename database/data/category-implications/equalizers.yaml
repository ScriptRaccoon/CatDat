# results on equalizers, coreflexive equalizers, and kernels

- id: equalizers_criterion
  assumptions:
    - binary products
    - pullbacks
  conclusions:
    - equalizers
  proof: >-
    The equalizer of $f,g : X \rightrightarrows Y$ can be constructed as the pullback of $(f,g) : X \to Y \times Y$ with the diagonal $Y \to Y \times Y$.

    Alternatively, the claim follows from <a href="/category-implication/pullbacks_imply_coreflexive_equalizers">this implication</a> and <a href="/category-implication/equalizers_via_coreflexive_equalizers">this implication</a>. The resulting construction of the equalizer is the pullback of $(\id_X,f) : X \to X \times Y$ and $(\id_X, g) : X \to X \times Y$.
  check_redundancy: false

- id: coreflexive_equalizers_are_equalizers
  assumptions:
    - equalizers
  conclusions:
    - coreflexive equalizers
  proof: This is trivial.

- id: equalizers_via_coreflexive_equalizers
  assumptions:
    - binary products
    - coreflexive equalizers
  conclusions:
    - equalizers
  proof: 'If $f,g : X \rightrightarrows Y$ are two morphisms, we have a coreflexive pair $(\id_X,f), (\id_X,g) : X \rightrightarrows X \times Y$, with the projection $X \times Y \to X$ as a common retraction. A morphism with codomain $X$ equalizes $f$ and $g$ if and only if it equalizes $(\id_X,f)$ and $(\id_X,g)$. Thus, their equalizers agree.'

- id: equalizers_consequence
  assumptions:
    - equalizers
  conclusions:
    - Cauchy complete
  proof: 'If $e : X \to X$ is an idempotent, then the equalizer of $e, \id_X : X \rightrightarrows X$ provides a splitting of $e$.'

- id: multi_equalizers_consequence
  assumptions:
    - multi-complete
  conclusions:
    - Cauchy complete
  proof: 'More precisely, if a category has multi-equalizers, then it is Cauchy complete. Namely, if $e : X \to X$ is an idempotent morphism, a cone over $e,\id_X$ is a morphism $f : Y \to X$ with $f = e \circ f$. In particular, $e : X \to X$ is such a cone, and $f$ can be regarded as a morphism of cones $f \to e$. This shows that the category of cones is connected. A multi-terminal object in the category of cones is therefore a terminal object, i.e. an equalizer of $e,\id_X$, and hence a splitting of $e$ (cf. <a href="/category-implication/equalizers_consequence">this result</a>).'

- id: kernels_condition
  assumptions:
    - kernels
  conclusions:
    - zero morphisms
  proof: This is part of our definition of having kernels.

- id: kernels_criterion
  assumptions:
    - equalizers
    - zero morphisms
  conclusions:
    - kernels
  proof: This is trivial.

- id: equalizers_via_kernels
  assumptions:
    - kernels
    - preadditive
  conclusions:
    - equalizers
  proof: The equalizer of $f,g$ is the kernel of $f-g$.

- id: kernels_terminal_object
  assumptions:
    - kernels
    - inhabited
  conclusions:
    - terminal object
  proof: >-
    Choose an object $A$ and a kernel $k : K \to A$ of $\id_A$. Then $k = \id_A \circ k = 0_{A,A} \circ k = 0_{K,A}$. For every object $T$, the zero morphism $0_{T,K}$ provides a morphism $T \to K$. Conversely, if $f : T \to K$ is any morphism, then $k \circ f = k \circ 0_{T,K}$ since $k$ is a zero morphism, hence $f = 0_{T,K}$, using that $k$ is also a monomorphism. Thus, $K$ is a terminal object.

    Remark: With <a href="/category-implication/dual_pointed_characterization">this result</a> it follows that $K$ is even a zero object.
  check_redundancy: false

- id: kernels_multi-terminal
  assumptions:
    - kernels
  conclusions:
    - multi-terminal object
    - multi-initial object
  proof: If the category is empty, both properties hold trivially. Otherwise, it has a zero object $0$ by <a href="/category-implication/kernels_terminal_object">this result</a>, and $\{0\}$ is a multi-terminal object and a multi-initial object.
