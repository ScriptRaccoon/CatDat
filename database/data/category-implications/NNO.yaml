- id: parametrized_nno_criterion
  assumptions:
    - countably distributive
  conclusions:
    - parametrized natural numbers object
  proof: 'Consider the copower $N \coloneqq \coprod_{n \in \IN} 1$ with inclusions $i_n : 1 \to N$ for $n \in \IN$. Define $z \coloneqq i_0 : 1 \to N$ and $s : N \to N$ by $s \circ i_n \coloneqq i_{n+1}$. Since the category is countably distributive, we have $A \times N \cong \coprod_{n \in \IN} A$ for every object $A$. Given morphisms $f : A \to X$ and $g : X \to X$, a morphism $\Phi : A \times N \to X$ therefore corresponds to a family of morphisms $\phi_n : A \to X$ for $n \in \IN$. The condition $\Phi(a,z)=f(a)$ becomes $\phi_0 = f$, while the condition $\Phi(a,s(n)) = g(\Phi(a,n))$ becomes $\phi_{n+1} = g \circ \phi_n$. Thus, the morphisms $\phi_n$ are recursively determined; concretely, $\phi_n = g^n \circ f$.'

- id: parametrized_nno_pointed_case
  assumptions:
    - parametrized natural numbers object
    - pointed
  conclusions:
    - trivial
  proof: 'Let $(N,z,s)$ be a parametrized natural numbers object in a category with a zero object, denoted $0$. The morphism $z : 0 \to N$ must be zero. Applying the universal property with $A=1$ shows that $s : N \to N$ is an initial object in the category of endomorphisms. This initial object exists and is given by the identity $0 \to 0$. Therefore, $N = 0$. Now, Lemma 3 <a href="/content/natural_numbers_objects">here</a> implies that $\id_X = 0$ for every object $X$, so that $X = 0$.'

- id: parametrized_nno_strict_terminal
  assumptions:
    - parametrized natural numbers object
    - strict terminal object
  conclusions:
    - one-way
  proof: 'Let $(N,z,s)$ be a parametrized natural numbers object. By assumption, $z : 1 \to N$ is an isomorphism. Hence, $(1,\id_1,\id_1)$ is a parametrized natural numbers object. The claim now follows from Lemma 3 <a href="/content/natural_numbers_objects">here</a>.'
