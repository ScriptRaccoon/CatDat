# results on (parametrized) natural numbers objects

- id: parametrized_nno_assumption
  assumptions:
    - parametrized natural numbers object
  conclusions:
    - finite products
  proof: This holds by definition.

- id: nno_assumption
  assumptions:
    - natural numbers object
  conclusions:
    - terminal object
  proof: This holds by definition.

- id: parametrized_nno_implies_nno
  assumptions:
    - parametrized natural numbers object
  conclusions:
    - natural numbers object
  proof: Every parametrized natural numbers object is also a natural numbers object; we just need to apply the universal property to $A=1$.

- id: parametrized_nno_cartesian_closed
  assumptions:
    - natural numbers object
    - cartesian closed
  conclusions:
    - parametrized natural numbers object
  proof: 'Let $(N,z,s)$ be a natural numbers object in a cartesian closed category. Let $f : A \to X$ and $g : X \to X$ be morphisms. Then we get morphisms $f : 1 \to [A,X]$ and $g_* : [A,X] \to [A,X]$. By the universal property of $(N,z,s)$, there is a unique morphism $\Psi : N \to [A,X]$ satisfying $\Psi(z) = f$ and $\Psi(s(n)) = g_*(\Psi(n))$. This corresponds to a morphism $\Phi : A \times N \to X$ satisfying $\Phi(z,a) = f(a)$ and $\Phi(a,s(n)) = g(\Phi(a,n))$.'

- id: nno_criterion
  assumptions:
    - terminal object
    - countable copowers
  conclusions:
    - natural numbers object
  proof: >-
    Let $1$ be a terminal object and consider the copower
    $$\textstyle N \coloneqq \coprod_{n \in \IN} 1$$
    with inclusions $i_n : 1 \to N$ for $n \in \IN$. We define $z \coloneqq i_0 : 1 \to N$ and $s : N \to N$ by
    $$s \circ i_n \coloneqq i_{n+1},$$
    using the universal property of the copower. Given a morphism $a : 1 \to X$ and a morphism $g : X \to X$, for every $n \in \IN$ we define the morphism $\phi_n : 1 \to X$ recursively by $\phi_0 \coloneqq a$ and $\phi_{n+1} \coloneqq g \circ \phi_n$. (Here we are basically using that $(\IN,0,n \mapsto n+1)$ is a natural numbers object in $\Set$.)
    The universal property of the copower implies that there exist a unique morphism $\Phi : N \to X$ with $\Phi \circ i_n = \phi_n$. In particular, we have $\Phi \circ z = \phi_0 = a$. Moreover, $\Phi \circ s = g \circ \Phi$ holds because for every $n \in \IN$ we have
    $$\Phi \circ s \circ i_n = \Phi \circ i_{n+1} = \phi_{n+1} = g \circ \phi_n = g \circ \Phi \circ i_n.$$
    Conversely, if $\Phi' : N \to X$ is a morphism with $\Phi' \circ z = a$ and $\Phi' \circ s = g \circ \Phi'$, then
    $$\Phi' \circ i_n = \Phi \circ i_n$$
    follows by induction for every $n \in \IN$: It is true for $n = 0$ since both sides are $a : 1 \to X$. If it holds for $n$, then
    $$\begin{align*}
    \Phi' \circ i_{n+1} & = \Phi' \circ s \circ i_n \\
    & = g \circ \Phi' \circ i_n \\
    & = g \circ \Phi \circ i_n \\
    & = \Phi \circ s \circ i_n \\
    & = \Phi \circ i_{n+1}
    \end{align*}$$
    Since $\Phi' \circ i_n = \Phi \circ i_n$ holds for every $n \in \IN$, we conclude $\Phi' = \Phi$.

- id: strict_terminal_implies_nno
  assumptions:
    - strict terminal object
  conclusions:
    - natural numbers object
  proof: 'Let $1$ be a strict terminal object. Then $(1,\id_1,\id_1)$ is a natural numbers object: If $a : 1 \to X$, $g : X \to X$ are given, then $a$ must be an isomorphism, so that $X$ is terminal. In particular, $g = \id_X$. Then $\Phi \coloneqq a$ is the unique morphism $\Phi : 1 \to X$ satisfying $\Phi \circ \id_1 = a$ and $\Phi \circ \id_1 = g \circ \Phi$.'

- id: pointed_has_nno
  assumptions:
    - pointed
  conclusions:
    - natural numbers object
  proof: If $0$ is a zero object, then it is easy to check that $(0, \id_0, \id_0)$ is a natural numbers object.

- id: one_way_implies_nno
  assumptions:
    - terminal object
    - one-way
  conclusions:
    - natural numbers object
  proof: 'Let $1$ be a terminal object in a one-way category. Then $(1,\id_1,\id_1)$ is a natural numbers object: If $a : 1 \to X$, $g : X \to X$ are given, then $g = \id_X$ is forced. Then $\Phi \coloneqq a$ is the unique morphism $\Phi : 1 \to X$ satisfying $\Phi \circ \id_1 = a$ and $\Phi \circ \id_1 = g \circ \Phi$.'

- id: one_way_implies_parametrized_nno
  assumptions:
    - finite products
    - one-way
  conclusions:
    - parametrized natural numbers object
  proof: 'If $1$ denotes the terminal object, then the triple $(1, \id_1, \id_1)$ is a parametrized natural numbers object: If $f : A \to X$ and $g : X \to X$ are given, then $g = \id_X$ is forced, and $\Phi \coloneqq f : A \to X$ is the unique morphism satisfying the requirements.'

- id: parametrized_nno_criterion
  assumptions:
    - countably distributive
  conclusions:
    - parametrized natural numbers object
  proof: 'Consider the copower $N \coloneqq \coprod_{n \in \IN} 1$ with inclusions $i_n : 1 \to N$ for $n \in \IN$. We define $z \coloneqq i_0 : 1 \to N$ and $s : N \to N$ by $s \circ i_n \coloneqq i_{n+1}$. Since the category is countably distributive, we have $A \times N \cong \coprod_{n \in \IN} A$ for every object $A$. Given morphisms $f : A \to X$, $g : X \to X$, a morphism $\Phi : A \times N \to X$ therefore corresponds to a family of morphisms $\phi_n : A \to X$ for $n \in \IN$. The condition $\Phi(a,z)=f(a)$ becomes $\phi_0 = f$. The condition $\Phi(a,s(n)) = g(\Phi(a,n))$ becomes $\phi_{n+1} = g \circ \phi_n$. This recursively defines the morphisms $\phi_n$. (We are basically using that $(\IN, 0, n \mapsto n+1)$ is a natural numbers object in $\Set$.) Concretely, $\phi_n = g^n \circ f$.'

- id: parametrized_nno_pointed_case
  assumptions:
    - parametrized natural numbers object
    - pointed
  conclusions:
    - trivial
  proof: 'Let $(N,z,s)$ be a parametrized natural numbers object in a category with a zero object, denoted $0$. The morphism $z : 0 \to N$ must be zero. The universal property applied to $A=1$ implies that $s : N \to N$ is an initial object in the category of endomorphisms. This exists, it is given by the identity $0 \to 0$. Therefore, $N = 0$. The general universal property now becomes: For all $f : A \to X$, $g : X \to X$ there is a unique $\Phi : A \to X$ such that $\Phi(a) = f(a)$ and $\Phi(a)=g(\Phi(a))$. Apply this to $g = 0$ to conclude $f = 0$.'

- id: parametrized_nno_strict_terminal
  assumptions:
    - parametrized natural numbers object
    - strict terminal object
  conclusions:
    - one-way
  proof: 'Let $(N,z,s)$ be a parametrized natural numbers object. By assumption, $z : 1 \to N$ is an isomorphism. Therefore, the terminal object $1$ is a parametrized natural numbers object with $z = \id_1$ and $s = \id_1$. This precisely means that for all $f : A \to X$ and $g : X \to X$ there is a unique $\Phi : A \to X$ with $\Phi = f$ and $\Phi = g \circ \Phi$. In other words, we have $f = g \circ f$, and therefore $g = \id_X$ (take $f = \id_X$), which proves the claim. (From here one can further deduce that the category is thin.)'
