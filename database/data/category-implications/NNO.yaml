# results on (parametrized) natural numbers objects

- id: parametrized_nno_assumption
  assumptions:
    - parametrized natural numbers object
  conclusions:
    - finite products
  proof: This holds by definition.

- id: nno_assumption
  assumptions:
    - natural numbers object
  conclusions:
    - terminal object
  proof: This holds by definition.

- id: parametrized_nno_implies_nno
  assumptions:
    - parametrized natural numbers object
  conclusions:
    - natural numbers object
  proof: Every parametrized natural numbers object is also a natural numbers object; it suffices to apply the universal property with $A=1$.

- id: parametrized_nno_cartesian_closed
  assumptions:
    - natural numbers object
    - cartesian closed
  conclusions:
    - parametrized natural numbers object
  proof: 'Let $(N,z,s)$ be a natural numbers object in a cartesian closed category. Let $f : A \to X$ and $g : X \to X$ be morphisms. These induce morphisms $\hat{f} : 1 \to [A,X]$ and $g_* : [A,X] \to [A,X]$. By the universal property of $(N,z,s)$, there is a unique morphism $\Psi : N \to [A,X]$ satisfying $\Psi(z) = \hat{f}$ and $\Psi(s(n)) = g_*(\Psi(n))$. By the exponential adjunction, this corresponds to a morphism $\Phi : A \times N \to X$ satisfying $\Phi(a,z) = f(a)$ and $\Phi(a,s(n)) = g(\Phi(a,n))$.'

- id: nno_criterion
  assumptions:
    - terminal object
    - countable copowers
  conclusions:
    - natural numbers object
  proof: >-
    Let $1$ be a terminal object and consider the copower
    $$\textstyle N \coloneqq \coprod_{n \in \IN} 1$$
    with inclusions $i_n : 1 \to N$ for $n \in \IN$. Define $z \coloneqq i_0 : 1 \to N$ and $s : N \to N$ by
    $$s \circ i_n \coloneqq i_{n+1},$$
    using the universal property of the copower. Given a morphism $a : 1 \to X$ and a morphism $g : X \to X$, recursively define morphisms $\phi_n : 1 \to X$ by $\phi_0 \coloneqq a$ and $\phi_{n+1} \coloneqq g \circ \phi_n$. (Here we are essentially using the fact that $(\IN,0,n \mapsto n+1)$ is a natural numbers object in $\Set$.) The universal property of the copower gives a unique morphism $\Phi : N \to X$ satisfying $\Phi \circ i_n = \phi_n$. In particular, $\Phi \circ z = \phi_0 = a$. Moreover, $\Phi \circ s = g \circ \Phi$, since for every $n \in \IN$ we have
    $$\Phi \circ s \circ i_n = \Phi \circ i_{n+1} = \phi_{n+1} = g \circ \phi_n = g \circ \Phi \circ i_n.$$
    Conversely, suppose that $\Phi' : N \to X$ satisfies $\Phi' \circ z = a$ and $\Phi' \circ s = g \circ \Phi'$. Then
    $$\Phi' \circ i_n = \Phi \circ i_n$$
    follows by induction on $n \in \IN$. It holds for $n=0$ since both sides are $a : 1 \to X$. If it holds for $n$, then
    $$\begin{align*}
    \Phi' \circ i_{n+1} & = \Phi' \circ s \circ i_n \\
    & = g \circ \Phi' \circ i_n \\
    & = g \circ \Phi \circ i_n \\
    & = \Phi \circ s \circ i_n \\
    & = \Phi \circ i_{n+1}.
    \end{align*}$$
    Since $\Phi' \circ i_n = \Phi \circ i_n$ for every $n \in \IN$, we conclude that $\Phi' = \Phi$.

- id: strict_terminal_implies_nno
  assumptions:
    - strict terminal object
  conclusions:
    - natural numbers object
  proof: 'Let $1$ be a strict terminal object. For every endomorphism $g : X \to X$ and every morphism $a : 1 \to X$, we have $g \circ a = a$, because $a$ is an isomorphism and hence $X$ is terminal, which forces $g = \id_X$. Therefore, $(1,\id_1,\id_1)$ is a natural numbers object by Lemma 3 <a href="/content/natural_numbers_objects">here</a>.'

- id: pointed_has_nno
  assumptions:
    - pointed
  conclusions:
    - natural numbers object
  proof: 'If $0$ is a zero object, then $(0,\id_0,\id_0)$ is readily seen to be a natural numbers object; alternatively, this follows from Lemma 3 <a href="/content/natural_numbers_objects">here</a>.'

- id: one_way_implies_nno
  assumptions:
