# results on finitary algebraic categories and related notions

- id: one-sorted_finitary_algebraic_consequence
  assumptions:
    - one-sorted finitary algebraic
  conclusions:
    - finitary algebraic
  proof: This is trivial.

- id: algebraic_well-copowered
  assumptions:
    - one-sorted finitary algebraic
  conclusions:
    - well-copowered
  proof: See <a href="https://mathoverflow.net/questions/486607">MO/486607</a>. Alternatively, one may combine the facts that one-sorted finitary algebraic categories are locally (finitely) presentable and that locally presentable categories are well-copowered, both of which are saved in the database. But we include the direct proof here as well, since it makes it easier to deduce the property for one-sorted finitary algebraic categories appearing in practice.

- id: finitary_algebraic_implies_regular
  assumptions:
    - finitary algebraic
  conclusions:
    - pullback-stable regular epimorphisms
  proof: The regular epimorphisms are precisely the sort-wise surjective homomorphisms, which are clearly stable under pullbacks.

- id: generalized_variety_require_sifted_colimit
  assumptions:
    - generalized variety
  conclusions:
    - sifted colimits
  proof: This holds by definition.

- id: generalized_variety_implies_accessible
  assumptions:
    - generalized variety
  conclusions:
    - ℵ₁-accessible
  proof: >-
    See <a href="http://www.tac.mta.ca/tac/volumes/8/n3/8-03abs.html">Adámek–Rosický</a>, Rem. 4.8(2).

    Remark: A generalized variety is not necessarily finitely accessible, see <a href="https://arxiv.org/abs/2610.08548">Kawase</a>.

