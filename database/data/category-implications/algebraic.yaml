# results on finitary algebraic categories and related notions

- id: one-sorted_finitary_algebraic_consequence
  assumptions:
    - one-sorted finitary algebraic
  conclusions:
    - finitary algebraic
  proof: This is trivial.

- id: algebraic_well-copowered
  assumptions:
    - one-sorted finitary algebraic
  conclusions:
    - well-copowered
  proof: See <a href="https://mathoverflow.net/questions/486607" target="_blank">MSE/486607</a>. Alternatively, one may combine the facts that one-sorted finitary algebraic categories are locally (finitely) presentable and that locally presentable categories are well-copowered, both of which are saved in the database. But we include the direct proof here as well, since it makes it easier to deduce the property for one-sorted finitary algebraic categories appearing in practice.

- id: finitary_algebraic_implies_regular
  assumptions:
    - finitary algebraic
  conclusions:
    - regular
  proof: The regular epimorphisms are precisely the sort-wise surjective homomorphisms, which are clearly stable under pullbacks.

- id: generalized_variety_require_sifted_colimit
  assumptions:
    - generalized variety
  conclusions:
    - sifted colimits
  proof: This holds by definition.

- id: generalized_variety_implies_accessible
  assumptions:
    - generalized variety
  conclusions:
    - ℵ₁-accessible
  proof: See <a href="http://www.tac.mta.ca/tac/volumes/8/n3/8-03abs.html" target="_blank">[AR01, Remark 4.8(2)]</a>.

- id: groupoids_are_generalized_varieties
  assumptions:
    - groupoid
    - essentially small
  conclusions:
    - generalized variety
    - finitely accessible
  proof: This is proven <a href="/content/sifted-colimits-in-groupoids">here</a>.

- id: generalized_variety_left_cancellative
  assumptions:
    - left cancellative
    - finitely accessible
  conclusions:
    - generalized variety
  proof: >-
    Let $\C$ be a finitely accessible left cancellative category. The proof of <a href="/category-implication/sifted_colimits_left_cancellative">this result</a> shows that every sifted diagram $\I \to \C$ factors through the preorder reflection of $\I$, and hence reduces to a filtered diagram. Since $\C$ has filtered colimits, it therefore also has sifted colimits.
    It follows that every functor on $\C$ preserving filtered colimits automatically preserves sifted colimits. In particular, for representable functors this means that every finitely presentable object is automatically strongly finitely presentable.
    Now let $G$ be an essentially small collection of finitely presentable objects in $\C$ generating all objects via filtered colimits. The claim follows because every filtered colimit is sifted and the objects in $G$ are strongly finitely presentable.

- id: generalized_variety_stable_monos
  assumptions:
    - generalized variety
  conclusions:
    - filtered-colimit-stable monomorphisms
  proof: 'Let $\C$ be a generalized variety and let $G$ be an essentially small collection of strongly finitely presentable objects which generates $\C$ under sifted colimits. Consider $G$ as a full subcategory of $\C$ and consider the restricted Yoneda embedding $\C \hookrightarrow [G^{\op},\Set]$. It preserves sifted colimits (essentially by the definition of a strongly finitely presentable object) and therefore filtered colimits. It also preserves all limits, in particular monomorphisms, and it reflects monomorphisms since $G$ is a generating collection. Therefore, since $\Set$ and hence the functor category has filtered-colimit-stable monomorphisms, this is also true for $\C$.'

- id: multi-algebraic_implies_locally_finitely_multi-presentable
  assumptions:
    - multi-algebraic
  conclusions:
    - locally finitely multi-presentable
  proof: This is because that every (finite product, coproduct)-sketch is clearly a (finite limit, coproduct)-sketch.

- id: algebraic_implies_multi-algebraic
  assumptions:
    - finitary algebraic
  conclusions:
    - multi-algebraic
  proof: This is because every finite-product-sketch is clearly a (finite product, coproduct)-sketch.

- id: multi-algebraic_another_definition
  assumptions:
    - multi-algebraic
  conclusions:
    - generalized variety
    - multi-cocomplete
  proof: This follows from one of equivalent formulations of multi-algebraic categories.
  is_equivalence: true

- id: multi-algebraic_implies_effective_congruences
  assumptions:
    - multi-algebraic
  conclusions:
    - effective congruences
  proof: This is Thm. 4.0 in <a href="https://doi.org/10.1007/BF01224953" target="_blank">Yves Diers, Catégories Multialgébriques</a> or <a href="https://translations.thosgood.net/ADM-34-1980-193.pdf" target="_blank">its English translation</a>.

- id: multi-algebraic_classification_regular_epis
  assumptions:
    - multi-algebraic
  conclusions:
    - pullback-stable regular epimorphisms
  proof: >-
    Let $\C$ be a multi-algebraic category. We may assume $\C = \Mod(\A)$, where $\A$ is a small category equipped with a collection of finite discrete cones and discrete cocones, and $\Mod(\A) \subseteq \Hom(\A,\Set)$ consists of those functors that map the finite discrete cones in $\A$ to finite product cones in $\Set$ and the discrete cocones in $\A$ to coproduct cocones in $\Set$. Since finite products and coproducts commute with pullbacks in $\Set$, it is easy to check that $\Mod(\A) \subseteq \Hom(\A,\Set)$ is closed under pullbacks. Thus, pullbacks are constructed pointwise. Since surjective maps are stable under pullback in $\Set$, it remains to show, as in the case of finitary algebraic categories, that regular epimorphisms in $\C$ are precisely the pointwise surjective morphisms of models.


    First, let $\alpha : F \to G$ be any morphism of models. For $A \in \A$, consider the image $I(A) = \im(\alpha(A)) \subseteq G(A)$. This defines a subfunctor $I \subseteq G$. It is a model because $F$ and $G$ are models and, for any family of maps of sets $(f_i : X_i \to Y_i)_{i \in I}$, we have $\im(\prod_{i \in I} f_i) = \prod_{i \in I} \im(f_i)$ and $\im(\coprod_{i \in I} f_i) = \coprod_{i \in I} \im(f_i)$. Therefore, $\alpha$ factors in $\C$ as
    $$\alpha = \iota \circ \pi,$$
    where $\pi : F \to I$ is pointwise surjective and $\iota : I \to G$ is pointwise injective, hence a monomorphism. If $\alpha$ is a regular epimorphism, then it is in particular an extremal epimorphism, so $\iota$ is an isomorphism. Thus, $I = G$, and $\alpha$ is pointwise surjective.


    Conversely, assume that $\alpha : F \to G$ is pointwise surjective. Then it is the coequalizer of its kernel pair $F \times_G F \rightrightarrows F$ in the category $\Hom(\A,\Set)$ of all functors. Since the pullback $F \times_G F$ is a model, $\alpha$ is also the coequalizer in the full subcategory of models.
