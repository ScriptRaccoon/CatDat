- id: generalized_variety_left_cancellative
  assumptions:
    - left cancellative
    - finitely accessible
  conclusions:
    - generalized variety
  proof: >-
    Let $\C$ be a finitely accessible left cancellative category. The proof of <a href="/category-implication/sifted_colimits_left_cancellative">this result</a> shows that every sifted diagram $\I \to \C$ factors through the preorder reflection of $\I$, and hence reduces to a filtered diagram. Since $\C$ has filtered colimits, it therefore also has sifted colimits.
    It follows that every functor on $\C$ preserving filtered colimits automatically preserves sifted colimits. In particular, for representable functors this means that every finitely presentable object is automatically strongly finitely presentable.
    Now let $G$ be an essentially small collection of finitely presentable objects in $\C$ generating all objects via filtered colimits. The claim follows because every filtered colimit is sifted and the objects in $G$ are strongly finitely presentable.

- id: generalized_variety_stable_monos
  assumptions:
    - generalized variety
  conclusions:
    - filtered-colimit-stable monomorphisms
  proof: 'Let $\C$ be a generalized variety and let $G$ be an essentially small collection of strongly finitely presentable objects which generates $\C$ under sifted colimits. Consider $G$ as a full subcategory of $\C$ and consider the restricted Yoneda embedding $\C \hookrightarrow [G^{\op},\Set]$. It preserves sifted colimits (essentially by the definition of a strongly finitely presentable object) and therefore filtered colimits. It also preserves all limits, in particular monomorphisms, and it reflects monomorphisms since $G$ is a generating collection. Therefore, since $\Set$ and hence the functor category has filtered-colimit-stable monomorphisms, this is also true for $\C$.'

- id: generalized_variety_effective_congruences
  assumptions:
    - generalized variety
  conclusions:
    - effective congruences
  proof: >-
    Let $\C$ be a generalized variety and let $G$ be an essentially small collection of strongly finitely presentable objects which generates $\C$ under sifted colimits. Consider $G$ as a full subcategory of $\C$ and consider the restricted Yoneda functor
    $$Y : \C \to [G^{\op},\Set], \quad X \mapsto \Hom(-,X)|_{G^{\op}}.$$
    It preserves all limits and, since the objects of $G$ are strongly finitely presentable, all sifted colimits. By <a href="http://www.tac.mta.ca/tac/volumes/8/n3/8-03abs.html">Adámek–Rosický</a>, Lemma 3.8, $Y$ is fully faithful.

    Now let $q_1, q_2 : E \rightrightarrows X$ be a congruence in $\C$. In particular, it is a reflexive pair. Since $\C$ has sifted colimits, it has reflexive coequalizers. In particular, $q_1, q_2$ have a coequalizer $h : X \to Q$. Let $T \in G$. Since $Y$ preserves this coequalizer and colimits in $[G^{\op},\Set]$ are computed pointwise, the map $h_* : \Hom(T,X) \to \Hom(T,Q)$ is a coequalizer of
    $$(q_1)_*, (q_2)_* : \Hom(T,E) \rightrightarrows \Hom(T,X)$$
    in $\Set$. By definition of a congruence, $(q_1)_*, (q_2)_*$ are jointly injective and their image in $\Hom(T,X)^2$ is an equivalence relation, i.e. they form a congruence in $\Set$. Since <a href="/category/Set">$\Set$</a> has effective congruences, <a href="/content/effective-congruence-quotients">this lemma</a> shows that $(q_1)_*, (q_2)_*$ is a kernel pair of $h_*$. Since $T \in G$ was arbitrary and limits in $[G^{\op},\Set]$ are computed pointwise, $Y(q_1), Y(q_2)$ is a kernel pair of $Y(h)$. Since $Y$ is fully faithful, it reflects limits. Hence, $q_1, q_2$ is a kernel pair of $h$.

    Remark: For multi-algebraic categories, this result is also proven in <a href="https://doi.org/10.1007/BF01224953">Diers</a>, Thm. 4.0 (see also <a href="https://translations.thosgood.net/ADM-34-1980-193.pdf">its English translation</a>).

- id: multi-algebraic_implies_locally_finitely_multi-presentable
  assumptions:
    - multi-algebraic
  conclusions:
    - locally finitely multi-presentable
  proof: This is because every (finite product, coproduct)-sketch is clearly a (finite limit, coproduct)-sketch.

- id: algebraic_implies_multi-algebraic
  assumptions:
    - finitary algebraic
  conclusions:
    - multi-algebraic
  proof: This is because every finite-product-sketch is clearly a (finite product, coproduct)-sketch.

- id: multi-algebraic_another_definition
  assumptions:
    - multi-algebraic
  conclusions:
    - generalized variety
    - multi-cocomplete
  proof: This follows from one of the equivalent formulations of multi-algebraic categories.
  is_equivalence: true

- id: algebraic_cototal_criterion
  assumptions:
