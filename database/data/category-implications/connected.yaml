# results on connected categories and related notions

- id: connected_consequence
  assumptions:
    - connected
  conclusions:
    - inhabited
  proof: This holds by definition.

- id: strongly_connected_consequence
  assumptions:
    - strongly connected
  conclusions:
    - semi-strongly connected
  proof: This is immediate from the definition.

- id: semi-strongly_connected_consequence
  assumptions:
    - semi-strongly connected
  conclusions:
    - connected
  proof: This is immediate from the definition.

- id: thin_not_strongly_connected
  assumptions:
    - strongly connected
    - thin
  conclusions:
    - trivial
  proof: This is obvious.

- id: zero_morphisms_mean_strongly_connected
  assumptions:
    - inhabited
    - zero morphisms
  conclusions:
    - strongly connected
  proof: This holds by definition.

- id: strongly_connected_pointed_criterion
  assumptions:
    - initial object
    - strongly connected
    - terminal object
  conclusions:
    - pointed
  proof: By assumption there is a morphism $1 \to 0$. There is also a unique morphism $0 \to 1$. They are necessarily inverse to each other.

- id: core-connected_implies_strongly-connected
  assumptions:
    - core-connected
  conclusions:
    - strongly connected
  proof: This is trivial.

- id: unique_object_generates
  assumptions:
    - core-connected
  conclusions:
    - extremal generator
  proof: >-
    Let $G$ be any object of a core-connected category. Then certainly $G$ is a generator: Let $f, g : X \rightrightarrows Y$ be morphisms such that $f \circ h = g \circ h$ for all $h : G \to X$. Choose an isomorphism $h : G \to X$. Then $h$ is an epimorphism, so that $f = g$.

    To see $G$ is in fact an extremal generator: Let $f : X \to Y$ be a morphism such that
    $$f \circ {-} : \Hom(G, X) \to \Hom(G, Y)$$
    is a bijection. Then for any object $T$,
    $$f \circ {-} : \Hom(T, X) \to \Hom(T, Y)$$
    is a bijection since $T \cong G$, and the Yoneda embedding of $f$ is a natural transformation $\Hom({-}, X) \to \Hom({-}, Y)$. By the Yoneda Lemma, $f$ is therefore an isomorphism.

- id: trivial_is_core-connected
  assumptions:
    - trivial
  conclusions:
    - core-connected
  proof: This is trivial.

- id: core_connected_becomes_trivial
  assumptions:
    - core-connected
    - initial object
  conclusions:
    - trivial
  proof: Every object is isomorphic to the initial object.
