# results on connected categories and related notions

- id: connected_consequence
  assumptions:
    - connected
  conclusions:
    - inhabited
  proof: This holds by definition.

- id: strongly_connected_consequence
  assumptions:
    - strongly connected
  conclusions:
    - semi-strongly connected
  proof: This is immediate from the definition.

- id: semi-strongly_connected_consequence
  assumptions:
    - semi-strongly connected
  conclusions:
    - connected
  proof: This is immediate from the definition.

- id: thin_not_strongly_connected
  assumptions:
    - strongly connected
    - thin
  conclusions:
    - trivial
  proof: This is obvious.

- id: zero_morphisms_mean_strongly_connected
  assumptions:
    - inhabited
    - zero morphisms
  conclusions:
    - strongly connected
  proof: This holds by definition.

- id: strongly_connected_pointed_criterion
  assumptions:
    - initial object
    - strongly connected
    - terminal object
  conclusions:
    - pointed
  proof: By assumption there is a morphism $1 \to 0$. There is also a unique morphism $0 \to 1$. They are necessarily inverse to each other.

- id: core-connected_implies_strongly-connected
  assumptions:
    - core-connected
  conclusions:
    - strongly connected
  proof: This is trivial.

- id: unique_object_generates
  assumptions:
    - core-connected
  conclusions:
    - extremal generator
  proof: >-
    Let $G$ be any object of a core-connected category. Then certainly $G$ is a generator: Let $f, g : X \rightrightarrows Y$ be morphisms such that $f \circ h = g \circ h$ for all $h : G \to X$. Choose an isomorphism $h : G \to X$. Then $h$ is an epimorphism, so that $f = g$.

    To see $G$ is in fact an extremal generator: Let $f : X \to Y$ be a morphism such that
    $$f \circ {-} : \Hom(G, X) \to \Hom(G, Y)$$
    is a bijection. Then for any object $T$,
    $$f \circ {-} : \Hom(T, X) \to \Hom(T, Y)$$
    is a bijection since $T \cong G$, and the Yoneda embedding of $f$ is a natural transformation $\Hom({-}, X) \to \Hom({-}, Y)$. By the Yoneda lemma, $f$ is therefore an isomorphism.

- id: trivial_is_core-connected
  assumptions:
    - trivial
  conclusions:
    - core-connected
  proof: This is trivial.

- id: core_connected_becomes_trivial
  assumptions:
    - core-connected
    - initial object
  conclusions:
    - trivial
  proof: Every object is isomorphic to the initial object.

- id: core-connected_one-way_trivial
  assumptions:
    - core-connected
    - one-way
  conclusions:
    - trivial
  proof: Every core-connected category is equivalent to $BM$ for a (possibly large) monoid $M$. If it is one-way, $\End(*)=M$ must be trivial, in which case $BM$ is trivial.

- id: core-connected_essentially_small
  assumptions:
    - core-connected
    - locally essentially small
  conclusions:
    - essentially small
  proof: There is only one isomorphism class of objects. Now use the characterization of essentially small categories as the locally essentially small categories whose collection of isomorphism classes of objects is essentially small.

- id: core-connected_products_congruences_trivial
  assumptions:
    - core-connected
    - binary products
    - quotients of congruences
  conclusions:
    - trivial
  proof: >-
    We may assume that the category is $BM$ for a (possibly large) monoid $M$. In any category with binary products, the projections $p_1, p_2 : X \times X \rightrightarrows X$ form a congruence on $X$. Since $BM$ has only one object, we have $* \times * = *$, so that $p_1, p_2 \in M$, and for all $a,b \in M$ there is some $m \in M$ with $p_1 m = a$ and $p_2 m = b$.

    Let $c \in M$ be a quotient of $p_1, p_2$. This means that $c p_1 = c p_2$, and that every $d \in M$ with $d p_1 = d p_2$ can be written as $d = u c$ for a unique $u \in M$. For all $a,b \in M$ we choose $m \in M$ with $p_1 m = a$ and $p_2 m = b$, and get
    $$c a = c p_1 m = c p_2 m = c b.$$
    For $b = 1$ this means that $c a = c$ for all $a \in M$. In particular, $c c = c = 1 c$. Since $c$ is a coequalizer, it is an epimorphism, so that $c = 1$. But then $a = c a = c = 1$ for all $a \in M$, so $M$ is trivial.
