# results on left cancellative and right cancellative categories

- id: cauchy_complete_criterion
  assumptions:
    - left cancellative
  conclusions:
    - Cauchy complete
  proof: Any idempotent monomorphism must be the identity and therefore splits.
  check_redundancy: false

- id: left_cancellative_kernel_pairs
  assumptions:
    - left cancellative
  conclusions:
    - kernel pairs
  proof: >-
    In general, the kernel pair of a monomorphism $f : X \to Y$ exists and is given by
    $$\begin{CD} X @>{\id_X}>> X \\ @V{\id_X}VV @VV{f}V \\ X @>>{f}> Y. \end{CD}$$

- id: retract-trivial_kernel_pairs
  assumptions:
    - retract-trivial
    - kernel pairs
  conclusions:
    - left cancellative
  proof: >-
    Let $f : X \to Y$ be a morphism with kernel pair $E \rightrightarrows X$. The diagonal $X \to E$ is a split monomorphism. By assumption on the category, it is an isomorphism. Therefore,
    $$\begin{CD} X @>{\id_X}>> X \\ @V{\id_X}VV @VV{f}V \\ X @>>{f}> Y \end{CD}$$
    is a pullback, so $f$ is a monomorphism.
