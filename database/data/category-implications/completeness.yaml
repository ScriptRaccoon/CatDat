# results on complete and multi-complete categories.
# for specific types of limits, use other files.

- id: complete_consequence
  assumptions:
    - complete
  conclusions:
    - products
    - connected limits
    - finitely complete
  proof: This is trivial.
  check_redundancy: false

- id: complete_characterization
  assumptions:
    - equalizers
    - products
  conclusions:
    - complete
  proof: See <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician">Mac Lane</a>, V.2, Thm. 2.

- id: finitely_complete_characterization
  assumptions:
    - finite products
    - equalizers
  conclusions:
    - finitely complete
  proof: See <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician">Mac Lane</a>, V.2, Cor. 1.
  is_equivalence: true

- id: multi-complete_generalize_limits
  assumptions:
    - complete
  conclusions:
    - multi-complete
  proof: Limits are precisely multi-limits such that the set of cones is a singleton.

- id: multi-terminal_special_case
  assumptions:
    - multi-complete
  conclusions:
    - multi-terminal object
  proof: This is trivial.

- id: terminal_is_multi-terminal
  assumptions:
    - terminal object
  conclusions:
    - multi-terminal object
  proof: This is trivial.

- id: multi-terminal_with_connected
  assumptions:
    - connected
    - multi-terminal object
  conclusions:
    - terminal object
  proof: Let $(T_i)_{i\in I}$ be a multi-terminal object in a connected category $\C$. By definition of multi-terminal objects, for each object $C$, there are a unique index $i_C\in I$ and a unique morphism $C \to T_{i_C}$. Since the index $i_C$ is invariant under connected components, $I$ must be a singleton. The converse is trivial.

- id: multi-complete_with_initial_object
  assumptions:
    - initial object
    - multi-complete
  conclusions:
    - complete
  proof: 'Let $\C$ be a category with an initial object, and let $D : \I \to \C$ be a small diagram in $\C$. Since $\C$ has an initial object, the category $\Cone(D)$ of cones over $D$ also has an initial object. In particular, $\Cone(D)$ is connected, hence a multi-terminal object in it automatically becomes a terminal object. In other words, a multi-limit of $D$ is automatically a limit of $D$.'
