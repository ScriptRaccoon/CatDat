# results on disjoint coproducts and disjoint products

- id: disjoint_coproducts_equivalence
  assumptions:
    - disjoint coproducts
  conclusions:
    - coproducts
    - disjoint finite coproducts
  proof: This is easy.
  is_equivalence: true

- id: disjoint_coproducts_consequence
  assumptions:
    - disjoint finite coproducts
  conclusions:
    - finite coproducts
  proof: This holds by definition.

- id: disjoint_coproducts_quasi_pointed
  assumptions:
    - disjoint finite coproducts
    - terminal object
  conclusions:
    - quasi-pointed
  proof: 'More generally, for every object $A$ the unique morphism $0 \to A$ is a monomorphism, since it is the coproduct inclusion $0 \to 0 + A \cong A$.'

- id: disjoint_coproducts_co_quasi_pointed
  assumptions:
    - disjoint finite coproducts
    - co-quasi-pointed
  conclusions:
    - pointed
  proof: 'Let $i_1, i_2 : 1 \rightrightarrows 1 + 1$ be the coproduct inclusions. Since there is at most one morphism $1 \to 1 + 1$, we have $i_1 = i_2$. Since $i_1$ is a monomorphism, the pullback of $i_1$ and $i_2 = i_1$ is $1$ with the identity morphisms as projections. By disjointness, this pullback is also given by $0$. Hence, $0 \cong 1$ is a zero object.'

- id: strongly_connected_disjoint_products
  assumptions:
    - finite products
    - strongly connected
  conclusions:
    - disjoint finite products
  proof: See <a href="https://math.stackexchange.com/a/5132300">MSE/5130190</a> for a proof.

- id: disjoint_coproduct_cogenerator
  assumptions:
    - disjoint coproducts
    - cogenerating collection
  conclusions:
    - cogenerator
  proof: 'Assume that $S$ is a cogenerating collection and let $Q \coloneqq \coprod_{X \in S} X$. For $X \in S$ we have a monomorphism $i_X : X \to Q$. If $f,g : A \rightrightarrows B$ are two distinct morphisms, there is some $X \in S$ and a morphism $h : B \to X$ with $hf \neq hg$. Hence, $i_X h f \neq i_X h g$. This proves that $Q$ is a cogenerator.'
