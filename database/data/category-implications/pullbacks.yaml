# results on pullbacks, wide pullbacks, and kernel pairs

- id: pullbacks_criterion
  assumptions:
    - binary products
    - equalizers
  conclusions:
    - pullbacks
  proof: 'The pullback of $f : X \to S$ and $g : Y \to S$ is the equalizer of $p_1 \circ f, \, p_2 \circ g : X \times Y \rightrightarrows S$.'

- id: connected_limits_characterization
  assumptions:
    - connected limits
  conclusions:
    - equalizers
    - wide pullbacks
  proof: The direction $\Rightarrow$ is trivial. The direction $\Leftarrow$ can be found at the <a href="https://ncatlab.org/nlab/show/connected+limit" target="_blank">nLab</a>.
  is_equivalence: true

- id: wide_pullbacks_criterion
  assumptions:
    - wide pullbacks
  conclusions:
    - cofiltered limits
    - pullbacks
  proof: To prove $\Leftarrow$, a wide pullback can be constructed as a cofiltered limit of finite pullbacks, and finite pullbacks can be reduced to binary pullbacks (the empty-indexed pullback always exists). Conversely, assume that wide pullbacks exist in $\C$. For every object $A$ then the slice category $\C / A$ has wide pullbacks and a terminal object, hence is complete. Since a cofiltered limit can be finally reduced to such a slice, we are done.
  is_equivalence: true

- id: wide_pullbacks_finite
  assumptions:
    - essentially finite
    - pullbacks
  conclusions:
    - wide pullbacks
  proof: Each slice category has finite products and is essentially finite, hence has all products by <a href="/category-implication/freyd_finite">this result</a> followed by <a href="/category-implication/thin_finite_product_reduction">this result</a>.

- id: pullback_implies_Cauchy_complete
  assumptions:
    - pullbacks
  conclusions:
    - Cauchy complete
  proof: 'A direct proof is possible, but we give a more conceptual one. Suppose that $e : X \to X$ is an idempotent morphism in a category $\C$. It can be regarded as an idempotent morphism $e \to e$ in $\C / X$. If $\C$ has pullbacks, then the slice category $\C / X$ has pullbacks; in fact, the forgetful functor creates all connected limits. The slice category also has a terminal object, and hence is finitely complete. In particular, it has equalizers and is <a href="/category-implication/equalizers_consequence">therefore Cauchy complete</a>. Applying the forgetful functor $\C / X \to \C$ to a splitting of $e$ in $\C / X$ yields a splitting of $e$ in $\C$.'

- id: kernel_pair_is_pullback
  assumptions:
    - pullbacks
  conclusions:
    - kernel pairs
  proof: This is trivial.

- id: kernel_pair_terminal_power
  assumptions:
    - kernel pairs
    - terminal object
  conclusions:
    - binary powers
  proof: If $1$ is a terminal object, then $X \times_1 X = X \times X$.

- id: left_cancellative_kernel_pairs
  assumptions:
    - left cancellative
  conclusions:
    - kernel pairs
  proof: >-
    In general, the kernel pair of a monomorphism $f : X \to Y$ exists and is given by
    $$\begin{CD} X @>{\id_X}>> X \\ @V{\id_X}VV @VV{f}V \\ X @>>{f}> Y. \end{CD}$$

- id: right_cancellative_kernel_pairs
  assumptions:
    - right cancellative
    - kernel pairs
  # TODO: rework this once we have split-mono-trivial
  conclusions:
    - left cancellative
  proof: >-
    Let $f : X \to Y$ be a morphism with kernel pair $E \rightrightarrows X$. The diagonal $X \to E$ is a split monomorphism. By assumption on the category, it is also an epimorphism. Thus, it is an isomorphism. Therefore,
    $$\begin{CD} X @>{\id_X}>> X \\ @V{\id_X}VV @VV{f}V \\ X @>>{f}> Y. \end{CD}$$
    is a pullback, so $f$ is a monomorphism.

- id: additive_kernel_pairs
  assumptions:
    - preadditive
    - kernel pairs
    - Cauchy complete
  conclusions:
    - kernels
  proof: >-
    Let $f : X \to Y$ be a morphism. Since $f$ has a kernel pair, the functor
    $$\C^{\op} \to \Set^+, \quad T \mapsto \{(u,v) \in \Hom(T,X)^2 : f \circ u = f \circ v\}$$
    is representable. Using $w = u-v$, this functor is isomorphic to
    $$T \mapsto \{(u,w) \in \Hom(T,X)^2 : f \circ w = 0\}.$$
    The functor $T \mapsto \{w \in \Hom(T,X) : f \circ w = 0\}$ is a retract of this functor. Since the category is Cauchy complete, every retract of a representable functor is representable. Therefore, the kernel of $f$ exists.

- id: kernel_pairs_coequalizers_assumption
  assumptions:
    - coequalizers of kernel pairs
  conclusions:
    - kernel pairs
  proof: This holds by definition.

- id: kernel_pairs_coequalizers_implies_Cauchy-complete
  assumptions:
    - coequalizers of kernel pairs
  conclusions:
    - Cauchy complete
  proof: >-
    Let $e : X \to X$ be an idempotent morphism. By assumption, the kernel pair $p_1,p_2 : E \rightrightarrows X$ of $e$ exists, i.e. the universal pair satisfying $e \circ p_1 = e \circ p_2$, and it has a coequalizer $q : X \to Q$. The morphism $e : X \to X$ coequalizes $p_1,p_2$, so there is a morphism $i : Q \to X$ satisfying $e = i \circ q$.
    It remains to prove that $q \circ i = \id_Q$. Since $q$ is an epimorphism, it suffices to prove that $q \circ i \circ q = q$, i.e. that $q \circ e = q$.

    Because $e \circ e = e \circ \id_X$, the universal property of the kernel pair yields a (unique) morphism $f : X \to E$ with $p_1 \circ f = e$ and $p_2 \circ f = \id_X$. Since $q \circ p_1 = q \circ p_2$, we obtain
    $$q \circ e = q \circ p_1 \circ f = q \circ p_2 \circ f = q,$$
    finishing the proof.
