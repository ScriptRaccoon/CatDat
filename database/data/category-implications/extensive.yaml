# results on extensive categories

- id: extensive_assumption
  assumptions:
    - extensive
  conclusions:
    - finite coproducts
  proof: This holds by definition.

- id: countably_extensive_assumption
  assumptions:
    - countably extensive
  conclusions:
    - countable coproducts
  proof: This holds by definition.

- id: infinitary_extensive_assumption
  assumptions:
    - infinitary extensive
  conclusions:
    - coproducts
  proof: This holds by definition.

- id: infinitary_extensive_countable
  assumptions:
    - infinitary extensive
  conclusions:
    - countably extensive
  proof: This is obvious.

- id: countably_extensive_finitary
  assumptions:
    - countably extensive
  conclusions:
    - extensive
  proof: This is obvious.

- id: extensive_consequences
  assumptions:
    - extensive
  conclusions:
    - disjoint finite coproducts
    - strict initial object
  proof: See <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 2.6 and 2.8.

- id: extensive_distributivity
  assumptions:
    - extensive
    - finite products
  conclusions:
    - distributive
  proof: See <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 4.5.

- id: infinitary_extensive_distributivity
  assumptions:
    - infinitary extensive
    - finite products
  conclusions:
    - infinitary distributive
  proof: One can adjust the proof of <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 4.5 (which deals with the finite case).

- id: countably_extensive_distributivity
  assumptions:
    - countably extensive
    - finite products
  conclusions:
    - countably distributive
  proof: One can adjust the proof of <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 4.5 (which deals with the finite case).

- id: lcc_implies_extensive
  assumptions:
    - disjoint finite coproducts
    - locally cartesian closed
  conclusions:
    - extensive
  proof: 'The pullback functor preserves finite coproducts because it has a right adjoint. Remark: In combination with other implications, this result implies that every elementary topos is extensive.'

- id: lcc_extensive_yields_infinitary
  assumptions:
    - cocomplete
    - extensive
    - locally cartesian closed
  conclusions:
    - infinitary extensive
  proof: The pullback functor preserves coproducts because it has a right adjoint. See also Remark 2.6 at the <a href="https://ncatlab.org/nlab/show/extensive+category">nLab</a>.

- id: infinitary_extensive_not_coaccessible
  assumptions:
    - infinitary extensive
    - coaccessible
  conclusions:
    - trivial
  proof: >-
    Let $\C$ be an infinitary extensive category which is $\kappa$-coaccessible for a regular cardinal $\kappa$. Recall that the initial object $0$ is <a href="/category-property/strict_initial_object">strict</a> (see <a href="/category-implication/extensive_consequences">here</a>), i.e. every morphism $A \to 0$ is an isomorphism. We claim that every $\kappa$-copresentable object $X$ is terminal. Since every object is a limit of $\kappa$-copresentable objects, and a limit of terminal objects is terminal, it follows that every object is terminal. In particular, $0$ is terminal, so that every object $A$ admits a morphism $A \to 0$, and hence $A \cong 0$ by strictness. Thus, $\C$ is trivial.

    To prove the claim, let $X$ be $\kappa$-copresentable and let $T$ be an object. We show that there is exactly one morphism $T \to X$. Let $T_\beta$ be the summand with index $\beta$ of the coproduct $\coprod_{\beta < \kappa} T$. Since coproducts are disjoint, coproduct inclusions are monomorphisms, so that we may treat them as inclusions of subobjects. In particular, for $\alpha < \kappa$ the tail coproduct
    $$\textstyle D(\alpha) \coloneqq \coprod_{\alpha \leq \beta < \kappa} T_\beta$$
    is a subobject of $D(0) = \coprod_{\beta < \kappa} T$, which is a coproduct of $D(\alpha)$ and $\coprod_{\beta < \alpha} T_\beta$. Since $\kappa$ is regular, $(\kappa,\leq)$ is $\kappa$-filtered, so its dual $(\kappa,\geq)$ is $\kappa$-cofiltered. Hence, the inclusions $D(\alpha) \subseteq D(\alpha')$ for $\alpha \geq \alpha'$ form a $\kappa$-cofiltered diagram $D : (\kappa,\geq) \to \C$. Its limit $L$ exists since $\C$ has $\kappa$-cofiltered limits, and it is the intersection $\bigcap_{\alpha < \kappa} D(\alpha)$ of subobjects of $D(0)$.

    We show that $L \cong 0$ with the same argument as in $\Set$. Since coproducts are stable under pullbacks, we have $L \cong \coprod_{\beta < \kappa} (L \cap T_\beta)$. Since a coproduct of initial objects is initial, it suffices to show that $L \cap T_\beta \cong 0$ for every $\beta < \kappa$. Since $D(0)$ is a coproduct of $D(\beta + 1)$ and $\coprod_{\gamma \leq \beta} T_\gamma$, and coproducts are disjoint, the intersection of these two subobjects is $0$. Since $L \subseteq D(\beta + 1)$ and $T_\beta \subseteq \coprod_{\gamma \leq \beta} T_\gamma$, it follows that $L \cap T_\beta$ admits a morphism to $0$, so that $L \cap T_\beta \cong 0$ by strictness.

    Since $X$ is $\kappa$-copresentable, the canonical map
    $$\textstyle \colim_\alpha \Hom(D(\alpha),X) \to \Hom(0,X) = \{\ast\}$$
    is bijective. By the universal property of the coproduct, we have $\Hom(D(\alpha),X) \cong \Hom(T,X)^{[\alpha,\kappa[}$, and the transition maps correspond to the restriction maps. Hence,
    $$\textstyle \colim_\alpha \Hom(T,X)^{[\alpha,\kappa[} \cong \{\ast\}.$$
    Since $\Hom(T,X)$ embeds into each $\Hom(T,X)^{[\alpha,\kappa[}$ via constant functions, compatibly with the restriction maps, and restrictions of distinct constant functions remain distinct, $\Hom(T,X)$ embeds into the colimit. Hence, there is at most one morphism $T \to X$. If there were none, then each $\Hom(T,X)^{[\alpha,\kappa[}$ and hence the colimit would be empty. Thus, there is exactly one morphism $T \to X$.
