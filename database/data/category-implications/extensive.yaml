# results on extensive categories

- id: extensive_assumption
  assumptions:
    - extensive
  conclusions:
    - finite coproducts
  proof: This holds by definition.
  check_redundancy: false

- id: countably_extensive_assumption
  assumptions:
    - countably extensive
  conclusions:
    - countable coproducts
  proof: This holds by definition.

- id: infinitary_extensive_assumption
  assumptions:
    - infinitary extensive
  conclusions:
    - coproducts
  proof: This holds by definition.

- id: infinitary_extensive_countable
  assumptions:
    - infinitary extensive
  conclusions:
    - countably extensive
  proof: This is obvious.

- id: countably_extensive_finitary
  assumptions:
    - countably extensive
  conclusions:
    - extensive
  proof: This is obvious.

- id: extensive_consequences
  assumptions:
    - extensive
  conclusions:
    - disjoint finite coproducts
    - strict initial object
  proof: See <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 2.6 and 2.8.

- id: extensive_distributivity
  assumptions:
    - extensive
    - finite products
  conclusions:
    - distributive
  proof: See <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 4.5.

- id: infinitary_extensive_distributivity
  assumptions:
    - infinitary extensive
    - finite products
  conclusions:
    - infinitary distributive
  proof: One can adjust the proof of <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 4.5 (which deals with the finite case).

- id: countably_extensive_distributivity
  assumptions:
    - countably extensive
    - finite products
  conclusions:
    - countably distributive
  proof: One can adjust the proof of <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 4.5 (which deals with the finite case).

- id: lcc_implies_extensive
  assumptions:
    - disjoint finite coproducts
    - locally cartesian closed
  conclusions:
    - extensive
  proof: 'The pullback functor preserves finite coproducts because it has a right adjoint. Remark: In combination with other implications, this result implies that every elementary topos is extensive.'

- id: lcc_extensive_yields_infinitary
  assumptions:
    - coproducts
    - extensive
    - locally cartesian closed
  conclusions:
    - infinitary extensive
  proof: The pullback functor preserves coproducts because it has a right adjoint. See also Remark 2.6 at the <a href="https://ncatlab.org/nlab/show/extensive+category">nLab</a>.

- id: lcc_extensive_yields_countable
  assumptions:
    - countable coproducts
    - extensive
    - locally cartesian closed
  conclusions:
    - countably extensive
  proof: The pullback functor preserves countable coproducts because it has a right adjoint.

- id: infinitary_extensive_not_coaccessible
  assumptions:
    - infinitary extensive
    - coaccessible
  conclusions:
    - trivial
  proof: >-
    Let $\C$ be an infinitary extensive category which is $\kappa$-coaccessible for a regular cardinal $\kappa$. We claim that every object $T$ is initial. Since $\C$ has an object, namely $0$, it follows that $\C$ is trivial.

    To prove the claim, let $T_\beta$ be the summand with index $\beta$ of the coproduct $\coprod_{\beta < \kappa} T$, and for $\alpha < \kappa$ let
    $$\textstyle D(\alpha) \coloneqq \coprod_{\alpha \leq \beta < \kappa} T_\beta.$$
    The canonical morphisms $D(\alpha') \to D(\alpha)$ for $\alpha \leq \alpha'$ form a diagram $D : (\kappa,\geq) \to \C$, which is $\kappa$-cofiltered since $\kappa$ is regular. Since $\C$ has $\kappa$-cofiltered limits, $D$ has a limit, which is initial by <a href="/content/tail-coproducts-extensive">this lemma</a>. Let $p : D(0) \to T$ be the codiagonal. For every $\alpha < \kappa$, the composite $D(\alpha) \to D(0) \to T$ is the codiagonal of $D(\alpha)$, which is a split epimorphism, since its composite with the coproduct inclusion $T_\alpha \hookrightarrow D(\alpha)$ is the identity. By the lemma <a href="/content/decreasing-chains-coaccessible">here</a>, $T$ is initial.

- id: countably_extensive_no_stable_epis
  assumptions:
    - countably extensive
    - cofiltered-limit-stable epimorphisms
  conclusions:
    - thin
  proof: >-
    Let $\C$ be a countably extensive category with cofiltered-limit-stable epimorphisms. We show that $\C$ is thin. (With other results, one can further deduce that $\C$ is trivial.)

    Let $T$ be an object, let $T_m$ be the summand with index $m$ of the coproduct $\coprod_{m \in \IN} T$, and for $n \in \IN$ let
    $$\textstyle D(n) \coloneqq \coprod_{m \geq n} T_m.$$
    The canonical morphisms $D(n') \to D(n)$ for $n \leq n'$ form a cofiltered diagram $D : (\IN,\geq) \to \C$, whose limit is initial by <a href="/content/tail-coproducts-extensive">this lemma</a>. For every $n \in \IN$, the codiagonal $D(n) \to T$ is an epimorphism, since its composite with the coproduct inclusion $T_n \hookrightarrow D(n)$ is the identity. Together, they form a morphism from $D$ to the constant diagram with value $T$, whose limit is $T$. By assumption, their limit $0 \to T$ is an epimorphism. Since $0$ is initial, it follows that any two morphisms $T \rightrightarrows Y$ coincide. Thus, $\C$ is thin.
