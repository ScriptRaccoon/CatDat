# results on filtered colimits, sequential colimits, sifted colimits,
# and the dual notions.

- id: directed_colimits_suffice
  assumptions:
    - directed colimits
  conclusions:
    - filtered colimits
  proof: See <a href="https://ncatlab.org/nlab/show/Locally+Presentable+and+Accessible+Categories">Adámek–Rosický</a>, Theorem 1.5.
  is_equivalence: true

- id: sequential_colimits_consequence
  assumptions:
    - sequential colimits
  conclusions:
    - Cauchy complete
  proof: >-
    Assume that $e : X \to X$ is an idempotent morphism. Consider the sequence
    $$X \xrightarrow{e} X \xrightarrow{e} X \to \cdots.$$
    A cocone under this sequence is a family of morphisms $f_n : X \to Y$ satisfying
    $$f_n = f_{n+1} e.$$
    Then
    $$f_n = f_{n+1} e = f_{n+2} e^2 = f_{n+2} e = f_{n+1}$$
    shows that all the morphisms are equal. Thus, a cocone is the same as a morphism $f_0 : X \to Y$ with $f_0 = f_0 e$, meaning it coequalizes $\id_X,e : X \rightrightarrows X$. Hence, if a colimit exists, $e$ splits.

- id: directed_limits_consequence
  assumptions:
    - directed limits
  conclusions:
    - sequential limits
  proof: This is trivial.

- id: sequential_limits_criterion
  assumptions:
    - countable products
    - equalizers
  conclusions:
    - sequential limits
  proof: See <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician">Mac Lane</a>, V.2, Prop. 3. The proof can easily be adapted to this case. Namely, the limit of $\cdots \to X_2 \to X_1 \to X_0$ is the equalizer of two suitable endomorphisms of $\prod_{n \geq 0} X_n$.

- id: direct_implies_cosifted_limits
  assumptions:
    - direct
  conclusions:
    - cosifted limits
  proof: >-
    Let $D : \I \to \C$ be a cosifted diagram in a direct category $\C$. Assume that for every $i \in \I$ there is a morphism $j \to i$ in $\I$ such that $D(j) \to D(i)$ is not an identity. Since $\I$ is non-empty, this yields an infinite sequence of non-identity morphisms $\cdots \to D(i_2) \to D(i_1) \to D(i_0)$, a contradiction. Thus, there is some $i_0 \in \I$ such that $D(j) \to D(i_0)$ is an identity for every morphism $j \to i_0$. By the dual of Lemma 1 <a href="/content/sifted-colimits-in-groupoids">here</a>, $D(i_0)$ is a limit object of $D$.

- id: aleph1-filtered-colimits-include-filtered-colimits
  assumptions:
    - filtered colimits
  conclusions:
    - ℵ₁-filtered colimits
  proof: Every $\aleph_1$-filtered category is also $\aleph_0$-filtered, i.e. filtered. Therefore, every $\aleph_1$-filtered diagram is also a filtered diagram, hence has a colimit by assumption.

- id: kappa-filtered-colimits_require_Cauchy_complete
  assumptions:
    - ℵ₁-filtered colimits
  conclusions:
    - Cauchy complete
  proof: More generally, if $\kappa$ is any infinite regular cardinal, a category with $\kappa$-filtered colimits must be Cauchy cocomplete. This is because the <a href="/category/walking_idempotent">walking idempotent</a> is $\kappa$-filtered. See also <a href="https://bookstore.ams.org/conm-104">Makkai–Paré</a>, Prop. 2.2.1.

- id: sifted_categories_are_connected
  assumptions:
    - connected colimits
  conclusions:
    - sifted colimits
  proof: This is because every sifted category is connected.

- id: sifted_colimits_consequence
  assumptions:
    - sifted colimits
  conclusions:
    - filtered colimits
    - reflexive coequalizers
  proof: This is because filtered categories are sifted and because the index category for a reflexive coequalizer is sifted.

- id: sifted_colimits_criterion
  assumptions:
    - filtered colimits
    - pullbacks
    - reflexive coequalizers
  conclusions:
    - sifted colimits
  proof: See <a href="http://www.tac.mta.ca/tac/volumes/37/35/37-35abs.html">Chen</a>, Cor. 5.2.

- id: sifted_colimits_left_cancellative
  assumptions:
    - left cancellative
    - filtered colimits
  conclusions:
    - sifted colimits
  proof: >-
    Let $D : \I \to \C$ be a sifted diagram in a left cancellative category with filtered colimits. We claim that $D(f) = D(g)$ whenever $f,g : i \rightrightarrows j$ are parallel morphisms, i.e. for the cospan $i \xrightarrow{f} j \xleftarrow{g} i$.

    This is trivially true for the identity cospan. Since $\I$ is sifted, it suffices to prove that $D(f) = D(g) \iff D(f') = D(g')$ whenever there is a morphism of cospans $(f,g) \to (f',g')$. Such a morphism is given by a morphism $h : \cod(f) \to \cod(f')$ satisfying $hf = f'$ and $hg = g'$. The implication $D(f) = D(g) \implies D(f') = D(g')$ is formal, while the converse follows because $D(h)$ is a monomorphism.

    It follows that the diagram $D$ factors as $\I \to \I_p \to \C$, where $\I_p$ is the preorder reflection of $\I$ (same objects, with $i \leq j$ whenever there exists a morphism $i \to j$). Since $\I$ is sifted, the preordered set $\I_p$ is filtered. Hence, the diagram $\I_p \to \C$ has a colimit, and this colimit is also a colimit of the original diagram $\I \to \C$.
