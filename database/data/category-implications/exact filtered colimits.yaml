# results on exact filtered colimits, cartesian filtered colimits,
# filtered-colimit-stable monomorphisms, and the dual notions

- id: exact_filtered_colimits_condition
  assumptions:
    - exact filtered colimits
  conclusions:
    - filtered colimits
    - finitely complete
  proof: This holds by definition.
  check_redundancy: false

- id: exact_filtered_colimits_monos
  assumptions:
    - exact filtered colimits
  conclusions:
    - filtered-colimit-stable monomorphisms
  proof: >-
    This is because $f : X \longrightarrow Y$ is a monomorphism iff the diagram
    $$\begin{CD} X @>{\id}>> X \\ @V{\id}VV @VV{f}V \\ X @>>{f}> Y \end{CD}$$
    is a pullback, and if a functor preserves finite limits, it preserves pullbacks in particular.

- id: cartesian_filtered_colimits_condition
  assumptions:
    - cartesian filtered colimits
  conclusions:
    - filtered colimits
    - finite products
  proof: This holds by definition.

- id: exact_includes_cartesian_filtered_colimits
  assumptions:
    - exact filtered colimits
  conclusions:
    - cartesian filtered colimits
  proof: If filtered colimits commute with finite limits, they commute with finite products in particular.

- id: thin_exact_filtered_colimits
  assumptions:
    - cartesian filtered colimits
    - thin
  conclusions:
    - exact filtered colimits
  proof: In a thin category, every (finite) limit can be reduced to a (finite) product.

- id: biproducts_cartesian_filtered_colimits
  assumptions:
    - biproducts
    - filtered colimits
  conclusions:
    - cartesian filtered colimits
  proof: If $I$ is a finite set, the product functor $\C^I \to \C$ is isomorphic to the coproduct functor $\C^I \to \C$, hence preserves <i>all</i> colimits that exist in $\C$.

- id: extensive_cocartesian_cofiltered_limits
  assumptions:
    - cofiltered limits
    - extensive
    - terminal object
  conclusions:
    - cocartesian cofiltered limits
  proof: 'Let $\C$ be an extensive category with cofiltered limits and a terminal object. Then the coproduct functor $\C \times \C \cong \C/1 \times \C/1 \to \C/(1+1)$ is an equivalence. The forgetful functor $\C/A \to \C$ creates connected limits, and hence preserves cofiltered limits. For every $X \in \C$ the functor $(X,-) : \C \to \C \times \C$ also preserves cofiltered limits. The composition of these functors is $X \sqcup - : \C \to \C$ and therefore also preserves cofiltered limits.'

- id: filtered_monos_assumption
  assumptions:
    - filtered-colimit-stable monomorphisms
  conclusions:
    - filtered colimits
  proof: This holds by definition.

- id: filtered_monos_trivial
  assumptions:
    - filtered colimits
    - left cancellative
  conclusions:
    - filtered-colimit-stable monomorphisms
  proof: This is trivial.

- id: filtered_monos_iso
  assumptions:
    - filtered colimits
    - subobject-trivial
  conclusions:
    - filtered-colimit-stable monomorphisms
  proof: This is trivial.

- id: generalized_inverse_stable_monos
  assumptions:
    - generalized inverse
  conclusions:
    - filtered-colimit-stable monomorphisms
  proof: >-
    Let $\C$ be a generalized inverse category. By Lemmas 1 and 5 <a href="/content/sifted-colimits-in-groupoids">here</a>, $\C$ has sifted colimits. We show more generally that monomorphisms in $\C$ are stable under sifted colimits. Let $\alpha : D \to E$ be a morphism of sifted diagrams $D, E : \I \rightrightarrows \C$ such that every $\alpha_i : D(i) \to E(i)$ is a monomorphism, and denote the colimit morphisms by $u_i : D(i) \to \colim D$ and $v_i : E(i) \to \colim E$.

    By Lemma 5, $D$ is constant after some $i_0 \in \I$, so that $u_{i_0}$ is an isomorphism by Lemma 1. Likewise, $E$ is constant after some $i_1 \in \I$, and $v_{i_1}$ is an isomorphism. Since $\I$ is sifted, there are morphisms $a : i_0 \to i$ and $b : i_1 \to i$ in $\I$. Then $u_i = u_{i_0} \circ D(a)^{-1}$ and $v_i = v_{i_1} \circ E(b)^{-1}$ are isomorphisms. Since $\colim \alpha \circ u_i = v_i \circ \alpha_i$, we conclude that $\colim \alpha = v_i \circ \alpha_i \circ u_i^{-1}$ is a monomorphism.

- id: CIP_assumption
  assumptions:
    - CIP
  conclusions:
    - coproducts
    - products
    - zero morphisms
  proof: This is true by definition.

- id: CIP_criterion
  assumptions:
    - biproducts
    - filtered colimits
    - filtered-colimit-stable monomorphisms
    - products
  conclusions:
    - CIP
  proof: Let $(X_i)_{i \in I}$ be a family of objects. For every finite subset $E \subseteq I$ the canonical morphism $\coprod_{i \in E} X_i = \prod_{i \in E} X_i \to \prod_{i \in I} X_i$ is a (split) monomorphism. Hence, their colimit is also a monomorphism, which is the canonical morphism $\coprod_{i \in I} X_i \to \prod_{i \in I} X_i$.
