# results on additive, preadditive, abelian categories, and biproducts

- id: preadditive_consequence
  assumptions:
    - preadditive
  conclusions:
    - zero morphisms
  proof: This is trivial.

- id: preadditive_products_criterion
  assumptions:
    - finite coproducts
    - preadditive
  conclusions:
    - finite products
  proof: See <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician">Mac Lane</a>, VIII.2, Theorem 2.
  check_redundancy: false

- id: additive_definition
  assumptions:
    - additive
  conclusions:
    - finite products
    - preadditive
  proof: This holds by definition.
  is_equivalence: true
  check_redundancy: false

- id: additive_biproducts
  assumptions:
    - additive
  conclusions:
    - biproducts
  proof: This is standard, see e.g. Prop. 2.1 on the <a href="https://ncatlab.org/nlab/show/additive+category">nLab</a>.

- id: abelian_definition
  assumptions:
    - abelian
  conclusions:
    - additive
    - cokernels
    - conormal
    - kernels
    - normal
  proof: This holds by definition.
  is_equivalence: true
  check_redundancy: false

- id: abelian_implies_regular
  assumptions:
    - abelian
  conclusions:
    - pullback-stable regular epimorphisms
  proof: In an abelian category, every epimorphism is regular, and epimorphisms are stable under pullbacks, see <a href="https://ncatlab.org/nlab/show/Categories+for+the+Working+Mathematician">Mac Lane</a>, Ch. VIII.

- id: grothendieck_abelian_definition
  assumptions:
    - Grothendieck abelian
  conclusions:
    - abelian
    - coproducts
    - exact filtered colimits
    - generator
  proof: This holds by definition.
  is_equivalence: true
  check_redundancy: false

- id: grothendieck_abelian_cogenerator
  assumptions:
    - Grothendieck abelian
    - locally essentially small
  conclusions:
    - cogenerator
  proof: >-
    See <a href="https://ncatlab.org/nlab/show/Categories+and+Sheaves">Kashiwara–Schapira</a>, Thm. 9.6.3.

    Remark: The assumption that the category is locally essentially small is necessary (and is implicit in most of the literature), as the example $[\On,\Ab]$ shows (see <a href="/category/TransSeqAb">here</a>).

- id: additive_CIP_CSP
  assumptions:
    - additive
    - balanced
    - CIP
    - CSP
  conclusions:
    - trivial
  proof: >-
    We work in a balanced additive category with products and coproducts such that, for every family of objects $(X_i)$, the canonical morphism
    $$\textstyle \alpha : \coprod_i X_i \to \prod_{i \in I} X_i$$
    is a monomorphism and an epimorphism, and therefore an isomorphism. In particular, for every object $A$ the canonical morphism
    $$\textstyle \alpha : \coprod_{n \geq 1} A \to \prod_{n \geq 1} A$$
    is an isomorphism. By <a href="/content/infinite-products-coproducts-additive-categories">this proposition</a>, this implies that $A = 0$.

    Remark: This result strengthens the well-known theorem (and is inspired by it) stating that the dual of a Grothendieck abelian category can only be Grothendieck abelian when it is trivial, which appears as exercise B on p. 116 in Freyd's book <i>Abelian categories</i>. This follows from the result we have just proved since a Grothendieck abelian category with products is additive, balanced, and satisfies CIP (by <a href="/category-implication/CIP_criterion">this result</a>).

- id: split_abelian_characterization
  assumptions:
    - split abelian
  conclusions:
    - abelian
    - all epimorphisms split
  proof: 'In an abelian category, every epimorphism $p : B \to C$ is the cokernel of its kernel $i : A \to B$, so it is part of a short exact sequence $0 \to A \to B \to C \to 0$, and every short exact sequence arises in this way. By the splitting lemma, this sequence splits if and only if $p$ is a split epimorphism.'
  is_equivalence: true

- id: biproducts_definition_consequences
  assumptions:
    - biproducts
  conclusions:
    - finite coproducts
    - finite products
    - zero morphisms
  proof: This holds by definition of biproducts.
  check_redundancy: false

- id: biproducts_binary_CIP
  assumptions:
    - biproducts
  conclusions:
    - binary CIP
  proof: For all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is an isomorphism, in particular a monomorphism.

- id: binary_CIP_CSP_biproducts
  assumptions:
    - balanced
    - pointed
    - binary CIP
    - binary CSP
  conclusions:
    - biproducts
  proof: >-
    By the remark in the description of <a href="/category-property/biproducts">biproducts</a>, it suffices that for all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is an isomorphism. It is a monomorphism and an epimorphism, hence an isomorphism since the category is balanced.
