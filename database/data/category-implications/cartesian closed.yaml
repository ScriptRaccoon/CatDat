# results on cartesian closed categories and locally cartesian closed categories

- id: ccc_condition
  assumptions:
    - cartesian closed
  conclusions:
    - finite products
  proof: This holds by definition.
  check_redundancy: false

- id: lcc_consequence
  assumptions:
    - locally cartesian closed
    - initial object
  conclusions:
    - strict initial object
  proof: Assume that $\C$ is locally cartesian closed and $0 \in \C$ is an initial object. The slice category $\C / 0$ has a zero object, the identity of $0$. By assumption, it is also cartesian closed. But a cartesian closed category with a zero object is trivial, since for every object $A$ we have $A \cong A \times 1 \cong A \times 0 \cong 0$, where the last step uses that $A \times -$ is a left adjoint and hence preserves the initial object. Since $\C / 0$ is trivial, every morphism $X \to 0$ is an isomorphism.

- id: ccc_cartesian_filtered_colimits
  assumptions:
    - cartesian closed
    - filtered colimits
  conclusions:
    - cartesian filtered colimits
  proof: Each functor $X \times -$ is a left adjoint and therefore preserves (filtered) colimits.

- id: ccc_no_strict_terminal
  assumptions:
    - cartesian closed
    - strict terminal object
  conclusions:
    - thin
  proof: If a morphism $X \to Y$ exists, we get a morphism $1 \to [X,Y]$, which forces $[X,Y]$ to be a terminal object by assumption. But then any two morphisms $1 \rightrightarrows [X,Y]$ are equal, so that any two morphisms $X \rightrightarrows Y$ are equal.
  check_redundancy: false

- id: power_construction
  assumptions:
    - cartesian closed
    - copowers
  conclusions:
    - powers
  proof: >-
    The power $X^I$ can be constructed as $[I \otimes 1, X]$ because
    $$\begin{align*}
    \Hom(T,[I \otimes 1, X]) & \cong \Hom(T \times (I \otimes 1),X) \\
    & \cong \Hom(I \otimes (T \times 1),X) \\
    & \cong \Hom(I \otimes T,X) \\
    & \cong \Hom(T,X)^I.
    \end{align*}$$
    In the second isomorphism we have used that $T \times -$ preserves copowers, which is true because it is a left adjoint.

- id: countable_power_construction
  assumptions:
    - cartesian closed
    - countable copowers
  conclusions:
    - countable powers
  proof: We can recycle <a href="/category-implication/power_construction">this proof</a>.

- id: pullbacks_are_local_products
  assumptions:
    - locally cartesian closed
  conclusions:
    - pullbacks
  proof: Pullbacks are binary products in slice categories.

- id: locally_cartesian_closed_with_terminal_is_closed
  assumptions:
    - locally cartesian closed
    - terminal object
  conclusions:
    - cartesian closed
  proof: The slice over the terminal object is the category itself.

- id: cartesian_closed_thin_criterion
  assumptions:
    - complete
    - essentially small
    - infinitary distributive
    - thin
  conclusions:
    - cartesian closed
  proof: This is an application of the adjoint functor theorem. Specifically, if $P$ is a complete lattice in which $\sup_i \inf(t,x_i) = \inf(t, \sup_i x_i)$ always holds, then the functor $\inf(t,-)$ is a left adjoint because it preserves all suprema.

- id: sequential_implies_lcc
  assumptions:
    - semi-strongly connected
    - thin
  conclusions:
    - locally cartesian closed
  proof: Each slice is thin, semi-strongly connected, and has a terminal object. Thus, it corresponds to a linear order with a largest element $1$. Every such category is cartesian closed, where the exponential $a \Rightarrow b$ (Heyting implication) is $1$ when $a \leq b$ and otherwise $b$.

- id: cartesian_closed_thin_implies_lcc
  assumptions:
    - cartesian closed
    - thin
  conclusions:
    - locally cartesian closed
  proof: In a thin category, every object is subterminal. Thus, the result follows from <a href="/content/subcategories#corollary_4">Corollary 4 on subcategories</a>.

- id: lcc_stable_reg_epis
  assumptions:
    - locally cartesian closed
    - binary products
  conclusions:
    - pullback-stable regular epimorphisms
  proof: >-
    Let $p : X \to Y$ be a regular epimorphism in a locally cartesian closed category, and let $f : Z \to Y$ be any morphism. We may lift $p$ to a morphism in $\C / Y$ by equipping $X$ with the structure morphism $p$ and $Y$ with the structure morphism $\id_Y$. It is straightforward to check that $p$ is also a regular epimorphism in $\C / Y$. Since the base change functor $f^* : \C / Y \to \C / Z$ is a left adjoint, it preserves regular epimorphisms. Hence the morphism $X \times_Y Z \to Z$ induced by $p$ is a regular epimorphism in $\C / Z$. Finally, the underlying morphism in $\C$ is a regular epimorphism because the forgetful functor $\C / Z \to \C$ has a right adjoint, mapping $T$ to $T \times Z \to Z$, and therefore preserves regular epimorphisms.

    <strong>Remark:</strong> The result is not true without the assumption that binary products exist, see <a href="https://math.stackexchange.com/questions/5150479">MSE/5150479</a>.

- id: ccc_finite-product-stable_epis
  assumptions:
    - cartesian closed
  conclusions:
    - finite-product-stable epimorphisms
  proof: For every object $T$, the functor $T \times -$ is a left adjoint and hence preserves epimorphisms.

- id: lcc_finite-coproduct-stable_monos
  assumptions:
    - locally cartesian closed
    - finite coproducts
  conclusions:
    - finite-coproduct-stable monomorphisms
  # TODO: once the property "coproducts are pullback-stable" is added, split this into "locally cartesian closed + finite coproducts ⟹ finite coproducts are pullback-stable" and "pullbacks + finite coproducts are pullback-stable ⟹ finite-coproduct-stable monomorphisms" (the proof only uses Fact 1 and derives Fact 2 from it)
  # TODO: once the property "coproduct injections are monic" is added, add the implication "distributive ⟹ coproduct injections are monic" (Carboni–Lack–Walters, Prop. 3.3) and use it in Fact 2
  proof: >-
    Let $\C$ be a locally cartesian closed category with finite coproducts. Let $(f_i : X_i \to Y_i)_{i \in I}$ be a finite family of monomorphisms, and let $X \coloneqq \coprod_{i \in I} X_i$ and $Y \coloneqq \coprod_{i \in I} Y_i$ with injections $\iota_i : X_i \to X$ and $\kappa_i : Y_i \to Y$. We show that $g \coloneqq \coprod_{i \in I} f_i : X \to Y$ is a monomorphism. By definition, $g \circ \iota_i = \kappa_i \circ f_i$ for all $i \in I$.

    First, we reduce to the case that $\C$ has a terminal object. The slice category $\C' \coloneqq \C / Y$ is locally cartesian closed, since $\C' / (A,a) \cong \C / A$ for every morphism $a : A \to Y$. It has the terminal object $(Y, \id_Y)$ and finite coproducts, which are computed in $\C$. The morphisms $f_i : (X_i, \kappa_i \circ f_i) \to (Y_i, \kappa_i)$ are monomorphisms in $\C'$, and their coproduct in $\C'$ is $g : (X, g) \to (Y, \id_Y)$. If $g$ is a monomorphism in $\C'$, it is one in $\C$: if $a,b : Z \rightrightarrows X$ are morphisms with $g \circ a = g \circ b$, then $a$ and $b$ are morphisms $(Z, g \circ a) \to (X, g)$ in $\C'$, hence $a = b$. Replacing $\C$ by $\C'$, we may therefore assume that $\C$ has a terminal object. We use two facts about $\C$.

    <strong>Fact 1.</strong> Finite coproducts are stable under pullbacks: Let $(A_j)_{j \in J}$ be a finite family of objects with coproduct $A \coloneqq \coprod_{j \in J} A_j$ and injections $\iota_j : A_j \to A$, and let $c : Z \to A$ be a morphism. If $e_j : Z_j \to Z$ is a pullback of $\iota_j$ along $c$, then $[e_j]_{j \in J} : \coprod_{j \in J} Z_j \to Z$ is an isomorphism. In particular, the morphisms $e_j$ are jointly epimorphic. Indeed, since coproducts in slice categories are computed in $\C$, the object $(A,\id_A)$ of $\C / A$ is the coproduct of the objects $(A_j,\iota_j)$, with injections $\iota_j$. The base change functor $c^* : \C / A \to \C / Z$ maps $(A,\id_A)$ to $(Z,\id_Z)$, $(A_j,\iota_j)$ to $(Z_j,e_j)$, and $\iota_j$ to $e_j$. Since $c^*$ is a left adjoint, it preserves coproducts, so $(Z,\id_Z)$ is the coproduct of the objects $(Z_j,e_j)$ in $\C / Z$, with injections $e_j$. Since this coproduct is computed in $\C$ as well, $[e_j]_{j \in J}$ is an isomorphism.

    <strong>Fact 2.</strong> $\C$ is cartesian closed (by <a href="/category-implication/locally_cartesian_closed_with_terminal_is_closed">this result</a>) and hence distributive (by <a href="/category-implication/distributive_criterion">this result</a>), that is, for every object $A$ the functor $A \times - : \C \to \C$ preserves finite coproducts. Since $\C$ is distributive, coproduct injections in $\C$ are monomorphisms, see <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Prop. 3.3.

    <strong>Claim.</strong> Let $i,j \in I$ with $i \neq j$. If $x : W \to X_i$ and $y : W \to X_j$ are morphisms with $\kappa_i \circ f_i \circ x = \kappa_j \circ f_j \circ y$, then $\iota_i \circ x = \iota_j \circ y$. To prove this, let $q_i : X_i \times X_j \to X_i$ and $q_j : X_i \times X_j \to X_j$ be the projections, and $z \coloneqq \langle x,y \rangle : W \to X_i \times X_j$. By Fact 2, $(X_i \times X_j) \times Y$ is the coproduct of the objects $(X_i \times X_j) \times Y_\ell$ for $\ell \in I$, with injections $\id_{X_i \times X_j} \times \kappa_\ell$. Hence, there is a morphism $s : (X_i \times X_j) \times Y \to X$ with
    $$\begin{align*}
    s \circ (\id_{X_i \times X_j} \times \kappa_j) & = \iota_j \circ q_j \circ p_1, \\
    s \circ (\id_{X_i \times X_j} \times \kappa_\ell) & = \iota_i \circ q_i \circ p_1 \quad \text{for } \ell \neq j,
    \end{align*}$$
    where $p_1$ denotes the projection $(X_i \times X_j) \times Y_\ell \to X_i \times X_j$. Since $i \neq j$, we get
    $$\begin{align*}
    \iota_i \circ x & = \iota_i \circ q_i \circ z \\
    & = \iota_i \circ q_i \circ p_1 \circ \langle z, f_i \circ x \rangle \\
    & = s \circ (\id_{X_i \times X_j} \times \kappa_i) \circ \langle z, f_i \circ x \rangle \\
    & = s \circ \langle z, \kappa_i \circ f_i \circ x \rangle \\
    & = s \circ \langle z, \kappa_j \circ f_j \circ y \rangle \\
    & = s \circ (\id_{X_i \times X_j} \times \kappa_j) \circ \langle z, f_j \circ y \rangle \\
    & = \iota_j \circ q_j \circ p_1 \circ \langle z, f_j \circ y \rangle \\
    & = \iota_j \circ q_j \circ z \\
    & = \iota_j \circ y.
    \end{align*}$$
    This proves the claim.

    Now let $a,b : Z \rightrightarrows X$ be morphisms with $g \circ a = g \circ b$. We want to prove $a = b$. Applying Fact 2 twice, we see that $X \times X$ is the coproduct of the objects $X_i \times X_j$ for $i,j \in I$, with injections $\iota_i \times \iota_j$. By Fact 1, applied to $\langle a,b \rangle : Z \to X \times X$, there are jointly epimorphic morphisms $e_{ij} : Z_{ij} \to Z$ and morphisms $a_{ij} : Z_{ij} \to X_i$ and $b_{ij} : Z_{ij} \to X_j$ with $\langle a,b \rangle \circ e_{ij} = (\iota_i \times \iota_j) \circ \langle a_{ij}, b_{ij} \rangle$, that is,
    $$\begin{align*}
    a \circ e_{ij} & = \iota_i \circ a_{ij}, \\
    b \circ e_{ij} & = \iota_j \circ b_{ij}.
    \end{align*}$$
    It suffices to show $a \circ e_{ij} = b \circ e_{ij}$, that is, $\iota_i \circ a_{ij} = \iota_j \circ b_{ij}$, for all $i,j \in I$. We have
    $$\begin{align*}
    \kappa_i \circ f_i \circ a_{ij} & = g \circ \iota_i \circ a_{ij} \\
    & = g \circ a \circ e_{ij} \\
    & = g \circ b \circ e_{ij} \\
    & = g \circ \iota_j \circ b_{ij} \\
    & = \kappa_j \circ f_j \circ b_{ij}.
    \end{align*}$$
    <ol>
    <li>If $i = j$, then $a_{ii} = b_{ii}$, since $\kappa_i$ is a monomorphism by Fact 2 and $f_i$ is one as well. Hence, $\iota_i \circ a_{ii} = \iota_i \circ b_{ii}$.</li>
    <li>If $i \neq j$, then the claim gives $\iota_i \circ a_{ij} = \iota_j \circ b_{ij}$.</li>
    </ol>

- id: lcc_coproduct-stable_monos
  assumptions:
    - locally cartesian closed
    - coproducts
  conclusions:
    - coproduct-stable monomorphisms
  # TODO: split this analogously to lcc_finite-coproduct-stable_monos
  proof: The proof of <a href="/category-implication/lcc_finite-coproduct-stable_monos">this result</a> works verbatim for arbitrary families of monomorphisms. Fact 1 holds for arbitrary coproducts, since base change functors are left adjoints, and Fact 2 holds for arbitrary coproducts, since a cartesian closed category with coproducts is infinitary distributive (by <a href="/category-implication/infinitary_distributive_criterion">this result</a>).
