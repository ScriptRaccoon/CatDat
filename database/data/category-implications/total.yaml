# results on total categories

- id: total_loc_ess_small
  assumptions:
    - total
  conclusions:
    - locally essentially small
  proof: This is trivial.

- id: total_cocomplete
  assumptions:
    - total
  conclusions:
    - cocomplete
  # TODO: refactor this once we add "hypercocomplete"
  proof: 'If the category $\C$ is locally small and total, then the Yoneda embedding $y : \C \to [\C^{\op}, \Set]$ makes $\C$ into a reflective subcategory of the presheaf category $[\C^{\op}, \Set]$, where the latter is cocomplete. Now use that a reflective subcategory of a cocomplete category is cocomplete. For a general total category $\C$, use the equivalence to a locally small, total category.'

- id: total_complete
  assumptions:
    - total
  conclusions:
    - complete
  # TODO: refactor this once we add "hypercomplete"
  proof: This is proven in <a href="https://www.numdam.org/item/?id=CTGDC_1986__27_2_109_0">Kelly</a>, Thm. 5.6.

# TODO: replace "well-copowered" with "epi-cocomplete" if adding the latter property
- id: cocomplete_well-copowered_generator_implies_total
  assumptions:
    - cocomplete
    - locally essentially small
    - well-copowered
    - generating collection
  conclusions:
    - total
  proof: Since the category is cocomplete and well-copowered, it is epi-cocomplete (meaning that it has wide pushouts of epimorphisms, even of non-small families of epimorphisms). The result then follows from <a href="https://www.numdam.org/item/?id=CTGDC_1987__28_1_77_0">Day</a>, Thm. 1.
