# results on trivial and discrete categories

- id: trivial_consequence
  assumptions:
    - trivial
  conclusions:
    - essentially discrete
    - essentially finite
    - one-sorted finitary algebraic
    - Grothendieck topos
    - self-dual
    - split abelian
  proof: This is trivial.
  check_redundancy: false

- id: discrete_consequences
  assumptions:
    - discrete
  conclusions:
    - direct
    - essentially discrete
    - locally small
  proof: This is trivial.

- id: essentially_discrete_characterization
  assumptions:
    - essentially discrete
  conclusions:
    - groupoid
    - thin
  proof: This is trivial.
  is_equivalence: true
  check_redundancy: false

- id: essentially_discrete_consequence
  assumptions:
    - essentially discrete
  conclusions:
    - connected limits
    - locally essentially small
  proof: This is trivial.
  check_redundancy: false

- id: discrete_multi_initial
  assumptions:
    - essentially discrete
    - multi-initial object
  conclusions:
    - essentially small
  proof: This is trivial.

- id: discrete_accessible
  assumptions:
    - essentially discrete
    - accessible
  conclusions:
    - essentially small
  proof: This is trivial.
  check_redundancy: false
