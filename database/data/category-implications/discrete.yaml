# results on trivial and discrete categories

- id: trivial_consequence
  assumptions:
    - trivial
  conclusions:
    - essentially discrete
    - essentially finite
    - one-sorted finitary algebraic
    - Grothendieck topos
    - self-dual
    - split abelian
  proof: This is trivial.

- id: discrete_consequences
  assumptions:
    - discrete
  conclusions:
    - direct
    - essentially discrete
    - locally small
    - skeletal
  proof: This is trivial.

- id: essentially_discrete_characterization
  assumptions:
    - essentially discrete
  conclusions:
    - groupoid
    - thin
  proof: This is trivial.
  is_equivalence: true

- id: essentially_discrete_consequence
  assumptions:
    - essentially discrete
  conclusions:
    - connected limits
    - locally essentially small
  proof: This is trivial.

- id: essentially_discrete_trivial
  assumptions:
    - connected
    - essentially discrete
  conclusions:
    - trivial
  proof: This is trivial.

- id: discrete_multi_initial
  assumptions:
    - essentially discrete
    - multi-initial object
  conclusions:
    - essentially small
  proof: This is trivial.

- id: discrete_accessible
  assumptions:
    - essentially discrete
    - accessible
  conclusions:
    - essentially small
  proof: This is trivial.

- id: trivial_gaunt
  assumptions:
    - trivial
    - locally small
    - gaunt
  conclusions:
    - small
  proof: 'The category is trivial and therefore inhabited. Choose an object $A$. For every object $B$, since the category is trivial, there is an isomorphism $f : A \to B$. Since the category is gaunt, $f$ is the identity. In particular, $A = B$. Therefore, there is exactly one object $A$. The collection $\Hom(A,A)$ is a set since the category is locally small. Thus, the category is small.'
