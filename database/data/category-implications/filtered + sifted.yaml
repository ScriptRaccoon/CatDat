# results on filtered and sifted categories

- id: filtered_is_sifted
  assumptions:
    - filtered
  conclusions:
    - sifted
  proof: 'Every filtered category $\C$ is inhabited and has final diagonal functors $\Delta : \C \to \C^J$ for all finite index categories $J$; in particular, it is inhabited and its diagonal $\Delta: \C \to \C \times \C$ is final.'

- id: sifted_is_discretely_filtered
  assumptions:
    - sifted
  conclusions:
    - discretely filtered
  proof: Sifted categories are inhabited, and any two objects in a sifted category are joined by a cospan, since the category of cospans between them is connected and hence inhabited.

- id: discretely_filtered_is_connected
  assumptions:
    - discretely filtered
  conclusions:
    - connected
  proof: Discretely filtered categories are inhabited, and any two objects in a discretely filtered category are joined by a cospan.

- id: semi-strongly_connected_is_discretely_filtered
  assumptions:
    - semi-strongly connected
  conclusions:
    - discretely filtered
  proof: 'The category is inhabited by assumption. Let $X,Y$ be two objects. A morphism $f : X \to Y$ yields the cospan $X \xrightarrow{f} Y \xleftarrow{\id} Y$, and a morphism $g : Y \to X$ yields the cospan $X \xrightarrow{\id} X \xleftarrow{g} Y$.'

- id: coproducts_implies_sifted
  assumptions:
    - binary coproducts
    - inhabited
  conclusions:
    - sifted
  proof: The category is inhabited by assumption, and the coproduct of two objects is initial in the corresponding category of cospans.

- id: sifted_left_cancellative_implies_thin
  assumptions:
    - left cancellative
    - sifted
  conclusions:
    - thin
  proof: >-
    For any object $X$ in a left-cancellative category, the connected component containing
    $$X \xrightarrow{\id} X \xleftarrow{\id} X$$
    in the category of cospans from $X$ to $X$ consists only of cospans
    $$X \xrightarrow{f} Y \xleftarrow{g} X$$
    where $f=g$; hence when the category is also sifted, all cospans must be of this form, and so any two parallel morphisms are equal.

- id: filtered_criterion
  assumptions:
    - finitely cocomplete
  conclusions:
    - filtered
  proof: Every finite diagram even admits a <i>universal</i> cocone.
  check_redundancy: false

- id: filtered_characterization
  assumptions:
    - filtered
  conclusions:
    - discretely filtered
    - left collapsible
  proof: 'This is the case $\kappa = \aleph_0$ of Theorem 2.2 at the <a href="https://ncatlab.org/nlab/show/filtered+category">nLab</a>. Here, we use that in a <a href="/category-property/left collapsible">left collapsible</a> category every finite family of parallel morphisms is coequalized by some morphism.'
  is_equivalence: true
  check_redundancy: false

- id: coequalizers_implies_left_collapsible
  assumptions:
    - coequalizers
  conclusions:
    - left collapsible
  proof: Every parallel pair is coequalized by its coequalizer.

- id: left_collapsible_left_cancellative_implies_thin
  assumptions:
    - left cancellative
    - left collapsible
  conclusions:
    - thin
  proof: 'Let $f,g : X \rightrightarrows Y$ be a parallel pair. There is a morphism $h : Y \to Z$ with $h \circ f = h \circ g$. Since $h$ is a monomorphism, we get $f = g$.'

- id: aleph1-filtered-consequence
  assumptions:
    - ℵ₁-filtered
  conclusions:
    - filtered
  proof: This is trivial.

- id: aleph1-filtered_criterion
  assumptions:
    - coequalizers
    - countable coproducts
  conclusions:
    - ℵ₁-filtered
  proof: Every countable diagram even admits a <i>universal</i> cocone.

- id: terminal_object_yields_kappa_filtered
  assumptions:
    - terminal object
  conclusions:
    - ℵ₁-filtered
  proof: This is obvious.

- id: terminal_object_is_weakly_terminal_object
  assumptions:
    - terminal object
  conclusions:
    - weakly terminal object
  proof: This is trivial.

- id: weakly_terminal_object_yields_discretely_filtered
  assumptions:
    - weakly terminal object
  conclusions:
    - discretely filtered
  proof: If $T$ is a weakly terminal object, then every family of objects admits a cocone with tip $T$.

- id: thin_weakly_terminal_object
  assumptions:
    - thin
    - weakly terminal object
  conclusions:
    - terminal object
  proof: In a thin category, a morphism to a weakly terminal object must be unique.

- id: discretely_filtered_finite_weakly_terminal_object
  assumptions:
    - discretely filtered
    - essentially finite
  conclusions:
    - weakly terminal object
  proof: Choose finitely many objects $A_1,\dotsc,A_n$ such that every object is isomorphic to some $A_i$. By assumption, there is an object $T$ with morphisms $A_i \to T$ for all $i$. Then $T$ is a weakly terminal object, since every object $A$ admits a morphism $A \xrightarrow{\cong} A_i \to T$ for some $i$.

- id: aleph1-filtered_countable_weakly_terminal_object
  assumptions:
    - ℵ₁-filtered
    - essentially countable
  conclusions:
    - weakly terminal object
  proof: Choose a countable family of objects $(A_i)_{i \in I}$ such that every object is isomorphic to some $A_i$. By assumption, the discrete diagram $(A_i)_{i \in I}$ admits a cocone, i.e. there is an object $T$ with morphisms $A_i \to T$ for all $i \in I$. Then $T$ is a weakly terminal object, since every object $A$ admits a morphism $A \xrightarrow{\cong} A_i \to T$ for some $i$.
