# results on initial objects, zero objects, strict initial objects,
# and quasi-pointed categories

- id: pointed_characterization
  assumptions:
    - pointed
  conclusions:
    - initial object
    - zero morphisms
  proof: 'If a category has a zero object, then this object is both initial and terminal, and zero morphisms can be defined as those morphisms that factor through the zero object. Conversely, let $I$ be an initial object in a category with zero morphisms. Since $I$ is initial, we have $\id_I = 0_{I,I}$. Then $I$ is terminal, since for every object $X$ there is a morphism $0_{X,I} : X \to I$, and any other morphism $f : X \to I$ satisfies $f = \id_I \circ f = 0_{I,I} \circ f = 0_{X,I}$. Thus, $I$ is a zero object.'
  is_equivalence: true
  check_redundancy: false

- id: strict_initial_consequence
  assumptions:
    - strict initial object
  conclusions:
    - initial object
  proof: This holds by definition.
  check_redundancy: false

- id: strict_initial_trivial
  assumptions:
    - pointed
    - strict initial object
  conclusions:
    - trivial
  proof: If $0$ is the zero object, then for every object $A$ the unique morphism $A \to 0$ is an isomorphism by assumption.

- id: quasi_pointed_consequence
  assumptions:
    - quasi-pointed
  conclusions:
    - initial object
    - terminal object
  proof: This holds by definition.
  check_redundancy: false

- id: pointed_quasi_pointed
  assumptions:
    - pointed
  conclusions:
    - quasi-pointed
  proof: A zero object is terminal, hence subterminal.

- id: strict_initial_quasi_pointed
  assumptions:
    - strict initial object
    - terminal object
  conclusions:
    - quasi-pointed
  proof: 'Let $0$ be a strict initial object. We show that $0$ is subterminal. If $f : X \to 0$ is a morphism, then $f$ is an isomorphism, so $X$ is initial. Hence, $f$ is the only morphism $X \to 0$.'

- id: quasi_pointed_balanced
  assumptions:
    - quasi-pointed
    - co-quasi-pointed
    - balanced
  conclusions:
    - pointed
  proof: The unique morphism $0 \to 1$ is a monomorphism and an epimorphism, hence an isomorphism since the category is balanced. Thus, $0$ is a zero object.

- id: strict_initial_left_criterion
  assumptions:
    - initial object
    - retract-trivial
  conclusions:
    - strict initial object
  proof: 'Let $f : A \to 0$ be any morphism into the initial object $0$. If $g : 0 \to A$ is the unique morphism, then $f \circ g = \id_0$ since $0$ is initial. In particular, $f$ is a split epimorphism. Since the category is retract-trivial, this shows that $f$ is an isomorphism.'
