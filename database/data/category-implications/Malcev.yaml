# results on Malcev and unital categories

- id: malcev_condition
  assumptions:
    - Malcev
  conclusions:
    - finitely complete
  proof: This holds by definition.

- id: malcev_thin_condition
  assumptions:
    - finitely complete
    - thin
  conclusions:
    - Malcev
  proof: In a thin category, every subobject of $X^2 = X$ containing $X$ is already $X$.

- id: malcev_additive_criterion
  assumptions:
    - additive
    - finitely complete
  conclusions:
    - Malcev
  proof: See <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Prop. 2.2.13.

- id: malcev_implies_unital
  assumptions:
    - Malcev
    - pointed
  conclusions:
    - unital
  proof: This follows from <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Corollary 2.2.10. The proof is also written down in <a href="https://math.stackexchange.com/a/5034834">MSE/5033161</a>.

- id: biproducts_unital
  assumptions:
    - biproducts
    - finitely complete
  conclusions:
    - unital
  proof: For all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is an isomorphism, hence a strong epimorphism.

- id: unital_assumptions
  assumptions:
    - unital
  conclusions:
    - finitely complete
    - pointed
  proof: This holds by definition.
