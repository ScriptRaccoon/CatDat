# results on Malcev and unital categories

- id: malcev_condition
  assumptions:
    - Malcev
  conclusions:
    - finitely complete
  proof: This holds by definition.

- id: malcev_thin_condition
  assumptions:
    - finitely complete
    - thin
  conclusions:
    - Malcev
  proof: In a thin category, every subobject of $X^2 = X$ containing $X$ is already $X$.

- id: malcev_additive_criterion
  assumptions:
    - additive
    - finitely complete
  conclusions:
    - Malcev
  proof: See <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Prop. 2.2.13.

- id: malcev_implies_unital
  assumptions:
    - Malcev
    - pointed
  conclusions:
    - unital
  proof: This follows from <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Corollary 2.2.10. The proof is also written down in <a href="https://math.stackexchange.com/a/5034834">MSE/5033161</a>.

- id: biproducts_unital
  assumptions:
    - biproducts
    - finitely complete
  conclusions:
    - unital
  proof: For all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is an isomorphism, hence a strong epimorphism.

- id: unital_finite-product-stable_epis
  assumptions:
    - unital
  conclusions:
    - finite-product-stable epimorphisms
  proof: >-
    Let $f : X \to Y$ be an epimorphism and $T$ be an object. It suffices to show that $\id_T \times f : T \times X \to T \times Y$ is an epimorphism. Let $g,h : T \times Y \rightrightarrows A$ be morphisms with $g \circ (\id_T \times f) = h \circ (\id_T \times f)$, and let $e : E \to T \times Y$ be their equalizer. We have
    $$\begin{align*}
    g \circ (\id_T,0) & = g \circ (\id_T \times f) \circ (\id_T,0) \\
    & = h \circ (\id_T \times f) \circ (\id_T,0) \\
    & = h \circ (\id_T,0),
    \end{align*}$$
    so $(\id_T,0) : T \to T \times Y$ factors through $e$. Moreover, we have
    $$\begin{align*}
    g \circ (0,\id_Y) \circ f & = g \circ (\id_T \times f) \circ (0,\id_X) \\
    & = h \circ (\id_T \times f) \circ (0,\id_X) \\
    & = h \circ (0,\id_Y) \circ f,
    \end{align*}$$
    so $g \circ (0,\id_Y) = h \circ (0,\id_Y)$ because $f$ is an epimorphism. Hence, also $(0,\id_Y) : Y \to T \times Y$ factors through $e$. Since $(\id_T,0)$ and $(0,\id_Y)$ are jointly strongly epimorphic and $e$ is a monomorphism, $e$ is an isomorphism, so $g = h$.

- id: unital_assumptions
  assumptions:
    - unital
  conclusions:
    - finitely complete
    - pointed
  proof: This holds by definition.
