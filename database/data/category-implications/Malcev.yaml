# results on Malcev and unital categories

- id: malcev_condition
  assumptions:
    - Malcev
  conclusions:
    - finitely complete
  proof: This holds by definition.

- id: malcev_thin_condition
  assumptions:
    - finitely complete
    - thin
  conclusions:
    - Malcev
  proof: In a thin category, every subobject of $X^2 = X$ containing $X$ is already $X$.

- id: malcev_additive_criterion
  assumptions:
    - additive
    - finitely complete
  conclusions:
    - Malcev
  proof: See <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Prop. 2.2.13.

- id: malcev_implies_unital
  assumptions:
    - Malcev
    - pointed
  conclusions:
    - unital
  proof: This follows from <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Corollary 2.2.10. The proof is also written down in <a href="https://math.stackexchange.com/a/5034834">MSE/5033161</a>.

- id: biproducts_unital
  assumptions:
    - biproducts
    - finitely complete
  conclusions:
    - unital
  proof: For all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is an isomorphism, hence a strong epimorphism.

- id: unital_binary_CSP
  assumptions:
    - unital
    - binary coproducts
  conclusions:
    - binary CSP
  proof: For all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is a strong epimorphism (see the description of <a href="/category-property/unital">unital categories</a>), hence an epimorphism.

- id: unital_binary_CIP_biproducts
  assumptions:
    - unital
    - binary CIP
  conclusions:
    - biproducts
  proof: >-
    A unital category has a zero object and binary products, and binary CIP gives binary coproducts. By the remark in the description of <a href="/category-property/biproducts">biproducts</a>, it suffices that for all objects $X,Y$ the canonical morphism $X \sqcup Y \to X \times Y$ is an isomorphism. It is a strong epimorphism (see the description of <a href="/category-property/unital">unital categories</a>) and a monomorphism, hence an isomorphism.

- id: unital_finite-product-stable_epis
  assumptions:
    - unital
  conclusions:
    - finite-product-stable epimorphisms
  proof: >-
    Let $f : X \to Y$ be an epimorphism and $T$ be an object. It suffices to show that $\id_T \times f : T \times X \to T \times Y$ is an epimorphism. Let $g,h : T \times Y \rightrightarrows A$ be morphisms with $g \circ (\id_T \times f) = h \circ (\id_T \times f)$. We have
    $$\begin{align*}
    g \circ (\id_T,0) & = g \circ (\id_T \times f) \circ (\id_T,0) \\
    & = h \circ (\id_T \times f) \circ (\id_T,0) \\
    & = h \circ (\id_T,0).
    \end{align*}$$
    Moreover, we have
    $$\begin{align*}
    g \circ (0,\id_Y) \circ f & = g \circ (\id_T \times f) \circ (0,\id_X) \\
    & = h \circ (\id_T \times f) \circ (0,\id_X) \\
    & = h \circ (0,\id_Y) \circ f,
    \end{align*}$$
    so $g \circ (0,\id_Y) = h \circ (0,\id_Y)$ because $f$ is an epimorphism. Since $(\id_T,0)$ and $(0,\id_Y)$ are jointly strongly epimorphic, they are jointly epimorphic, so $g = h$.

- id: malcev_regular_subobject_classifier_regular-subobject-trivial
  assumptions:
    - Malcev
    - regular subobject classifier
  conclusions:
    - regular-subobject-trivial
  proof: 'The regular subobject classifier $\Omega$ is an internal poset (cf. <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, IV.8). Concretely, since the category is Malcev, it has binary products, so the intersection of regular subobjects is again a regular subobject. Namely, the intersection of the equalizer of $f_1, g_1 : X \rightrightarrows Y_1$ with the equalizer of $f_2, g_2 : X \rightrightarrows Y_2$ is the equalizer of $(f_1, f_2), (g_1, g_2) : X \rightrightarrows Y_1 \times Y_2$. This intersection operation on regular subobjects yields a morphism $\wedge : \Omega \times \Omega \to \Omega$, and the internal relation ${\leq_{\Omega}} \subseteq \Omega \times \Omega$ is defined as the equalizer of $\wedge, p_1 : \Omega \times \Omega \rightrightarrows \Omega$. The relation ${\leq_{\Omega}}$ is reflexive, hence symmetric by assumption. Since it is also antisymmetric and has a largest element $\top$, every regular monomorphism must be an isomorphism. (From here, we can infer that the category is thin – or, if the category has a subobject classifier, that the category is trivial.)'

- id: unital_regular_subobject_classifier_trivial
  assumptions:
    - unital
    - regular subobject classifier
  conclusions:
    - trivial
  proof: >-
    The following proof is due to Vladimir Sotirov (comment on <a href="https://math.stackexchange.com/a/5132767">MSE/4086192</a>). Let $\Omega$ be a regular subobject classifier. Since $\Sub_{\reg} \cong \Hom(-,\Omega)$, every jointly epimorphic family of morphisms $u_i : X_i \to Y$ induces an injective map
    $$\textstyle \Sub_{\reg}(Y) \to \prod_i \Sub_{\reg}(X_i), \quad M \mapsto (u_i^*(M))_i,$$
    where $u_i^*(M)$ denotes the pullback of $M$ along $u_i$.

    Now let $X$ be an object. The morphisms $(\id_X,0), (0,\id_X) : X \rightrightarrows X \times X$ are jointly strongly epimorphic, hence jointly epimorphic. The diagonal $\Delta : X \to X \times X$ is a regular monomorphism, namely the equalizer of the two projections $X \times X \rightrightarrows X$, and $0 \to X \times X$ is a regular monomorphism, namely the equalizer of $\id_{X \times X}$ and $0$. We claim that both have the same pullback $0 \to X$ along $(\id_X,0)$. Indeed, for morphisms $s,t : T \rightrightarrows X$ we have $(\id_X,0) \circ t = \Delta \circ s$ if and only if $(t,0) = (s,s)$, which means $s = t = 0$. And $(\id_X,0) \circ t = (t,0)$ factors through $0$ if and only if $t = 0$. By symmetry, both also have the pullback $0 \to X$ along $(0,\id_X)$. Hence, they represent the same regular subobject of $X \times X$, and in particular $X \cong 0$.

- id: unital_assumptions
  assumptions:
    - unital
  conclusions:
    - finitely complete
    - pointed
  proof: This holds by definition.
