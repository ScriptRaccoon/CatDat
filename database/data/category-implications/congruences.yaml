# (In particular, this will allow us to conclude that the category Set_ff of sets with finite-to-one maps
# satisfies the more general definition of co-Malcev.)
- id: regular_epi-regular_extensive_consequences
  assumptions:
    - epi-regular
    - extensive
    - equalizers
    - finitely cocomplete
  conclusions:
    - co-Malcev
    - effective cocongruences
  proof: >-
    This is a consequence of Lemma 4 <a href="/content/cocongruences_in_extensive_categories">here</a>, since every coreflexive corelation is regular and has an equalizer by the assumptions.

    Remark: The assumptions are satisfied in particular for every elementary topos. Therefore, every elementary topos has effective cocongruences and is co-Malcev. This special case is treated in <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Example 2.2.18. An alternative proof of this special case is given later in A.5.17.

- id: regular_extensive_consequences
  assumptions:
    - extensive
    - regular
    - quotients of congruences
  conclusions:
    - effective cocongruences
  proof: >-
    This is proved as Corollary 5 <a href="/content/cocongruences_in_extensive_categories">here</a>.

- id: pretopos_balanced
  assumptions:
    - effective congruences
    - extensive
  conclusions:
    - mono-regular
  proof: >-
    Let $\alpha : A \hookrightarrow B$ be a monomorphism. Let $B'$ be a copy of $B$, and likewise let $A'$ be a copy of $A$. Consider the congruence on $B + B'$ generated by $y \sim y'$ for $y \in A$. Formally, we define
    $$R \coloneqq B + B' + A + A'$$
    and define the two morphisms
    $$q_1, q_2 : R \rightrightarrows B + B'$$
    by extending the identity on $B + B'$ and 
    $$\begin{align*}
    q_1(y) & = \alpha(y), & q_1(y') & = \alpha(y)', \\
    q_2(y) & = \alpha(y)', & q_2(y') & = \alpha(y),
    \end{align*}$$
    on generalized elements. Extensivity can be used to show that $q_1, q_2$ are jointly monomorphic. Clearly, the pair $q_1, q_2$ is reflexive and symmetric. For transitivity, one once again uses extensivity. By assumption, there is a morphism $h : B + B' \to C$ such that $q_1, q_2$ is the kernel pair of $h$, that is, two generalized elements $x, y \in B + B'$ satisfy $h(x) = h(y)$ if and only if $x = q_1(e)$, $y = q_2(e)$ for some $e \in R$. In particular, for $x \in B$, we have $h(x) = h(x')$ if and only if $x = q_1(e)$, $x' = q_2(e)$ for some $e \in R$. By disjointness of coproducts, we must necessarily have $e \in A$, and $x = \alpha(e)$. This shows that $\alpha$ is the equalizer of $h \circ i_1, h \circ i_2 : B \rightrightarrows C$.
