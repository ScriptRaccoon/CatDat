# results on congruences

- id: congruence_quotients_are_reflexive_coequalizers
  assumptions:
    - reflexive coequalizers
  conclusions:
    - quotients of congruences
  proof: A congruence $R \rightrightarrows X$ has a common section $X \to R$ given by the reflexivity morphism.

- id: congruences_include_kernel_pairs
  assumptions:
    - quotients of congruences
    - kernel pairs
  conclusions:
    - coequalizers of kernel pairs
  proof: This is simply because a kernel pair is a congruence.

- id: kernel_pairs_are_effective
  assumptions:
    - effective congruences
    - coequalizers of kernel pairs
  conclusions:
    - quotients of congruences
  proof: Every congruence is a kernel pair, thus has a coequalizer.

- id: cokernels_via_congruence_quotients
  assumptions:
    - preadditive
    - quotients of congruences
    - regular
  conclusions:
    - cokernels
  proof: 'By the regularity assumption, it suffices to consider cokernels of subobjects. Given a subobject $Y$ of $X$, we have the congruence on $X$ given by the pullback of ${-} : X \times X \to X$ and $Y$. The quotient of this congruence is a cokernel of $Y \hookrightarrow X$.'

- id: core-thin_quotients
  assumptions:
    - core-thin
  conclusions:
    - effective congruences
    - quotients of congruences
  proof: 'If $q_1, q_2 : R \rightrightarrows X$ is a congruence, the symmetry morphism $s : R \to R$ is an automorphism of $R$, hence equal to $\id_R$ by assumption. But then $q_1 = q_2 \circ s = q_2$, and simply $\id_X$ is a coequalizer. Also, for the reflexivity morphism $r : X \to R$, we have $q_1 \circ r = \id$. For the reverse composition, $q_1 \circ r \circ q_1 = q_1 \circ \id$ and $q_2 \circ r \circ q_1 = q_2 \circ \id$, so since $q_1, q_2$ are jointly monomorphic, we get $r \circ q_1 = \id$. Therefore, $q_1 = q_2$ is an isomorphism, so $R$ is the kernel pair of $\id_X$.'

- id: preadditive_kernels_normal_imply_effective_congruences
  assumptions:
    - kernels
    - normal
    - preadditive
  conclusions:
    - effective congruences
  proof: >-
    Let $q_1, q_2 : R \rightrightarrows X$ be a congruence. Then let $R_0$ be the kernel of $q_2$. We see that $q_1|_{R_0} : R_0 \to X$ is a monomorphism. Let $q_1|_{R_0}$ be the kernel of a morphism $h : X \to Y$. We claim that $R$ is also the kernel pair of $h$.

    To see this, suppose we have a pair of generalized elements $x_1, x_2 \in X(T)$. Then we have
    $$\begin{align*} (x_1,x_2) \in R & \iff (x_1 - x_2,0) \in R \\ & \iff x_1 - x_2 \in R_0 \\ & \iff h(x_1 - x_2) = 0 \\ & \iff h(x_1) = h(x_2). \end{align*}$$
    In particular, applying the forward implications in the case $T \coloneqq R$, $x_1 \coloneqq q_1$, $x_2 \coloneqq q_2$, we conclude that $h \circ q_1 = h \circ q_2$, so we get the required commutative diagram. From there, the reverse implications show this diagram is a pullback square.

- id: additive_effective_congruences_imply_normal
  assumptions:
    - additive
    - effective congruences
  conclusions:
    - normal
  proof: >-
    Let $i : Y \hookrightarrow X$ be a monomorphism. Then we define a relation on $X$ via $R \coloneqq X \times Y$ with maps $q_1, q_2 : R \rightrightarrows X$ defined by $q_1 : (x, y) \mapsto x+i(y)$ and $q_2 : (x, y) \mapsto x$. It is straightforward to check that $q_1$ and $q_2$ are jointly monomorphic. Now $R$ is a congruence because for generalized elements $x_1, x_2 \in X(T)$, $(x_1, x_2)$ factors through $R$ if and only if $x_1 - x_2$ factors through $Y$. In other words, the relation on $X(T)$ is exactly $x_1 \equiv x_2 \pmod{Y(T)}$, which is an equivalence relation on $X(T)$ (and in fact a congruence in $\Ab$). Now by assumption, $R$ is the kernel pair of some morphism $h : X \to Z$; in other words, $(x_1, x_2)$ factors through $R$ if and only if $h(x_1) = h(x_2)$. In particular, for $x \in X(T)$, $x$ factors through $Y$ if and only if $(x, 0)$ factors through $R$, which is equivalent to $h(x) = h(0) = 0$. We have thus shown that $Y$ is the kernel of $h$.

