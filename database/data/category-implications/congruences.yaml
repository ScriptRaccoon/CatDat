- id: regular_epi-regular_extensive_consequences
  assumptions:
    - epi-regular
    - extensive
    - equalizers
    - finitely cocomplete
  conclusions:
    - co-Malcev
    - effective cocongruences
  proof: >-
    This is a consequence of Lemma 4 <a href="/content/cocongruences_in_extensive_categories">here</a>, since every coreflexive corelation is regular and has an equalizer by the assumptions.

    Remark: The assumptions are satisfied in particular for every elementary topos. Therefore, every elementary topos has effective cocongruences and is co-Malcev. This special case is treated in <a href="https://ncatlab.org/nlab/show/Malcev,+protomodular,+homological+and+semi-abelian+categories">Borceux–Bourn</a>, Example 2.2.18. An alternative proof of this special case is given later in A.5.17.

- id: regular_extensive_consequences
  assumptions:
    - extensive
    - regular
    - quotients of congruences
  conclusions:
