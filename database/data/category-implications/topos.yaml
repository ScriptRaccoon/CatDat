- id: topos_generator_implies_cogenerator
  assumptions:
    - elementary topos
    - generator
  conclusions:
    - cogenerator
  proof: 'For an elementary topos $\T$, the power object functor $P : \T^{\op} \to \T$ is right adjoint to $P^{\op} : \T \to \T^{\op}$ and moreover is faithful. The first statement is part of the proof that $P$ is monadic (<a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, 2.2.7) and the second is a corollary. Therefore, from Lemma 9 <a href="/content/subcategories">here</a>, if $G$ is a generator of $\T$, then $PG$ is a cogenerator.'

- id: topos_generating_collection_implies_cogenerating_collection
  assumptions:
    - elementary topos
    - generating collection
  conclusions:
    - cogenerating collection
  proof: 'For an elementary topos $\T$, the power object functor $P : \T^{\op} \to \T$ is right adjoint to $P^{\op} : \T \to \T^{\op}$ and moreover is faithful. The first statement is part of the proof that $P$ is monadic (<a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, 2.2.7) and the second is a corollary. Therefore, from Lemma 9 <a href="/content/subcategories">here</a>, if $F$ is a generating collection of $\T$, then $P_*(F)$ is a cogenerating collection.'

# ---- end of consequences of the monadicity of P ----

- id: grothendieck_topos_criterion
  assumptions:
    - coproducts
    - elementary topos
    - generating collection
    - locally essentially small
  conclusions:
    - Grothendieck topos
  proof: See <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, Appendix, Prop. 4.4.

- id: grothendieck_topos_consequence
  assumptions:
    - Grothendieck topos
  conclusions:
    - locally presentable
    - subobject classifier
    - cartesian closed
    - exact filtered colimits
  proof: A Grothendieck topos is locally presentable by <a href="https://www.cambridge.org/core/books/handbook-of-categorical-algebra/5033A02442342401E7BCC26A042DAB94">Borceux</a>, Vol. 3, Prop. 3.4.16. It is cartesian closed by <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, Prop. III.6.1 (or Borceux, Prop. 3.4.17), and it has a subobject classifier by Prop. III.7.3 in op. cit. To show that it has exact filtered colimits, first observe that this is clearly true in every presheaf topos (since $\Set$ has the property). By Theorem III.5.1 in op. cit., every Grothendieck topos is a full reflective subcategory of a presheaf topos such that the reflector preserves finite limits, so we conclude with Lemma 3 <a href="/content/subcategories">here</a>.

