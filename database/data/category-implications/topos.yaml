# results on elementary topoi and Grothendieck topoi

- id: topos_definition
  assumptions:
    - elementary topos
  conclusions:
    - cartesian closed
    - finitely complete
    - subobject classifier
  proof: This holds by definition.
  is_equivalence: true

- id: topos_consequences
  assumptions:
    - elementary topos
  conclusions:
    - disjoint finite coproducts
    - effective congruences
    - epi-regular
    - finitely cocomplete
    - locally cartesian closed
  proof: See <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, Cor. IV.5.4, Cor. IV.10.5, Thm. IV.7.8; and <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant">Johnstone</a>, Part A, Prop. 2.4.1 and Cor. 2.3.4.

- id: topos_well-copowered_criterion
  assumptions:
    - elementary topos
    - locally essentially small
  conclusions:
    - well-copowered
  proof: This follows from <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, Theorem IV.7.8 (and Prop. I.3.1).

- id: topos_implies_coregular
  assumptions:
    - quasitopos
  conclusions:
    - coregular
  proof: This is proven in <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant">Johnstone</a>, A2.6.3.

- id: grothendieck_topos_definition
  assumptions:
    - Grothendieck topos
  conclusions:
    - coproducts
    - elementary topos
    - generating collection
    - locally essentially small
  proof: See <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, Appendix, Prop. 4.4.
  is_equivalence: true

- id: grothendieck_topos_consequence
  assumptions:
    - Grothendieck topos
  conclusions:
    - cogenerator
    - exact filtered colimits
    - infinitary extensive
    - locally presentable
  proof: A Grothendieck topos is locally presentable by <a href="https://www.cambridge.org/core/books/handbook-of-categorical-algebra/5033A02442342401E7BCC26A042DAB94">Borceux</a>, Vol. 3, Prop. 3.4.16, has a cogenerator (see <a href="https://ncatlab.org/nlab/show/cogenerator">nLab</a>) and is infinitary extensive by <a href="https://ncatlab.org/nlab/show/Giraud%27s+theorem">Giraud's Theorem</a>. To show that it has exact filtered colimits, first observe that this is clearly true in every presheaf topos (since $\Set$ has the property). Every Grothendieck topos is a full reflective subcategory of a presheaf topos such that the reflector preserves finite limits (<a href="https://ncatlab.org/nlab/show/sheaf+toposes+are+equivalently+the+left+exact+reflective+subcategories+of+presheaf+toposes">nLab</a>), so we conclude with Lemma 3 <a href="/content/subcategories">here</a>.

- id: pretopos_definition
  assumptions:
    - pretopos
  conclusions:
    - Barr-exact
    - extensive
  proof: This is true by definition.
  is_equivalence: true

- id: quasitopos_definition
  assumptions:
    - quasitopos
  conclusions:
    - finitely complete
    - finitely cocomplete
    - locally cartesian closed
    - regular subobject classifier
  proof: This is true by definition.
  is_equivalence: true
