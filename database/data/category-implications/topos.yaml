# results on elementary topoi and Grothendieck topoi

- id: topos_definition
  assumptions:
    - elementary topos
  conclusions:
    - cartesian closed
    - finitely complete
    - subobject classifier
  proof: This holds by definition.
  is_equivalence: true
  check_redundancy: false

- id: topos_consequences
  assumptions:
    - elementary topos
  conclusions:
    - disjoint finite coproducts
    - effective congruences
    - finitely cocomplete
    - locally cartesian closed
  proof: See <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, Cor. IV.5.4 (finite cocompleteness), Cor. IV.10.5 (disjoint finite coproducts); and <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant">Johnstone</a>, Part A, Cor. 2.3.4 (locally cartesian closed) and Prop. 2.4.1 (effective congruences).

- id: topos_implies_coregular
  assumptions:
    - quasitopos
  conclusions:
    - coregular
  proof: This is proven in <a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant">Johnstone</a>, A2.6.3.

# ---- consequences of the monadicity of the power object functor P : T^op -> T ----

- id: topos_monadic_over_itself
  assumptions:
    - elementary topos
    - complete
  conclusions:
    - cocomplete
  proof: 'This follows from the fact that for an elementary topos $\T$, the power object functor $P : \T^{\op} \to \T$ is monadic (<a href="https://ncatlab.org/nlab/show/Sketches+of+an+Elephant" target="_blank">Johnstone</a>, 2.2.7), and therefore creates limits (i.e. it creates colimits in $\T$ from limits in $\T$).'
  check_redundancy: false

