  conclusions:
    - essentially countable
  proof: This is trivial.
  is_equivalence: false

- id: essentially_countable_consequence
  assumptions:
    - essentially countable
  conclusions:
    - essentially small
  proof: This is trivial.
  is_equivalence: false

- id: locally_small_consequence
