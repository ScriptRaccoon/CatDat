- id: pullback-stable_coproducts_monos
  assumptions:
    - pullbacks
    - pullback-stable coproducts
  conclusions:
    - coproduct-stable monomorphisms
  proof: >-
    Let $\C$ be a category with pullbacks and pullback-stable coproducts. Let $(f_i : X_i \to Y_i)_{i \in I}$ be a family of monomorphisms, and let $X \coloneqq \coprod_{i \in I} X_i$ and $Y \coloneqq \coprod_{i \in I} Y_i$ with injections $\iota_i : X_i \to X$ and $\kappa_i : Y_i \to Y$. We show that $g \coloneqq \coprod_{i \in I} f_i : X \to Y$ is a monomorphism. By definition, $g \circ \iota_i = \kappa_i \circ f_i$ for all $i \in I$.

    First, we reduce to the case that $\C$ has a terminal object. The slice category $\C' \coloneqq \C / Y$ has the terminal object $(Y, \id_Y)$. It has coproducts and pullbacks, and the forgetful functor $U : \C' \to \C$ preserves them (in fact, it creates all connected limits). Hence, coproducts are pullback-stable in $\C'$ as well. Since $U$ preserves pullbacks, it preserves monomorphisms, and since it is faithful, it reflects them. Therefore, the morphisms $f_i : (X_i, \kappa_i \circ f_i) \to (Y_i, \kappa_i)$ are monomorphisms in $\C'$, and it suffices to show that their coproduct $g : (X, g) \to (Y, \id_Y)$ in $\C'$ is a monomorphism. Replacing $\C$ by $\C'$, we may therefore assume that $\C$ has a terminal object, and hence finite products. Then $\C$ is infinitary distributive (by <a href="/category-implication/pullback-stable_coproducts_distributive">this result</a>), that is, for every object $A$ the functor $A \times - : \C \to \C$ preserves coproducts. In particular, $\C$ is distributive, so that $\C$ has monic coproduct inclusions (by <a href="/category-implication/distributive_monic_coproduct_inclusions">this result</a>). Since $\C$ has coproducts, it follows that the coproduct inclusions $\kappa_i$ are monomorphisms.

    <strong>Claim.</strong> Let $i,j \in I$ with $i \neq j$. If $x : W \to X_i$ and $y : W \to X_j$ are morphisms with $\kappa_i \circ f_i \circ x = \kappa_j \circ f_j \circ y$, then $\iota_i \circ x = \iota_j \circ y$. To prove this, let $q_i : X_i \times X_j \to X_i$ and $q_j : X_i \times X_j \to X_j$ be the projections, and $z \coloneqq \langle x,y \rangle : W \to X_i \times X_j$. By infinitary distributivity, $(X_i \times X_j) \times Y$ is the coproduct of the objects $(X_i \times X_j) \times Y_\ell$ for $\ell \in I$, with injections $\id_{X_i \times X_j} \times \kappa_\ell$. Hence, there is a morphism $s : (X_i \times X_j) \times Y \to X$ with
    $$\begin{align*}
    s \circ (\id_{X_i \times X_j} \times \kappa_j) & = \iota_j \circ q_j \circ p_1, \\
    s \circ (\id_{X_i \times X_j} \times \kappa_\ell) & = \iota_i \circ q_i \circ p_1 \quad \text{for } \ell \neq j,
    \end{align*}$$
    where $p_1$ denotes the projection $(X_i \times X_j) \times Y_\ell \to X_i \times X_j$. Since $i \neq j$, we get
    $$\begin{align*}
    \iota_i \circ x & = \iota_i \circ q_i \circ z \\
    & = \iota_i \circ q_i \circ p_1 \circ \langle z, f_i \circ x \rangle \\
    & = s \circ (\id_{X_i \times X_j} \times \kappa_i) \circ \langle z, f_i \circ x \rangle \\
    & = s \circ \langle z, \kappa_i \circ f_i \circ x \rangle \\
    & = s \circ \langle z, \kappa_j \circ f_j \circ y \rangle \\
    & = s \circ (\id_{X_i \times X_j} \times \kappa_j) \circ \langle z, f_j \circ y \rangle \\
    & = \iota_j \circ q_j \circ p_1 \circ \langle z, f_j \circ y \rangle \\
    & = \iota_j \circ q_j \circ z \\
    & = \iota_j \circ y.
    \end{align*}$$
    This proves the claim.

    Now let $a,b : Z \rightrightarrows X$ be morphisms with $g \circ a = g \circ b$. We want to prove $a = b$. Applying infinitary distributivity twice, we see that $X \times X$ is the coproduct of the objects $X_i \times X_j$ for $i,j \in I$, with injections $\iota_i \times \iota_j$. Let $e_{ij} : Z_{ij} \to Z$ be a pullback of $\iota_i \times \iota_j$ along $\langle a,b \rangle : Z \to X \times X$. Since coproducts are pullback-stable, the morphism $\coprod_{i,j \in I} Z_{ij} \to Z$ induced by the $e_{ij}$ is an isomorphism, so that the morphisms $e_{ij}$ are jointly epimorphic. By construction, there are morphisms $a_{ij} : Z_{ij} \to X_i$ and $b_{ij} : Z_{ij} \to X_j$ with $\langle a,b \rangle \circ e_{ij} = (\iota_i \times \iota_j) \circ \langle a_{ij}, b_{ij} \rangle$, that is,
    $$\begin{align*}
    a \circ e_{ij} & = \iota_i \circ a_{ij}, \\
    b \circ e_{ij} & = \iota_j \circ b_{ij}.
    \end{align*}$$
    It suffices to show $a \circ e_{ij} = b \circ e_{ij}$, that is, $\iota_i \circ a_{ij} = \iota_j \circ b_{ij}$, for all $i,j \in I$. We have
    $$\begin{align*}
    \kappa_i \circ f_i \circ a_{ij} & = g \circ \iota_i \circ a_{ij} \\
    & = g \circ a \circ e_{ij} \\
    & = g \circ b \circ e_{ij} \\
    & = g \circ \iota_j \circ b_{ij} \\
    & = \kappa_j \circ f_j \circ b_{ij}.
    \end{align*}$$
    <ol>
    <li>If $i = j$, then $a_{ii} = b_{ii}$, since $\kappa_i$ and $f_i$ are monomorphisms. Hence, $\iota_i \circ a_{ii} = \iota_i \circ b_{ii}$.</li>
    <li>If $i \neq j$, then the claim gives $\iota_i \circ a_{ij} = \iota_j \circ b_{ij}$.</li>
    </ol>

