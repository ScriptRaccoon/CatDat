- id: pullback-stable_binary_coproducts_strict
  assumptions:
    - pullback-stable binary coproducts
    - initial object
  conclusions:
    - strict initial object
  proof: >-
    Let $f : T \to 0$ be a morphism. The object $0$, together with the inclusions $\id_0, \id_0$, is a coproduct $0 + 0$. We apply the definition of pullback-stable binary coproducts to the morphism $f : T \to 0 + 0$. The pullback of each inclusion $\id_0$ along $f$ is $T$ with the projection $\id_T$. So the canonical morphism from the coproduct of these pullbacks to $T$ is the codiagonal $\nabla : T + T \to T$, which is therefore an isomorphism. Both coproduct inclusions $i_1, i_2 : T \rightrightarrows T + T$ are sections of $\nabla$, hence equal to $\nabla^{-1}$. For morphisms $g,h : T \rightrightarrows Y$, the induced morphism $(g;h) : T + T \to Y$ satisfies
    $$g = (g;h) \circ i_1 = (g;h) \circ i_2 = h.$$
    Since there is a morphism $T \to 0 \to Y$, it follows that $T$ is initial.

    This is <a href="https://doi.org/10.1016/0022-4049(93)90035-R">Carboni–Lack–Walters</a>, Lemma 2.12, whose proof refers to the proof of their Prop. 2.8.

- id: pullback-stable_binary_coproducts_strict_terminal
  assumptions:
    - pullback-stable binary coproducts
    - strict terminal object
  conclusions:
    - binary products
    - thin
  proof: >-
    Let $1$ be a strict terminal object, and let $A$ be an object. Since $1$ is strict, the coproduct inclusion $1 \to 1 + A$ is an isomorphism. Hence, $1$, together with the morphisms $\id_1$ and $A \to 1$, is a coproduct $1 + A$.

    Let $T$ be an object. Applying the definition of pullback-stable binary coproducts to the unique morphism $T \to 1 = 1 + A$, we see that the pullback of the coproduct inclusion $A \to 1$ along it exists. Since $1$ is terminal, this pullback is a product $T \times A$.

    For $A = 1$, the object $1$, together with the inclusions $\id_1, \id_1$, is a coproduct $1 + 1$. The pullback of each inclusion $\id_1$ along $T \to 1$ is $T$ with the projection $\id_T$. So the canonical morphism from the coproduct of these pullbacks to $T$ is the codiagonal $\nabla : T + T \to T$, which is therefore an isomorphism. As in the proof of <a href="/category-implication/codiagonal-iso">this result</a>, it follows that $\C$ is thin.

- id: pullback-stable_finite_coproducts_binary
  assumptions:
    - pullback-stable finite coproducts
  conclusions:
    - pullback-stable binary coproducts
    - strict initial object
  proof: >-
    If $\C$ has pullback-stable finite coproducts, then the condition for families of two objects states that binary coproducts are pullback-stable, and the condition for the empty family states that for every morphism $T \to 0$ the unique morphism $0 \to T$ is an isomorphism, i.e. that the initial object is strict.

    Conversely, assume that $\C$ has pullback-stable binary coproducts and a strict initial object. Then $\C$ has finite coproducts. We show the condition for a family of objects $(A_i)_{i \in I}$ by induction on $n \coloneqq \card(I)$. For $n = 0$, it is strictness, as we have just seen. For $n = 1$, it is trivial. For $n \geq 2$, choose $j \in I$, let $B \coloneqq \coprod_{i \neq j} A_i$, and let $A \coloneqq A_j + B$, which is a coproduct of the $A_i$. Let $T \to A$ be a morphism. Since binary coproducts are pullback-stable, the pullbacks $T_j \coloneqq T \times_A A_j$ and $T_B \coloneqq T \times_A B$ exist and the canonical morphism $T_j + T_B \to T$ is an isomorphism. By the induction hypothesis, applied to the family $(A_i)_{i \neq j}$ and the morphism $T_B \to B$, the pullbacks $T_B \times_B A_i$ for $i \neq j$ exist and the canonical morphism $\coprod_{i \neq j} T_B \times_B A_i \to T_B$ is an isomorphism. By the pasting law, $T_B \times_B A_i$ is the pullback $T_i \coloneqq T \times_A A_i$. The canonical morphism $\coprod_{i \in I} T_i \to T$ is the composite
    $$\textstyle \coprod_{i \in I} T_i \cong T_j + \coprod_{i \neq j} T_i \to T_j + T_B \to T$$
    of canonical morphisms. By the above, each of them is an isomorphism, hence so is their composite.
  is_equivalence: true

- id: lcc_pullback-stable_coproducts
  assumptions:
    - coproducts
    - locally cartesian closed
  conclusions:
    - pullback-stable coproducts
  proof: >-
    Let $(A_i)_{i \in I}$ be a family of objects with coproduct $A$, and let $f : T \to A$ be a morphism. Since coproducts in $\C/A$ are computed as in $\C$, the object $(A,\id_A)$ is the coproduct of the objects $A_i \to A$ given by the coproduct inclusions. The pullback functor $f^* : \C/A \to \C/T$ has a right adjoint, hence preserves coproducts. It maps $(A,\id_A)$ to $(T,\id_T)$, and the objects $A_i \to A$ to the pullbacks $T_i \coloneqq T \times_A A_i$. Therefore, the canonical morphism $\coprod_{i \in I} T_i \to T$ is an isomorphism.

