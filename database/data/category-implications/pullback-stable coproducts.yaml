- id: pullback-stable_finite_coproducts_monic_inclusions
  assumptions:
    - pullbacks
    - pullback-stable finite coproducts
  conclusions:
    - monic coproduct inclusions
  proof: >-
    Let $A,B$ be objects with coproduct inclusions $\iota_A : A \to A + B$ and $\iota_B : B \to A + B$. The slice category $\C' \coloneqq \C / (A + B)$ has the terminal object $(A + B, \id_{A + B})$. It has finite coproducts and pullbacks, and the forgetful functor $U : \C' \to \C$ preserves them (in fact, it creates all colimits and connected limits). Hence, finite coproducts are pullback-stable in $\C'$ as well, and $\C'$ has finite products. Then $\C'$ is distributive (by <a href="/category-implication/pullback-stable_finite_coproducts_distributive">this result</a>), hence has monic coproduct inclusions (by <a href="/category-implication/distributive_monic_coproduct_inclusions">this result</a>). Since $(A + B, \id_{A + B})$ is a coproduct of $(A, \iota_A)$ and $(B, \iota_B)$ in $\C'$, it follows that $\iota_A : (A, \iota_A) \to (A + B, \id_{A + B})$ is a monomorphism in $\C'$. Since $U$ preserves pullbacks, it preserves monomorphisms, so that $\iota_A$ is a monomorphism in $\C$.

- id: monic_inclusions_coproduct-stable_monos
  assumptions:
    - monic coproduct inclusions
    - pullback-stable coproducts
  conclusions:
    - coproduct-stable monomorphisms
  proof: >-
    Let $(f_i : X_i \to Y_i)_{i \in I}$ be a family of monomorphisms, and let $X \coloneqq \coprod_{i \in I} X_i$ and $Y \coloneqq \coprod_{i \in I} Y_i$ with inclusions $\iota_i : X_i \to X$ and $\kappa_i : Y_i \to Y$. We show that $f \coloneqq \coprod_{i \in I} f_i : X \to Y$ is a monomorphism. By definition, $f \circ \iota_i = \kappa_i \circ f_i$ for all $i \in I$. Since $\C$ has monic coproduct inclusions and coproducts, the inclusions $\kappa_i$ are monomorphisms.

    Let $a,b : T \rightrightarrows X$ be morphisms with $f \circ a = f \circ b$. We want to prove $a = b$. Since coproducts are pullback-stable, pulling back $a$ along the inclusions $\iota_i$ shows that $T$ is a coproduct of objects $T_i$ such that $a$ maps $T_i$ to $X_i$. Pulling back $b|_{T_i}$ along the inclusions $\iota_j$ shows that $T_i$ is a coproduct of objects $T_{ij}$ such that $b$ maps $T_{ij}$ to $X_j$. Hence, $T$ is a coproduct of the objects $T_{ij}$ for $i,j \in I$, with inclusions $e_{ij} : T_{ij} \to T$, and there are morphisms $a_{ij} : T_{ij} \to X_i$ and $b_{ij} : T_{ij} \to X_j$ with
    $$\begin{align*}
    a \circ e_{ij} & = \iota_i \circ a_{ij}, \\
    b \circ e_{ij} & = \iota_j \circ b_{ij}.
    \end{align*}$$
    It suffices to show $a \circ e_{ij} = b \circ e_{ij}$, that is, $\iota_i \circ a_{ij} = \iota_j \circ b_{ij}$, for all $i,j \in I$. We have
    $$\begin{align*}
    \kappa_i \circ f_i \circ a_{ij} & = f \circ \iota_i \circ a_{ij} \\
    & = f \circ a \circ e_{ij} \\
    & = f \circ b \circ e_{ij} \\
    & = f \circ \iota_j \circ b_{ij} \\
    & = \kappa_j \circ f_j \circ b_{ij}.
    \end{align*}$$

    If $i = j$, then $a_{ii} = b_{ii}$, since $\kappa_i$ and $f_i$ are monomorphisms. Hence, $\iota_i \circ a_{ii} = \iota_i \circ b_{ii}$.

    If $i \neq j$, let $w : T_{ij} \to Y$ be the morphism $\kappa_i \circ f_i \circ a_{ij} = \kappa_j \circ f_j \circ b_{ij}$. For $m \in I$, let $\pi_m : P_m \to T_{ij}$ be a pullback of $\kappa_m$ along $w$. Since $\kappa_i$ is a monomorphism and $w$ factors through $\kappa_i$, we may choose $P_i \coloneqq T_{ij}$ and $\pi_i \coloneqq \id_{T_{ij}}$, and likewise $P_j \coloneqq T_{ij}$ and $\pi_j \coloneqq \id_{T_{ij}}$. Let $P \coloneqq \coprod_{m \in I} P_m$ with inclusions $\sigma_m : P_m \to P$. Since coproducts are pullback-stable, the morphism $\varphi : P \to T_{ij}$ with $\varphi \circ \sigma_m = \pi_m$ for all $m \in I$ is an isomorphism. From $\varphi \circ \sigma_i = \id_{T_{ij}} = \varphi \circ \sigma_j$ we get $\sigma_i = \varphi^{-1} = \sigma_j$. Let $h : P \to X$ be the morphism with $h \circ \sigma_j = \iota_j \circ b_{ij}$ and $h \circ \sigma_m = \iota_i \circ a_{ij} \circ \pi_m$ for $m \neq j$. Then
    $$\iota_i \circ a_{ij} = h \circ \sigma_i = h \circ \sigma_j = \iota_j \circ b_{ij}.$$

