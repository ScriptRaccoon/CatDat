- id: pullback-stable_coproducts_distributive
  assumptions:
    - pullback-stable coproducts
    - finite products
  conclusions:
    - infinitary distributive
  proof: >-
    Let $A$ be an object, let $(B_i)_{i \in I}$ be a family of objects with coproduct $B$ and inclusions $\iota_i : B_i \to B$, and let $p : A \times B \to B$ be the projection. The pullback of $p$ along $\iota_i$ is $A \times B_i$ with the morphism $\id_A \times \iota_i : A \times B_i \to A \times B$. Since coproducts are pullback-stable, the canonical morphism $\coprod_{i \in I} (A \times B_i) \to A \times B$ is an isomorphism.

