# results on subobject-trivial categories and related notions

- id: well_powered_trivial_criterion
  assumptions:
    - subobject-trivial
  conclusions:
    - well-powered
  proof: This is trivial.

- id: thin_regular-subobject-trivial
  assumptions:
    - equalizers
    - regular-subobject-trivial
  conclusions:
    - thin
  proof: 'If $f,g : X \rightrightarrows Y$ are morphisms, their equalizer is a regular monomorphism $E \hookrightarrow X$, hence an isomorphism. But this means $f = g$.'

- id: subobject-trivial_characterization
  assumptions:
    - subobject-trivial
  conclusions:
    - mono-regular
    - regular-subobject-trivial
  proof: This is trivial.
  is_equivalence: true

- id: subobject-trivial_groupoids
  assumptions:
    - groupoid
  conclusions:
    - subobject-trivial
  proof: This is trivial.

- id: subobject-trivial_criterion
  assumptions:
    - epi-regular
    - right cancellative
  conclusions:
    - subobject-trivial
  proof: This is because a monomorphism which is also a regular epimorphism is an isomorphism.

- id: regular-subobject-trivial_criterion
  assumptions:
    - right cancellative
  conclusions:
    - regular-subobject-trivial
  proof: This follows from the fact that every epimorphism that is also a regular monomorphism is an isomorphism.

- id: regular_subobject_classifier_disallows_malcev
  assumptions:
    - Malcev
    - regular subobject classifier
  conclusions:
    - regular-subobject-trivial
  proof: 'The regular subobject classifier $\Omega$ is an internal poset (cf. <a href="https://ncatlab.org/nlab/show/Sheaves+in+Geometry+and+Logic">Mac Lane–Moerdijk</a>, IV.8). Concretely, since the category is Malcev, it has binary products, so the intersection of regular subobjects is again a regular subobject. Namely, the intersection of the equalizer of $f_1, g_1 : X \rightrightarrows Y_1$ with the equalizer of $f_2, g_2 : X \rightrightarrows Y_2$ is the equalizer of $(f_1, f_2), (g_1, g_2) : X \rightrightarrows Y_1 \times Y_2$. This intersection operation on regular subobjects yields a morphism $\wedge : \Omega \times \Omega \to \Omega$, and the internal relation ${\leq_{\Omega}} \subseteq \Omega \times \Omega$ is defined as the equalizer of $\wedge, p_1 : \Omega \times \Omega \rightrightarrows \Omega$. The relation ${\leq_{\Omega}}$ is reflexive, hence symmetric by assumption. Since it is also antisymmetric and has a largest element $\top$, every regular monomorphism must be an isomorphism. (From here, we can infer that the category is thin – or, if the category has a subobject classifier, that the category is trivial.)'

- id: disjoint_finite_coproducts_disallows_regular-subobject-trivial
  assumptions:
    - disjoint finite coproducts
    - regular-subobject-trivial
  conclusions:
    - trivial
  proof: 'For any object $X$, the unique morphism $! : 0 \to X$ is a regular monomorphism, as the equalizer of the two coprojections $X \rightrightarrows X \sqcup X$. Therefore, it is an isomorphism.'

- id: isos_are_stable
  assumptions:
    - regular-quotient-trivial
    - pullbacks
  conclusions:
    - pullback-stable regular epimorphisms
  proof: Regular epimorphisms are isomorphisms by assumption, and isomorphisms are clearly stable under pullback.

- id: regular-object-trivial_implies_retract_trivial
  assumptions:
    - regular-subobject-trivial
  conclusions:
    - retract-trivial
  proof: This follows from the fact that every split monomorphism is a regular monomorphism.

- id: retract_trivial_coreflexive_equalizers
  assumptions:
    - retract-trivial
  conclusions:
    - reflexive coequalizers
  proof: 'Let $f,g : X \rightrightarrows Y$ be a reflexive pair, i.e. there is a morphism $r : Y \to X$ with $f r = g r = \id_Y$. Since $r$ is a split monomorphism, $r$ must be an isomorphism. Thus, $f = g = r^{-1}$, and $\id_Y$ is a coequalizer of $f,g$.'

- id: retract-trivial_trivial_congruences
  assumptions:
    - retract-trivial
  conclusions:
    - effective congruences
  proof: 'Let $q_1,q_2 : R \rightrightarrows X$ be a congruence. In particular, there is a morphism $r : X \to R$ with $q_1 r = q_2 r = \id_X$. Since $r$ is a split monomorphism, $r$ must be an isomorphism. Thus, $q_1 = q_2 = r^{-1}$, and $q_1,q_2$ is a kernel pair of $\id_X$.'

- id: retract-trivial_monoids
  assumptions:
    - core-connected
    - locally finite
  conclusions:
    - retract-trivial
  proof: A core-connected locally finite category is equivalent to $BM$ for a finite monoid $M$. A finite monoid $M$ satisfies the property $xy=1 \implies yx=1$. In fact, when $xy=1$ holds, the map $m \mapsto xm$ is surjective, hence injective. Thus, $x(yx)=x=x(1)$ implies $yx=1$.

- id: one-way_implies_retract-trivial
  assumptions:
    - one-way
  conclusions:
    - retract-trivial
  proof: This is trivial.

- id: codiagonal-iso
  assumptions:
    - retract-trivial
    - binary copowers
  conclusions:
    - thin
  proof: 'For every object $A$ the codiagonal $A + A \to A$ is a split epimorphism, hence an isomorphism. Hence, the two inclusions $i_1,i_2 : A \rightrightarrows A + A$ coincide. Now, if $f, g : A \rightrightarrows B$ are two morphisms, consider the induced morphism $h : A + A \to B$ and compute $f = h \circ i_1 = h \circ i_2 = g$.'
